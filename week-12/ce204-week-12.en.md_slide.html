<h2 id="module-a-what-is-refactoring----definition">Module A: What is Refactoring? -- Definition</h2>
<p><strong>Refactoring</strong> is a systematic process of improving the internal structure of code <strong>without changing its external behavior</strong>.</p>
<ul>
<li>The main purpose of refactoring is to <strong>fight technical debt</strong></li>
<li>It transforms messy, poorly designed code into clean, well-designed code</li>
<li>Refactoring is <strong>not</strong> about fixing bugs or adding new features</li>
<li>It is about making code easier to understand, maintain, and extend</li>
<li>Think of it as applying a series of <strong>small behavior-preserving transformations</strong></li>
</ul>
<blockquote>
<p>&quot;Refactoring is a controlled technique for improving the design of an existing code base. Its essence is applying a series of small behavior-preserving transformations, each of which is too small to be worth doing. However the cumulative effect of each of these transformations is quite significant.&quot;<br />
-- Martin Fowler</p>
</blockquote>
<p>Reference: <a href="https://refactoring.guru/refactoring/what-is-refactoring">RefactoringGuru -- What is Refactoring</a></p>

<h2 id="module-a-dirty-code-vs-clean-code">Module A: Dirty Code vs. Clean Code</h2>
<h3 id="what-is-dirty-code">What is Dirty Code?</h3>
<p>Dirty code is code that is hard to read, hard to change, and hard to maintain. It accumulates over time due to shortcuts, rushed deadlines, and lack of discipline.</p>
<h3 id="what-is-clean-code">What is Clean Code?</h3>
<p>Clean code is the opposite -- it is obvious, maintainable, and a pleasure to work with.</p>
<blockquote>
<p>&quot;The main purpose of refactoring is to fight technical debt. It transforms a mess into clean code and simple design.&quot;</p>
</blockquote>
<h3 id="the-relationship">The Relationship</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Dirty Code  --[refactoring]--&gt;  Clean Code
     |                              |
     v                              v
  Hard to maintain            Easy to maintain
  Expensive to change         Cheap to change
  Full of hidden bugs         Bugs are visible
</code></pre>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-12</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-a-clean-code-characteristics">Module A: Clean Code Characteristics</h2>
<p>Clean code has <strong>four key characteristics</strong> that distinguish it from dirty code:</p>
<h3 id="1-clean-code-is-obvious-for-other-programmers">1. Clean Code is Obvious for Other Programmers</h3>
<ul>
<li>Poor variable names, bloated classes, and magic numbers make code sloppy and difficult to grasp</li>
<li>Good code reads almost like well-written prose</li>
<li>Other developers can understand it without extensive documentation</li>
</ul>
<h3 id="2-clean-code-does-not-contain-duplication">2. Clean Code Does Not Contain Duplication</h3>
<ul>
<li>Each time you make a change in duplicated code, you must remember to make the same change in every instance</li>
<li>Increases cognitive load and slows down progress</li>
<li>Violates the DRY (Don't Repeat Yourself) principle</li>
</ul>
<blockquote>
<p>&quot;Each time you have to make a change in a duplicate code, you have to remember to make the same change to every instance.&quot; -- RefactoringGuru</p>
</blockquote>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-a-clean-code-characteristics-continued">Module A: Clean Code Characteristics (Continued)</h2>
<h3 id="3-clean-code-contains-a-minimal-number-of-classes-and-moving-parts">3. Clean Code Contains a Minimal Number of Classes and Moving Parts</h3>
<ul>
<li>&quot;Less code is less stuff to keep in your head&quot;</li>
<li>&quot;Less code is less maintenance&quot;</li>
<li>Less code means fewer bugs</li>
<li>Code is a <strong>liability</strong>, not an asset -- minimize it</li>
</ul>
<h3 id="4-clean-code-passes-all-tests">4. Clean Code Passes All Tests</h3>
<ul>
<li>Code that passes zero percent of tests is dirty code</li>
<li>Code that is 95% clean but does not pass tests is still not clean enough</li>
<li>Tests serve as a safety net for refactoring</li>
</ul>
<h3 id="the-bottom-line">The Bottom Line</h3>
<blockquote>
<p><strong>&quot;Clean code is easier and cheaper to maintain!&quot;</strong></p>
</blockquote>
<ul>
<li>The majority of a software project's lifecycle is spent on maintenance</li>
<li>Clean code reduces the cost of ongoing development</li>
<li>New team members can ramp up faster</li>
</ul>
<p>Reference: <a href="https://refactoring.guru/refactoring/clean-code">RefactoringGuru -- Clean Code</a></p>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-a-technical-debt----the-metaphor">Module A: Technical Debt -- The Metaphor</h2>
<h3 id="what-is-technical-debt">What is Technical Debt?</h3>
<p>Technical debt is a metaphor coined by <strong>Ward Cunningham</strong>. It compares quick-and-dirty coding decisions to financial debt:</p>
<ul>
<li><strong>Taking on debt:</strong> You ship faster now by writing quick, dirty code</li>
<li><strong>Interest payments:</strong> Every time you work with dirty code, you spend extra time understanding and modifying it</li>
<li><strong>Bankruptcy:</strong> Eventually, the codebase becomes so messy that further development is nearly impossible</li>
</ul>
<blockquote>
<p>&quot;You can temporarily speed up without writing tests for new features, but this will gradually slow your progress every day until you eventually pay off the debt by writing tests.&quot; -- RefactoringGuru</p>
</blockquote>
<h3 id="the-debt-spiral">The Debt Spiral</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Fast &amp; Dirty Code  --&gt;  Technical Debt Accumulates
       |                         |
       v                         v
  Ship Faster Now        Development Slows Down
       |                         |
       v                         v
  More Shortcuts         More Bugs, More Complexity
       |                         |
       v                         v
  Even More Debt    --&gt;  Project May Become Unmaintainable
</code></pre>
<p>Reference: <a href="https://refactoring.guru/refactoring/technical-debt">RefactoringGuru -- Technical Debt</a></p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-12</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-a-causes-of-technical-debt">Module A: Causes of Technical Debt</h2>
<table>
<thead>
<tr>
<th>#</th>
<th>Cause</th>
<th>Description</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td><strong>Business pressure</strong></td>
<td>Rushing feature releases forces temporary patches into production code</td>
</tr>
<tr>
<td>2</td>
<td><strong>Lack of understanding of consequences</strong></td>
<td>Management may not recognize how debt compounds over time</td>
</tr>
<tr>
<td>3</td>
<td><strong>Failing to combat strict coherence of components</strong></td>
<td>Monolithic architectures create tight coupling, making isolated changes impossible</td>
</tr>
<tr>
<td>4</td>
<td><strong>Lack of tests</strong></td>
<td>Missing test coverage encourages risky workarounds that reach production untested</td>
</tr>
<tr>
<td>5</td>
<td><strong>Lack of documentation</strong></td>
<td>New team members struggle to onboard, departing experts create knowledge gaps</td>
</tr>
<tr>
<td>6</td>
<td><strong>Lack of interaction between team members</strong></td>
<td>Distributed knowledge leads to outdated understanding</td>
</tr>
<tr>
<td>7</td>
<td><strong>Long-term simultaneous development in branches</strong></td>
<td>Isolated branch work accumulates debt that compounds during merging</td>
</tr>
<tr>
<td>8</td>
<td><strong>Delayed refactoring</strong></td>
<td>Postponing architectural updates creates widespread dependent code requiring future rework</td>
</tr>
<tr>
<td>9</td>
<td><strong>Lack of compliance monitoring</strong></td>
<td>Inconsistent standards and insufficient developer skill both contribute to debt accumulation</td>
</tr>
</tbody>
</table>
<h3 id="key-insight">Key Insight</h3>
<ul>
<li>Everyone incurs technical debt from time to time</li>
<li>The key is not to let it get out of hand</li>
<li><strong>Refactoring is the primary method of paying down technical debt</strong></li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-a-when-to-refactor----the-rule-of-three">Module A: When to Refactor -- The Rule of Three</h2>
<p>The <strong>Rule of Three</strong> is a simple heuristic for deciding when to refactor:</p>
<h3 id="1-first-time----just-do-it">1. First Time -- Just Do It</h3>
<ul>
<li>When you are doing something for the first time, just get it done</li>
<li>Even if the code is not perfect, move forward</li>
</ul>
<h3 id="2-second-time----wince-at-the-duplication">2. Second Time -- Wince at the Duplication</h3>
<ul>
<li>When you do something similar for the second time, cringe at having to repeat yourself</li>
<li>But do it anyway (for now)</li>
</ul>
<h3 id="3-third-time----refactor">3. Third Time -- Refactor</h3>
<ul>
<li>When you do something for the <strong>third time</strong>, it is time to refactor</li>
<li>Three strikes and you refactor!</li>
</ul>
<blockquote>
<p>&quot;When you're doing something for the first time, just do it. The second time, you wince at the duplication but do it anyway. The third time, you refactor.&quot; -- RefactoringGuru</p>
</blockquote>
<p>Reference: <a href="https://refactoring.guru/refactoring/when">RefactoringGuru -- When to Refactor</a></p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-12</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-a-when-to-refactor----specific-situations">Module A: When to Refactor -- Specific Situations</h2>
<h3 id="when-adding-a-feature">When Adding a Feature</h3>
<p>Refactoring helps when adding features in two ways:</p>
<ol>
<li><strong>Understanding Other People's Code</strong> -- Refactoring the code to make it clearer helps you understand what is going on. &quot;It's much easier to make changes in clean code.&quot;</li>
<li><strong>Facilitating the Addition</strong> -- Sometimes the existing code structure makes it very difficult to add a new feature. Refactoring first can make the new feature much easier to implement.</li>
</ol>
<h3 id="when-fixing-a-bug">When Fixing a Bug</h3>
<ul>
<li>&quot;Bugs in code behave just like those in real life: they live in the darkest, dirtiest places in the code.&quot;</li>
<li>By cleaning problematic code first, errors become easier to identify and resolve</li>
<li>Managers understand that bugs need fixing, so you can often bundle refactoring with bug fixes</li>
</ul>
<h3 id="during-code-review">During Code Review</h3>
<ul>
<li>Code review is the <strong>last chance</strong> to tidy up code before it becomes available to the public</li>
<li>Best performed in a pair: the reviewer proposes changes and the author implements them immediately</li>
<li>Start with simple refactorings, tackle complex ones as follow-up tasks</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-12</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-a-how-to-refactor----the-core-principle">Module A: How to Refactor -- The Core Principle</h2>
<blockquote>
<p>&quot;Refactoring should be done as a series of small changes, each of which makes the existing code slightly better while still leaving the program in working order.&quot; -- RefactoringGuru</p>
</blockquote>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Working Code --&gt; Small Change --&gt; Still Working Code
     |                                   |
     v                                   v
  Test Pass                          Test Pass
     |                                   |
     v                                   v
Small Change --&gt; Still Working Code --&gt; Small Change ...
</code></pre>
<ul>
<li>Each individual refactoring is so small it is very unlikely to go wrong</li>
<li>The system remains fully functional after each small step</li>
<li>If something breaks, you know exactly which small change caused it</li>
</ul>
<p>Reference: <a href="https://refactoring.guru/refactoring/how-to">RefactoringGuru -- How to Refactor</a></p>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-a-the-refactoring-checklist">Module A: The Refactoring Checklist</h2>
<p>Before, during, and after refactoring, verify these three conditions:</p>
<h3 id="1-the-code-should-become-cleaner">1. The Code Should Become Cleaner</h3>
<ul>
<li>If the code remains just as unclean after refactoring, you are wasting time</li>
<li>Sometimes this happens when you mix multiple refactorings into one large change</li>
<li>For severely problematic code, consider complete rewrites -- but only after writing tests and allocating sufficient time</li>
</ul>
<h3 id="2-new-functionality-should-not-be-created-during-refactoring">2. New Functionality Should Not Be Created During Refactoring</h3>
<ul>
<li>&quot;Don't mix refactoring and direct development of new features&quot;</li>
<li>Keep refactoring and new features as <strong>separate commits</strong> for clarity and traceability</li>
</ul>
<h3 id="3-all-existing-tests-must-pass">3. All Existing Tests Must Pass</h3>
<ul>
<li>After refactoring, all existing tests should still pass</li>
<li><strong>Scenario 1:</strong> You made an error during refactoring -- fix the small error</li>
<li><strong>Scenario 2:</strong> The tests were too low-level (testing private methods rather than behavior) -- refactor the tests themselves or write higher-level BDD-style tests</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-12</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-a-safe-refactoring-workflow">Module A: Safe Refactoring Workflow</h2>
<h3 id="step-by-step-process">Step-by-Step Process</h3>
<ol>
<li><strong>Ensure you have a comprehensive test suite</strong> for the code you want to refactor</li>
<li><strong>Make one small change</strong> at a time</li>
<li><strong>Run all tests</strong> after each change</li>
<li><strong>If tests pass</strong>, move on to the next change</li>
<li><strong>If tests fail</strong>, undo the change immediately and try a different approach</li>
<li><strong>Commit frequently</strong> so you can easily revert if something goes wrong</li>
<li><strong>Review the final result</strong> -- is the code cleaner?</li>
</ol>
<h3 id="tools-that-help">Tools That Help</h3>
<table>
<thead>
<tr>
<th>Tool</th>
<th>Purpose</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Version control (Git)</strong></td>
<td>Easy rollback of bad changes</td>
</tr>
<tr>
<td><strong>Automated tests</strong></td>
<td>Verify behavior after each change</td>
</tr>
<tr>
<td><strong>IDE refactoring tools</strong></td>
<td>Automated rename, extract method, etc.</td>
</tr>
<tr>
<td><strong>Continuous Integration</strong></td>
<td>Catches regressions early</td>
</tr>
</tbody>
</table>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-a-takeaway">Module A: Takeaway</h2>
<h3 id="key-points----what-is-refactoring">Key Points -- What is Refactoring?</h3>
<ul>
<li><strong>Refactoring</strong> = improving code structure without changing external behavior</li>
<li><strong>Clean code</strong> is obvious, duplication-free, minimal, tested, and maintainable</li>
<li><strong>Dirty code</strong> creates <strong>technical debt</strong> that slows future development</li>
<li>Technical debt comes from business pressure, lack of tests, poor documentation, tightly coupled components, and more</li>
<li>Use the <strong>Rule of Three</strong>: first time do it, second time cringe, third time refactor</li>
<li>Refactor when adding features, fixing bugs, and during code reviews</li>
<li>Make <strong>small, incremental changes</strong> and keep all tests passing</li>
<li>Never mix refactoring and feature development in the same commit</li>
</ul>
<blockquote>
<p>&quot;Any fool can write code that a computer can understand. Good programmers write code that humans can understand.&quot; -- Martin Fowler</p>
</blockquote>

<header>CEN206 Object-Oriented Programming</header>

<h2 id="module-b-bloaters----overview">Module B: Bloaters -- Overview</h2>
<p><strong>Bloaters</strong> are code, methods, and classes that have increased to such gargantuan proportions that they become hard to work with. Usually these smells do not crop up right away; rather, they accumulate over time as the program evolves (and especially when nobody makes an effort to eradicate them).</p>
<h3 id="the-5-bloater-smells">The 5 Bloater Smells</h3>
<table>
<thead>
<tr>
<th>#</th>
<th>Smell</th>
<th>Key Issue</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td><strong>Long Method</strong></td>
<td>Method contains too many lines of code</td>
</tr>
<tr>
<td>2</td>
<td><strong>Large Class</strong></td>
<td>Class contains too many fields/methods/lines</td>
</tr>
<tr>
<td>3</td>
<td><strong>Primitive Obsession</strong></td>
<td>Overuse of primitives instead of small objects</td>
</tr>
<tr>
<td>4</td>
<td><strong>Long Parameter List</strong></td>
<td>More than three or four parameters in a method</td>
</tr>
<tr>
<td>5</td>
<td><strong>Data Clumps</strong></td>
<td>Groups of data that always appear together</td>
</tr>
</tbody>
</table>
<p>Reference: <a href="https://refactoring.guru/refactoring/smells/bloaters">RefactoringGuru -- Bloaters</a></p>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-b-bloater-1----long-method">Module B: Bloater #1 -- Long Method</h2>
<h3 id="what-is-it">What Is It?</h3>
<p>A method contains <strong>too many lines of code</strong>. Generally, any method longer than <strong>ten lines</strong> should make you start asking questions.</p>
<h3 id="signs-and-symptoms">Signs and Symptoms</h3>
<ul>
<li>The method has grown beyond 10-20 lines</li>
<li>You need comments to explain what different sections of the method do</li>
<li>The method name does not fully describe everything the method does</li>
<li>There are deeply nested control structures</li>
</ul>
<h3 id="reasons-for-the-problem">Reasons for the Problem</h3>
<ul>
<li>It is mentally easier to <strong>add</strong> to an existing method than to create a new one</li>
<li>&quot;I'll just add these two lines here...&quot; -- and it keeps growing</li>
<li>Since it is harder to create a method than to add to one, most code is written as additions to existing methods</li>
<li>The method originally started small but grew over time</li>
</ul>
<p>Reference: <a href="https://refactoring.guru/smells/long-method">RefactoringGuru -- Long Method</a></p>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-b-bloater-1----long-method-treatment--payoff">Module B: Bloater #1 -- Long Method (Treatment &amp; Payoff)</h2>
<h3 id="treatment-refactoring-techniques">Treatment (Refactoring Techniques)</h3>
<table>
<thead>
<tr>
<th>Technique</th>
<th>When to Use</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Extract Method</strong></td>
<td>Take a fragment of code and turn it into its own method with a descriptive name</td>
</tr>
<tr>
<td><strong>Replace Temp with Query</strong></td>
<td>Move an expression into a new method and return the result instead of storing it in a local variable</td>
</tr>
<tr>
<td><strong>Introduce Parameter Object</strong></td>
<td>Replace repeating groups of parameters with an object</td>
</tr>
<tr>
<td><strong>Preserve Whole Object</strong></td>
<td>Pass the whole object instead of individual values from it</td>
</tr>
<tr>
<td><strong>Replace Method with Method Object</strong></td>
<td>Transform the entire method into a separate class when local variables prevent extraction</td>
</tr>
<tr>
<td><strong>Decompose Conditional</strong></td>
<td>Extract complex conditional logic into well-named methods</td>
</tr>
</tbody>
</table>
<h3 id="payoff">Payoff</h3>
<ul>
<li>Among all types of object-oriented code, classes with <strong>short methods live longest</strong></li>
<li>The longer a method is, the harder it is to understand and maintain</li>
<li>Long methods are a perfect hiding place for <strong>unwanted duplicate code</strong></li>
<li>Now that you have clear code, you are more likely to find <strong>truly effective</strong> performance optimizations</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-b-bloater-2----large-class">Module B: Bloater #2 -- Large Class</h2>
<h3 id="what-is-it-1">What Is It?</h3>
<p>A class contains <strong>many fields, methods, and lines of code</strong>. Classes become bloated over time as programs grow.</p>
<h3 id="signs-and-symptoms-1">Signs and Symptoms</h3>
<ul>
<li>The class has too many fields (more than 5-10 that represent different concepts)</li>
<li>The class has too many methods (covering multiple responsibilities)</li>
<li>You cannot describe what the class does in one sentence without using &quot;and&quot;</li>
</ul>
<h3 id="reasons-for-the-problem-1">Reasons for the Problem</h3>
<ul>
<li>Classes usually start small but over time they get bloated as the program grows</li>
<li>Programmers find it mentally less taxing to <strong>place a new feature in an existing class</strong> than to create a new class for the feature</li>
<li>&quot;This class already handles orders... I'll just add shipping logic here too&quot;</li>
</ul>
<p>Reference: <a href="https://refactoring.guru/smells/large-class">RefactoringGuru -- Large Class</a></p>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-b-bloater-2----large-class-treatment--payoff">Module B: Bloater #2 -- Large Class (Treatment &amp; Payoff)</h2>
<h3 id="treatment-refactoring-techniques-1">Treatment (Refactoring Techniques)</h3>
<table>
<thead>
<tr>
<th>Technique</th>
<th>When to Use</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Extract Class</strong></td>
<td>When part of a class's behavior can be spun off into a separate class</td>
</tr>
<tr>
<td><strong>Extract Subclass</strong></td>
<td>When part of a class's behavior is only relevant to some instances</td>
</tr>
<tr>
<td><strong>Extract Interface</strong></td>
<td>When you need to identify what operations and behaviors are available to the client</td>
</tr>
<tr>
<td><strong>Duplicate Observed Data</strong></td>
<td>If a large class is responsible for GUI, move data and behavior to a separate domain object</td>
</tr>
</tbody>
</table>
<h3 id="payoff-1">Payoff</h3>
<ul>
<li>Developers do not have to remember a large number of attributes for a class</li>
<li>Splitting large classes frequently <strong>eliminates code duplication</strong> and redundant functionality</li>
<li>Each class has <strong>one clear purpose</strong> (Single Responsibility Principle)</li>
<li>Smaller classes are easier to <strong>test in isolation</strong></li>
<li>Smaller, focused classes can be <strong>reused</strong> in other contexts</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-12</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-b-bloater-3----primitive-obsession">Module B: Bloater #3 -- Primitive Obsession</h2>
<h3 id="what-is-it-2">What Is It?</h3>
<p>The overuse of <strong>primitive types</strong> (int, String, double, boolean) instead of creating small objects for domain concepts.</p>
<h3 id="signs-and-symptoms-2">Signs and Symptoms</h3>
<ul>
<li>Use of <strong>primitives instead of small objects</strong> for simple tasks (such as currency, ranges, special strings for phone numbers, etc.)</li>
<li>Use of <strong>constants for coding information</strong> (such as <code>USER_ADMIN_ROLE = 1</code>)</li>
<li>Use of <strong>string constants as field names</strong> for use in data arrays</li>
</ul>
<h3 id="reasons-for-the-problem-2">Reasons for the Problem</h3>
<ul>
<li>Primitives are created &quot;just to store a value&quot; and eventually grow in usage</li>
<li>Creating a field is easier than creating a whole new class</li>
<li>&quot;I'll just use a String for the phone number...&quot;</li>
<li>Primitives are often born from laziness: it seems simpler to use an <code>int</code> or <code>String</code> than to create a new class</li>
</ul>
<p>Reference: <a href="https://refactoring.guru/smells/primitive-obsession">RefactoringGuru -- Primitive Obsession</a></p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-12</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-b-bloater-3----primitive-obsession-treatment--payoff">Module B: Bloater #3 -- Primitive Obsession (Treatment &amp; Payoff)</h2>
<h3 id="treatment-refactoring-techniques-2">Treatment (Refactoring Techniques)</h3>
<table>
<thead>
<tr>
<th>Technique</th>
<th>When to Use</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Replace Data Value with Object</strong></td>
<td>Group related primitive fields and relocate associated behavior</td>
</tr>
<tr>
<td><strong>Introduce Parameter Object</strong></td>
<td>When primitives appear grouped in method parameters</td>
</tr>
<tr>
<td><strong>Preserve Whole Object</strong></td>
<td>When you extract multiple values from an object and pass them individually</td>
</tr>
<tr>
<td><strong>Replace Type Code with Class</strong></td>
<td>When type code values do not affect behavior</td>
</tr>
<tr>
<td><strong>Replace Type Code with Subclasses</strong></td>
<td>When type code affects behavior</td>
</tr>
<tr>
<td><strong>Replace Type Code with State/Strategy</strong></td>
<td>When you cannot use subclasses</td>
</tr>
<tr>
<td><strong>Replace Array with Object</strong></td>
<td>When arrays contain mixed data types</td>
</tr>
</tbody>
</table>
<h3 id="payoff-2">Payoff</h3>
<ul>
<li>Code becomes <strong>more flexible</strong> thanks to use of objects instead of primitives</li>
<li>Better <strong>understandability</strong> and organization of code</li>
<li>Easier to find <strong>duplicate code</strong> that processes the same data</li>
<li>Enables <strong>validation</strong> inside the value object (e.g., phone number format)</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-b-bloater-4----long-parameter-list">Module B: Bloater #4 -- Long Parameter List</h2>
<h3 id="what-is-it-3">What Is It?</h3>
<p>A method has <strong>more than three or four parameters</strong>, making it hard to understand and use correctly.</p>
<h3 id="signs-and-symptoms-3">Signs and Symptoms</h3>
<ul>
<li>Method signatures that are too long to fit on one line</li>
<li>Parameters that are hard to distinguish from each other</li>
<li>Callers frequently pass wrong arguments in wrong positions</li>
</ul>
<h3 id="reasons-for-the-problem-3">Reasons for the Problem</h3>
<ul>
<li>A long parameter list may happen after <strong>several types of algorithms are merged</strong> in a single method</li>
<li>A long list may have been created to <strong>control which algorithm will be run</strong> and how</li>
<li>Long parameter lists can also result from efforts to <strong>make classes more independent</strong> of each other (instead of passing an object, individual values are passed)</li>
<li>Long lists become &quot;contradictory and hard to use as they grow longer&quot;</li>
</ul>
<p>Reference: <a href="https://refactoring.guru/smells/long-parameter-list">RefactoringGuru -- Long Parameter List</a></p>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-b-bloater-4----long-parameter-list-treatment--payoff">Module B: Bloater #4 -- Long Parameter List (Treatment &amp; Payoff)</h2>
<h3 id="treatment-refactoring-techniques-3">Treatment (Refactoring Techniques)</h3>
<table>
<thead>
<tr>
<th>Technique</th>
<th>When to Use</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Replace Parameter with Method Call</strong></td>
<td>When a parameter value can be obtained by calling a method of another object that is already available</td>
</tr>
<tr>
<td><strong>Preserve Whole Object</strong></td>
<td>Pass the whole object instead of extracting its individual fields</td>
</tr>
<tr>
<td><strong>Introduce Parameter Object</strong></td>
<td>Create a new class to group related parameters that often appear together</td>
</tr>
</tbody>
</table>
<h3 id="payoff-3">Payoff</h3>
<ul>
<li>More readable, <strong>shorter code</strong></li>
<li>Refactoring may reveal previously unnoticed <strong>duplicate code</strong></li>
<li>Method signatures become self-documenting</li>
</ul>
<h3 id="when-to-ignore">When to Ignore</h3>
<ul>
<li>Do not create unwanted <strong>dependencies between classes</strong> just to reduce parameter count</li>
<li>If the only connection between parameters is that they appear together in this method, introducing a parameter object may be premature</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-b-bloater-5----data-clumps">Module B: Bloater #5 -- Data Clumps</h2>
<h3 id="what-is-it-4">What Is It?</h3>
<p><strong>Identical groups of variables</strong> appear repeatedly across different parts of the code. These clumps should be turned into their own classes.</p>
<h3 id="signs-and-symptoms-4">Signs and Symptoms</h3>
<ul>
<li>The same group of fields appears in multiple classes (e.g., street, city, zipCode)</li>
<li>The same group of parameters appears in multiple method signatures</li>
<li>Removing one value from the group makes the rest meaningless</li>
</ul>
<h3 id="reasons-for-the-problem-4">Reasons for the Problem</h3>
<ul>
<li>Data clumps often appear when <strong>copy-pasting</strong> code</li>
<li>Groups of data are passed around together but never formalized as a concept</li>
<li>A good test: <strong>delete one of the data values</strong> -- do the rest still make sense? If not, it is a clump</li>
</ul>
<p>Reference: <a href="https://refactoring.guru/smells/data-clumps">RefactoringGuru -- Data Clumps</a></p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-12</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-b-bloater-5----data-clumps-treatment--payoff">Module B: Bloater #5 -- Data Clumps (Treatment &amp; Payoff)</h2>
<h3 id="treatment-refactoring-techniques-4">Treatment (Refactoring Techniques)</h3>
<table>
<thead>
<tr>
<th>Technique</th>
<th>When to Use</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Extract Class</strong></td>
<td>Move the group of fields into a new class</td>
</tr>
<tr>
<td><strong>Introduce Parameter Object</strong></td>
<td>For method signatures with data clumps</td>
</tr>
<tr>
<td><strong>Preserve Whole Object</strong></td>
<td>Pass the whole object instead of individual fields</td>
</tr>
</tbody>
</table>
<h3 id="payoff-4">Payoff</h3>
<ul>
<li>Improves <strong>understanding and organization</strong> of code</li>
<li>Reduces <strong>code size</strong> by eliminating repeated field groups</li>
<li>Operations associated with the data can be moved into the new class (e.g., address formatting, validation)</li>
</ul>
<h3 id="when-to-ignore-1">When to Ignore</h3>
<ul>
<li>Passing complete objects as parameters may create <strong>unwanted dependencies</strong> between classes</li>
<li>If the data group only appears together in two places, the overhead of a new class may not be worth it</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-12</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-b-takeaway">Module B: Takeaway</h2>
<h3 id="key-points----bloaters">Key Points -- Bloaters</h3>
<table>
<thead>
<tr>
<th>Smell</th>
<th>Key Takeaway</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Long Method</strong></td>
<td>If a method is longer than ~10 lines, consider extracting smaller methods</td>
</tr>
<tr>
<td><strong>Large Class</strong></td>
<td>If a class has more than one responsibility, split it up</td>
</tr>
<tr>
<td><strong>Primitive Obsession</strong></td>
<td>Replace primitives with small value objects for domain concepts</td>
</tr>
<tr>
<td><strong>Long Parameter List</strong></td>
<td>More than 3-4 parameters? Introduce parameter objects or pass whole objects</td>
</tr>
<tr>
<td><strong>Data Clumps</strong></td>
<td>Groups of data that always appear together belong in their own class</td>
</tr>
</tbody>
</table>
<h3 id="common-thread">Common Thread</h3>
<p>All bloaters grow <strong>gradually over time</strong>. No one writes a 200-line method on purpose on day one. Vigilance and regular refactoring prevent bloaters from taking hold.</p>
<blockquote>
<p>&quot;If you feel the need to comment something inside a method, you should take that code and put it into a new method. Even a single line can and should be broken out into a separate method if it requires explanation.&quot; -- Martin Fowler</p>
</blockquote>

<header>CEN206 Object-Oriented Programming</header>

<h2 id="module-c-object-orientation-abusers----overview">Module C: Object-Orientation Abusers -- Overview</h2>
<p><strong>Object-Orientation Abusers</strong> are cases where object-oriented programming principles are applied incompletely or incorrectly.</p>
<h3 id="the-4-oo-abuser-smells">The 4 OO Abuser Smells</h3>
<table>
<thead>
<tr>
<th>#</th>
<th>Smell</th>
<th>Key Issue</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td><strong>Switch Statements</strong></td>
<td>Complex <code>switch</code> or <code>if</code> chains that could use polymorphism</td>
</tr>
<tr>
<td>2</td>
<td><strong>Temporary Field</strong></td>
<td>Fields that get values only under certain circumstances</td>
</tr>
<tr>
<td>3</td>
<td><strong>Refused Bequest</strong></td>
<td>Subclass uses only some of its parent's methods and properties</td>
</tr>
<tr>
<td>4</td>
<td><strong>Alternative Classes with Different Interfaces</strong></td>
<td>Two classes perform identical functions but have different method names</td>
</tr>
</tbody>
</table>
<blockquote>
<p>All these smells represent incomplete or incorrect applications of OOP principles.</p>
</blockquote>
<p>Reference: <a href="https://refactoring.guru/refactoring/smells/oo-abusers">RefactoringGuru -- OO Abusers</a></p>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-c-oo-abuser-1----switch-statements">Module C: OO Abuser #1 -- Switch Statements</h2>
<h3 id="what-is-it-5">What Is It?</h3>
<p>You have a complex <code>switch</code> operator or sequence of <code>if</code> statements that performs different actions based on a type or condition.</p>
<h3 id="signs-and-symptoms-5">Signs and Symptoms</h3>
<ul>
<li>A complex <code>switch</code> or <code>if-else</code> chain that tests the same condition in multiple places</li>
<li>The same <code>switch</code> structure is likely <strong>duplicated</strong> everywhere the type is handled</li>
<li>Adding a new type requires modifying <strong>every</strong> <code>switch</code> statement</li>
</ul>
<h3 id="reasons-for-the-problem-5">Reasons for the Problem</h3>
<ul>
<li>Relatively rare use of <code>switch</code> and <code>case</code> is one of the hallmarks of object-oriented code</li>
<li>Often a <code>switch</code> is scattered in different places in the program</li>
<li>When a new condition is added, you have to find all the <code>switch</code> code and modify it</li>
<li>As a rule of thumb, <strong>when you see a <code>switch</code> you should think of polymorphism</strong></li>
</ul>
<p>Reference: <a href="https://refactoring.guru/smells/switch-statements">RefactoringGuru -- Switch Statements</a></p>

<h2 id="module-c-oo-abuser-1----switch-statements-java-example----after">Module C: OO Abuser #1 -- Switch Statements (Java Example -- After)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// REFACTORED: Replace Conditional with Polymorphism</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">abstract</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Employee</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-type">double</span> monthlySalary;

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">abstract</span> <span class="hljs-type">double</span> <span class="hljs-title function_">calculatePay</span><span class="hljs-params">()</span>;

}

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-c-oo-abuser-1----switch-statements-treatment--payoff">Module C: OO Abuser #1 -- Switch Statements (Treatment &amp; Payoff)</h2>
<h3 id="treatment-refactoring-techniques-5">Treatment (Refactoring Techniques)</h3>
<table>
<thead>
<tr>
<th>Technique</th>
<th>When to Use</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Replace Type Code with Subclasses</strong></td>
<td>Create subclasses for each type</td>
</tr>
<tr>
<td><strong>Replace Conditional with Polymorphism</strong></td>
<td>Use method overriding instead of conditionals</td>
</tr>
<tr>
<td><strong>Replace Type Code with State/Strategy</strong></td>
<td>When subclasses are not possible</td>
</tr>
<tr>
<td><strong>Replace Parameter with Explicit Methods</strong></td>
<td>When conditions call the same method with different parameters</td>
</tr>
<tr>
<td><strong>Introduce Null Object</strong></td>
<td>For null conditions</td>
</tr>
</tbody>
</table>
<h3 id="payoff-5">Payoff</h3>
<ul>
<li>Improved <strong>code organization</strong> through polymorphism</li>
<li><strong>Easier to add new types</strong> -- just add a new subclass (Open/Closed Principle)</li>
<li>Eliminates <strong>duplicated conditional logic</strong> scattered throughout the codebase</li>
</ul>
<h3 id="when-to-ignore-2">When to Ignore</h3>
<ul>
<li>When a <code>switch</code> performs <strong>simple actions</strong> and appears in only one place</li>
<li>Simple factory methods (Factory Method or Abstract Factory patterns) are often acceptable</li>
<li>If the switch is unlikely to change, polymorphism may be overkill</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-c-oo-abuser-2----temporary-field">Module C: OO Abuser #2 -- Temporary Field</h2>
<h3 id="what-is-it-6">What Is It?</h3>
<p>Temporary fields get their values (and thus are needed by objects) only <strong>under certain circumstances</strong>. Outside of these circumstances, they are empty or contain irrelevant data.</p>
<h3 id="signs-and-symptoms-6">Signs and Symptoms</h3>
<ul>
<li>Object fields that are only populated and used during specific algorithm execution</li>
<li>Fields that are <code>null</code> or empty most of the time</li>
<li>You expect to see data in fields that are <strong>almost always empty</strong></li>
</ul>
<h3 id="reasons-for-the-problem-6">Reasons for the Problem</h3>
<ul>
<li>Often temporary fields are created for use in an algorithm that <strong>requires a large amount of inputs</strong></li>
<li>Instead of creating many parameters in the method, the programmer decides to create <strong>fields</strong> for this data in the class</li>
<li>These fields are used only in the algorithm and are useless the rest of the time</li>
<li>This code is hard to understand because you expect object fields to consistently contain meaningful data</li>
</ul>
<p>Reference: <a href="https://refactoring.guru/smells/temporary-field">RefactoringGuru -- Temporary Field</a></p>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-c-oo-abuser-2----temporary-field-treatment--payoff">Module C: OO Abuser #2 -- Temporary Field (Treatment &amp; Payoff)</h2>
<h3 id="treatment-refactoring-techniques-6">Treatment (Refactoring Techniques)</h3>
<table>
<thead>
<tr>
<th>Technique</th>
<th>When to Use</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Extract Class</strong></td>
<td>Move temporary fields and related operations into a separate class (creates a method object)</td>
</tr>
<tr>
<td><strong>Introduce Null Object</strong></td>
<td>Replace conditional code checking for temporary field existence with a Null Object</td>
</tr>
<tr>
<td><strong>Replace Method with Method Object</strong></td>
<td>If the temporary fields exist for a complex algorithm, extract the entire algorithm into a separate class</td>
</tr>
</tbody>
</table>
<h3 id="payoff-6">Payoff</h3>
<ul>
<li><strong>Better code clarity and organization</strong> -- no more confusion about when fields have meaningful values</li>
<li>All fields in a class are always meaningful</li>
<li>Code becomes easier to reason about</li>
</ul>
<h3 id="when-to-ignore-3">When to Ignore</h3>
<ul>
<li>If the temporary state is truly transient and clearly documented</li>
<li>If the algorithm is simple enough that the temporary fields do not cause confusion</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-c-oo-abuser-3----refused-bequest">Module C: OO Abuser #3 -- Refused Bequest</h2>
<h3 id="what-is-it-7">What Is It?</h3>
<p>If a subclass uses <strong>only some</strong> of the methods and properties inherited from its parents, the hierarchy is off-kilter. The unneeded methods may simply go unused or be <strong>redefined to throw exceptions</strong>.</p>
<h3 id="signs-and-symptoms-7">Signs and Symptoms</h3>
<ul>
<li>A subclass overrides parent methods to throw <code>UnsupportedOperationException</code></li>
<li>A subclass leaves most inherited methods unused</li>
<li>The inheritance relationship does not model a true &quot;is-a&quot; relationship</li>
</ul>
<h3 id="reasons-for-the-problem-7">Reasons for the Problem</h3>
<ul>
<li>Someone was motivated to create inheritance between classes only by the <strong>desire to reuse code</strong> in a superclass</li>
<li>But the superclass and subclass are <strong>completely different</strong> in nature</li>
<li>Like making Dog extend Chair because both have four legs</li>
</ul>
<p>Reference: <a href="https://refactoring.guru/smells/refused-bequest">RefactoringGuru -- Refused Bequest</a></p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-12</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-c-oo-abuser-3----refused-bequest-java-example----before">Module C: OO Abuser #3 -- Refused Bequest (Java Example -- Before)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// SMELL: Refused Bequest -- Dog inherits fly() it cannot use</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Animal</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">walk</span><span class="hljs-params">()</span> { <span class="hljs-comment">/* walking logic */</span> }
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">fly</span><span class="hljs-params">()</span>  { <span class="hljs-comment">/* flying logic */</span> }
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">swim</span><span class="hljs-params">()</span> { <span class="hljs-comment">/* swimming logic */</span> }
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">eat</span><span class="hljs-params">()</span>  { <span class="hljs-comment">/* eating logic */</span> }
}

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Dog</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Animal</span> {
    <span class="hljs-comment">// Dog can walk, swim, and eat -- but NOT fly</span>
    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">fly</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">UnsupportedOperationException</span>(<span class="hljs-string">&quot;Dogs can&#x27;t fly!&quot;</span>);
    }
}

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Fish</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Animal</span> {
    <span class="hljs-comment">// Fish can swim and eat -- but NOT walk or fly</span>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-c-oo-abuser-3----refused-bequest-treatment--payoff">Module C: OO Abuser #3 -- Refused Bequest (Treatment &amp; Payoff)</h2>
<h3 id="treatment-refactoring-techniques-7">Treatment (Refactoring Techniques)</h3>
<table>
<thead>
<tr>
<th>Technique</th>
<th>When to Use</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Replace Inheritance with Delegation</strong></td>
<td>When inheritance does not make logical sense, eliminate the parent-child relationship and use composition instead</td>
</tr>
<tr>
<td><strong>Extract Superclass</strong></td>
<td>If inheritance is appropriate, create a new intermediary superclass that both classes can extend without refused methods</td>
</tr>
</tbody>
</table>
<h3 id="payoff-7">Payoff</h3>
<ul>
<li>Improves code <strong>clarity and organization</strong></li>
<li>Eliminates confusing or meaningless inheritance hierarchies</li>
<li>Adheres to the <strong>Liskov Substitution Principle</strong> (a subtype should be substitutable for its parent type)</li>
<li>No more methods that throw <code>UnsupportedOperationException</code></li>
</ul>
<h3 id="when-to-ignore-4">When to Ignore</h3>
<ul>
<li>If the refused bequest is minimal and does not cause confusion</li>
<li>If reuse through inheritance provides significant benefits and the refused methods are clearly documented</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-c-oo-abuser-4----alternative-classes-with-different-interfaces">Module C: OO Abuser #4 -- Alternative Classes with Different Interfaces</h2>
<h3 id="what-is-it-8">What Is It?</h3>
<p>Two classes perform <strong>identical functions</strong> but have <strong>different method names</strong>. They should share a common interface.</p>
<h3 id="signs-and-symptoms-8">Signs and Symptoms</h3>
<ul>
<li>Two classes that do the same thing but with different method names</li>
<li>Client code uses <code>if-else</code> to choose between the two classes</li>
<li>The classes cannot be used interchangeably</li>
</ul>
<h3 id="reasons-for-the-problem-8">Reasons for the Problem</h3>
<ul>
<li>The developer who created one class probably <strong>did not know</strong> that a functionally equivalent class already existed</li>
<li>Or they created it independently and did not think to unify the interfaces</li>
</ul>
<p>Reference: <a href="https://refactoring.guru/smells/alternative-classes-with-different-interfaces">RefactoringGuru -- Alternative Classes with Different Interfaces</a></p>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-c-oo-abuser-4----alternative-classes-treatment--payoff">Module C: OO Abuser #4 -- Alternative Classes (Treatment &amp; Payoff)</h2>
<h3 id="treatment-refactoring-techniques-8">Treatment (Refactoring Techniques)</h3>
<table>
<thead>
<tr>
<th>Technique</th>
<th>When to Use</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Rename Method</strong></td>
<td>Make method names consistent across the alternative classes</td>
</tr>
<tr>
<td><strong>Move Method / Add Parameter / Parameterize Method</strong></td>
<td>Align method signatures and implementations</td>
</tr>
<tr>
<td><strong>Extract Superclass</strong></td>
<td>If only part of the functionality is duplicated, extract common parts into a parent class</td>
</tr>
<tr>
<td><strong>Delete redundant class</strong></td>
<td>Once unified, one of the duplicate classes can be removed</td>
</tr>
</tbody>
</table>
<h3 id="payoff-8">Payoff</h3>
<ul>
<li>Eliminates unnecessary <strong>duplicated code</strong>, making the code lighter</li>
<li>Code becomes <strong>more readable</strong> and understandable through a unified interface</li>
<li>Enables <strong>polymorphism</strong> -- clients can use the common interface interchangeably</li>
</ul>
<h3 id="when-to-ignore-5">When to Ignore</h3>
<ul>
<li>Sometimes merging classes is impossible, such as when the alternative classes are in <strong>different libraries</strong> each with their own versioning</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-c-takeaway">Module C: Takeaway</h2>
<h3 id="key-points----object-orientation-abusers">Key Points -- Object-Orientation Abusers</h3>
<table>
<thead>
<tr>
<th>Smell</th>
<th>Key Takeaway</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Switch Statements</strong></td>
<td>Replace with polymorphism; think subclasses instead of conditionals</td>
</tr>
<tr>
<td><strong>Temporary Field</strong></td>
<td>Extract into a separate class; fields should always be meaningful</td>
</tr>
<tr>
<td><strong>Refused Bequest</strong></td>
<td>Replace inheritance with delegation if the &quot;is-a&quot; relationship is wrong</td>
</tr>
<tr>
<td><strong>Alt. Classes w/ Different Interfaces</strong></td>
<td>Unify interfaces; extract superclass or common interface</td>
</tr>
</tbody>
</table>
<h3 id="common-thread-1">Common Thread</h3>
<p>All OO Abusers stem from <strong>misunderstanding or misapplying</strong> OOP principles. The fix is almost always: use polymorphism correctly, prefer composition over inheritance when appropriate, and design clean interfaces.</p>
<blockquote>
<p>&quot;When you see a switch statement, think polymorphism.&quot; -- RefactoringGuru</p>
</blockquote>

<h2 id="module-d-change-preventers----overview">Module D: Change Preventers -- Overview</h2>
<p><strong>Change Preventers</strong> are smells that mean if you need to change something in one place in your code, you have to make many changes in other places too. Program development becomes much more expensive and complex as a result.</p>
<h3 id="the-3-change-preventer-smells">The 3 Change Preventer Smells</h3>
<table>
<thead>
<tr>
<th>#</th>
<th>Smell</th>
<th>Key Issue</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td><strong>Divergent Change</strong></td>
<td>One class is commonly changed in different ways for different reasons</td>
</tr>
<tr>
<td>2</td>
<td><strong>Shotgun Surgery</strong></td>
<td>A single change requires edits in many different classes</td>
</tr>
<tr>
<td>3</td>
<td><strong>Parallel Inheritance Hierarchies</strong></td>
<td>Creating a subclass in one hierarchy forces creation in another</td>
</tr>
</tbody>
</table>
<blockquote>
<p>These smells are <strong>opposites</strong> in some ways: Divergent Change is one class suffering many changes, while Shotgun Surgery is one change affecting many classes.</p>
</blockquote>
<p>Reference: <a href="https://refactoring.guru/refactoring/smells/change-preventers">RefactoringGuru -- Change Preventers</a></p>

<h2 id="module-d-change-preventer-1----divergent-change">Module D: Change Preventer #1 -- Divergent Change</h2>
<h3 id="what-is-it-9">What Is It?</h3>
<p>You find yourself having to change <strong>many unrelated methods</strong> when you make changes to a class. For example, when adding a new product type, you have to change the methods for finding, displaying, and ordering products.</p>
<h3 id="signs-and-symptoms-9">Signs and Symptoms</h3>
<ul>
<li>A class requires frequent modifications for different, unrelated reasons</li>
<li>One class has accumulated responsibilities that should belong to different classes</li>
<li>The class violates the <strong>Single Responsibility Principle</strong></li>
</ul>
<h3 id="reasons-for-the-problem-9">Reasons for the Problem</h3>
<ul>
<li>These scattered modifications typically stem from <strong>poor program structure</strong> or copy-paste programming</li>
<li>A class has gradually absorbed multiple responsibilities over time</li>
<li>&quot;This is the Order class -- I'll just add the display logic here too&quot;</li>
</ul>
<p>Reference: <a href="https://refactoring.guru/smells/divergent-change">RefactoringGuru -- Divergent Change</a></p>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-d-change-preventer-1----divergent-change-treatment--payoff">Module D: Change Preventer #1 -- Divergent Change (Treatment &amp; Payoff)</h2>
<h3 id="treatment-refactoring-techniques-9">Treatment (Refactoring Techniques)</h3>
<table>
<thead>
<tr>
<th>Technique</th>
<th>When to Use</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Extract Class</strong></td>
<td>Split up the behavior of the class into separate classes, each with a single responsibility</td>
</tr>
<tr>
<td><strong>Extract Superclass</strong></td>
<td>Combine classes sharing identical behavior through inheritance</td>
</tr>
<tr>
<td><strong>Extract Subclass</strong></td>
<td>Use inheritance to organize related but distinct behaviors</td>
</tr>
</tbody>
</table>
<h3 id="payoff-9">Payoff</h3>
<ul>
<li>Improves <strong>code organization</strong> -- each class changes for exactly one reason</li>
<li>Reduces <strong>code duplication</strong> across the codebase</li>
<li>Simplifies <strong>support and maintenance</strong> -- changes are localized</li>
<li>Follows the <strong>Single Responsibility Principle</strong> (SRP)</li>
</ul>
<h3 id="divergent-change-vs-shotgun-surgery">Divergent Change vs. Shotgun Surgery</h3>
<table>
<thead>
<tr>
<th>Divergent Change</th>
<th>Shotgun Surgery</th>
</tr>
</thead>
<tbody>
<tr>
<td>Many <strong>different changes</strong> in one class</td>
<td>One change affects <strong>many classes</strong></td>
</tr>
<tr>
<td>One class, many reasons to change</td>
<td>One reason to change, many classes</td>
</tr>
</tbody>
</table>

<h2 id="module-d-change-preventer-2----shotgun-surgery">Module D: Change Preventer #2 -- Shotgun Surgery</h2>
<h3 id="what-is-it-10">What Is It?</h3>
<p>Making any modification requires you to make many <strong>small changes to many different classes</strong>.</p>
<h3 id="signs-and-symptoms-10">Signs and Symptoms</h3>
<ul>
<li>A single logical change (adding a field, changing a rule) requires touching 5+ classes</li>
<li>You often forget to make a change in one of the scattered locations</li>
<li>The scattered classes all deal with the same concern</li>
</ul>
<h3 id="reasons-for-the-problem-10">Reasons for the Problem</h3>
<ul>
<li>A <strong>single responsibility has been split</strong> up among a large number of classes</li>
<li>This can happen after overzealous application of Divergent Change refactoring -- splitting a class too aggressively</li>
<li>Incremental development where related code ended up in different places</li>
</ul>
<p>Reference: <a href="https://refactoring.guru/smells/shotgun-surgery">RefactoringGuru -- Shotgun Surgery</a></p>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-d-change-preventer-2----shotgun-surgery-treatment--payoff">Module D: Change Preventer #2 -- Shotgun Surgery (Treatment &amp; Payoff)</h2>
<h3 id="treatment-refactoring-techniques-10">Treatment (Refactoring Techniques)</h3>
<table>
<thead>
<tr>
<th>Technique</th>
<th>When to Use</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Move Method</strong> and <strong>Move Field</strong></td>
<td>Move existing methods and fields from scattered classes into a single class</td>
</tr>
<tr>
<td><strong>Create new class</strong></td>
<td>If no existing class seems like a good fit for the consolidated responsibility</td>
</tr>
<tr>
<td><strong>Inline Class</strong></td>
<td>If moving code to a related class empties the donor class, eliminate the now-redundant class</td>
</tr>
</tbody>
</table>
<h3 id="payoff-10">Payoff</h3>
<ul>
<li>Better <strong>code organization</strong> -- related logic lives together</li>
<li>Less <strong>code duplication</strong> across the codebase</li>
<li><strong>Easier maintenance</strong> -- changes are localized to fewer files</li>
<li>Reduces the risk of <strong>missing a change</strong> in one of many scattered locations</li>
</ul>
<h3 id="when-to-ignore-6">When to Ignore</h3>
<ul>
<li>Some frameworks (Spring, Jakarta EE) intentionally separate concerns into layers (Controller, Service, Repository)</li>
<li>In these cases, shotgun surgery may be an acceptable tradeoff for architectural clarity</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-d-change-preventer-3----parallel-inheritance-hierarchies">Module D: Change Preventer #3 -- Parallel Inheritance Hierarchies</h2>
<h3 id="what-is-it-11">What Is It?</h3>
<p>Whenever you create a subclass for a class, you find yourself needing to create a subclass for <strong>another class</strong> as well.</p>
<h3 id="signs-and-symptoms-11">Signs and Symptoms</h3>
<ul>
<li>Two class hierarchies grow in lockstep</li>
<li>Adding a class in one hierarchy always requires adding a class in the other</li>
<li>Class prefixes from one hierarchy mirror prefixes in another (e.g., <code>Circle</code>/<code>CircleRenderer</code>)</li>
</ul>
<h3 id="reasons-for-the-problem-11">Reasons for the Problem</h3>
<ul>
<li>Initially manageable class structures become increasingly difficult to modify as new classes are added</li>
<li>The parallel may have been so small nobody noticed at first</li>
<li>This smell is actually a <strong>special case of Shotgun Surgery</strong></li>
</ul>
<p>Reference: <a href="https://refactoring.guru/smells/parallel-inheritance-hierarchies">RefactoringGuru -- Parallel Inheritance Hierarchies</a></p>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-d-change-preventer-3----parallel-inheritance-treatment--payoff">Module D: Change Preventer #3 -- Parallel Inheritance (Treatment &amp; Payoff)</h2>
<h3 id="treatment-refactoring-techniques-11">Treatment (Refactoring Techniques)</h3>
<table>
<thead>
<tr>
<th>Technique</th>
<th>When to Use</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Move Method</strong> and <strong>Move Field</strong></td>
<td>De-duplicate the parallel hierarchy by moving behavior from one hierarchy into the other</td>
</tr>
<tr>
<td><strong>Create cross-references</strong></td>
<td>Establish references where one hierarchy's instances point to another hierarchy's instances, then eliminate the redundant hierarchy</td>
</tr>
</tbody>
</table>
<h3 id="payoff-11">Payoff</h3>
<ul>
<li>Reduces <strong>code duplication</strong> across related hierarchies</li>
<li>Improves overall <strong>code organization</strong> and maintainability</li>
<li>Adding a new type requires changes in <strong>one hierarchy</strong> instead of two</li>
</ul>
<h3 id="when-to-ignore-7">When to Ignore</h3>
<ul>
<li>Sometimes having parallel class hierarchies is a way of <strong>avoiding even bigger design problems</strong></li>
<li>If they provide clear separation of concerns (e.g., rendering vs. business logic), they may be justified</li>
<li>If refactoring attempts produce uglier code, it may be wiser to accept the current structure</li>
</ul>

<h2 id="module-d-takeaway">Module D: Takeaway</h2>
<h3 id="key-points----change-preventers">Key Points -- Change Preventers</h3>
<table>
<thead>
<tr>
<th>Smell</th>
<th>Key Takeaway</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Divergent Change</strong></td>
<td>One class with multiple reasons to change -- split it into focused classes (SRP)</td>
</tr>
<tr>
<td><strong>Shotgun Surgery</strong></td>
<td>One change touching many classes -- consolidate the scattered responsibility</td>
</tr>
<tr>
<td><strong>Parallel Inheritance Hierarchies</strong></td>
<td>Two hierarchies growing in lockstep -- merge them when possible</td>
</tr>
</tbody>
</table>
<h3 id="common-thread-2">Common Thread</h3>
<p>Change Preventers make software <strong>rigid</strong> -- they resist change by requiring disproportionate effort for simple modifications. The fixes involve reorganizing responsibilities so that changes are <strong>localized</strong>.</p>
<blockquote>
<p>&quot;The art of refactoring is knowing which smells indicate an opportunity for improvement and which are acceptable trade-offs.&quot; -- Martin Fowler</p>
</blockquote>

<header>CEN206 Object-Oriented Programming</header>

<h2 id="module-e-dispensables----overview">Module E: Dispensables -- Overview</h2>
<p>A <strong>dispensable</strong> is something pointless and unneeded whose absence would make the code cleaner, more efficient, and easier to understand.</p>
<h3 id="the-6-dispensable-smells">The 6 Dispensable Smells</h3>
<table>
<thead>
<tr>
<th>#</th>
<th>Smell</th>
<th>Key Issue</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td><strong>Comments</strong></td>
<td>Method is filled with explanatory comments</td>
</tr>
<tr>
<td>2</td>
<td><strong>Duplicate Code</strong></td>
<td>Two code fragments look almost identical</td>
</tr>
<tr>
<td>3</td>
<td><strong>Lazy Class</strong></td>
<td>A class that does too little to earn its keep</td>
</tr>
<tr>
<td>4</td>
<td><strong>Data Class</strong></td>
<td>A class with only fields and getters/setters</td>
</tr>
<tr>
<td>5</td>
<td><strong>Dead Code</strong></td>
<td>Code that is no longer used</td>
</tr>
<tr>
<td>6</td>
<td><strong>Speculative Generality</strong></td>
<td>Unused classes, methods, or parameters created &quot;just in case&quot;</td>
</tr>
</tbody>
</table>
<p>Reference: <a href="https://refactoring.guru/refactoring/smells/dispensables">RefactoringGuru -- Dispensables</a></p>

<h2 id="module-e-dispensable-1----comments">Module E: Dispensable #1 -- Comments</h2>
<h3 id="what-is-it-12">What Is It?</h3>
<p>A method is filled with <strong>explanatory comments</strong> that attempt to explain what the code does. The best comment is a good name for a method or class.</p>
<h3 id="signs-and-symptoms-12">Signs and Symptoms</h3>
<ul>
<li>Large comment blocks explaining what the next few lines do</li>
<li>Comments that restate the code in English</li>
<li>Comments used as &quot;deodorant&quot; trying to mask the smell of bad code</li>
<li>Outdated comments that no longer match the code</li>
</ul>
<h3 id="reasons-for-the-problem-12">Reasons for the Problem</h3>
<ul>
<li>Comments are usually created with the <strong>best of intentions</strong> when the author realizes code is not intuitive</li>
<li>The comment acts as a deodorant trying to mask the smell of bad code</li>
<li>If you feel that a code fragment cannot be understood without comments, try to <strong>change the code structure</strong> so that comments become unnecessary</li>
</ul>
<p>Reference: <a href="https://refactoring.guru/smells/comments">RefactoringGuru -- Comments</a></p>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-e-dispensable-1----comments-treatment--payoff">Module E: Dispensable #1 -- Comments (Treatment &amp; Payoff)</h2>
<h3 id="treatment-refactoring-techniques-12">Treatment (Refactoring Techniques)</h3>
<table>
<thead>
<tr>
<th>Technique</th>
<th>When to Use</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Extract Variable</strong></td>
<td>When a comment explains a complex expression, extract it into a well-named variable</td>
</tr>
<tr>
<td><strong>Extract Method</strong></td>
<td>When a comment explains a section of code, extract that section into a method with a descriptive name</td>
</tr>
<tr>
<td><strong>Rename Method</strong></td>
<td>When a method has been extracted but the name does not explain it well enough</td>
</tr>
<tr>
<td><strong>Introduce Assertion</strong></td>
<td>When a comment documents a necessary system state or rule</td>
</tr>
</tbody>
</table>
<h3 id="payoff-12">Payoff</h3>
<ul>
<li>Code becomes <strong>more self-explanatory</strong> and intuitive</li>
<li>Eliminates the risk of <strong>outdated or misleading comments</strong></li>
<li>Reduces maintenance burden (no need to update comments when code changes)</li>
</ul>
<h3 id="when-to-ignore-8">When to Ignore</h3>
<ul>
<li><strong>Explaining WHY</strong> something is done: <code>// Using insertion sort because array is nearly sorted</code></li>
<li><strong>Warning of consequences</strong>: <code>// WARNING: Changing this order breaks the payment pipeline</code></li>
<li><strong>TODO comments</strong>: <code>// TODO: Replace with async call after API v2 migration</code></li>
<li><strong>Javadoc for public APIs</strong>: Documenting parameters, return values, exceptions</li>
</ul>

<h2 id="module-e-dispensable-2----duplicate-code">Module E: Dispensable #2 -- Duplicate Code</h2>
<h3 id="what-is-it-13">What Is It?</h3>
<p>Two code fragments look <strong>almost identical</strong>. This is one of the most common code smells.</p>
<h3 id="signs-and-symptoms-13">Signs and Symptoms</h3>
<ul>
<li>The same code structure appears in multiple places with minor variations</li>
<li>Copy-pasted code with small modifications</li>
<li>Two methods that do essentially the same thing with different variable names</li>
</ul>
<h3 id="reasons-for-the-problem-13">Reasons for the Problem</h3>
<ul>
<li><strong>Multiple programmers</strong> working simultaneously write similar solutions independently</li>
<li><strong>Copy-paste programming</strong> under time pressure and deadline rushing</li>
<li>Subtle duplication where code <em>looks</em> different but performs identical operations</li>
<li>Developer laziness or inability to refactor existing &quot;almost right&quot; code</li>
</ul>
<p>Reference: <a href="https://refactoring.guru/smells/duplicate-code">RefactoringGuru -- Duplicate Code</a></p>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-e-dispensable-2----duplicate-code-treatment--payoff">Module E: Dispensable #2 -- Duplicate Code (Treatment &amp; Payoff)</h2>
<h3 id="treatment-refactoring-techniques-13">Treatment (Refactoring Techniques)</h3>
<table>
<thead>
<tr>
<th>Context</th>
<th>Technique</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Same code in two methods of the same class</strong></td>
<td><strong>Extract Method</strong> -- create a shared method</td>
</tr>
<tr>
<td><strong>Same code in two subclasses</strong></td>
<td><strong>Extract Method</strong> + <strong>Pull Up Method/Field</strong> to the superclass; use <strong>Form Template Method</strong> if similar but not identical</td>
</tr>
<tr>
<td><strong>Same code in two unrelated classes</strong></td>
<td><strong>Extract Class</strong> or <strong>Extract Superclass</strong> depending on hierarchy</td>
</tr>
<tr>
<td><strong>Conditional duplicates</strong></td>
<td><strong>Consolidate Conditional Expression</strong> + <strong>Extract Method</strong></td>
</tr>
</tbody>
</table>
<h3 id="payoff-13">Payoff</h3>
<ul>
<li>&quot;Merging duplicate code <strong>simplifies</strong> the structure of your code and makes it shorter&quot;</li>
<li>Bug fixes only need to be applied <strong>once</strong> instead of in multiple places</li>
<li>Code that is easier to understand and cheaper to maintain</li>
</ul>
<h3 id="when-to-ignore-9">When to Ignore</h3>
<ul>
<li>In very rare cases, merging two identical code fragments can make the code <strong>less intuitive</strong></li>
<li>In <strong>test code</strong>, sometimes it is acceptable to keep tests independent and duplicated for clarity</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-e-dispensable-3----lazy-class">Module E: Dispensable #3 -- Lazy Class</h2>
<h3 id="what-is-it-14">What Is It?</h3>
<p>A class that does <strong>too little</strong> to justify its existence. Understanding and maintaining classes always costs time and money. So if a class does not do enough to earn your attention, it should be deleted.</p>
<h3 id="signs-and-symptoms-14">Signs and Symptoms</h3>
<ul>
<li>The class has very few methods or fields</li>
<li>The class does nothing more than wrap a single value</li>
<li>Other classes do all the real work with this class's data</li>
</ul>
<h3 id="reasons-for-the-problem-14">Reasons for the Problem</h3>
<ul>
<li>A class may have become ridiculously small after <strong>refactoring</strong> reduced its original functionality</li>
<li>Or it was <strong>designed to support future development</strong> that never happened</li>
<li>Or it was created from an Extract Class refactoring that was <strong>too aggressive</strong></li>
</ul>
<p>Reference: <a href="https://refactoring.guru/smells/lazy-class">RefactoringGuru -- Lazy Class</a></p>

<h2 id="module-e-dispensable-3----lazy-class-treatment--payoff">Module E: Dispensable #3 -- Lazy Class (Treatment &amp; Payoff)</h2>
<h3 id="treatment-refactoring-techniques-14">Treatment (Refactoring Techniques)</h3>
<table>
<thead>
<tr>
<th>Technique</th>
<th>When to Use</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Inline Class</strong></td>
<td>Merge the lazy class into the class that uses it</td>
</tr>
<tr>
<td><strong>Collapse Hierarchy</strong></td>
<td>If a subclass is essentially the same as its superclass, merge them</td>
</tr>
</tbody>
</table>
<h3 id="payoff-14">Payoff</h3>
<ul>
<li>Reduced <strong>code size</strong> and fewer classes to understand</li>
<li>Easier <strong>maintenance</strong> -- less cognitive load</li>
<li>Simpler class hierarchy and navigation</li>
</ul>
<h3 id="when-to-ignore-10">When to Ignore</h3>
<ul>
<li>Sometimes a Lazy Class is created to <strong>delineate intentions for future development</strong></li>
<li>If the class represents a <strong>domain concept</strong> that may grow, keeping it may be wise</li>
<li>If the class provides <strong>type safety</strong> (e.g., <code>EmailAddress</code> vs. <code>String</code>), it may be worth keeping even if simple</li>
<li>Maintain a balance between clarity and simplicity</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-e-dispensable-4----data-class">Module E: Dispensable #4 -- Data Class</h2>
<h3 id="what-is-it-15">What Is It?</h3>
<p>A <strong>data class</strong> is a class that contains only fields and crude methods for accessing them (getters and setters). These are simply containers for data used by other classes. They do not contain any additional functionality and cannot independently operate on the data they own.</p>
<h3 id="signs-and-symptoms-15">Signs and Symptoms</h3>
<ul>
<li>A class with only private fields, getters, and setters</li>
<li>No methods that perform logic or operations on the data</li>
<li>All behavior that manipulates this class's data lives in <strong>other</strong> classes</li>
</ul>
<h3 id="reasons-for-the-problem-15">Reasons for the Problem</h3>
<ul>
<li>It is normal for a newly created class to contain only a few public fields</li>
<li>But the true power of objects is that they can contain <strong>behavior</strong> along with data</li>
<li>Data classes indicate that <strong>behavior</strong> related to this data lives somewhere else -- which violates encapsulation</li>
</ul>
<p>Reference: <a href="https://refactoring.guru/smells/data-class">RefactoringGuru -- Data Class</a></p>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-e-dispensable-4----data-class-treatment--payoff">Module E: Dispensable #4 -- Data Class (Treatment &amp; Payoff)</h2>
<h3 id="treatment-refactoring-techniques-15">Treatment (Refactoring Techniques)</h3>
<table>
<thead>
<tr>
<th>Step</th>
<th>Technique</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Step 1: Encapsulate</strong></td>
<td><strong>Encapsulate Field</strong> -- make public fields private, add getters/setters. <strong>Encapsulate Collection</strong> -- return unmodifiable views.</td>
</tr>
<tr>
<td><strong>Step 2: Move behavior</strong></td>
<td><strong>Move Method</strong> / <strong>Extract Method</strong> -- find code in client classes that manipulates this class's data and move it into the data class</td>
</tr>
<tr>
<td><strong>Step 3: Remove access</strong></td>
<td><strong>Remove Setting Method</strong> -- for fields that should not be changed after creation. <strong>Hide Method</strong> -- for getters that only the class itself needs.</td>
</tr>
</tbody>
</table>
<h3 id="payoff-15">Payoff</h3>
<ul>
<li>Improves <strong>understanding and organization</strong> of code -- behavior and data are together</li>
<li>Helps discover <strong>duplicated code</strong> in client classes that operated on the same data</li>
<li>Classes become <strong>self-contained</strong> and capable of performing their own operations</li>
</ul>
<h3 id="when-to-ignore-11">When to Ignore</h3>
<ul>
<li>Data classes are acceptable as <strong>DTOs (Data Transfer Objects)</strong> when they serve purely as transport containers between layers</li>
<li>In <strong>functional programming</strong> style, separating data from behavior may be intentional</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-e-dispensable-5----dead-code">Module E: Dispensable #5 -- Dead Code</h2>
<h3 id="what-is-it-16">What Is It?</h3>
<p>A variable, parameter, field, method, or class is <strong>no longer used</strong> (usually because it is obsolete).</p>
<h3 id="signs-and-symptoms-16">Signs and Symptoms</h3>
<ul>
<li>Unused variables, parameters, or fields</li>
<li>Methods that are never called</li>
<li>Classes that are never instantiated</li>
<li>Code branches that can never be reached (e.g., <code>if (false) { ... }</code>)</li>
<li>Commented-out code left behind &quot;just in case&quot;</li>
</ul>
<h3 id="reasons-for-the-problem-16">Reasons for the Problem</h3>
<ul>
<li>Requirements changed and old code was <strong>never cleaned up</strong></li>
<li>Code was <strong>commented out</strong> &quot;temporarily&quot; and never removed</li>
<li>Dead code often accumulates after <strong>library upgrades</strong> or <strong>feature removals</strong></li>
<li>Fear of removing code that &quot;might be needed later&quot;</li>
<li>Complex conditionals where certain branches became inaccessible</li>
</ul>
<p>Reference: <a href="https://refactoring.guru/smells/dead-code">RefactoringGuru -- Dead Code</a></p>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-e-dispensable-5----dead-code-treatment--payoff">Module E: Dispensable #5 -- Dead Code (Treatment &amp; Payoff)</h2>
<h3 id="treatment-refactoring-techniques-16">Treatment (Refactoring Techniques)</h3>
<table>
<thead>
<tr>
<th>Technique</th>
<th>When to Use</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Delete unused code</strong></td>
<td>The simplest and most effective treatment -- just delete it</td>
</tr>
<tr>
<td><strong>Remove Parameter</strong></td>
<td>Eliminate unused parameters from method signatures</td>
</tr>
<tr>
<td><strong>Inline Class</strong> or <strong>Collapse Hierarchy</strong></td>
<td>For unnecessary classes</td>
</tr>
<tr>
<td><strong>Use IDE tools</strong></td>
<td>Modern IDEs and static analysis tools can identify unused code efficiently</td>
</tr>
</tbody>
</table>
<h3 id="payoff-16">Payoff</h3>
<ul>
<li><strong>Reduced code size</strong> -- less code to read, understand, and maintain</li>
<li><strong>Simpler support</strong> -- no confusion about whether dead code should be maintained</li>
<li><strong>Cleaner codebase</strong> -- easier to navigate and search</li>
</ul>
<h3 id="key-insight-1">Key Insight</h3>
<blockquote>
<p>Remember: <strong>Git remembers everything</strong> -- you can always get deleted code back from version history. There is no reason to keep dead code &quot;just in case.&quot;</p>
</blockquote>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-e-dispensable-6----speculative-generality">Module E: Dispensable #6 -- Speculative Generality</h2>
<h3 id="what-is-it-17">What Is It?</h3>
<p>There is an <strong>unused class, method, field, or parameter</strong> that was created to support anticipated future features that <strong>never got implemented</strong>.</p>
<h3 id="signs-and-symptoms-17">Signs and Symptoms</h3>
<ul>
<li>Abstract classes with only one concrete implementation</li>
<li>Methods with parameters that are never used by any caller</li>
<li>Classes that exist &quot;just in case we need them someday&quot;</li>
<li>Overly complex design patterns applied to simple problems</li>
</ul>
<h3 id="reasons-for-the-problem-17">Reasons for the Problem</h3>
<ul>
<li>&quot;We'll need this someday&quot; -- but someday never comes</li>
<li>Overly enthusiastic application of <strong>design patterns</strong> and <strong>abstraction</strong></li>
<li>Created during a design phase that envisioned features that were later <strong>cancelled</strong></li>
<li>Desire to create a &quot;general-purpose&quot; framework when a specific solution sufficed</li>
</ul>
<p>Reference: <a href="https://refactoring.guru/smells/speculative-generality">RefactoringGuru -- Speculative Generality</a></p>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-e-dispensable-6----speculative-generality-treatment--payoff">Module E: Dispensable #6 -- Speculative Generality (Treatment &amp; Payoff)</h2>
<h3 id="treatment-refactoring-techniques-17">Treatment (Refactoring Techniques)</h3>
<table>
<thead>
<tr>
<th>Technique</th>
<th>When to Use</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Collapse Hierarchy</strong></td>
<td>Remove unnecessary abstract classes with only one subclass</td>
</tr>
<tr>
<td><strong>Inline Class</strong></td>
<td>Eliminate superfluous delegation between classes</td>
</tr>
<tr>
<td><strong>Inline Method</strong></td>
<td>Delete unused methods</td>
</tr>
<tr>
<td><strong>Remove Parameter</strong></td>
<td>Clean up methods with unneeded parameters</td>
</tr>
<tr>
<td><strong>Direct deletion</strong></td>
<td>Simply delete unused fields</td>
</tr>
</tbody>
</table>
<h3 id="payoff-17">Payoff</h3>
<ul>
<li><strong>Slimmer code</strong> -- less to read, understand, and maintain</li>
<li><strong>Cleaner architecture</strong> -- no phantom abstractions cluttering the design</li>
<li>Follows the <strong>YAGNI</strong> principle (You Aren't Gonna Need It)</li>
</ul>
<h3 id="when-to-ignore-12">When to Ignore</h3>
<ul>
<li>If you are working on a <strong>framework</strong>, it is reasonable to create functionality for users of the framework</li>
<li>If a test uses an abstract class or interface for mocking purposes</li>
<li>If the feature is in active planning and will be implemented in the next sprint</li>
</ul>

<h2 id="module-e-takeaway">Module E: Takeaway</h2>
<h3 id="key-points----dispensables">Key Points -- Dispensables</h3>
<table>
<thead>
<tr>
<th>Smell</th>
<th>Key Takeaway</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Comments</strong></td>
<td>Make code self-documenting; comments should explain &quot;why,&quot; not &quot;what&quot;</td>
</tr>
<tr>
<td><strong>Duplicate Code</strong></td>
<td>Extract common code; every change should only need to be made once</td>
</tr>
<tr>
<td><strong>Lazy Class</strong></td>
<td>If a class does not earn its keep, inline it</td>
</tr>
<tr>
<td><strong>Data Class</strong></td>
<td>Move behavior into the class alongside its data</td>
</tr>
<tr>
<td><strong>Dead Code</strong></td>
<td>Delete it -- Git remembers everything</td>
</tr>
<tr>
<td><strong>Speculative Generality</strong></td>
<td>YAGNI -- do not build for imagined future requirements</td>
</tr>
</tbody>
</table>
<h3 id="common-thread-3">Common Thread</h3>
<p>Dispensables are about <strong>removing unnecessary complexity</strong>. Less code means fewer bugs, easier maintenance, and faster comprehension. The simplest code that works is usually the best code.</p>
<blockquote>
<p>&quot;Perfection is achieved, not when there is nothing more to add, but when there is nothing left to take away.&quot; -- Antoine de Saint-Exupery</p>
</blockquote>
