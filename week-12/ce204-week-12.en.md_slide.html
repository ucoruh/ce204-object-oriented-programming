<header>CEN206 Object-Oriented Programming</header>

<h2 id="module-f-couplers----overview">Module F: Couplers -- Overview</h2>
<p>All the smells in this group contribute to <strong>excessive coupling</strong> between classes or show what happens if coupling is replaced by <strong>excessive delegation</strong>.</p>
<h3 id="the-4-coupler-smells">The 4 Coupler Smells</h3>
<table>
<thead>
<tr>
<th>#</th>
<th>Smell</th>
<th>Key Issue</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td><strong>Feature Envy</strong></td>
<td>A method accesses data of another object more than its own</td>
</tr>
<tr>
<td>2</td>
<td><strong>Inappropriate Intimacy</strong></td>
<td>One class uses internal fields/methods of another class</td>
</tr>
<tr>
<td>3</td>
<td><strong>Message Chains</strong></td>
<td><code>a.getB().getC().getD().doSomething()</code></td>
</tr>
<tr>
<td>4</td>
<td><strong>Middle Man</strong></td>
<td>A class only delegates to another class</td>
</tr>
</tbody>
</table>
<blockquote>
<p>These smells represent different ways that excessive coupling manifests in code, either through direct data access or through chains of delegation that create brittle dependencies.</p>
</blockquote>
<p>Reference: <a href="https://refactoring.guru/refactoring/smells/couplers">RefactoringGuru -- Couplers</a></p>

<h2 id="module-f-coupler-1----feature-envy">Module F: Coupler #1 -- Feature Envy</h2>
<h3 id="what-is-it-18">What Is It?</h3>
<p>A method accesses the <strong>data of another object</strong> more than its own data. The method is &quot;envious&quot; of another class.</p>
<h3 id="signs-and-symptoms-18">Signs and Symptoms</h3>
<ul>
<li>A method that calls many getters of another object</li>
<li>The method uses more fields/methods from another class than from its own</li>
<li>The method seems like it belongs in another class</li>
</ul>
<h3 id="reasons-for-the-problem-18">Reasons for the Problem</h3>
<ul>
<li>This smell frequently emerges when fields get relocated to a <strong>data class</strong></li>
<li>If this is the case, you may want to move the operations on data to that class as well</li>
<li>A method was placed in the <strong>wrong class</strong> during development</li>
<li>It operates more on another class's data than its own</li>
</ul>
<p>Reference: <a href="https://refactoring.guru/smells/feature-envy">RefactoringGuru -- Feature Envy</a></p>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-f-coupler-1----feature-envy-treatment--payoff">Module F: Coupler #1 -- Feature Envy (Treatment &amp; Payoff)</h2>
<h3 id="treatment-refactoring-techniques-18">Treatment (Refactoring Techniques)</h3>
<table>
<thead>
<tr>
<th>Technique</th>
<th>When to Use</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Move Method</strong></td>
<td>Move the method to the class whose data it uses most</td>
</tr>
<tr>
<td><strong>Extract Method</strong></td>
<td>If only a portion of the method envies another object, extract that part and move it</td>
</tr>
</tbody>
</table>
<h3 id="payoff-18">Payoff</h3>
<ul>
<li>Less <strong>code duplication</strong> (if the envious logic was duplicated elsewhere)</li>
<li>Better <strong>code organization</strong> -- data and its behavior are in the same place</li>
</ul>
<h3 id="when-to-ignore-13">When to Ignore</h3>
<ul>
<li>When Feature Envy is used <strong>purposefully</strong> in behavioral design patterns:
<ul>
<li><strong>Strategy Pattern</strong>: Behavior is intentionally separated from the data class</li>
<li><strong>Visitor Pattern</strong>: Operations are separated from the object structure</li>
<li><strong>Command Pattern</strong>: Commands operate on data from other objects</li>
</ul>
</li>
</ul>
<blockquote>
<p>If a method clearly belongs to a design pattern that deliberately separates data from behavior, Feature Envy is acceptable.</p>
</blockquote>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-f-coupler-2----inappropriate-intimacy">Module F: Coupler #2 -- Inappropriate Intimacy</h2>
<h3 id="what-is-it-19">What Is It?</h3>
<p>One class uses the <strong>internal fields and methods</strong> of another class. Good classes should know as little about each other as possible -- this makes classes easier to maintain and reuse.</p>
<h3 id="signs-and-symptoms-19">Signs and Symptoms</h3>
<ul>
<li>A class directly accesses another class's fields (especially non-private ones)</li>
<li>A class depends on the internal implementation details of another class</li>
<li>Bidirectional dependencies where two classes reference each other's internals</li>
<li>Changing one class frequently breaks the other</li>
</ul>
<h3 id="reasons-for-the-problem-19">Reasons for the Problem</h3>
<ul>
<li>Classes that spend too much time together delving into each other's private parts</li>
<li>Often results from <strong>incremental development</strong> where boundaries were not carefully maintained</li>
<li>Tight coupling built up over time through convenience-driven coding</li>
</ul>
<p>Reference: <a href="https://refactoring.guru/smells/inappropriate-intimacy">RefactoringGuru -- Inappropriate Intimacy</a></p>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-f-coupler-2----inappropriate-intimacy-treatment--payoff">Module F: Coupler #2 -- Inappropriate Intimacy (Treatment &amp; Payoff)</h2>
<h3 id="treatment-refactoring-techniques-19">Treatment (Refactoring Techniques)</h3>
<table>
<thead>
<tr>
<th>Technique</th>
<th>When to Use</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Move Method / Move Field</strong></td>
<td>Move parts of one class to the class they are most related to</td>
</tr>
<tr>
<td><strong>Extract Class</strong> and <strong>Hide Delegate</strong></td>
<td>Formalize the relationship by extracting shared functionality into a separate class</td>
</tr>
<tr>
<td><strong>Change Bidirectional Association to Unidirectional</strong></td>
<td>When two classes depend on each other mutually, convert to one-way dependency</td>
</tr>
<tr>
<td><strong>Replace Delegation with Inheritance</strong></td>
<td>When one class really is a specialized version of another</td>
</tr>
</tbody>
</table>
<h3 id="payoff-19">Payoff</h3>
<ul>
<li>Enhanced <strong>code organization</strong> and structure</li>
<li>Simplified <strong>maintenance</strong> and improved code reusability</li>
<li>Better <strong>encapsulation</strong> -- classes expose only what they need to</li>
<li>Adheres to the <strong>Law of Demeter</strong> (principle of least knowledge)</li>
</ul>
<blockquote>
<p>&quot;Each unit should have only limited knowledge about other units: only units closely related to the current unit.&quot; -- Law of Demeter</p>
</blockquote>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-f-coupler-3----message-chains">Module F: Coupler #3 -- Message Chains</h2>
<h3 id="what-is-it-20">What Is It?</h3>
<p>In code you see a series of calls resembling <code>a.getB().getC().getD()</code>. These chains mean that the client is <strong>coupled to the navigation structure</strong> of the class hierarchy.</p>
<h3 id="signs-and-symptoms-20">Signs and Symptoms</h3>
<ul>
<li>Long chains of method calls traversing an object graph</li>
<li>The client needs to know the internal structure of multiple classes</li>
<li>Any change to the intermediate relationships requires modifying the client</li>
</ul>
<h3 id="reasons-for-the-problem-20">Reasons for the Problem</h3>
<ul>
<li>Message chains are created when a client needs to navigate an <strong>object graph</strong> to find the information it needs</li>
<li>The client requests an object, which requests another object, which requests yet another one</li>
<li>This creates tight coupling to the entire navigation structure</li>
</ul>
<p>Reference: <a href="https://refactoring.guru/smells/message-chains">RefactoringGuru -- Message Chains</a></p>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-f-coupler-3----message-chains-treatment--payoff">Module F: Coupler #3 -- Message Chains (Treatment &amp; Payoff)</h2>
<h3 id="treatment-refactoring-techniques-20">Treatment (Refactoring Techniques)</h3>
<table>
<thead>
<tr>
<th>Technique</th>
<th>When to Use</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Hide Delegate</strong></td>
<td>Create wrapper methods that encapsulate the chain at each level</td>
</tr>
<tr>
<td><strong>Extract Method</strong></td>
<td>Extract the chain into a well-named method</td>
</tr>
<tr>
<td><strong>Move Method</strong></td>
<td>Move the method that uses the chain to the class that has the data</td>
</tr>
</tbody>
</table>
<h3 id="payoff-20">Payoff</h3>
<ul>
<li>Reduces <strong>dependencies</strong> between classes in a chain</li>
<li>Reduces the amount of <strong>bloated code</strong> in the client</li>
<li>The client is decoupled from the internal navigation structure</li>
<li>Changes to intermediate classes do not ripple to clients</li>
</ul>
<h3 id="when-to-ignore-14">When to Ignore</h3>
<ul>
<li><strong>Overly aggressive delegate hiding</strong> can result in the <strong>Middle Man</strong> smell</li>
<li>If the chain reflects a <strong>stable, well-known structure</strong> (e.g., <code>request.getSession().getAttribute()</code>), it may be acceptable</li>
<li>Find the right balance: neither too many chains nor too many delegate methods</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Message Chain  &lt;------- Balance -------&gt;  Middle Man
(too much coupling)                    (too much delegation)
</code></pre>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-12</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-f-coupler-4----middle-man">Module F: Coupler #4 -- Middle Man</h2>
<h3 id="what-is-it-21">What Is It?</h3>
<p>If a class performs <strong>only one action</strong> -- delegating work to another class -- why does it exist at all?</p>
<h3 id="signs-and-symptoms-21">Signs and Symptoms</h3>
<ul>
<li>A class where the majority of methods simply forward calls to another class</li>
<li>The class adds no logic, no validation, no transformation</li>
<li>Clients could just as easily call the delegate directly</li>
</ul>
<h3 id="reasons-for-the-problem-21">Reasons for the Problem</h3>
<ul>
<li><strong>Overzealous elimination of Message Chains</strong> -- developers may have aggressively refactored to break up method chains, inadvertently creating unnecessary intermediary classes</li>
<li><strong>Gradual erosion of responsibility</strong> -- a class's useful functionality gets progressively moved elsewhere, leaving behind an empty shell that merely delegates</li>
</ul>
<p>Reference: <a href="https://refactoring.guru/smells/middle-man">RefactoringGuru -- Middle Man</a></p>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-f-coupler-4----middle-man-treatment--payoff">Module F: Coupler #4 -- Middle Man (Treatment &amp; Payoff)</h2>
<h3 id="treatment-refactoring-techniques-21">Treatment (Refactoring Techniques)</h3>
<table>
<thead>
<tr>
<th>Technique</th>
<th>When to Use</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Remove Middle Man</strong></td>
<td>Have the client call the end object directly when most methods are pure delegation</td>
</tr>
<tr>
<td><strong>Inline Method</strong></td>
<td>For trivial delegation methods</td>
</tr>
<tr>
<td><strong>Replace Delegation with Inheritance</strong></td>
<td>If the middle man always delegates to the same class, consider making it a subclass</td>
</tr>
</tbody>
</table>
<h3 id="payoff-21">Payoff</h3>
<ul>
<li><strong>Less bloated code</strong> -- no unnecessary intermediary classes</li>
<li><strong>Clearer code</strong> -- you can see where work actually happens</li>
<li>Simpler class hierarchy</li>
</ul>
<h3 id="when-to-ignore-15">When to Ignore</h3>
<ul>
<li>A Middle Man may have been added to <strong>avoid inter-class dependencies</strong> intentionally</li>
<li>Middle Man can be a deliberate part of the <strong>Facade</strong>, <strong>Proxy</strong>, or <strong>Decorator</strong> patterns</li>
<li>If removing it would expose too many internals of the delegate class, keep it</li>
<li>Do not remove Middle Man if doing so would create <strong>Message Chains</strong> -- find the right balance</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-f-takeaway">Module F: Takeaway</h2>
<h3 id="key-points----couplers">Key Points -- Couplers</h3>
<table>
<thead>
<tr>
<th>Smell</th>
<th>Key Takeaway</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Feature Envy</strong></td>
<td>Move the method to the class whose data it uses most</td>
</tr>
<tr>
<td><strong>Inappropriate Intimacy</strong></td>
<td>Enforce encapsulation; classes should know as little about each other as possible</td>
</tr>
<tr>
<td><strong>Message Chains</strong></td>
<td>Hide delegates to reduce client coupling to navigation structure</td>
</tr>
<tr>
<td><strong>Middle Man</strong></td>
<td>If a class only delegates, let clients call the delegate directly</td>
</tr>
</tbody>
</table>
<h3 id="the-coupling-spectrum">The Coupling Spectrum</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Tight Coupling &lt;-------- Goal --------&gt; Loose Coupling
(Feature Envy,          (Right balance)   (Middle Man,
 Inappropriate                             Excessive
 Intimacy)                                 Delegation)
</code></pre>
<blockquote>
<p>The goal is <strong>just enough coupling</strong> -- not so much that changes ripple everywhere, and not so little that code becomes a maze of trivial delegations.</p>
</blockquote>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-12</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="summary-all-22-code-smells-at-a-glance">Summary: All 22 Code Smells at a Glance</h2>
<table>
<thead>
<tr>
<th>Category</th>
<th>Smells</th>
<th>Core Problem</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Bloaters</strong></td>
<td>Long Method, Large Class, Primitive Obsession, Long Parameter List, Data Clumps</td>
<td>Code that has grown too large</td>
</tr>
<tr>
<td><strong>OO Abusers</strong></td>
<td>Switch Statements, Temporary Field, Refused Bequest, Alternative Classes with Different Interfaces</td>
<td>Incorrect application of OOP</td>
</tr>
<tr>
<td><strong>Change Preventers</strong></td>
<td>Divergent Change, Shotgun Surgery, Parallel Inheritance Hierarchies</td>
<td>Changes require disproportionate effort</td>
</tr>
<tr>
<td><strong>Dispensables</strong></td>
<td>Comments, Duplicate Code, Lazy Class, Data Class, Dead Code, Speculative Generality</td>
<td>Unnecessary complexity</td>
</tr>
<tr>
<td><strong>Couplers</strong></td>
<td>Feature Envy, Inappropriate Intimacy, Message Chains, Middle Man</td>
<td>Excessive coupling or delegation</td>
</tr>
</tbody>
</table>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="summary-key-refactoring-principles">Summary: Key Refactoring Principles</h2>
<h3 id="remember">Remember</h3>
<ul>
<li>Code smells are <strong>indicators</strong>, not absolute rules -- context matters</li>
<li>Every smell has a &quot;When to Ignore&quot; case</li>
<li>Refactoring is about making <strong>small, safe changes</strong> continuously</li>
<li>The best time to refactor is <strong>now</strong> -- technical debt only grows</li>
<li>Never mix refactoring and feature development in the same commit</li>
<li>All existing tests must pass after refactoring</li>
</ul>
<h3 id="the-refactoring-mindset">The Refactoring Mindset</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code> Detect Smell --&gt; Choose Technique --&gt; Apply Small Change --&gt; Run Tests
      ^                                                          |
      |                                                          v
      +-------------------- Repeat if needed -------------------+
</code></pre>
<blockquote>
<p>&quot;The key to refactoring is working in small steps. You make a small change, test, make another small change, test.&quot; -- Martin Fowler</p>
</blockquote>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-12</footer>
