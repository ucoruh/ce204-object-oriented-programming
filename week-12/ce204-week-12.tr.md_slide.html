<h2 id="i%CC%87%C3%A7erik-devam%C4%B1">İçerik (Devamı)</h2>
<h3 id="kapsanan-t%C3%BCm-22-kod-kokusu">Kapsanan Tüm 22 Kod Kokusu</h3>
<table>
<thead>
<tr>
<th>Kategori</th>
<th>Kokular</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Şişkinler (Bloaters)</strong> (5)</td>
<td>Uzun Metot (Long Method), Büyük Sınıf (Large Class), İlkel Takıntı (Primitive Obsession), Uzun Parametre Listesi (Long Parameter List), Veri Kümeleri (Data Clumps)</td>
</tr>
<tr>
<td><strong>NE Kötüye Kullananlar (OO Abusers)</strong> (4)</td>
<td>Switch İfadeleri (Switch Statements), Geçici Alan (Temporary Field), Reddedilen Miras (Refused Bequest), Farklı Arayüzlere Sahip Alternatif Sınıflar (Alternative Classes with Different Interfaces)</td>
</tr>
<tr>
<td><strong>Değişim Engelleyiciler (Change Preventers)</strong> (3)</td>
<td>Iraksak Değişim (Divergent Change), Saçma Ameliyat (Shotgun Surgery), Paralel Kalıtım Hiyerarşileri (Parallel Inheritance Hierarchies)</td>
</tr>
<tr>
<td><strong>Gereksizler (Dispensables)</strong> (6)</td>
<td>Yorumlar (Comments), Tekrarlanan Kod (Duplicate Code), Tembel Sınıf (Lazy Class), Veri Sınıfı (Data Class), Ölü Kod (Dead Code), Spekülatif Genellik (Speculative Generality)</td>
</tr>
<tr>
<td><strong>Bağlayıcılar (Couplers)</strong> (4)</td>
<td>Özellik Kıskançlığı (Feature Envy), Uygunsuz Yakınlık (Inappropriate Intimacy), Mesaj Zincirleri (Message Chains), Aracı (Middle Man)</td>
</tr>
</tbody>
</table>

<h2 id="mod%C3%BCl-a-yeniden-yap%C4%B1land%C4%B1rma-nedir----tan%C4%B1m">Modül A: Yeniden Yapılandırma Nedir? -- Tanım</h2>
<p><strong>Yeniden yapılandırma (Refactoring)</strong>, kodun <strong>dış davranışını değiştirmeden</strong> iç yapısını iyileştirmenin sistematik bir sürecidir.</p>
<ul>
<li>Yeniden yapılandırmanın temel amacı <strong>teknik borçla mücadele etmektir</strong></li>
<li>Dağınık, kötü tasarlanmış kodu temiz, iyi tasarlanmış koda dönüştürür</li>
<li>Yeniden yapılandırma, hata düzeltme veya yeni özellik ekleme <strong>değildir</strong></li>
<li>Kodu daha kolay anlaşılır, bakımı yapılabilir ve genişletilebilir hale getirmekle ilgilidir</li>
<li>Bunu bir dizi <strong>küçük, davranışı koruyan dönüşüm</strong> uygulamak olarak düşünün</li>
</ul>
<blockquote>
<p>&quot;Yeniden yapılandırma, mevcut bir kod tabanının tasarımını iyileştirmek için kontrollü bir tekniktir. Özü, her biri tek başına yapılmaya değmeyecek kadar küçük olan bir dizi küçük davranış koruyucu dönüşüm uygulamaktır. Ancak bu dönüşümlerin her birinin kümülatif etkisi oldukça önemlidir.&quot;<br />
-- Martin Fowler</p>
</blockquote>
<p>Referans: <a href="https://refactoring.guru/refactoring/what-is-refactoring">RefactoringGuru -- Yeniden Yapılandırma Nedir</a></p>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="mod%C3%BCl-a-kirli-kod-vs-temiz-kod">Modül A: Kirli Kod vs. Temiz Kod</h2>
<h3 id="kirli-kod-nedir">Kirli Kod Nedir?</h3>
<p>Kirli kod, okunması zor, değiştirilmesi zor ve bakımı zor olan koddur. Kısayollar, acele teslim tarihleri ve disiplin eksikliği nedeniyle zamanla birikir.</p>
<h3 id="temiz-kod-nedir">Temiz Kod Nedir?</h3>
<p>Temiz kod bunun tam tersidir -- açık, bakımı kolay ve çalışması keyifli olan koddur.</p>
<blockquote>
<p>&quot;Yeniden yapılandırmanın temel amacı teknik borçla mücadele etmektir. Dağınıklığı temiz koda ve basit tasarıma dönüştürür.&quot;</p>
</blockquote>
<h3 id="i%CC%87li%C5%9Fki">İlişki</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Kirli Kod  --[yeniden yapılandırma]--&gt;  Temiz Kod
     |                                      |
     v                                      v
  Bakımı zor                         Bakımı kolay
  Değiştirmesi pahalı                Değiştirmesi ucuz
  Gizli hatalarla dolu               Hatalar görünür
</code></pre>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-12</footer>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="mod%C3%BCl-a-temiz-kod-%C3%B6zellikleri">Modül A: Temiz Kod Özellikleri</h2>
<p>Temiz kod, kirli koddan ayıran <strong>dört temel özelliğe</strong> sahiptir:</p>
<h3 id="1-temiz-kod-di%C4%9Fer-programc%C4%B1lar-i%CC%87%C3%A7in-a%C3%A7%C4%B1kt%C4%B1r">1. Temiz Kod Diğer Programcılar İçin Açıktır</h3>
<ul>
<li>Kötü değişken adları, şişmiş sınıflar ve sihirli sayılar kodu özensiz ve kavranması zor hale getirir</li>
<li>İyi kod neredeyse iyi yazılmış bir düzyazı gibi okunur</li>
<li>Diğer geliştiriciler kapsamlı dokümantasyon olmadan anlayabilir</li>
</ul>
<h3 id="2-temiz-kod-tekrarlama-i%CC%87%C3%A7ermez">2. Temiz Kod Tekrarlama İçermez</h3>
<ul>
<li>Tekrarlanan kodda her değişiklik yaptığınızda, aynı değişikliği her örnekte yapmayı hatırlamanız gerekir</li>
<li>Bilişsel yükü artırır ve ilerlemeyi yavaşlatır</li>
<li>DRY (Kendini Tekrar Etme - Don't Repeat Yourself) ilkesini ihlal eder</li>
</ul>
<blockquote>
<p>&quot;Tekrarlanan kodda her değişiklik yapmanız gerektiğinde, aynı değişikliği her örnekte yapmayı hatırlamanız gerekir.&quot; -- RefactoringGuru</p>
</blockquote>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-12</footer>
</section>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="mod%C3%BCl-a-temiz-kod-%C3%B6zellikleri-devam%C4%B1">Modül A: Temiz Kod Özellikleri (Devamı)</h2>
<h3 id="3-temiz-kod-minimum-say%C4%B1da-s%C4%B1n%C4%B1f-ve-hareketli-par%C3%A7a-i%CC%87%C3%A7erir">3. Temiz Kod Minimum Sayıda Sınıf ve Hareketli Parça İçerir</h3>
<ul>
<li>&quot;Daha az kod, akılda tutulacak daha az şey demektir&quot;</li>
<li>&quot;Daha az kod, daha az bakım demektir&quot;</li>
<li>Daha az kod, daha az hata demektir</li>
<li>Kod bir <strong>yükümlülüktür</strong>, varlık değil -- en aza indirin</li>
</ul>
<h3 id="4-temiz-kod-t%C3%BCm-testleri-ge%C3%A7er">4. Temiz Kod Tüm Testleri Geçer</h3>
<ul>
<li>Testlerin yüzde sıfırını geçen kod kirli koddur</li>
<li>%95 temiz olan ancak testleri geçmeyen kod yeterince temiz değildir</li>
<li>Testler, yeniden yapılandırma için bir güvenlik ağı görevi görür</li>
</ul>
<h3 id="sonu%C3%A7">Sonuç</h3>
<blockquote>
<p><strong>&quot;Temiz kodun bakımı daha kolay ve daha ucuzdur!&quot;</strong></p>
</blockquote>
<ul>
<li>Bir yazılım projesinin yaşam döngüsünün büyük bölümü bakıma harcanır</li>
<li>Temiz kod, süregelen geliştirme maliyetini azaltır</li>
<li>Yeni ekip üyeleri daha hızlı adapte olabilir</li>
</ul>
<p>Referans: <a href="https://refactoring.guru/refactoring/clean-code">RefactoringGuru -- Temiz Kod</a></p>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="mod%C3%BCl-a-teknik-bor%C3%A7----metafor">Modül A: Teknik Borç -- Metafor</h2>
<h3 id="teknik-bor%C3%A7-nedir">Teknik Borç Nedir?</h3>
<p>Teknik borç, <strong>Ward Cunningham</strong> tarafından ortaya atılan bir metafordur. Hızlı ve özensiz kodlama kararlarını finansal borçla karşılaştırır:</p>
<ul>
<li><strong>Borç almak:</strong> Hızlı, özensiz kod yazarak şimdi daha hızlı teslim edersiniz</li>
<li><strong>Faiz ödemeleri:</strong> Kirli kodla her çalışmanızda, onu anlamak ve değiştirmek için ekstra zaman harcarsınız</li>
<li><strong>İflas:</strong> Sonunda kod tabanı o kadar dağınık hale gelir ki ileri geliştirme neredeyse imkansız olur</li>
</ul>
<blockquote>
<p>&quot;Yeni özellikler için test yazmadan geçici olarak hızlanabilirsiniz, ancak bu, sonunda borcu test yazarak ödeyene kadar ilerlemenizi her gün yavaşlatacaktır.&quot; -- RefactoringGuru</p>
</blockquote>
<h3 id="bor%C3%A7-sarmal%C4%B1">Borç Sarmalı</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Hızlı ve Özensiz Kod  --&gt;  Teknik Borç Birikir
       |                         |
       v                         v
  Şimdi Daha Hızlı Teslim  Geliştirme Yavaşlar
       |                         |
       v                         v
  Daha Fazla Kısayol       Daha Fazla Hata, Daha Fazla Karmaşıklık
       |                         |
       v                         v
  Daha da Fazla Borç   --&gt;  Proje Bakılamaz Hale Gelebilir
</code></pre>
<p>Referans: <a href="https://refactoring.guru/refactoring/technical-debt">RefactoringGuru -- Teknik Borç</a></p>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="mod%C3%BCl-a-teknik-bor%C3%A7-nedenleri">Modül A: Teknik Borç Nedenleri</h2>
<table>
<thead>
<tr>
<th>#</th>
<th>Neden</th>
<th>Açıklama</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td><strong>İş baskısı</strong></td>
<td>Acele özellik sürümleri, geçici yamaları üretim koduna zorlar</td>
</tr>
<tr>
<td>2</td>
<td><strong>Sonuçları anlama eksikliği</strong></td>
<td>Yönetim, borcun zamanla nasıl birleştiğini fark etmeyebilir</td>
</tr>
<tr>
<td>3</td>
<td><strong>Bileşenlerin sıkı tutarlılığıyla mücadele edememe</strong></td>
<td>Monolitik mimariler sıkı bağlantı oluşturur, izole değişiklikleri imkansız kılar</td>
</tr>
<tr>
<td>4</td>
<td><strong>Test eksikliği</strong></td>
<td>Eksik test kapsamı, teste tabi tutulmadan üretime ulaşan riskli geçici çözümleri teşvik eder</td>
</tr>
<tr>
<td>5</td>
<td><strong>Dokümantasyon eksikliği</strong></td>
<td>Yeni ekip üyeleri adaptasyonda zorlanır, ayrılan uzmanlar bilgi boşlukları oluşturur</td>
</tr>
<tr>
<td>6</td>
<td><strong>Ekip üyeleri arasında etkileşim eksikliği</strong></td>
<td>Dağıtılmış bilgi, güncel olmayan anlayışa yol açar</td>
</tr>
<tr>
<td>7</td>
<td><strong>Dallarda uzun süreli eşzamanlı geliştirme</strong></td>
<td>İzole dal çalışması, birleştirme sırasında birleşen borç biriktirir</td>
</tr>
<tr>
<td>8</td>
<td><strong>Ertelenmiş yeniden yapılandırma</strong></td>
<td>Mimari güncellemeleri ertelemek, gelecekte yeniden çalışma gerektiren yaygın bağımlı kod oluşturur</td>
</tr>
<tr>
<td>9</td>
<td><strong>Uyumluluk izleme eksikliği</strong></td>
<td>Tutarsız standartlar ve yetersiz geliştirici becerisi borç birikimine katkıda bulunur</td>
</tr>
</tbody>
</table>
<h3 id="temel-bak%C4%B1%C5%9F-a%C3%A7%C4%B1s%C4%B1">Temel Bakış Açısı</h3>
<ul>
<li>Herkes zaman zaman teknik borç biriktirir</li>
<li>Önemli olan kontrolden çıkmasına izin vermemektir</li>
<li><strong>Yeniden yapılandırma, teknik borcu ödemenin birincil yöntemidir</strong></li>
</ul>

<h2 id="mod%C3%BCl-a-ne-zaman-yeniden-yap%C4%B1land%C4%B1r%C4%B1l%C4%B1r----%C3%BC%C3%A7ler-kural%C4%B1">Modül A: Ne Zaman Yeniden Yapılandırılır -- Üçler Kuralı</h2>
<p><strong>Üçler Kuralı</strong>, ne zaman yeniden yapılandırma yapılacağına karar vermek için basit bir sezgisel yöntemdir:</p>
<h3 id="1-i%CC%87lk-sefer----sadece-yap%C4%B1n">1. İlk Sefer -- Sadece Yapın</h3>
<ul>
<li>Bir şeyi ilk kez yapıyorsanız, sadece tamamlayın</li>
<li>Kod mükemmel olmasa bile ilerleyin</li>
</ul>
<h3 id="2-i%CC%87kinci-sefer----tekrarlamaya-i%CC%87%C3%A7erlenin">2. İkinci Sefer -- Tekrarlamaya İçerlenin</h3>
<ul>
<li>Benzer bir şeyi ikinci kez yaptığınızda, kendinizi tekrarlamak zorunda kalmanıza içerlenin</li>
<li>Ama yine de yapın (şimdilik)</li>
</ul>
<h3 id="3-%C3%BC%C3%A7%C3%BCnc%C3%BC-sefer----yeniden-yap%C4%B1land%C4%B1r%C4%B1n">3. Üçüncü Sefer -- Yeniden Yapılandırın</h3>
<ul>
<li>Bir şeyi <strong>üçüncü kez</strong> yapıyorsanız, yeniden yapılandırma zamanıdır</li>
<li>Üç deneme ve yeniden yapılandırırsınız!</li>
</ul>
<blockquote>
<p>&quot;Bir şeyi ilk kez yaptığınızda, sadece yapın. İkinci kez tekrarlamaya içerlenirsiniz ama yine de yaparsınız. Üçüncü kez yeniden yapılandırırsınız.&quot; -- RefactoringGuru</p>
</blockquote>
<p>Referans: <a href="https://refactoring.guru/refactoring/when">RefactoringGuru -- Ne Zaman Yeniden Yapılandırılır</a></p>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="mod%C3%BCl-a-ne-zaman-yeniden-yap%C4%B1land%C4%B1r%C4%B1l%C4%B1r----belirli-durumlar">Modül A: Ne Zaman Yeniden Yapılandırılır -- Belirli Durumlar</h2>
<h3 id="%C3%B6zellik-eklerken">Özellik Eklerken</h3>
<p>Yeniden yapılandırma, özellik eklerken iki şekilde yardımcı olur:</p>
<ol>
<li><strong>Başkalarının Kodunu Anlama</strong> -- Kodu daha açık hale getirmek için yeniden yapılandırma, neler olduğunu anlamanıza yardımcı olur. &quot;Temiz kodda değişiklik yapmak çok daha kolaydır.&quot;</li>
<li><strong>Eklemeyi Kolaylaştırma</strong> -- Bazen mevcut kod yapısı yeni bir özellik eklemeyi çok zorlaştırır. Önce yeniden yapılandırma yapmak yeni özelliği çok daha kolay uygulanabilir hale getirebilir.</li>
</ol>
<h3 id="hata-d%C3%BCzeltirken">Hata Düzeltirken</h3>
<ul>
<li>&quot;Koddaki hatalar tıpkı gerçek hayattakiler gibi davranır: kodun en karanlık, en kirli yerlerinde yaşarlar.&quot;</li>
<li>Sorunlu kodu önce temizleyerek, hatalar daha kolay tanımlanır ve çözülür</li>
<li>Yöneticiler hataların düzeltilmesi gerektiğini anlar, bu nedenle yeniden yapılandırmayı hata düzeltmeleriyle birleştirebilirsiniz</li>
</ul>
<h3 id="kod-i%CC%87ncelemesi-s%C4%B1ras%C4%B1nda">Kod İncelemesi Sırasında</h3>
<ul>
<li>Kod incelemesi, kod kamuya açık hale gelmeden önce düzenlemenin <strong>son şansıdır</strong></li>
<li>İkili çalışmada en iyi sonuç verir: inceleyici değişiklikler önerir ve yazar bunları hemen uygular</li>
<li>Basit yeniden yapılandırmalarla başlayın, karmaşık olanları takip görevleri olarak ele alın</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-12</footer>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="mod%C3%BCl-a-nas%C4%B1l-yeniden-yap%C4%B1land%C4%B1r%C4%B1l%C4%B1r----temel-i%CC%87lke">Modül A: Nasıl Yeniden Yapılandırılır -- Temel İlke</h2>
<blockquote>
<p>&quot;Yeniden yapılandırma, her biri mevcut kodu biraz daha iyi hale getirirken programı çalışır durumda bırakan bir dizi küçük değişiklik olarak yapılmalıdır.&quot; -- RefactoringGuru</p>
</blockquote>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Çalışan Kod --&gt; Küçük Değişiklik --&gt; Hala Çalışan Kod
     |                                   |
     v                                   v
  Test Geçer                          Test Geçer
     |                                   |
     v                                   v
Küçük Değişiklik --&gt; Hala Çalışan Kod --&gt; Küçük Değişiklik ...
</code></pre>
<ul>
<li>Her bireysel yeniden yapılandırma o kadar küçüktür ki yanlış gitme olasılığı çok düşüktür</li>
<li>Sistem her küçük adımdan sonra tam işlevsel kalır</li>
<li>Bir şey bozulursa, tam olarak hangi küçük değişikliğin neden olduğunu bilirsiniz</li>
</ul>
<p>Referans: <a href="https://refactoring.guru/refactoring/how-to">RefactoringGuru -- Nasıl Yeniden Yapılandırılır</a></p>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="mod%C3%BCl-a-yeniden-yap%C4%B1land%C4%B1rma-kontrol-listesi">Modül A: Yeniden Yapılandırma Kontrol Listesi</h2>
<p>Yeniden yapılandırma öncesinde, sırasında ve sonrasında şu üç koşulu doğrulayın:</p>
<h3 id="1-kod-daha-temiz-olmal%C4%B1d%C4%B1r">1. Kod Daha Temiz Olmalıdır</h3>
<ul>
<li>Yeniden yapılandırma sonrasında kod hala aynı derecede kirli ise, zaman kaybediyorsunuz</li>
<li>Bazen bu, birden fazla yeniden yapılandırmayı tek bir büyük değişiklikte birleştirdiğinizde olur</li>
<li>Ciddi sorunlu kodlar için tam yeniden yazma düşünün -- ancak yalnızca testleri yazdıktan ve yeterli zaman ayırdıktan sonra</li>
</ul>
<h3 id="2-yeniden-yap%C4%B1land%C4%B1rma-s%C4%B1ras%C4%B1nda-yeni-i%CC%87%C5%9Flevsellik-olu%C5%9Fturulmamal%C4%B1d%C4%B1r">2. Yeniden Yapılandırma Sırasında Yeni İşlevsellik Oluşturulmamalıdır</h3>
<ul>
<li>&quot;Yeniden yapılandırmayı ve yeni özelliklerin doğrudan geliştirilmesini karıştırmayın&quot;</li>
<li>Yeniden yapılandırma ve yeni özellikleri netlik ve izlenebilirlik için <strong>ayrı commit'ler</strong> olarak tutun</li>
</ul>
<h3 id="3-t%C3%BCm-mevcut-testler-ge%C3%A7melidir">3. Tüm Mevcut Testler Geçmelidir</h3>
<ul>
<li>Yeniden yapılandırma sonrasında tüm mevcut testler hala geçmelidir</li>
<li><strong>Senaryo 1:</strong> Yeniden yapılandırma sırasında bir hata yaptınız -- küçük hatayı düzeltin</li>
<li><strong>Senaryo 2:</strong> Testler çok düşük seviyeydi (davranış yerine özel metotları test ediyordu) -- testleri yeniden yapılandırın veya daha yüksek seviye BDD tarzı testler yazın</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-12</footer>

<h2 id="mod%C3%BCl-a-g%C3%BCvenli-yeniden-yap%C4%B1land%C4%B1rma-i%CC%87%C5%9F-ak%C4%B1%C5%9F%C4%B1">Modül A: Güvenli Yeniden Yapılandırma İş Akışı</h2>
<h3 id="ad%C4%B1m-ad%C4%B1m-s%C3%BCre%C3%A7">Adım Adım Süreç</h3>
<ol>
<li><strong>Yeniden yapılandırmak istediğiniz kod için kapsamlı bir test paketine sahip olduğunuzdan emin olun</strong></li>
<li><strong>Her seferinde bir küçük değişiklik yapın</strong></li>
<li><strong>Her değişiklikten sonra tüm testleri çalıştırın</strong></li>
<li><strong>Testler geçerse</strong>, bir sonraki değişikliğe geçin</li>
<li><strong>Testler başarısız olursa</strong>, değişikliği hemen geri alın ve farklı bir yaklaşım deneyin</li>
<li><strong>Sık sık commit yapın</strong> böylece bir şeyler ters giderse kolayca geri dönebilirsiniz</li>
<li><strong>Nihai sonucu gözden geçirin</strong> -- kod daha temiz mi?</li>
</ol>
<h3 id="yard%C4%B1mc%C4%B1-ara%C3%A7lar">Yardımcı Araçlar</h3>
<table>
<thead>
<tr>
<th>Araç</th>
<th>Amaç</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Sürüm kontrolü (Git)</strong></td>
<td>Kötü değişikliklerin kolay geri alınması</td>
</tr>
<tr>
<td><strong>Otomatik testler</strong></td>
<td>Her değişiklikten sonra davranışı doğrulama</td>
</tr>
<tr>
<td><strong>IDE yeniden yapılandırma araçları</strong></td>
<td>Otomatik yeniden adlandırma, metot çıkarma vb.</td>
</tr>
<tr>
<td><strong>Sürekli Entegrasyon</strong></td>
<td>Gerilemeleri erken yakalar</td>
</tr>
</tbody>
</table>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="mod%C3%BCl-a-%C3%B6zet">Modül A: Özet</h2>
<h3 id="temel-noktalar----yeniden-yap%C4%B1land%C4%B1rma-nedir">Temel Noktalar -- Yeniden Yapılandırma Nedir?</h3>
<ul>
<li><strong>Yeniden yapılandırma</strong> = dış davranışı değiştirmeden kod yapısını iyileştirme</li>
<li><strong>Temiz kod</strong> açık, tekrardan arınmış, minimum, test edilmiş ve bakımı kolaydır</li>
<li><strong>Kirli kod</strong>, gelecek geliştirmeyi yavaşlatan <strong>teknik borç</strong> oluşturur</li>
<li>Teknik borç; iş baskısı, test eksikliği, kötü dokümantasyon, sıkı bağlı bileşenler ve daha fazlasından kaynaklanır</li>
<li><strong>Üçler Kuralını</strong> kullanın: ilk seferde yapın, ikinci seferde içerlenin, üçüncü seferde yeniden yapılandırın</li>
<li>Özellik eklerken, hata düzeltirken ve kod incelemeleri sırasında yeniden yapılandırın</li>
<li><strong>Küçük, artımlı değişiklikler</strong> yapın ve tüm testlerin geçmesini sağlayın</li>
<li>Yeniden yapılandırma ve özellik geliştirmeyi asla aynı commit'te karıştırmayın</li>
</ul>
<blockquote>
<p>&quot;Herhangi bir aptal bilgisayarın anlayabileceği kod yazabilir. İyi programcılar insanların anlayabileceği kod yazar.&quot; -- Martin Fowler</p>
</blockquote>

<h2 id="mod%C3%BCl-b-%C5%9Fi%C5%9Fkinler-bloaters----genel-bak%C4%B1%C5%9F">Modül B: Şişkinler (Bloaters) -- Genel Bakış</h2>
<p><strong>Şişkinler (Bloaters)</strong>, o kadar devasa boyutlara ulaşmış kod, metotlar ve sınıflardır ki bunlarla çalışmak zorlaşır. Genellikle bu kokular hemen ortaya çıkmaz; daha çok program geliştikçe zamanla birikir (ve özellikle kimse onları ortadan kaldırma çabası göstermediğinde).</p>
<h3 id="5-%C5%9Fi%C5%9Fkin-kokusu">5 Şişkin Kokusu</h3>
<table>
<thead>
<tr>
<th>#</th>
<th>Koku</th>
<th>Temel Sorun</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td><strong>Uzun Metot (Long Method)</strong></td>
<td>Metot çok fazla satır kod içerir</td>
</tr>
<tr>
<td>2</td>
<td><strong>Büyük Sınıf (Large Class)</strong></td>
<td>Sınıf çok fazla alan/metot/satır içerir</td>
</tr>
<tr>
<td>3</td>
<td><strong>İlkel Takıntı (Primitive Obsession)</strong></td>
<td>Küçük nesneler yerine ilkel türlerin aşırı kullanımı</td>
</tr>
<tr>
<td>4</td>
<td><strong>Uzun Parametre Listesi (Long Parameter List)</strong></td>
<td>Bir metotta üçten veya dörtten fazla parametre</td>
</tr>
<tr>
<td>5</td>
<td><strong>Veri Kümeleri (Data Clumps)</strong></td>
<td>Her zaman birlikte görünen veri grupları</td>
</tr>
</tbody>
</table>
<p>Referans: <a href="https://refactoring.guru/refactoring/smells/bloaters">RefactoringGuru -- Şişkinler</a></p>

<h2 id="mod%C3%BCl-b-%C5%9Fi%C5%9Fkin-1----uzun-metot-long-method">Modül B: Şişkin #1 -- Uzun Metot (Long Method)</h2>
<h3 id="nedir">Nedir?</h3>
<p>Bir metot <strong>çok fazla satır kod</strong> içerir. Genel olarak, <strong>on satırdan</strong> uzun herhangi bir metot sizi soru sormaya başlatmalıdır.</p>
<h3 id="belirtiler-ve-semptomlar">Belirtiler ve Semptomlar</h3>
<ul>
<li>Metot 10-20 satırın ötesine büyümüştür</li>
<li>Metodun farklı bölümlerinin ne yaptığını açıklamak için yorumlara ihtiyaç duyarsınız</li>
<li>Metot adı, metodun yaptığı her şeyi tam olarak tanımlamaz</li>
<li>Derinlemesine iç içe kontrol yapıları vardır</li>
</ul>
<h3 id="sorunun-nedenleri">Sorunun Nedenleri</h3>
<ul>
<li>Mevcut bir metoda <strong>ekleme yapmak</strong>, yeni bir metot oluşturmaktan zihinsel olarak daha kolaydır</li>
<li>&quot;Bu iki satırı buraya ekleyeyim...&quot; -- ve büyümeye devam eder</li>
<li>Bir metot oluşturmak, mevcut bir metoda ekleme yapmaktan daha zor olduğundan, çoğu kod mevcut metotlara ekleme olarak yazılır</li>
<li>Metot başlangıçta küçük başlamış ancak zamanla büyümüştür</li>
</ul>
<p>Referans: <a href="https://refactoring.guru/smells/long-method">RefactoringGuru -- Uzun Metot</a></p>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// KOKU: Uzun Metot -- bu metot çok fazla iş yapıyor</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">processOrder</span><span class="hljs-params">(Order order)</span> {
    <span class="hljs-comment">// Siparişi doğrula (10+ satır)</span>
    <span class="hljs-keyword">if</span> (order == <span class="hljs-literal">null</span>) <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">IllegalArgumentException</span>(<span class="hljs-string">&quot;Order is null&quot;</span>);
    <span class="hljs-keyword">if</span> (order.getItems().isEmpty())
        <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">IllegalStateException</span>(<span class="hljs-string">&quot;Order has no items&quot;</span>);
    <span class="hljs-keyword">for</span> (Item item : order.getItems()) {
        <span class="hljs-keyword">if</span> (item.getQuantity() &lt;= <span class="hljs-number">0</span>)
            <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">IllegalStateException</span>(<span class="hljs-string">&quot;Invalid quantity&quot;</span>);
        <span class="hljs-keyword">if</span> (!inventory.isAvailable(item.getProductId(), item.getQuantity()))
            <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">IllegalStateException</span>(<span class="hljs-string">&quot;Product not available&quot;</span>);
    }

    <span class="hljs-comment">// Fiyatları hesapla (10+ satır)</span>
    <span class="hljs-type">double</span> <span class="hljs-variable">subtotal</span> <span class="hljs-operator">=</span> <span class="hljs-number">0</span>;
    <span class="hljs-keyword">for</span> (Item item : order.getItems()) {
        subtotal += item.getPrice() * item.getQuantity();
    }
    <span class="hljs-type">double</span> <span class="hljs-variable">tax</span> <span class="hljs-operator">=</span> subtotal * <span class="hljs-number">0.08</span>;
    <span class="hljs-type">double</span> <span class="hljs-variable">shipping</span> <span class="hljs-operator">=</span> subtotal &gt; <span class="hljs-number">100</span> ? <span class="hljs-number">0</span> : <span class="hljs-number">9.99</span>;

    <span class="hljs-comment">// İndirimleri uygula (10+ satır)</span>
    <span class="hljs-keyword">if</span> (order.getCustomer().isLoyalMember()) {
        subtotal *= <span class="hljs-number">0.90</span>;
    }
    <span class="hljs-type">double</span> <span class="hljs-variable">total</span> <span class="hljs-operator">=</span> subtotal + tax + shipping;

    <span class="hljs-comment">// Envanteri güncelle, siparişi kaydet, e-posta gönder... (20+ satır daha)</span>
}

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// YENİDEN YAPILANDIRILMIŞ: Metot Çıkarma uygulandı</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">processOrder</span><span class="hljs-params">(Order order)</span> {
    validateOrder(order);
    <span class="hljs-type">double</span> <span class="hljs-variable">subtotal</span> <span class="hljs-operator">=</span> calculateSubtotal(order);
    <span class="hljs-type">double</span> <span class="hljs-variable">tax</span> <span class="hljs-operator">=</span> calculateTax(subtotal);
    <span class="hljs-type">double</span> <span class="hljs-variable">shipping</span> <span class="hljs-operator">=</span> calculateShipping(subtotal);
    subtotal = applyDiscounts(order, subtotal);
    <span class="hljs-type">double</span> <span class="hljs-variable">total</span> <span class="hljs-operator">=</span> subtotal + tax + shipping;
    updateInventory(order);
    saveOrder(order, total);
    sendConfirmationEmail(order, total);
}

<span class="hljs-keyword">private</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">validateOrder</span><span class="hljs-params">(Order order)</span> {
    <span class="hljs-keyword">if</span> (order == <span class="hljs-literal">null</span>) <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">IllegalArgumentException</span>(<span class="hljs-string">&quot;Order is null&quot;</span>);
    <span class="hljs-keyword">if</span> (order.getItems().isEmpty())
        <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">IllegalStateException</span>(<span class="hljs-string">&quot;Order has no items&quot;</span>);
    <span class="hljs-keyword">for</span> (Item item : order.getItems()) {
        validateItem(item);
    }
}

<span class="hljs-keyword">private</span> <span class="hljs-type">double</span> <span class="hljs-title function_">calculateSubtotal</span><span class="hljs-params">(Order order)</span> {
    <span class="hljs-keyword">return</span> order.getItems().stream()
        .mapToDouble(item -&gt; item.getPrice() * item.getQuantity())
        .sum();
}
</code></pre>

<h3 id="tedavi-yeniden-yap%C4%B1land%C4%B1rma-teknikleri">Tedavi (Yeniden Yapılandırma Teknikleri)</h3>
<table>
<thead>
<tr>
<th>Teknik</th>
<th>Ne Zaman Kullanılır</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Metot Çıkarma (Extract Method)</strong></td>
<td>Bir kod parçasını alıp açıklayıcı bir adla kendi metoduna dönüştürün</td>
</tr>
<tr>
<td><strong>Geçici Değişkeni Sorguyla Değiştirme (Replace Temp with Query)</strong></td>
<td>Bir ifadeyi yeni bir metoda taşıyın ve sonucu yerel değişkende saklamak yerine döndürün</td>
</tr>
<tr>
<td><strong>Parametre Nesnesi Tanıtma (Introduce Parameter Object)</strong></td>
<td>Tekrarlanan parametre gruplarını bir nesneyle değiştirin</td>
</tr>
<tr>
<td><strong>Bütün Nesneyi Koruma (Preserve Whole Object)</strong></td>
<td>Nesneden tek tek değerler yerine bütün nesneyi geçirin</td>
</tr>
<tr>
<td><strong>Metodu Metot Nesnesiyle Değiştirme (Replace Method with Method Object)</strong></td>
<td>Yerel değişkenler çıkarmayı engellediğinde tüm metodu ayrı bir sınıfa dönüştürün</td>
</tr>
<tr>
<td><strong>Koşullu İfadeyi Parçalama (Decompose Conditional)</strong></td>
<td>Karmaşık koşullu mantığı iyi adlandırılmış metotlara çıkarın</td>
</tr>
</tbody>
</table>
<h3 id="kazan%C3%A7">Kazanç</h3>
<ul>
<li>Tüm nesne yönelimli kod türleri arasında, <strong>kısa metotlara sahip sınıflar en uzun ömürlüdür</strong></li>
<li>Bir metot ne kadar uzunsa, anlaması ve bakımı o kadar zordur</li>
<li>Uzun metotlar <strong>istenmeyen tekrarlanan kod</strong> için mükemmel bir saklanma yeridir</li>
<li>Artık temiz kodunuz olduğunda, <strong>gerçekten etkili</strong> performans optimizasyonları bulma olasılığınız daha yüksektir</li>
</ul>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="mod%C3%BCl-b-%C5%9Fi%C5%9Fkin-2----b%C3%BCy%C3%BCk-s%C4%B1n%C4%B1f-large-class-tedavi-ve-kazan%C3%A7">Modül B: Şişkin #2 -- Büyük Sınıf (Large Class) (Tedavi ve Kazanç)</h2>
<h3 id="tedavi-yeniden-yap%C4%B1land%C4%B1rma-teknikleri-1">Tedavi (Yeniden Yapılandırma Teknikleri)</h3>
<table>
<thead>
<tr>
<th>Teknik</th>
<th>Ne Zaman Kullanılır</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Sınıf Çıkarma (Extract Class)</strong></td>
<td>Sınıfın davranışının bir kısmı ayrı bir sınıfa ayrılabildiğinde</td>
</tr>
<tr>
<td><strong>Alt Sınıf Çıkarma (Extract Subclass)</strong></td>
<td>Sınıfın davranışının bir kısmı yalnızca bazı örneklerle ilgili olduğunda</td>
</tr>
<tr>
<td><strong>Arayüz Çıkarma (Extract Interface)</strong></td>
<td>İstemciye hangi işlemlerin ve davranışların mevcut olduğunu belirlemeniz gerektiğinde</td>
</tr>
<tr>
<td><strong>Gözlemlenen Veriyi Çoğaltma (Duplicate Observed Data)</strong></td>
<td>Büyük bir sınıf GUI'den sorumluysa, veri ve davranışı ayrı bir alan nesnesine taşıyın</td>
</tr>
</tbody>
</table>
<h3 id="kazan%C3%A7-1">Kazanç</h3>
<ul>
<li>Geliştiriciler bir sınıf için çok sayıda özelliği hatırlamak zorunda kalmaz</li>
<li>Büyük sınıfları bölmek sıklıkla <strong>kod tekrarını ve gereksiz işlevselliği ortadan kaldırır</strong></li>
<li>Her sınıfın <strong>tek bir net amacı</strong> vardır (Tek Sorumluluk İlkesi)</li>
<li>Daha küçük sınıflar <strong>izole olarak test etmek</strong> daha kolaydır</li>
<li>Daha küçük, odaklı sınıflar diğer bağlamlarda <strong>yeniden kullanılabilir</strong></li>
</ul>

<h2 id="mod%C3%BCl-b-%C5%9Fi%C5%9Fkin-3----i%CC%87lkel-tak%C4%B1nt%C4%B1-primitive-obsession">Modül B: Şişkin #3 -- İlkel Takıntı (Primitive Obsession)</h2>
<h3 id="nedir-2">Nedir?</h3>
<p>Alan kavramları için küçük nesneler oluşturmak yerine <strong>ilkel türlerin</strong> (int, String, double, boolean) aşırı kullanımıdır.</p>
<h3 id="belirtiler-ve-semptomlar-2">Belirtiler ve Semptomlar</h3>
<ul>
<li>Basit görevler için <strong>küçük nesneler yerine ilkellerin kullanımı</strong> (para birimi, aralıklar, telefon numaraları için özel dizeler vb.)</li>
<li>Bilgi kodlama için <strong>sabit değerlerin kullanımı</strong> (<code>USER_ADMIN_ROLE = 1</code> gibi)</li>
<li>Veri dizilerinde kullanım için <strong>alan adları olarak dize sabitlerinin kullanımı</strong></li>
</ul>
<h3 id="sorunun-nedenleri-2">Sorunun Nedenleri</h3>
<ul>
<li>İlkeller &quot;sadece bir değer saklamak için&quot; oluşturulur ve sonunda kullanımları artar</li>
<li>Bir alan oluşturmak, tamamen yeni bir sınıf oluşturmaktan daha kolaydır</li>
<li>&quot;Telefon numarası için sadece bir String kullanayım...&quot;</li>
<li>İlkeller genellikle tembellikten doğar: bir <code>int</code> veya <code>String</code> kullanmak yeni bir sınıf oluşturmaktan daha basit görünür</li>
</ul>
<p>Referans: <a href="https://refactoring.guru/smells/primitive-obsession">RefactoringGuru -- İlkel Takıntı</a></p>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="mod%C3%BCl-b-%C5%9Fi%C5%9Fkin-3----i%CC%87lkel-tak%C4%B1nt%C4%B1-primitive-obsession-tedavi-ve-kazan%C3%A7">Modül B: Şişkin #3 -- İlkel Takıntı (Primitive Obsession) (Tedavi ve Kazanç)</h2>
<h3 id="tedavi-yeniden-yap%C4%B1land%C4%B1rma-teknikleri-2">Tedavi (Yeniden Yapılandırma Teknikleri)</h3>
<table>
<thead>
<tr>
<th>Teknik</th>
<th>Ne Zaman Kullanılır</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Veri Değerini Nesneyle Değiştirme (Replace Data Value with Object)</strong></td>
<td>İlgili ilkel alanları gruplandırın ve ilişkili davranışı taşıyın</td>
</tr>
<tr>
<td><strong>Parametre Nesnesi Tanıtma (Introduce Parameter Object)</strong></td>
<td>İlkeller metot parametrelerinde gruplandığında</td>
</tr>
<tr>
<td><strong>Bütün Nesneyi Koruma (Preserve Whole Object)</strong></td>
<td>Bir nesneden birden fazla değer çıkarıp tek tek geçirdiğinizde</td>
</tr>
<tr>
<td><strong>Tür Kodunu Sınıfla Değiştirme (Replace Type Code with Class)</strong></td>
<td>Tür kodu değerleri davranışı etkilemediğinde</td>
</tr>
<tr>
<td><strong>Tür Kodunu Alt Sınıflarla Değiştirme (Replace Type Code with Subclasses)</strong></td>
<td>Tür kodu davranışı etkilediğinde</td>
</tr>
<tr>
<td><strong>Tür Kodunu Durum/Strateji ile Değiştirme (Replace Type Code with State/Strategy)</strong></td>
<td>Alt sınıflar kullanamadığınızda</td>
</tr>
<tr>
<td><strong>Diziyi Nesneyle Değiştirme (Replace Array with Object)</strong></td>
<td>Diziler karışık veri türleri içerdiğinde</td>
</tr>
</tbody>
</table>
<h3 id="kazan%C3%A7-2">Kazanç</h3>
<ul>
<li>İlkeller yerine nesnelerin kullanımı sayesinde kod daha <strong>esnek</strong> hale gelir</li>
<li>Kodun daha iyi <strong>anlaşılabilirliği</strong> ve organizasyonu</li>
<li>Aynı veriyi işleyen <strong>tekrarlanan kodu</strong> bulmak daha kolaydır</li>
<li>Değer nesnesi içinde <strong>doğrulama</strong> yapılabilir (örn. telefon numarası formatı)</li>
</ul>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="mod%C3%BCl-b-%C5%9Fi%C5%9Fkin-4----uzun-parametre-listesi-long-parameter-list">Modül B: Şişkin #4 -- Uzun Parametre Listesi (Long Parameter List)</h2>
<h3 id="nedir-3">Nedir?</h3>
<p>Bir metot <strong>üçten veya dörtten fazla parametreye</strong> sahiptir, bu da onu anlamayı ve doğru kullanmayı zorlaştırır.</p>
<h3 id="belirtiler-ve-semptomlar-3">Belirtiler ve Semptomlar</h3>
<ul>
<li>Tek satıra sığmayacak kadar uzun metot imzaları</li>
<li>Birbirinden ayırt edilmesi zor parametreler</li>
<li>Çağıranlar sıklıkla yanlış argümanları yanlış pozisyonlara geçirir</li>
</ul>
<h3 id="sorunun-nedenleri-3">Sorunun Nedenleri</h3>
<ul>
<li>Uzun bir parametre listesi, <strong>birkaç tür algoritmanın tek bir metotta birleştirilmesinden</strong> sonra ortaya çıkabilir</li>
<li>Uzun bir liste, <strong>hangi algoritmanın çalıştırılacağını</strong> ve nasıl çalıştırılacağını kontrol etmek için oluşturulmuş olabilir</li>
<li>Uzun parametre listeleri, <strong>sınıfları birbirinden daha bağımsız hale getirme</strong> çabalarından da kaynaklanabilir (bir nesne geçirmek yerine tek tek değerler geçirilir)</li>
<li>Uzun listeler &quot;uzadıkça çelişkili ve kullanımı zor&quot; hale gelir</li>
</ul>
<p>Referans: <a href="https://refactoring.guru/smells/long-parameter-list">RefactoringGuru -- Uzun Parametre Listesi</a></p>

<h2 id="mod%C3%BCl-b-%C5%9Fi%C5%9Fkin-4----uzun-parametre-listesi-long-parameter-list-tedavi-ve-kazan%C3%A7">Modül B: Şişkin #4 -- Uzun Parametre Listesi (Long Parameter List) (Tedavi ve Kazanç)</h2>
<h3 id="tedavi-yeniden-yap%C4%B1land%C4%B1rma-teknikleri-3">Tedavi (Yeniden Yapılandırma Teknikleri)</h3>
<table>
<thead>
<tr>
<th>Teknik</th>
<th>Ne Zaman Kullanılır</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Parametreyi Metot Çağrısıyla Değiştirme (Replace Parameter with Method Call)</strong></td>
<td>Bir parametre değeri, zaten mevcut olan başka bir nesnenin bir metodunu çağırarak elde edilebildiğinde</td>
</tr>
<tr>
<td><strong>Bütün Nesneyi Koruma (Preserve Whole Object)</strong></td>
<td>Tek tek alanlarını çıkarmak yerine bütün nesneyi geçirin</td>
</tr>
<tr>
<td><strong>Parametre Nesnesi Tanıtma (Introduce Parameter Object)</strong></td>
<td>Sık birlikte görünen ilgili parametreleri gruplamak için yeni bir sınıf oluşturun</td>
</tr>
</tbody>
</table>
<h3 id="kazan%C3%A7-3">Kazanç</h3>
<ul>
<li>Daha okunabilir, <strong>daha kısa kod</strong></li>
<li>Yeniden yapılandırma, daha önce fark edilmeyen <strong>tekrarlanan kodu</strong> ortaya çıkarabilir</li>
<li>Metot imzaları kendi kendini belgeleme haline gelir</li>
</ul>
<h3 id="ne-zaman-g%C3%B6rmezden-gelinir">Ne Zaman Görmezden Gelinir</h3>
<ul>
<li>Parametre sayısını azaltmak için sınıflar arasında istenmeyen <strong>bağımlılıklar</strong> oluşturmayın</li>
<li>Parametreler arasındaki tek bağlantı bu metotta birlikte görünmeleri ise, parametre nesnesi tanıtmak erken olabilir</li>
</ul>

<h2 id="mod%C3%BCl-b-%C5%9Fi%C5%9Fkin-5----veri-k%C3%BCmeleri-data-clumps">Modül B: Şişkin #5 -- Veri Kümeleri (Data Clumps)</h2>
<h3 id="nedir-4">Nedir?</h3>
<p><strong>Aynı değişken grupları</strong> kodun farklı bölümlerinde tekrar tekrar görünür. Bu kümeler kendi sınıflarına dönüştürülmelidir.</p>
<h3 id="belirtiler-ve-semptomlar-4">Belirtiler ve Semptomlar</h3>
<ul>
<li>Aynı alan grubu birden fazla sınıfta görünür (örn. cadde, şehir, postaKodu)</li>
<li>Aynı parametre grubu birden fazla metot imzasında görünür</li>
<li>Gruptan bir değeri kaldırmak geri kalanını anlamsız kılar</li>
</ul>
<h3 id="sorunun-nedenleri-4">Sorunun Nedenleri</h3>
<ul>
<li>Veri kümeleri genellikle <strong>kopyala-yapıştır</strong> programlama yapıldığında ortaya çıkar</li>
<li>Veri grupları birlikte dolaştırılır ancak asla bir kavram olarak resmileştirilmez</li>
<li>İyi bir test: <strong>veri değerlerinden birini silin</strong> -- geri kalanlar hala anlamlı mı? Değilse, bu bir kümedir</li>
</ul>
<p>Referans: <a href="https://refactoring.guru/smells/data-clumps">RefactoringGuru -- Veri Kümeleri</a></p>

<h3 id="tedavi-yeniden-yap%C4%B1land%C4%B1rma-teknikleri-4">Tedavi (Yeniden Yapılandırma Teknikleri)</h3>
<table>
<thead>
<tr>
<th>Teknik</th>
<th>Ne Zaman Kullanılır</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Sınıf Çıkarma (Extract Class)</strong></td>
<td>Alan grubunu yeni bir sınıfa taşıyın</td>
</tr>
<tr>
<td><strong>Parametre Nesnesi Tanıtma (Introduce Parameter Object)</strong></td>
<td>Veri kümeleri olan metot imzaları için</td>
</tr>
<tr>
<td><strong>Bütün Nesneyi Koruma (Preserve Whole Object)</strong></td>
<td>Tek tek alanlar yerine bütün nesneyi geçirin</td>
</tr>
</tbody>
</table>
<h3 id="kazan%C3%A7-4">Kazanç</h3>
<ul>
<li>Kodun <strong>anlaşılmasını ve organizasyonunu</strong> iyileştirir</li>
<li>Tekrarlanan alan gruplarını ortadan kaldırarak <strong>kod boyutunu</strong> azaltır</li>
<li>Veriyle ilişkili işlemler yeni sınıfa taşınabilir (örn. adres biçimlendirme, doğrulama)</li>
</ul>
<h3 id="ne-zaman-g%C3%B6rmezden-gelinir-1">Ne Zaman Görmezden Gelinir</h3>
<ul>
<li>Tam nesneleri parametre olarak geçirmek sınıflar arasında <strong>istenmeyen bağımlılıklar</strong> oluşturabilir</li>
<li>Veri grubu yalnızca iki yerde birlikte görünüyorsa, yeni bir sınıfın ek yükü buna değmeyebilir</li>
</ul>

<p><strong>Nesne Yönelim Kötüye Kullananlar (OO Abusers)</strong>, nesne yönelimli programlama ilkelerinin eksik veya yanlış uygulandığı durumlardır.</p>

</tr>

<td>2</td>
<td><strong>Geçici Alan (Temporary Field)</strong></td>
<td>Yalnızca belirli koşullar altında değer alan alanlar</td>
</tr>
<tr>
<td>3</td>
<td><strong>Reddedilen Miras (Refused Bequest)</strong></td>

</tr>
<tr>
<td>4</td>
<td><strong>Farklı Arayüzlere Sahip Alternatif Sınıflar (Alternative Classes with Different Interfaces)</strong></td>

</tr>

<h2 id="mod%C3%BCl-c-ne-k%C3%B6t%C3%BCye-kullanan-1----switch-i%CC%87fadeleri-switch-statements">Modül C: NE Kötüye Kullanan #1 -- Switch İfadeleri (Switch Statements)</h2>
<h3 id="nedir-5">Nedir?</h3>
<p>Bir tür veya koşula dayalı olarak farklı eylemler gerçekleştiren karmaşık bir <code>switch</code> operatörünüz veya <code>if</code> ifadeleri diziniz vardır.</p>
<h3 id="belirtiler-ve-semptomlar-5">Belirtiler ve Semptomlar</h3>
<ul>
<li>Birden fazla yerde aynı koşulu test eden karmaşık bir <code>switch</code> veya <code>if-else</code> zinciri</li>
<li>Aynı <code>switch</code> yapısının, türün işlendiği her yerde muhtemelen <strong>tekrarlanması</strong></li>
<li>Yeni bir tür eklemek <strong>her</strong> <code>switch</code> ifadesini değiştirmeyi gerektirir</li>
</ul>
<h3 id="sorunun-nedenleri-5">Sorunun Nedenleri</h3>
<ul>
<li><code>switch</code> ve <code>case</code>'in nispeten nadir kullanımı, nesne yönelimli kodun ayırt edici özelliklerinden biridir</li>
<li>Genellikle bir <code>switch</code> programın farklı yerlerinde dağılmıştır</li>
<li>Yeni bir koşul eklendiğinde, tüm <code>switch</code> kodunu bulup değiştirmeniz gerekir</li>
<li>Genel kural olarak, <strong>bir <code>switch</code> gördüğünüzde çok biçimliliği düşünmelisiniz</strong></li>
</ul>
<p>Referans: <a href="https://refactoring.guru/smells/switch-statements">RefactoringGuru -- Switch İfadeleri</a></p>

                <span class="hljs-keyword">return</span> employee.getMonthlySalary();

                       + employee.getBonus();

                <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">RuntimeException</span>(<span class="hljs-string">&quot;Invalid employee type&quot;</span>);
        }
    }

    <span class="hljs-comment">// Aynı switch başka bir metotta tekrarlanıyor!</span>
    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">calculateVacationDays</span><span class="hljs-params">(Employee employee)</span> {

            <span class="hljs-keyword">case</span> SALESMAN:  <span class="hljs-keyword">return</span> <span class="hljs-number">12</span>;
            <span class="hljs-keyword">case</span> MANAGER:   <span class="hljs-keyword">return</span> <span class="hljs-number">20</span>;
            <span class="hljs-keyword">default</span>: <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">RuntimeException</span>(<span class="hljs-string">&quot;Invalid type&quot;</span>);
        }
    }
}

<h2 id="mod%C3%BCl-c-ne-k%C3%B6t%C3%BCye-kullanan-1----switch-i%CC%87fadeleri-switch-statements-tedavi-ve-kazan%C3%A7">Modül C: NE Kötüye Kullanan #1 -- Switch İfadeleri (Switch Statements) (Tedavi ve Kazanç)</h2>
<h3 id="tedavi-yeniden-yap%C4%B1land%C4%B1rma-teknikleri-5">Tedavi (Yeniden Yapılandırma Teknikleri)</h3>
<table>
<thead>
<tr>
<th>Teknik</th>
<th>Ne Zaman Kullanılır</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Tür Kodunu Alt Sınıflarla Değiştirme (Replace Type Code with Subclasses)</strong></td>
<td>Her tür için alt sınıflar oluşturun</td>
</tr>
<tr>
<td><strong>Koşullu İfadeyi Çok Biçimlilikle Değiştirme (Replace Conditional with Polymorphism)</strong></td>
<td>Koşullar yerine metot geçersiz kılma kullanın</td>
</tr>
<tr>
<td><strong>Tür Kodunu Durum/Strateji ile Değiştirme (Replace Type Code with State/Strategy)</strong></td>
<td>Alt sınıflar mümkün olmadığında</td>
</tr>
<tr>
<td><strong>Parametreyi Açık Metotlarla Değiştirme (Replace Parameter with Explicit Methods)</strong></td>
<td>Koşullar aynı metodu farklı parametrelerle çağırdığında</td>
</tr>
<tr>
<td><strong>Null Nesnesi Tanıtma (Introduce Null Object)</strong></td>
<td>Null koşulları için</td>
</tr>
</tbody>
</table>
<h3 id="kazan%C3%A7-5">Kazanç</h3>
<ul>
<li>Çok biçimlilik yoluyla iyileştirilmiş <strong>kod organizasyonu</strong></li>
<li><strong>Yeni türler eklemek daha kolay</strong> -- sadece yeni bir alt sınıf ekleyin (Açık/Kapalı İlkesi)</li>
<li>Kod tabanı boyunca dağılmış <strong>tekrarlanan koşullu mantığı ortadan kaldırır</strong></li>
</ul>
<h3 id="ne-zaman-g%C3%B6rmezden-gelinir-2">Ne Zaman Görmezden Gelinir</h3>
<ul>
<li>Bir <code>switch</code> <strong>basit eylemler</strong> gerçekleştirdiğinde ve yalnızca tek bir yerde göründüğünde</li>
<li>Basit fabrika metotları (Factory Method veya Abstract Factory kalıpları) genellikle kabul edilebilir</li>
<li>Switch'in değişme olasılığı düşükse, çok biçimlilik aşırıya kaçabilir</li>
</ul>

<h2 id="mod%C3%BCl-c-ne-k%C3%B6t%C3%BCye-kullanan-2----ge%C3%A7ici-alan-temporary-field">Modül C: NE Kötüye Kullanan #2 -- Geçici Alan (Temporary Field)</h2>
<h3 id="nedir-6">Nedir?</h3>
<p>Geçici alanlar, değerlerini (ve dolayısıyla nesneler tarafından ihtiyaç duyulmaları) yalnızca <strong>belirli koşullar altında</strong> alır. Bu koşulların dışında boştur veya alakasız veri içerir.</p>
<h3 id="belirtiler-ve-semptomlar-6">Belirtiler ve Semptomlar</h3>
<ul>
<li>Yalnızca belirli algoritma yürütmesi sırasında doldurulan ve kullanılan nesne alanları</li>
<li>Zamanın çoğunda <code>null</code> veya boş olan alanlar</li>
<li><strong>Neredeyse her zaman boş</strong> olan alanlarda veri görmeyi beklersiniz</li>
</ul>
<h3 id="sorunun-nedenleri-6">Sorunun Nedenleri</h3>
<ul>
<li>Genellikle geçici alanlar, <strong>büyük miktarda girdi gerektiren</strong> bir algoritmada kullanılmak üzere oluşturulur</li>
<li>Programcı, metotta birçok parametre oluşturmak yerine bu veriler için sınıfta <strong>alanlar</strong> oluşturmaya karar verir</li>
<li>Bu alanlar yalnızca algoritmada kullanılır ve geri kalan zamanda işe yaramazdır</li>
<li>Bu kod anlaşılması zordur çünkü nesne alanlarının tutarlı bir şekilde anlamlı veri içermesini beklersiniz</li>
</ul>
<p>Referans: <a href="https://refactoring.guru/smells/temporary-field">RefactoringGuru -- Geçici Alan</a></p>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// KOKU: Geçici Alan -- alanlar yalnızca ödeme sırasında anlamlı</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Order</span> {
    <span class="hljs-keyword">private</span> List&lt;Item&gt; items;
    <span class="hljs-keyword">private</span> Customer customer;

    <span class="hljs-comment">// Bu alanlar yalnızca ödeme sırasında kullanılıyor!</span>
    <span class="hljs-keyword">private</span> <span class="hljs-type">double</span> taxRate;          <span class="hljs-comment">// Yalnızca ödeme sırasında ayarlanır</span>

    <span class="hljs-keyword">private</span> <span class="hljs-type">double</span> shippingWeight;   <span class="hljs-comment">// Yalnızca fiziksel ürünler için geçerli</span>
    <span class="hljs-keyword">private</span> String shippingMethod;   <span class="hljs-comment">// Kargo seçilene kadar boş</span>

    <span class="hljs-keyword">public</span> <span class="hljs-type">double</span> <span class="hljs-title function_">checkout</span><span class="hljs-params">()</span> {
        <span class="hljs-comment">// taxRate, promoCode, shippingWeight, shippingMethod kullanılır</span>
        <span class="hljs-comment">// Sipariş ödeme aşamasında değilken bunlar kafa karıştırıcıdır</span>
        <span class="hljs-type">double</span> <span class="hljs-variable">subtotal</span> <span class="hljs-operator">=</span> calculateSubtotal();
        <span class="hljs-type">double</span> <span class="hljs-variable">discount</span> <span class="hljs-operator">=</span> promoCode != <span class="hljs-literal">null</span> ? applyPromo(promoCode) : <span class="hljs-number">0</span>;
        <span class="hljs-type">double</span> <span class="hljs-variable">tax</span> <span class="hljs-operator">=</span> subtotal * taxRate;
        <span class="hljs-type">double</span> <span class="hljs-variable">shipping</span> <span class="hljs-operator">=</span> calculateShipping(shippingWeight, shippingMethod);
        <span class="hljs-keyword">return</span> subtotal - discount + tax + shipping;

}

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// YENİDEN YAPILANDIRILMIŞ: Sınıf Çıkarma -- ayrı ödeme bağlamı</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Order</span> {
    <span class="hljs-keyword">private</span> List&lt;Item&gt; items;
    <span class="hljs-keyword">private</span> Customer customer;

    <span class="hljs-keyword">public</span> <span class="hljs-type">double</span> <span class="hljs-title function_">calculateSubtotal</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> items.stream()
            .mapToDouble(item -&gt; item.getPrice() * item.getQuantity())
            .sum();
    }
}

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">CheckoutContext</span> {

        <span class="hljs-built_in">this</span>.taxRate = taxRate;
        <span class="hljs-built_in">this</span>.promoCode = promoCode;
        <span class="hljs-built_in">this</span>.shippingWeight = shippingWeight;
        <span class="hljs-built_in">this</span>.shippingMethod = shippingMethod;
    }

    <span class="hljs-keyword">public</span> <span class="hljs-type">double</span> <span class="hljs-title function_">calculateFinalPrice</span><span class="hljs-params">(Order order)</span> {

        <span class="hljs-type">double</span> <span class="hljs-variable">discount</span> <span class="hljs-operator">=</span> promoCode != <span class="hljs-literal">null</span> ? applyPromo(promoCode, subtotal) : <span class="hljs-number">0</span>;
        <span class="hljs-type">double</span> <span class="hljs-variable">tax</span> <span class="hljs-operator">=</span> subtotal * taxRate;
        <span class="hljs-type">double</span> <span class="hljs-variable">shipping</span> <span class="hljs-operator">=</span> calculateShipping(shippingWeight, shippingMethod);

}

<h3 id="tedavi-yeniden-yap%C4%B1land%C4%B1rma-teknikleri-6">Tedavi (Yeniden Yapılandırma Teknikleri)</h3>
<table>
<thead>
<tr>

<th>Ne Zaman Kullanılır</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Sınıf Çıkarma (Extract Class)</strong></td>
<td>Geçici alanları ve ilgili işlemleri ayrı bir sınıfa taşıyın (bir metot nesnesi oluşturur)</td>
</tr>
<tr>
<td><strong>Null Nesnesi Tanıtma (Introduce Null Object)</strong></td>

<li>Algoritma yeterince basitse ve geçici alanlar kafa karışıklığına neden olmuyorsa</li>

<h2 id="mod%C3%BCl-c-ne-k%C3%B6t%C3%BCye-kullanan-3----reddedilen-miras-refused-bequest">Modül C: NE Kötüye Kullanan #3 -- Reddedilen Miras (Refused Bequest)</h2>
<h3 id="nedir-7">Nedir?</h3>
<p>Bir alt sınıf, üst sınıflarından miras alınan metot ve özelliklerin yalnızca <strong>bir kısmını</strong> kullanıyorsa, hiyerarşi dengesizdir. İhtiyaç duyulmayan metotlar ya kullanılmadan kalabilir ya da <strong>istisna fırlatmak üzere yeniden tanımlanabilir</strong>.</p>
<h3 id="belirtiler-ve-semptomlar-7">Belirtiler ve Semptomlar</h3>
<ul>
<li>Bir alt sınıf, üst metotları <code>UnsupportedOperationException</code> fırlatmak için geçersiz kılar</li>
<li>Bir alt sınıf, miras alınan metotların çoğunu kullanılmadan bırakır</li>
<li>Kalıtım ilişkisi gerçek bir &quot;bir-tür&quot; ilişkisini modellemez</li>
</ul>
<h3 id="sorunun-nedenleri-7">Sorunun Nedenleri</h3>
<ul>
<li>Birisi, sınıflar arasında kalıtım oluşturmaya yalnızca bir üst sınıftaki <strong>kodu yeniden kullanma arzusuyla</strong> motive olmuştur</li>
<li>Ancak üst sınıf ve alt sınıf <strong>doğaları gereği tamamen farklıdır</strong></li>
<li>İkisinin de dört bacağı olduğu için Köpeği Sandalyeden türetmeye benzer</li>
</ul>
<p>Referans: <a href="https://refactoring.guru/smells/refused-bequest">RefactoringGuru -- Reddedilen Miras</a></p>

<h2 id="mod%C3%BCl-c-ne-k%C3%B6t%C3%BCye-kullanan-3----reddedilen-miras-refused-bequest-tedavi-ve-kazan%C3%A7">Modül C: NE Kötüye Kullanan #3 -- Reddedilen Miras (Refused Bequest) (Tedavi ve Kazanç)</h2>
<h3 id="tedavi-yeniden-yap%C4%B1land%C4%B1rma-teknikleri-7">Tedavi (Yeniden Yapılandırma Teknikleri)</h3>
<table>
<thead>
<tr>
<th>Teknik</th>
<th>Ne Zaman Kullanılır</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Kalıtımı Devretmeyle Değiştirme (Replace Inheritance with Delegation)</strong></td>
<td>Kalıtım mantıksal olarak anlam ifade etmediğinde, üst-alt ilişkisini ortadan kaldırın ve bunun yerine bileşim kullanın</td>
</tr>
<tr>
<td><strong>Üst Sınıf Çıkarma (Extract Superclass)</strong></td>
<td>Kalıtım uygunsa, her iki sınıfın da reddedilen metotlar olmadan genişletebileceği yeni bir ara üst sınıf oluşturun</td>
</tr>
</tbody>
</table>
<h3 id="kazan%C3%A7-7">Kazanç</h3>
<ul>
<li>Kod <strong>açıklığını ve organizasyonunu</strong> iyileştirir</li>
<li>Kafa karıştırıcı veya anlamsız kalıtım hiyerarşilerini ortadan kaldırır</li>
<li><strong>Liskov Yerine Geçme İlkesine</strong> uyar (bir alt tür, üst türünün yerine geçebilmelidir)</li>
<li><code>UnsupportedOperationException</code> fırlatan metotlar artık yok</li>
</ul>

<h3 id="nedir-8">Nedir?</h3>
<p>İki sınıf <strong>aynı işlevleri</strong> yerine getirir ancak <strong>farklı metot adlarına</strong> sahiptir. Ortak bir arayüzü paylaşmalıdırlar.</p>
<h3 id="belirtiler-ve-semptomlar-8">Belirtiler ve Semptomlar</h3>
<ul>
<li>Aynı şeyi yapan ancak farklı metot adlarına sahip iki sınıf</li>
<li>İstemci kodu, iki sınıf arasında seçim yapmak için <code>if-else</code> kullanır</li>
<li>Sınıflar birbirlerinin yerine kullanılamaz</li>
</ul>
<h3 id="sorunun-nedenleri-8">Sorunun Nedenleri</h3>
<ul>
<li>Bir sınıfı oluşturan geliştirici muhtemelen işlevsel olarak eşdeğer bir sınıfın zaten mevcut olduğunu <strong>bilmiyordu</strong></li>
<li>Ya da bağımsız olarak oluşturmuş ve arayüzleri birleştirmeyi düşünmemiştir</li>
</ul>
<p>Referans: <a href="https://refactoring.guru/smells/alternative-classes-with-different-interfaces">RefactoringGuru -- Farklı Arayüzlere Sahip Alternatif Sınıflar</a></p>

<h3 id="tedavi-yeniden-yap%C4%B1land%C4%B1rma-teknikleri-8">Tedavi (Yeniden Yapılandırma Teknikleri)</h3>
<table>
<thead>
<tr>
<th>Teknik</th>
<th>Ne Zaman Kullanılır</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Metodu Yeniden Adlandırma (Rename Method)</strong></td>
<td>Alternatif sınıflar arasında metot adlarını tutarlı hale getirin</td>
</tr>
<tr>
<td><strong>Metot Taşıma / Parametre Ekleme / Metodu Parametreleme (Move Method / Add Parameter / Parameterize Method)</strong></td>
<td>Metot imzalarını ve uygulamalarını hizalayın</td>
</tr>
<tr>
<td><strong>Üst Sınıf Çıkarma (Extract Superclass)</strong></td>
<td>İşlevselliğin yalnızca bir kısmı tekrarlanıyorsa, ortak parçaları bir üst sınıfa çıkarın</td>
</tr>
<tr>
<td><strong>Gereksiz sınıfı silme</strong></td>
<td>Birleştirildikten sonra, tekrarlanan sınıflardan biri kaldırılabilir</td>
</tr>
</tbody>
</table>
<h3 id="kazan%C3%A7-8">Kazanç</h3>
<ul>
<li>Gereksiz <strong>tekrarlanan kodu</strong> ortadan kaldırır, kodu daha hafif hale getirir</li>
<li>Birleşik bir arayüz aracılığıyla kod daha <strong>okunabilir</strong> ve anlaşılır hale gelir</li>
<li><strong>Çok biçimliliği</strong> etkinleştirir -- istemciler ortak arayüzü birbirinin yerine kullanabilir</li>
</ul>
<h3 id="ne-zaman-g%C3%B6rmezden-gelinir-5">Ne Zaman Görmezden Gelinir</h3>
<ul>
<li>Bazen sınıfları birleştirmek, alternatif sınıflar her biri kendi sürümlemesine sahip <strong>farklı kütüphanelerde</strong> olduğunda imkansızdır</li>
</ul>

<h2 id="mod%C3%BCl-d-de%C4%9Fi%C5%9Fim-engelleyiciler-change-preventers----genel-bak%C4%B1%C5%9F">Modül D: Değişim Engelleyiciler (Change Preventers) -- Genel Bakış</h2>
<p><strong>Değişim Engelleyiciler (Change Preventers)</strong>, kodunuzda bir yerde bir şeyi değiştirmeniz gerektiğinde, diğer birçok yerde de değişiklik yapmanız gerektiği anlamına gelen kokulardır. Sonuç olarak program geliştirme çok daha pahalı ve karmaşık hale gelir.</p>
<h3 id="3-de%C4%9Fi%C5%9Fim-engelleyici-kokusu">3 Değişim Engelleyici Kokusu</h3>
<table>
<thead>
<tr>
<th>#</th>
<th>Koku</th>
<th>Temel Sorun</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td><strong>Iraksak Değişim (Divergent Change)</strong></td>
<td>Bir sınıf farklı nedenlerle farklı şekillerde sık sık değiştirilir</td>
</tr>
<tr>
<td>2</td>
<td><strong>Saçma Ameliyat (Shotgun Surgery)</strong></td>
<td>Tek bir değişiklik birçok farklı sınıfta düzenleme gerektirir</td>
</tr>
<tr>
<td>3</td>
<td><strong>Paralel Kalıtım Hiyerarşileri (Parallel Inheritance Hierarchies)</strong></td>
<td>Bir hiyerarşide alt sınıf oluşturmak diğerinde de oluşturmaya zorlar</td>
</tr>
</tbody>
</table>
<blockquote>

<h2 id="mod%C3%BCl-d-de%C4%9Fi%C5%9Fim-engelleyici-1----iraksak-de%C4%9Fi%C5%9Fim-divergent-change">Modül D: Değişim Engelleyici #1 -- Iraksak Değişim (Divergent Change)</h2>
<h3 id="nedir-9">Nedir?</h3>
<p>Bir sınıfta değişiklik yaptığınızda kendinizi <strong>birbiriyle ilgisiz birçok metodu</strong> değiştirmek zorunda bulursunuz. Örneğin, yeni bir ürün türü eklerken ürünleri bulma, görüntüleme ve sipariş etme metotlarını değiştirmeniz gerekir.</p>
<h3 id="belirtiler-ve-semptomlar-9">Belirtiler ve Semptomlar</h3>
<ul>
<li>Bir sınıf farklı, birbiriyle ilgisiz nedenlerle sık değişiklik gerektirir</li>
<li>Bir sınıf farklı sınıflara ait olması gereken sorumlulukları biriktirmiştir</li>
<li>Sınıf <strong>Tek Sorumluluk İlkesini</strong> ihlal eder</li>
</ul>
<h3 id="sorunun-nedenleri-9">Sorunun Nedenleri</h3>
<ul>
<li>Bu dağınık değişiklikler tipik olarak <strong>kötü program yapısından</strong> veya kopyala-yapıştır programlamadan kaynaklanır</li>
<li>Bir sınıf zamanla kademeli olarak birden fazla sorumluluk üstlenmiştir</li>
<li>&quot;Bu Order sınıfı -- görüntüleme mantığını da buraya ekleyeyim&quot;</li>
</ul>
<p>Referans: <a href="https://refactoring.guru/smells/divergent-change">RefactoringGuru -- Iraksak Değişim</a></p>

<h2 id="mod%C3%BCl-d-de%C4%9Fi%C5%9Fim-engelleyici-1----iraksak-de%C4%9Fi%C5%9Fim-divergent-change-tedavi-ve-kazan%C3%A7">Modül D: Değişim Engelleyici #1 -- Iraksak Değişim (Divergent Change) (Tedavi ve Kazanç)</h2>
<h3 id="tedavi-yeniden-yap%C4%B1land%C4%B1rma-teknikleri-9">Tedavi (Yeniden Yapılandırma Teknikleri)</h3>
<table>
<thead>
<tr>
<th>Teknik</th>
<th>Ne Zaman Kullanılır</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Sınıf Çıkarma (Extract Class)</strong></td>
<td>Sınıfın davranışını her biri tek bir sorumluluğa sahip ayrı sınıflara bölün</td>
</tr>
<tr>
<td><strong>Üst Sınıf Çıkarma (Extract Superclass)</strong></td>
<td>Aynı davranışı paylaşan sınıfları kalıtım yoluyla birleştirin</td>
</tr>
<tr>
<td><strong>Alt Sınıf Çıkarma (Extract Subclass)</strong></td>
<td>İlgili ancak farklı davranışları kalıtım kullanarak düzenleyin</td>
</tr>
</tbody>
</table>
<h3 id="kazan%C3%A7-9">Kazanç</h3>
<ul>
<li><strong>Kod organizasyonunu</strong> iyileştirir -- her sınıf tam olarak bir nedenle değişir</li>
<li>Kod tabanı boyunca <strong>kod tekrarını</strong> azaltır</li>
<li><strong>Destek ve bakımı</strong> basitleştirir -- değişiklikler yerelleştirilir</li>
<li><strong>Tek Sorumluluk İlkesini</strong> (SRP) takip eder</li>
</ul>
<h3 id="iraksak-de%C4%9Fi%C5%9Fim-vs-sa%C3%A7ma-ameliyat">Iraksak Değişim vs. Saçma Ameliyat</h3>
<table>
<thead>
<tr>
<th>Iraksak Değişim (Divergent Change)</th>
<th>Saçma Ameliyat (Shotgun Surgery)</th>
</tr>
</thead>
<tbody>
<tr>
<td>Bir sınıfta birçok <strong>farklı değişiklik</strong></td>
<td>Bir değişiklik <strong>birçok sınıfı</strong> etkiler</td>
</tr>
<tr>
<td>Bir sınıf, birçok değişiklik nedeni</td>
<td>Bir değişiklik nedeni, birçok sınıf</td>
</tr>
</tbody>
</table>

<h2 id="mod%C3%BCl-d-de%C4%9Fi%C5%9Fim-engelleyici-2----sa%C3%A7ma-ameliyat-shotgun-surgery">Modül D: Değişim Engelleyici #2 -- Saçma Ameliyat (Shotgun Surgery)</h2>
<h3 id="nedir-10">Nedir?</h3>
<p>Herhangi bir değişiklik yapmak, birçok <strong>farklı sınıfta</strong> birçok <strong>küçük değişiklik</strong> yapmanızı gerektirir.</p>
<h3 id="belirtiler-ve-semptomlar-10">Belirtiler ve Semptomlar</h3>
<ul>
<li>Tek bir mantıksal değişiklik (alan ekleme, kural değiştirme) 5'ten fazla sınıfa dokunmayı gerektirir</li>
<li>Dağılmış konumlardan birinde değişiklik yapmayı sıklıkla unutursunuz</li>
<li>Dağılmış sınıfların hepsi aynı endişeyle ilgilenir</li>
</ul>
<h3 id="sorunun-nedenleri-10">Sorunun Nedenleri</h3>
<ul>
<li><strong>Tek bir sorumluluk</strong> çok sayıda sınıf arasında <strong>bölünmüştür</strong></li>
<li>Bu, Iraksak Değişim yeniden yapılandırmasının aşırı hevesli uygulanmasından sonra olabilir -- bir sınıfı çok agresif bölme</li>
<li>İlgili kodun farklı yerlere taşındığı artımlı geliştirme</li>
</ul>
<p>Referans: <a href="https://refactoring.guru/smells/shotgun-surgery">RefactoringGuru -- Saçma Ameliyat</a></p>

<h3 id="tedavi-yeniden-yap%C4%B1land%C4%B1rma-teknikleri-10">Tedavi (Yeniden Yapılandırma Teknikleri)</h3>

<thead>

<h3 id="nedir-11">Nedir?</h3>
<p>Bir sınıf için alt sınıf oluşturduğunuzda, kendinizi <strong>başka bir sınıf</strong> için de alt sınıf oluşturmak zorunda bulursunuz.</p>
<h3 id="belirtiler-ve-semptomlar-11">Belirtiler ve Semptomlar</h3>
<ul>
<li>İki sınıf hiyerarşisi eşzamanlı olarak büyür</li>
<li>Bir hiyerarşiye sınıf eklemek her zaman diğerine de sınıf eklemeyi gerektirir</li>
<li>Bir hiyerarşideki sınıf ön ekleri diğerindeki ön ekleri yansıtır (örn. <code>Circle</code>/<code>CircleRenderer</code>)</li>
</ul>
<h3 id="sorunun-nedenleri-11">Sorunun Nedenleri</h3>
<ul>
<li>Başlangıçta yönetilebilir sınıf yapıları, yeni sınıflar eklendikçe değiştirmesi giderek zorlaşır</li>
<li>Paralellik başlangıçta o kadar küçük olabilir ki kimse fark etmez</li>
<li>Bu koku aslında <strong>Saçma Ameliyatın özel bir durumudur</strong></li>
</ul>
<p>Referans: <a href="https://refactoring.guru/smells/parallel-inheritance-hierarchies">RefactoringGuru -- Paralel Kalıtım Hiyerarşileri</a></p>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="mod%C3%BCl-d-de%C4%9Fi%C5%9Fim-engelleyici-3----paralel-kal%C4%B1t%C4%B1m-tedavi-ve-kazan%C3%A7">Modül D: Değişim Engelleyici #3 -- Paralel Kalıtım (Tedavi ve Kazanç)</h2>
<h3 id="tedavi-yeniden-yap%C4%B1land%C4%B1rma-teknikleri-11">Tedavi (Yeniden Yapılandırma Teknikleri)</h3>
<table>
<thead>
<tr>
<th>Teknik</th>
<th>Ne Zaman Kullanılır</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Metot Taşıma (Move Method)</strong> ve <strong>Alan Taşıma (Move Field)</strong></td>
<td>Davranışı bir hiyerarşiden diğerine taşıyarak paralel hiyerarşiyi tekrardan arındırın</td>
</tr>
<tr>
<td><strong>Çapraz referanslar oluşturma</strong></td>
<td>Bir hiyerarşinin örneklerinin diğer hiyerarşinin örneklerine işaret ettiği referanslar oluşturun, ardından gereksiz hiyerarşiyi ortadan kaldırın</td>
</tr>
</tbody>
</table>
<h3 id="kazan%C3%A7-11">Kazanç</h3>
<ul>
<li>İlgili hiyerarşiler arasında <strong>kod tekrarını</strong> azaltır</li>
<li>Genel <strong>kod organizasyonunu</strong> ve bakım kolaylığını iyileştirir</li>
<li>Yeni bir tür eklemek iki yerine <strong>bir hiyerarşide</strong> değişiklik gerektirir</li>
</ul>
<h3 id="ne-zaman-g%C3%B6rmezden-gelinir-7">Ne Zaman Görmezden Gelinir</h3>
<ul>
<li>Bazen paralel sınıf hiyerarşilerine sahip olmak <strong>daha büyük tasarım sorunlarından kaçınmanın</strong> bir yoludur</li>
<li>Net bir endişe ayrımı sağlıyorlarsa (örn. çizim vs. iş mantığı), haklı olabilirler</li>
<li>Yeniden yapılandırma girişimleri daha çirkin kod üretiyorsa, mevcut yapıyı kabul etmek daha akıllıca olabilir</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-12</footer>
</section>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="mod%C3%BCl-d-%C3%B6zet">Modül D: Özet</h2>
<h3 id="temel-noktalar----de%C4%9Fi%C5%9Fim-engelleyiciler-change-preventers">Temel Noktalar -- Değişim Engelleyiciler (Change Preventers)</h3>
<table>
<thead>
<tr>
<th>Koku</th>
<th>Temel Çıkarım</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Iraksak Değişim (Divergent Change)</strong></td>
<td>Birden fazla değişiklik nedenine sahip bir sınıf -- odaklı sınıflara bölün (SRP)</td>
</tr>
<tr>
<td><strong>Saçma Ameliyat (Shotgun Surgery)</strong></td>
<td>Birçok sınıfa dokunan bir değişiklik -- dağılmış sorumluluğu birleştirin</td>
</tr>
<tr>
<td><strong>Paralel Kalıtım Hiyerarşileri (Parallel Inheritance Hierarchies)</strong></td>
<td>Eşzamanlı büyüyen iki hiyerarşi -- mümkün olduğunda birleştirin</td>
</tr>
</tbody>
</table>
<h3 id="ortak-konu-2">Ortak Konu</h3>
<p>Değişim Engelleyiciler yazılımı <strong>katı</strong> hale getirir -- basit değişiklikler için orantısız çaba gerektirerek değişime direnir. Düzeltmeler, değişikliklerin <strong>yerelleştirilmesi</strong> için sorumlulukları yeniden düzenlemeyi içerir.</p>
<blockquote>
<p>&quot;Yeniden yapılandırma sanatı, hangi kokuların iyileştirme fırsatını gösterdiğini ve hangilerinin kabul edilebilir ödünleşimler olduğunu bilmektir.&quot; -- Martin Fowler</p>
</blockquote>

<h2 id="mod%C3%BCl-e-gereksizler-dispensables----genel-bak%C4%B1%C5%9F">Modül E: Gereksizler (Dispensables) -- Genel Bakış</h2>
<p><strong>Gereksiz (Dispensable)</strong>, yokluğu kodu daha temiz, daha verimli ve anlaşılması daha kolay yapacak olan anlamsız ve gereksiz bir şeydir.</p>
<h3 id="6-gereksiz-kokusu">6 Gereksiz Kokusu</h3>
<table>
<thead>
<tr>
<th>#</th>
<th>Koku</th>
<th>Temel Sorun</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td><strong>Yorumlar (Comments)</strong></td>
<td>Metot açıklayıcı yorumlarla doludur</td>
</tr>
<tr>
<td>2</td>
<td><strong>Tekrarlanan Kod (Duplicate Code)</strong></td>
<td>İki kod parçası neredeyse aynı görünür</td>
</tr>
<tr>
<td>3</td>
<td><strong>Tembel Sınıf (Lazy Class)</strong></td>
<td>Varlığını haklı çıkaramayacak kadar az iş yapan bir sınıf</td>
</tr>
<tr>
<td>4</td>
<td><strong>Veri Sınıfı (Data Class)</strong></td>
<td>Yalnızca alanlar ve getter/setter'lar içeren bir sınıf</td>
</tr>
<tr>
<td>5</td>
<td><strong>Ölü Kod (Dead Code)</strong></td>
<td>Artık kullanılmayan kod</td>
</tr>
<tr>
<td>6</td>
<td><strong>Spekülatif Genellik (Speculative Generality)</strong></td>
<td>&quot;Her ihtimale karşı&quot; oluşturulmuş kullanılmayan sınıflar, metotlar veya parametreler</td>
</tr>
</tbody>
</table>
<p>Referans: <a href="https://refactoring.guru/refactoring/smells/dispensables">RefactoringGuru -- Gereksizler</a></p>

<h2 id="mod%C3%BCl-e-gereksiz-1----yorumlar-comments">Modül E: Gereksiz #1 -- Yorumlar (Comments)</h2>
<h3 id="nedir-12">Nedir?</h3>
<p>Bir metot, kodun ne yaptığını açıklamaya çalışan <strong>açıklayıcı yorumlarla</strong> doludur. En iyi yorum, bir metot veya sınıf için iyi bir addır.</p>
<h3 id="belirtiler-ve-semptomlar-12">Belirtiler ve Semptomlar</h3>
<ul>
<li>Sonraki birkaç satırın ne yaptığını açıklayan büyük yorum blokları</li>
<li>Kodu Türkçe/İngilizce olarak yeniden ifade eden yorumlar</li>
<li>Kötü kodun kokusunu maskelemeye çalışan &quot;deodorant&quot; olarak kullanılan yorumlar</li>
<li>Artık kodla uyuşmayan güncelliğini yitirmiş yorumlar</li>
</ul>
<h3 id="sorunun-nedenleri-12">Sorunun Nedenleri</h3>
<ul>
<li>Yorumlar genellikle yazar kodun sezgisel olmadığını fark ettiğinde <strong>en iyi niyetle</strong> oluşturulur</li>
<li>Yorum, kötü kodun kokusunu maskelemeye çalışan bir deodorant görevi görür</li>
<li>Bir kod parçasının yorumlar olmadan anlaşılamayacağını hissediyorsanız, yorumların gereksiz hale gelmesi için <strong>kod yapısını değiştirmeyi</strong> deneyin</li>
</ul>
<p>Referans: <a href="https://refactoring.guru/smells/comments">RefactoringGuru -- Yorumlar</a></p>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// KOKU: Yorumlar -- kod aşırı açıklama gerektiriyor</span>

<h2 id="mod%C3%BCl-e-gereksiz-1----yorumlar-comments-java-%C3%B6rne%C4%9Fi----sonra">Modül E: Gereksiz #1 -- Yorumlar (Comments) (Java Örneği -- Sonra)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// YENİDEN YAPILANDIRILMIŞ: Metot Çıkarma + Değişken Çıkarma -- kendi kendini belgeleyen kod</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">PricingEngine</span> {

    <span class="hljs-keyword">private</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">final</span> <span class="hljs-type">double</span> <span class="hljs-variable">PREMIUM_DISCOUNT_RATE</span> <span class="hljs-operator">=</span> <span class="hljs-number">0.15</span>;
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">final</span> <span class="hljs-type">double</span> <span class="hljs-variable">STANDARD_DISCOUNT_RATE</span> <span class="hljs-operator">=</span> <span class="hljs-number">0.05</span>;

    <span class="hljs-keyword">public</span> <span class="hljs-type">double</span> <span class="hljs-title function_">calculateDiscount</span><span class="hljs-params">(Customer customer, <span class="hljs-type">double</span> price)</span> {
        <span class="hljs-keyword">if</span> (customer.isEligibleForPremiumDiscount()) {
            <span class="hljs-keyword">return</span> price * PREMIUM_DISCOUNT_RATE;
        }
        <span class="hljs-keyword">return</span> price * STANDARD_DISCOUNT_RATE;
    }
}

<span class="hljs-comment">// Customer sınıfında:</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Customer</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">final</span> <span class="hljs-type">int</span> <span class="hljs-variable">MIN_MEMBERSHIP_YEARS</span> <span class="hljs-operator">=</span> <span class="hljs-number">2</span>;
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">final</span> <span class="hljs-type">double</span> <span class="hljs-variable">MIN_PURCHASE_AMOUNT</span> <span class="hljs-operator">=</span> <span class="hljs-number">1000.0</span>;

    <span class="hljs-keyword">public</span> <span class="hljs-type">boolean</span> <span class="hljs-title function_">isEligibleForPremiumDiscount</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> getMembershipYears() &gt; MIN_MEMBERSHIP_YEARS
            &amp;&amp; getTotalPurchases() &gt;= MIN_PURCHASE_AMOUNT
            &amp;&amp; isActive();

<h2 id="mod%C3%BCl-e-gereksiz-1----yorumlar-comments-tedavi-ve-kazan%C3%A7">Modül E: Gereksiz #1 -- Yorumlar (Comments) (Tedavi ve Kazanç)</h2>
<h3 id="tedavi-yeniden-yap%C4%B1land%C4%B1rma-teknikleri-12">Tedavi (Yeniden Yapılandırma Teknikleri)</h3>
<table>
<thead>
<tr>
<th>Teknik</th>
<th>Ne Zaman Kullanılır</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Değişken Çıkarma (Extract Variable)</strong></td>
<td>Bir yorum karmaşık bir ifadeyi açıklıyorsa, onu iyi adlandırılmış bir değişkene çıkarın</td>
</tr>
<tr>
<td><strong>Metot Çıkarma (Extract Method)</strong></td>
<td>Bir yorum bir kod bölümünü açıklıyorsa, o bölümü açıklayıcı bir adla bir metoda çıkarın</td>
</tr>
<tr>
<td><strong>Metodu Yeniden Adlandırma (Rename Method)</strong></td>
<td>Bir metot çıkarılmış ancak ad yeterince iyi açıklamıyorsa</td>
</tr>
<tr>
<td><strong>İddia Tanıtma (Introduce Assertion)</strong></td>
<td>Bir yorum gerekli bir sistem durumunu veya kuralı belgeliyorsa</td>
</tr>
</tbody>
</table>
<h3 id="kazan%C3%A7-12">Kazanç</h3>
<ul>
<li>Kod daha <strong>kendi kendini açıklayan</strong> ve sezgisel hale gelir</li>
<li><strong>Güncelliğini yitirmiş veya yanıltıcı yorum</strong> riskini ortadan kaldırır</li>
<li>Bakım yükünü azaltır (kod değiştiğinde yorumları güncellemeye gerek yok)</li>
</ul>
<h3 id="ne-zaman-g%C3%B6rmezden-gelinir-8">Ne Zaman Görmezden Gelinir</h3>
<ul>
<li><strong>Bir şeyin NEDEN yapıldığını açıklama</strong>: <code>// Using insertion sort because array is nearly sorted</code></li>
<li><strong>Sonuçları uyarma</strong>: <code>// WARNING: Changing this order breaks the payment pipeline</code></li>
<li><strong>TODO yorumları</strong>: <code>// TODO: Replace with async call after API v2 migration</code></li>
<li><strong>Genel API'ler için Javadoc</strong>: Parametreleri, dönüş değerlerini, istisnaları belgeleme</li>
</ul>

<h2 id="mod%C3%BCl-e-gereksiz-2----tekrarlanan-kod-duplicate-code">Modül E: Gereksiz #2 -- Tekrarlanan Kod (Duplicate Code)</h2>
<h3 id="nedir-13">Nedir?</h3>
<p>İki kod parçası <strong>neredeyse aynı</strong> görünür. Bu en yaygın kod kokularından biridir.</p>
<h3 id="belirtiler-ve-semptomlar-13">Belirtiler ve Semptomlar</h3>
<ul>
<li>Aynı kod yapısı birden fazla yerde küçük varyasyonlarla görünür</li>
<li>Küçük değişikliklerle kopyala-yapıştır edilmiş kod</li>
<li>Farklı değişken adlarıyla temelde aynı şeyi yapan iki metot</li>
</ul>
<h3 id="sorunun-nedenleri-13">Sorunun Nedenleri</h3>
<ul>
<li>Aynı anda çalışan <strong>birden fazla programcı</strong> bağımsız olarak benzer çözümler yazar</li>
<li>Zaman baskısı ve teslim tarihi aciliyeti altında <strong>kopyala-yapıştır programlama</strong></li>
<li>Kodun <em>farklı göründüğü</em> ancak aynı işlemleri gerçekleştirdiği ince tekrarlama</li>
<li>Geliştirici tembelliği veya mevcut &quot;neredeyse doğru&quot; kodu yeniden yapılandırma yetersizliği</li>
</ul>
<p>Referans: <a href="https://refactoring.guru/smells/duplicate-code">RefactoringGuru -- Tekrarlanan Kod</a></p>

<h3 id="tedavi-yeniden-yap%C4%B1land%C4%B1rma-teknikleri-13">Tedavi (Yeniden Yapılandırma Teknikleri)</h3>
<table>
<thead>
<tr>
<th>Bağlam</th>
<th>Teknik</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Aynı sınıfın iki metodunda aynı kod</strong></td>
<td><strong>Metot Çıkarma (Extract Method)</strong> -- paylaşılan bir metot oluşturun</td>
</tr>
<tr>
<td><strong>İki alt sınıfta aynı kod</strong></td>
<td><strong>Metot Çıkarma</strong> + <strong>Metodu/Alanı Üste Taşıma (Pull Up Method/Field)</strong>; benzer ama aynı değilse <strong>Şablon Metot Oluşturma (Form Template Method)</strong> kullanın</td>
</tr>
<tr>
<td><strong>İlgisiz iki sınıfta aynı kod</strong></td>
<td>Hiyerarşiye bağlı olarak <strong>Sınıf Çıkarma (Extract Class)</strong> veya <strong>Üst Sınıf Çıkarma (Extract Superclass)</strong></td>
</tr>
<tr>
<td><strong>Koşullu tekrarlar</strong></td>
<td><strong>Koşullu İfadeyi Birleştirme (Consolidate Conditional Expression)</strong> + <strong>Metot Çıkarma (Extract Method)</strong></td>
</tr>
</tbody>
</table>
<h3 id="kazan%C3%A7-13">Kazanç</h3>
<ul>
<li>&quot;Tekrarlanan kodu birleştirmek kodunuzun yapısını <strong>basitleştirir</strong> ve kısaltır&quot;</li>
<li>Hata düzeltmelerinin birden fazla yerde değil yalnızca <strong>bir kez</strong> uygulanması gerekir</li>
<li>Anlaşılması daha kolay ve bakımı daha ucuz kod</li>
</ul>
<h3 id="ne-zaman-g%C3%B6rmezden-gelinir-9">Ne Zaman Görmezden Gelinir</h3>
<ul>
<li>Çok nadir durumlarda, aynı iki kod parçasını birleştirmek kodu <strong>daha az sezgisel</strong> yapabilir</li>
<li><strong>Test kodunda</strong>, testleri netlik için bağımsız ve tekrarlı tutmak bazen kabul edilebilir</li>
</ul>

<h2 id="mod%C3%BCl-e-gereksiz-3----tembel-s%C4%B1n%C4%B1f-lazy-class">Modül E: Gereksiz #3 -- Tembel Sınıf (Lazy Class)</h2>
<h3 id="nedir-14">Nedir?</h3>
<p>Varlığını haklı çıkarmak için <strong>çok az</strong> iş yapan bir sınıf. Sınıfları anlamak ve bakımını yapmak her zaman zaman ve para maliyetine sahiptir. Bu nedenle bir sınıf dikkatinizi hak edecek kadar iş yapmıyorsa, silinmelidir.</p>
<h3 id="belirtiler-ve-semptomlar-14">Belirtiler ve Semptomlar</h3>
<ul>
<li>Sınıf çok az metot veya alana sahiptir</li>
<li>Sınıf tek bir değeri sarmaktan fazlasını yapmaz</li>
<li>Diğer sınıflar bu sınıfın verileriyle tüm gerçek işi yapar</li>
</ul>
<h3 id="sorunun-nedenleri-14">Sorunun Nedenleri</h3>
<ul>
<li>Bir sınıf, <strong>yeniden yapılandırma</strong> orijinal işlevselliğini azalttıktan sonra gülünç derecede küçük olabilir</li>
<li>Ya da <strong>hiç gerçekleşmeyen gelecekteki geliştirmeyi desteklemek</strong> için tasarlanmıştır</li>
<li>Ya da <strong>çok agresif</strong> bir Sınıf Çıkarma yeniden yapılandırmasından oluşturulmuştur</li>
</ul>
<p>Referans: <a href="https://refactoring.guru/smells/lazy-class">RefactoringGuru -- Tembel Sınıf</a></p>

<h2 id="mod%C3%BCl-e-gereksiz-3----tembel-s%C4%B1n%C4%B1f-lazy-class-tedavi-ve-kazan%C3%A7">Modül E: Gereksiz #3 -- Tembel Sınıf (Lazy Class) (Tedavi ve Kazanç)</h2>
<h3 id="tedavi-yeniden-yap%C4%B1land%C4%B1rma-teknikleri-14">Tedavi (Yeniden Yapılandırma Teknikleri)</h3>
<table>
<thead>
<tr>
<th>Teknik</th>
<th>Ne Zaman Kullanılır</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Satır İçi Sınıf (Inline Class)</strong></td>
<td>Tembel sınıfı onu kullanan sınıfa birleştirin</td>
</tr>
<tr>
<td><strong>Hiyerarşiyi Daraltma (Collapse Hierarchy)</strong></td>
<td>Bir alt sınıf temelde üst sınıfıyla aynıysa, birleştirin</td>
</tr>
</tbody>
</table>
<h3 id="kazan%C3%A7-14">Kazanç</h3>
<ul>
<li>Azaltılmış <strong>kod boyutu</strong> ve anlaşılacak daha az sınıf</li>
<li>Daha kolay <strong>bakım</strong> -- daha az bilişsel yük</li>
<li>Daha basit sınıf hiyerarşisi ve navigasyonu</li>
</ul>
<h3 id="ne-zaman-g%C3%B6rmezden-gelinir-10">Ne Zaman Görmezden Gelinir</h3>
<ul>
<li>Bazen bir Tembel Sınıf <strong>gelecekteki geliştirme niyetlerini belirlemek</strong> için oluşturulur</li>
<li>Sınıf büyüyebilecek bir <strong>alan kavramını</strong> temsil ediyorsa, tutmak akıllıca olabilir</li>
<li>Sınıf <strong>tür güvenliği</strong> sağlıyorsa (örn. <code>EmailAddress</code> vs. <code>String</code>), basit olsa bile tutmaya değer olabilir</li>
<li>Açıklık ve basitlik arasında bir denge koruyun</li>
</ul>

<h2 id="mod%C3%BCl-e-gereksiz-4----veri-s%C4%B1n%C4%B1f%C4%B1-data-class">Modül E: Gereksiz #4 -- Veri Sınıfı (Data Class)</h2>
<h3 id="nedir-15">Nedir?</h3>
<p><strong>Veri sınıfı</strong>, yalnızca alanlar ve bunlara erişmek için ilkel metotlar (getter ve setter) içeren bir sınıftır. Bunlar basitçe diğer sınıflar tarafından kullanılan veriler için kaplardır. Herhangi bir ek işlevsellik içermez ve sahip oldukları veriler üzerinde bağımsız olarak çalışamazlar.</p>
<h3 id="belirtiler-ve-semptomlar-15">Belirtiler ve Semptomlar</h3>
<ul>
<li>Yalnızca özel alanlar, getter'lar ve setter'lar içeren bir sınıf</li>
<li>Veri üzerinde mantık veya işlem gerçekleştiren metotlar yok</li>
<li>Bu sınıfın verilerini manipüle eden tüm davranışlar <strong>diğer</strong> sınıflarda yaşar</li>
</ul>
<h3 id="sorunun-nedenleri-15">Sorunun Nedenleri</h3>
<ul>
<li>Yeni oluşturulmuş bir sınıfın yalnızca birkaç public alanı içermesi normaldir</li>
<li>Ancak nesnelerin gerçek gücü, veriyle birlikte <strong>davranış</strong> da içerebilmeleridir</li>
<li>Veri sınıfları, bu veriyle ilgili <strong>davranışın</strong> başka bir yerde yaşadığını gösterir -- bu kapsüllemeyi ihlal eder</li>
</ul>
<p>Referans: <a href="https://refactoring.guru/smells/data-class">RefactoringGuru -- Veri Sınıfı</a></p>

<tr>
<td><strong>Adım 2: Davranışı taşı</strong></td>
<td><strong>Metot Taşıma (Move Method)</strong> / <strong>Metot Çıkarma (Extract Method)</strong> -- istemci sınıflarında bu sınıfın verilerini manipüle eden kodu bulun ve veri sınıfına taşıyın</td>
</tr>
<tr>
<td><strong>Adım 3: Erişimi kaldır</strong></td>
<td><strong>Setter Metodunu Kaldırma (Remove Setting Method)</strong> -- oluşturulduktan sonra değiştirilmemesi gereken alanlar için. <strong>Metodu Gizleme (Hide Method)</strong> -- yalnızca sınıfın kendisinin ihtiyaç duyduğu getter'lar için.</td>
</tr>
</tbody>
</table>
<h3 id="kazan%C3%A7-15">Kazanç</h3>
<ul>
<li>Kodun <strong>anlaşılmasını ve organizasyonunu</strong> iyileştirir -- davranış ve veri bir arada</li>
<li>Aynı veriler üzerinde çalışan istemci sınıflarında <strong>tekrarlanan kodu</strong> keşfetmeye yardımcı olur</li>
<li>Sınıflar <strong>kendi kendine yeten</strong> ve kendi işlemlerini gerçekleştirebilen hale gelir</li>
</ul>
<h3 id="ne-zaman-g%C3%B6rmezden-gelinir-11">Ne Zaman Görmezden Gelinir</h3>
<ul>
<li>Veri sınıfları, katmanlar arasında tamamen taşıma kapları olarak hizmet ettiklerinde <strong>DTO'lar (Veri Transfer Nesneleri)</strong> olarak kabul edilebilir</li>
<li><strong>Fonksiyonel programlama</strong> tarzında, veriyi davranıştan ayırmak kasıtlı olabilir</li>
</ul>
