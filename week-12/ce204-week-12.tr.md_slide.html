<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="mod%C3%BCl-e-gereksiz-5----%C3%B6l%C3%BC-kod-dead-code">Modül E: Gereksiz #5 -- Ölü Kod (Dead Code)</h2>
<h3 id="nedir-16">Nedir?</h3>
<p>Bir değişken, parametre, alan, metot veya sınıf <strong>artık kullanılmıyor</strong> (genellikle eskidiği için).</p>
<h3 id="belirtiler-ve-semptomlar-16">Belirtiler ve Semptomlar</h3>
<ul>
<li>Kullanılmayan değişkenler, parametreler veya alanlar</li>
<li>Hiç çağrılmayan metotlar</li>
<li>Hiç örneklenmeyen sınıflar</li>
<li>Asla erişilemeyecek kod dalları (örn. <code>if (false) { ... }</code>)</li>
<li>&quot;Her ihtimale karşı&quot; geride bırakılmış yorum satırına alınmış kod</li>
</ul>
<h3 id="sorunun-nedenleri-16">Sorunun Nedenleri</h3>
<ul>
<li>Gereksinimler değişti ve eski kod <strong>hiç temizlenmedi</strong></li>
<li>Kod &quot;geçici olarak&quot; <strong>yorum satırına alındı</strong> ve hiç kaldırılmadı</li>
<li>Ölü kod genellikle <strong>kütüphane güncellemeleri</strong> veya <strong>özellik kaldırmalarından</strong> sonra birikir</li>
<li>&quot;Daha sonra gerekebilir&quot; korkusuyla kod kaldırma çekincesi</li>
<li>Belirli dalların erişilemez hale geldiği karmaşık koşullar</li>
</ul>
<p>Referans: <a href="https://refactoring.guru/smells/dead-code">RefactoringGuru -- Ölü Kod</a></p>

<h3 id="tedavi-yeniden-yap%C4%B1land%C4%B1rma-teknikleri-16">Tedavi (Yeniden Yapılandırma Teknikleri)</h3>
<table>
<thead>
<tr>
<th>Teknik</th>
<th>Ne Zaman Kullanılır</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Kullanılmayan kodu silin</strong></td>
<td>En basit ve en etkili tedavi -- sadece silin</td>
</tr>
<tr>
<td><strong>Parametreyi Kaldırma (Remove Parameter)</strong></td>
<td>Metot imzalarından kullanılmayan parametreleri ortadan kaldırın</td>
</tr>
<tr>
<td><strong>Satır İçi Sınıf (Inline Class)</strong> veya <strong>Hiyerarşiyi Daraltma (Collapse Hierarchy)</strong></td>
<td>Gereksiz sınıflar için</td>
</tr>
<tr>
<td><strong>IDE araçlarını kullanın</strong></td>
<td>Modern IDE'ler ve statik analiz araçları kullanılmayan kodu verimli bir şekilde tanımlayabilir</td>
</tr>
</tbody>
</table>
<h3 id="kazan%C3%A7-16">Kazanç</h3>
<ul>
<li><strong>Azaltılmış kod boyutu</strong> -- okunacak, anlaşılacak ve bakımı yapılacak daha az kod</li>
<li><strong>Daha basit destek</strong> -- ölü kodun bakımının yapılıp yapılmaması gerektiği konusunda kafa karışıklığı yok</li>
<li><strong>Daha temiz kod tabanı</strong> -- gezinmesi ve araması daha kolay</li>
</ul>
<h3 id="temel-bak%C4%B1%C5%9F-a%C3%A7%C4%B1s%C4%B1-1">Temel Bakış Açısı</h3>
<blockquote>
<p>Unutmayın: <strong>Git her şeyi hatırlar</strong> -- silinen kodu sürüm geçmişinden her zaman geri alabilirsiniz. Ölü kodu &quot;her ihtimale karşı&quot; tutmak için hiçbir neden yoktur.</p>
</blockquote>

<h2 id="mod%C3%BCl-e-gereksiz-6----spek%C3%BClatif-genellik-speculative-generality">Modül E: Gereksiz #6 -- Spekülatif Genellik (Speculative Generality)</h2>
<h3 id="nedir-17">Nedir?</h3>
<p><strong>Hiç uygulanmayan</strong> gelecekteki özellikleri desteklemek için oluşturulmuş <strong>kullanılmayan bir sınıf, metot, alan veya parametre</strong> vardır.</p>
<h3 id="belirtiler-ve-semptomlar-17">Belirtiler ve Semptomlar</h3>
<ul>
<li>Yalnızca tek bir somut uygulaması olan soyut sınıflar</li>
<li>Hiçbir çağıran tarafından kullanılmayan parametreleri olan metotlar</li>
<li>&quot;Bir gün ihtiyacımız olursa diye&quot; var olan sınıflar</li>
<li>Basit problemlere uygulanan aşırı karmaşık tasarım kalıpları</li>
</ul>
<h3 id="sorunun-nedenleri-17">Sorunun Nedenleri</h3>
<ul>
<li>&quot;Bir gün buna ihtiyacımız olacak&quot; -- ama o gün hiç gelmez</li>
<li><strong>Tasarım kalıplarının</strong> ve <strong>soyutlamanın</strong> aşırı hevesli uygulanması</li>
<li>Daha sonra <strong>iptal edilen</strong> özellikleri öngören bir tasarım aşamasında oluşturulmuş</li>
<li>Belirli bir çözüm yeterli olduğunda &quot;genel amaçlı&quot; bir çerçeve oluşturma arzusu</li>
</ul>
<p>Referans: <a href="https://refactoring.guru/smells/speculative-generality">RefactoringGuru -- Spekülatif Genellik</a></p>

}

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="mod%C3%BCl-e-gereksiz-6----spek%C3%BClatif-genellik-speculative-generality-tedavi-ve-kazan%C3%A7">Modül E: Gereksiz #6 -- Spekülatif Genellik (Speculative Generality) (Tedavi ve Kazanç)</h2>
<h3 id="tedavi-yeniden-yap%C4%B1land%C4%B1rma-teknikleri-17">Tedavi (Yeniden Yapılandırma Teknikleri)</h3>
<table>
<thead>
<tr>
<th>Teknik</th>
<th>Ne Zaman Kullanılır</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Hiyerarşiyi Daraltma (Collapse Hierarchy)</strong></td>
<td>Yalnızca tek bir alt sınıfı olan gereksiz soyut sınıfları kaldırın</td>
</tr>
<tr>
<td><strong>Satır İçi Sınıf (Inline Class)</strong></td>
<td>Sınıflar arasındaki gereksiz devretmeyi ortadan kaldırın</td>
</tr>
<tr>
<td><strong>Satır İçi Metot (Inline Method)</strong></td>
<td>Kullanılmayan metotları silin</td>
</tr>
<tr>
<td><strong>Parametreyi Kaldırma (Remove Parameter)</strong></td>
<td>Gereksiz parametreleri olan metotları temizleyin</td>
</tr>
<tr>
<td><strong>Doğrudan silme</strong></td>
<td>Kullanılmayan alanları basitçe silin</td>
</tr>
</tbody>
</table>
<h3 id="kazan%C3%A7-17">Kazanç</h3>
<ul>
<li><strong>Daha ince kod</strong> -- okunacak, anlaşılacak ve bakımı yapılacak daha az şey</li>
<li><strong>Daha temiz mimari</strong> -- tasarımı karmaşıklaştıran hayalet soyutlamalar yok</li>
<li><strong>YAGNI</strong> ilkesini takip eder (İhtiyacınız Olmayacak - You Aren't Gonna Need It)</li>
</ul>
<h3 id="ne-zaman-g%C3%B6rmezden-gelinir-12">Ne Zaman Görmezden Gelinir</h3>
<ul>
<li>Bir <strong>çerçeve</strong> üzerinde çalışıyorsanız, çerçeve kullanıcıları için işlevsellik oluşturmak makuldür</li>
<li>Bir test, mocking amacıyla soyut bir sınıf veya arayüz kullanıyorsa</li>
<li>Özellik aktif planlamada ise ve bir sonraki sprint'te uygulanacaksa</li>
</ul>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="mod%C3%BCl-e-%C3%B6zet">Modül E: Özet</h2>
<h3 id="temel-noktalar----gereksizler-dispensables">Temel Noktalar -- Gereksizler (Dispensables)</h3>
<table>
<thead>
<tr>
<th>Koku</th>
<th>Temel Çıkarım</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Yorumlar (Comments)</strong></td>
<td>Kodu kendi kendini belgeleyen yapın; yorumlar &quot;ne&quot; değil &quot;neden&quot; açıklamalı</td>
</tr>
<tr>
<td><strong>Tekrarlanan Kod (Duplicate Code)</strong></td>
<td>Ortak kodu çıkarın; her değişiklik yalnızca bir kez yapılmalı</td>
</tr>
<tr>
<td><strong>Tembel Sınıf (Lazy Class)</strong></td>
<td>Bir sınıf hak etmiyorsa, satır içi yapın</td>
</tr>
<tr>
<td><strong>Veri Sınıfı (Data Class)</strong></td>
<td>Davranışı verilerin yanına taşıyın</td>
</tr>
<tr>
<td><strong>Ölü Kod (Dead Code)</strong></td>
<td>Silin -- Git her şeyi hatırlar</td>
</tr>
<tr>
<td><strong>Spekülatif Genellik (Speculative Generality)</strong></td>
<td>YAGNI -- hayal edilen gelecek gereksinimler için inşa etmeyin</td>
</tr>
</tbody>
</table>
<h3 id="ortak-konu-3">Ortak Konu</h3>
<p>Gereksizler <strong>gereksiz karmaşıklığı kaldırmakla</strong> ilgilidir. Daha az kod, daha az hata, daha kolay bakım ve daha hızlı kavrama anlamına gelir. Çalışan en basit kod genellikle en iyi koddur.</p>
<blockquote>
<p>&quot;Mükemmellik, eklenecek hiçbir şey kalmadığında değil, çıkarılacak hiçbir şey kalmadığında elde edilir.&quot; -- Antoine de Saint-Exupery</p>
</blockquote>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-12</footer>

<h2 id="mod%C3%BCl-f-ba%C4%9Flay%C4%B1c%C4%B1lar-couplers----genel-bak%C4%B1%C5%9F">Modül F: Bağlayıcılar (Couplers) -- Genel Bakış</h2>
<p>Bu gruptaki tüm kokular sınıflar arasında <strong>aşırı bağlantıya</strong> katkıda bulunur veya bağlantının <strong>aşırı devretmeyle</strong> değiştirildiğinde ne olduğunu gösterir.</p>
<h3 id="4-ba%C4%9Flay%C4%B1c%C4%B1-kokusu">4 Bağlayıcı Kokusu</h3>
<table>
<thead>
<tr>
<th>#</th>
<th>Koku</th>
<th>Temel Sorun</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td><strong>Özellik Kıskançlığı (Feature Envy)</strong></td>
<td>Bir metot kendi verisinden çok başka bir nesnenin verisine erişir</td>
</tr>
<tr>
<td>2</td>
<td><strong>Uygunsuz Yakınlık (Inappropriate Intimacy)</strong></td>
<td>Bir sınıf başka bir sınıfın iç alanlarını/metotlarını kullanır</td>
</tr>
<tr>
<td>3</td>
<td><strong>Mesaj Zincirleri (Message Chains)</strong></td>
<td><code>a.getB().getC().getD().doSomething()</code></td>
</tr>
<tr>
<td>4</td>
<td><strong>Aracı (Middle Man)</strong></td>
<td>Bir sınıf yalnızca başka bir sınıfa devretir</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Bu kokular, aşırı bağlantının kodda ortaya çıkmasının farklı yollarını temsil eder; doğrudan veri erişimi veya kırılgan bağımlılıklar oluşturan devretme zincirleri aracılığıyla.</p>
</blockquote>
<p>Referans: <a href="https://refactoring.guru/refactoring/smells/couplers">RefactoringGuru -- Bağlayıcılar</a></p>

<h2 id="mod%C3%BCl-f-ba%C4%9Flay%C4%B1c%C4%B1-1----%C3%B6zellik-k%C4%B1skan%C3%A7l%C4%B1%C4%9F%C4%B1-feature-envy">Modül F: Bağlayıcı #1 -- Özellik Kıskançlığı (Feature Envy)</h2>
<h3 id="nedir-18">Nedir?</h3>
<p>Bir metot, kendi verisinden çok <strong>başka bir nesnenin verisine</strong> erişir. Metot başka bir sınıfa &quot;kıskanç&quot;tır.</p>
<h3 id="belirtiler-ve-semptomlar-18">Belirtiler ve Semptomlar</h3>
<ul>
<li>Başka bir nesnenin birçok getter'ını çağıran bir metot</li>
<li>Metot kendi sınıfından çok başka bir sınıfın alanlarını/metotlarını kullanır</li>
<li>Metot başka bir sınıfa aitmiş gibi görünür</li>
</ul>
<h3 id="sorunun-nedenleri-18">Sorunun Nedenleri</h3>
<ul>
<li>Bu koku sıklıkla alanlar bir <strong>veri sınıfına</strong> taşındığında ortaya çıkar</li>
<li>Bu durumda, veri üzerindeki işlemleri de o sınıfa taşımak isteyebilirsiniz</li>
<li>Bir metot geliştirme sırasında <strong>yanlış sınıfa</strong> yerleştirilmiştir</li>
<li>Kendi verisinden çok başka bir sınıfın verisi üzerinde çalışır</li>
</ul>
<p>Referans: <a href="https://refactoring.guru/smells/feature-envy">RefactoringGuru -- Özellik Kıskançlığı</a></p>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="mod%C3%BCl-f-ba%C4%9Flay%C4%B1c%C4%B1-1----%C3%B6zellik-k%C4%B1skan%C3%A7l%C4%B1%C4%9F%C4%B1-feature-envy-tedavi-ve-kazan%C3%A7">Modül F: Bağlayıcı #1 -- Özellik Kıskançlığı (Feature Envy) (Tedavi ve Kazanç)</h2>
<h3 id="tedavi-yeniden-yap%C4%B1land%C4%B1rma-teknikleri-18">Tedavi (Yeniden Yapılandırma Teknikleri)</h3>
<table>
<thead>
<tr>
<th>Teknik</th>
<th>Ne Zaman Kullanılır</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Metot Taşıma (Move Method)</strong></td>
<td>Metodu verisini en çok kullandığı sınıfa taşıyın</td>
</tr>
<tr>
<td><strong>Metot Çıkarma (Extract Method)</strong></td>
<td>Metodun yalnızca bir kısmı başka bir nesneyi kıskanıyorsa, o kısmı çıkarıp taşıyın</td>
</tr>
</tbody>
</table>
<h3 id="kazan%C3%A7-18">Kazanç</h3>
<ul>
<li>Daha az <strong>kod tekrarı</strong> (kıskanç mantık başka bir yerde tekrarlanmışsa)</li>
<li>Daha iyi <strong>kod organizasyonu</strong> -- veri ve davranışı aynı yerde</li>
</ul>
<h3 id="ne-zaman-g%C3%B6rmezden-gelinir-13">Ne Zaman Görmezden Gelinir</h3>
<ul>
<li>Özellik Kıskançlığı davranışsal tasarım kalıplarında <strong>kasıtlı olarak</strong> kullanıldığında:
<ul>
<li><strong>Strateji Kalıbı (Strategy Pattern)</strong>: Davranış kasıtlı olarak veri sınıfından ayrılır</li>
<li><strong>Ziyaretçi Kalıbı (Visitor Pattern)</strong>: İşlemler nesne yapısından ayrılır</li>
<li><strong>Komut Kalıbı (Command Pattern)</strong>: Komutlar diğer nesnelerin verisi üzerinde çalışır</li>
</ul>
</li>
</ul>
<blockquote>
<p>Bir metot kasıtlı olarak veriyi davranıştan ayıran bir tasarım kalıbına aitse, Özellik Kıskançlığı kabul edilebilir.</p>
</blockquote>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-12</footer>

<h2 id="mod%C3%BCl-f-ba%C4%9Flay%C4%B1c%C4%B1-2----uygunsuz-yak%C4%B1nl%C4%B1k-inappropriate-intimacy">Modül F: Bağlayıcı #2 -- Uygunsuz Yakınlık (Inappropriate Intimacy)</h2>
<h3 id="nedir-19">Nedir?</h3>
<p>Bir sınıf, başka bir sınıfın <strong>iç alanlarını ve metotlarını</strong> kullanır. İyi sınıflar birbirleri hakkında mümkün olduğunca az bilmelidir -- bu, sınıfları bakımı kolay ve yeniden kullanılabilir hale getirir.</p>
<h3 id="belirtiler-ve-semptomlar-19">Belirtiler ve Semptomlar</h3>
<ul>
<li>Bir sınıf başka bir sınıfın alanlarına doğrudan erişir (özellikle özel olmayanlar)</li>
<li>Bir sınıf başka bir sınıfın iç uygulama detaylarına bağlıdır</li>
<li>İki sınıfın birbirinin iç yapısına referans verdiği çift yönlü bağımlılıklar</li>
<li>Bir sınıfı değiştirmek sıklıkla diğerini bozar</li>
</ul>
<h3 id="sorunun-nedenleri-19">Sorunun Nedenleri</h3>
<ul>
<li>Birbirinin özel bölümlerini fazla kurcalayan sınıflar</li>
<li>Genellikle sınırların dikkatle korunmadığı <strong>artımlı geliştirmeden</strong> kaynaklanır</li>
<li>Kolaylık odaklı kodlama yoluyla zamanla oluşan sıkı bağlantı</li>
</ul>
<p>Referans: <a href="https://refactoring.guru/smells/inappropriate-intimacy">RefactoringGuru -- Uygunsuz Yakınlık</a></p>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// KOKU: Uygunsuz Yakınlık -- Order Customer&#x27;ın iç yapısına erişiyor</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Customer</span> {
    <span class="hljs-type">int</span> loyaltyPoints;              <span class="hljs-comment">// Özel olmalı!</span>
    List&lt;Order&gt; orderHistory;       <span class="hljs-comment">// Order&#x27;a açık!</span>
    String membershipTier;          <span class="hljs-comment">// Doğrudan erişiliyor!</span>
}

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Order</span> {
    <span class="hljs-keyword">private</span> Customer customer;

    <span class="hljs-comment">// Customer&#x27;ın iç alanlarına doğrudan erişiyor ve değiştiriyor!</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">applyDiscount</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">if</span> (customer.loyaltyPoints &gt; <span class="hljs-number">1000</span>) {  <span class="hljs-comment">// İç alana erişim</span>
            customer.loyaltyPoints -= <span class="hljs-number">100</span>;     <span class="hljs-comment">// İç alanı değiştirme!</span>
            <span class="hljs-built_in">this</span>.discount = <span class="hljs-number">0.10</span>;
        }
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">addToHistory</span><span class="hljs-params">()</span> {
        customer.orderHistory.add(<span class="hljs-built_in">this</span>);       <span class="hljs-comment">// Koleksiyonu doğrudan değiştirme!</span>
    }

    <span class="hljs-keyword">public</span> <span class="hljs-type">boolean</span> <span class="hljs-title function_">isVipOrder</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> customer.membershipTier.equals(<span class="hljs-string">&quot;GOLD&quot;</span>)  <span class="hljs-comment">// İç detaylar!</span>
            &amp;&amp; customer.orderHistory.size() &gt; <span class="hljs-number">50</span>;
    }
}

<h2 id="mod%C3%BCl-f-ba%C4%9Flay%C4%B1c%C4%B1-2----uygunsuz-yak%C4%B1nl%C4%B1k-inappropriate-intimacy-java-%C3%B6rne%C4%9Fi----sonra">Modül F: Bağlayıcı #2 -- Uygunsuz Yakınlık (Inappropriate Intimacy) (Java Örneği -- Sonra)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// YENİDEN YAPILANDIRILMIŞ: Doğru kapsülleme -- Metot Taşıma + Alanları gizle</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Customer</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-type">int</span> loyaltyPoints;
    <span class="hljs-keyword">private</span> List&lt;Order&gt; orderHistory;
    <span class="hljs-keyword">private</span> String membershipTier;

    <span class="hljs-keyword">public</span> <span class="hljs-type">boolean</span> <span class="hljs-title function_">canRedeemDiscount</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> loyaltyPoints &gt; <span class="hljs-number">1000</span>;
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">redeemDiscount</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">if</span> (!canRedeemDiscount()) <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">IllegalStateException</span>();
        loyaltyPoints -= <span class="hljs-number">100</span>;
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">addOrder</span><span class="hljs-params">(Order order)</span> {
        orderHistory.add(order);
    }

    <span class="hljs-keyword">public</span> <span class="hljs-type">boolean</span> <span class="hljs-title function_">isVip</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;GOLD&quot;</span>.equals(membershipTier) &amp;&amp; orderHistory.size() &gt; <span class="hljs-number">50</span>;
    }
}

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Order</span> {
    <span class="hljs-keyword">private</span> Customer customer;

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">applyDiscount</span><span class="hljs-params">()</span> {

<h3 id="tedavi-yeniden-yap%C4%B1land%C4%B1rma-teknikleri-19">Tedavi (Yeniden Yapılandırma Teknikleri)</h3>
<table>
<thead>
<tr>
<th>Teknik</th>
<th>Ne Zaman Kullanılır</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Metot Taşıma / Alan Taşıma (Move Method / Move Field)</strong></td>
<td>Bir sınıfın parçalarını en çok ilişkili oldukları sınıfa taşıyın</td>
</tr>
<tr>
<td><strong>Sınıf Çıkarma (Extract Class)</strong> ve <strong>Temsilciyi Gizleme (Hide Delegate)</strong></td>
<td>Paylaşılan işlevselliği ayrı bir sınıfa çıkararak ilişkiyi resmileştirin</td>
</tr>
<tr>
<td><strong>Çift Yönlü İlişkiyi Tek Yönlü İlişkiye Dönüştürme (Change Bidirectional Association to Unidirectional)</strong></td>
<td>İki sınıf karşılıklı birbirine bağlı olduğunda, tek yönlü bağımlılığa dönüştürün</td>
</tr>
<tr>
<td><strong>Devretmeyi Kalıtımla Değiştirme (Replace Delegation with Inheritance)</strong></td>
<td>Bir sınıf gerçekten diğerinin özel bir versiyonu olduğunda</td>
</tr>
</tbody>
</table>
<h3 id="kazan%C3%A7-19">Kazanç</h3>
<ul>
<li>Geliştirilmiş <strong>kod organizasyonu</strong> ve yapısı</li>
<li>Basitleştirilmiş <strong>bakım</strong> ve iyileştirilmiş kod yeniden kullanılabilirliği</li>
<li>Daha iyi <strong>kapsülleme</strong> -- sınıflar yalnızca ihtiyaç duydukları şeyi açığa çıkarır</li>
<li><strong>Demeter Yasasına</strong> uyar (en az bilgi ilkesi)</li>
</ul>

<h2 id="mod%C3%BCl-f-ba%C4%9Flay%C4%B1c%C4%B1-3----mesaj-zincirleri-message-chains">Modül F: Bağlayıcı #3 -- Mesaj Zincirleri (Message Chains)</h2>
<h3 id="nedir-20">Nedir?</h3>
<p>Kodda <code>a.getB().getC().getD()</code> benzeri bir dizi çağrı görürsünüz. Bu zincirler, istemcinin sınıf hiyerarşisinin <strong>navigasyon yapısına bağlı</strong> olduğu anlamına gelir.</p>
<h3 id="belirtiler-ve-semptomlar-20">Belirtiler ve Semptomlar</h3>
<ul>
<li>Bir nesne grafiğini dolaşan uzun metot çağrı zincirleri</li>
<li>İstemcinin birden fazla sınıfın iç yapısını bilmesi gerekir</li>
<li>Ara ilişkilerdeki herhangi bir değişiklik istemciyi değiştirmeyi gerektirir</li>
</ul>
<h3 id="sorunun-nedenleri-20">Sorunun Nedenleri</h3>
<ul>
<li>Mesaj zincirleri, bir istemcinin ihtiyaç duyduğu bilgiyi bulmak için bir <strong>nesne grafiğinde</strong> gezinmesi gerektiğinde oluşturulur</li>
<li>İstemci bir nesne ister, bu nesne başka bir nesne ister, o da başka birini ister</li>
<li>Bu, tüm navigasyon yapısına sıkı bağlantı oluşturur</li>
</ul>
<p>Referans: <a href="https://refactoring.guru/smells/message-chains">RefactoringGuru -- Mesaj Zincirleri</a></p>

<h3 id="tedavi-yeniden-yap%C4%B1land%C4%B1rma-teknikleri-20">Tedavi (Yeniden Yapılandırma Teknikleri)</h3>
<table>
<thead>
<tr>
<th>Teknik</th>
<th>Ne Zaman Kullanılır</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Temsilciyi Gizleme (Hide Delegate)</strong></td>
<td>Her seviyede zinciri kapsülleyen sarmalayıcı metotlar oluşturun</td>
</tr>
<tr>
<td><strong>Metot Çıkarma (Extract Method)</strong></td>
<td>Zinciri iyi adlandırılmış bir metoda çıkarın</td>
</tr>
<tr>
<td><strong>Metot Taşıma (Move Method)</strong></td>
<td>Zinciri kullanan metodu veriye sahip sınıfa taşıyın</td>
</tr>
</tbody>
</table>
<h3 id="kazan%C3%A7-20">Kazanç</h3>
<ul>
<li>Bir zincirdeki sınıflar arasında <strong>bağımlılıkları</strong> azaltır</li>
<li>İstemcideki <strong>şişmiş kod</strong> miktarını azaltır</li>
<li>İstemci iç navigasyon yapısından ayrıştırılır</li>
<li>Ara sınıflardaki değişiklikler istemcilere yayılmaz</li>
</ul>
<h3 id="ne-zaman-g%C3%B6rmezden-gelinir-14">Ne Zaman Görmezden Gelinir</h3>
<ul>
<li><strong>Aşırı agresif temsilci gizleme</strong> <strong>Aracı (Middle Man)</strong> kokusuna yol açabilir</li>
<li>Zincir <strong>kararlı, iyi bilinen bir yapıyı</strong> yansıtıyorsa (örn. <code>request.getSession().getAttribute()</code>), kabul edilebilir olabilir</li>
<li>Doğru dengeyi bulun: ne çok fazla zincir ne de çok fazla temsilci metot</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Mesaj Zinciri  &lt;------- Denge -------&gt;  Aracı
(çok fazla bağlantı)                  (çok fazla devretme)
</code></pre>

<h3 id="nedir-21">Nedir?</h3>
<p>Bir sınıf yalnızca <strong>tek bir eylem</strong> gerçekleştiriyorsa -- işi başka bir sınıfa devretmek -- neden var ki?</p>
<h3 id="belirtiler-ve-semptomlar-21">Belirtiler ve Semptomlar</h3>
<ul>
<li>Metotların çoğunluğu basitçe çağrıları başka bir sınıfa ileten bir sınıf</li>
<li>Sınıf mantık, doğrulama, dönüştürme eklemiyor</li>
<li>İstemciler temsilciyi doğrudan çağırabilir</li>
</ul>
<h3 id="sorunun-nedenleri-21">Sorunun Nedenleri</h3>
<ul>
<li><strong>Mesaj Zincirlerini aşırı hevesle ortadan kaldırma</strong> -- geliştiriciler metot zincirlerini kırmak için agresif bir şekilde yeniden yapılandırmış ve kasıtsız olarak gereksiz ara sınıflar oluşturmuş olabilir</li>
<li><strong>Sorumluluğun kademeli erozyonu</strong> -- bir sınıfın kullanışlı işlevselliği kademeli olarak başka yerlere taşınır, geride yalnızca devretme yapan boş bir kabuk kalır</li>
</ul>
<p>Referans: <a href="https://refactoring.guru/smells/middle-man">RefactoringGuru -- Aracı</a></p>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// YENİDEN YAPILANDIRILMIŞ: Aracıyı Kaldır -- istemci Manager&#x27;a doğrudan erişir</span>

<span class="hljs-comment">// İstemci kodu -- doğrudan etkileşim</span>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="mod%C3%BCl-f-ba%C4%9Flay%C4%B1c%C4%B1-4----arac%C4%B1-middle-man-tedavi-ve-kazan%C3%A7">Modül F: Bağlayıcı #4 -- Aracı (Middle Man) (Tedavi ve Kazanç)</h2>
<h3 id="tedavi-yeniden-yap%C4%B1land%C4%B1rma-teknikleri-21">Tedavi (Yeniden Yapılandırma Teknikleri)</h3>
<table>
<thead>
<tr>
<th>Teknik</th>
<th>Ne Zaman Kullanılır</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Aracıyı Kaldırma (Remove Middle Man)</strong></td>
<td>Çoğu metot saf devretme olduğunda istemcinin son nesneyi doğrudan çağırmasını sağlayın</td>
</tr>
<tr>
<td><strong>Satır İçi Metot (Inline Method)</strong></td>
<td>Önemsiz devretme metotları için</td>
</tr>
<tr>
<td><strong>Devretmeyi Kalıtımla Değiştirme (Replace Delegation with Inheritance)</strong></td>
<td>Aracı her zaman aynı sınıfa devretiyorsa, onu bir alt sınıf yapmayı düşünün</td>
</tr>
</tbody>
</table>
<h3 id="kazan%C3%A7-21">Kazanç</h3>
<ul>
<li><strong>Daha az şişmiş kod</strong> -- gereksiz ara sınıflar yok</li>
<li><strong>Daha açık kod</strong> -- işin gerçekten nerede yapıldığını görebilirsiniz</li>
<li>Daha basit sınıf hiyerarşisi</li>
</ul>
<h3 id="ne-zaman-g%C3%B6rmezden-gelinir-15">Ne Zaman Görmezden Gelinir</h3>
<ul>
<li>Bir Aracı kasıtlı olarak <strong>sınıflar arası bağımlılıklardan kaçınmak</strong> için eklenmiş olabilir</li>
<li>Aracı kasıtlı olarak <strong>Cephe (Facade)</strong>, <strong>Vekil (Proxy)</strong> veya <strong>Dekoratör (Decorator)</strong> kalıplarının bir parçası olabilir</li>
<li>Kaldırmak temsilci sınıfın çok fazla iç yapısını açığa çıkaracaksa, tutun</li>
<li>Aracıyı kaldırmak <strong>Mesaj Zincirleri</strong> oluşturacaksa kaldırmayın -- doğru dengeyi bulun</li>
</ul>

<h2 id="mod%C3%BCl-f-%C3%B6zet">Modül F: Özet</h2>
<h3 id="temel-noktalar----ba%C4%9Flay%C4%B1c%C4%B1lar-couplers">Temel Noktalar -- Bağlayıcılar (Couplers)</h3>
<table>
<thead>
<tr>
<th>Koku</th>
<th>Temel Çıkarım</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Özellik Kıskançlığı (Feature Envy)</strong></td>
<td>Metodu verisini en çok kullandığı sınıfa taşıyın</td>
</tr>
<tr>
<td><strong>Uygunsuz Yakınlık (Inappropriate Intimacy)</strong></td>
<td>Kapsüllemeyi uygulayın; sınıflar birbirleri hakkında mümkün olduğunca az bilmeli</td>
</tr>
<tr>
<td><strong>Mesaj Zincirleri (Message Chains)</strong></td>
<td>İstemcinin navigasyon yapısına bağlantısını azaltmak için temsilcileri gizleyin</td>
</tr>
<tr>
<td><strong>Aracı (Middle Man)</strong></td>
<td>Bir sınıf yalnızca devretiyorsa, istemcilerin temsilciyi doğrudan çağırmasına izin verin</td>
</tr>
</tbody>
</table>
<h3 id="ba%C4%9Flant%C4%B1-spektrumu">Bağlantı Spektrumu</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Sıkı Bağlantı &lt;-------- Hedef --------&gt; Gevşek Bağlantı
(Özellik Kıskançlığı,   (Doğru denge)    (Aracı,
 Uygunsuz                                 Aşırı
 Yakınlık)                                Devretme)
</code></pre>
<blockquote>
<p>Hedef <strong>yeterli bağlantıdır</strong> -- değişikliklerin her yere yayılacağı kadar fazla değil ve kodun önemsiz devretmeler labirentine dönüşeceği kadar az değil.</p>
</blockquote>

<h2 id="%C3%B6zet-t%C3%BCm-22-kod-kokusu-bir-bak%C4%B1%C5%9Fta">Özet: Tüm 22 Kod Kokusu Bir Bakışta</h2>
<table>
<thead>
<tr>
<th>Kategori</th>
<th>Kokular</th>
<th>Temel Sorun</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Şişkinler (Bloaters)</strong></td>
<td>Uzun Metot, Büyük Sınıf, İlkel Takıntı, Uzun Parametre Listesi, Veri Kümeleri</td>
<td>Çok büyümüş kod</td>
</tr>
<tr>
<td><strong>NE Kötüye Kullananlar (OO Abusers)</strong></td>
<td>Switch İfadeleri, Geçici Alan, Reddedilen Miras, Farklı Arayüzlere Sahip Alternatif Sınıflar</td>
<td>NYP'nin yanlış uygulanması</td>
</tr>
<tr>
<td><strong>Değişim Engelleyiciler (Change Preventers)</strong></td>
<td>Iraksak Değişim, Saçma Ameliyat, Paralel Kalıtım Hiyerarşileri</td>
<td>Değişiklikler orantısız çaba gerektirir</td>
</tr>
<tr>
<td><strong>Gereksizler (Dispensables)</strong></td>
<td>Yorumlar, Tekrarlanan Kod, Tembel Sınıf, Veri Sınıfı, Ölü Kod, Spekülatif Genellik</td>
<td>Gereksiz karmaşıklık</td>
</tr>
<tr>
<td><strong>Bağlayıcılar (Couplers)</strong></td>
<td>Özellik Kıskançlığı, Uygunsuz Yakınlık, Mesaj Zincirleri, Aracı</td>
<td>Aşırı bağlantı veya devretme</td>
</tr>
</tbody>
</table>

<h2 id="%C3%B6zet-temel-yeniden-yap%C4%B1land%C4%B1rma-i%CC%87lkeleri">Özet: Temel Yeniden Yapılandırma İlkeleri</h2>
<h3 id="hat%C4%B1rlatma">Hatırlatma</h3>
<ul>
<li>Kod kokuları <strong>göstergelerdir</strong>, mutlak kurallar değil -- bağlam önemlidir</li>
<li>Her kokunun bir &quot;Ne Zaman Görmezden Gelinir&quot; durumu vardır</li>
<li>Yeniden yapılandırma <strong>küçük, güvenli değişiklikleri</strong> sürekli yapmakla ilgilidir</li>
<li>Yeniden yapılandırma için en iyi zaman <strong>şimdidir</strong> -- teknik borç yalnızca büyür</li>
<li>Yeniden yapılandırma ve özellik geliştirmeyi asla aynı commit'te karıştırmayın</li>
<li>Yeniden yapılandırma sonrasında tüm mevcut testler geçmelidir</li>
</ul>
<h3 id="yeniden-yap%C4%B1land%C4%B1rma-zihniyeti">Yeniden Yapılandırma Zihniyeti</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code> Kokuyu Tespit Et --&gt; Tekniği Seç --&gt; Küçük Değişiklik Uygula --&gt; Testleri Çalıştır
      ^                                                               |
      |                                                               v
      +-------------------- Gerekirse Tekrarla ----------------------+
</code></pre>
<blockquote>
<p>&quot;Yeniden yapılandırmanın anahtarı küçük adımlarla çalışmaktır. Küçük bir değişiklik yaparsınız, test edersiniz, başka bir küçük değişiklik yaparsınız, test edersiniz.&quot; -- Martin Fowler</p>
</blockquote>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-12</footer>
</section>

<h2 id="kaynaklar">Kaynaklar</h2>
<ul>
