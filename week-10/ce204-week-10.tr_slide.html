<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="yap%C4%B1sal-tasar%C4%B1m-desenleri-nedir">Yapısal Tasarım Desenleri Nedir?</h2>
<p>Yapısal tasarım desenleri, nesnelerin ve sınıfların <strong>daha büyük yapılar halinde nasıl birleştirileceğini</strong> açıklarken, bu yapıların <strong>esnek ve verimli</strong> kalmasını sağlar.</p>
<p>Ele aldıkları konular:</p>
<ul>
<li><strong>Sınıf bileşimi</strong>: Sınıfların birbirinden nasıl miras aldığı</li>
<li><strong>Nesne bileşimi</strong>: Nesnelerin daha büyük yapılar oluşturmak için nasıl birleştirildiği</li>
<li><strong>Arayüz basitleştirme</strong>: Karmaşık alt sistemlerin istemcilere nasıl sunulduğu</li>
<li><strong>Bellek optimizasyonu</strong>: Paylaşılan durumun kaynak tüketimini nasıl azalttığı</li>
</ul>
<p>Kaynak: <a href="https://refactoring.guru/design-patterns/structural-patterns">refactoring.guru</a></p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-10</footer>
</section>

<h2 id="yap%C4%B1sal-desenlerin-%C3%B6nemi">Yapısal Desenlerin Önemi</h2>
<ul>
<li><strong>Ölçeklenebilir mimariler</strong> oluşturmanıza yardımcı olurlar; bileşenler arasında net ilişkiler tanımlarlar</li>
<li>Etkileşen sınıflar arasında <strong>gevşek bağlılığı</strong> teşvik ederler</li>
<li>Çalışma zamanında nesnelerin <strong>esnek bileşimini</strong> sağlarlar</li>
<li><strong>Sınıf hiyerarşileri</strong> ve <strong>nesne ilişkilerini</strong> organize etmek için kanıtlanmış çözümler sunarlar</li>
<li>Kalıtım yerine bileşim yoluyla <strong>kod tekrarını</strong> azaltırlar</li>
</ul>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="yedi-yap%C4%B1sal-desen">Yedi Yapısal Desen</h2>
<table>
<thead>
<tr>
<th>Desen</th>
<th>Amacı</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Adapter (Adaptör)</strong></td>
<td>Uyumsuz arayüzlerin birlikte çalışmasını sağlar</td>
</tr>
<tr>
<td><strong>Bridge (Köprü)</strong></td>
<td>Soyutlamayı uygulamadan ayırır</td>
</tr>
<tr>
<td><strong>Composite (Bileşik)</strong></td>
<td>Nesneleri ağaç yapılarına dönüştürür</td>
</tr>
<tr>
<td><strong>Decorator (Dekoratör)</strong></td>
<td>Sorumlulukları dinamik olarak ekler</td>
</tr>
<tr>
<td><strong>Facade (Cephe)</strong></td>
<td>Karmaşık alt sistem arayüzlerini basitleştirir</td>
</tr>
<tr>
<td><strong>Flyweight (Sinek Siklet)</strong></td>
<td>Çok sayıda nesneyi desteklemek için durumu paylaşır</td>
</tr>
<tr>
<td><strong>Proxy (Vekil)</strong></td>
<td>Başka bir nesneye erişimi kontrol eder</td>
</tr>

<h2 id="amaca-g%C3%B6re-s%C4%B1n%C4%B1fland%C4%B1rma">Amaca Göre Sınıflandırma</h2>
<p><strong>Arayüz Desenleri</strong> - Arayüzleri uyarlama veya basitleştirme ile ilgilenir:</p>
<ul>
<li>Adapter (Adaptör), Facade (Cephe)</li>
</ul>
<p><strong>Bileşim Desenleri</strong> - Nesneleri yapılar halinde birleştirme ile ilgilenir:</p>
<ul>
<li>Composite (Bileşik), Decorator (Dekoratör)</li>
</ul>
<p><strong>Ayrıştırma Desenleri</strong> - Kaygıları ayırma ile ilgilenir:</p>
<ul>
<li>Bridge (Köprü)</li>
</ul>
<p><strong>Optimizasyon Desenleri</strong> - Kaynak yönetimi ile ilgilenir:</p>
<ul>
<li>Flyweight (Sinek Siklet)</li>
</ul>
<p><strong>Erişim Kontrolü Desenleri</strong> - Nesne erişimini kontrol etme ile ilgilenir:</p>
<ul>
<li>Proxy (Vekil)</li>
</ul>

<h2 id="adapter-adapt%C3%B6r-ama%C3%A7">Adapter (Adaptör): Amaç</h2>
<p><strong>Adapter (Adaptör)</strong>, <strong>uyumsuz arayüzlere</strong> sahip nesnelerin birlikte çalışmasını sağlayan yapısal bir tasarım desenidir.</p>
<ul>
<li>Ayrıca şöyle de bilinir: <strong>Wrapper (Sarmalayıcı)</strong></li>
<li>Bir sınıfın arayüzünü, istemcilerin beklediği başka bir arayüze dönüştürür</li>
<li>Uyumsuz arayüzler nedeniyle birlikte çalışamayacak sınıfların birlikte çalışmasını sağlar</li>
</ul>
<p>Kaynak: <a href="https://refactoring.guru/design-patterns/adapter">refactoring.guru</a></p>

<h2 id="adapter-adapt%C3%B6r-problem">Adapter (Adaptör): Problem</h2>
<p>Bir <strong>borsa izleme uygulaması</strong> oluşturduğunuzu hayal edin. Uygulama, birden fazla kaynaktan <strong>XML formatında</strong> hisse senedi verilerini indirir.</p>
<p>Bir noktada, akıllı bir <strong>üçüncü taraf analiz kütüphanesi</strong> entegre ederek uygulamayı iyileştirmeye karar verirsiniz. Ancak bir sorun vardır: analiz kütüphanesi yalnızca <strong>JSON formatındaki</strong> verilerle çalışır.</p>
<p>Analiz kütüphanesini &quot;olduğu gibi&quot; kullanamazsınız çünkü uygulamanızla uyumsuz bir formatta veri bekler.</p>

<p>Kütüphaneyi XML ile çalışacak şekilde değiştirebilirsiniz, ancak:</p>
<ul>
<li>Bu, kütüphaneye bağımlı olan <strong>mevcut kodu bozabilir</strong></li>
<li>Kütüphanenin <strong>kaynak koduna erişiminiz olmayabilir</strong></li>
</ul>
<p>Bu durum, <strong>üçüncü taraf</strong> veya <strong>eski</strong> kodu entegre ederken sıkça ortaya çıkar.</p>

<h2 id="adapter-adapt%C3%B6r-%C3%A7%C3%B6z%C3%BCm">Adapter (Adaptör): Çözüm</h2>
<p>Bir <strong>adaptör</strong> oluşturabilirsiniz -- bir nesnenin arayüzünü başka bir nesnenin anlayabileceği şekilde dönüştüren özel bir nesne.</p>
<ul>
<li>Adaptör, perde arkasında gerçekleşen dönüşümün karmaşıklığını gizlemek için nesnelerden birini <strong>sarar</strong></li>
<li>Sarılan nesne adaptörün farkında bile değildir</li>
<li>Adaptör çağrıları bir formatta alır ve bunları sarılan nesnenin anlayabileceği çağrılara çevirir</li>
</ul>

<h2 id="adapter-adapt%C3%B6r-%C3%A7%C3%B6z%C3%BCm-devam">Adapter (Adaptör): Çözüm (devam)</h2>
<p>Adaptörlerin çalışma şekli:</p>
<ol>
<li>Adaptör, mevcut nesnelerden biriyle uyumlu bir arayüze sahip olur</li>
<li>Bu arayüzü kullanarak, mevcut nesne adaptörün yöntemlerini güvenle çağırabilir</li>
<li>Bir çağrı aldığında, adaptör isteği ikinci nesneye iletir, ancak ikinci nesnenin beklediği format ve sırada</li>
</ol>
<p>Bazen her iki yönde de çağrıları dönüştürebilen <strong>çift yönlü bir adaptör</strong> oluşturmak bile mümkündür.</p>

<h2 id="adapter-adapt%C3%B6r-ger%C3%A7ek-d%C3%BCnya-benzetmesi">Adapter (Adaptör): Gerçek Dünya Benzetmesi</h2>
<p>ABD'den Avrupa'ya ilk kez seyahat ettiğinizde, dizüstü bilgisayarınızı şarj etmeye çalışırken sürprizle karşılaşabilirsiniz. <strong>Elektrik fişi ve priz</strong> standartları farklı ülkelerde farklıdır.</p>

<h2 id="adapter-adapt%C3%B6r-uygulanabilirlik">Adapter (Adaptör): Uygulanabilirlik</h2>
<p>Adapter (Adaptör) desenini şu durumlarda kullanın:</p>
<ul>
<li>Mevcut bir sınıfı kullanmak istediğinizde, ancak arayüzü kodunuzun geri kalanıyla <strong>uyumlu olmadığında</strong></li>
<li>İlgisiz veya öngörülemeyen, uyumlu arayüzlere sahip olmayan sınıflarla işbirliği yapan <strong>yeniden kullanılabilir bir sınıf</strong> oluşturmak istediğinizde</li>
<li>Birkaç mevcut alt sınıfı kullanmanız gerektiğinde, ancak her birinin arayüzünü alt sınıflayarak uyarlamak pratik olmadığında. Bir <strong>nesne adaptörü</strong> üst sınıfının arayüzünü uyarlayabilir</li>
</ul>

<h2 id="adapter-adapt%C3%B6r-nas%C4%B1l-uygulan%C4%B1r-devam">Adapter (Adaptör): Nasıl Uygulanır (devam)</h2>
<ol start="4">
<li>
<p>Adaptör sınıfına servis nesnesine referans saklamak için bir <strong>alan ekleyin</strong>. Yaygın uygulama bu alanı yapıcı aracılığıyla başlatmaktır, ancak bazen adaptörün yöntemlerini çağırırken iletmek daha uygundur</p>
</li>
<li>
<p>İstemci arayüzünün tüm yöntemlerini adaptör sınıfında tek tek <strong>uygulayın</strong>. Adaptör, gerçek işin çoğunu servis nesnesine devretmeli, yalnızca arayüz veya veri formatı dönüşümünü ele almalıdır</p>
</li>
<li>
<p>İstemciler adaptörü <strong>istemci arayüzü</strong> üzerinden kullanmalıdır. Bu, istemci kodunu etkilemeden adaptörleri değiştirmenize veya genişletmenize olanak tanır</p>
</li>
</ol>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="adapter-adapt%C3%B6r-avantajlar-ve-dezavantajlar">Adapter (Adaptör): Avantajlar ve Dezavantajlar</h2>
<p><strong>Avantajlar:</strong></p>
<ul>
<li><strong>Tek Sorumluluk İlkesi</strong>: Arayüz veya veri dönüştürme kodunu programın birincil iş mantığından ayırabilirsiniz</li>
<li><strong>Açık/Kapalı İlkesi</strong>: İstemci arayüzü üzerinden adaptörlerle çalıştıkları sürece, mevcut istemci kodunu bozmadan programa yeni adaptör türleri ekleyebilirsiniz</li>
</ul>
<p><strong>Dezavantajlar:</strong></p>
<ul>
<li>Bir dizi yeni arayüz ve sınıf tanıtmanız gerektiğinden kodun genel karmaşıklığı artar. Bazen servis sınıfını kodunuzun geri kalanıyla eşleşecek şekilde değiştirmek daha basittir</li>
</ul>

<h2 id="adapter-adapt%C3%B6r-di%C4%9Fer-desenlerle-i%CC%87li%C5%9Fkiler">Adapter (Adaptör): Diğer Desenlerle İlişkiler</h2>
<ul>
<li><strong>Bridge (Köprü)</strong> genellikle baştan tasarlanır ve bir uygulamanın parçalarını bağımsız olarak geliştirmenize olanak tanır. <strong>Adapter (Adaptör)</strong> genellikle mevcut bir uygulamayla birlikte kullanılır ve aksi takdirde uyumsuz olan sınıfların birlikte çalışmasını sağlar</li>
<li><strong>Adapter (Adaptör)</strong> mevcut bir nesnenin arayüzünü değiştirirken, <strong>Decorator (Dekoratör)</strong> arayüzünü değiştirmeden bir nesneyi geliştirir. Decorator (Dekoratör) özyinelemeli bileşimi desteklerken, Adapter (Adaptör) ile bu mümkün değildir</li>
<li><strong>Adapter (Adaptör)</strong> sarılan nesneye farklı bir arayüz sağlarken, <strong>Proxy (Vekil)</strong> aynı arayüzü sağlar ve <strong>Decorator (Dekoratör)</strong> geliştirilmiş bir arayüz sağlar</li>
</ul>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// The abstraction defines the interface for the &quot;control&quot; part</span>
<span class="hljs-comment">// of the two class hierarchies. It maintains a reference to an</span>
<span class="hljs-comment">// object of the implementation hierarchy and delegates all of</span>
<span class="hljs-comment">// the real work to this object.</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">RemoteControl</span> {
    <span class="hljs-keyword">protected</span> Device device;

    <span class="hljs-keyword">public</span> <span class="hljs-title function_">RemoteControl</span><span class="hljs-params">(Device device)</span> {
        <span class="hljs-built_in">this</span>.device = device;
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">togglePower</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">if</span> (device.isEnabled()) {
            device.disable();
        } <span class="hljs-keyword">else</span> {
            device.enable();
        }
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">volumeDown</span><span class="hljs-params">()</span> {
        device.setVolume(device.getVolume() - <span class="hljs-number">10</span>);
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">volumeUp</span><span class="hljs-params">()</span> {
        device.setVolume(device.getVolume() + <span class="hljs-number">10</span>);
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">channelDown</span><span class="hljs-params">()</span> {
        device.setChannel(device.getChannel() - <span class="hljs-number">1</span>);
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">channelUp</span><span class="hljs-params">()</span> {
        device.setChannel(device.getChannel() + <span class="hljs-number">1</span>);
    }
}
</code></pre>

<h2 id="bridge-k%C3%B6pr%C3%BC-uygulanabilirlik">Bridge (Köprü): Uygulanabilirlik</h2>
<p>Bridge (Köprü) desenini şu durumlarda kullanın:</p>
<ul>
<li>Bazı işlevselliğin birkaç varyantına sahip olan bir <strong>monolitik sınıfı</strong> bölmek ve organize etmek istediğinizde (örn., sınıf çeşitli veritabanı sunucularıyla çalışabiliyorsa)</li>
<li>Bir sınıfı birkaç <strong>ortogonal (bağımsız) boyutta</strong> genişletmeniz gerektiğinde</li>
<li>Çalışma zamanında <strong>uygulamaları değiştirebilmeniz</strong> gerektiğinde</li>

<h2 id="bridge-k%C3%B6pr%C3%BC-uygulanabilirlik-devam">Bridge (Köprü): Uygulanabilirlik (devam)</h2>
<p><strong>Monolitik sınıf yeniden yapılandırma</strong>: Bir sınıf ne kadar büyürse, nasıl çalıştığını anlamak o kadar zorlaşır ve bir değişiklik yapmak o kadar uzun sürer. Bridge (Köprü), monolitik sınıfı her biri bağımsız olarak değiştirilebilen birkaç sınıf hiyerarşisine ayırmanıza olanak tanır.</p>
<p><strong>Ortogonal boyutlar</strong>: Her boyut için ayrı bir sınıf hiyerarşisi çıkarın. Orijinal sınıf, her şeyi kendi başına yapmak yerine, ilgili işi bu hiyerarşilere ait nesnelere devreder.</p>
<p><strong>Çalışma zamanı değiştirme</strong>: İsteğe bağlı olmakla birlikte, Bridge (Köprü) deseni, soyutlama içindeki uygulama nesnesini çalışma zamanında değiştirmenize olanak tanır. Bu, bir alana yeni bir değer atamak kadar kolaydır.</p>

<h2 id="bridge-k%C3%B6pr%C3%BC-nas%C4%B1l-uygulan%C4%B1r">Bridge (Köprü): Nasıl Uygulanır</h2>
<ol>
<li>
<p>Sınıflarınızdaki <strong>ortogonal boyutları</strong> belirleyin. Bu bağımsız kavramlar şunlar olabilir: soyutlama/platform, alan/altyapı, ön yüz/arka yüz veya arayüz/uygulama</p>
</li>
<li>
<p><strong>İstemcinin hangi işlemlere ihtiyaç duyduğunu</strong> belirleyin ve bunları temel soyutlama sınıfında tanımlayın</p>
</li>
<li>
<p><strong>Tüm platformlarda</strong> mevcut olan işlemleri belirleyin. Soyutlamanın ihtiyaç duyduğu işlemleri genel uygulama arayüzünde bildirin</p>
</li>
</ol>

<ol start="4">
<li>
<p>Alanınızdaki tüm platformlar için <strong>somut uygulama sınıfları</strong> oluşturun, ancak hepsinin uygulama arayüzünü takip ettiğinden emin olun</p>
</li>
<li>
<p>Soyutlama sınıfının içine, uygulama türü için bir <strong>referans alanı</strong> ekleyin. Soyutlama, işin çoğunu bu alanda referans verilen uygulama nesnesine devreder</p>
</li>
<li>
<p>Birkaç <strong>üst düzey mantık</strong> varyantınız varsa, temel soyutlama sınıfını genişleterek her varyant için <strong>iyileştirilmiş soyutlamalar</strong> oluşturun</p>
</li>
<li>
<p><strong>İstemci kodu</strong>, birini diğeriyle ilişkilendirmek için soyutlamanın yapıcısına bir uygulama nesnesi iletmelidir. Bundan sonra istemci, uygulamayı unutabilir ve yalnızca soyutlama nesnesiyle çalışabilir</p>
</li>
</ol>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="bridge-k%C3%B6pr%C3%BC-avantajlar-ve-dezavantajlar">Bridge (Köprü): Avantajlar ve Dezavantajlar</h2>
<p><strong>Avantajlar:</strong></p>
<ul>
<li><strong>Platformdan bağımsız</strong> sınıflar ve uygulamalar oluşturabilirsiniz</li>
<li>İstemci kodu üst düzey soyutlamalarla çalışır ve <strong>platform detaylarına maruz kalmaz</strong></li>
<li><strong>Açık/Kapalı İlkesi</strong>: Yeni soyutlamaları ve uygulamaları birbirinden bağımsız olarak tanıtabilirsiniz</li>
<li><strong>Tek Sorumluluk İlkesi</strong>: Soyutlamadaki üst düzey mantığa ve uygulamadaki platform detaylarına odaklanabilirsiniz</li>
</ul>
<p><strong>Dezavantajlar:</strong></p>
<ul>
<li>Deseni yüksek uyumlu bir sınıfa uygulayarak kodu <strong>daha karmaşık</strong> hale getirebilirsiniz</li>
</ul>

<h2 id="bridge-k%C3%B6pr%C3%BC-di%C4%9Fer-desenlerle-i%CC%87li%C5%9Fkiler">Bridge (Köprü): Diğer Desenlerle İlişkiler</h2>
<ul>
<li><strong>Bridge (Köprü)</strong> genellikle baştan tasarlanır ve bir uygulamanın parçalarını bağımsız olarak geliştirmenize olanak tanır. Öte yandan, <strong>Adapter (Adaptör)</strong> genellikle mevcut bir uygulamayla birlikte kullanılır ve aksi takdirde uyumsuz olan sınıfların birlikte çalışmasını sağlar</li>
<li><strong>Bridge (Köprü)</strong>, <strong>State</strong>, <strong>Strategy</strong> (ve bir dereceye kadar <strong>Adapter (Adaptör)</strong>) çok benzer yapılara sahiptir. Tüm bu desenler bileşime dayanır. Ancak hepsi farklı problemleri çözer</li>
<li><strong>Abstract Factory</strong>'yi <strong>Bridge (Köprü)</strong> ile birlikte kullanabilirsiniz. Bu eşleşme, Bridge (Köprü) tarafından tanımlanan bazı soyutlamaların yalnızca belirli uygulamalarla çalışabildiği durumlarda faydalıdır</li>
<li><strong>Builder</strong>'ı <strong>Bridge (Köprü)</strong> ile birleştirebilirsiniz: yönetici sınıf soyutlama rolünü oynarken, farklı inşacılar uygulama görevi görür</li>
</ul>

<li>Ayrıca şöyle de bilinir: <strong>Object Tree (Nesne Ağacı)</strong></li>
</ul>

<h2 id="composite-bile%C5%9Fik-problem">Composite (Bileşik): Problem</h2>
<p>Composite (Bileşik) desenini kullanmak, yalnızca uygulamanızın temel modeli bir <strong>ağaç</strong> olarak temsil edilebildiğinde anlamlıdır.</p>
<p>Örneğin, iki tür nesneniz olduğunu düşünün: <code>Products</code> ve <code>Boxes</code>. Bir <code>Box</code>, birkaç <code>Products</code> ve birkaç daha küçük <code>Boxes</code> içerebilir. Bu küçük <code>Boxes</code> da bazı <code>Products</code> veya daha küçük <code>Boxes</code> içerebilir, vb.</p>

<h2 id="composite-bile%C5%9Fik-problem-devam">Composite (Bileşik): Problem (devam)</h2>
<p>Bu sınıfları kullanarak bir sipariş sistemi oluşturmaya karar verdiğinizi düşünün. Siparişler, herhangi bir ambalaj olmadan basit ürünlerin yanı sıra ürünlerle ve diğer kutularla doldurulmuş kutuları da içerebilir.</p>
<p>Böyle bir siparişin <strong>toplam fiyatını</strong> nasıl belirlersiniz?</p>
<p>Doğrudan bir yaklaşım deneyebilirsiniz: tüm kutuları açın, tüm ürünleri gözden geçirin ve ardından toplamı hesaplayın. Ancak bu, belirli sınıfları ve iç içe geçme yapısını önceden bilmeyi gerektirir, bu da kodu yapıya sıkıca bağlar.</p>

<h2 id="composite-bile%C5%9Fik-%C3%A7%C3%B6z%C3%BCm">Composite (Bileşik): Çözüm</h2>
<p>Composite (Bileşik) deseni, <code>Products</code> ve <code>Boxes</code> ile toplam fiyatı hesaplamak için bir yöntem bildiren <strong>ortak bir arayüz</strong> üzerinden çalışmanızı önerir.</p>
<ul>
<li>Bir <strong>ürün</strong> için basitçe ürünün fiyatını döndürür</li>
<li>Bir <strong>kutu</strong> için kutunun içerdiği her öğeyi gözden geçirir, fiyatını sorar ve ardından bu kutu için toplamı döndürür</li>
</ul>
<p>En büyük fayda, ağacı oluşturan nesnelerin somut sınıflarını bilmenize gerek olmamasıdır. Hepsini ortak arayüz üzerinden aynı şekilde işleyebilirsiniz.</p>

<h2 id="composite-bile%C5%9Fik-%C3%A7%C3%B6z%C3%BCm-devam">Composite (Bileşik): Çözüm (devam)</h2>
<p>Bir yöntem çağırdığınızda, nesneler isteği ağaçta aşağıya iletir. Bir nesne ağacının tüm bileşenleri üzerinde <strong>özyinelemeli olarak bir davranış çalıştırabilirsiniz</strong>.</p>
<p>Bu yaklaşım şu nedenle çalışır:</p>
<ul>
<li>Bir ürün fiyatını doğrudan döndürür</li>
<li>Bir kutu içeriğini yineler ve her öğe üzerinde fiyat yöntemini çağırır</li>
<li>Bir öğe başka bir kutuysa, o kutu da içeriğini yineler, vb.</li>
<li>Sonuç olarak tüm ağaç yapısı otomatik olarak dolaşılır</li>

<h2 id="composite-bile%C5%9Fik-yap%C4%B1">Composite (Bileşik): Yapı</h2>
<ol>
<li><strong>Bileşen</strong> -- Ağacın hem basit hem de karmaşık elemanlarında ortak olan işlemleri tanımlayan arayüz</li>
<li><strong>Yaprak</strong> -- Alt elemanları olmayan, ağacın temel bir elemanı. Genellikle yaprak bileşenler, işi devredecek kimseleri olmadığından gerçek işin çoğunu yapar</li>
<li><strong>Kapsayıcı (Bileşik)</strong> -- Alt elemanlara sahip bir eleman: yapraklar veya diğer kapsayıcılar. Bir kapsayıcı, alt elemanlarının somut sınıflarını bilmez. Tüm alt elemanlarla yalnızca bileşen arayüzü üzerinden çalışır</li>
<li><strong>İstemci</strong> -- Tüm elemanlarla bileşen arayüzü üzerinden çalışır. Sonuç olarak istemci, ağacın hem basit hem de karmaşık elemanlarıyla aynı şekilde çalışabilir</li>
</ol>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.util.ArrayList;
<span class="hljs-keyword">import</span> java.util.List;

<span class="hljs-comment">// The Composite class represents complex components that may</span>
<span class="hljs-comment">// have children. It delegates work to its children and then</span>
<span class="hljs-comment">// aggregates the result.</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">CompoundGraphic</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">Graphic</span> {
    <span class="hljs-keyword">private</span> List&lt;Graphic&gt; children = <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;&gt;();

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">add</span><span class="hljs-params">(Graphic child)</span> {
        children.add(child);
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">remove</span><span class="hljs-params">(Graphic child)</span> {
        children.remove(child);
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">move</span><span class="hljs-params">(<span class="hljs-type">int</span> x, <span class="hljs-type">int</span> y)</span> {
        <span class="hljs-keyword">for</span> (Graphic child : children) {
            child.move(x, y);
        }
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">draw</span><span class="hljs-params">()</span> {
        System.out.println(<span class="hljs-string">&quot;---- CompoundGraphic ----&quot;</span>);
        <span class="hljs-keyword">for</span> (Graphic child : children) {
            child.draw();
        }
        System.out.println(<span class="hljs-string">&quot;---- End Compound ----&quot;</span>);
    }
}
</code></pre>

<h2 id="composite-bile%C5%9Fik-uygulanabilirlik">Composite (Bileşik): Uygulanabilirlik</h2>
<p>Composite (Bileşik) desenini şu durumlarda kullanın:</p>
<ul>
<li>Bir <strong>ağaç benzeri nesne yapısı</strong> uygulamanız gerektiğinde. Composite (Bileşik) deseni, ortak bir arayüzü paylaşan iki temel eleman türü sağlar: basit yapraklar ve karmaşık kapsayıcılar</li>
<li>İstemci kodunun hem basit hem de karmaşık elemanları <strong>aynı şekilde</strong> ele almasını istediğinizde. Composite (Bileşik) deseni tarafından tanımlanan tüm elemanlar ortak bir arayüzü paylaşır, böylece istemci çalıştığı nesnelerin somut sınıfı hakkında endişelenmek zorunda kalmaz</li>
</ul>

<h2 id="composite-bile%C5%9Fik-nas%C4%B1l-uygulan%C4%B1r">Composite (Bileşik): Nasıl Uygulanır</h2>
<ol>
<li>
<p>Uygulamanızın temel modelinin bir <strong>ağaç yapısı</strong> olarak temsil edilebildiğinden emin olun. Basit elemanlara ve kapsayıcılara ayırmaya çalışın. Kapsayıcıların hem basit elemanları hem de diğer kapsayıcıları içerebilmesi gerektiğini unutmayın</p>
</li>
<li>
<p>Hem basit hem de karmaşık bileşenler için anlamlı yöntemlerin bir listesiyle <strong>bileşen arayüzünü</strong> bildirin</p>
</li>
<li>
<p>Basit elemanları temsil edecek bir <strong>yaprak sınıfı</strong> oluşturun. Bir programda birden fazla farklı yaprak sınıfı olabilir</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-10</footer>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="composite-bile%C5%9Fik-nas%C4%B1l-uygulan%C4%B1r-devam">Composite (Bileşik): Nasıl Uygulanır (devam)</h2>
<ol start="4">
<li>
<p>Karmaşık elemanları temsil edecek bir <strong>kapsayıcı sınıfı</strong> oluşturun. Bu sınıfta, alt elemanlara referansları saklamak için bir dizi alanı sağlayın. Dizi hem yaprakları hem de kapsayıcıları saklayabilmelidir, bu nedenle bileşen arayüzü türüyle bildirildiğinden emin olun</p>
</li>
<li>
<p>Kapsayıcının yöntemlerini uygularken, bir kapsayıcının <strong>işin çoğunu alt elemanlara devretmesi</strong> gerektiğini unutmayın</p>
</li>
<li>
<p>Son olarak, kapsayıcıda alt eleman <strong>ekleme ve kaldırma</strong> yöntemlerini tanımlayın. Bu işlemlerin bileşen arayüzünde bildirilebileceğini, bunun Arayüz Ayrıştırma İlkesini ihlal edeceğini, ancak istemcinin tüm elemanları eşit olarak ele almasına olanak tanıyacağını unutmayın</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-10</footer>
</section>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="composite-bile%C5%9Fik-avantajlar-ve-dezavantajlar">Composite (Bileşik): Avantajlar ve Dezavantajlar</h2>
<p><strong>Avantajlar:</strong></p>
<ul>
<li>Karmaşık ağaç yapılarıyla daha rahat çalışabilirsiniz: <strong>polimorfizm ve özyinelemeyi</strong> avantajınıza kullanın</li>
<li><strong>Açık/Kapalı İlkesi</strong>: Nesne ağacıyla çalışan mevcut kodu bozmadan uygulamaya yeni eleman türleri ekleyebilirsiniz</li>
</ul>
<p><strong>Dezavantajlar:</strong></p>
<ul>
<li>İşlevsellikleri çok farklı olan sınıflar için <strong>ortak bir arayüz</strong> sağlamak zor olabilir. Bazı senaryolarda bileşen arayüzünü aşırı genelleştirmeniz gerekebilir, bu da onu anlamayı zorlaştırır</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-10</footer>
</section>

<h2 id="composite-bile%C5%9Fik-di%C4%9Fer-desenlerle-i%CC%87li%C5%9Fkiler">Composite (Bileşik): Diğer Desenlerle İlişkiler</h2>
<ul>
<li>Karmaşık Composite (Bileşik) ağaçları oluştururken <strong>Builder</strong> kullanabilirsiniz çünkü inşa adımlarını özyinelemeli olarak çalışacak şekilde programlayabilirsiniz</li>
<li><strong>Chain of Responsibility</strong> genellikle Composite (Bileşik) ile birlikte kullanılır. Bir yaprak bileşen bir istek aldığında, bunu nesne ağacının köküne kadar tüm üst bileşenler zincirinden geçirebilir</li>
<li>Composite (Bileşik) ağaçlarını dolaşmak için <strong>Iterators</strong> kullanabilirsiniz</li>
<li>Tüm Composite (Bileşik) ağacı üzerinde bir işlem yürütmek için <strong>Visitor</strong> kullanabilirsiniz</li>
</ul>

<h2 id="composite-bile%C5%9Fik-di%C4%9Fer-desenlerle-i%CC%87li%C5%9Fkiler-devam">Composite (Bileşik): Diğer Desenlerle İlişkiler (devam)</h2>
<ul>
<li>Composite (Bileşik) ağacının paylaşılan yaprak düğümlerini RAM'den tasarruf etmek için <strong>Flyweight (Sinek Siklet)</strong> olarak uygulayabilirsiniz</li>
<li><strong>Composite (Bileşik)</strong> ve <strong>Decorator (Dekoratör)</strong> benzer yapı diyagramlarına sahiptir çünkü her ikisi de özyinelemeli bileşime dayanır. Ancak bir Decorator (Dekoratör), yalnızca bir alt bileşene sahip bir Composite (Bileşik) gibidir. Decorator (Dekoratör) sarılan nesneye ek sorumluluklar eklerken, Composite (Bileşik) yalnızca alt elemanlarının sonuçlarını &quot;toplar&quot;</li>
<li>Composite (Bileşik) ve Decorator (Dekoratör)'ü yoğun olarak kullanan tasarımlar genellikle <strong>Prototype</strong> kullanmaktan fayda sağlayabilir. Deseni uygulamak, karmaşık yapıları sıfırdan yeniden oluşturmak yerine klonlamanıza olanak tanır</li>
</ul>

<h2 id="mod%C3%BCl-d-%C3%B6zet">Modül D: Özet</h2>
<ul>
<li>Composite (Bileşik) deseni, nesneleri <strong>ağaç yapıları</strong> halinde birleştirmenize ve bunları aynı şekilde ele almanıza olanak tanır</li>
<li>Hem basit (yaprak) hem de karmaşık (bileşik) elemanlar için <strong>ortak bir arayüz</strong> kullanır</li>
<li>Desen, kapsayıcıların hem yaprakları hem de diğer kapsayıcıları tutabildiği <strong>özyinelemeli bileşimi</strong> sağlar</li>
<li><strong>Parça-bütün hiyerarşilerini</strong> temsil etmek için idealdir</li>
<li>Mevcut kodu değiştirmeden yeni eleman türlerine izin vererek <strong>Açık/Kapalı İlkesini</strong> takip eder</li>
</ul>

<h2 id="decorator-dekorat%C3%B6r-problem">Decorator (Dekoratör): Problem</h2>
<p>Diğer programların kullanıcılarını önemli olaylar hakkında bilgilendirmesine olanak tanıyan bir <strong>bildirim kütüphanesi</strong> üzerinde çalıştığınızı hayal edin.</p>
<p>Kütüphanenin ilk sürümü, yalnızca birkaç alanı, bir yapıcıyı ve tek bir <code>send</code> yöntemi olan <code>Notifier</code> sınıfına dayanıyordu. Yöntem, bir istemciden mesaj argümanı alabilir ve mesajı bir e-posta listesine gönderebilirdi.</p>

<p>Bir <strong>sarmalayıcı</strong>, bazı <strong>hedef</strong> nesnelerle bağlantılı olabilen bir nesnedir. Sarmalayıcı, hedefle aynı yöntem kümesini içerir ve aldığı tüm istekleri hedefe devreder. Ancak sarmalayıcı, isteği hedefe iletmeden <strong>önce veya sonra</strong> bir şeyler yaparak sonucu değiştirebilir.</p>
<p>Basit bir sarmalayıcı ne zaman gerçek bir dekoratör olur? Sarmalayıcı, sarılan nesneyle <strong>aynı arayüzü</strong> uygular. Bu nedenle istemcinin bakış açısından bu nesneler aynıdır.</p>

<h2 id="decorator-dekorat%C3%B6r-yap%C4%B1">Decorator (Dekoratör): Yapı</h2>
<ol>
<li><strong>Bileşen</strong> -- Hem sarmalayıcılar hem de sarılan nesneler için ortak arayüzü bildirir</li>
<li><strong>Somut Bileşen</strong> -- Sarılan nesnelerin sınıfı. Dekoratörler tarafından değiştirilebilen temel davranışı tanımlar</li>
<li><strong>Temel Dekoratör</strong> -- Sarılan bir nesneye referans tutan bir alana sahip sınıf. Alanın türü, hem somut bileşenleri hem de dekoratörleri içerebilmesi için bileşen arayüzü olarak bildirilmelidir. Temel dekoratör tüm işlemleri sarılan nesneye devreder</li>
<li><strong>Somut Dekoratörler</strong> -- Bileşenlere dinamik olarak eklenebilen ekstra davranışları tanımlar. Temel dekoratörün yöntemlerini geçersiz kılar ve davranışlarını üst yöntem çağrısından önce veya sonra yürütür</li>
<li><strong>İstemci</strong> -- Bileşenleri birden çok dekoratör katmanıyla sarabilir, tüm nesnelerle bileşen arayüzü üzerinden çalıştığı sürece</li>
</ol>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.io.*;

<span class="hljs-comment">// Concrete components provide default implementations</span>
<span class="hljs-comment">// of the operations.</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">FileDataSource</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">DataSource</span> {

    <span class="hljs-keyword">public</span> <span class="hljs-title function_">FileDataSource</span><span class="hljs-params">(String filename)</span> {
        <span class="hljs-built_in">this</span>.filename = filename;
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">writeData</span><span class="hljs-params">(String data)</span> {
        <span class="hljs-keyword">try</span> (<span class="hljs-type">FileWriter</span> <span class="hljs-variable">writer</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">FileWriter</span>(filename)) {
            writer.write(data);
        } <span class="hljs-keyword">catch</span> (IOException e) {
            e.printStackTrace();
        }
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> String <span class="hljs-title function_">readData</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">try</span> (<span class="hljs-type">BufferedReader</span> <span class="hljs-variable">reader</span> <span class="hljs-operator">=</span>
                <span class="hljs-keyword">new</span> <span class="hljs-title class_">BufferedReader</span>(<span class="hljs-keyword">new</span> <span class="hljs-title class_">FileReader</span>(filename))) {
            <span class="hljs-type">StringBuilder</span> <span class="hljs-variable">sb</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">StringBuilder</span>();
            String line;
            <span class="hljs-keyword">while</span> ((line = reader.readLine()) != <span class="hljs-literal">null</span>) {
                sb.append(line);
            }
            <span class="hljs-keyword">return</span> sb.toString();
        } <span class="hljs-keyword">catch</span> (IOException e) {
            <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;&quot;</span>;
        }
    }
}

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.util.Base64;

<span class="hljs-comment">// Concrete decorators must call methods on the wrapped</span>
<span class="hljs-comment">// object, but may add something of their own to the result.</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">EncryptionDecorator</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">DataSourceDecorator</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-title function_">EncryptionDecorator</span><span class="hljs-params">(DataSource source)</span> {
        <span class="hljs-built_in">super</span>(source);
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">writeData</span><span class="hljs-params">(String data)</span> {
        <span class="hljs-comment">// Encrypt data before writing</span>
        <span class="hljs-type">String</span> <span class="hljs-variable">encrypted</span> <span class="hljs-operator">=</span> Base64.getEncoder()
            .encodeToString(data.getBytes());
        <span class="hljs-built_in">super</span>.writeData(encrypted);
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> String <span class="hljs-title function_">readData</span><span class="hljs-params">()</span> {
        <span class="hljs-comment">// Decrypt data after reading</span>
        <span class="hljs-type">String</span> <span class="hljs-variable">data</span> <span class="hljs-operator">=</span> <span class="hljs-built_in">super</span>.readData();
        <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">String</span>(Base64.getDecoder().decode(data));
    }
}
</code></pre>

<p>Bir <strong>temel dekoratör</strong> sınıfı oluşturun. Sarılan bir nesneye referans saklamak için bir alanı olmalıdır. Alan, hem somut bileşenlere hem de dekoratörlere bağlantı kurulmasına izin vermek için bileşen arayüzü türüyle bildirilmelidir. Temel dekoratör tüm işi sarılan nesneye devretmelidir</p>
</li>
<li>
<p>Tüm sınıfların <strong>bileşen arayüzünü</strong> uyguladığından emin olun</p>
</li>
<li>
<p>Temel dekoratörden genişleterek <strong>somut dekoratörler</strong> oluşturun. Somut bir dekoratör, davranışını üst yöntem çağrısından (her zaman sarılan nesneye devreder) önce veya sonra yürütmelidir</p>
</li>
<li>
<p><strong>İstemci kodu</strong>, dekoratörleri oluşturmaktan ve bunları istemcinin ihtiyaç duyduğu şekilde birleştirmekten sorumlu olmalıdır</p>
</li>
</ol>

</section>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="decorator-dekorat%C3%B6r-avantajlar-ve-dezavantajlar">Decorator (Dekoratör): Avantajlar ve Dezavantajlar</h2>
<p><strong>Avantajlar:</strong></p>
<ul>
<li>Bir nesnenin davranışını <strong>yeni bir alt sınıf oluşturmadan</strong> genişletebilirsiniz</li>
<li><strong>Çalışma zamanında</strong> bir nesneden sorumluluklar ekleyebilir veya kaldırabilirsiniz</li>
<li>Bir nesneyi birden fazla dekoratörle sararak birkaç davranışı <strong>birleştirebilirsiniz</strong></li>
<li><strong>Tek Sorumluluk İlkesi</strong>: Birçok olası davranış varyantını uygulayan monolitik bir sınıfı birkaç daha küçük sınıfa bölebilirsiniz</li>
</ul>
<p><strong>Dezavantajlar:</strong></p>
<ul>
<li>Sarmalayıcılar yığınından <strong>belirli bir sarmalayıcıyı kaldırmak</strong> zordur</li>
<li>Davranışı dekoratörler yığınındaki <strong>sıraya bağlı olmayan</strong> bir dekoratör uygulamak zordur</li>
<li>Katmanların ilk <strong>yapılandırma kodu</strong> oldukça çirkin görünebilir</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-10</footer>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="decorator-dekorat%C3%B6r-di%C4%9Fer-desenlerle-i%CC%87li%C5%9Fkiler">Decorator (Dekoratör): Diğer Desenlerle İlişkiler</h2>
<ul>
<li><strong>Adapter (Adaptör)</strong>, mevcut bir nesneye erişmek için tamamen farklı bir arayüz sağlar. Decorator (Dekoratör) ile arayüz ya aynı kalır ya da genişletilir. Ayrıca Decorator (Dekoratör), Adapter (Adaptör) kullandığınızda mümkün olmayan özyinelemeli bileşimi destekler</li>
<li><strong>Adapter (Adaptör)</strong> mevcut bir nesnenin arayüzünü değiştirirken, <strong>Decorator (Dekoratör)</strong> arayüzünü değiştirmeden bir nesneyi geliştirir</li>
<li><strong>Proxy (Vekil)</strong> genellikle servis nesnesinin tam yaşam döngüsünü kendi başına yönetirken, <strong>Decorator (Dekoratör)</strong>'lerin bileşimi her zaman istemci tarafından kontrol edilir</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-10</footer>

<h2 id="decorator-dekorat%C3%B6r-di%C4%9Fer-desenlerle-i%CC%87li%C5%9Fkiler-devam">Decorator (Dekoratör): Diğer Desenlerle İlişkiler (devam)</h2>
<ul>
<li><strong>Chain of Responsibility</strong> ve <strong>Decorator (Dekoratör)</strong> çok benzer sınıf yapılarına sahiptir. Her iki desen de bir dizi nesne üzerinden yürütmeyi iletmek için özyinelemeli bileşime dayanır. Ancak birçok önemli fark vardır. CoR işleyicileri birbirinden bağımsız olarak rastgele işlemler yürütebilir. Ayrıca herhangi bir noktada isteği iletmeyi durdurabilirler. Dekoratörler, temel arayüzle tutarlı tutarak nesnenin davranışını genişletir</li>
<li><strong>Composite (Bileşik)</strong> ve <strong>Decorator (Dekoratör)</strong> benzer yapı diyagramlarına sahiptir çünkü her ikisi de özyinelemeli bileşime dayanır. Bir Decorator (Dekoratör), yalnızca bir alt bileşene sahip bir Composite (Bileşik) gibidir. Decorator (Dekoratör) sarılan nesneye ek sorumluluklar eklerken, Composite (Bileşik) yalnızca alt elemanlarının sonuçlarını &quot;toplar&quot;</li>
<li><strong>Strategy</strong> bir nesnenin içini değiştirmenize olanak tanırken, <strong>Decorator (Dekoratör)</strong> dışını değiştirmenize olanak tanır</li>
</ul>

<h2 id="mod%C3%BCl-e-%C3%B6zet">Modül E: Özet</h2>
<ul>
<li>Decorator (Dekoratör) deseni, sarmalama yoluyla nesnelere <strong>dinamik olarak</strong> davranış eklenmesine olanak tanır</li>
<li>Kalıtımın neden olduğu alt sınıfların <strong>kombinatoryal patlamasını</strong> önler</li>
<li>Birden fazla dekoratör davranışları birleştirmek için <strong>yığılabilir</strong></li>
<li><strong>Tek Sorumluluk</strong> ve <strong>Açık/Kapalı</strong> ilkelerini takip eder</li>
<li>Davranışların <strong>çalışma zamanında</strong> eklenmesi gerektiğinde kalıtım yerine bileşimi tercih edin</li>
</ul>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="facade-cephe-problem">Facade (Cephe): Problem</h2>
<p>Kodunuzun gelişmiş bir kütüphane veya çerçeveye ait geniş bir nesne kümesiyle çalışmasını sağlamanız gerektiğini hayal edin. Normalde, tüm bu nesneleri <strong>başlatmanız</strong>, <strong>bağımlılıkları</strong> takip etmeniz, yöntemleri <strong>doğru sırada</strong> çalıştırmanız gerekir, vb.</p>
<p>Sonuç olarak, sınıflarınızın iş mantığı üçüncü taraf sınıfların uygulama detaylarına <strong>sıkıca bağlı</strong> hale gelir, bu da anlamayı ve bakımı zorlaştırır.</p>

<h2 id="facade-cephe-%C3%A7%C3%B6z%C3%BCm">Facade (Cephe): Çözüm</h2>
<p>Bir cephe, çok sayıda hareketli parça içeren karmaşık bir alt sisteme <strong>basit bir arayüz</strong> sağlayan bir sınıftır. Bir cephe, alt sistemle doğrudan çalışmaya kıyasla sınırlı işlevsellik sağlayabilir. Ancak yalnızca <strong>istemcilerin gerçekten önem verdiği</strong> özellikleri içerir.</p>
<p>Düzinelerce özelliğe sahip gelişmiş bir kütüphaneyle uygulamanızı entegre etmeniz gerektiğinde, ancak işlevselliğinin yalnızca küçük bir kısmına ihtiyacınız olduğunda bir cepheye sahip olmak kullanışlıdır.</p>

<h2 id="facade-cephe-%C3%A7%C3%B6z%C3%BCm-devam">Facade (Cephe): Çözüm (devam)</h2>
<p>Örneğin, sosyal medyaya kedilerle ilgili kısa komik videolar yükleyen bir uygulama potansiyel olarak profesyonel bir video dönüştürme kütüphanesi kullanabilir. Ancak gerçekten ihtiyaç duyduğu tek şey, tek bir <code>encode(filename, format)</code> yöntemine sahip bir sınıftır.</p>
<p>Böyle bir sınıf oluşturup video dönüştürme kütüphanesine bağladıktan sonra, ilk <strong>cephenize</strong> sahip olursunuz.</p>

    <span class="hljs-keyword">public</span> VideoFile <span class="hljs-title function_">convert</span><span class="hljs-params">(String filename, String format)</span> {
        System.out.println(<span class="hljs-string">&quot;VideoConversionFacade: &quot;</span> +
            <span class="hljs-string">&quot;conversion started.&quot;</span>);
        <span class="hljs-type">VideoFile</span> <span class="hljs-variable">file</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">VideoFile</span>(filename);
        <span class="hljs-type">Codec</span> <span class="hljs-variable">sourceCodec</span> <span class="hljs-operator">=</span> CodecFactory.extract(file);

        Codec destinationCodec;
        <span class="hljs-keyword">if</span> (format.equals(<span class="hljs-string">&quot;mp4&quot;</span>)) {
            destinationCodec = <span class="hljs-keyword">new</span> <span class="hljs-title class_">MPEG4CompressionCodec</span>();

            destinationCodec = <span class="hljs-keyword">new</span> <span class="hljs-title class_">OggCompressionCodec</span>();

            sourceCodec);
        <span class="hljs-type">VideoFile</span> <span class="hljs-variable">result</span> <span class="hljs-operator">=</span> BitrateReader.convert(buffer,
            destinationCodec);

<li>Karmaşık bir alt sisteme <strong>sınırlı ama basit bir arayüze</strong> sahip olmanız gerektiğinde. Genellikle alt sistemler zamanla daha karmaşık hale gelir. Tasarım desenlerini uygulamak bile genellikle daha fazla sınıf oluşturmaya yol açar. Bir alt sistem çeşitli bağlamlarda daha esnek ve yeniden kullanılabilir hale gelebilir, ancak istemciden talep ettiği yapılandırma ve kalıp kod miktarı giderek büyür. Facade (Cephe), alt sistemin en çok kullanılan özelliklerine bir kısayol sağlamaya çalışır</li>
</ul>

</li>

</li>
<li>
<p>Cephe <strong>çok büyük</strong> olursa, davranışının bir kısmını yeni, iyileştirilmiş bir cephe sınıfına çıkarmayı düşünün</p>

<h2 id="facade-cephe-avantajlar-ve-dezavantajlar">Facade (Cephe): Avantajlar ve Dezavantajlar</h2>
<p><strong>Avantajlar:</strong></p>
<ul>
<li>Kodunuzu bir alt sistemin karmaşıklığından <strong>izole</strong> edebilirsiniz</li>
<li>Karmaşık bir sisteme <strong>basit</strong> bir arayüz sağlarsınız</li>
<li>İstemci ile alt sistem arasında <strong>gevşek bağlılığı</strong> teşvik edersiniz</li>
</ul>
<p><strong>Dezavantajlar:</strong></p>
<ul>
<li>Bir cephe, uygulamanın tüm sınıflarına bağlı bir <strong>tanrı nesnesi</strong> haline gelebilir</li>
</ul>

<h2 id="facade-cephe-di%C4%9Fer-desenlerle-i%CC%87li%C5%9Fkiler">Facade (Cephe): Diğer Desenlerle İlişkiler</h2>
<ul>
<li><strong>Facade (Cephe)</strong> mevcut nesneler için yeni bir arayüz tanımlarken, <strong>Adapter (Adaptör)</strong> mevcut arayüzü kullanılabilir hale getirmeye çalışır. Adapter (Adaptör) genellikle yalnızca bir nesneyi sararken, Facade (Cephe) bütün bir nesne alt sistemiyle çalışır</li>
<li><strong>Abstract Factory</strong>, alt sistem nesnelerinin istemci kodundan nasıl oluşturulduğunu gizlemek istediğinizde <strong>Facade (Cephe)</strong>'ye alternatif olarak hizmet edebilir</li>
<li><strong>Flyweight (Sinek Siklet)</strong> çok sayıda küçük nesne yapmanın nasıl olduğunu gösterirken, <strong>Facade (Cephe)</strong> tüm bir alt sistemi temsil eden tek bir nesne yapmanın nasıl olduğunu gösterir</li>
</ul>

<ul>
<li><strong>Facade (Cephe)</strong> ve <strong>Mediator</strong> benzer görevlere sahiptir: birçok sıkıca bağlı sınıf arasındaki işbirliğini organize etmeye çalışırlar. Facade (Cephe), bir nesne alt sisteme basitleştirilmiş bir arayüz tanımlar, ancak herhangi bir yeni işlevsellik tanıtmaz. Alt sistemin kendisi cepheden habersizdir. Mediator, sistemin bileşenleri arasındaki iletişimi merkezileştirir. Bileşenler yalnızca mediator nesnesini bilir</li>
<li>Bir <strong>Facade (Cephe)</strong> sınıfı genellikle bir <strong>Singleton</strong>'a dönüştürülebilir çünkü çoğu durumda tek bir cephe nesnesi yeterlidir</li>
<li><strong>Facade (Cephe)</strong>, <strong>Proxy (Vekil)</strong>'e benzer; her ikisi de karmaşık bir varlığı tamponlar ve kendi başına başlatır. Facade (Cephe)'den farklı olarak, Proxy (Vekil) servis nesnesiyle aynı arayüze sahiptir, bu da onları değiştirilebilir kılar</li>
</ul>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.awt.*;

<span class="hljs-comment">// many trees are here. Since this data is usually BIG, you</span>
<span class="hljs-comment">// would waste a lot of memory by keeping it in each tree</span>

    <span class="hljs-keyword">private</span> Color color;
    <span class="hljs-keyword">private</span> String texture;

    <span class="hljs-keyword">public</span> <span class="hljs-title function_">TreeType</span><span class="hljs-params">(String name, Color color, String texture)</span> {
        <span class="hljs-built_in">this</span>.name = name;
        <span class="hljs-built_in">this</span>.color = color;
        <span class="hljs-built_in">this</span>.texture = texture;

    <span class="hljs-keyword">public</span> String <span class="hljs-title function_">getTexture</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> texture; }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">draw</span><span class="hljs-params">(Graphics g, <span class="hljs-type">int</span> x, <span class="hljs-type">int</span> y)</span> {

}

<h2 id="flyweight-sinek-siklet-di%C4%9Fer-desenlerle-i%CC%87li%C5%9Fkiler">Flyweight (Sinek Siklet): Diğer Desenlerle İlişkiler</h2>
<ul>
<li><strong>Composite (Bileşik)</strong> ağacının paylaşılan yaprak düğümlerini RAM'den tasarruf etmek için <strong>Flyweight (Sinek Siklet)</strong> olarak uygulayabilirsiniz</li>
<li><strong>Flyweight (Sinek Siklet)</strong> çok sayıda küçük nesne yapmanın nasıl olduğunu gösterirken, <strong>Facade (Cephe)</strong> tüm bir alt sistemi temsil eden tek bir nesne yapmanın nasıl olduğunu gösterir</li>
<li><strong>Flyweight (Sinek Siklet)</strong>, nesnelerin tüm paylaşılan durumlarını tek bir flyweight nesnesine indirmeyi bir şekilde başarırsanız <strong>Singleton</strong>'a benzerdi. Ancak iki temel fark vardır:
<ul>
<li>Yalnızca bir Singleton örneği olmalıdır, oysa bir Flyweight sınıfı farklı içsel durumlara sahip <strong>birden fazla örneğe</strong> sahip olabilir</li>
<li>Singleton nesnesi <strong>değiştirilebilir</strong> olabilir. Flyweight nesneleri <strong>değiştirilemezdir</strong></li>
</ul>
</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-10</footer>

<ul>
<li>Flyweight (Sinek Siklet) deseni, bellek tasarrufu için birçok nesne arasında <strong>ortak durumu paylaşır</strong></li>
<li><strong>İçsel</strong> (paylaşılan, değiştirilemez) ve <strong>dışsal</strong> (benzersiz, bağlamsal) durum arasında ayrım yapın</li>
<li>Flyweight nesnelerinin havuzunu yönetmek için bir <strong>fabrika</strong> kullanın</li>
<li>Bunu yalnızca birçok benzer nesneyle gerçekten bir <strong>bellek sorununuz</strong> olduğunda uygulayın</li>
<li>Bu bir <strong>optimizasyon desenidir</strong> -- erken kullanmayın</li>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="proxy-vekil-ama%C3%A7">Proxy (Vekil): Amaç</h2>
<p><strong>Proxy (Vekil)</strong>, başka bir nesne için bir <strong>yedek veya yer tutucu</strong> sağlamanıza olanak tanıyan yapısal bir tasarım desenidir. Bir proxy, orijinal nesneye erişimi kontrol eder ve isteğin orijinal nesneye ulaşmadan önce veya sonra bir şeyler yapmanıza olanak tanır.</p>
<p>Kaynak: <a href="https://refactoring.guru/design-patterns/proxy">refactoring.guru</a></p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-10</footer>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="proxy-vekil-problem">Proxy (Vekil): Problem</h2>
<p>Bir nesneye erişimi neden kontrol etmek isteyesiniz? İşte bir örnek: büyük miktarda sistem kaynağı tüketen devasa bir nesneniz var. Buna zaman zaman ihtiyacınız var, ancak her zaman değil.</p>
<p><strong>Tembel başlatma</strong> uygulayabilirsiniz: bu nesneyi yalnızca gerçekten ihtiyaç duyulduğunda oluşturun. Nesnenin tüm istemcilerinin ertelenmiş başlatma kodunu çalıştırması gerekir. Ne yazık ki, bu muhtemelen çok fazla <strong>kod tekrarına</strong> neden olur.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-10</footer>
</section>

<h2 id="proxy-vekil-problem-devam">Proxy (Vekil): Problem (devam)</h2>
<p>İdeal bir dünyada, bu kodu doğrudan nesnemizin sınıfına koymak isterdik, ancak bu her zaman mümkün değildir. Örneğin, sınıf kapalı bir <strong>üçüncü taraf kütüphanesinin</strong> parçası olabilir.</p>
<p>Nesnenin sınıfını değiştirmeden veya başlatma mantığını tüm istemcilere tekrarlamadan nesneye erişimi kontrol etmenin bir yoluna ihtiyacımız var.</p>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="proxy-vekil-%C3%A7%C3%B6z%C3%BCm">Proxy (Vekil): Çözüm</h2>
<p>Proxy (Vekil) deseni, orijinal servis nesnesiyle <strong>aynı arayüze</strong> sahip yeni bir proxy sınıfı oluşturmanızı önerir. Ardından uygulamanızı, proxy nesnesini orijinal nesnenin tüm istemcilerine iletecek şekilde güncellersiniz.</p>
<p>İstemciden bir istek alındığında, proxy gerçek bir servis nesnesi oluşturur ve tüm işi ona <strong>devreder</strong>.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-10</footer>
</section>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="proxy-vekil-%C3%A7%C3%B6z%C3%BCm-devam">Proxy (Vekil): Çözüm (devam)</h2>
<p>Peki fayda nedir? Sınıfın birincil mantığından önce veya sonra bir şey çalıştırmanız gerekiyorsa, proxy bunu <strong>o sınıfı değiştirmeden</strong> yapmanıza olanak tanır. Proxy, orijinal sınıfla aynı arayüzü uyguladığından, gerçek bir servis nesnesi bekleyen herhangi bir istemciye iletilebilir.</p>
<p>Proxy şunları halledebilir:</p>
<ul>
<li>Gerçek nesnenin <strong>tembel başlatılması</strong></li>
<li>Sonuçların <strong>önbelleğe alınması</strong></li>
<li><strong>Erişim kontrolü</strong> ve yetkilendirme</li>
<li>İsteklerin <strong>günlüğe kaydedilmesi</strong></li>
<li><strong>Kaynak yönetimi</strong> ve temizlik</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-10</footer>
</section>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="proxy-vekil-ger%C3%A7ek-d%C3%BCnya-benzetmesi">Proxy (Vekil): Gerçek Dünya Benzetmesi</h2>
<p>Bir <strong>kredi kartı</strong>, bir banka hesabı için bir proxy'dir ve banka hesabı da bir deste nakit için bir proxy'dir. Her ikisi de aynı arayüzü uygular: ödeme yapmak için kullanılabilirler.</p>
<p>Bir tüketici, etrafta yığınla nakit taşımasına gerek olmadığı için kendini harika hisseder. Bir mağaza sahibi de mutludur çünkü bir işlemden elde edilen gelir, depozitosunu kaybetme veya bankaya giderken soyulma riski olmadan mağazanın banka hesabına elektronik olarak eklenir.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-10</footer>
</section>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="proxy-vekil-yap%C4%B1">Proxy (Vekil): Yapı</h2>
<ol>
<li>
<p><strong>Servis Arayüzü</strong> -- Servisin arayüzünü bildirir. Proxy'nin kendini bir servis nesnesi olarak gizleyebilmesi için bu arayüzü takip etmesi gerekir</p>
</li>
<li>
<p><strong>Servis</strong> -- Bazı yararlı iş mantığı sağlayan bir sınıf</p>
</li>
<li>
<p><strong>Proxy</strong> -- Proxy sınıfı, bir servis nesnesine işaret eden bir referans alanına sahiptir. Proxy, işlemini tamamladıktan sonra (örn., tembel başlatma, günlüğe kaydetme, erişim kontrolü, önbelleğe alma, vb.), isteği servis nesnesine iletir. Genellikle proxy'ler servis nesnelerinin tam yaşam döngüsünü yönetir</p>
</li>
<li>
<p><strong>İstemci</strong> -- Hem servisler hem de proxy'lerle aynı arayüz üzerinden çalışmalıdır. Bu şekilde bir proxy'yi bir servis nesnesi bekleyen herhangi bir koda iletebilirsiniz</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-10</footer>
</section>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h3 id="proxy---s%C4%B1n%C4%B1f-diyagram%C4%B1">Proxy - Sınıf Diyagramı</h3>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="proxy-vekil-proxy-t%C3%BCrleri">Proxy (Vekil): Proxy Türleri</h2>
<ul>
<li><strong>Sanal Proxy (Tembel Başlatma)</strong> -- Ağır bir servis nesnesinin oluşturulmasını gerçekten ihtiyaç duyulana kadar geciktirir</li>
<li><strong>Koruma Proxy'si (Erişim Kontrolü)</strong> -- İstekleri yalnızca istemcinin kimlik bilgileri belirli kriterleri karşıladığında servis nesnesine iletir</li>
<li><strong>Uzak Proxy</strong> -- Proxy, istemci isteğini ağ üzerinden iletir ve ağla çalışmanın tüm detaylarını halleder</li>
<li><strong>Günlükleme Proxy'si</strong> -- Proxy, her isteği servise iletmeden önce günlüğe kaydedebilir</li>
<li><strong>Önbellekleme Proxy'si</strong> -- Proxy, istemci isteklerinin sonuçlarını önbelleğe alır ve bu önbelleğin yaşam döngüsünü yönetir, özellikle sonuçlar oldukça büyükse</li>
<li><strong>Akıllı Referans</strong> -- Proxy, istemcinin servis nesnesine referans alıp almadığını izleyebilir ve hiçbir istemci kullanmadığında servisi sonlandırabilir</li>
</ul>

<h2 id="proxy-vekil-java-kod-%C3%B6rne%C4%9Fi---proxy-%C3%B6nbellekleme">Proxy (Vekil): Java Kod Örneği - Proxy (Önbellekleme)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.util.*;

<span class="hljs-comment">// To save some bandwidth, we can cache request results</span>
<span class="hljs-comment">// and keep them for some time. But it may be impossible</span>
<span class="hljs-comment">// to put such code directly into the service class. For</span>
<span class="hljs-comment">// example, it could have been provided as part of a</span>
<span class="hljs-comment">// third party library and/or defined as final.</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">CachedYouTubeClass</span>
        <span class="hljs-keyword">implements</span> <span class="hljs-title class_">ThirdPartyYouTubeLib</span> {

    <span class="hljs-keyword">private</span> ThirdPartyYouTubeLib service;
    <span class="hljs-keyword">private</span> List&lt;Video&gt; listCache = <span class="hljs-literal">null</span>;
    <span class="hljs-keyword">private</span> Map&lt;String, Video&gt; videoCache = <span class="hljs-keyword">new</span> <span class="hljs-title class_">HashMap</span>&lt;&gt;();
    <span class="hljs-keyword">private</span> <span class="hljs-type">boolean</span> <span class="hljs-variable">needReset</span> <span class="hljs-operator">=</span> <span class="hljs-literal">false</span>;

    <span class="hljs-keyword">public</span> <span class="hljs-title function_">CachedYouTubeClass</span><span class="hljs-params">(ThirdPartyYouTubeLib service)</span> {
        <span class="hljs-built_in">this</span>.service = service;
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> List&lt;Video&gt; <span class="hljs-title function_">listVideos</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">if</span> (listCache == <span class="hljs-literal">null</span> || needReset) {
            listCache = service.listVideos();
            needReset = <span class="hljs-literal">false</span>;
        }
        <span class="hljs-keyword">return</span> listCache;
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> Video <span class="hljs-title function_">getVideoInfo</span><span class="hljs-params">(String id)</span> {
        <span class="hljs-keyword">if</span> (!videoCache.containsKey(id) || needReset) {
            videoCache.put(id, service.getVideoInfo(id));
        }
        <span class="hljs-keyword">return</span> videoCache.get(id);
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">downloadVideo</span><span class="hljs-params">(String id)</span> {
        service.downloadVideo(id);
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">reset</span><span class="hljs-params">()</span> {
        needReset = <span class="hljs-literal">true</span>;
    }
}
</code></pre>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.util.List;

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">YouTubeManager</span> {

    <span class="hljs-keyword">public</span> <span class="hljs-title function_">YouTubeManager</span><span class="hljs-params">(ThirdPartyYouTubeLib service)</span> {

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">renderVideoPage</span><span class="hljs-params">(String id)</span> {

        System.out.println(<span class="hljs-string">&quot;Rendering video page: &quot;</span> +
            info.getTitle());

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">renderListPanel</span><span class="hljs-params">()</span> {
        List&lt;Video&gt; list = service.listVideos();

            list.size() + <span class="hljs-string">&quot; videos&quot;</span>);
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">reactOnUserInput</span><span class="hljs-params">(String id)</span> {
        renderListPanel();
        renderVideoPage(id);
    }
}

<h2 id="proxy-vekil-java-kod-%C3%B6rne%C4%9Fi---i%CC%87stemci">Proxy (Vekil): Java Kod Örneği - İstemci</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ProxyDemo</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
        <span class="hljs-comment">// Create the real service</span>
        <span class="hljs-type">ThirdPartyYouTubeLib</span> <span class="hljs-variable">youtubeService</span> <span class="hljs-operator">=</span>
            <span class="hljs-keyword">new</span> <span class="hljs-title class_">ThirdPartyYouTubeClass</span>();

        <span class="hljs-comment">// Create the caching proxy</span>
        <span class="hljs-type">ThirdPartyYouTubeLib</span> <span class="hljs-variable">youtubeProxy</span> <span class="hljs-operator">=</span>
            <span class="hljs-keyword">new</span> <span class="hljs-title class_">CachedYouTubeClass</span>(youtubeService);

        <span class="hljs-comment">// The manager works through the interface,</span>
        <span class="hljs-comment">// so it does not know if it is using the real</span>
        <span class="hljs-comment">// service or the proxy</span>
        <span class="hljs-type">YouTubeManager</span> <span class="hljs-variable">manager</span> <span class="hljs-operator">=</span>
            <span class="hljs-keyword">new</span> <span class="hljs-title class_">YouTubeManager</span>(youtubeProxy);

        <span class="hljs-comment">// First call - fetches from the real service</span>
        manager.reactOnUserInput(<span class="hljs-string">&quot;video123&quot;</span>);

        <span class="hljs-comment">// Second call - uses cached data</span>
        manager.reactOnUserInput(<span class="hljs-string">&quot;video123&quot;</span>);
    }
}
</code></pre>

<h2 id="proxy-vekil-uygulanabilirlik">Proxy (Vekil): Uygulanabilirlik</h2>
<p>Proxy (Vekil) desenini kullanmanın düzinelerce yolu vardır. İşte en yaygın olanları:</p>
<ul>
<li><strong>Tembel başlatma (sanal proxy)</strong>: Her zaman açık olan ve sistem kaynaklarını boşa harcayan ağır bir servis nesneniz olduğunda, yalnızca zaman zaman ihtiyaç duyduğunuzda. Uygulama başlatıldığında nesneyi oluşturmak yerine, nesnenin başlatılmasını gerçekten ihtiyaç duyulduğu zamana erteleyebilirsiniz</li>
</ul>

<h2 id="proxy-vekil-uygulanabilirlik-devam">Proxy (Vekil): Uygulanabilirlik (devam)</h2>
<ul>
<li>
<p><strong>Erişim kontrolü (koruma proxy'si)</strong>: Servis nesnesini yalnızca belirli istemcilerin kullanabilmesini istediğinizde; örneğin, nesneleriniz bir işletim sisteminin kritik parçaları olduğunda ve istemciler çeşitli başlatılan uygulamalar (kötü amaçlı olanlar dahil) olduğunda</p>
</li>
<li>
<p><strong>Uzak servisin yerel yürütülmesi (uzak proxy)</strong>: Servis nesnesi uzak bir sunucuda bulunduğunda. Bu durumda proxy, istemci isteğini ağ üzerinden ileterek ağ ile çalışmanın tüm karmaşık detaylarını halleder</p>
</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-10</footer>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="proxy-vekil-uygulanabilirlik-devam-1">Proxy (Vekil): Uygulanabilirlik (devam)</h2>
<ul>
<li>
<p><strong>İstekleri günlüğe kaydetme (günlükleme proxy'si)</strong>: Servis nesnesine yapılan isteklerin geçmişini tutmak istediğinizde. Proxy, her isteği servise iletmeden önce günlüğe kaydedebilir</p>
</li>
<li>
<p><strong>İstek sonuçlarını önbelleğe alma (önbellekleme proxy'si)</strong>: İstemci isteklerinin sonuçlarını önbelleğe almanız ve bu önbelleğin yaşam döngüsünü yönetmeniz gerektiğinde, özellikle sonuçlar oldukça büyükse. Proxy, her zaman aynı sonuçları veren tekrarlayan istekler için önbelleğe alma uygulayabilir</p>
</li>
<li>
<p><strong>Akıllı referans</strong>: Onu kullanan hiçbir istemci kalmadığında ağır bir nesneyi sonlandırabilmeniz gerektiğinde. Proxy, servis nesnesine veya sonuçlarına referans alan istemcileri takip edebilir. Zaman zaman proxy, istemcileri kontrol edebilir ve hâlâ aktif olup olmadıklarını kontrol edebilir. İstemci listesi boşalırsa, proxy servis nesnesini sonlandırabilir ve altta yatan sistem kaynaklarını serbest bırakabilir</p>
</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-10</footer>
</section>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="proxy-vekil-nas%C4%B1l-uygulan%C4%B1r">Proxy (Vekil): Nasıl Uygulanır</h2>
<ol>
<li>
<p>Önceden var olan bir <strong>servis arayüzü</strong> yoksa, proxy ve servis nesnelerini değiştirilebilir kılmak için bir tane oluşturun. Arayüzü servis sınıfından çıkarmak her zaman mümkün değildir çünkü servisin tüm istemcilerini bu arayüzü kullanacak şekilde değiştirmeniz gerekir. Bir alternatif, proxy'yi servis sınıfının bir <strong>alt sınıfı</strong> yapmaktır</p>
</li>
<li>
<p><strong>Proxy sınıfını</strong> oluşturun. Servise referans saklamak için bir alanı olmalıdır. Genellikle proxy'ler servislerinin tüm yaşam döngüsünü oluşturur ve yönetir. Nadir durumlarda, bir servis istemci tarafından yapıcı aracılığıyla proxy'ye iletilir</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-10</footer>
</section>

<h2 id="proxy-vekil-nas%C4%B1l-uygulan%C4%B1r-devam">Proxy (Vekil): Nasıl Uygulanır (devam)</h2>
<ol start="3">
<li>
<p><strong>Proxy yöntemlerini</strong> amaçlarına göre uygulayın. Çoğu durumda, bazı işler yaptıktan sonra proxy işi servis nesnesine devretmelidir</p>
</li>
<li>
<p>İstemcinin bir proxy mi yoksa gerçek bir servis mi aldığına karar veren bir <strong>oluşturma yöntemi</strong> tanıtmayı düşünün. Bu, proxy sınıfındaki basit bir statik yöntem veya tam teşekküllü bir fabrika yöntemi olabilir</p>
</li>
<li>
<p>Servis nesnesi için <strong>tembel başlatma</strong> uygulamayı düşünün</p>
</li>
</ol>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="proxy-vekil-avantajlar-ve-dezavantajlar">Proxy (Vekil): Avantajlar ve Dezavantajlar</h2>
<p><strong>Avantajlar:</strong></p>
<ul>
<li>Servis nesnesini <strong>istemciler bilmeden</strong> kontrol edebilirsiniz</li>
<li>İstemciler umursamadığında servis nesnesinin <strong>yaşam döngüsünü</strong> yönetebilirsiniz</li>
<li>Proxy, servis nesnesi <strong>hazır olmasa</strong> veya kullanılamasa bile çalışır</li>
<li><strong>Açık/Kapalı İlkesi</strong>: Servisi veya istemcileri değiştirmeden yeni proxy'ler tanıtabilirsiniz</li>
</ul>
<p><strong>Dezavantajlar:</strong></p>
<ul>
<li>Çok sayıda yeni sınıf tanıtmanız gerektiğinden kod <strong>daha karmaşık</strong> hale gelebilir</li>
<li>Servisten gelen yanıt <strong>gecikebilir</strong></li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-10</footer>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="proxy-vekil-di%C4%9Fer-desenlerle-i%CC%87li%C5%9Fkiler">Proxy (Vekil): Diğer Desenlerle İlişkiler</h2>
<ul>
<li><strong>Adapter (Adaptör)</strong> sarılan nesneye farklı bir arayüz sağlarken, <strong>Proxy (Vekil)</strong> aynı arayüzü sağlar ve <strong>Decorator (Dekoratör)</strong> geliştirilmiş bir arayüz sağlar</li>
<li><strong>Facade (Cephe)</strong>, <strong>Proxy (Vekil)</strong>'e benzer; her ikisi de karmaşık bir varlığı tamponlar ve kendi başına başlatır. Facade (Cephe)'den farklı olarak, Proxy (Vekil) servis nesnesiyle aynı arayüze sahiptir, bu da onları değiştirilebilir kılar</li>
<li><strong>Decorator (Dekoratör)</strong> ve <strong>Proxy (Vekil)</strong> benzer yapılara sahiptir, ancak çok farklı amaçları vardır. Her iki desen de bileşim ilkesi üzerine kuruludur; bir nesnenin işin bir kısmını başka bir nesneye devretmesi beklenir. Fark şudur: bir Proxy (Vekil) genellikle servis nesnesinin yaşam döngüsünü kendi başına yönetirken, Decorator (Dekoratör)'lerin bileşimi her zaman istemci tarafından kontrol edilir</li>
</ul>

<h2 id="mod%C3%BCl-h-%C3%B6zet">Modül H: Özet</h2>
<ul>
<li>Proxy (Vekil) deseni, başka bir nesne için bir <strong>yedek veya yer tutucu</strong> sağlar</li>
<li>Orijinal servisi <strong>değiştirmeden</strong> erişimi kontrol eder ve davranış ekler</li>
<li>Birçok türü vardır: <strong>sanal, koruma, uzak, günlükleme, önbellekleme, akıllı referans</strong></li>
<li>Mevcut kodu değiştirmeden yeni proxy'lere izin vererek <strong>Açık/Kapalı İlkesini</strong> takip eder</li>
<li>Yapı olarak Decorator (Dekoratör)'e benzer ancak <strong>amaç ve yaşam döngüsü yönetiminde</strong> farklıdır</li>
</ul>

<h2 id="%C3%B6zet-yap%C4%B1sal-tasar%C4%B1m-desenleri-kar%C5%9F%C4%B1la%C5%9Ft%C4%B1rmas%C4%B1">Özet: Yapısal Tasarım Desenleri Karşılaştırması</h2>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="yap%C4%B1sal-desenler-temel-i%CC%87li%C5%9Fkiler">Yapısal Desenler: Temel İlişkiler</h2>
<ul>
<li><strong>Adapter (Adaptör)</strong> ve <strong>Bridge (Köprü)</strong>: Adapter (Adaptör) sonradan uyarlar, Bridge (Köprü) baştan tasarlar</li>
<li><strong>Composite (Bileşik)</strong> ve <strong>Decorator (Dekoratör)</strong>: Her ikisi de özyinelemeli bileşim kullanır, ancak farklı amaçlar için</li>
<li><strong>Decorator (Dekoratör)</strong> ve <strong>Proxy (Vekil)</strong>: Benzer yapılar, farklı yaşam döngüsü yönetimi</li>
<li><strong>Facade (Cephe)</strong> ve <strong>Adapter (Adaptör)</strong>: Facade (Cephe) bir alt sistemi basitleştirir, Adapter (Adaptör) tek bir nesneyi sarar</li>
<li><strong>Flyweight (Sinek Siklet)</strong> ve <strong>Singleton</strong>: Flyweight (Sinek Siklet) birden fazla paylaşılan örneğe sahiptir, Singleton bir değiştirilebilir örneğe sahiptir</li>
<li><strong>Facade (Cephe)</strong> ve <strong>Mediator</strong>: Her ikisi de işbirliğini organize eder, ancak Facade (Cephe) işlevsellik eklemez</li>
</ul>
