<header>CEN206 Object-Oriented Programming</header>
<h2 id="what-are-structural-design-patterns">What Are Structural Design Patterns?</h2>
<p>Structural design patterns explain how to <strong>assemble objects and classes into larger structures</strong>, while keeping these structures <strong>flexible and efficient</strong>.</p>
<p>They deal with:</p>
<ul>
<li><strong>Class composition</strong>: How classes inherit from each other</li>
<li><strong>Object composition</strong>: How objects are composed to form larger structures</li>
<li><strong>Interface simplification</strong>: How complex subsystems are presented to clients</li>
<li><strong>Memory optimization</strong>: How shared state reduces resource consumption</li>
</ul>
<p>Source: <a href="https://refactoring.guru/design-patterns/structural-patterns">refactoring.guru</a></p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="why-structural-patterns-matter">Why Structural Patterns Matter</h2>
<ul>
<li>They help you build <strong>scalable architectures</strong> by defining clear relationships between components</li>
<li>They promote <strong>loose coupling</strong> between interacting classes</li>
<li>They enable <strong>flexible composition</strong> of objects at runtime</li>
<li>They provide proven solutions for organizing <strong>class hierarchies</strong> and <strong>object relationships</strong></li>
<li>They reduce <strong>code duplication</strong> through composition over inheritance</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="the-seven-structural-patterns">The Seven Structural Patterns</h2>
<table>
<thead>
<tr>
<th>Pattern</th>
<th>Purpose</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Adapter</strong></td>
<td>Makes incompatible interfaces work together</td>
</tr>
<tr>
<td><strong>Bridge</strong></td>
<td>Separates abstraction from implementation</td>
</tr>
<tr>
<td><strong>Composite</strong></td>
<td>Composes objects into tree structures</td>
</tr>
<tr>
<td><strong>Decorator</strong></td>
<td>Adds responsibilities dynamically</td>
</tr>
<tr>
<td><strong>Facade</strong></td>
<td>Simplifies complex subsystem interfaces</td>
</tr>
<tr>
<td><strong>Flyweight</strong></td>
<td>Shares state to support large numbers of objects</td>
</tr>
<tr>
<td><strong>Proxy</strong></td>
<td>Controls access to another object</td>
</tr>
</tbody>
</table>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="adapter-intent">Adapter: Intent</h2>
<p><strong>Adapter</strong> is a structural design pattern that allows objects with <strong>incompatible interfaces</strong> to collaborate.</p>
<ul>
<li>Also known as: <strong>Wrapper</strong></li>
<li>Converts the interface of a class into another interface that clients expect</li>
<li>Lets classes work together that could not otherwise because of incompatible interfaces</li>
</ul>
<p>Source: <a href="https://refactoring.guru/design-patterns/adapter">refactoring.guru</a></p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="adapter-problem">Adapter: Problem</h2>
<p>Imagine you are creating a <strong>stock market monitoring application</strong>. The app downloads stock data from multiple sources in <strong>XML format</strong>.</p>
<p>At some point, you decide to improve the app by integrating a smart <strong>third-party analytics library</strong>. But there is a catch: the analytics library only works with data in <strong>JSON format</strong>.</p>
<p>You cannot use the analytics library &quot;as is&quot; because it expects data in a format that is incompatible with your app.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10;--theme:default;--style:img[alt~=&quot;center&quot;] {

;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="187">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="adapter-problem-cont">Adapter: Problem (cont.)</h2>
<p>You could change the library to work with XML, but:</p>
<ul>
<li>This might <strong>break existing code</strong> that relies on the library</li>
<li>You might <strong>not have access</strong> to the library source code at all</li>
</ul>
<p>This situation arises frequently when integrating <strong>third-party</strong> or <strong>legacy</strong> code.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="adapter-solution">Adapter: Solution</h2>
<p>You can create an <strong>adapter</strong> -- a special object that converts the interface of one object so that another object can understand it.</p>
<ul>
<li>The adapter <strong>wraps</strong> one of the objects to hide the complexity of conversion happening behind the scenes</li>
<li>The wrapped object is not even aware of the adapter</li>
<li>The adapter receives calls in one format and translates them into calls the wrapped object understands</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

" data-lang="en-US" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10;--theme:default;--style:img[alt~=&quot;center&quot;] {

;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="187">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="adapter-solution-cont">Adapter: Solution (cont.)</h2>
<p>How adapters work:</p>
<ol>
<li>The adapter gets an interface compatible with one of the existing objects</li>
<li>Using this interface, the existing object can safely call the adapter's methods</li>
<li>Upon receiving a call, the adapter passes the request to the second object, but in a format and order that the second object expects</li>
</ol>
<p>Sometimes it is even possible to create a <strong>two-way adapter</strong> that can convert calls in both directions.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="adapter-real-world-analogy">Adapter: Real-World Analogy</h2>
<p>When you travel from the US to Europe for the first time, you may get a surprise when trying to charge your laptop. The <strong>power plug and socket</strong> standards are different in different countries.</p>
<p>A <strong>power plug adapter</strong> solves this problem. It has the American-style socket on one end and the European-style plug on the other, acting as a translator between two incompatible interfaces.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="adapter-structure-object-adapter">Adapter: Structure (Object Adapter)</h2>
<p>The <strong>Object Adapter</strong> uses composition:</p>
<ol>
<li><strong>Client</strong> - A class that contains the existing business logic of the program</li>
<li><strong>Client Interface</strong> - A protocol that other classes must follow to be able to collaborate with the client code</li>
<li><strong>Service</strong> - Some useful class (usually third-party or legacy). The client cannot use this class directly because it has an incompatible interface</li>
<li><strong>Adapter</strong> - A class that is able to work with both the client and the service. It implements the client interface while wrapping the service object</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="adapter-structure-class-adapter">Adapter: Structure (Class Adapter)</h2>
<p>The <strong>Class Adapter</strong> uses multiple inheritance:</p>
<ul>
<li>The adapter inherits interfaces from <strong>both</strong> the client and the service classes simultaneously</li>
<li>This approach is only possible in languages that support <strong>multiple inheritance</strong> (e.g., C++)</li>
<li>No wrapping is needed; adaptation occurs within overridden methods</li>
<li>The adapter overrides methods from both sides, translating between them</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="adapter-applicability">Adapter: Applicability</h2>
<p>Use the Adapter pattern when:</p>
<ul>
<li>You want to use an existing class, but its interface is <strong>not compatible</strong> with the rest of your code</li>
<li>You want to create a <strong>reusable class</strong> that cooperates with unrelated or unforeseen classes that do not necessarily have compatible interfaces</li>
<li>You need to use several existing subclasses, but it is impractical to adapt their interface by subclassing every one. An <strong>object adapter</strong> can adapt the interface of its parent class</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="adapter-applicability-cont">Adapter: Applicability (cont.)</h2>
<ul>
<li>You need a <strong>middle-layer class</strong> to serve as a translator between your code and a legacy class, a third-party class, or any other class with a weird interface</li>
<li>You want to <strong>reuse existing subclasses</strong> that lack some common functionality that cannot be added to the superclass</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="adapter-how-to-implement">Adapter: How to Implement</h2>
<ol>
<li>
<p>Make sure that you have at least two classes with <strong>incompatible interfaces</strong>: a useful service class and one or more client classes that would benefit from using the service class</p>
</li>
<li>
<p>Declare the <strong>client interface</strong> and describe how clients communicate with the service</p>
</li>
<li>
<p>Create the <strong>adapter class</strong> and make it follow the client interface. Leave all the methods empty for now</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="adapter-how-to-implement-cont">Adapter: How to Implement (cont.)</h2>
<ol start="4">
<li>
<p>Add a <strong>field to the adapter</strong> class to store a reference to the service object. The common practice is to initialize this field via the constructor, but sometimes it is more convenient to pass it to the adapter when calling its methods</p>
</li>
<li>
<p>One by one, <strong>implement all methods</strong> of the client interface in the adapter class. The adapter should delegate most of the real work to the service object, handling only the interface or data format conversion</p>
</li>
<li>
<p>Clients should use the adapter via the <strong>client interface</strong>. This lets you change or extend the adapters without affecting the client code</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="adapter-pros-and-cons">Adapter: Pros and Cons</h2>
<p><strong>Pros:</strong></p>
<ul>
<li><strong>Single Responsibility Principle</strong>: You can separate the interface or data conversion code from the primary business logic of the program</li>
<li><strong>Open/Closed Principle</strong>: You can introduce new types of adapters into the program without breaking the existing client code, as long as they work with the adapters through the client interface</li>
</ul>
<p><strong>Cons:</strong></p>
<ul>
<li>The overall complexity of the code increases because you need to introduce a set of new interfaces and classes. Sometimes it is simpler just to change the service class so that it matches the rest of your code</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="adapter-relations-with-other-patterns">Adapter: Relations with Other Patterns</h2>
<ul>
<li><strong>Bridge</strong> is usually designed up-front, letting you develop parts of an application independently. <strong>Adapter</strong> is commonly used with an existing app to make otherwise-incompatible classes work together</li>
<li><strong>Adapter</strong> changes the interface of an existing object, while <strong>Decorator</strong> enhances an object without changing its interface. Decorator supports recursive composition, which is not possible with Adapter</li>
<li><strong>Adapter</strong> provides a different interface to the wrapped object, <strong>Proxy</strong> provides it with the same interface, and <strong>Decorator</strong> provides it with an enhanced interface</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="adapter-relations-with-other-patterns-cont">Adapter: Relations with Other Patterns (cont.)</h2>
<ul>
<li><strong>Facade</strong> defines a new interface for existing objects, whereas <strong>Adapter</strong> tries to make the existing interface usable. Adapter usually wraps just one object, while Facade works with an entire subsystem of objects</li>
<li><strong>Bridge</strong>, <strong>State</strong>, <strong>Strategy</strong> (and to some degree <strong>Adapter</strong>) have very similar structures. All these patterns are based on composition, which is delegating work to other objects. However, they all solve different problems</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-b-takeaway">Module B: Takeaway</h2>
<ul>
<li>The Adapter pattern acts as a <strong>bridge</strong> between two incompatible interfaces</li>
<li>It wraps an existing class with a new interface to make it compatible with client expectations</li>
<li>Use it when you need to integrate <strong>legacy</strong> or <strong>third-party</strong> code with your system</li>
<li>It follows the <strong>Single Responsibility</strong> and <strong>Open/Closed</strong> principles</li>
<li>There are two variants: <strong>Object Adapter</strong> (composition) and <strong>Class Adapter</strong> (multiple inheritance)</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="bridge-intent">Bridge: Intent</h2>
<p><strong>Bridge</strong> is a structural design pattern that lets you split a large class or a set of closely related classes into <strong>two separate hierarchies</strong> -- abstraction and implementation -- which can be developed <strong>independently</strong> of each other.</p>
<p>Source: <a href="https://refactoring.guru/design-patterns/bridge">refactoring.guru</a></p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10;--theme:default;--style:img[alt~=&quot;center&quot;] {

}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="187">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="bridge-problem">Bridge: Problem</h2>
<p>Say you have a geometric <code>Shape</code> class with a pair of subclasses: <code>Circle</code> and <code>Square</code>. You want to extend this class hierarchy to incorporate colors, so you plan to create <code>Red</code> and <code>Blue</code> shape subclasses.</p>
<p>However, since you already have two subclasses, you would need to create <strong>four</strong> class combinations such as <code>BlueCircle</code> and <code>RedSquare</code>.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="187">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="bridge-problem-cont">Bridge: Problem (cont.)</h2>
<p>Adding new shape types and colors to the hierarchy will grow it <strong>exponentially</strong>. For example:</p>
<ul>
<li>Adding a <strong>Triangle</strong> shape would require 2 new subclasses (one for each color)</li>
<li>Adding a <strong>Green</strong> color would require 3 new subclasses (one for each shape)</li>
</ul>
<p>This problem occurs because we are trying to extend shape classes in <strong>two independent dimensions</strong>: by form and by color. This is a very common issue with class inheritance.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="187">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="bridge-solution">Bridge: Solution</h2>
<p>The Bridge pattern attempts to solve this problem by switching from <strong>inheritance</strong> to <strong>object composition</strong>. What this means is that you extract one of the dimensions into a separate class hierarchy, so that the original classes will reference an object of the new hierarchy, instead of having all of its state and behaviors within one class.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="187">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="bridge-solution-cont">Bridge: Solution (cont.)</h2>
<p>Following this approach, we can extract the color-related code into its own class with two subclasses: <code>Red</code> and <code>Blue</code>. The <code>Shape</code> class then gets a reference field pointing to one of the color objects.</p>
<p>Now the shape can <strong>delegate</strong> any color-related work to the linked color object. That reference will act as a <strong>bridge</strong> between the <code>Shape</code> and <code>Color</code> classes.</p>
<p>From now on, adding new colors will not require changing the shape hierarchy, and vice versa.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

<header>CEN206 Object-Oriented Programming</header>
<h2 id="bridge-abstraction-and-implementation">Bridge: Abstraction and Implementation</h2>
<p><strong>Abstraction</strong> (also called interface) is a high-level control layer for some entity. This layer is not supposed to do any real work on its own. It should delegate the work to the <strong>implementation</strong> layer (also called platform).</p>
<p>Note: these are not the same as interfaces or abstract classes from your programming language. They are general concepts.</p>
<ul>
<li><strong>Abstraction</strong>: GUI layer of an app (e.g., remote control)</li>
<li><strong>Implementation</strong>: Operating system API, device-specific code (e.g., TV, Radio)</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

" data-lang="en-US" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10;--theme:default;--style:img[alt~=&quot;center&quot;] {

<header>CEN206 Object-Oriented Programming</header>
<h2 id="bridge-real-world-analogy">Bridge: Real-World Analogy</h2>
<p>Consider a <strong>remote control</strong> and a <strong>device</strong> (TV, Radio).</p>
<ul>
<li>The remote control is the <strong>abstraction</strong> -- it provides high-level controls (power, volume, channel)</li>
<li>The device is the <strong>implementation</strong> -- it defines how these controls actually work</li>
<li>You can pair different remotes with different devices</li>
<li>You can create an advanced remote with extra buttons without changing the device classes</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

<header>CEN206 Object-Oriented Programming</header>
<h2 id="bridge-structure">Bridge: Structure</h2>
<ol>
<li><strong>Abstraction</strong> -- Provides high-level control logic. Relies on the implementation object to do the actual low-level work</li>
<li><strong>Implementation</strong> -- Declares the interface that is common for all concrete implementations. An abstraction can only communicate with an implementation object via methods declared here</li>
<li><strong>Concrete Implementations</strong> -- Contain platform-specific code</li>
<li><strong>Refined Abstractions</strong> -- Provide variants of control logic. Like their parent, they work with different implementations via the general implementation interface</li>
<li><strong>Client</strong> -- Links an abstraction object with one of the implementation objects</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="bridge-java-code-example---abstraction">Bridge: Java Code Example - Abstraction</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// The abstraction defines the interface for the &quot;control&quot; part</span>
<span class="hljs-comment">// of the two class hierarchies. It maintains a reference to an</span>
<span class="hljs-comment">// object of the implementation hierarchy and delegates all of</span>
<span class="hljs-comment">// the real work to this object.</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">RemoteControl</span> {
    <span class="hljs-keyword">protected</span> Device device;

    <span class="hljs-keyword">public</span> <span class="hljs-title function_">RemoteControl</span><span class="hljs-params">(Device device)</span> {
        <span class="hljs-built_in">this</span>.device = device;
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">togglePower</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">if</span> (device.isEnabled()) {
            device.disable();
        } <span class="hljs-keyword">else</span> {
            device.enable();
        }
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">volumeDown</span><span class="hljs-params">()</span> {
        device.setVolume(device.getVolume() - <span class="hljs-number">10</span>);
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">volumeUp</span><span class="hljs-params">()</span> {
        device.setVolume(device.getVolume() + <span class="hljs-number">10</span>);
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">channelDown</span><span class="hljs-params">()</span> {
        device.setChannel(device.getChannel() - <span class="hljs-number">1</span>);
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">channelUp</span><span class="hljs-params">()</span> {
        device.setChannel(device.getChannel() + <span class="hljs-number">1</span>);
    }
}
</code></pre>

<h2 id="bridge-applicability">Bridge: Applicability</h2>
<p>Use the Bridge pattern when:</p>
<ul>
<li>You want to divide and organize a <strong>monolithic class</strong> that has several variants of some functionality (e.g., if the class can work with various database servers)</li>
<li>You need to extend a class in several <strong>orthogonal (independent) dimensions</strong></li>
<li>You need to be able to <strong>switch implementations at runtime</strong></li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="bridge-applicability-cont">Bridge: Applicability (cont.)</h2>
<p><strong>Monolithic class refactoring</strong>: The bigger a class becomes, the harder it is to figure out how it works and the longer it takes to make a change. Bridge lets you split the monolithic class into several class hierarchies, each changeable independently.</p>
<p><strong>Orthogonal dimensions</strong>: Extract a separate class hierarchy for each dimension. The original class delegates related work to objects belonging to those hierarchies instead of doing everything on its own.</p>
<p><strong>Runtime switching</strong>: Although it is optional, the Bridge pattern lets you replace the implementation object inside the abstraction at runtime. This is as easy as assigning a new value to a field.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="bridge-how-to-implement">Bridge: How to Implement</h2>
<ol>
<li>
<p>Identify the <strong>orthogonal dimensions</strong> in your classes. These independent concepts could be: abstraction/platform, domain/infrastructure, front-end/back-end, or interface/implementation</p>
</li>
<li>
<p>See what operations the <strong>client needs</strong> and define them in the base abstraction class</p>
</li>
<li>
<p>Determine the operations available on <strong>all platforms</strong>. Declare the ones that the abstraction needs in the general implementation interface</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

}
" data-lang="en-US" lang="en-US" data-marpit-pagination="57" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10;--theme:default;--style:img[alt~=&quot;center&quot;] {

;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="187">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="bridge-how-to-implement-cont">Bridge: How to Implement (cont.)</h2>
<ol start="4">
<li>
<p>For all platforms in your domain, create <strong>concrete implementation classes</strong>, but make sure they all follow the implementation interface</p>
</li>
<li>
<p>Inside the abstraction class, add a <strong>reference field</strong> for the implementation type. The abstraction delegates most of the work to the implementation object that is referenced in that field</p>
</li>
<li>
<p>If you have several variants of <strong>high-level logic</strong>, create <strong>refined abstractions</strong> for each variant by extending the base abstraction class</p>
</li>
<li>
<p>The <strong>client code</strong> should pass an implementation object to the abstraction's constructor to associate one with the other. After that, the client can forget about the implementation and work only with the abstraction object</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="bridge-pros-and-cons">Bridge: Pros and Cons</h2>
<p><strong>Pros:</strong></p>
<ul>
<li>You can create <strong>platform-independent</strong> classes and apps</li>
<li>The client code works with high-level abstractions and is <strong>not exposed to the platform details</strong></li>
<li><strong>Open/Closed Principle</strong>: You can introduce new abstractions and implementations independently of each other</li>
<li><strong>Single Responsibility Principle</strong>: You can focus on high-level logic in the abstraction and on platform details in the implementation</li>
</ul>
<p><strong>Cons:</strong></p>
<ul>
<li>You might make the code <strong>more complicated</strong> by applying the pattern to a highly cohesive class</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="bridge-relations-with-other-patterns">Bridge: Relations with Other Patterns</h2>
<ul>
<li><strong>Bridge</strong> is usually designed up-front, letting you develop parts of an application independently. On the other hand, <strong>Adapter</strong> is commonly used with an existing application to make otherwise-incompatible classes work together</li>
<li><strong>Bridge</strong>, <strong>State</strong>, <strong>Strategy</strong> (and to some degree <strong>Adapter</strong>) have very similar structures. All these patterns are based on composition. However, they all solve different problems</li>
<li>You can use <strong>Abstract Factory</strong> along with <strong>Bridge</strong>. This pairing is useful when some abstractions defined by Bridge can only work with specific implementations</li>
<li>You can combine <strong>Builder</strong> with <strong>Bridge</strong>: the director class plays the role of the abstraction, while different builders act as implementations</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-c-takeaway">Module C: Takeaway</h2>
<ul>
<li>The Bridge pattern <strong>separates abstraction from implementation</strong> so both can vary independently</li>
<li>It solves the problem of <strong>combinatorial explosion</strong> in class hierarchies</li>
<li>It uses <strong>composition</strong> instead of inheritance to combine different dimensions</li>
<li>It follows the <strong>Open/Closed</strong> and <strong>Single Responsibility</strong> principles</li>
<li>Design it <strong>up-front</strong> rather than retrofitting (that is what Adapter is for)</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="composite-intent">Composite: Intent</h2>
<p><strong>Composite</strong> is a structural design pattern that lets you compose objects into <strong>tree structures</strong> and then work with these structures as if they were <strong>individual objects</strong>.</p>
<ul>
<li>Also known as: <strong>Object Tree</strong></li>
</ul>
<p>Source: <a href="https://refactoring.guru/design-patterns/composite">refactoring.guru</a></p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="64" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="187">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="composite-problem">Composite: Problem</h2>
<p>Using the Composite pattern makes sense only when the core model of your app can be represented as a <strong>tree</strong>.</p>
<p>For example, imagine that you have two types of objects: <code>Products</code> and <code>Boxes</code>. A <code>Box</code> can contain several <code>Products</code> as well as a number of smaller <code>Boxes</code>. These little <code>Boxes</code> can also hold some <code>Products</code> or even smaller <code>Boxes</code>, and so on.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="65" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="187">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="composite-problem-cont">Composite: Problem (cont.)</h2>
<p>Say you decide to create an ordering system using these classes. Orders could contain simple products without any wrapping, as well as boxes stuffed with products and other boxes.</p>
<p>How would you determine the <strong>total price</strong> of such an order?</p>
<p>You could try a direct approach: unwrap all the boxes, go over all the products and then calculate the total. But this requires knowing the specific classes and nesting structure in advance, making the code tightly coupled to the structure.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="66" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="187">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="composite-solution">Composite: Solution</h2>
<p>The Composite pattern suggests that you work with <code>Products</code> and <code>Boxes</code> through a <strong>common interface</strong> which declares a method for calculating the total price.</p>
<ul>
<li>For a <strong>product</strong>, it would simply return the product's price</li>
<li>For a <strong>box</strong>, it would go over each item the box contains, ask its price, and then return a total for this box</li>
</ul>
<p>The greatest benefit is that you do not need to care about the concrete classes of objects that compose the tree. You can treat them all the same via the common interface.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="67" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="187">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="composite-solution-cont">Composite: Solution (cont.)</h2>
<p>When you call a method, the objects themselves pass the request down the tree. You can <strong>run a behavior recursively over all components</strong> of an object tree.</p>
<p>This approach works because:</p>
<ul>
<li>A product returns its price directly</li>
<li>A box iterates over its contents, calling the price method on each item</li>
<li>If an item is another box, that box also iterates over its contents, and so on</li>
<li>The result is that the entire tree structure is traversed automatically</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;

<header>CEN206 Object-Oriented Programming</header>
<h2 id="composite-real-world-analogy">Composite: Real-World Analogy</h2>
<p><strong>Armies</strong> of most countries are structured as hierarchies. An army consists of several divisions; a division is a set of brigades, and a brigade consists of platoons, which can be broken down into squads. Finally, a squad is a small group of real soldiers.</p>
<p><strong>Orders</strong> are given at the top of the hierarchy and passed down onto each level until every soldier knows what needs to be done. This mirrors how the Composite pattern delegates work through the tree.</p>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="composite-structure">Composite: Structure</h2>
<ol>
<li><strong>Component</strong> -- The interface that describes operations common to both simple and complex elements of the tree</li>
<li><strong>Leaf</strong> -- A basic element of a tree that does not have sub-elements. Usually, leaf components end up doing most of the real work, since they have no one to delegate the work to</li>
<li><strong>Container (Composite)</strong> -- An element that has sub-elements: leaves or other containers. A container does not know the concrete classes of its children. It works with all sub-elements only via the component interface</li>
<li><strong>Client</strong> -- Works with all elements through the component interface. As a result, the client can work in the same way with both simple and complex elements of the tree</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="composite-java-code-example---composite">Composite: Java Code Example - Composite</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.util.ArrayList;
<span class="hljs-keyword">import</span> java.util.List;

<span class="hljs-comment">// The Composite class represents complex components that may</span>
<span class="hljs-comment">// have children. It delegates work to its children and then</span>
<span class="hljs-comment">// aggregates the result.</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">CompoundGraphic</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">Graphic</span> {
    <span class="hljs-keyword">private</span> List&lt;Graphic&gt; children = <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;&gt;();

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">add</span><span class="hljs-params">(Graphic child)</span> {
        children.add(child);
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">remove</span><span class="hljs-params">(Graphic child)</span> {
        children.remove(child);
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">move</span><span class="hljs-params">(<span class="hljs-type">int</span> x, <span class="hljs-type">int</span> y)</span> {
        <span class="hljs-keyword">for</span> (Graphic child : children) {
            child.move(x, y);
        }
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">draw</span><span class="hljs-params">()</span> {
        System.out.println(<span class="hljs-string">&quot;---- CompoundGraphic ----&quot;</span>);
        <span class="hljs-keyword">for</span> (Graphic child : children) {
            child.draw();
        }
        System.out.println(<span class="hljs-string">&quot;---- End Compound ----&quot;</span>);
    }
}
</code></pre>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="composite-applicability">Composite: Applicability</h2>
<p>Use the Composite pattern when:</p>
<ul>
<li>You have to implement a <strong>tree-like object structure</strong>. The Composite pattern provides you with two basic element types that share a common interface: simple leaves and complex containers</li>
<li>You want the client code to treat both simple and complex elements <strong>uniformly</strong>. All elements defined by the Composite pattern share a common interface, so the client does not need to worry about the concrete class of the objects it works with</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="187">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="composite-how-to-implement">Composite: How to Implement</h2>
<ol>
<li>
<p>Make sure that the core model of your app can be represented as a <strong>tree structure</strong>. Try to break it down into simple elements and containers. Remember that containers must be able to contain both simple elements and other containers</p>
</li>
<li>
<p>Declare the <strong>component interface</strong> with a list of methods that make sense for both simple and complex components</p>
</li>
<li>
<p>Create a <strong>leaf class</strong> to represent simple elements. A program may have multiple different leaf classes</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="79" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="187">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="composite-how-to-implement-cont">Composite: How to Implement (cont.)</h2>
<ol start="4">
<li>
<p>Create a <strong>container class</strong> to represent complex elements. In this class, provide an array field for storing references to sub-elements. The array must be able to store both leaves and containers, so make sure it is declared with the component interface type</p>
</li>
<li>
<p>When implementing the methods of the container, remember that a container is supposed to <strong>delegate most of the work to sub-elements</strong></p>
</li>
<li>
<p>Finally, define the methods for <strong>adding and removing</strong> child elements in the container. Keep in mind that these operations can be declared in the component interface, which would violate the Interface Segregation Principle but would let the client treat all elements equally</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="80" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

" data-lang="en-US" lang="en-US" data-marpit-pagination="80" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10;--theme:default;--style:img[alt~=&quot;center&quot;] {

;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="187">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="composite-pros-and-cons">Composite: Pros and Cons</h2>
<p><strong>Pros:</strong></p>
<ul>
<li>You can work with complex tree structures more conveniently: use <strong>polymorphism and recursion</strong> to your advantage</li>
<li><strong>Open/Closed Principle</strong>: You can introduce new element types into the app without breaking the existing code, which now works with the object tree</li>
</ul>
<p><strong>Cons:</strong></p>
<ul>
<li>It might be difficult to provide a <strong>common interface</strong> for classes whose functionality differs too much. In certain scenarios, you would need to overgeneralize the component interface, making it harder to comprehend</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="81" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

<header>CEN206 Object-Oriented Programming</header>
<h2 id="composite-relations-with-other-patterns">Composite: Relations with Other Patterns</h2>
<ul>
<li>You can use <strong>Builder</strong> when creating complex Composite trees because you can program its construction steps to work recursively</li>
<li><strong>Chain of Responsibility</strong> is often used in conjunction with Composite. When a leaf component gets a request, it can pass it through the chain of all parent components down to the root of the object tree</li>
<li>You can use <strong>Iterators</strong> to traverse Composite trees</li>
<li>You can use <strong>Visitor</strong> to execute an operation over an entire Composite tree</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="composite-relations-with-other-patterns-cont">Composite: Relations with Other Patterns (cont.)</h2>
<ul>
<li>You can implement shared leaf nodes of the Composite tree as <strong>Flyweights</strong> to save RAM</li>
<li><strong>Composite</strong> and <strong>Decorator</strong> have similar structure diagrams since both rely on recursive composition. However, a Decorator is like a Composite that has only one child component. Decorator adds additional responsibilities to the wrapped object, while Composite just &quot;sums up&quot; its children's results</li>
<li>Designs that make heavy use of Composite and Decorator can often benefit from using <strong>Prototype</strong>. Applying the pattern lets you clone complex structures instead of re-constructing them from scratch</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-d-takeaway">Module D: Takeaway</h2>
<ul>
<li>The Composite pattern lets you compose objects into <strong>tree structures</strong> and treat them uniformly</li>
<li>It uses a <strong>common interface</strong> for both simple (leaf) and complex (composite) elements</li>
<li>The pattern enables <strong>recursive composition</strong> where containers can hold both leaves and other containers</li>
<li>It is ideal for representing <strong>part-whole hierarchies</strong></li>
<li>It follows the <strong>Open/Closed Principle</strong> by allowing new element types without modifying existing code</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="decorator-intent">Decorator: Intent</h2>
<p><strong>Decorator</strong> is a structural design pattern that lets you attach <strong>new behaviors</strong> to objects by placing these objects inside special <strong>wrapper objects</strong> that contain the behaviors.</p>
<ul>
<li>Also known as: <strong>Wrapper</strong></li>
</ul>
<p>Source: <a href="https://refactoring.guru/design-patterns/decorator">refactoring.guru</a></p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

}
" data-lang="en-US" lang="en-US" data-marpit-pagination="87" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10;--theme:default;--style:img[alt~=&quot;center&quot;] {

}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="187">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="decorator-problem">Decorator: Problem</h2>
<p>Imagine that you are working on a <strong>notification library</strong> which lets other programs notify their users about important events.</p>
<p>The initial version of the library was based on the <code>Notifier</code> class that had only a few fields, a constructor, and a single <code>send</code> method. The method could accept a message argument from a client and send the message to a list of emails.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="88" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="88" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="187">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="decorator-problem-cont">Decorator: Problem (cont.)</h2>
<p>At some point, you realize that users of the library expect more than just email notifications. Many of them would like to receive an <strong>SMS</strong> about critical issues. Others would like to be notified on <strong>Facebook</strong>. And the corporate users would love to get <strong>Slack</strong> notifications.</p>
<p>How hard can that be? You extend the <code>Notifier</code> class and put the additional notification methods into new subclasses. Now the client is supposed to instantiate the desired notification class and use it for all further notifications.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="89" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="89" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="187">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="decorator-problem-cont-1">Decorator: Problem (cont.)</h2>
<p>But then someone asks: &quot;Why can't you use <strong>several notification types at once</strong>?&quot; For example, if your house is on fire, you would probably want to be informed through every channel.</p>
<p>You try to address that by creating special subclasses for every combination. But it quickly becomes apparent that this approach bloats the code immensely -- <strong>combinatorial explosion</strong> of subclasses makes the codebase unmaintainable.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="90" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="90" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10;--theme:default;--style:img[alt~=&quot;center&quot;] {

}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="187">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="decorator-solution">Decorator: Solution</h2>
<p>When you need to alter an object's behavior, the first thing that comes to mind is extending a class. However, inheritance has several serious caveats:</p>
<ul>
<li>Inheritance is <strong>static</strong> -- you cannot alter the behavior of an existing object at runtime</li>
<li>Subclasses can have just <strong>one parent class</strong> (in most languages)</li>
</ul>
<p>One of the alternatives is to use <strong>Composition/Aggregation</strong> instead of Inheritance.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="91" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;

<header>CEN206 Object-Oriented Programming</header>
<h2 id="decorator-solution-cont">Decorator: Solution (cont.)</h2>
<p>A <strong>wrapper</strong> is an object that can be linked with some <strong>target</strong> object. The wrapper contains the same set of methods as the target and delegates all requests it receives to the target. However, the wrapper may alter the result by doing something either <strong>before or after</strong> it passes the request to the target.</p>
<p>When does a simple wrapper become a real decorator? The wrapper implements the <strong>same interface</strong> as the wrapped object. That is why from the client's perspective these objects are identical.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="decorator-solution-cont-1">Decorator: Solution (cont.)</h2>
<p>Multiple wrappers can be <strong>stacked</strong> around a single object, combining all their behaviors:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Encryption(Compression(FileDataSource))
</code></pre>
<p>The client can wrap the object with any decorators that follow the same interface. All wrappers combine their behaviors without creating new subclasses.</p>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="decorator-real-world-analogy">Decorator: Real-World Analogy</h2>
<p><strong>Wearing clothes</strong> is an example of using decorators. When you are cold, you wrap yourself in a sweater. If you are still cold, you can wear a jacket on top. If it is raining, you can put on a raincoat.</p>
<p>All of these garments <strong>extend</strong> your basic behavior but are not part of you, and you can easily <strong>take off</strong> any piece of clothing whenever you do not need it.</p>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="decorator-structure">Decorator: Structure</h2>
<ol>
<li><strong>Component</strong> -- Declares the common interface for both wrappers and wrapped objects</li>
<li><strong>Concrete Component</strong> -- A class of objects being wrapped. It defines basic behavior, which can be altered by decorators</li>
<li><strong>Base Decorator</strong> -- A class that has a field for referencing a wrapped object. The field's type should be declared as the component interface so it can contain both concrete components and decorators. The base decorator delegates all operations to the wrapped object</li>
<li><strong>Concrete Decorators</strong> -- Define extra behaviors that can be added to components dynamically. They override methods of the base decorator and execute their behavior either before or after calling the parent method</li>
<li><strong>Client</strong> -- Can wrap components in multiple layers of decorators, as long as it works with all objects via the component interface</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

        <span class="hljs-type">String</span> <span class="hljs-variable">encrypted</span> <span class="hljs-operator">=</span> Base64.getEncoder()
            .encodeToString(data.getBytes());

    <span class="hljs-keyword">public</span> String <span class="hljs-title function_">readData</span><span class="hljs-params">()</span> {
        <span class="hljs-comment">// Decrypt data after reading</span>
        <span class="hljs-type">String</span> <span class="hljs-variable">data</span> <span class="hljs-operator">=</span> <span class="hljs-built_in">super</span>.readData();
        <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">String</span>(Base64.getDecoder().decode(data));

}

<header>CEN206 Object-Oriented Programming</header>
<h2 id="decorator-applicability">Decorator: Applicability</h2>
<p>Use the Decorator pattern when:</p>
<ul>
<li>You need to be able to assign <strong>extra behaviors to objects at runtime</strong> without breaking the code that uses these objects</li>
<li>It is awkward or not possible to extend an object's behavior using <strong>inheritance</strong> (e.g., <code>final</code> classes)</li>
<li>You need to <strong>combine several behaviors</strong> by wrapping an object in multiple decorators</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="decorator-applicability-cont">Decorator: Applicability (cont.)</h2>
<p>The Decorator lets you structure your business logic into <strong>layers</strong>, create a decorator for each layer, and compose objects with various combinations of this logic at runtime. The client code can treat all these objects in the same way, since they all follow a common interface.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="decorator-how-to-implement">Decorator: How to Implement</h2>
<ol>
<li>
<p>Make sure your business domain can be represented as a <strong>primary component</strong> with multiple optional layers over it</p>
</li>
<li>
<p>Figure out what methods are common to both the primary component and the optional layers. Create a <strong>component interface</strong> and declare those methods there</p>
</li>
<li>
<p>Create a <strong>concrete component</strong> class and define the base behavior in it</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

" data-lang="en-US" lang="en-US" data-marpit-pagination="106" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10;--theme:default;--style:img[alt~=&quot;center&quot;] {

;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="187">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="decorator-how-to-implement-cont">Decorator: How to Implement (cont.)</h2>
<ol start="4">
<li>
<p>Create a <strong>base decorator</strong> class. It should have a field for storing a reference to a wrapped object. The field should be declared with the component interface type to allow linking to concrete components as well as decorators. The base decorator must delegate all work to the wrapped object</p>
</li>
<li>
<p>Make sure all classes implement the <strong>component interface</strong></p>
</li>
<li>
<p>Create <strong>concrete decorators</strong> by extending them from the base decorator. A concrete decorator must execute its behavior before or after the call to the parent method (which always delegates to the wrapped object)</p>
</li>
<li>
<p>The <strong>client code</strong> must be responsible for creating decorators and composing them in the way the client needs</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="decorator-pros-and-cons">Decorator: Pros and Cons</h2>
<p><strong>Pros:</strong></p>
<ul>
<li>You can extend an object's behavior <strong>without making a new subclass</strong></li>
<li>You can add or remove responsibilities from an object <strong>at runtime</strong></li>
<li>You can <strong>combine</strong> several behaviors by wrapping an object into multiple decorators</li>
<li><strong>Single Responsibility Principle</strong>: You can divide a monolithic class that implements many possible variants of behavior into several smaller classes</li>
</ul>
<p><strong>Cons:</strong></p>
<ul>
<li>It is hard to <strong>remove a specific wrapper</strong> from the wrappers stack</li>
<li>It is hard to implement a decorator in such a way that its behavior does <strong>not depend on the order</strong> in the decorators stack</li>
<li>The initial <strong>configuration code</strong> of layers might look pretty ugly</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="decorator-relations-with-other-patterns">Decorator: Relations with Other Patterns</h2>
<ul>
<li><strong>Adapter</strong> provides a completely different interface for accessing an existing object. With Decorator, the interface either stays the same or gets extended. In addition, Decorator supports recursive composition, which is not possible when you use Adapter</li>
<li><strong>Adapter</strong> changes the interface of an existing object, while <strong>Decorator</strong> enhances an object without changing its interface</li>
<li><strong>Proxy</strong> usually manages the full lifecycle of its service object on its own, whereas the composition of <strong>Decorators</strong> is always controlled by the client</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="decorator-relations-with-other-patterns-cont">Decorator: Relations with Other Patterns (cont.)</h2>
<ul>
<li><strong>Chain of Responsibility</strong> and <strong>Decorator</strong> have very similar class structures. Both patterns rely on recursive composition to pass execution through a series of objects. However, there are several crucial differences. CoR handlers can execute arbitrary operations independently of each other. They can also stop passing the request further at any point. Decorators extend the object's behavior while keeping it consistent with the base interface</li>
<li><strong>Composite</strong> and <strong>Decorator</strong> have similar structure diagrams since both rely on recursive composition. A Decorator is like a Composite that has only one child component. Decorator adds additional responsibilities to the wrapped object, while Composite just &quot;sums up&quot; its children's results</li>
<li><strong>Strategy</strong> lets you change the insides of an object, while <strong>Decorator</strong> lets you change the skin</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-e-takeaway">Module E: Takeaway</h2>
<ul>
<li>The Decorator pattern allows adding behavior to objects <strong>dynamically</strong> through wrapping</li>
<li>It avoids the <strong>combinatorial explosion</strong> of subclasses caused by inheritance</li>
<li>Multiple decorators can be <strong>stacked</strong> to combine behaviors</li>
<li>It follows the <strong>Single Responsibility</strong> and <strong>Open/Closed</strong> principles</li>
<li>Prefer composition over inheritance when behaviors need to be added <strong>at runtime</strong></li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="facade-intent">Facade: Intent</h2>
<p><strong>Facade</strong> is a structural design pattern that provides a <strong>simplified interface</strong> to a library, a framework, or any other complex set of classes.</p>
<p>Source: <a href="https://refactoring.guru/design-patterns/facade">refactoring.guru</a></p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="114" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

}
" data-lang="en-US" lang="en-US" data-marpit-pagination="114" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10;--theme:default;--style:img[alt~=&quot;center&quot;] {
