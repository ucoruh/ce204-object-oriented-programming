<header>CEN206 Object-Oriented Programming</header>
<h2 id="facade-problem">Facade: Problem</h2>
<p>Imagine that you must make your code work with a broad set of objects that belong to a sophisticated library or framework. Ordinarily, you would need to <strong>initialize all of those objects</strong>, keep track of <strong>dependencies</strong>, execute methods in the <strong>correct order</strong>, and so on.</p>
<p>As a result, the business logic of your classes would become <strong>tightly coupled</strong> to the implementation details of third-party classes, making it hard to comprehend and maintain.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="115" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="115" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="187">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="facade-solution">Facade: Solution</h2>
<p>A facade is a class that provides a <strong>simple interface</strong> to a complex subsystem which contains lots of moving parts. A facade might provide limited functionality in comparison to working with the subsystem directly. However, it includes only those features that <strong>clients really care about</strong>.</p>
<p>Having a facade is handy when you need to integrate your app with a sophisticated library that has dozens of features, but you just need a tiny bit of its functionality.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="116" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="187">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="facade-solution-cont">Facade: Solution (cont.)</h2>
<p>For instance, an app that uploads short funny videos with cats to social media could potentially use a professional video conversion library. However, all that it really needs is a class with the single method <code>encode(filename, format)</code>.</p>
<p>After creating such a class and connecting it with the video conversion library, you will have your first <strong>facade</strong>.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="facade-real-world-analogy">Facade: Real-World Analogy</h2>
<p>When you call a shop to place a phone order, an <strong>operator</strong> is your facade to all services and departments of the shop. The operator provides you with a simple voice interface to the ordering system, payment gateways, and various delivery services.</p>
<p>You do not need to navigate through the shop's internal systems yourself -- the operator handles everything through a simple interface.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>

;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="187">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="facade-structure">Facade: Structure</h2>
<ol>
<li>
<p><strong>Facade</strong> -- Provides convenient access to a particular part of the subsystem's functionality. It knows where to direct the client's request and how to operate all the moving parts</p>
</li>
<li>
<p><strong>Additional Facade</strong> -- Can be created to prevent polluting a single facade with unrelated features that would make it yet another complex structure. Additional facades can be used by both clients and other facades</p>
</li>
<li>
<p><strong>Complex Subsystem</strong> -- Consists of dozens of various objects. To make them all do something meaningful, you have to dive deep into the subsystem's implementation details. Subsystem classes are not aware of the facade's existence</p>
</li>
<li>
<p><strong>Client</strong> -- Uses the facade instead of calling the subsystem objects directly</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="facade-java-code-example---facade-class">Facade: Java Code Example - Facade Class</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// The Facade class provides a simple interface to the</span>
<span class="hljs-comment">// complex logic of one or several subsystems. The Facade</span>
<span class="hljs-comment">// delegates the client requests to the appropriate objects</span>
<span class="hljs-comment">// within the subsystem and is also responsible for managing</span>
<span class="hljs-comment">// their lifecycle.</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">VideoConversionFacade</span> {

    <span class="hljs-keyword">public</span> VideoFile <span class="hljs-title function_">convert</span><span class="hljs-params">(String filename, String format)</span> {
        System.out.println(<span class="hljs-string">&quot;VideoConversionFacade: &quot;</span> +
            <span class="hljs-string">&quot;conversion started.&quot;</span>);
        <span class="hljs-type">VideoFile</span> <span class="hljs-variable">file</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">VideoFile</span>(filename);
        <span class="hljs-type">Codec</span> <span class="hljs-variable">sourceCodec</span> <span class="hljs-operator">=</span> CodecFactory.extract(file);

        Codec destinationCodec;
        <span class="hljs-keyword">if</span> (format.equals(<span class="hljs-string">&quot;mp4&quot;</span>)) {
            destinationCodec = <span class="hljs-keyword">new</span> <span class="hljs-title class_">MPEG4CompressionCodec</span>();
        } <span class="hljs-keyword">else</span> {
            destinationCodec = <span class="hljs-keyword">new</span> <span class="hljs-title class_">OggCompressionCodec</span>();
        }

        <span class="hljs-type">VideoFile</span> <span class="hljs-variable">buffer</span> <span class="hljs-operator">=</span> BitrateReader.read(file,
            sourceCodec);
        <span class="hljs-type">VideoFile</span> <span class="hljs-variable">result</span> <span class="hljs-operator">=</span> BitrateReader.convert(buffer,
            destinationCodec);
        result = <span class="hljs-keyword">new</span> <span class="hljs-title class_">AudioMixer</span>().fix(result);

        System.out.println(<span class="hljs-string">&quot;VideoConversionFacade: &quot;</span> +
            <span class="hljs-string">&quot;conversion completed.&quot;</span>);
        <span class="hljs-keyword">return</span> result;
    }
}
</code></pre>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="facade-applicability">Facade: Applicability</h2>
<p>Use the Facade pattern when:</p>
<ul>
<li>You need to have a <strong>limited but straightforward interface</strong> to a complex subsystem. Often, subsystems get more complex over time. Even applying design patterns typically leads to creating more classes. A subsystem may become more flexible and easier to reuse in various contexts, but the amount of configuration and boilerplate code it demands from a client grows ever larger. The Facade attempts to provide a shortcut to the most-used features of the subsystem</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

}
" data-lang="en-US" lang="en-US" data-marpit-pagination="126" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10;--theme:default;--style:img[alt~=&quot;center&quot;] {

}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="187">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="facade-applicability-cont">Facade: Applicability (cont.)</h2>
<ul>
<li>You want to <strong>structure a subsystem into layers</strong>. Create facades to define entry points to each level of a subsystem. You can reduce coupling between multiple subsystems by requiring them to communicate only through facades. This approach is similar to the Mediator pattern</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="facade-how-to-implement">Facade: How to Implement</h2>
<ol>
<li>
<p>Check whether it is possible to provide a <strong>simpler interface</strong> than what an existing subsystem already provides. You are on the right track if this interface makes the client code independent from many of the subsystem's classes</p>
</li>
<li>
<p>Declare and implement this interface in a new <strong>facade class</strong>. The facade should redirect the calls from the client code to appropriate objects of the subsystem. The facade should be responsible for initializing the subsystem and managing its further life cycle unless the client code already does this</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

}
" data-lang="en-US" lang="en-US" data-marpit-pagination="128" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10;--theme:default;--style:img[alt~=&quot;center&quot;] {

;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="187">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="facade-how-to-implement-cont">Facade: How to Implement (cont.)</h2>
<ol start="3">
<li>
<p>To get the full benefit from the pattern, make all the client code communicate with the subsystem <strong>only via the facade</strong>. Now the client code is protected from any changes in the subsystem code. For example, when a subsystem gets upgraded to a new version, you will only need to modify the code in the facade</p>
</li>
<li>
<p>If the facade becomes <strong>too big</strong>, consider extracting part of its behavior to a new, refined facade class</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="facade-pros-and-cons">Facade: Pros and Cons</h2>
<p><strong>Pros:</strong></p>
<ul>
<li>You can <strong>isolate</strong> your code from the complexity of a subsystem</li>
<li>You provide a <strong>simple</strong> interface to a complex system</li>
<li>You promote <strong>loose coupling</strong> between the client and the subsystem</li>
</ul>
<p><strong>Cons:</strong></p>
<ul>
<li>A facade can become a <strong>god object</strong> coupled to all classes of an app</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="facade-relations-with-other-patterns">Facade: Relations with Other Patterns</h2>
<ul>
<li><strong>Facade</strong> defines a new interface for existing objects, whereas <strong>Adapter</strong> tries to make the existing interface usable. Adapter usually wraps just one object, while Facade works with an entire subsystem of objects</li>
<li><strong>Abstract Factory</strong> can serve as an alternative to <strong>Facade</strong> when you only want to hide the way the subsystem objects are created from the client code</li>
<li><strong>Flyweight</strong> shows how to make lots of little objects, whereas <strong>Facade</strong> shows how to make a single object that represents an entire subsystem</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="facade-relations-with-other-patterns-cont">Facade: Relations with Other Patterns (cont.)</h2>
<ul>
<li><strong>Facade</strong> and <strong>Mediator</strong> have similar jobs: they try to organize collaboration between lots of tightly coupled classes. Facade defines a simplified interface to a subsystem of objects, but it does not introduce any new functionality. The subsystem itself is unaware of the facade. Mediator centralizes communication between components of the system. The components only know about the mediator object</li>
<li>A <strong>Facade</strong> class can often be transformed into a <strong>Singleton</strong> since a single facade object is sufficient in most cases</li>
<li><strong>Facade</strong> is similar to <strong>Proxy</strong> in that both buffer a complex entity and initialize it on its own. Unlike Facade, Proxy has the same interface as its service object, which makes them interchangeable</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-f-takeaway">Module F: Takeaway</h2>
<ul>
<li>The Facade pattern provides a <strong>simplified interface</strong> to a complex subsystem</li>
<li>It does <strong>not add new functionality</strong> but makes existing functionality easier to access</li>
<li>It promotes <strong>loose coupling</strong> between client code and subsystem classes</li>
<li>It is useful when integrating with <strong>complex libraries</strong> or <strong>legacy systems</strong></li>
<li>Be careful not to let the facade become a <strong>god object</strong></li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="flyweight-intent">Flyweight: Intent</h2>
<p><strong>Flyweight</strong> is a structural design pattern that lets you fit more objects into the available amount of <strong>RAM</strong> by sharing common parts of state between multiple objects instead of keeping all of the data in each object.</p>
<ul>
<li>Also known as: <strong>Cache</strong></li>
</ul>
<p>Source: <a href="https://refactoring.guru/design-patterns/flyweight">refactoring.guru</a></p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="flyweight-problem">Flyweight: Problem</h2>
<p>To have some fun after long working hours, you decide to create a simple video game: players would be moving around a map and shooting each other. You implement a realistic <strong>particle system</strong> as one of its features. Vast quantities of bullets, missiles, and shrapnel from explosions should fly all over the map and deliver a thrilling experience.</p>
<p>Upon finishing, you push the last commit, build the game and send it to a friend for testing. Although the game runs flawlessly on your machine, your friend was not able to play for long. On his computer, the game kept <strong>crashing</strong> after a few minutes of gameplay.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="137" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="137" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="187">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="flyweight-problem-cont">Flyweight: Problem (cont.)</h2>
<p>After spending several hours digging through debug logs, you discover that the game crashed because of an <strong>insufficient amount of RAM</strong>. It turns out that your friend's computer is much less powerful than yours, and that is why the problem appeared so quickly on his machine.</p>
<p>The actual problem was related to the particle system. Each particle, such as a bullet, a missile or a piece of shrapnel, was represented by a separate object containing plenty of data. At some point, when the carnage on a player's screen reached its climax, newly created particles no longer fit into the remaining RAM, so the program crashed.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="138" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="138" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10;--theme:default;--style:img[alt~=&quot;center&quot;] {

;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="187">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="flyweight-problem-cont-1">Flyweight: Problem (cont.)</h2>
<p>Each particle object contains:</p>
<ul>
<li><strong>Color</strong> (same for all bullets)</li>
<li><strong>Sprite/texture</strong> (same for all bullets)</li>
<li><strong>Coordinates</strong> (unique per particle)</li>
<li><strong>Direction vector</strong> (unique per particle)</li>
<li><strong>Speed</strong> (unique per particle)</li>
</ul>
<p>The color and sprite data is <strong>duplicated</strong> across thousands of particles, wasting enormous amounts of memory.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="139" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

}
" data-lang="en-US" lang="en-US" data-marpit-pagination="139" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10;--theme:default;--style:img[alt~=&quot;center&quot;] {

}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="187">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="flyweight-solution---intrinsic-vs-extrinsic-state">Flyweight: Solution - Intrinsic vs. Extrinsic State</h2>
<p>The Flyweight pattern suggests that you stop storing the <strong>extrinsic state</strong> inside the object. Instead, you should pass this state to specific methods which rely on it. Only the <strong>intrinsic state</strong> stays within the object, letting you reuse it in different contexts.</p>
<p><strong>Intrinsic State</strong> -- The constant data of an object. Other objects can only read it, not change it. This data lives within the flyweight object and remains <strong>immutable</strong> after creation.</p>
<ul>
<li>Examples: color, sprite, texture</li>
</ul>
<p><strong>Extrinsic State</strong> -- Contextual data, unique to each object instance, that changes.</p>
<ul>
<li>Examples: coordinates, direction, speed</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="140" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="140" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10;--theme:default;--style:img[alt~=&quot;center&quot;] {

;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="187">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="flyweight-solution-cont">Flyweight: Solution (cont.)</h2>
<p>As a result, you would need <strong>fewer</strong> of these objects since they only differ in the intrinsic state, which has much fewer variations than the extrinsic.</p>
<p>In the particle example, instead of thousands of particle objects with duplicated data, you would have only <strong>three flyweight objects</strong> (bullet, missile, shrapnel), each referenced by many context objects containing unique positional and movement data.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="141" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="187">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="flyweight-immutability-and-factory">Flyweight: Immutability and Factory</h2>
<p><strong>Immutability Requirement:</strong></p>
<ul>
<li>Since the same flyweight object can be used in different contexts, you must make sure that its state <strong>cannot be modified</strong></li>
<li>A flyweight should initialize its state just once, via <strong>constructor parameters</strong></li>
<li>It should not expose any setters or public fields to other objects</li>
</ul>
<p><strong>Factory Pattern Integration:</strong></p>
<ul>
<li>To simplify access to various flyweights, create a <strong>factory method</strong> that manages a pool of existing flyweight objects</li>
<li>The factory accepts the intrinsic state of the desired flyweight, searches for an existing flyweight matching this state, and returns it if found. If not, it creates a new flyweight and adds it to the pool</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="142" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

<header>CEN206 Object-Oriented Programming</header>
<h2 id="flyweight-structure">Flyweight: Structure</h2>
<ol>
<li>
<p><strong>Flyweight</strong> -- Contains the portion of the original object's state that can be shared between multiple objects (intrinsic state). The same flyweight object can be used in many different contexts. The state stored inside a flyweight is called intrinsic. The state passed to the flyweight's methods is called extrinsic</p>
</li>
<li>
<p><strong>Context</strong> -- Contains the extrinsic state, unique across all original objects. When a context is paired with one of the flyweight objects, it represents the full state of the original object</p>
</li>
<li>
<p><strong>Flyweight Factory</strong> -- Manages a pool of existing flyweights. With the factory, clients do not create flyweights directly. Instead, they call the factory, passing bits of the intrinsic state of the desired flyweight. The factory looks over previously created flyweights and either returns an existing one or creates a new one</p>
</li>
<li>
<p><strong>Client</strong> -- Calculates or stores the extrinsic state of flyweights. From the client's perspective, a flyweight is a template object which can be configured at runtime by passing some contextual data into parameters of its methods</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="flyweight-java-code-example---flyweight-class">Flyweight: Java Code Example - Flyweight Class</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.awt.*;

<span class="hljs-comment">// The flyweight class contains a portion of the state of a</span>
<span class="hljs-comment">// tree. These fields store values that are unique for each</span>
<span class="hljs-comment">// particular tree type. You will not find here the tree</span>
<span class="hljs-comment">// coordinates. But the texture and colors shared between</span>
<span class="hljs-comment">// many trees are here. Since this data is usually BIG, you</span>
<span class="hljs-comment">// would waste a lot of memory by keeping it in each tree</span>
<span class="hljs-comment">// object. Instead, we extract texture, color, and other</span>
<span class="hljs-comment">// repeating data into a separate object (TreeType).</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">TreeType</span> {
    <span class="hljs-keyword">private</span> String name;
    <span class="hljs-keyword">private</span> Color color;
    <span class="hljs-keyword">private</span> String texture;

    <span class="hljs-keyword">public</span> <span class="hljs-title function_">TreeType</span><span class="hljs-params">(String name, Color color, String texture)</span> {
        <span class="hljs-built_in">this</span>.name = name;
        <span class="hljs-built_in">this</span>.color = color;
        <span class="hljs-built_in">this</span>.texture = texture;
    }

    <span class="hljs-keyword">public</span> String <span class="hljs-title function_">getName</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> name; }
    <span class="hljs-keyword">public</span> Color <span class="hljs-title function_">getColor</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> color; }
    <span class="hljs-keyword">public</span> String <span class="hljs-title function_">getTexture</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> texture; }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">draw</span><span class="hljs-params">(Graphics g, <span class="hljs-type">int</span> x, <span class="hljs-type">int</span> y)</span> {
        <span class="hljs-comment">// Draw the tree on canvas at position (x, y)</span>
        g.setColor(Color.BLACK);
        g.fillRect(x - <span class="hljs-number">1</span>, y, <span class="hljs-number">3</span>, <span class="hljs-number">5</span>);
        g.setColor(color);
        g.fillOval(x - <span class="hljs-number">5</span>, y - <span class="hljs-number">10</span>, <span class="hljs-number">10</span>, <span class="hljs-number">10</span>);
    }
}
</code></pre>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="flyweight-java-code-example---flyweight-factory">Flyweight: Java Code Example - Flyweight Factory</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.awt.*;
<span class="hljs-keyword">import</span> java.util.ArrayList;
<span class="hljs-keyword">import</span> java.util.List;

<span class="hljs-comment">// The flyweight factory decides whether to reuse existing</span>
<span class="hljs-comment">// flyweight or to create a new object.</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">TreeFactory</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">static</span> List&lt;TreeType&gt; treeTypes = <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;&gt;();

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> TreeType <span class="hljs-title function_">getTreeType</span><span class="hljs-params">(String name,
                                        Color color,
                                        String texture)</span> {
        <span class="hljs-keyword">for</span> (TreeType type : treeTypes) {
            <span class="hljs-keyword">if</span> (type.getName().equals(name) &amp;&amp;
                type.getColor().equals(color) &amp;&amp;
                type.getTexture().equals(texture)) {
                <span class="hljs-keyword">return</span> type;
            }
        }
        <span class="hljs-type">TreeType</span> <span class="hljs-variable">type</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">TreeType</span>(name, color, texture);
        treeTypes.add(type);
        <span class="hljs-keyword">return</span> type;
    }
}
</code></pre>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="flyweight-java-code-example---context-class">Flyweight: Java Code Example - Context Class</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.awt.*;

<span class="hljs-comment">// The context object contains the extrinsic part of the</span>
<span class="hljs-comment">// tree state. An application can create billions of these</span>
<span class="hljs-comment">// since they are pretty small: just two integer coordinates</span>
<span class="hljs-comment">// and one reference field.</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Tree</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-type">int</span> x;

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.awt.*;

<span class="hljs-keyword">import</span> javax.swing.*;

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Forest</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">JFrame</span> {
    <span class="hljs-keyword">private</span> List&lt;Tree&gt; trees = <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;&gt;();

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">plantTree</span><span class="hljs-params">(<span class="hljs-type">int</span> x, <span class="hljs-type">int</span> y, String name,

        <span class="hljs-type">TreeType</span> <span class="hljs-variable">type</span> <span class="hljs-operator">=</span> TreeFactory.getTreeType(

        <span class="hljs-type">Tree</span> <span class="hljs-variable">tree</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Tree</span>(x, y, type);
        trees.add(tree);
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">paint</span><span class="hljs-params">(Graphics g)</span> {
        <span class="hljs-keyword">for</span> (Tree tree : trees) {

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {

        <span class="hljs-comment">// Plant 1,000,000 trees but only a few TreeType</span>
        <span class="hljs-comment">// flyweight objects are created</span>
        <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> <span class="hljs-variable">i</span> <span class="hljs-operator">=</span> <span class="hljs-number">0</span>; i &lt; <span class="hljs-number">1000000</span>; i++) {
            forest.plantTree(

        <span class="hljs-comment">// rendered using only a few shared TreeType flyweight objects.</span>

}

<header>CEN206 Object-Oriented Programming</header>
<h2 id="flyweight-applicability">Flyweight: Applicability</h2>
<p>Use the Flyweight pattern <strong>only</strong> when your program must support a huge number of objects which barely fit into available RAM.</p>
<p>The benefit of applying the pattern depends heavily on how and where it is used. It is most useful when:</p>
<ul>
<li>An application needs to spawn a <strong>massive number</strong> of similar objects</li>
<li>This drains all available RAM on a target device</li>
<li>The objects contain <strong>duplicate state</strong> which can be extracted and shared between multiple objects</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="flyweight-applicability-cont">Flyweight: Applicability (cont.)</h2>
<p><strong>Important:</strong> The Flyweight pattern is merely an <strong>optimization</strong>. Before applying it, make sure your program does have the RAM consumption problem related to having a massive number of similar objects in memory at the same time. Make sure that this problem cannot be solved in any other meaningful way.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="flyweight-how-to-implement">Flyweight: How to Implement</h2>
<ol>
<li>
<p>Divide fields of a class that will become a flyweight into two parts:</p>
<ul>
<li>The <strong>intrinsic state</strong>: fields that contain unchanging data duplicated across many objects</li>
<li>The <strong>extrinsic state</strong>: fields that contain contextual data unique to each object</li>
</ul>
</li>
<li>
<p>Leave the fields that represent the <strong>intrinsic state</strong> in the class, but make sure they are immutable. They should take their initial values only inside the <strong>constructor</strong></p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="flyweight-how-to-implement-cont">Flyweight: How to Implement (cont.)</h2>
<ol start="3">
<li>
<p>Go over methods that use fields of the <strong>extrinsic state</strong>. For each field used in the method, introduce a new <strong>parameter</strong> and use it instead of the field</p>
</li>
<li>
<p>Optionally, create a <strong>factory class</strong> to manage the pool of flyweights. It should check for an existing flyweight before creating a new one. Once the factory is in place, clients must only request flyweights through it, passing the intrinsic state to the factory</p>
</li>
<li>
<p>The client must store or calculate values of the <strong>extrinsic state</strong> (context) to be able to call methods of flyweight objects. For convenience, the extrinsic state along with the flyweight-referencing field may be moved to a separate <strong>context class</strong></p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="flyweight-pros-and-cons">Flyweight: Pros and Cons</h2>
<p><strong>Pros:</strong></p>
<ul>
<li>You can save lots of <strong>RAM</strong>, assuming your program has tons of similar objects</li>
<li>Reduced memory footprint through state sharing</li>
</ul>
<p><strong>Cons:</strong></p>
<ul>
<li>You might be trading <strong>RAM over CPU cycles</strong> when some of the context data needs to be recalculated each time somebody calls a flyweight method</li>
<li>The code becomes much <strong>more complicated</strong>. New team members will always be wondering why the state of an entity was separated in such a way</li>
<li><strong>Thread safety</strong> issues may arise from shared mutable references if not properly synchronized</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="flyweight-relations-with-other-patterns">Flyweight: Relations with Other Patterns</h2>
<ul>
<li>You can implement shared leaf nodes of the <strong>Composite</strong> tree as <strong>Flyweights</strong> to save RAM</li>
<li><strong>Flyweight</strong> shows how to make lots of little objects, whereas <strong>Facade</strong> shows how to make a single object that represents an entire subsystem</li>
<li><strong>Flyweight</strong> would resemble <strong>Singleton</strong> if you somehow managed to reduce all shared states of the objects to just one flyweight object. But there are two fundamental differences:
<ul>
<li>There should be only one Singleton instance, whereas a Flyweight class can have <strong>multiple instances</strong> with different intrinsic states</li>
<li>The Singleton object can be <strong>mutable</strong>. Flyweight objects are <strong>immutable</strong></li>
</ul>
</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-g-takeaway">Module G: Takeaway</h2>
<ul>
<li>The Flyweight pattern <strong>shares common state</strong> between many objects to save memory</li>
<li>Distinguish between <strong>intrinsic</strong> (shared, immutable) and <strong>extrinsic</strong> (unique, contextual) state</li>
<li>Use a <strong>factory</strong> to manage the pool of flyweight objects</li>
<li>Apply it only when you genuinely have a <strong>memory problem</strong> with many similar objects</li>
<li>It is an <strong>optimization pattern</strong> -- do not use it prematurely</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>

;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="187">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="proxy-intent">Proxy: Intent</h2>
<p><strong>Proxy</strong> is a structural design pattern that lets you provide a <strong>substitute or placeholder</strong> for another object. A proxy controls access to the original object, allowing you to perform something either before or after the request gets through to the original object.</p>
<p>Source: <a href="https://refactoring.guru/design-patterns/proxy">refactoring.guru</a></p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="159" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="159" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10;--theme:default;--style:img[alt~=&quot;center&quot;] {

  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="187">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="proxy-problem">Proxy: Problem</h2>
<p>Why would you want to control access to an object? Here is an example: you have a massive object that consumes a vast amount of system resources. You need it from time to time, but not always.</p>
<p>You could implement <strong>lazy initialization</strong>: create this object only when it is actually needed. All of the object's clients would need to execute some deferred initialization code. Unfortunately, this would probably cause a lot of <strong>code duplication</strong>.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="160" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="160" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="187">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="proxy-problem-cont">Proxy: Problem (cont.)</h2>
<p>In an ideal world, we would want to put this code directly into our object's class, but that is not always possible. For instance, the class may be part of a closed <strong>third-party library</strong>.</p>
<p>We need a way to control access to the object without modifying the object's class or duplicating initialization logic across all clients.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="161" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="161" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="187">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="proxy-solution">Proxy: Solution</h2>
<p>The Proxy pattern suggests that you create a new proxy class with the <strong>same interface</strong> as an original service object. Then you update your app so that it passes the proxy object to all of the original object's clients.</p>
<p>Upon receiving a request from a client, the proxy creates a real service object and <strong>delegates</strong> all the work to it.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="162" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

}
" data-lang="en-US" lang="en-US" data-marpit-pagination="162" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10;--theme:default;--style:img[alt~=&quot;center&quot;] {

}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="187">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="proxy-solution-cont">Proxy: Solution (cont.)</h2>
<p>But what is the benefit? If you need to execute something either before or after the primary logic of the class, the proxy lets you do this <strong>without changing that class</strong>. Since the proxy implements the same interface as the original class, it can be passed to any client that expects a real service object.</p>
<p>The proxy can handle:</p>
<ul>
<li><strong>Lazy initialization</strong> of the real object</li>
<li><strong>Caching</strong> of results</li>
<li><strong>Access control</strong> and authorization</li>
<li><strong>Logging</strong> of requests</li>
<li><strong>Resource management</strong> and cleanup</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="163" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

<header>CEN206 Object-Oriented Programming</header>
<h2 id="proxy-real-world-analogy">Proxy: Real-World Analogy</h2>
<p>A <strong>credit card</strong> is a proxy for a bank account, which is a proxy for a bundle of cash. Both implement the same interface: they can be used to make a payment.</p>
<p>A consumer feels great because there is no need to carry loads of cash around. A shop owner is also happy since the income from a transaction gets added electronically to the shop's bank account without the risk of losing the deposit or getting robbed on the way to the bank.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="proxy-structure">Proxy: Structure</h2>
<ol>
<li>
<p><strong>Service Interface</strong> -- Declares the interface of the Service. The proxy must follow this interface to be able to disguise itself as a service object</p>
</li>
<li>
<p><strong>Service</strong> -- A class that provides some useful business logic</p>
</li>
<li>
<p><strong>Proxy</strong> -- The proxy class has a reference field that points to a service object. After the proxy finishes its processing (e.g., lazy initialization, logging, access control, caching, etc.), it passes the request to the service object. Usually, proxies manage the full lifecycle of their service objects</p>
</li>
<li>
<p><strong>Client</strong> -- Should work with both services and proxies via the same interface. This way you can pass a proxy into any code that expects a service object</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="proxy-types-of-proxies">Proxy: Types of Proxies</h2>
<ul>
<li><strong>Virtual Proxy (Lazy Initialization)</strong> -- Delays the creation of a heavyweight service object until it is actually needed</li>
<li><strong>Protection Proxy (Access Control)</strong> -- Only passes requests to the service object if the client's credentials meet certain criteria</li>
<li><strong>Remote Proxy</strong> -- The proxy passes the client request over the network, handling all of the details of working with the network</li>
<li><strong>Logging Proxy</strong> -- The proxy can log each request before passing it to the service</li>
<li><strong>Caching Proxy</strong> -- The proxy caches results of client requests and manages the life cycle of this cache, especially if results are quite large</li>
<li><strong>Smart Reference</strong> -- The proxy can track whether the client has obtained a reference to the service object and dismiss the service when no clients use it</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="proxy-java-code-example---service">Proxy: Java Code Example - Service</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.util.*;

<span class="hljs-comment">// The concrete implementation of a service connector.</span>
<span class="hljs-comment">// Methods of this class can request information from</span>
<span class="hljs-comment">// YouTube. The speed of the request depends on a user&#x27;s</span>
<span class="hljs-comment">// internet connection as well as YouTube&#x27;s. The</span>
<span class="hljs-comment">// application will slow down if a lot of requests are</span>
<span class="hljs-comment">// fired at the same time, even if they all request the</span>
<span class="hljs-comment">// same information.</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ThirdPartyYouTubeClass</span>
        <span class="hljs-keyword">implements</span> <span class="hljs-title class_">ThirdPartyYouTubeLib</span> {

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> List&lt;Video&gt; <span class="hljs-title function_">listVideos</span><span class="hljs-params">()</span> {
        <span class="hljs-comment">// Send an API request to YouTube.</span>
        System.out.println(<span class="hljs-string">&quot;Downloading video list from &quot;</span> +
            <span class="hljs-string">&quot;YouTube API...&quot;</span>);
        <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;&gt;(); <span class="hljs-comment">// Simplified</span>
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> Video <span class="hljs-title function_">getVideoInfo</span><span class="hljs-params">(String id)</span> {
        <span class="hljs-comment">// Get metadata about some video.</span>
        System.out.println(<span class="hljs-string">&quot;Downloading info for video: &quot;</span> +
            id);

<header>CEN206 Object-Oriented Programming</header>
<h2 id="proxy-java-code-example---proxy-caching">Proxy: Java Code Example - Proxy (Caching)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.util.*;

<span class="hljs-comment">// To save some bandwidth, we can cache request results</span>
<span class="hljs-comment">// and keep them for some time. But it may be impossible</span>
<span class="hljs-comment">// to put such code directly into the service class. For</span>
<span class="hljs-comment">// example, it could have been provided as part of a</span>
<span class="hljs-comment">// third party library and/or defined as final.</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">CachedYouTubeClass</span>
        <span class="hljs-keyword">implements</span> <span class="hljs-title class_">ThirdPartyYouTubeLib</span> {

    <span class="hljs-keyword">private</span> ThirdPartyYouTubeLib service;
    <span class="hljs-keyword">private</span> List&lt;Video&gt; listCache = <span class="hljs-literal">null</span>;
    <span class="hljs-keyword">private</span> Map&lt;String, Video&gt; videoCache = <span class="hljs-keyword">new</span> <span class="hljs-title class_">HashMap</span>&lt;&gt;();
    <span class="hljs-keyword">private</span> <span class="hljs-type">boolean</span> <span class="hljs-variable">needReset</span> <span class="hljs-operator">=</span> <span class="hljs-literal">false</span>;

    <span class="hljs-keyword">public</span> <span class="hljs-title function_">CachedYouTubeClass</span><span class="hljs-params">(ThirdPartyYouTubeLib service)</span> {
        <span class="hljs-built_in">this</span>.service = service;
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> List&lt;Video&gt; <span class="hljs-title function_">listVideos</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">if</span> (listCache == <span class="hljs-literal">null</span> || needReset) {
            listCache = service.listVideos();
            needReset = <span class="hljs-literal">false</span>;
        }
        <span class="hljs-keyword">return</span> listCache;
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> Video <span class="hljs-title function_">getVideoInfo</span><span class="hljs-params">(String id)</span> {
        <span class="hljs-keyword">if</span> (!videoCache.containsKey(id) || needReset) {
            videoCache.put(id, service.getVideoInfo(id));
        }
        <span class="hljs-keyword">return</span> videoCache.get(id);
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">downloadVideo</span><span class="hljs-params">(String id)</span> {
        service.downloadVideo(id);
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">reset</span><span class="hljs-params">()</span> {
        needReset = <span class="hljs-literal">true</span>;
    }
}
</code></pre>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="proxy-java-code-example---manager-class">Proxy: Java Code Example - Manager Class</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.util.List;

<span class="hljs-comment">// The GUI class, which used to work directly with a</span>
<span class="hljs-comment">// service object, stays unchanged as long as it works</span>
<span class="hljs-comment">// with the service object through an interface. We can</span>
<span class="hljs-comment">// safely pass a proxy object instead of a real service</span>
<span class="hljs-comment">// object since they both implement the same interface.</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">YouTubeManager</span> {
    <span class="hljs-keyword">private</span> ThirdPartyYouTubeLib service;

    <span class="hljs-keyword">public</span> <span class="hljs-title function_">YouTubeManager</span><span class="hljs-params">(ThirdPartyYouTubeLib service)</span> {
        <span class="hljs-built_in">this</span>.service = service;
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">renderVideoPage</span><span class="hljs-params">(String id)</span> {
        <span class="hljs-type">Video</span> <span class="hljs-variable">info</span> <span class="hljs-operator">=</span> service.getVideoInfo(id);
        System.out.println(<span class="hljs-string">&quot;Rendering video page: &quot;</span> +
            info.getTitle());
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">renderListPanel</span><span class="hljs-params">()</span> {
        List&lt;Video&gt; list = service.listVideos();
        System.out.println(<span class="hljs-string">&quot;Rendering video list: &quot;</span> +
            list.size() + <span class="hljs-string">&quot; videos&quot;</span>);
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">reactOnUserInput</span><span class="hljs-params">(String id)</span> {
        renderListPanel();
        renderVideoPage(id);
    }
}
</code></pre>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="proxy-java-code-example---client">Proxy: Java Code Example - Client</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ProxyDemo</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
        <span class="hljs-comment">// Create the real service</span>
        <span class="hljs-type">ThirdPartyYouTubeLib</span> <span class="hljs-variable">youtubeService</span> <span class="hljs-operator">=</span>
            <span class="hljs-keyword">new</span> <span class="hljs-title class_">ThirdPartyYouTubeClass</span>();

        <span class="hljs-comment">// Create the caching proxy</span>
        <span class="hljs-type">ThirdPartyYouTubeLib</span> <span class="hljs-variable">youtubeProxy</span> <span class="hljs-operator">=</span>
            <span class="hljs-keyword">new</span> <span class="hljs-title class_">CachedYouTubeClass</span>(youtubeService);

        <span class="hljs-comment">// The manager works through the interface,</span>
        <span class="hljs-comment">// so it does not know if it is using the real</span>
        <span class="hljs-comment">// service or the proxy</span>
        <span class="hljs-type">YouTubeManager</span> <span class="hljs-variable">manager</span> <span class="hljs-operator">=</span>
            <span class="hljs-keyword">new</span> <span class="hljs-title class_">YouTubeManager</span>(youtubeProxy);

        <span class="hljs-comment">// First call - fetches from the real service</span>
        manager.reactOnUserInput(<span class="hljs-string">&quot;video123&quot;</span>);

        <span class="hljs-comment">// Second call - uses cached data</span>
        manager.reactOnUserInput(<span class="hljs-string">&quot;video123&quot;</span>);

        <span class="hljs-comment">// Expected Output:</span>
        <span class="hljs-comment">// Rendering video list: ... videos</span>
        <span class="hljs-comment">// Rendering video page: video123</span>
        <span class="hljs-comment">// Rendering video list: ... videos  (served from cache)</span>
        <span class="hljs-comment">// Rendering video page: video123    (served from cache)</span>
    }
}
</code></pre>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="proxy-applicability">Proxy: Applicability</h2>
<p>There are dozens of ways to utilize the Proxy pattern. Here are the most common:</p>
<ul>
<li><strong>Lazy initialization (virtual proxy)</strong>: When you have a heavyweight service object that wastes system resources by being always up, even though you only need it from time to time. Instead of creating the object when the app launches, you can delay the object's initialization to a time when it is actually needed</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="175" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="175" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="187">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="proxy-applicability-cont">Proxy: Applicability (cont.)</h2>
<ul>
<li>
<p><strong>Access control (protection proxy)</strong>: When you want only specific clients to be able to use the service object; for instance, when your objects are crucial parts of an operating system and clients are various launched applications (including malicious ones)</p>
</li>
<li>
<p><strong>Local execution of a remote service (remote proxy)</strong>: When the service object is located on a remote server. In this case, the proxy passes the client request over the network, handling all of the nasty details of working with the network</p>
</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="176" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

" data-lang="en-US" lang="en-US" data-marpit-pagination="176" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-10;--theme:default;--style:img[alt~=&quot;center&quot;] {

}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="187">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="proxy-applicability-cont-1">Proxy: Applicability (cont.)</h2>
<ul>
<li>
<p><strong>Logging requests (logging proxy)</strong>: When you want to keep a history of requests to the service object. The proxy can log each request before passing it to the service</p>
</li>
<li>
<p><strong>Caching request results (caching proxy)</strong>: When you need to cache results of client requests and manage the life cycle of this cache, especially if results are quite large. The proxy can implement caching for recurring requests that always yield the same results</p>
</li>
<li>
<p><strong>Smart reference</strong>: When you need to be able to dismiss a heavyweight object once there are no clients that use it. The proxy can keep track of clients that obtained a reference to the service object or its results. From time to time, the proxy may go over the clients and check whether they are still active. If the client list gets empty, the proxy might dismiss the service object and free the underlying system resources</p>
</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="proxy-how-to-implement">Proxy: How to Implement</h2>
<ol>
<li>
<p>If there is no pre-existing <strong>service interface</strong>, create one to make proxy and service objects interchangeable. Extracting the interface from the service class is not always possible, because you would need to change all of the service's clients to use that interface. An alternative is to make the proxy a <strong>subclass</strong> of the service class</p>
</li>
<li>
<p>Create the <strong>proxy class</strong>. It should have a field for storing a reference to the service. Usually, proxies create and manage the whole life cycle of their services. On rare occasions, a service is passed to the proxy via a constructor by the client</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="proxy-how-to-implement-cont">Proxy: How to Implement (cont.)</h2>
<ol start="3">
<li>
<p>Implement the <strong>proxy methods</strong> according to their purposes. In most cases, after doing some work, the proxy should delegate the work to the service object</p>
</li>
<li>
<p>Consider introducing a <strong>creation method</strong> that decides whether the client gets a proxy or a real service. This can be a simple static method in the proxy class or a full-blown factory method</p>
</li>
<li>
<p>Consider implementing <strong>lazy initialization</strong> for the service object</p>
</li>
</ol>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="proxy-pros-and-cons">Proxy: Pros and Cons</h2>
<p><strong>Pros:</strong></p>
<ul>
<li>You can control the service object <strong>without clients knowing</strong> about it</li>
<li>You can manage the <strong>lifecycle</strong> of the service object when clients do not care about it</li>
<li>The proxy works even if the <strong>service object is not ready</strong> or is not available</li>
<li><strong>Open/Closed Principle</strong>: You can introduce new proxies without changing the service or clients</li>
</ul>
<p><strong>Cons:</strong></p>
<ul>
<li>The code may become <strong>more complicated</strong> since you need to introduce a lot of new classes</li>
<li>The response from the service might get <strong>delayed</strong></li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="proxy-relations-with-other-patterns">Proxy: Relations with Other Patterns</h2>
<ul>
<li><strong>Adapter</strong> provides a different interface to the wrapped object, <strong>Proxy</strong> provides it with the same interface, and <strong>Decorator</strong> provides it with an enhanced interface</li>
<li><strong>Facade</strong> is similar to <strong>Proxy</strong> in that both buffer a complex entity and initialize it on its own. Unlike Facade, Proxy has the same interface as its service object, which makes them interchangeable</li>
<li><strong>Decorator</strong> and <strong>Proxy</strong> have similar structures, but very different intents. Both patterns are built on the composition principle, where one object is supposed to delegate some of the work to another. The difference is that a Proxy usually manages the lifecycle of its service object on its own, whereas the composition of Decorators is always controlled by the client</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-h-takeaway">Module H: Takeaway</h2>
<ul>
<li>The Proxy pattern provides a <strong>substitute or placeholder</strong> for another object</li>
<li>It controls access and adds behavior <strong>without modifying</strong> the original service</li>
<li>There are many types: <strong>virtual, protection, remote, logging, caching, smart reference</strong></li>
<li>It follows the <strong>Open/Closed Principle</strong> by allowing new proxies without changing existing code</li>
<li>It is similar to Decorator in structure but different in <strong>intent and lifecycle management</strong></li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="summary-structural-design-patterns-comparison">Summary: Structural Design Patterns Comparison</h2>
<table>
<thead>
<tr>
<th>Pattern</th>
<th>Key Idea</th>
<th>Typical Use</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Adapter</strong></td>
<td>Convert interface</td>
<td>Legacy/third-party integration</td>
</tr>
<tr>
<td><strong>Bridge</strong></td>
<td>Separate abstraction/impl</td>
<td>Multi-dimensional hierarchies</td>
</tr>
<tr>
<td><strong>Composite</strong></td>
<td>Tree structure</td>
<td>Part-whole hierarchies</td>
</tr>
<tr>
<td><strong>Decorator</strong></td>
<td>Add behavior dynamically</td>
<td>Layered behaviors</td>
</tr>
<tr>
<td><strong>Facade</strong></td>
<td>Simplify interface</td>
<td>Complex subsystem access</td>
</tr>
<tr>
<td><strong>Flyweight</strong></td>
<td>Share state</td>
<td>Memory optimization</td>
</tr>
<tr>
<td><strong>Proxy</strong></td>
<td>Control access</td>
<td>Lazy init, caching, security</td>
</tr>
</tbody>
</table>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="structural-patterns-key-relationships">Structural Patterns: Key Relationships</h2>
<ul>
<li><strong>Adapter</strong> vs <strong>Bridge</strong>: Adapter retrofits, Bridge designs up-front</li>
<li><strong>Composite</strong> vs <strong>Decorator</strong>: Both use recursive composition, but for different purposes</li>
<li><strong>Decorator</strong> vs <strong>Proxy</strong>: Similar structures, different lifecycle management</li>
<li><strong>Facade</strong> vs <strong>Adapter</strong>: Facade simplifies a subsystem, Adapter wraps a single object</li>
<li><strong>Flyweight</strong> vs <strong>Singleton</strong>: Flyweight has multiple shared instances, Singleton has one mutable instance</li>
<li><strong>Facade</strong> vs <strong>Mediator</strong>: Both organize collaboration, but Facade does not add functionality</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-10</footer>
