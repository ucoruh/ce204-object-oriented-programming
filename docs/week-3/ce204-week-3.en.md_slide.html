<header>CEN206 Object-Oriented Programming</header>
<h3 id="defining-an-interface-in-java-1">Defining an Interface in Java</h3>
<ul>
<li>In java, an interface is similar to a class,
<ul>
<li>but it contains abstract methods and static final variables only.</li>
<li>The interface in Java is another mechanism to achieve abstraction.</li>
</ul>
</li>
<li>We may think of an interface as a completely abstract class.
<ul>
<li>None of the methods in the interface has an implementation,</li>
<li>and all the variables in the interface are constants.</li>
</ul>
</li>
<li>All the methods of an interface,
<ul>
<li>implemented by the class that implements it.</li>
</ul>
</li>
<li>The interface in java enables java to support multiple-inheritance.
<ul>
<li>An interface may extend only one interface,</li>
<li>but a class may implement any number of interfaces.</li>
</ul>
</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-3</footer>

<header>CEN206 Object-Oriented Programming</header>
<h3 id="defining-an-interface-in-java-2">Defining an Interface in Java</h3>
<ul>
<li>
<p>An interface is a container of abstract methods and static final variables.</p>
</li>
<li>
<p>An interface, implemented by a class. (class implements interface).</p>
</li>
<li>
<p>An interface may extend another interface. (Interface extends Interface).</p>
</li>
<li>
<p>An interface never implements another interface, or class.</p>
</li>
<li>
<p>A class may implement any number of interfaces.</p>
</li>
<li>
<p>We can not instantiate an interface.</p>
</li>
<li>
<p>Specifying the keyword abstract for interface methods is optional, it automatically added.</p>
</li>
<li>
<p>All the members of an interface are public by default.</p>
</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-3</footer>

<header>CEN206 Object-Oriented Programming</header>
<h3 id="implementing-an-interface-in-java-1">Implementing an Interface in Java</h3>
<ul>
<li>In java, an interface is implemented by a class.</li>
<li>The class that implements an interface must provide code for all the methods defined in the interface, otherwise,
<ul>
<li>it must be defined as an abstract class.</li>
</ul>
</li>
<li>The class uses a keyword <code>implements</code> to implement an interface.</li>
<li>A class can implement any number of interfaces.</li>
<li>When a class wants to implement more than one interface,
<ul>
<li>we use the implements keyword is followed by a comma-separated list of the interfaces implemented by the class.</li>
</ul>
</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-3</footer>

<header>CEN206 Object-Oriented Programming</header>
<h3 id="variables-in-java-interfaces-1">Variables in Java Interfaces</h3>
<ul>
<li>In java, an interface is a completely abstract class.</li>
<li>An interface is a container of abstract methods and static final variables.</li>
<li>The interface contains the static final variables.</li>
<li>The variables defined in an interface can not be modified by the class that implements the interface,
<ul>
<li>but it may use as it defined in the interface.</li>
</ul>
</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h3 id="variables-in-java-interfaces-2">Variables in Java Interfaces</h3>
<ul>
<li>
<p>The variable in an interface is public, static, and final by default.</p>
</li>
<li>
<p>If any variable in an interface is defined without public, static, and final keywords then, the compiler automatically adds the same.</p>
</li>
<li>
<p>No access modifier is allowed except the public for interface variables.</p>
</li>
<li>
<p>Every variable of an interface must be initialized in the interface itself.</p>
</li>
<li>
<p>The class that implements an interface can not modify the interface variable, but it may use as it defined in the interface.</p>
</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h3 id="extending-an-interface-in-java-1">Extending an Interface in java</h3>
<ul>
<li>In java, an interface can extend another interface.
<ul>
<li>When an interface wants to extend another interface,
<ul>
<li>it uses the keyword extends.</li>
</ul>
</li>
</ul>
</li>
<li>The interface that extends another interface has its own members and all the members defined in its parent interface too.</li>
<li>The class which implements a child interface needs to provide code for the methods defined in both child and parent interfaces,
<ul>
<li>otherwise, it needs to be defined as abstract class.</li>
</ul>
</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-3</footer>

<h3 id="extending-an-interface-in-java-2">Extending an Interface in Java</h3>
<ul>
<li>
<p>An interface can extend another interface.</p>
</li>
<li>
<p>An interface can not extend multiple interfaces.</p>
</li>
<li>
<p>An interface can implement neither an interface nor a class.</p>
</li>
<li>
<p>The class that implements child interface needs to provide code for all the methods defined in both child and parent interfaces.</p>
</li>

<h3 id="advantages-of-interface-in-java-2">Advantages of Interface in Java</h3>
<ul>
<li><strong>Interfaces provide specifications that a class (which implements it) must follow.</strong>
<ul>
<li>In our previous example, we have used getArea() as a specification inside the interface Polygon. This is like setting a rule that we should be able to get the area of every polygon.</li>
</ul>
</li>
<li>Now any class that implements the Polygon interface must provide an implementation for the getArea() method.</li>

<header>CEN206 Object-Oriented Programming</header>
<h3 id="why-default-methods-in-java-interfaces">why default methods in Java Interfaces</h3>
<ul>
<li>Let's take a scenario to understand why default methods are introduced in Java.</li>
<li>Suppose, we need to add a new method in an interface.</li>
<li>We can add the method in our interface easily without implementation. However, that's not the end of the story. All our classes that implement that interface must provide an implementation for the method.</li>
<li>If a large number of classes were implementing this interface, we need to track all these classes and make changes to them. This is not only tedious but error-prone as well.</li>
<li>To resolve this, Java introduced default methods. Default methods are inherited like ordinary methods.</li>
</ul>

   Triangle(<span class="hljs-type">int</span> a, <span class="hljs-type">int</span> b, <span class="hljs-type">int</span> c) {

<header>CEN206 Object-Oriented Programming</header>
<h3 id="abstract-class-vs-interface-comparison">Abstract Class vs Interface: Comparison</h3>
<table>
<thead>
<tr>
<th>Feature</th>
<th>Abstract Class</th>
<th>Interface</th>
</tr>
</thead>
<tbody>
<tr>
<td>Methods</td>
<td>Abstract + concrete</td>
<td>Abstract + default + static + private</td>
</tr>
<tr>
<td>Fields</td>
<td>Any type</td>
<td>Only public static final</td>
</tr>
<tr>
<td>Constructor</td>
<td>Yes</td>
<td>No</td>
</tr>
<tr>
<td>Access Modifiers</td>
<td>Any</td>
<td>Public (methods), public static final (fields)</td>
</tr>
<tr>
<td>Multiple Inheritance</td>
<td>No (single extends)</td>
<td>Yes (multiple implements)</td>
</tr>
<tr>
<td>When to Use</td>
<td>Related classes sharing code</td>
<td>Unrelated classes sharing contract</td>
</tr>
</tbody>
</table>

<header>CEN206 Object-Oriented Programming</header>
<h3 id="abstract-class-vs-interface-relationship-types">Abstract Class vs Interface: Relationship Types</h3>
<ul>
<li>
<p><strong>Abstract Class</strong> expresses <strong>is-a</strong> relationship</p>
<ul>
<li>&quot;A Dog <strong>is-a</strong> Animal&quot; -&gt; abstract class Animal</li>
<li>Share common state and behavior among family of classes</li>
</ul>
</li>
<li>
<p><strong>Interface</strong> expresses <strong>can-do</strong> capability</p>
<ul>
<li>&quot;A Dog <strong>can</strong> Swim&quot; -&gt; interface Swimmable</li>
<li>Define a contract that any class can fulfill</li>
</ul>
</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h3 id="abstract-class-vs-interface-the-diamond-problem">Abstract Class vs Interface: The Diamond Problem</h3>
<ul>
<li>Java does NOT allow multiple class inheritance (no diamond problem with classes)</li>
<li>Interfaces CAN have the diamond problem with default methods</li>
<li>Java resolves this by requiring the implementing class to override the conflicting method</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-Java"><span class="hljs-keyword">interface</span> <span class="hljs-title class_">A</span> { <span class="hljs-keyword">default</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">hello</span><span class="hljs-params">()</span> { System.out.println(<span class="hljs-string">&quot;A&quot;</span>); } }
<span class="hljs-keyword">interface</span> <span class="hljs-title class_">B</span> { <span class="hljs-keyword">default</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">hello</span><span class="hljs-params">()</span> { System.out.println(<span class="hljs-string">&quot;B&quot;</span>); } }

<span class="hljs-keyword">class</span> <span class="hljs-title class_">C</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">A</span>, B {
    <span class="hljs-comment">// MUST override hello() to resolve conflict</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">hello</span><span class="hljs-params">()</span> {
        A.<span class="hljs-built_in">super</span>.hello(); <span class="hljs-comment">// explicitly choose A&#x27;s version</span>
    }
}
</code></pre>

<header>CEN206 Object-Oriented Programming</header>
<h3 id="abstract-class-vs-interface-decision-flowchart">Abstract Class vs Interface: Decision Flowchart</h3>
<ul>
<li><strong>Need to share code among closely related classes?</strong> -&gt; Abstract Class</li>
<li><strong>Need to define a contract for unrelated classes?</strong> -&gt; Interface</li>
<li><strong>Need multiple inheritance of type?</strong> -&gt; Interface</li>
<li><strong>Need to define constants?</strong> -&gt; Interface (public static final)</li>
<li><strong>Need non-public members?</strong> -&gt; Abstract Class</li>
<li><strong>Need to maintain state?</strong> -&gt; Abstract Class</li>
<li><strong>Need backward-compatible API extension?</strong> -&gt; Interface (default methods)</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-3</footer>

<h3 id="takeaway-abstract-class-vs-interface">Takeaway: Abstract Class vs Interface</h3>
<ul>
<li>Abstract Class = 'is-a' relationship, Interface = 'can-do' capability</li>
<li>Use abstract class when classes are closely related and share state/behavior</li>
<li>Use interfaces when unrelated classes need to fulfill the same contract</li>
<li>Java resolves diamond problem by requiring explicit override of conflicting default methods</li>
<li>Modern Java: interfaces are more powerful than ever with default, static, and private methods</li>
</ul>

<h3 id="static-nested-class">Static Nested Class</h3>
<ul>
<li>
<p>In Java, we can also define a static class inside another class.</p>
<ul>
<li>Such class is known as static nested class.</li>
<li>Static nested classes are not called static inner classes.</li>
</ul>
</li>
<li>
<p>Unlike inner class, a static nested class cannot access the member variables of the outer class.</p>
<ul>
<li>It is because the static nested class doesn't require you to create an instance of the outer class.</li>
</ul>
</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-Java">OuterClass.<span class="hljs-type">NestedClass</span> <span class="hljs-variable">obj</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">OuterClass</span>.NestedClass();
</code></pre>
<ul>
<li>Here, we are creating an object of the static nested class by simply using the class name of the outer class.</li>
<li>Hence, the outer class cannot be referenced using <code>OuterClass.this</code>.</li>
</ul>

<h3 id="key-points-to-remember">Key Points to Remember</h3>
<ul>
<li>Java treats the inner class as a regular member of a class. They are just like methods and variables declared inside a class.</li>
<li>Since inner classes are members of the outer class, you can apply any access modifiers like private, protected to your inner class which is not possible in normal classes.</li>
<li>Since the nested class is a member of its enclosing outer class, you can use the dot (.) notation to access the nested class and its members.</li>
<li>Using the nested class will make your code more readable and provide better encapsulation.</li>
<li>Non-static nested classes (inner classes) have access to other members of the outer/enclosing class, even if they are declared private.</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h3 id="java-nested-static-class-1">Java Nested Static Class</h3>

<li>we can have a class inside another class in Java. Such classes are known as nested classes. In Java, nested classes are of two types:
<ul>
<li>Nested non-static class (Inner class)</li>
<li>Nested static class.</li>
</ul>
</li>

<header>CEN206 Object-Oriented Programming</header>
<h3 id="java-nested-static-class-2">Java Nested Static Class</h3>
<ul>
<li>We use the keyword static to make our nested class static.
<ul>
<li>Note: In Java, only nested classes are allowed to be static.</li>
</ul>
</li>
<li>Like regular classes, static nested classes can include both static and non-static fields and methods. For example,</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-Java">Class Animal {
   <span class="hljs-keyword">static</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Mammal</span> {
      <span class="hljs-comment">// static and non-static members of Mammal</span>
   }
   <span class="hljs-comment">// members of Animal</span>
} 
</code></pre>
<ul>
<li>Static nested classes are associated with the outer class.
<ul>
<li>To access the static nested class, we don’t need objects of the outer class.</li>
</ul>
</li>
</ul>

         <span class="hljs-comment">// body of the anonymous class</span>
    };
}
</code></pre>

<h3 id="takeaway-nested-static-and-anonymous-classes">Takeaway: Nested, Static and Anonymous Classes</h3>

<li>Inner class (non-static nested): has access to ALL members of the outer class, including private</li>
<li>Static nested class: does NOT have access to non-static members of outer class</li>
<li>Anonymous class: a class without a name, defined and instantiated in one expression</li>
<li>Use inner classes for tightly coupled helper classes</li>
<li>Use anonymous classes for one-time implementations (event handlers, callbacks)</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h3 id="java-enums-1">Java enums</h3>
<ul>
<li>In Java, an enum (short for enumeration) is a type that has a fixed set of constant values. We use the <code>enum</code> keyword to declare enums. For example,</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-Java"><span class="hljs-keyword">enum</span> <span class="hljs-title class_">Size</span> { 
   SMALL, MEDIUM, LARGE, EXTRALARGE 
}
</code></pre>
<ul>
<li>Here, we have created an enum named Size. It contains fixed values <code>SMALL</code>, <code>MEDIUM</code>, <code>LARGE</code>, and <code>EXTRALARGE</code>.</li>
<li>These values inside the braces are called enum constants (values).
<ul>
<li><strong>Note:</strong> The enum constants are usually represented in uppercase.</li>
</ul>
</li>
</ul>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-Java"><span class="hljs-keyword">enum</span> <span class="hljs-title class_">Size</span> {

}
</code></pre>
<ul>
<li>When we create an enum class, the compiler will create instances (objects) of each enum constants.
<ul>
<li>Also, all enum constant is always public static final by default.</li>
</ul>
</li>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-Java"><span class="hljs-keyword">enum</span> <span class="hljs-title class_">Size</span>{

<header>CEN206 Object-Oriented Programming</header>
<h3 id="java-enum-strings-1">Java enum Strings</h3>
<p>In Java, we can get the string representation of enum constants using the toString() method or the name() method. For example,</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-Java"><span class="hljs-keyword">enum</span> <span class="hljs-title class_">Size</span> {
   SMALL, MEDIUM, LARGE, EXTRALARGE
}

<span class="hljs-keyword">class</span> <span class="hljs-title class_">Main</span> {
   <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {

      System.out.println(<span class="hljs-string">&quot;string value of SMALL is &quot;</span> + Size.SMALL.toString());
      System.out.println(<span class="hljs-string">&quot;string value of MEDIUM is &quot;</span> + Size.MEDIUM.name());

   }
}
</code></pre>
<ul>
<li>we have seen the default string representation of an enum constant is the name of the same constant.</li>
</ul>

<h3 id="takeaway-java-enums">Takeaway: Java Enums</h3>
<ul>
<li>Enums define a fixed set of type-safe constants (no more magic numbers or strings)</li>
<li>Enums are implicitly final classes that extend java.lang.Enum</li>
<li>Enums can have fields, methods, and constructors (constructor is always private)</li>
<li>Key methods: ordinal() (position), name() (string name), values() (all constants)</li>
<li>Use enums for: days of week, directions, states, status codes, etc.</li>

<header>CEN206 Object-Oriented Programming</header>
<h3 id="access-protection-in-java-packages">Access protection in java packages</h3>
<ul>
<li>
<p>In java, the access modifiers define the accessibility of the class and its members.</p>
<ul>
<li>For example, private members are accessible within the same class members only. Java has four access modifiers, and they are default, private, protected, and public.</li>
</ul>
</li>
<li>
<p>In java, the package is a container of classes, sub-classes, interfaces, and sub-packages. The class acts as a container of data and methods. So, the access modifier decides the accessibility of class members across the different packages.</p>
</li>
<li>
<p>In java, the accessibility of the members of a class or interface depends on its access specifiers.</p>
</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h3 id="access-protection-in-java-packages-2">Access protection in java packages</h3>
<ul>
<li>
<p>The <strong>public</strong> members can be accessed everywhere.</p>
</li>
<li>
<p>The <strong>private</strong> members can be accessed only inside the same class.</p>
</li>
<li>
<p>The <strong>protected</strong> members are accessible to every child class (same package or other packages).</p>
</li>
<li>
<p>The <strong>default</strong> members are accessible within the same package but not outside the package.</p>
</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h3 id="takeaway-java-wrapper-classes">Takeaway: Java Wrapper Classes</h3>
<ul>
<li>Every primitive type has a corresponding wrapper class (int-&gt;Integer, char-&gt;Character, etc.)</li>
<li>Autoboxing: automatic conversion from primitive to wrapper (int -&gt; Integer)</li>
<li>Unboxing: automatic conversion from wrapper to primitive (Integer -&gt; int)</li>
<li>Wrapper classes are needed for: Collections, generics, null values, utility methods</li>
<li>Wrapper classes are immutable and final</li>
</ul>

<h3 id="java-lambda-expressions-syntax">Java Lambda Expressions Syntax</h3>

<li>The simplest lambda expression contains a single parameter and an expression:</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-Java">parameter -&gt; expression

<header>CEN206 Object-Oriented Programming</header>
<h3 id="java-lambda-expressions-syntax-1">Java Lambda Expressions Syntax</h3>
<ul>
<li>Expressions are limited. They have to immediately return a value, and they cannot contain variables, assignments or statements such as if or for. In order to do more complex operations, a code block can be used with curly braces. If the lambda expression needs to return a value, then the code block should have a return statement.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-Java">(parameter1, parameter2) -&gt; { code block }
</code></pre>

<header>CEN206 Object-Oriented Programming</header>
<h3 id="using-lambda-expressions">Using Lambda Expressions</h3>
<ul>
<li>Use a lamba expression in the ArrayList's forEach() method to print every item in the list</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-Java"><span class="hljs-keyword">import</span> java.util.ArrayList;

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Main</span> {
  <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
    ArrayList&lt;Integer&gt; numbers = <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;Integer&gt;();
    numbers.add(<span class="hljs-number">5</span>);
    numbers.add(<span class="hljs-number">9</span>);
    numbers.add(<span class="hljs-number">8</span>);
    numbers.add(<span class="hljs-number">1</span>);
    numbers.forEach( (n) -&gt; { System.out.println(n); } );
  }
}
</code></pre>

<ul>
<li>Use Java's Consumer interface to store a lambda expression in a variable:</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-Java"><span class="hljs-keyword">import</span> java.util.ArrayList;
<span class="hljs-keyword">import</span> java.util.function.Consumer;

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Main</span> {
  <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
    ArrayList&lt;Integer&gt; numbers = <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;Integer&gt;();
    numbers.add(<span class="hljs-number">5</span>);
    numbers.add(<span class="hljs-number">9</span>);
    numbers.add(<span class="hljs-number">8</span>);
    numbers.add(<span class="hljs-number">1</span>);
    Consumer&lt;Integer&gt; method = (n) -&gt; { System.out.println(n); };
    numbers.forEach( method );
  }
}
</code></pre>

<header>CEN206 Object-Oriented Programming</header>
<h3 id="takeaway-java-lambda-expressions">Takeaway: Java Lambda Expressions</h3>
<ul>
<li>Lambda: concise way to represent an anonymous function (functional interface implementation)</li>
<li>Syntax: (parameters) -&gt; expression  OR  (parameters) -&gt; { statements; }</li>
<li>Lambdas work with functional interfaces (interfaces with exactly one abstract method)</li>
<li>Common functional interfaces: Runnable, Comparator, Predicate, Function</li>
<li>Lambdas enable functional programming style in Java</li>
</ul>
