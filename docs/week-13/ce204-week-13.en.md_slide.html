<h2 id="what-is-refactoring">What is Refactoring?</h2>
<ul>
<li><strong>Refactoring</strong> is a disciplined technique for restructuring an existing body of code, altering its internal structure without changing its external behavior.</li>
<li>Each transformation (called a &quot;refactoring&quot;) does little, but a sequence of transformations can produce a significant restructuring.</li>
<li>The goal is to make code <strong>easier to understand</strong>, <strong>cheaper to modify</strong>, and <strong>safer to extend</strong>.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-13</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="why-refactor">Why Refactor?</h2>
<ul>
<li><strong>Improves software design</strong> -- Without refactoring, the design of a program will decay over time.</li>
<li><strong>Makes software easier to understand</strong> -- Code that communicates its purpose clearly is easier to maintain.</li>
<li><strong>Helps find bugs</strong> -- Clarifying code structure makes bugs more visible.</li>
<li><strong>Helps you program faster</strong> -- Good design enables rapid development of new features.</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="when-to-refactor">When to Refactor?</h2>
<ul>
<li><strong>Rule of Three</strong>: The first time you do something, just do it. The second time, you wince at duplication but do it anyway. The third time, you refactor.</li>
<li><strong>When adding a feature</strong>: Refactor to make the new feature easier to add.</li>
<li><strong>When fixing a bug</strong>: Refactor to make the bug obvious.</li>
<li><strong>During code review</strong>: Refactor to improve readability and maintainability.</li>
</ul>

<li>Inline Method</li>
<li>Extract Variable</li>
<li>Inline Temp</li>
<li>Replace Temp with Query</li>
<li>Split Temporary Variable</li>
<li>Remove Assignments to Parameters</li>
<li>Replace Method with Method Object</li>
<li>Substitute Algorithm</li>
</ol>

<h2 id="a1-extract-method">A1. Extract Method</h2>

<h2 id="a2-inline-method">A2. Inline Method</h2>
<p><strong>What:</strong> Replace a method call with the method's body and delete the method.</p>
<p><strong>Problem:</strong> When a method body is just as clear as the method name, or the method body is trivially simple, the indirection adds no value.</p>
<p><strong>Solution:</strong> Put the method's body into the body of its callers and remove the method.</p>
<p><strong>When to use:</strong> Method bodies are clearer than the method names; simple delegation methods have outlived their purpose.</p>
<p><strong>When NOT to use:</strong> The method is overridden in subclasses (inlining would break polymorphism); the method is called from many places where simplicity matters.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-13</footer>

<p><strong>When to use:</strong> Complex conditionals need clarification; long arithmetic expressions lack intermediate results.</p>
<p><strong>When NOT to use:</strong> Simple, self-evident expressions; when the extracted variable appears only once.</p>

<h2 id="a4-inline-temp">A4. Inline Temp</h2>
<p><strong>What:</strong> Replace all references to a temporary variable with the expression itself.</p>
<p><strong>Problem:</strong> You have a temporary variable that is assigned to once with a simple expression, and the temp is getting in the way of other refactorings.</p>
<p><strong>Solution:</strong> Replace all references to that temp with the expression.</p>
<p><strong>When to use:</strong> The temp is blocking another refactoring (e.g., Replace Temp with Query); the variable adds no clarity.</p>
<p><strong>When NOT to use:</strong> The expression is evaluated multiple times with side effects; removing the variable reduces readability.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
<span class="hljs-type">double</span> <span class="hljs-variable">basePrice</span> <span class="hljs-operator">=</span> order.basePrice();
<span class="hljs-keyword">return</span> (basePrice &gt; <span class="hljs-number">1000</span>);

<span class="hljs-comment">// After</span>
<span class="hljs-keyword">return</span> (order.basePrice() &gt; <span class="hljs-number">1000</span>);
</code></pre>

<h2 id="a5-replace-temp-with-query">A5. Replace Temp with Query</h2>
<p><strong>What:</strong> Extract the expression into a method and replace all references to the temp with the method call.</p>
<p><strong>Problem:</strong> You are using a temporary variable to hold the result of an expression.</p>
<p><strong>Solution:</strong> Move the expression to a separate method. Replace all references to the temp with the method call. The new method can then be used in other methods.</p>
<p><strong>When to use:</strong> When a temp is used in a single method but the expression is useful in other methods too.</p>
<p><strong>When NOT to use:</strong> When the expression has side effects or performance-critical calculations that should not be repeated.</p>

<p><strong>What:</strong> Use a separate temporary variable for each assignment.</p>
<p><strong>Problem:</strong> You have a local variable that is assigned more than once, but it is not a loop variable or a collecting variable.</p>

<p><strong>When to use:</strong> When a temp is used for two different things, it confuses the reader. Use a separate variable for each purpose.</p>
<p><strong>When NOT to use:</strong> Loop counters or accumulator variables that are naturally reassigned.</p>

<h2 id="a8-replace-method-with-method-object">A8. Replace Method with Method Object</h2>
<p><strong>What:</strong> Transform a long method into a separate class so that local variables become fields.</p>
<p><strong>Problem:</strong> You have a long method in which local variables are so intertwined that you cannot apply Extract Method.</p>
<p><strong>Solution:</strong> Transform the method into a separate class so that the local variables become fields of the class. Then you can split the method into several methods within the same class.</p>
<p><strong>When to use:</strong> When Extract Method is blocked by complex local variable dependencies.</p>
<p><strong>When NOT to use:</strong> When the method can be simplified by other, simpler refactorings first.</p>

<h2 id="module-b-outline">Module B Outline</h2>
<h3 id="moving-features-between-objects">Moving Features Between Objects</h3>
<p>These refactorings address how to distribute functionality among classes. The key decisions are <strong>where to put responsibilities</strong>. If a class has too many responsibilities, use Extract Class. If a class is underperforming, use Inline Class.</p>
<ol>
<li>Move Method</li>
<li>Move Field</li>
<li>Extract Class</li>
<li>Inline Class</li>
<li>Hide Delegate</li>
<li>Remove Middle Man</li>
<li>Introduce Foreign Method</li>
<li>Introduce Local Extension</li>
</ol>

<header>CEN206 Object-Oriented Programming</header>

<h2 id="b1-move-method">B1. Move Method</h2>
<p><strong>What:</strong> Create the method in the class that uses it most, and redirect or remove the original.</p>
<p><strong>Problem:</strong> A method is used more in another class than in its own class.</p>
<p><strong>Solution:</strong> Create a new method in the class that uses the method the most, then move the body of the old method there. Turn the old method into a simple delegation, or remove it entirely.</p>
<p><strong>When to use:</strong> When a method accesses data from another object more than its own.</p>
<p><strong>When NOT to use:</strong> When the method uses many features of its current class equally.</p>

<h2 id="b3-extract-class">B3. Extract Class</h2>
<p><strong>What:</strong> Create a new class containing fields and methods for a distinct responsibility.</p>
<p><strong>Problem:</strong> When one class does the work of two, awkwardness results. The class has too many responsibilities.</p>
<p><strong>Solution:</strong> Create a new class and move the relevant fields and methods from the old class into the new class.</p>
<p><strong>When to use:</strong> When a class has features that are naturally grouped and could stand on their own.</p>
<p><strong>When NOT to use:</strong> When the class is still cohesive and splitting it would create unnecessary coupling.</p>

<h2 id="b4-inline-class">B4. Inline Class</h2>
<p><strong>What:</strong> Move all features from an underperforming class into another class and delete it.</p>
<p><strong>Problem:</strong> A class does almost nothing and is not responsible for anything, and no additional responsibilities are planned for it.</p>
<p><strong>Solution:</strong> Move all features from the class to another one and delete the empty class.</p>
<p><strong>When to use:</strong> After refactorings have stripped a class of all but a thin wrapper of functionality.</p>
<p><strong>When NOT to use:</strong> When the class still has a clear responsibility or is expected to grow.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Person</span> {
    <span class="hljs-keyword">private</span> TelephoneNumber officeTelephone;
    String <span class="hljs-title function_">getAreaCode</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> officeTelephone.getAreaCode(); }
}
<span class="hljs-keyword">class</span> <span class="hljs-title class_">TelephoneNumber</span> { <span class="hljs-comment">/* only areaCode and number */</span> }

<span class="hljs-comment">// After -- TelephoneNumber merged back into Person</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Person</span> {
    <span class="hljs-keyword">private</span> String officeAreaCode;
    <span class="hljs-keyword">private</span> String officeNumber;
    String <span class="hljs-title function_">getAreaCode</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> officeAreaCode; }
}
</code></pre>

<header>CEN206 Object-Oriented Programming</header>

<h2 id="b5-hide-delegate">B5. Hide Delegate</h2>
<p><strong>What:</strong> Create a delegate method on the server to hide the delegate from the client.</p>
<p><strong>Problem:</strong> The client gets object B from object A, then calls a method of object B (law of Demeter violation: <code>a.getB().doSomething()</code>).</p>
<p><strong>Solution:</strong> Create a method in class A that delegates the call to B, shielding the client from knowing about B.</p>
<p><strong>When to use:</strong> When clients navigate through chains of objects (message chains).</p>
<p><strong>When NOT to use:</strong> When the delegate is a widely-known, stable API.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Person</span> {
    Department department;
    Department <span class="hljs-title function_">getDepartment</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> department; }
}
<span class="hljs-comment">// Client code: person.getDepartment().getManager();</span>

<span class="hljs-comment">// After</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Person</span> {
    Department department;
    Person <span class="hljs-title function_">getManager</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> department.getManager(); }
}
<span class="hljs-comment">// Client code: person.getManager();</span>
</code></pre>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-13</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>

<h2 id="b6-remove-middle-man">B6. Remove Middle Man</h2>
<p><strong>What:</strong> Have the client call the delegate directly, removing forwarding methods.</p>
<p><strong>Problem:</strong> A class has too many methods that simply delegate to another object. The server class becomes a &quot;middle man&quot;.</p>
<p><strong>Solution:</strong> Delete the middle man methods and let the client call the end object directly.</p>
<p><strong>When to use:</strong> When a class is overwhelmed with simple delegating methods; when Hide Delegate was overdone.</p>
<p><strong>When NOT to use:</strong> When hiding the delegate is important for encapsulation.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Person</span> {
    Department department;
    Person <span class="hljs-title function_">getManager</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> department.getManager(); }
    <span class="hljs-comment">// many more delegations...</span>
}
<span class="hljs-comment">// Client: person.getManager();</span>

<span class="hljs-comment">// After</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Person</span> {
    Department department;
    Department <span class="hljs-title function_">getDepartment</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> department; }
}
<span class="hljs-comment">// Client: person.getDepartment().getManager();</span>
</code></pre>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-13</footer>
</section>

<h2 id="b7-introduce-foreign-method">B7. Introduce Foreign Method</h2>
<p><strong>What:</strong> Add a utility method to a client class, passing the server object as an argument.</p>
<p><strong>Problem:</strong> A utility class that you use does not contain the method that you need, and you cannot add the method to the class.</p>
<p><strong>Solution:</strong> Create the method in a client class and pass an instance of the utility class as its first argument.</p>
<p><strong>When to use:</strong> When you need just one or two extra methods on a class you cannot modify.</p>
<p><strong>When NOT to use:</strong> When you need many methods -- use Introduce Local Extension instead.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
<span class="hljs-type">Date</span> <span class="hljs-variable">newStart</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Date</span>(previousEnd.getYear(),
    previousEnd.getMonth(), previousEnd.getDate() + <span class="hljs-number">1</span>);

<span class="hljs-comment">// After</span>
<span class="hljs-type">Date</span> <span class="hljs-variable">newStart</span> <span class="hljs-operator">=</span> nextDay(previousEnd);

<span class="hljs-keyword">private</span> <span class="hljs-keyword">static</span> Date <span class="hljs-title function_">nextDay</span><span class="hljs-params">(Date date)</span> {
    <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Date</span>(date.getYear(), date.getMonth(), date.getDate() + <span class="hljs-number">1</span>);
}
</code></pre>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-13</footer>

<h2 id="b8-introduce-local-extension">B8. Introduce Local Extension</h2>
<p><strong>What:</strong> Create a new class (subclass or wrapper) that contains the extra methods you need.</p>
<p><strong>Problem:</strong> A utility class lacks several methods that you need, and you cannot add methods to the class.</p>
<p><strong>Solution:</strong> Create a new class containing the extra methods. Make this extension class a subclass or a wrapper of the original.</p>
<p><strong>When to use:</strong> When you need many extra methods on a class you cannot modify.</p>
<p><strong>When NOT to use:</strong> When only one or two methods are needed (use Introduce Foreign Method instead).</p>

<h2 id="b8-introduce-local-extension----example">B8. Introduce Local Extension -- Example</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Wrapper approach</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">MfDateWrapper</span> {
    <span class="hljs-keyword">private</span> Date original;

    <span class="hljs-keyword">public</span> <span class="hljs-title function_">MfDateWrapper</span><span class="hljs-params">(Date date)</span> {

    }

    <span class="hljs-keyword">public</span> <span class="hljs-title function_">MfDateWrapper</span><span class="hljs-params">(String dateString)</span> {
        <span class="hljs-built_in">this</span>.original = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Date</span>(dateString);
    }

    <span class="hljs-keyword">public</span> Date <span class="hljs-title function_">nextDay</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Date</span>(original.getYear(), original.getMonth(), original.getDate() + <span class="hljs-number">1</span>);
    }

    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">dayOfYear</span><span class="hljs-params">()</span> {
        <span class="hljs-comment">// custom implementation</span>
        <span class="hljs-type">Calendar</span> <span class="hljs-variable">cal</span> <span class="hljs-operator">=</span> Calendar.getInstance();

        <span class="hljs-keyword">return</span> cal.get(Calendar.DAY_OF_YEAR);

    <span class="hljs-comment">// delegate all original methods...</span>
    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">getYear</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> original.getYear(); }
    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">getMonth</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> original.getMonth(); }
    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">getDate</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> original.getDate(); }

<li>Replace Magic Number with Symbolic Constant</li>
<li>Encapsulate Field</li>
<li>Encapsulate Collection</li>
<li>Replace Type Code with Class</li>
<li>Replace Type Code with Subclasses</li>
<li>Replace Type Code with State/Strategy</li>
<li>Replace Subclass with Fields</li>
</ol>

<h2 id="c1-self-encapsulate-field">C1. Self Encapsulate Field</h2>
<p><strong>What:</strong> Access a field only through getter and setter methods, even within the class.</p>
<p><strong>Problem:</strong> You directly access a private field inside the class, making it harder to change the field's behavior later.</p>
<p><strong>Solution:</strong> Create a getter and setter for the field and use only those to access the field.</p>
<p><strong>When to use:</strong> When you want to be able to override field access in subclasses; when you want to add validation or lazy initialization.</p>
<p><strong>When NOT to use:</strong> When direct access is simpler and there is no foreseeable need for indirect access.</p>

<h2 id="c2-replace-data-value-with-object">C2. Replace Data Value with Object</h2>
<p><strong>What:</strong> Turn a data field into an object with its own fields and behavior.</p>
<p><strong>Problem:</strong> You have a data field (e.g., a String for phone number) that needs additional data or behavior (e.g., formatting, validation).</p>
<p><strong>Solution:</strong> Create a new class, place the old field and its behavior in the class, and store an object of this class in the original class.</p>
<p><strong>When to use:</strong> When a simple field evolves to need its own behavior.</p>
<p><strong>When NOT to use:</strong> When the data truly is just a simple value with no additional behavior needed.</p>

<h2 id="c3-change-value-to-reference">C3. Change Value to Reference</h2>
<p><strong>What:</strong> Convert identical value objects into a single reference object.</p>
<p><strong>Problem:</strong> You have many identical instances of a single class that you need to replace with a single object (e.g., multiple Customer objects for the same customer).</p>
<p><strong>Solution:</strong> Convert the value objects into reference objects. Use a factory or registry to ensure only one instance exists for each logical entity.</p>
<p><strong>When to use:</strong> When multiple equal objects should be the same physical object for consistency.</p>
<p><strong>When NOT to use:</strong> When objects need to be independently mutable.</p>

<h2 id="c4-change-reference-to-value">C4. Change Reference to Value</h2>
<p><strong>What:</strong> Make a reference object into a value object.</p>

<p><strong>Solution:</strong> Turn it into a value object. Make it immutable and override equals/hashCode.</p>

<h2 id="c5-replace-array-with-object">C5. Replace Array with Object</h2>
<p><strong>What:</strong> Replace an array that contains different types of data with an object that has named fields.</p>
<p><strong>Problem:</strong> You have an array whose elements mean different things (e.g., <code>row[0]</code> is name, <code>row[1]</code> is age).</p>
<p><strong>Solution:</strong> Replace the array with an object that has a field for each element.</p>

<p><strong>When NOT to use:</strong> When the array truly represents a list of same-type elements.</p>

<h2 id="c6-duplicate-observed-data">C6. Duplicate Observed Data</h2>
<p><strong>What:</strong> Copy domain data into domain objects and set up an observer to synchronize the two.</p>
<p><strong>Problem:</strong> Domain data is stored in GUI classes only, and domain methods need access to it.</p>
<p><strong>Solution:</strong> Copy the data into a domain object and set up an observer to synchronize the two copies.</p>
<p><strong>When to use:</strong> When GUI controls hold domain data that should be accessible to business logic.</p>
<p><strong>When NOT to use:</strong> When data exists only for display purposes with no domain logic.</p>

<h2 id="c7-change-unidirectional-association-to-bidirectional">C7. Change Unidirectional Association to Bidirectional</h2>
<p><strong>What:</strong> Add a back-pointer so both classes can refer to each other.</p>
<p><strong>Problem:</strong> You have two classes that each need to use the features of the other, but there is only a one-way association.</p>
<p><strong>Solution:</strong> Add a back reference and update both directions when the link changes.</p>
<p><strong>When to use:</strong> When both objects need to navigate to each other.</p>
<p><strong>When NOT to use:</strong> When a bidirectional link adds unnecessary complexity; prefer unidirectional links when possible.</p>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before -- Order knows Customer, but Customer doesn&#x27;t know Orders</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Order</span> {

}

<span class="hljs-comment">// After -- bidirectional association</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Order</span> {

        <span class="hljs-keyword">if</span> (<span class="hljs-built_in">this</span>.customer != <span class="hljs-literal">null</span>) <span class="hljs-built_in">this</span>.customer.removeOrder(<span class="hljs-built_in">this</span>);
        <span class="hljs-built_in">this</span>.customer = customer;

<span class="hljs-keyword">class</span> <span class="hljs-title class_">Customer</span> {

<h2 id="c8-change-bidirectional-association-to-unidirectional">C8. Change Bidirectional Association to Unidirectional</h2>
<p><strong>What:</strong> Remove the unnecessary direction of a bidirectional association.</p>
<p><strong>Problem:</strong> You have a bidirectional association but one class no longer needs features from the other.</p>
<p><strong>Solution:</strong> Remove the unneeded end of the association.</p>
<p><strong>When to use:</strong> When one class no longer uses the reference to the other; to simplify dependency structure.</p>
<p><strong>When NOT to use:</strong> When both directions are actively used.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before -- bidirectional</span>

}
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Customer</span> {
    Set&lt;Order&gt; orders;
}

<span class="hljs-comment">// After -- only Order -&gt; Customer remains</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Order</span> {
    Customer customer;
}
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Customer</span> {

}

<h2 id="c9-replace-magic-number-with-symbolic-constant">C9. Replace Magic Number with Symbolic Constant</h2>
<p><strong>What:</strong> Replace a literal number with a named constant.</p>
<p><strong>Problem:</strong> Your code uses a number that has a certain meaning to it (e.g., 9.81 for gravitational acceleration).</p>
<p><strong>Solution:</strong> Replace this number with a constant that has a human-readable name explaining the meaning.</p>
<p><strong>When to use:</strong> When a number's meaning is not obvious from context.</p>
<p><strong>When NOT to use:</strong> When the number is self-evident (e.g., 0, 1 in trivial contexts).</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
<span class="hljs-type">double</span> <span class="hljs-title function_">potentialEnergy</span><span class="hljs-params">(<span class="hljs-type">double</span> mass, <span class="hljs-type">double</span> height)</span> {
    <span class="hljs-keyword">return</span> mass * <span class="hljs-number">9.81</span> * height;
}

<span class="hljs-comment">// After</span>
<span class="hljs-keyword">static</span> <span class="hljs-keyword">final</span> <span class="hljs-type">double</span> <span class="hljs-variable">GRAVITATIONAL_CONSTANT</span> <span class="hljs-operator">=</span> <span class="hljs-number">9.81</span>;

<span class="hljs-type">double</span> <span class="hljs-title function_">potentialEnergy</span><span class="hljs-params">(<span class="hljs-type">double</span> mass, <span class="hljs-type">double</span> height)</span> {
    <span class="hljs-keyword">return</span> mass * GRAVITATIONAL_CONSTANT * height;
}
</code></pre>

<h2 id="c10-encapsulate-field">C10. Encapsulate Field</h2>
<p><strong>What:</strong> Make a public field private and provide access methods.</p>
<p><strong>Problem:</strong> You have a public field that is directly accessed by external classes.</p>
<p><strong>Solution:</strong> Make the field private and provide getter and setter methods.</p>
<p><strong>When to use:</strong> Always -- public fields violate encapsulation.</p>
<p><strong>When NOT to use:</strong> In simple data-transfer objects where encapsulation is not a concern (though even then, it is a good practice).</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Person</span> {
    <span class="hljs-keyword">public</span> String name;
}
<span class="hljs-comment">// Client: person.name = &quot;John&quot;;</span>

<span class="hljs-comment">// After</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Person</span> {
    <span class="hljs-keyword">private</span> String name;
    <span class="hljs-keyword">public</span> String <span class="hljs-title function_">getName</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> name; }
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">setName</span><span class="hljs-params">(String name)</span> { <span class="hljs-built_in">this</span>.name = name; }
}
<span class="hljs-comment">// Client: person.setName(&quot;John&quot;);</span>
</code></pre>

<h2 id="c11-encapsulate-collection">C11. Encapsulate Collection</h2>
<p><strong>What:</strong> Make a collection getter return a read-only view and provide separate add/remove methods.</p>
<p><strong>Problem:</strong> A method returns a collection directly, allowing callers to modify it without the owning class knowing.</p>
<p><strong>Solution:</strong> Make the getter return a read-only view or copy of the collection, and provide separate add/remove methods.</p>
<p><strong>When to use:</strong> When external code can modify a collection without the owning class's knowledge.</p>
<p><strong>When NOT to use:</strong> When the collection truly needs to be freely modified by external code (rare).</p>

<h2 id="c11-encapsulate-collection----before--after">C11. Encapsulate Collection -- Before / After</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// After</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Person</span> {

    List&lt;Course&gt; <span class="hljs-title function_">getCourses</span><span class="hljs-params">()</span> {

<h2 id="c12-replace-type-code-with-class">C12. Replace Type Code with Class</h2>
<p><strong>What:</strong> Replace a type code (int or String) with a class.</p>
<p><strong>Problem:</strong> A class has a field containing a type code. The values of this type are not used in operator conditions and do not affect the behavior of the program.</p>
<p><strong>Solution:</strong> Create a new class and use its objects instead of the type code values.</p>
<p><strong>When to use:</strong> When type codes are used for data only (no behavior depends on them).</p>
<p><strong>When NOT to use:</strong> When the type code affects behavior -- use Replace Type Code with Subclasses or State/Strategy instead.</p>

<h2 id="c13-replace-type-code-with-subclasses">C13. Replace Type Code with Subclasses</h2>
<p><strong>What:</strong> Create subclasses for each value of the type code.</p>
<p><strong>Problem:</strong> You have a coded type that directly affects program behavior (e.g., conditionals that switch on the type code).</p>
<p><strong>Solution:</strong> Create subclasses for each value of the coded type. Extract the relevant behaviors from the original class to these subclasses. Replace control flow code with polymorphism.</p>
<p><strong>When to use:</strong> When the type code affects behavior and the type does not change after creation.</p>
<p><strong>When NOT to use:</strong> When the type code can change at runtime (use State/Strategy instead).</p>

<h2 id="c14-replace-type-code-with-statestrategy">C14. Replace Type Code with State/Strategy</h2>
<p><strong>What:</strong> Replace the type code with a state object using the State or Strategy pattern.</p>
<p><strong>Problem:</strong> You have a coded type that affects behavior, but you cannot use subclassing because the type changes at runtime, or the class is already subclassed for another reason.</p>
<p><strong>Solution:</strong> Replace the type code with a state object. Use the State or Strategy pattern.</p>
<p><strong>When to use:</strong> When the type code affects behavior AND the type changes during the object's lifetime.</p>
<p><strong>When NOT to use:</strong> When the type is immutable after construction (use Subclasses instead).</p>

<h2 id="c15-replace-subclass-with-fields">C15. Replace Subclass with Fields</h2>
<p><strong>What:</strong> Replace subclasses whose only difference is constant-returning methods with fields in the parent class.</p>
<p><strong>Problem:</strong> You have subclasses that differ only in their methods that return constant data (e.g., <code>getCode()</code> returns different values).</p>
<p><strong>Solution:</strong> Replace the methods with fields in the parent class and eliminate the subclasses.</p>
<p><strong>When to use:</strong> When subclasses add no real behavior, only returning different constant values.</p>
<p><strong>When NOT to use:</strong> When subclasses have meaningful behavioral differences beyond returning constants.</p>

<h2 id="d1-decompose-conditional">D1. Decompose Conditional</h2>
<p><strong>What:</strong> Extract complex conditional parts into separate, well-named methods.</p>
<p><strong>Problem:</strong> You have a complex conditional (if-then-else or switch) whose condition, then-branch, and else-branch are hard to understand.</p>
<p><strong>Solution:</strong> Decompose the complicated parts of the conditional into separate methods: the condition, the then-branch, and the else-branch.</p>
<p><strong>When to use:</strong> When conditional logic becomes difficult to understand at a glance.</p>
<p><strong>When NOT to use:</strong> When the condition is already simple and self-documenting.</p>

<h2 id="d2-consolidate-conditional-expression">D2. Consolidate Conditional Expression</h2>
<p><strong>What:</strong> Combine multiple conditionals that lead to the same result into a single expression.</p>
<p><strong>Problem:</strong> You have multiple conditionals that lead to the same result or action.</p>
<p><strong>Solution:</strong> Consolidate all these conditionals into a single expression, then extract the combined condition into a well-named method.</p>
<p><strong>When to use:</strong> When multiple conditions lead to the same result and can be logically combined.</p>
<p><strong>When NOT to use:</strong> When the conditions are truly independent checks that only coincidentally return the same result.</p>

<h2 id="d3-consolidate-duplicate-conditional-fragments">D3. Consolidate Duplicate Conditional Fragments</h2>
<p><strong>What:</strong> Move identical code that appears in all branches outside the conditional.</p>
<p><strong>Problem:</strong> Identical code can be found in all branches of a conditional.</p>
<p><strong>Solution:</strong> Move the duplicated code outside of the conditional.</p>
<p><strong>When to use:</strong> When the same statement appears at the beginning or end of every branch.</p>
<p><strong>When NOT to use:</strong> When the code only looks similar but is semantically different in each branch.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>

} <span class="hljs-keyword">else</span> {
    total = price * <span class="hljs-number">0.98</span>;
    send();
}

<span class="hljs-comment">// After</span>
<span class="hljs-keyword">if</span> (isSpecialDeal()) {
    total = price * <span class="hljs-number">0.95</span>;
} <span class="hljs-keyword">else</span> {
    total = price * <span class="hljs-number">0.98</span>;
}

<h2 id="d4-remove-control-flag">D4. Remove Control Flag</h2>
<p><strong>What:</strong> Use <code>break</code>, <code>continue</code>, or <code>return</code> instead of a boolean control flag.</p>
<p><strong>Problem:</strong> You have a boolean variable that acts as a control flag for multiple boolean expressions.</p>
<p><strong>Solution:</strong> Use <code>break</code>, <code>continue</code>, and <code>return</code> instead of the flag variable.</p>
<p><strong>When to use:</strong> When boolean variables are used solely to control loop or conditional execution flow.</p>
<p><strong>When NOT to use:</strong> When the flag variable has genuine domain meaning beyond flow control.</p>

<h2 id="d5-replace-nested-conditional-with-guard-clauses">D5. Replace Nested Conditional with Guard Clauses</h2>
<p><strong>What:</strong> Use guard clauses for special cases, leaving the normal path un-indented.</p>
<p><strong>Problem:</strong> You have a group of nested conditionals that makes it hard to determine the normal flow of code execution.</p>
<p><strong>Solution:</strong> Isolate all special checks and edge cases into separate clauses (guard clauses) and place them before the main logic. Return early from each guard clause.</p>
<p><strong>When to use:</strong> When deeply nested conditions make code hard to follow.</p>
<p><strong>When NOT to use:</strong> When the condition truly represents two equal alternatives (use if-else).</p>

<h2 id="d6-replace-conditional-with-polymorphism">D6. Replace Conditional with Polymorphism</h2>
<p><strong>What:</strong> Create subclasses matching conditional branches and use polymorphic method calls.</p>
<p><strong>Problem:</strong> You have a conditional that performs various actions depending on object type or properties.</p>
<p><strong>Solution:</strong> Create subclasses matching each condition branch. Create a shared method via polymorphism and move the relevant code from each branch to the matching subclass. The original method becomes abstract.</p>
<p><strong>When to use:</strong> When conditionals depend on object types; when the same conditional structure repeats.</p>
<p><strong>When NOT to use:</strong> When the conditional is simple and unlikely to grow; when creating subclasses is overkill.</p>

<p><strong>What:</strong> Instead of returning <code>null</code>, return a special null object that provides default behavior.</p>

<p><strong>Solution:</strong> Instead of <code>null</code>, return a null object that exhibits default behavior.</p>
<p><strong>When to use:</strong> When null checks clutter code; when null represents &quot;nothing&quot; with a known default behavior.</p>
<p><strong>When NOT to use:</strong> When null has genuine meaning (e.g., &quot;not found&quot; must be handled differently from &quot;found with defaults&quot;).</p>

<h2 id="d8-introduce-assertion">D8. Introduce Assertion</h2>
<p><strong>What:</strong> Replace assumptions about program state with explicit assertion checks.</p>
<p><strong>Problem:</strong> A section of code assumes something about the current state of the object or parameter values but does not enforce it.</p>
<p><strong>Solution:</strong> Replace these assumptions with specific assertion checks.</p>
<p><strong>When to use:</strong> When you need to document and enforce required preconditions; to make implicit assumptions explicit.</p>
<p><strong>When NOT to use:</strong> Do not use assertions for input validation in public APIs (use exceptions instead). Assertions are for programmer errors, not user errors.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-13</footer>
</section>

<h2 id="d8-introduce-assertion----before--after">D8. Introduce Assertion -- Before / After</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
<span class="hljs-type">double</span> <span class="hljs-title function_">getExpenseLimit</span><span class="hljs-params">()</span> {
    <span class="hljs-comment">// should have either expense limit or a primary project</span>
    <span class="hljs-keyword">return</span> (expenseLimit != NULL_EXPENSE)
        ? expenseLimit
        : primaryProject.getMemberExpenseLimit();
}
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// After</span>
<span class="hljs-type">double</span> <span class="hljs-title function_">getExpenseLimit</span><span class="hljs-params">()</span> {
    <span class="hljs-keyword">assert</span> (expenseLimit != NULL_EXPENSE || primaryProject != <span class="hljs-literal">null</span>)
        : <span class="hljs-string">&quot;Must have either expense limit or primary project&quot;</span>;

    <span class="hljs-keyword">return</span> (expenseLimit != NULL_EXPENSE)
        ? expenseLimit
        : primaryProject.getMemberExpenseLimit();
}
</code></pre>
<p>Assertions make implicit assumptions explicit and help catch programmer errors early.</p>

<h2 id="module-e-outline">Module E Outline</h2>
<h3 id="simplifying-method-calls">Simplifying Method Calls</h3>
<p>These techniques make method interfaces simpler and easier to understand. They address method naming, parameter lists, and return semantics.</p>
<ol>
<li>Rename Method</li>
<li>Add Parameter</li>
<li>Remove Parameter</li>
<li>Separate Query from Modifier</li>
<li>Parameterize Method</li>
<li>Replace Parameter with Explicit Methods</li>
<li>Preserve Whole Object</li>
<li>Replace Parameter with Method Call</li>
<li>Introduce Parameter Object</li>
<li>Remove Setting Method</li>
<li>Hide Method</li>
<li>Replace Constructor with Factory Method</li>
<li>Replace Error Code with Exception</li>
<li>Replace Exception with Test</li>
</ol>

<h2 id="e1-rename-method">E1. Rename Method</h2>
<p><strong>What:</strong> Give a method a name that reveals its purpose.</p>
<p><strong>Problem:</strong> The name of a method does not explain what the method does.</p>
<p><strong>Solution:</strong> Rename the method to something more descriptive.</p>
<p><strong>When to use:</strong> When the method name is misleading, abbreviated, or unclear.</p>
<p><strong>When NOT to use:</strong> When the method name is already clear and well-understood.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Customer</span> {
    String <span class="hljs-title function_">getsnm</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> surname; }
}

<span class="hljs-comment">// After</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Customer</span> {
    String <span class="hljs-title function_">getSurname</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> surname; }
}
</code></pre>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-13</footer>

<h2 id="e2-add-parameter">E2. Add Parameter</h2>
<p><strong>What:</strong> Add a new parameter to a method that needs additional data.</p>
<p><strong>Problem:</strong> A method does not have enough data to perform certain actions.</p>
<p><strong>Solution:</strong> Create a new parameter to pass the necessary data.</p>
<p><strong>When to use:</strong> When a method needs additional information to complete its job.</p>
<p><strong>When NOT to use:</strong> When the data can be obtained from an existing parameter or from the object itself. Consider Introduce Parameter Object if you are adding too many parameters.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Customer</span> {
    Contact <span class="hljs-title function_">getContact</span><span class="hljs-params">()</span> { ... }
}

<span class="hljs-comment">// After</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Customer</span> {
    Contact <span class="hljs-title function_">getContact</span><span class="hljs-params">(Date date)</span> { ... }
}
</code></pre>

<h2 id="e3-remove-parameter">E3. Remove Parameter</h2>
<p><strong>What:</strong> Remove an unused parameter from a method.</p>
<p><strong>Problem:</strong> A parameter is not used in the body of a method.</p>
<p><strong>Solution:</strong> Remove the unused parameter.</p>
<p><strong>When to use:</strong> When a parameter is no longer needed after refactoring.</p>
<p><strong>When NOT to use:</strong> When the parameter is used by overriding methods in subclasses, even if the base class does not use it.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Customer</span> {
    Contact <span class="hljs-title function_">getContact</span><span class="hljs-params">(Date date)</span> {
        <span class="hljs-comment">// date is never used</span>
        <span class="hljs-keyword">return</span> contact;
    }
}

<span class="hljs-comment">// After</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Customer</span> {
    Contact <span class="hljs-title function_">getContact</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> contact;
    }
}
</code></pre>

<h2 id="e4-separate-query-from-modifier">E4. Separate Query from Modifier</h2>
<p><strong>What:</strong> Split a method that returns a value and changes object state into two methods.</p>
<p><strong>Problem:</strong> You have a method that returns a value but also changes something inside an object (side effect). Callers may not expect the side effect.</p>
<p><strong>Solution:</strong> Split the method into two separate methods. One returns the value (query), the other performs the modification (command).</p>
<p><strong>When to use:</strong> When mixing queries and commands leads to unexpected side effects.</p>
<p><strong>When NOT to use:</strong> When the combined operation is atomic and splitting it would cause concurrency issues.</p>

<h2 id="e5-parameterize-method">E5. Parameterize Method</h2>
<p><strong>What:</strong> Combine similar methods that differ only in internal values by adding a parameter.</p>

<p><strong>When to use:</strong> When duplicate methods differ only by constants or similar values.</p>
<p><strong>When NOT to use:</strong> When the methods have significantly different logic beyond the differing values.</p>

<h2 id="e6-replace-parameter-with-explicit-methods">E6. Replace Parameter with Explicit Methods</h2>
<p><strong>What:</strong> Split a method that uses a parameter to choose behavior into separate methods.</p>
<p><strong>Problem:</strong> A method is split into parts, each of which is run depending on the value of a parameter (e.g., <code>setValue(&quot;height&quot;, 10)</code>).</p>
<p><strong>Solution:</strong> Extract the individual parts of the method into their own methods.</p>
<p><strong>When to use:</strong> When a parameter is used only to select among different behaviors.</p>
<p><strong>When NOT to use:</strong> When the parameter values are not known at compile time.</p>

    <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (name.equals(<span class="hljs-string">&quot;width&quot;</span>)) { width = value; }

<h2 id="e7-preserve-whole-object">E7. Preserve Whole Object</h2>
<p><strong>What:</strong> Pass the entire object instead of extracting several values and passing them individually.</p>
<p><strong>Problem:</strong> You get several values from an object and then pass them as parameters to a method.</p>
<p><strong>Solution:</strong> Instead, try passing the whole object.</p>
<p><strong>When to use:</strong> When several parameters come from the same object; when future changes might require more data from the same object.</p>
<p><strong>When NOT to use:</strong> When the called method should not depend on the whole object (to avoid coupling); when only one value is needed.</p>

<h2 id="e8-replace-parameter-with-method-call">E8. Replace Parameter with Method Call</h2>
<p><strong>What:</strong> Instead of passing a computed value as a parameter, let the method compute it itself.</p>
<p><strong>Problem:</strong> You call a query method and pass its results as a parameter to another method, while that method could call the query directly.</p>
<p><strong>Solution:</strong> Remove the parameter and let the receiver invoke the method directly.</p>
<p><strong>When to use:</strong> When the called method can easily obtain the value on its own.</p>
<p><strong>When NOT to use:</strong> When the called method should not know about or depend on the source of the value.</p>

<span class="hljs-type">double</span> <span class="hljs-variable">finalPrice</span> <span class="hljs-operator">=</span> discountedPrice(basePrice, discount);

<span class="hljs-comment">// After</span>
<span class="hljs-type">double</span> <span class="hljs-variable">finalPrice</span> <span class="hljs-operator">=</span> discountedPrice(basePrice);

<span class="hljs-type">double</span> <span class="hljs-title function_">discountedPrice</span><span class="hljs-params">(<span class="hljs-type">int</span> basePrice)</span> {

<h2 id="e10-remove-setting-method">E10. Remove Setting Method</h2>
<p><strong>What:</strong> Remove the setter for a field that should only be set at creation time.</p>
<p><strong>Problem:</strong> The value of a field should be set only when it is created, and should not change at any time after that.</p>
<p><strong>Solution:</strong> Remove the setter method. Set the field only in the constructor.</p>
<p><strong>When to use:</strong> When a field should be immutable after construction.</p>
<p><strong>When NOT to use:</strong> When the field legitimately needs to be changed after creation.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Employee</span> {
    <span class="hljs-keyword">private</span> String id;
    <span class="hljs-keyword">void</span> <span class="hljs-title function_">setId</span><span class="hljs-params">(String id)</span> { <span class="hljs-built_in">this</span>.id = id; }
    String <span class="hljs-title function_">getId</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> id; }
}

<span class="hljs-comment">// After</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Employee</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> String id;
    Employee(String id) { <span class="hljs-built_in">this</span>.id = id; }
    String <span class="hljs-title function_">getId</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> id; }
}
</code></pre>

<h2 id="e11-hide-method">E11. Hide Method</h2>
<p><strong>What:</strong> Make a method private or protected if it is not used by other classes.</p>
<p><strong>Problem:</strong> A method is not used by any other classes, or is used only inside its own class hierarchy.</p>
<p><strong>Solution:</strong> Make the method private (or protected).</p>
<p><strong>When to use:</strong> When a method's visibility is wider than necessary.</p>
<p><strong>When NOT to use:</strong> When the method is part of a public API that external clients depend on.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Employee</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">calculateBonusPercentage</span><span class="hljs-params">()</span> {
        <span class="hljs-comment">// only used internally</span>
        <span class="hljs-keyword">return</span> yearsOfService &gt; <span class="hljs-number">10</span> ? <span class="hljs-number">15</span> : <span class="hljs-number">5</span>;
    }
    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">getBonus</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> salary * calculateBonusPercentage() / <span class="hljs-number">100</span>;
    }
}

<span class="hljs-comment">// After</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Employee</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-type">int</span> <span class="hljs-title function_">calculateBonusPercentage</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> yearsOfService &gt; <span class="hljs-number">10</span> ? <span class="hljs-number">15</span> : <span class="hljs-number">5</span>;
    }
    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">getBonus</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> salary * calculateBonusPercentage() / <span class="hljs-number">100</span>;
    }
}
</code></pre>

<h2 id="e12-replace-constructor-with-factory-method">E12. Replace Constructor with Factory Method</h2>
<p><strong>What:</strong> Replace a constructor with a factory method.</p>
<p><strong>Problem:</strong> You have a complex constructor that does something more than just setting parameter values in object fields. Or you need to return different subclass instances.</p>
<p><strong>Solution:</strong> Create a factory method and use it instead of the constructor.</p>
<p><strong>When to use:</strong> When constructors perform logic beyond simple assignment; when you need to return different types.</p>
<p><strong>When NOT to use:</strong> When construction is simple and straightforward.</p>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Employee</span> {

    <span class="hljs-keyword">static</span> <span class="hljs-keyword">final</span> <span class="hljs-type">int</span> <span class="hljs-variable">SALESMAN</span> <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;
    <span class="hljs-keyword">static</span> <span class="hljs-keyword">final</span> <span class="hljs-type">int</span> <span class="hljs-variable">MANAGER</span> <span class="hljs-operator">=</span> <span class="hljs-number">2</span>;
    <span class="hljs-keyword">private</span> <span class="hljs-type">int</span> type;

}

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// After</span>

<h2 id="e13-replace-error-code-with-exception">E13. Replace Error Code with Exception</h2>
<p><strong>What:</strong> Throw an exception instead of returning a special error code value.</p>
<p><strong>Problem:</strong> A method returns a special value (like -1 or null) that indicates an error.</p>
<p><strong>Solution:</strong> Throw an exception instead.</p>
<p><strong>When to use:</strong> When error conditions should interrupt normal flow and be explicitly handled by callers.</p>
<p><strong>When NOT to use:</strong> When the &quot;error&quot; is actually a normal, expected outcome (use a return value or Optional).</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
<span class="hljs-type">int</span> <span class="hljs-title function_">withdraw</span><span class="hljs-params">(<span class="hljs-type">int</span> amount)</span> {
    <span class="hljs-keyword">if</span> (amount &gt; balance) <span class="hljs-keyword">return</span> -<span class="hljs-number">1</span>;
    balance -= amount;
    <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}

<span class="hljs-comment">// After</span>
<span class="hljs-keyword">void</span> <span class="hljs-title function_">withdraw</span><span class="hljs-params">(<span class="hljs-type">int</span> amount)</span> {
    <span class="hljs-keyword">if</span> (amount &gt; balance) {
        <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">InsufficientFundsException</span>();
    }
    balance -= amount;
}
</code></pre>

<h2 id="e14-replace-exception-with-test">E14. Replace Exception with Test</h2>
<p><strong>What:</strong> Replace an exception with a conditional test.</p>
<p><strong>Problem:</strong> You throw an exception in a place where a simple test would do the job. Exceptions are used for expected control flow.</p>
<p><strong>Solution:</strong> Replace the exception with a condition test.</p>
<p><strong>When to use:</strong> When exceptions are used for predictable, non-exceptional situations.</p>
<p><strong>When NOT to use:</strong> When the condition is truly exceptional and cannot be checked in advance.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
<span class="hljs-type">double</span> <span class="hljs-title function_">getValueForPeriod</span><span class="hljs-params">(<span class="hljs-type">int</span> periodNumber)</span> {
    <span class="hljs-keyword">try</span> {
        <span class="hljs-keyword">return</span> values[periodNumber];
    } <span class="hljs-keyword">catch</span> (ArrayIndexOutOfBoundsException e) {
        <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
    }
}

<span class="hljs-comment">// After</span>
<span class="hljs-type">double</span> <span class="hljs-title function_">getValueForPeriod</span><span class="hljs-params">(<span class="hljs-type">int</span> periodNumber)</span> {
    <span class="hljs-keyword">if</span> (periodNumber &gt;= values.length) <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
    <span class="hljs-keyword">return</span> values[periodNumber];
}
</code></pre>

<h2 id="module-e----takeaway">Module E -- Takeaway</h2>

<tbody>

<tr>

<td>Remove Parameter</td>
<td>Delete unused parameters</td>
</tr>
<tr>
<td>4</td>

<h2 id="module-f-outline">Module F Outline</h2>
<h3 id="dealing-with-generalization">Dealing with Generalization</h3>
<p>Abstraction has its own group of refactoring techniques, primarily associated with moving functionality along the class inheritance hierarchy, creating new classes and interfaces, and replacing inheritance with delegation and vice versa.</p>
<ol>
<li>Pull Up Field</li>
<li>Pull Up Method</li>
<li>Pull Up Constructor Body</li>
<li>Push Down Method</li>
<li>Push Down Field</li>
<li>Extract Subclass</li>
<li>Extract Superclass</li>
<li>Extract Interface</li>
<li>Collapse Hierarchy</li>
<li>Form Template Method</li>
<li>Replace Inheritance with Delegation</li>
<li>Replace Delegation with Inheritance</li>
</ol>

<h2 id="f1-pull-up-field">F1. Pull Up Field</h2>
<p><strong>What:</strong> Move a field from subclasses to the superclass.</p>
<p><strong>Problem:</strong> Two or more subclasses have the same field.</p>
<p><strong>Solution:</strong> Remove the field from subclasses and move it to the superclass.</p>
<p><strong>When to use:</strong> When multiple subclasses declare the same field.</p>
<p><strong>When NOT to use:</strong> When the fields only appear similar but represent different concepts in each subclass.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Salesman</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Employee</span> {
    <span class="hljs-keyword">private</span> String name;
}
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Engineer</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Employee</span> {
    <span class="hljs-keyword">private</span> String name;
}

<span class="hljs-comment">// After</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Employee</span> {
    <span class="hljs-keyword">protected</span> String name;
}
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Salesman</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Employee</span> { }
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Engineer</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Employee</span> { }
</code></pre>

<h2 id="f2-pull-up-method">F2. Pull Up Method</h2>
<p><strong>What:</strong> Move identical methods from subclasses to the superclass.</p>
<p><strong>Problem:</strong> Your subclasses have methods that perform similar work.</p>
<p><strong>Solution:</strong> Make the methods identical and then move them to the relevant superclass.</p>
<p><strong>When to use:</strong> When subclasses implement identical or nearly identical methods.</p>
<p><strong>When NOT to use:</strong> When the methods are truly different despite similar names.</p>

}

<span class="hljs-comment">// After</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Employee</span> {
    String <span class="hljs-title function_">getName</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> name; }
}
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Salesman</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Employee</span> { }

<h2 id="f3-pull-up-constructor-body">F3. Pull Up Constructor Body</h2>
<p><strong>What:</strong> Move common constructor code to the superclass constructor.</p>
<p><strong>Problem:</strong> Your subclasses have constructors with code that is mostly identical.</p>
<p><strong>Solution:</strong> Create a superclass constructor and move the shared code into it. Call the superclass constructor in subclass constructors.</p>
<p><strong>When to use:</strong> When constructor logic repeats across the hierarchy.</p>
<p><strong>When NOT to use:</strong> When only a superficial similarity exists between constructors.</p>

<h2 id="f4-push-down-method">F4. Push Down Method</h2>
<p><strong>What:</strong> Move a method from a superclass to specific subclasses that need it.</p>
<p><strong>Problem:</strong> Behavior implemented in a superclass is used by only one (or a few) subclasses.</p>
<p><strong>Solution:</strong> Move the method to those specific subclasses.</p>
<p><strong>When to use:</strong> When a method is only relevant to a subset of subclasses.</p>
<p><strong>When NOT to use:</strong> When the method is used by most or all subclasses.</p>

<h2 id="f5-push-down-field">F5. Push Down Field</h2>

<p><strong>Problem:</strong> A field is used only in a few subclasses, not across the entire hierarchy.</p>
<p><strong>Solution:</strong> Move the field to those specific subclasses.</p>

<h2 id="f6-extract-subclass">F6. Extract Subclass</h2>

<h2 id="f7-extract-superclass">F7. Extract Superclass</h2>

<p><strong>When to use:</strong> When multiple classes share significant functionality.</p>
<p><strong>When NOT to use:</strong> When the similarity is coincidental and does not represent a true &quot;is-a&quot; relationship.</p>

<h2 id="f8-extract-interface">F8. Extract Interface</h2>
<p><strong>What:</strong> Move a shared portion of a class interface into its own interface.</p>
<p><strong>Problem:</strong> Multiple clients use the same subset of a class's interface. Or two classes have a part of their interfaces in common.</p>
<p><strong>Solution:</strong> Move this identical portion to its own interface.</p>
<p><strong>When to use:</strong> When you want to decouple clients from specific implementations; when classes share a behavioral contract.</p>
<p><strong>When NOT to use:</strong> When the interface would contain only one method (may not be worth the abstraction).</p>

<h2 id="f9-collapse-hierarchy">F9. Collapse Hierarchy</h2>
<p><strong>What:</strong> Merge a superclass and subclass when they are practically the same.</p>
<p><strong>Problem:</strong> You have a class hierarchy in which a subclass is practically the same as its superclass.</p>
<p><strong>Solution:</strong> Merge the subclass and superclass.</p>
<p><strong>When to use:</strong> When the hierarchy no longer adds value; when a subclass has no significant differences from its parent.</p>
<p><strong>When NOT to use:</strong> When the distinction between the classes is meaningful for future extensibility.</p>

    <span class="hljs-comment">// no meaningful additions</span>
}

<span class="hljs-comment">// After -- merge Salesman into Employee</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Employee</span> {

<h2 id="f10-form-template-method">F10. Form Template Method</h2>
<p><strong>What:</strong> Move the shared algorithm structure to a superclass while keeping varying steps in subclasses.</p>
<p><strong>Problem:</strong> Your subclasses implement algorithms that contain similar steps in the same order, but the individual steps are different.</p>
<p><strong>Solution:</strong> Move the algorithm structure to a superclass method (the template method), and keep the varying steps as abstract methods in the subclasses.</p>
<p><strong>When to use:</strong> When subclasses share an algorithm structure but differ in details.</p>
<p><strong>When NOT to use:</strong> When the algorithms have fundamentally different structures.</p>

<h2 id="f11-replace-inheritance-with-delegation">F11. Replace Inheritance with Delegation</h2>
<p><strong>What:</strong> Create a field for the superclass, delegate methods to it, and remove the inheritance.</p>
<p><strong>Problem:</strong> A subclass uses only a portion of the methods of its superclass (or it is not possible to inherit the superclass's data). The inheritance does not represent a true &quot;is-a&quot; relationship.</p>
<p><strong>Solution:</strong> Create a field and put a superclass object in it, delegate methods to the superclass object, and get rid of inheritance.</p>
<p><strong>When to use:</strong> When a subclass violates the Liskov Substitution Principle; when it only uses some inherited methods.</p>
<p><strong>When NOT to use:</strong> When the inheritance genuinely represents an &quot;is-a&quot; relationship.</p>

<h2 id="f12-replace-delegation-with-inheritance">F12. Replace Delegation with Inheritance</h2>
<p><strong>What:</strong> Make the delegating class inherit from the delegate, eliminating boilerplate delegation.</p>
<p><strong>Problem:</strong> A class contains many simple methods that delegate to all methods of another class.</p>
<p><strong>Solution:</strong> Make the class an inheritor of the delegate, which makes the delegating methods unnecessary.</p>
<p><strong>When to use:</strong> When the class delegates most methods to another class and the relationship is truly &quot;is-a&quot;.</p>
<p><strong>When NOT to use:</strong> When the delegate is used by several classes (shared state); when the delegate is mutable and you only want partial behavior.</p>

<header>CEN206 Object-Oriented Programming</header>

<h2 id="code-smell-to-refactoring-dispensables">Code Smell to Refactoring: Dispensables</h2>
<table>
<thead>
<tr>
<th>Code Smell</th>
<th>Description</th>
<th>Recommended Refactorings</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Comments</strong></td>
<td>A method is filled with explanatory comments</td>
<td>Extract Variable, Extract Method, Rename Method, Introduce Assertion</td>
</tr>
<tr>
<td><strong>Duplicate Code</strong></td>
<td>Two code fragments look almost identical</td>
<td>Extract Method, Pull Up Method, Form Template Method, Extract Class</td>
</tr>
<tr>
<td><strong>Lazy Class</strong></td>
<td>A class does too little to justify its existence</td>
<td>Inline Class, Collapse Hierarchy</td>
</tr>
<tr>
<td><strong>Data Class</strong></td>
<td>A class contains only fields and crude accessors</td>
<td>Encapsulate Field, Encapsulate Collection, Move Method, Extract Method, Remove Setting Method, Hide Method</td>
</tr>
<tr>
<td><strong>Dead Code</strong></td>
<td>A variable, parameter, field, method, or class is no longer used anywhere</td>
<td>Delete the unused code (Inline Class, Collapse Hierarchy, Remove Parameter)</td>
</tr>
<tr>
<td><strong>Speculative Generality</strong></td>
<td>There is an unused class, method, field, or parameter created &quot;just in case&quot; for future use</td>
<td>Collapse Hierarchy, Inline Class, Inline Method, Remove Parameter</td>
</tr>
</tbody>
</table>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-13</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>

<h2 id="code-smell-to-refactoring-couplers">Code Smell to Refactoring: Couplers</h2>
<table>
<thead>
<tr>
<th>Code Smell</th>
<th>Description</th>
<th>Recommended Refactorings</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Feature Envy</strong></td>
<td>A method accesses the data of another object more than its own data</td>
<td>Move Method, Extract Method</td>
</tr>
<tr>
<td><strong>Inappropriate Intimacy</strong></td>
<td>One class uses the internal fields and methods of another class</td>
<td>Move Method, Move Field, Extract Class, Hide Delegate, Change Bidirectional Association to Unidirectional, Replace Inheritance with Delegation</td>
</tr>
<tr>
<td><strong>Message Chains</strong></td>
<td>You see a series of calls like <code>a.getB().getC().getD()</code></td>
<td>Hide Delegate, Extract Method, Move Method</td>
</tr>
<tr>
<td><strong>Middle Man</strong></td>
<td>A class does nothing except delegate to another class</td>
<td>Remove Middle Man, Inline Method, Replace Delegation with Inheritance</td>
</tr>
<tr>
<td><strong>Incomplete Library Class</strong></td>
<td>A library class does not have a method you need</td>
<td>Introduce Foreign Method, Introduce Local Extension</td>
</tr>
</tbody>
</table>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="refactoring-best-practices">Refactoring Best Practices</h2>
<ol>
<li><strong>Always have tests</strong> before refactoring -- refactoring without tests is risky</li>
<li><strong>Small steps</strong> -- each refactoring should be a small, verifiable change</li>
<li><strong>Commit frequently</strong> -- after each successful refactoring step</li>
<li><strong>Do not add functionality</strong> while refactoring -- separate concerns</li>
<li><strong>Follow your nose</strong> -- if code smells, investigate and refactor</li>
<li><strong>Use IDE support</strong> -- automated refactoring tools reduce manual errors (IntelliJ IDEA, Eclipse, VS Code)</li>
<li><strong>Review the result</strong> -- ensure the refactored code is actually better</li>
<li><strong>Refactor continuously</strong> -- not as a one-time event but as part of daily development</li>
</ol>
