<h2 id="tasar%C4%B1m-desenleri-design-patterns-nedir">Tasarım Desenleri (Design Patterns) Nedir?</h2>
<ul>
<li><strong>Tasarım desenleri (Design Patterns)</strong>, yazılım tasarımında sıkça karşılaşılan sorunlara yönelik tipik çözümlerdir.</li>
<li>Kodunuzdaki tekrarlayan bir tasarım sorununu çözmek için özelleştirebileceğiniz hazır şablonlar gibidirler.</li>
<li>Bir desen belirli bir kod parçası değil, belirli bir sorunu çözmek için genel bir kavramdır.</li>
<li>Desen ayrıntılarını takip edebilir ve kendi programınızın gerçeklerine uygun bir çözüm uygulayabilirsiniz.</li>
<li>Desenler genellikle algoritmalarla karıştırılır. Bir algoritma her zaman net bir eylem dizisi tanımlarken, bir desen bir çözümün daha üst düzey bir açıklamasıdır.</li>
<li>Aynı desenin iki farklı programa uygulanmış kodu birbirinden farklı olabilir.</li>
</ul>
<p>Referans: <a href="https://refactoring.guru/design-patterns">RefactoringGuru - Design Patterns</a></p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-9</footer>

<h2 id="desenler-ve-algoritmalar-kar%C5%9F%C4%B1la%C5%9Ft%C4%B1rmas%C4%B1">Desenler ve Algoritmalar Karşılaştırması</h2>
<table>
<thead>
<tr>
<th>Özellik</th>
<th>Algoritma</th>
<th>Tasarım Deseni (Design Pattern)</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Düzey</strong></td>
<td>Düşük seviyeli, adım adım</td>
<td>Üst düzey, mimari</td>
</tr>
<tr>
<td><strong>Benzetme</strong></td>
<td>Bir yemek tarifi</td>
<td>Bir mimari plan</td>
</tr>
<tr>
<td><strong>Özgüllük</strong></td>
<td>Bir hedefe ulaşmak için net eylem dizisi</td>
<td>Bir sorunu çözmek için genel kavram</td>
</tr>
<tr>
<td><strong>Uygulama</strong></td>
<td>Aynı kod doğrudan yeniden kullanılabilir</td>
<td>Her programa uyarlanmalıdır</td>
</tr>
<tr>
<td><strong>Odak</strong></td>
<td>Veriyi nasıl işlenir</td>
<td>Kodu nasıl yapılandırılır</td>
</tr>
</tbody>
</table>
<ul>
<li>Bir algoritma bir yemek tarifi gibidir: her ikisinde de bir hedefe ulaşmak için net adımlar vardır.</li>
<li>Bir desen daha çok bir mimari plan gibidir: sonucun ve özelliklerinin ne olduğunu görebilirsiniz, ancak kesin uygulama sırası size bağlıdır.</li>
</ul>

<h2 id="bir-desen-nelerden-olu%C5%9Fur">Bir Desen Nelerden Oluşur?</h2>
<p>Çoğu desen, birçok bağlamda yeniden üretilebilmeleri için biçimsel olarak tanımlanır. Bir desen açıklaması genellikle şunları içerir:</p>
<ul>
<li><strong>Amaç (Intent)</strong>: hem sorunu hem de çözümü kısaca açıklar.</li>
<li><strong>Motivasyon (Motivation)</strong>: sorunu ve desenin mümkün kıldığı çözümü daha ayrıntılı açıklar.</li>
<li><strong>Yapı (Structure)</strong>: desenin her parçasını ve bunların birbirleriyle nasıl ilişkili olduğunu gösterir (sınıf diyagramları).</li>
<li><strong>Sözde Kod/Kod Örneği (Pseudocode/Code example)</strong>: desenin arkasındaki fikri kavramayı kolaylaştırır.</li>
<li><strong>Uygulanabilirlik (Applicability)</strong>: desenin ne zaman kullanılacağı.</li>
<li><strong>Uygulama Adımları (Implementation steps)</strong>: desenin nasıl uygulanacağı.</li>
<li><strong>Diğer Desenlerle İlişkiler (Relations with other patterns)</strong>: desenlerin birbirleriyle nasıl ilişkili olduğu.</li>
</ul>
<p>Bazı desen katalogları ayrıca şunları listeler: artılar ve eksiler, bilinen kullanımlar ve alternatif isimler.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-9</footer>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="tasar%C4%B1m-desenlerinin-tarih%C3%A7esi">Tasarım Desenlerinin Tarihçesi</h2>
<ul>
<li>Desen kavramı ilk olarak <strong>Christopher Alexander</strong> tarafından <em>A Pattern Language: Towns, Buildings, Construction</em> (1977) adlı kitapta tanımlanmıştır.
<ul>
<li>Kitap, kentsel çevreyi tasarlamak için bir &quot;dil&quot; tanımlar.</li>
</ul>
</li>
<li>Bu fikir dört yazar tarafından benimsendi: <strong>Erich Gamma</strong>, <strong>John Vlissides</strong>, <strong>Ralph Johnson</strong> ve <strong>Richard Helm</strong>.</li>
<li>1994'te <strong>&quot;Design Patterns: Elements of Reusable Object-Oriented Software&quot;</strong> kitabını yayımladılar.</li>
<li>Kitapta, nesne yönelimli tasarımın çeşitli sorunlarını çözen <strong>23 desen</strong> yer almaktadır.</li>
<li>Kitabın uzun ismi nedeniyle insanlar ona <strong>&quot;Dörtlü Çete (Gang of Four - GoF) kitabı&quot;</strong> demeye başladı.</li>
<li>O zamandan beri düzinelerce başka nesne yönelimli desen keşfedilmiştir.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-9</footer>
</section>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="d%C3%B6rtl%C3%BC-%C3%A7ete-gang-of-four---gof">Dörtlü Çete (Gang of Four - GoF)</h2>
<p>Bu çığır açan kitabın dört yazarı:</p>
<table>
<thead>
<tr>
<th>Yazar</th>
<th>Katkı</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Erich Gamma</strong></td>
<td>Daha sonra IBM'de Eclipse platform geliştirmesini yönetti</td>
</tr>
<tr>
<td><strong>Richard Helm</strong></td>
<td>Avustralya'da yazılım mimarı</td>
</tr>
<tr>
<td><strong>Ralph Johnson</strong></td>
<td>Illinois Üniversitesi'nde profesör</td>
</tr>
<tr>
<td><strong>John Vlissides</strong></td>
<td>IBM'de araştırmacı (1961-2005)</td>
</tr>
</tbody>
</table>
<p>Kitapları, bugün hala NYP'nin (Nesne Yönelimli Programlama) temelini oluşturan 23 klasik tasarım desenini kataloglamıştır. Desenler, gerçek dünya yazılım geliştirme deneyimi yoluyla organik olarak gelişen çözümlerdir.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-9</footer>
</section>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="tasar%C4%B1m-desenlerinin-s%C4%B1n%C4%B1fland%C4%B1r%C4%B1lmas%C4%B1">Tasarım Desenlerinin Sınıflandırılması</h2>
<p>Tasarım desenleri karmaşıklık, ayrıntı düzeyi ve uygulanabilirlik ölçeği bakımından farklılık gösterir. GoF bunları <strong>üç kategoriye</strong> sınıflandırmıştır:</p>
<table>
<thead>
<tr>
<th>Kategori</th>
<th>Sayı</th>
<th>Amaç</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Yaratımsal (Creational)</strong></td>
<td>5</td>
<td>Nesne oluşturma mekanizmaları</td>
</tr>
<tr>
<td><strong>Yapısal (Structural)</strong></td>
<td>7</td>
<td>Nesneleri ve sınıfları daha büyük yapılarda birleştirme</td>
</tr>
<tr>
<td><strong>Davranışsal (Behavioral)</strong></td>
<td>10</td>
<td>Nesneler arasındaki iletişim</td>
</tr>
<tr>
<td><strong>Toplam</strong></td>
<td><strong>22</strong></td>
<td>(GoF'ta 23, ancak biz 22 temel deseni kapsıyoruz)</td>
</tr>
</tbody>
</table>
<p>Desenler ayrıca kapsamlarına göre de sınıflandırılabilir:</p>
<ul>
<li><strong>Sınıf desenleri (Class patterns)</strong>: sınıflar ve alt sınıflar arasındaki ilişkilerle ilgilenir (derleme zamanı)</li>
<li><strong>Nesne desenleri (Object patterns)</strong>: nesne ilişkileriyle ilgilenir (çalışma zamanı)</li>
</ul>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="yarat%C4%B1msal-desenler-creational-patterns-5">Yaratımsal Desenler (Creational Patterns) (5)</h2>
<p>Yaratımsal desenler (Creational Patterns), mevcut kodun esnekliğini ve yeniden kullanılabilirliğini artıran nesne oluşturma mekanizmaları sağlar.</p>
<table>
<thead>
<tr>
<th>Desen</th>
<th>Amaç</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Factory Method (Fabrika Yöntemi)</strong></td>
<td>Bir arayüz aracılığıyla nesne oluşturur; alt sınıflar türü belirler</td>
</tr>
<tr>
<td><strong>Abstract Factory (Soyut Fabrika)</strong></td>
<td>Somut sınıfları belirtmeden ilişkili nesne aileleri üretir</td>
</tr>
<tr>
<td><strong>Builder (İnşaatçı)</strong></td>
<td>Karmaşık nesneleri adım adım inşa eder</td>
</tr>
<tr>
<td><strong>Prototype (Prototip)</strong></td>
<td>Mevcut nesneleri sınıflarına bağımlı olmadan kopyalar</td>
</tr>
<tr>
<td><strong>Singleton (Tekil Nesne)</strong></td>
<td>Bir sınıfın yalnızca bir örneğe sahip olmasını global erişim noktasıyla sağlar</td>
</tr>
</tbody>
</table>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-9</footer>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="yap%C4%B1sal-desenler-structural-patterns-7">Yapısal Desenler (Structural Patterns) (7)</h2>
<p>Yapısal desenler (Structural Patterns), nesneleri ve sınıfları esnek ve verimli tutarak daha büyük yapılara nasıl birleştirileceğini açıklar.</p>
<table>
<thead>
<tr>
<th>Desen</th>
<th>Amaç</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Adapter (Adaptör)</strong></td>
<td>Uyumsuz arayüzlere sahip nesnelerin birlikte çalışmasını sağlar</td>
</tr>
<tr>
<td><strong>Bridge (Köprü)</strong></td>
<td>Büyük bir sınıfı iki hiyerarşiye böler (soyutlama + uygulama)</td>
</tr>
<tr>
<td><strong>Composite (Bileşik)</strong></td>
<td>Nesneleri ağaç yapılarında oluşturur</td>
</tr>
<tr>
<td><strong>Decorator (Dekoratör)</strong></td>
<td>Nesneleri sarmalayarak yeni davranışlar ekler</td>
</tr>
<tr>
<td><strong>Facade (Cephe)</strong></td>
<td>Bir kütüphane veya çerçeveye basitleştirilmiş bir arayüz sağlar</td>
</tr>
<tr>
<td><strong>Flyweight (Sinek Siklet)</strong></td>
<td>Ortak durumu paylaşarak RAM'e daha fazla nesne sığdırır</td>
</tr>
<tr>
<td><strong>Proxy (Vekil)</strong></td>
<td>Başka bir nesne için bir vekil veya yer tutucu sağlar</td>
</tr>
</tbody>
</table>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-9</footer>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="davran%C4%B1%C5%9Fsal-desenler-behavioral-patterns-10">Davranışsal Desenler (Behavioral Patterns) (10)</h2>
<p>Davranışsal desenler (Behavioral Patterns), nesneler arasındaki etkili iletişimi ve sorumluluk dağılımını ele alır.</p>
<table>
<thead>
<tr>
<th>Desen</th>
<th>Amaç</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Chain of Responsibility (Sorumluluk Zinciri)</strong></td>
<td>İstekleri bir işleyiciler zinciri boyunca iletir</td>
</tr>
<tr>
<td><strong>Command (Komut)</strong></td>
<td>Bir isteği bağımsız bir nesneye dönüştürür</td>
</tr>
<tr>
<td><strong>Iterator (Yineleyici)</strong></td>
<td>Bir koleksiyonun elemanlarını sırayla dolaşır</td>
</tr>
<tr>
<td><strong>Mediator (Arabulucu)</strong></td>
<td>Nesneler arasındaki kaotik bağımlılıkları azaltır</td>
</tr>
<tr>
<td><strong>Memento (Hatıra)</strong></td>
<td>Bir nesnenin önceki durumunu kaydeder ve geri yükler</td>
</tr>
<tr>
<td><strong>Observer (Gözlemci)</strong></td>
<td>Olay bildirimi için bir abonelik mekanizması tanımlar</td>
</tr>
<tr>
<td><strong>State (Durum)</strong></td>
<td>İç durum değiştiğinde davranışı değiştirir</td>
</tr>
<tr>
<td><strong>Strategy (Strateji)</strong></td>
<td>Birbiriyle değiştirilebilir algoritma ailesi tanımlar</td>
</tr>
<tr>
<td><strong>Template Method (Şablon Yöntemi)</strong></td>
<td>Bir algoritmanın iskeletini tanımlar; alt sınıflar adımları doldurur</td>
</tr>
<tr>
<td><strong>Visitor (Ziyaretçi)</strong></td>
<td>Algoritmaları üzerinde çalıştıkları nesnelerden ayırır</td>
</tr>
</tbody>
</table>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-9</footer>
</section>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="tasar%C4%B1m-desenlerini-neden-%C3%B6%C4%9Frenmeliyiz">Tasarım Desenlerini Neden Öğrenmeliyiz?</h2>
<ul>
<li><strong>Kanıtlanmış çözümler</strong>: Desenler, yaygın sorunlara yönelik denenmiş ve test edilmiş çözümlerdir. Bu sorunlarla hiç karşılaşmasanız bile, desenleri bilmek size NYP (Nesne Yönelimli Programlama) ilkelerini kullanarak sorunları nasıl çözeceğinizi öğretir.</li>
<li><strong>Ortak dil</strong>: Desenler paylaşılan bir kelime dağarcığı tanımlar. &quot;Bunun için bir Singleton kullan&quot; diyebilirsiniz ve herkes öneriyi hemen anlar.</li>
<li><strong>Daha iyi iletişim</strong>: Ekip üyeleri desenleri bildiğinde, tasarım hakkındaki iletişim daha hızlı ve daha kesin olur.</li>
<li><strong>Çerçeveleri anlama</strong>: Birçok çerçeve (framework) ve kütüphane tasarım desenleri kullanır. Desenleri anlamak, çerçevelerin nasıl çalıştığını kavramanıza yardımcı olur.</li>
<li><strong>Daha iyi kod yazma</strong>: Desenler daha esnek, yeniden kullanılabilir ve sürdürülebilir kod yazmanıza yardımcı olur.</li>
<li><strong>Kariyer gelişimi</strong>: Tasarım deseni bilgisi teknik mülakatlarda sıkça test edilir.</li>
</ul>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="tasar%C4%B1m-desenlerinin-faydalar%C4%B1">Tasarım Desenlerinin Faydaları</h2>
<ul>
<li><strong>Yeniden Kullanılabilirlik</strong>: Desenler, projeler arasında uyarlanabilen yeniden kullanılabilir çözümler sağlar.</li>
<li><strong>Sürdürülebilirlik</strong>: Desenlerle yapılandırılmış kod, anlaşılması ve değiştirilmesi daha kolaydır.</li>
<li><strong>Ölçeklenebilirlik</strong>: Desenler, yönetilemez hale gelmeden büyüyebilen sistemler tasarlamaya yardımcı olur.</li>
<li><strong>Esneklik</strong>: Desenler genellikle uygulamaları değiştirmeyi veya yeni özellikler eklemeyi kolaylaştırır.</li>
<li><strong>Belgeleme</strong>: Desenler, tasarım kararları için bir belgeleme biçimi görevi görür.</li>
</ul>
<h2 id="tasar%C4%B1m-desenlerine-y%C3%B6nelik-ele%C5%9Ftiriler">Tasarım Desenlerine Yönelik Eleştiriler</h2>
<ul>
<li><strong>Aşırı mühendislik</strong>: Basit kodun yeterli olduğu yerlerde desen kullanmak gereksiz karmaşıklık ekler.</li>
<li><strong>Dil sınırlamaları</strong>: Desenler genellikle eksik dil özelliklerini telafi eder (örn., birinci sınıf fonksiyonları olmayan dillerde Strategy).</li>
<li><strong>Yanlış kullanım</strong>: Bir soruna yanlış deseni uygulamak kodu iyileştirmek yerine kötüleştirebilir.</li>
<li><strong>Öğrenme eğrisi</strong>: Desenleri ne zaman ve nasıl uygulayacağınızı anlamak deneyim gerektirir.</li>
</ul>

<h2 id="mod%C3%BCl-a-%C3%B6zet">Modül A: Özet</h2>
<ul>
<li>Tasarım desenleri, yazılım tasarımında sıkça karşılaşılan sorunlara yönelik <strong>tipik çözümlerdir</strong>.</li>
<li>1994'te <strong>Dörtlü Çete (GoF)</strong> kitabı ile <strong>23 desen</strong> içinde popülerleştirilmişlerdir.</li>
<li>Desenler üç kategoriye ayrılır: <strong>Yaratımsal (Creational)</strong> (5), <strong>Yapısal (Structural)</strong> (7) ve <strong>Davranışsal (Behavioral)</strong> (10).</li>
<li>Her desenin şunları vardır: <strong>Amaç</strong>, <strong>Motivasyon</strong>, <strong>Yapı</strong>, <strong>Sözde Kod</strong>, <strong>Uygulanabilirlik</strong>, <strong>Uygulama</strong> ve <strong>İlişkiler</strong>.</li>
<li>Desenleri öğrenmek size <strong>ortak bir kelime dağarcığı</strong> kazandırır ve <strong>daha iyi, daha sürdürülebilir kod</strong> yazmanıza yardımcı olur.</li>
<li>Desenler düşünceli bir şekilde uygulanmalıdır; <strong>aşırı mühendislik</strong> ve <strong>yanlış kullanım</strong> gerçek risklerdir.</li>
<li>Bu haftada <strong>5 Yaratımsal Desen</strong>e odaklanıyoruz: Factory Method, Abstract Factory, Builder, Prototype ve Singleton.</li>
</ul>

<h2 id="factory-method-fabrika-y%C3%B6ntemi-deseni---genel-bak%C4%B1%C5%9F">Factory Method (Fabrika Yöntemi) Deseni - Genel Bakış</h2>
<ul>
<li><strong>Diğer Adı</strong>: Virtual Constructor (Sanal Yapıcı)</li>
<li><strong>Kategori</strong>: Yaratımsal Desen (Creational Pattern)</li>
<li><strong>Karmaşıklık</strong>: Düşük</li>
<li><strong>Popülerlik</strong>: Yüksek</li>
</ul>
<p><strong>Amaç</strong>: Factory Method (Fabrika Yöntemi), bir üst sınıfta nesne oluşturmak için bir arayüz sağlayan, ancak alt sınıfların oluşturulacak nesnelerin türünü değiştirmesine izin veren bir yaratımsal tasarım desenidir.</p>
<p>Referans: <a href="https://refactoring.guru/design-patterns/factory-method">RefactoringGuru - Factory Method</a></p>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="factory-method-fabrika-y%C3%B6ntemi---problem">Factory Method (Fabrika Yöntemi) - Problem</h2>
<p>Bir lojistik yönetim uygulaması oluşturduğunuzu düşünün. Uygulamanızın ilk sürümü yalnızca kamyonla taşımacılığı destekleyebilir, bu nedenle kodunuzun büyük kısmı <code>Truck</code> sınıfının içinde bulunur.</p>
<p>Bir süre sonra uygulamanız oldukça popüler olur. Her gün deniz taşımacılığı şirketlerinden deniz lojistiğini uygulamaya dahil etme talepleri alırsınız.</p>
<p><strong><code>Ship</code> sınıfını doğrudan eklerseniz ne olur?</strong></p>
<ul>
<li>Kodun geri kalanı zaten mevcut sınıflara bağlıysa yeni bir sınıf eklemek o kadar basit değildir.</li>
<li>Kodunuzun büyük kısmı <code>Truck</code> sınıfına bağlıdır.</li>
<li><code>Ship</code> eklemek tüm kod tabanında değişiklik yapmayı gerektirir.</li>
<li>Daha sonra başka bir taşıma türü eklemek, tüm bu değişiklikleri yeniden yapmayı gerektirir.</li>
<li>Sonuç: taşıma nesnelerinin sınıfına göre davranışı değiştiren koşullarla dolu oldukça çirkin bir kod.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-9</footer>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="factory-method-fabrika-y%C3%B6ntemi---%C3%A7%C3%B6z%C3%BCm">Factory Method (Fabrika Yöntemi) - Çözüm</h2>
<p>Factory Method deseni, doğrudan nesne oluşturma çağrılarını (<code>new</code> operatörü kullanarak) özel bir <strong>fabrika yöntemine</strong> yapılan çağrılarla değiştirmenizi önerir.</p>
<ul>
<li>Nesneler hala <code>new</code> operatörü ile oluşturulur, ancak bu işlem fabrika yöntemi içinden çağrılır.</li>
<li>Bir fabrika yöntemi tarafından döndürülen nesneler genellikle <strong>ürünler (products)</strong> olarak adlandırılır.</li>
</ul>
<p><strong>Temel içgörü</strong>: Alt sınıflar, oluşturulan ürünlerin sınıfını değiştirmek için fabrika yöntemini geçersiz kılabilir (override).</p>
<ul>
<li>Küçük bir sınırlama vardır: alt sınıflar, yalnızca bu ürünlerin <strong>ortak bir temel sınıfı veya arayüzü</strong> varsa farklı türde ürünler döndürebilir.</li>
<li>Ayrıca, temel sınıftaki fabrika yönteminin dönüş türü bu arayüz olarak bildirilmelidir.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-9</footer>

<h2 id="factory-method-fabrika-y%C3%B6ntemi---%C3%A7%C3%B6z%C3%BCm-diyagram%C4%B1">Factory Method (Fabrika Yöntemi) - Çözüm Diyagramı</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">                    Creator
              ┌─────────────────┐
              │ someOperation() │
              │ createProduct() │──── Product p = createProduct()
              └────────┬────────┘
                       │
           ┌───────────┴───────────┐
           │                       │
  ConcreteCreatorA          ConcreteCreatorB
  ┌────────────────┐       ┌────────────────┐
  │createProduct() │       │createProduct() │
  │ return new     │       │ return new     │
  │ ConcreteA()    │       │ ConcreteB()    │
  └────────────────┘       └────────────────┘
</code></pre>
<ul>
<li><code>Creator</code> sınıfı <code>createProduct()</code> fabrika yöntemine sahiptir.</li>
<li>Her <code>ConcreteCreator</code> farklı bir ürün türü döndürmek için fabrika yöntemini geçersiz kılar.</li>
<li>Tüm ürünler aynı arayüzü uygular.</li>
</ul>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="factory-method-fabrika-y%C3%B6ntemi---yap%C4%B1">Factory Method (Fabrika Yöntemi) - Yapı</h2>
<p>Factory Method deseninin dört temel katılımcısı vardır:</p>
<ol>
<li>
<p><strong>Product (Ürün)</strong> (Arayüz/Soyut Sınıf)</p>
<ul>
<li>Fabrika yönteminin üretebileceği tüm nesneler için ortak arayüzü bildirir.</li>
</ul>
</li>
<li>
<p><strong>Concrete Products (Somut Ürünler)</strong></p>
<ul>
<li>Ürün arayüzünün farklı uygulamaları.</li>
</ul>
</li>
<li>
<p><strong>Creator (Yaratıcı)</strong> (Soyut Sınıf)</p>
<ul>
<li>Yeni ürün nesneleri döndüren fabrika yöntemini bildirir. Dönüş türü ürün arayüzüyle eşleşmelidir.</li>
<li>Ürün nesnelerine dayanan bazı temel iş mantığı içerebilir.</li>
</ul>
</li>
<li>
<p><strong>Concrete Creators (Somut Yaratıcılar)</strong></p>
<ul>
<li>Farklı türde ürün döndürmek için temel fabrika yöntemini geçersiz kılar.</li>
<li>Fabrika yönteminin her zaman yeni örnekler oluşturması gerekmez; ayrıca bir önbellekten, nesne havuzundan veya başka bir kaynaktan mevcut nesneleri de döndürebilir.</li>
</ul>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-9</footer>

<h2 id="factory-method-fabrika-y%C3%B6ntemi---s%C3%B6zde-kod">Factory Method (Fabrika Yöntemi) - Sözde Kod</h2>
<p>Bu örnek, Factory Method'un istemci kodunu somut UI sınıflarına bağlamadan çapraz platform UI elemanları oluşturmak için nasıl kullanılabileceğini göstermektedir.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">// The creator class declares the factory method
// that must return an object of a product class.
class Dialog is
    abstract method createButton(): Button

    method render() is
        Button okButton = createButton()
        okButton.onClick(closeDialog)
        okButton.render()

// Concrete creators override the factory method
class WindowsDialog extends Dialog is
    method createButton(): Button is
        return new WindowsButton()

class WebDialog extends Dialog is

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="factory-method-fabrika-y%C3%B6ntemi---uygulanabilirlik">Factory Method (Fabrika Yöntemi) - Uygulanabilirlik</h2>
<p>Factory Method desenini şu durumlarda kullanın:</p>
<ol>
<li>
<p><strong>Kodunuzun çalışması gereken nesnelerin kesin türlerini ve bağımlılıklarını önceden bilmediğinizde.</strong></p>
<ul>
<li>Factory Method, ürün oluşturma kodunu ürünü gerçekten kullanan koddan ayırır. Bu nedenle ürün oluşturma kodunu, kodun geri kalanından bağımsız olarak genişletmek daha kolaydır.</li>
</ul>
</li>
<li>
<p><strong>Kütüphanenizin veya çerçevenizin kullanıcılarına iç bileşenlerini genişletme yolu sağlamak istediğinizde.</strong></p>
<ul>
<li>Kullanıcılar çerçeve sınıflarınızı alt sınıflayabilir ve kendi türleriyle genişletmek için fabrika yöntemlerini geçersiz kılabilir.</li>
</ul>
</li>
<li>
<p><strong>Her seferinde yeniden oluşturmak yerine mevcut nesneleri yeniden kullanarak sistem kaynaklarını tasarruf etmek istediğinizde.</strong></p>
<ul>
<li>Yeni nesneler oluşturmanın yanı sıra mevcut olanları yeniden kullanabilen düzenli bir yönteme ihtiyacınız var. Bu, tam da bir fabrika yöntemine benzer.</li>
</ul>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-9</footer>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="factory-method-fabrika-y%C3%B6ntemi---nas%C4%B1l-uygulan%C4%B1r">Factory Method (Fabrika Yöntemi) - Nasıl Uygulanır</h2>
<ol>
<li>
<p><strong>Tüm ürünleri aynı arayüzü takip ettirin.</strong> Bu arayüz, her üründe anlamlı olan yöntemleri bildirmelidir.</p>
</li>
<li>
<p><strong>Yaratıcı sınıfın içine boş bir fabrika yöntemi ekleyin.</strong> Yöntemin dönüş türü ortak ürün arayüzüyle eşleşmelidir.</p>
</li>
<li>
<p><strong>Yaratıcının kodunda, ürün yapıcılarına yapılan tüm referansları bulun.</strong> Bunları tek tek fabrika yöntemine yapılan çağrılarla değiştirin ve ürün oluşturma kodunu fabrika yöntemine çıkarın.</p>
</li>
<li>
<p><strong>Fabrika yönteminde listelenen her ürün türü için bir somut yaratıcı alt sınıf kümesi oluşturun.</strong> Alt sınıflarda fabrika yöntemini geçersiz kılın ve temel yöntemden uygun oluşturma kodu parçalarını çıkarın.</p>
</li>
<li>
<p><strong>Çok fazla ürün türü varsa</strong> ve hepsi için alt sınıf oluşturmak mantıklı değilse, alt sınıflarda temel sınıftaki kontrol parametresini yeniden kullanabilirsiniz.</p>
</li>
<li>
<p><strong>Tüm çıkarmalardan sonra temel fabrika yöntemi boş kaldıysa</strong>, onu soyut yapabilirsiniz. Geriye kalan bir şey varsa, bunu yöntemin varsayılan davranışı yapabilirsiniz.</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-9</footer>

<h2 id="factory-method-fabrika-y%C3%B6ntemi---art%C4%B1lar-ve-eksiler">Factory Method (Fabrika Yöntemi) - Artılar ve Eksiler</h2>
<h3 id="art%C4%B1lar">Artılar</h3>
<ul>
<li><strong>Sıkı bağımlılıktan kaçınır</strong>: yaratıcı ile somut ürünler arasında.</li>
<li><strong>Tek Sorumluluk İlkesi (SRP)</strong>: Ürün oluşturma kodunu programda tek bir yere taşıyabilirsiniz, bu da kodun desteklenmesini kolaylaştırır.</li>
<li><strong>Açık/Kapalı İlkesi (OCP)</strong>: Mevcut istemci kodunu bozmadan programa yeni ürün türleri ekleyebilirsiniz.</li>
</ul>
<h3 id="eksiler">Eksiler</h3>
<ul>
<li><strong>Kod karmaşıklığı artar</strong>: Deseni uygulamak için birçok yeni alt sınıf tanıtmanız gerektiğinden kod daha karmaşık hale gelebilir. En iyi senaryo, deseni mevcut bir yaratıcı sınıf hiyerarşisine dahil ettiğiniz zamandır.</li>
</ul>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="factory-method-fabrika-y%C3%B6ntemi---di%C4%9Fer-desenlerle-i%CC%87li%C5%9Fkiler">Factory Method (Fabrika Yöntemi) - Diğer Desenlerle İlişkiler</h2>
<ul>
<li>
<p>Birçok tasarım <strong>Factory Method</strong> ile başlar (daha az karmaşık, alt sınıflar aracılığıyla daha fazla özelleştirilebilir) ve <strong>Abstract Factory</strong>, <strong>Prototype</strong> veya <strong>Builder</strong>'a doğru evrilir (daha esnek, ancak daha karmaşık).</p>
</li>
<li>
<p><strong>Abstract Factory</strong> sınıfları genellikle bir dizi <strong>Factory Method</strong> üzerine kurulur, ancak bu sınıflardaki yöntemleri oluşturmak için <strong>Prototype</strong> da kullanabilirsiniz.</p>
</li>
<li>
<p>Koleksiyon alt sınıflarının koleksiyonlarla uyumlu farklı türde yineleyiciler döndürmesini sağlamak için <strong>Factory Method</strong>'u <strong>Iterator</strong> ile birlikte kullanabilirsiniz.</p>
</li>
<li>
<p><strong>Prototype</strong> kalıtıma dayalı değildir, bu nedenle dezavantajları yoktur. Öte yandan, Prototype, klonlanan nesnenin karmaşık bir başlatılmasını gerektirir. <strong>Factory Method</strong> kalıtıma dayalıdır ancak bir başlatma adımı gerektirmez.</p>
</li>
<li>
<p><strong>Factory Method</strong>, <strong>Template Method</strong>'un bir özelleştirmesidir. Aynı zamanda, bir Factory Method büyük bir Template Method'da bir adım olarak hizmet edebilir.</p>
</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-9</footer>

<h2 id="factory-method-fabrika-y%C3%B6ntemi---java-kod-%C3%B6rne%C4%9Fi-devam">Factory Method (Fabrika Yöntemi) - Java Kod Örneği (devam)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Creator (abstract)</span>
<span class="hljs-keyword">abstract</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Logistics</span> {
    <span class="hljs-comment">// Factory Method</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">abstract</span> Transport <span class="hljs-title function_">createTransport</span><span class="hljs-params">()</span>;

    <span class="hljs-comment">// Business logic that uses the factory method</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">planDelivery</span><span class="hljs-params">()</span> {
        <span class="hljs-type">Transport</span> <span class="hljs-variable">transport</span> <span class="hljs-operator">=</span> createTransport();
        System.out.println(<span class="hljs-string">&quot;Planning delivery...&quot;</span>);
        transport.deliver();
    }
}

<span class="hljs-comment">// Concrete Creators</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">RoadLogistics</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Logistics</span> {
    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> Transport <span class="hljs-title function_">createTransport</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Truck</span>();

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="mod%C3%BCl-b-%C3%B6zet">Modül B: Özet</h2>
<ul>
<li><strong>Factory Method (Fabrika Yöntemi)</strong>, bir üst sınıfta nesne oluşturmak için bir arayüz sağlar, ancak alt sınıfların oluşturulan nesnelerin türünü değiştirmesine izin verir.</li>
<li>Yaratıcı kod ile somut ürün sınıfları arasındaki <strong>sıkı bağımlılık</strong> sorununu çözer.</li>
<li>Desen <strong>dört katılımcı</strong> kullanır: Product (Ürün) arayüzü, Concrete Products (Somut Ürünler), Creator (Yaratıcı) sınıfı ve Concrete Creators (Somut Yaratıcılar).</li>
<li>Factory Method, <strong>Açık/Kapalı İlkesini</strong> (mevcut kodu değiştirmeden yeni ürünler) ve <strong>Tek Sorumluluk İlkesini</strong> (merkezi oluşturma mantığı) destekler.</li>
<li>Genellikle Abstract Factory veya Prototype gibi daha karmaşık desenler için <strong>başlangıç noktasıdır</strong>.</li>
<li>Ana ödünleşim, kod tabanındaki <strong>artan alt sınıf sayısıdır</strong>.</li>
<li>Factory Method, <strong>Template Method</strong> deseninin bir özelleştirmesidir.</li>
</ul>

<h2 id="abstract-factory-soyut-fabrika-deseni---genel-bak%C4%B1%C5%9F">Abstract Factory (Soyut Fabrika) Deseni - Genel Bakış</h2>
<ul>
<li><strong>Kategori</strong>: Yaratımsal Desen (Creational Pattern)</li>
<li><strong>Karmaşıklık</strong>: Orta</li>
<li><strong>Popülerlik</strong>: Yüksek</li>
</ul>
<p><strong>Amaç</strong>: Abstract Factory (Soyut Fabrika), somut sınıflarını belirtmeden <strong>ilişkili nesne aileleri</strong> üretmenizi sağlayan bir yaratımsal tasarım desenidir.</p>
<p>Referans: <a href="https://refactoring.guru/design-patterns/abstract-factory">RefactoringGuru - Abstract Factory</a></p>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="abstract-factory-soyut-fabrika---problem">Abstract Factory (Soyut Fabrika) - Problem</h2>
<p>Bir mobilya mağazası simülatörü oluşturduğunuzu düşünün. Kodunuz şunları temsil eden sınıflardan oluşur:</p>
<ul>
<li>İlişkili ürünlerden oluşan bir aile, örneğin: <code>Chair</code> + <code>Sofa</code> + <code>CoffeeTable</code>.</li>
<li>Bu ailenin birkaç varyantı. Örneğin, <code>Chair</code> + <code>Sofa</code> + <code>CoffeeTable</code> ürünleri şu varyantlarda mevcuttur: <strong>Modern</strong>, <strong>Victorian</strong>, <strong>ArtDeco</strong>.</li>
</ul>
<p>Ürünlerin aynı ailedeki diğer nesnelerle eşleşmesi için bireysel mobilya nesneleri oluşturmanın bir yoluna ihtiyacınız var. Müşteriler uyumsuz mobilya aldıklarında oldukça kızarlar.</p>
<p><strong>Doğrudan oluşturmayla ilgili sorunlar:</strong></p>
<ul>
<li>Yeni ürünler veya ürün aileleri eklerken mevcut kodu değiştirmek istemezsiniz.</li>
<li>Mobilya satıcıları kataloglarını çok sık günceller ve her seferinde çekirdek kodu değiştirmek istemezsiniz.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-9</footer>

<h2 id="abstract-factory-soyut-fabrika---%C3%A7%C3%B6z%C3%BCm">Abstract Factory (Soyut Fabrika) - Çözüm</h2>
<p>Abstract Factory deseni şunları önerir:</p>
<ol>
<li>
<p><strong>Her farklı ürün için açıkça arayüzler bildirin</strong> (örn., <code>Chair</code>, <code>Sofa</code>, <code>CoffeeTable</code>).</p>
</li>
<li>
<p><strong>Tüm ürün varyantlarını</strong> bu arayüzleri takip ettirin. Örneğin, tüm sandalye varyantları <code>Chair</code> arayüzünü uygular; tüm sehpalar <code>CoffeeTable</code> arayüzünü uygular vb.</p>
</li>
<li>
<p><strong>Abstract Factory'yi bildirin</strong> -- ürün ailesinin parçası olan tüm ürünler için oluşturma yöntemlerinin bir listesini içeren bir arayüz (örn., <code>createChair</code>, <code>createSofa</code>, <code>createCoffeeTable</code>).</p>
</li>
<li>
<p><strong>Her ürün ailesi varyantı için ayrı fabrika sınıfları oluşturun.</strong> Bir fabrika, belirli bir türde ürünler döndüren bir sınıftır. Örneğin, <code>ModernFurnitureFactory</code> yalnızca <code>ModernChair</code>, <code>ModernSofa</code> ve <code>ModernCoffeeTable</code> nesneleri oluşturabilir.</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-9</footer>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">         AbstractFactory

ModernFactory              VictorianFactory

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="abstract-factory-soyut-fabrika---yap%C4%B1">Abstract Factory (Soyut Fabrika) - Yapı</h2>
<p>Abstract Factory deseninin beş temel katılımcısı vardır:</p>
<ol>
<li>
<p><strong>Abstract Products (Soyut Ürünler)</strong>: bir ürün ailesini oluşturan farklı ancak ilişkili ürün kümesi için arayüzler bildirir.</p>
</li>
<li>
<p><strong>Concrete Products (Somut Ürünler)</strong>: soyut ürünlerin varyantlara göre gruplandırılmış çeşitli uygulamalarıdır. Her soyut ürün (sandalye/kanepe) tüm verilen varyantlarda (Victorian/Modern) uygulanmalıdır.</p>
</li>
<li>
<p><strong>Abstract Factory (Soyut Fabrika)</strong> arayüzü: her bir soyut ürünü oluşturmak için bir dizi yöntem bildirir.</p>
</li>
<li>
<p><strong>Concrete Factories (Somut Fabrikalar)</strong>: soyut fabrikanın oluşturma yöntemlerini uygular. Her somut fabrika belirli bir ürün varyantına karşılık gelir ve yalnızca bu ürün varyantlarını oluşturur.</p>
</li>
<li>
<p><strong>Client (İstemci)</strong>: hem fabrikalar hem de ürünlerle soyut arayüzler aracılığıyla çalışır. Bu, istemcinin somut sınıflara bağlanmadan herhangi bir fabrika/ürün varyantıyla çalışmasına olanak tanır.</p>
</li>
</ol>

<h2 id="abstract-factory-soyut-fabrika---s%C3%B6zde-kod">Abstract Factory (Soyut Fabrika) - Sözde Kod</h2>
<p>Bu örnek, Abstract Factory deseninin istemci kodunu somut UI sınıflarına bağlamadan çapraz platform UI elemanları oluşturmak için nasıl kullanılabileceğini göstermektedir.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">// The abstract factory interface declares a set of methods
// that return different abstract products.
interface GUIFactory is
    method createButton(): Button
    method createCheckbox(): Checkbox

// Concrete factories produce a family of products that
// belong to a single variant.
class WinFactory implements GUIFactory is
    method createButton(): Button is
        return new WinButton()
    method createCheckbox(): Checkbox is
        return new WinCheckbox()

class MacFactory implements GUIFactory is
    method createButton(): Button is
        return new MacButton()
    method createCheckbox(): Checkbox is
        return new MacCheckbox()
</code></pre>

<h2 id="abstract-factory-soyut-fabrika---s%C3%B6zde-kod-devam-1">Abstract Factory (Soyut Fabrika) - Sözde Kod (devam)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">// The client code works with factories and products
// only through abstract types: GUIFactory, Button, Checkbox.
class Application is
    private field factory: GUIFactory
    private field button: Button

    constructor Application(factory: GUIFactory) is
        this.factory = factory

    method createUI() is
        this.button = factory.createButton()

    method paint() is
        button.paint()

// The application picks the factory type depending on
// the current configuration or environment settings.
class ApplicationConfigurator is
    method main() is
        config = readApplicationConfigFile()
        if (config.OS == &quot;Windows&quot;) then
            factory = new WinFactory()
        else if (config.OS == &quot;Mac&quot;) then
            factory = new MacFactory()
        else
            throw new Exception(&quot;Error! Unknown OS.&quot;)
        Application app = new Application(factory)
</code></pre>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="abstract-factory-soyut-fabrika---uygulanabilirlik">Abstract Factory (Soyut Fabrika) - Uygulanabilirlik</h2>
<p>Abstract Factory desenini şu durumlarda kullanın:</p>
<ol>
<li>
<p><strong>Kodunuzun çeşitli ilişkili ürün aileleriyle çalışması gerektiğinde</strong>, ancak bu ürünlerin somut sınıflarına bağımlı olmak istemediğinizde -- önceden bilinmeyebilirler veya gelecekteki genişletilebilirliğe izin vermek isteyebilirsiniz.</p>
<ul>
<li>Abstract Factory, ürün ailesinin her sınıfından nesne oluşturmak için bir arayüz sağlar. Kodunuz nesneleri bu arayüz aracılığıyla oluşturduğu sürece, uygulamanız tarafından zaten oluşturulan ürünlerle eşleşmeyen yanlış bir ürün varyantı oluşturma konusunda endişelenmenize gerek yoktur.</li>
</ul>
</li>
<li>
<p><strong>Bir sınıfın birincil sorumluluğunu bulanıklaştıran bir dizi Factory Method'a sahip olduğunuzda.</strong></p>
<ul>
<li>İyi tasarlanmış bir programda, her sınıf yalnızca bir şeyden sorumludur (SRP). Bir sınıf birden fazla ürün türüyle ilgilendiğinde, fabrika yöntemlerini bağımsız bir fabrika sınıfına veya tam kapsamlı bir Abstract Factory uygulamasına çıkarmaya değer olabilir.</li>
</ul>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-9</footer>
</section>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="abstract-factory-soyut-fabrika---nas%C4%B1l-uygulan%C4%B1r">Abstract Factory (Soyut Fabrika) - Nasıl Uygulanır</h2>
<ol>
<li>
<p><strong>Farklı ürün türleri ile bu ürünlerin varyantlarının bir matrisini çıkarın.</strong></p>
</li>
<li>
<p><strong>Tüm ürün türleri için soyut ürün arayüzleri bildirin.</strong> Ardından tüm somut ürün sınıflarının bu arayüzleri uygulamasını sağlayın.</p>
</li>
<li>
<p><strong>Tüm soyut ürünler için bir dizi oluşturma yöntemi içeren soyut fabrika arayüzünü bildirin.</strong></p>
</li>
<li>
<p><strong>Her ürün varyantı için bir somut fabrika sınıfı kümesi uygulayın.</strong></p>
</li>
<li>
<p><strong>Uygulamada bir yerde fabrika başlatma kodu oluşturun.</strong> Uygulama yapılandırmasına veya mevcut ortama bağlı olarak somut fabrika sınıflarından birini örneklemelidir. Bu fabrika nesnesini ürün oluşturan tüm sınıflara iletin.</p>
</li>
<li>
<p><strong>Kodu tarayın</strong> ve ürün yapıcılarına yapılan tüm doğrudan çağrıları bulun. Bunları fabrika nesnesindeki uygun oluşturma yöntemi çağrılarıyla değiştirin.</p>
</li>
</ol>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="abstract-factory-soyut-fabrika---art%C4%B1lar-ve-eksiler">Abstract Factory (Soyut Fabrika) - Artılar ve Eksiler</h2>
<h3 id="art%C4%B1lar-1">Artılar</h3>
<ul>
<li><strong>Uyumluluk garantisi</strong>: Bir fabrikadan aldığınız ürünlerin birbirleriyle uyumlu olduğundan emin olabilirsiniz.</li>
<li><strong>Sıkı bağımlılıktan kaçınır</strong>: somut ürünler ve istemci kodu arasında.</li>
<li><strong>Tek Sorumluluk İlkesi (SRP)</strong>: Ürün oluşturma kodunu tek bir yere çıkarabilirsiniz, bu da kodun desteklenmesini kolaylaştırır.</li>
<li><strong>Açık/Kapalı İlkesi (OCP)</strong>: Mevcut istemci kodunu bozmadan yeni ürün varyantları ekleyebilirsiniz.</li>
</ul>
<h3 id="eksiler-1">Eksiler</h3>
<ul>
<li><strong>Artan karmaşıklık</strong>: Desenle birlikte çok sayıda yeni arayüz ve sınıf tanıtıldığından kod olması gerekenden daha karmaşık hale gelebilir.</li>
</ul>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="abstract-factory-soyut-fabrika---di%C4%9Fer-desenlerle-i%CC%87li%C5%9Fkiler">Abstract Factory (Soyut Fabrika) - Diğer Desenlerle İlişkiler</h2>
<ul>
<li>
<p>Birçok tasarım <strong>Factory Method</strong> ile başlar (daha az karmaşık, alt sınıflar aracılığıyla daha fazla özelleştirilebilir) ve <strong>Abstract Factory</strong>, <strong>Prototype</strong> veya <strong>Builder</strong>'a doğru evrilir (daha esnek, ancak daha karmaşık).</p>
</li>
<li>
<p><strong>Builder</strong> karmaşık nesneleri adım adım oluşturmaya odaklanır. <strong>Abstract Factory</strong> ilişkili nesne aileleri oluşturmada uzmanlaşır. Abstract Factory ürünü hemen döndürürken, Builder ürünü almadan önce bazı ek inşa adımları çalıştırmanıza izin verir.</p>
</li>
<li>
<p><strong>Abstract Factory</strong> sınıfları genellikle bir dizi <strong>Factory Method</strong> üzerine kurulur, ancak bu sınıflardaki yöntemleri oluşturmak için <strong>Prototype</strong> da kullanabilirsiniz.</p>
</li>
<li>
<p><strong>Abstract Factory</strong>, alt sistem nesnelerinin nasıl oluşturulduğunu istemci kodundan gizlemek istediğinizde <strong>Facade</strong>'a alternatif olarak hizmet edebilir.</p>
</li>
<li>
<p><strong>Abstract Factory</strong>'yi <strong>Bridge</strong> ile birlikte kullanabilirsiniz. Bu eşleştirme, Bridge tarafından tanımlanan bazı soyutlamaların yalnızca belirli uygulamalarla çalışabildiği durumlarda faydalıdır.</p>
</li>
<li>
<p><strong>Abstract Factories</strong>, <strong>Builders</strong> ve <strong>Prototypes</strong>'ın tümü <strong>Singletons</strong> olarak uygulanabilir.</p>
</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-9</footer>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="mod%C3%BCl-c-%C3%B6zet">Modül C: Özet</h2>
<ul>
<li><strong>Abstract Factory (Soyut Fabrika)</strong>, somut sınıflarını belirtmeden ilişkili nesne aileleri üretmenizi sağlar.</li>
<li>Bir aile içinde <strong>ürün uyumluluğunu</strong> sağlama sorununu çözer (örn., Modern sandalye + Modern kanepe, asla stilleri karıştırmamak).</li>
<li>Desen <strong>beş katılımcı</strong> kullanır: Abstract Products (Soyut Ürünler), Concrete Products (Somut Ürünler), Abstract Factory (Soyut Fabrika), Concrete Factories (Somut Fabrikalar) ve Client (İstemci).</li>
<li><strong>OCP</strong>'yi (mevcut kodu değiştirmeden yeni aileler ekleme) ve <strong>SRP</strong>'yi (ürün oluşturma merkezileştirilmiş) destekler.</li>
<li>Abstract Factory genellikle dahili olarak <strong>Factory Methods</strong> kullanılarak uygulanır ve oluşturma için <strong>Prototype</strong> da kullanılabilir.</li>
<li>Ana ödünleşim <strong>artan arayüz ve sınıf sayısıdır</strong>.</li>
<li>Abstract Factories, Builders ve Prototypes'ın tümü <strong>Singletons</strong> olarak uygulanabilir.</li>
</ul>

<h2 id="builder-i%CC%87n%C5%9Faat%C3%A7%C4%B1-deseni---genel-bak%C4%B1%C5%9F">Builder (İnşaatçı) Deseni - Genel Bakış</h2>
<ul>
<li><strong>Kategori</strong>: Yaratımsal Desen (Creational Pattern)</li>
<li><strong>Karmaşıklık</strong>: Orta</li>
<li><strong>Popülerlik</strong>: Yüksek</li>
</ul>
<p><strong>Amaç</strong>: Builder (İnşaatçı), karmaşık nesneleri adım adım oluşturmanıza olanak tanıyan bir yaratımsal tasarım desenidir. Desen, aynı oluşturma kodunu kullanarak bir nesnenin farklı türlerini ve temsillerini üretmenize izin verir.</p>
<p>Referans: <a href="https://refactoring.guru/design-patterns/builder">RefactoringGuru - Builder</a></p>

<h2 id="builder-i%CC%87n%C5%9Faat%C3%A7%C4%B1---problem-alt-s%C4%B1n%C4%B1f-patlamas%C4%B1">Builder (İnşaatçı) - Problem (Alt Sınıf Patlaması)</h2>
<p>Birçok alanın ve iç içe geçmiş nesnelerin zahmetli, adım adım başlatılmasını gerektiren karmaşık bir nesne düşünün. Bu tür başlatma kodu genellikle çok sayıda parametreli devasa bir yapıcının içine gömülür. Hatta daha kötüsü: istemci kodunun her yerine dağılmıştır.</p>
<p><strong>Örnek</strong>: Bir <code>House</code> nesnesi oluşturmak.</p>
<ul>
<li>Basit bir evin duvarlara, zemine, kapıya, pencerelere ve çatıya ihtiyacı vardır.</li>
<li>Peki ya arka bahçesi, yüzme havuzu, garajı ve diğer güzellikleri olan daha büyük, daha aydınlık bir ev istiyorsanız?</li>
</ul>
<p>En basit çözüm, temel <code>House</code> sınıfını genişletmek ve her parametre kombinasyonu için alt sınıflar oluşturmaktır. Ancak sonunda <strong>önemli sayıda alt sınıfla</strong> karşı karşıya kalırsınız. Herhangi bir yeni parametre, bu hiyerarşiyi daha da büyütmeyi gerektirecektir.</p>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="builder-i%CC%87n%C5%9Faat%C3%A7%C4%B1---%C3%A7%C3%B6z%C3%BCm">Builder (İnşaatçı) - Çözüm</h2>
<p>Builder deseni, nesne oluşturma kodunu kendi sınıfından çıkarıp <strong>builder (inşaatçı)</strong> adı verilen ayrı nesnelere taşımanızı önerir.</p>
<p>Desen, nesne oluşturmayı bir dizi adım halinde düzenler (<code>buildWalls</code>, <code>buildDoor</code> vb.). Bir nesne oluşturmak için bir builder nesnesi üzerinde bu adımlardan bir dizi çalıştırırsınız. Önemli olan şudur: <strong>tüm adımları çağırmanız gerekmez</strong>. Yalnızca bir nesnenin belirli bir yapılandırmasını üretmek için gerekli olan adımları çağırabilirsiniz.</p>
<p><strong>Director (Yönetici)</strong> (isteğe bağlı): Builder adımlarına yapılan bir dizi çağrıyı <strong>director</strong> adı verilen ayrı bir sınıfa daha fazla çıkarabilirsiniz. Director, inşa adımlarının hangi sırayla çalıştırılacağını tanımlarken, builder bu adımların uygulamasını sağlar.</p>
<ul>
<li>Bir director sınıfına sahip olmak kesinlikle gerekli değildir.</li>
<li>Ancak director sınıfı, çeşitli oluşturma rutinlerini koyarak programınız genelinde yeniden kullanabilmeniz için iyi bir yer olabilir.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-9</footer>
</section>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="builder-i%CC%87n%C5%9Faat%C3%A7%C4%B1---yap%C4%B1">Builder (İnşaatçı) - Yapı</h2>
<p>Builder deseninin beş temel katılımcısı vardır:</p>
<ol>
<li>
<p><strong>Builder Interface (İnşaatçı Arayüzü)</strong>: tüm builder türleri için ortak olan ürün oluşturma adımlarını bildirir.</p>
</li>
<li>
<p><strong>Concrete Builders (Somut İnşaatçılar)</strong>: oluşturma adımlarının farklı uygulamalarını sağlar. Somut builder'lar ortak arayüzü takip etmeyen ürünler üretebilir.</p>
</li>
<li>
<p><strong>Products (Ürünler)</strong>: elde edilen nesnelerdir. Farklı builder'lar tarafından oluşturulan ürünlerin aynı sınıf hiyerarşisine veya arayüze ait olması gerekmez.</p>
</li>
<li>
<p><strong>Director (Yönetici)</strong> (isteğe bağlı): oluşturma adımlarının hangi sırayla çağrılacağını tanımlar, böylece belirli ürün yapılandırmalarını oluşturabilir ve yeniden kullanabilirsiniz.</p>
</li>
<li>
<p><strong>Client (İstemci)</strong>: builder nesnelerinden birini director ile ilişkilendirmelidir (veya builder'ı doğrudan kullanır). Genellikle bu işlem, director'ın yapıcısının parametreleri aracılığıyla yalnızca bir kez yapılır.</p>
</li>
</ol>

<h2 id="builder-i%CC%87n%C5%9Faat%C3%A7%C4%B1---uygulanabilirlik">Builder (İnşaatçı) - Uygulanabilirlik</h2>
<p>Builder desenini şu durumlarda kullanın:</p>
<ol>
<li>
<p><strong>&quot;Teleskopik yapıcı&quot;dan kurtulmak istediğinizde.</strong></p>
<ul>
<li>Builder deseni, nesneleri adım adım, yalnızca gerçekten ihtiyaç duyduğunuz adımları kullanarak oluşturmanıza olanak tanır. Deseni uyguladıktan sonra yapıcılarınıza düzinelerce parametre tıkıştırmanız gerekmez.</li>
</ul>
</li>
<li>
<p><strong>Kodunuzun bir ürünün farklı temsillerini oluşturabilmesini istediğinizde</strong> (örn., taş ve ahşap evler).</p>
<ul>
<li>Builder deseni, ürünün çeşitli temsillerinin oluşturulması yalnızca ayrıntılarda farklılık gösteren benzer adımları içerdiğinde uygulanabilir.</li>
<li>Temel builder arayüzü tüm olası oluşturma adımlarını tanımlar ve somut builder'lar ürünün belirli temsillerini oluşturmak için bu adımları uygular.</li>
</ul>
</li>
<li>
<p><strong>Composite (Bileşik) ağaçları veya diğer karmaşık nesneleri oluşturmak istediğinizde.</strong></p>
<ul>
<li>Builder deseni, ürünleri adım adım oluşturmanıza olanak tanır. Son ürünü bozmadan bazı adımların çalıştırılmasını erteleyebilirsiniz. Hatta adımları özyinelemeli olarak bile çağırabilirsiniz, bu da bir nesne ağacı oluşturmanız gerektiğinde kullanışlı olur.</li>
</ul>
</li>
</ol>

<h2 id="builder-i%CC%87n%C5%9Faat%C3%A7%C4%B1---nas%C4%B1l-uygulan%C4%B1r">Builder (İnşaatçı) - Nasıl Uygulanır</h2>
<ol>
<li>
<p><strong>Mevcut tüm ürün temsilleri için ortak oluşturma adımlarını net bir şekilde tanımlayabildiğinizden emin olun.</strong> Aksi takdirde deseni uygulamaya devam edemezsiniz.</p>
</li>
<li>
<p><strong>Bu adımları</strong> temel builder arayüzünde bildirin.</p>
</li>
<li>
<p><strong>Her ürün temsili için bir somut builder sınıfı oluşturun</strong> ve oluşturma adımlarını uygulayın.</p>
<ul>
<li>Oluşturma sonucunu almak için bir yöntem uygulamayı unutmayın. Bu yöntem, çeşitli builder'lar ortak bir arayüze sahip olmayan ürünler oluşturabileceğinden, builder arayüzünde bildirilemez.</li>
</ul>
</li>
<li>
<p><strong>Bir director sınıfı oluşturmayı düşünün.</strong> Aynı builder nesnesini kullanarak bir ürünü oluşturmanın çeşitli yollarını kapsülleyebilir.</p>
</li>
<li>
<p><strong>İstemci kodu hem builder hem de director nesnelerini oluşturur.</strong> Oluşturma başlamadan önce, istemci director'a bir builder nesnesi iletmelidir. Genellikle istemci bunu, director'ın yapıcısının parametreleri veya bir setter yöntemi aracılığıyla yalnızca bir kez yapar.</p>
</li>
<li>
<p><strong>Oluşturma sonucu, yalnızca tüm ürünler aynı arayüzü takip ediyorsa doğrudan builder'dan alınabilir.</strong> Aksi takdirde istemci sonucu builder'dan almalıdır.</p>
</li>
</ol>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="builder-i%CC%87n%C5%9Faat%C3%A7%C4%B1---art%C4%B1lar-ve-eksiler">Builder (İnşaatçı) - Artılar ve Eksiler</h2>
<h3 id="art%C4%B1lar-2">Artılar</h3>
<ul>
<li><strong>Adım adım oluşturma</strong>: Nesneleri adım adım oluşturabilir, oluşturma adımlarını erteleyebilir veya adımları özyinelemeli olarak çalıştırabilirsiniz.</li>
<li><strong>Yeniden kullanılabilir oluşturma kodu</strong>: Ürünlerin çeşitli temsillerini oluştururken aynı oluşturma kodunu yeniden kullanabilirsiniz.</li>
<li><strong>Tek Sorumluluk İlkesi (SRP)</strong>: Karmaşık oluşturma kodunu ürünün iş mantığından izole edebilirsiniz.</li>
</ul>
<h3 id="eksiler-2">Eksiler</h3>
<ul>
<li><strong>Artan karmaşıklık</strong>: Desen birden fazla yeni sınıf oluşturmayı gerektirdiğinden kodun genel karmaşıklığı artar.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-9</footer>
</section>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="builder-i%CC%87n%C5%9Faat%C3%A7%C4%B1---di%C4%9Fer-desenlerle-i%CC%87li%C5%9Fkiler">Builder (İnşaatçı) - Diğer Desenlerle İlişkiler</h2>
<ul>
<li>
<p>Birçok tasarım <strong>Factory Method</strong> ile başlar (daha az karmaşık, alt sınıflar aracılığıyla daha fazla özelleştirilebilir) ve <strong>Abstract Factory</strong>, <strong>Prototype</strong> veya <strong>Builder</strong>'a doğru evrilir (daha esnek, ancak daha karmaşık).</p>
</li>
<li>
<p><strong>Builder</strong> karmaşık nesneleri adım adım oluşturmaya odaklanır. <strong>Abstract Factory</strong> ilişkili nesne aileleri oluşturmada uzmanlaşır. Abstract Factory ürünü hemen döndürürken, Builder ürünü almadan önce bazı ek inşa adımları çalıştırmanıza izin verir.</p>
</li>
<li>
<p>Karmaşık <strong>Composite</strong> ağaçları oluştururken <strong>Builder</strong> kullanabilirsiniz çünkü oluşturma adımlarını özyinelemeli çalışacak şekilde programlayabilirsiniz.</p>
</li>
<li>
<p><strong>Builder</strong>'ı <strong>Bridge</strong> ile birleştirebilirsiniz: director sınıfı soyutlama rolünü oynarken, farklı builder'lar uygulama rolünü üstlenir.</p>
</li>
<li>
<p><strong>Abstract Factories</strong>, <strong>Builders</strong> ve <strong>Prototypes</strong>'ın tümü <strong>Singletons</strong> olarak uygulanabilir.</p>
</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-9</footer>

<h2 id="mod%C3%BCl-d-%C3%B6zet">Modül D: Özet</h2>
<ul>
<li><strong>Builder (İnşaatçı)</strong>, karmaşık nesneleri adım adım, yalnızca ihtiyaç duyduğunuz adımları kullanarak oluşturmanıza olanak tanır.</li>
<li><strong>Teleskopik yapıcı</strong> sorununu ve <strong>alt sınıf patlaması</strong> sorununu çözer.</li>
<li>Desen <strong>beş katılımcı</strong> kullanır: Builder Interface (İnşaatçı Arayüzü), Concrete Builders (Somut İnşaatçılar), Products (Ürünler), Director (Yönetici) ve Client (İstemci).</li>
<li><strong>Director</strong> isteğe bağlıdır ancak yaygın oluşturma rutinlerini kapsüllemek için faydalıdır.</li>
<li>Builder, oluşturma mantığını iş mantığından izole ederek <strong>Tek Sorumluluk İlkesini</strong> destekler.</li>
<li>Ana ödünleşim, birden fazla yeni sınıf nedeniyle <strong>artan kod karmaşıklığıdır</strong>.</li>
<li>Builder, <strong>Composite</strong> (ağaç yapıları oluşturma için), <strong>Bridge</strong> ile birleştirilebilir ve <strong>Singleton</strong> olarak uygulanabilir.</li>
</ul>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="prototype-prototip-deseni---genel-bak%C4%B1%C5%9F">Prototype (Prototip) Deseni - Genel Bakış</h2>
<ul>
<li><strong>Diğer Adı</strong>: Clone (Klon)</li>
<li><strong>Kategori</strong>: Yaratımsal Desen (Creational Pattern)</li>
<li><strong>Karmaşıklık</strong>: Düşük</li>
<li><strong>Popülerlik</strong>: Orta</li>
</ul>
<p><strong>Amaç</strong>: Prototype (Prototip), kodunuzu sınıflarına bağımlı kılmadan mevcut nesneleri kopyalamanıza olanak tanıyan bir yaratımsal tasarım desenidir.</p>
<p>Referans: <a href="https://refactoring.guru/design-patterns/prototype">RefactoringGuru - Prototype</a></p>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="prototype-prototip---problem">Prototype (Prototip) - Problem</h2>
<p>Diyelim ki bir nesneniz var ve onun tam bir kopyasını oluşturmak istiyorsunuz. Bunu nasıl yapardınız?</p>
<ol>
<li><strong>İlk olarak</strong>, aynı sınıftan yeni bir nesne oluşturmanız gerekir.</li>
<li><strong>Ardından</strong>, orijinal nesnenin tüm alanlarına gidip değerlerini yeni nesneye kopyalamanız gerekir.</li>
</ol>
<p><strong>Ancak sorunlar var:</strong></p>
<ul>
<li><strong>Tüm nesneler bu şekilde kopyalanamaz</strong> çünkü nesnenin bazı alanları özel (private) olabilir ve nesnenin dışından görünmez.</li>
<li><strong>Kodunuz kopyalanan nesnenin sınıfına bağımlı hale gelir.</strong> Bir kopya oluşturmak için nesnenin sınıfını bilmeniz gerekir, bu da kodunuzu o sınıfa bağımlı kılar.</li>
<li><strong>Bazen yalnızca nesnenin takip ettiği arayüzü bilirsiniz</strong>, somut sınıfını değil. Örneğin, bir yöntem bazı arayüzü takip eden herhangi bir nesneyi kabul ettiğinde, bu nesnelerin somut sınıflarını bilemezsiniz.</li>
<li><strong>Karmaşık yapılandırmalar</strong>: Bir nesne karmaşık iç duruma (bağlantılar, referanslar, önbellekler) sahip olduğunda, yalnızca sınıfını bilmek onu düzgün bir şekilde kopyalamak için yeterli değildir.</li>
</ul>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="prototype-prototip---%C3%A7%C3%B6z%C3%BCm">Prototype (Prototip) - Çözüm</h2>
<p>Prototype deseni, klonlama sürecini klonlanan gerçek nesnelere devreder. Desen, klonlamayı destekleyen tüm nesneler için ortak bir arayüz bildirir. Bu arayüz, kodunuzu o nesnenin sınıfına bağlamadan bir nesneyi klonlamanıza olanak tanır. Genellikle bu tür bir arayüz yalnızca tek bir <code>clone</code> yöntemi içerir.</p>
<p><strong>Nasıl çalışır:</strong></p>
<ul>
<li>Klonlamayı destekleyen bir nesneye <strong>prototip</strong> denir.</li>
<li>Nesnelerinizin düzinelerce alanı ve yüzlerce olası yapılandırması olduğunda, onları klonlamak alt sınıflamaya alternatif olabilir.</li>
<li>Çeşitli şekillerde yapılandırılmış bir dizi nesne oluşturursunuz. Yapılandırdığınız gibi bir nesneye ihtiyaç duyduğunuzda, sıfırdan yeni bir nesne oluşturmak yerine bir prototipi klonlarsınız.</li>
</ul>
<p><strong>Önceden oluşturulmuş prototipler</strong>: Desen, önceden oluşturulmuş prototip nesneler oluşturmanın bir yolunu sağlar. Bunu bir katalog benzeri olarak düşünebilirsiniz. Bu prototipler zaten yapılandırılmış karmaşık duruma sahip olabilir.</p>

<h2 id="prototype-prototip---%C3%A7%C3%B6z%C3%BCm-devam">Prototype (Prototip) - Çözüm (devam)</h2>
<p><strong>Prototype Registry (Prototip Kayıt Defteri) (Önbellek)</strong>:</p>
<p>Desene isteğe bağlı bir ekleme, sık kullanılan prototiplere kolay erişim sağlayan bir <strong>Prototype Registry</strong>'dir. Kopyalanmaya hazır önceden oluşturulmuş nesneler kümesini depolar.</p>
<p>En basit prototip kayıt defteri bir <strong>isim -&gt; prototip</strong> hash haritasıdır. Ancak basit bir isimden daha iyi arama kriterlerine ihtiyacınız varsa, kayıt defterinin çok daha güçlü bir sürümünü oluşturabilirsiniz.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">PrototypeRegistry
┌─────────────────────────────────┐
│  items: Map&lt;String, Prototype&gt;  │
│                                 │
│  addItem(id, prototype)         │
│  getById(id): Prototype         │
│  getByColor(color): Prototype   │
└─────────────────────────────────┘
</code></pre>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="prototype-prototip---yap%C4%B1">Prototype (Prototip) - Yapı</h2>
<p><strong>Temel Uygulama:</strong></p>
<ol>
<li>
<p><strong>Prototype Interface (Prototip Arayüzü)</strong>: klonlama yöntemlerini bildirir. Çoğu durumda tek bir <code>clone</code> yöntemidir.</p>
</li>
<li>
<p><strong>Concrete Prototype (Somut Prototip)</strong> sınıfı: klonlama yöntemini uygular. Orijinal nesnenin verilerini klona kopyalamanın yanı sıra, bu yöntem bağlantılı nesnelerin klonlanması, özyinelemeli bağımlılıkların çözülmesi vb. ile ilgili klonlama sürecinin bazı uç durumlarını da ele alabilir.</p>
</li>
<li>
<p><strong>Client (İstemci)</strong>: prototip arayüzünü takip eden herhangi bir nesnenin bir kopyasını üretebilir.</p>
</li>
</ol>
<p><strong>Kayıt Defteri Uygulaması (varyant):</strong></p>
<ol start="4">
<li><strong>Prototype Registry (Prototip Kayıt Defteri)</strong>: sık kullanılan prototiplere kolay erişim sağlar. Kopyalanmaya hazır önceden oluşturulmuş nesneler kümesini depolar. En basit kayıt defteri bir <code>isim -&gt; prototip</code> hash haritasıdır.</li>
</ol>

<h2 id="prototype-prototip---s%C3%B6zde-kod">Prototype (Prototip) - Sözde Kod</h2>
<p>Bu örnekte, Prototype deseni kodu sınıflarına bağlamadan geometrik nesnelerin tam kopyalarını üretmenize olanak tanır.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">// Base prototype
abstract class Shape is
    field X: int
    field Y: int
    field color: string

    // A regular constructor
    constructor Shape() is
        // ...

    // The prototype constructor. A fresh object is
    // initialized with values from the existing object.
    constructor Shape(source: Shape) is
        this()
        this.X = source.X
        this.Y = source.Y
        this.color = source.color

    // The clone operation returns one of the Shape
    // subclasses.
    abstract method clone(): Shape
</code></pre>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="prototype-prototip---uygulanabilirlik">Prototype (Prototip) - Uygulanabilirlik</h2>
<p>Prototype desenini şu durumlarda kullanın:</p>
<ol>
<li>
<p><strong>Kodunuzun kopyalaması gereken nesnelerin somut sınıflarına bağımlı olmaması gerektiğinde.</strong></p>
<ul>
<li>Bu durum, kodunuz 3. taraf kodundan bazı arayüzler aracılığıyla iletilen nesnelerle çalıştığında sıkça yaşanır. Bu nesnelerin somut sınıfları bilinmez ve istesaniz bile onlara bağımlı olamazsınız.</li>
<li>Prototype deseni, istemci koduna klonlamayı destekleyen tüm nesnelerle çalışmak için genel bir arayüz sağlar. Bu arayüz, istemci kodunu klonladığı nesnelerin somut sınıflarından bağımsız kılar.</li>
</ul>
</li>
<li>
<p><strong>Yalnızca ilgili nesnelerini başlatma şekillerinde farklılık gösteren alt sınıf sayısını azaltmak istediğinizde.</strong></p>
<ul>
<li>Birisi, belirli bir yapılandırmaya sahip nesneler oluşturabilmek için bu alt sınıfları oluşturmuş olabilir.</li>
<li>Prototype deseni, çeşitli şekillerde yapılandırılmış önceden oluşturulmuş nesneler kümesini prototip olarak kullanmanıza olanak tanır. Bazı yapılandırmayla eşleşen bir alt sınıf örneklemek yerine, istemci uygun bir prototipi arayıp klonlayabilir.</li>
</ul>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-9</footer>
</section>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="prototype-prototip---nas%C4%B1l-uygulan%C4%B1r">Prototype (Prototip) - Nasıl Uygulanır</h2>
<ol>
<li>
<p><strong>Prototip arayüzünü oluşturun</strong> ve <code>clone</code> yöntemini bildirin. Veya mevcut bir sınıf hiyerarşiniz varsa, yöntemi tüm sınıflara ekleyin.</p>
</li>
<li>
<p><strong>Bir prototip sınıfı, o sınıfın bir nesnesini argüman olarak kabul eden alternatif yapıcıyı tanımlamalıdır.</strong> Yapıcı, iletilen nesneden sınıfta tanımlanan tüm alanların değerlerini yeni oluşturulan örneğe kopyalamalıdır. Bir alt sınıfı değiştiriyorsanız, üst sınıfın özel alanlarının klonlanmasını ele almasına izin vermek için üst yapıcıyı çağırmalısınız.</p>
</li>
<li>
<p><strong>Klonlama yöntemi genellikle tek bir satırdan oluşur</strong>: yapıcının prototipsel sürümüyle bir <code>new</code> operatörü çalıştırmak. Not: her sınıf klonlama yöntemini açıkça geçersiz kılmalı ve <code>new</code> operatörüyle birlikte kendi sınıf adını kullanmalıdır. Aksi takdirde, klonlama yöntemi bir üst sınıf nesnesi üretebilir.</p>
</li>
<li>
<p><strong>İsteğe bağlı olarak, sık kullanılan prototiplerin bir kataloğunu depolamak için merkezi bir prototip kayıt defteri oluşturun.</strong></p>
</li>
<li>
<p><strong>Kayıt defterini yeni bir fabrika sınıfı olarak uygulayabilir</strong> veya prototipi almak için statik bir yönteme sahip temel prototip sınıfına koyabilirsiniz. Bu yöntem, istemci kodunun yönteme ilettiği arama kriterlerine dayalı olarak bir prototip aramalıdır.</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-9</footer>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="prototype-prototip---art%C4%B1lar-ve-eksiler">Prototype (Prototip) - Artılar ve Eksiler</h2>
<h3 id="art%C4%B1lar-3">Artılar</h3>
<ul>
<li><strong>Somut sınıflarına bağlanmadan nesneleri klonlayın.</strong></li>
<li><strong>Önceden oluşturulmuş prototipleri klonlama lehine tekrarlayan başlatma kodundan kurtulun.</strong></li>
<li><strong>Karmaşık nesneleri daha rahat üretin</strong>: nesneler karmaşık iç duruma sahip olduğunda, klonlama sıfırdan oluşturmaktan daha hızlı ve kolaydır.</li>
<li><strong>Kalıtıma alternatif</strong>: Karmaşık nesneler için yapılandırma ön ayarlarıyla başa çıkmak için bir alternatif elde edersiniz. Her yapılandırma için alt sınıflar oluşturmak yerine, farklı yapılandırmalara sahip prototipler oluşturabilir ve onları klonlayabilirsiniz.</li>
</ul>
<h3 id="eksiler-3">Eksiler</h3>
<ul>
<li><strong>Dairesel referanslara sahip karmaşık nesneleri klonlamak</strong> çok zor olabilir. Diğer nesnelere referanslar içeren nesnelerin derin klonlanması, dairesel bağımlılıkların dikkatli bir şekilde ele alınmasını gerektirir.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-9</footer>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="prototype-prototip---di%C4%9Fer-desenlerle-i%CC%87li%C5%9Fkiler">Prototype (Prototip) - Diğer Desenlerle İlişkiler</h2>
<ul>
<li>
<p>Birçok tasarım <strong>Factory Method</strong> ile başlar (daha az karmaşık, alt sınıflar aracılığıyla daha fazla özelleştirilebilir) ve <strong>Abstract Factory</strong>, <strong>Prototype</strong> veya <strong>Builder</strong>'a doğru evrilir (daha esnek, ancak daha karmaşık).</p>
</li>
<li>
<p><strong>Abstract Factory</strong> sınıfları genellikle bir dizi <strong>Factory Method</strong> üzerine kurulur, ancak bu sınıflardaki yöntemleri oluşturmak için <strong>Prototype</strong> da kullanabilirsiniz.</p>
</li>
<li>
<p><strong>Prototype</strong>, <strong>Commands</strong>'ın kopyalarını geçmişe kaydetmeniz gerektiğinde yardımcı olabilir (Memento deseni alternatifi).</p>
</li>
<li>
<p><strong>Composite</strong> ve <strong>Decorator</strong>'ı yoğun kullanan tasarımlar genellikle <strong>Prototype</strong> kullanmaktan fayda görebilir. Deseni uygulamak, karmaşık yapıları sıfırdan yeniden oluşturmak yerine klonlamanıza olanak tanır.</p>
</li>
<li>
<p><strong>Prototype</strong> kalıtıma dayalı değildir, bu nedenle dezavantajları yoktur. Öte yandan, Prototype klonlanan nesnenin karmaşık bir başlatılmasını gerektirir. <strong>Factory Method</strong> kalıtıma dayalıdır ancak bir başlatma adımı gerektirmez.</p>
</li>
<li>
<p>Bazen <strong>Prototype</strong>, <strong>Memento</strong>'ya daha basit bir alternatif olabilir. Bu, durumunu geçmişte saklamak istediğiniz nesne oldukça basitse ve dış kaynaklara bağlantıları yoksa veya bağlantılar kolayca yeniden kurulabiliyorsa işe yarar.</p>
</li>
<li>
<p><strong>Abstract Factories</strong>, <strong>Builders</strong> ve <strong>Prototypes</strong>'ın tümü <strong>Singletons</strong> olarak uygulanabilir.</p>
</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-9</footer>

<h2 id="prototype-prototip---java-kod-%C3%B6rne%C4%9Fi-devam-3">Prototype (Prototip) - Java Kod Örneği (devam)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Client code</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">PrototypeDemo</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
        <span class="hljs-comment">// Create original shapes</span>
        <span class="hljs-type">Circle</span> <span class="hljs-variable">circle</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Circle</span>();
        circle.x = <span class="hljs-number">10</span>;
        circle.y = <span class="hljs-number">20</span>;
        circle.radius = <span class="hljs-number">15</span>;
        circle.color = <span class="hljs-string">&quot;red&quot;</span>;

        <span class="hljs-comment">// Clone the circle</span>
        <span class="hljs-type">Circle</span> <span class="hljs-variable">clonedCircle</span> <span class="hljs-operator">=</span> (Circle) circle.clone();
        System.out.println(<span class="hljs-string">&quot;Original: &quot;</span> + circle);
        System.out.println(<span class="hljs-string">&quot;Clone:    &quot;</span> + clonedCircle);
        System.out.println(<span class="hljs-string">&quot;Same object? &quot;</span> +
            (circle == clonedCircle)); <span class="hljs-comment">// false</span>

        <span class="hljs-comment">// Use prototype registry</span>
        <span class="hljs-type">PrototypeRegistry</span> <span class="hljs-variable">registry</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">PrototypeRegistry</span>();
        registry.addItem(<span class="hljs-string">&quot;big-red-circle&quot;</span>, circle);

        <span class="hljs-type">Rectangle</span> <span class="hljs-variable">rect</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Rectangle</span>();
        rect.x = <span class="hljs-number">0</span>; rect.y = <span class="hljs-number">0</span>;
        rect.width = <span class="hljs-number">100</span>; rect.height = <span class="hljs-number">50</span>;
        rect.color = <span class="hljs-string">&quot;blue&quot;</span>;
        registry.addItem(<span class="hljs-string">&quot;blue-rect&quot;</span>, rect);

        <span class="hljs-comment">// Get clones from registry</span>
        <span class="hljs-type">Shape</span> <span class="hljs-variable">s1</span> <span class="hljs-operator">=</span> registry.getById(<span class="hljs-string">&quot;big-red-circle&quot;</span>);

        System.out.println(<span class="hljs-string">&quot;From registry: &quot;</span> + s2);
    }
}

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="mod%C3%BCl-e-%C3%B6zet">Modül E: Özet</h2>
<ul>
<li><strong>Prototype (Prototip)</strong> (<strong>Clone/Klon</strong> olarak da bilinir) kodunuzu sınıflarına bağımlı kılmadan mevcut nesneleri kopyalamanıza olanak tanır.</li>
<li>Nesneleri kopyalarken <strong>sınıf bağımlılığı</strong> sorununu çözer ve dışarıdan erişilemeyen <strong>özel alanlar</strong> sorununu ele alır.</li>
<li>Desen bir <strong>clone arayüzü</strong>, kopya yapıcılara sahip <strong>somut prototipler</strong> ve isteğe bağlı bir <strong>Prototype Registry (Prototip Kayıt Defteri)</strong> kullanır.</li>
<li>Prototype, yapılandırma ön ayarlarıyla başa çıkmak için <strong>kalıtıma alternatiftir</strong>: alt sınıflar yerine, önceden yapılandırılmış prototipleri kullanın ve klonlayın.</li>
<li>Ana zorluk, derin klonlama sırasında <strong>dairesel referansları</strong> ele almaktır.</li>
<li>Prototype, karmaşık yapıları klonlamak için <strong>Composite</strong> ve <strong>Decorator</strong> desenleriyle birleştirilebilir.</li>
<li><strong>Factory Method</strong>'dan farklı olarak, Prototype <strong>kalıtıma dayalı değildir</strong> ancak klonlanan nesnenin uygun şekilde başlatılmasını gerektirir.</li>
</ul>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="singleton-tekil-nesne-deseni---genel-bak%C4%B1%C5%9F">Singleton (Tekil Nesne) Deseni - Genel Bakış</h2>
<ul>
<li><strong>Kategori</strong>: Yaratımsal Desen (Creational Pattern)</li>
<li><strong>Karmaşıklık</strong>: Düşük</li>
<li><strong>Popülerlik</strong>: Çok Yüksek (aynı zamanda tartışmalı)</li>
</ul>
<p><strong>Amaç</strong>: Singleton (Tekil Nesne), bir sınıfın yalnızca bir örneğe sahip olmasını sağlarken, bu örneğe global bir erişim noktası sunan bir yaratımsal tasarım desenidir.</p>
<p>Referans: <a href="https://refactoring.guru/design-patterns/singleton">RefactoringGuru - Singleton</a></p>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="singleton-tekil-nesne---problem">Singleton (Tekil Nesne) - Problem</h2>
<p>Singleton deseni aynı anda iki sorunu çözer (Tek Sorumluluk İlkesini ihlal eder):</p>
<p><strong>1. Bir sınıfın yalnızca tek bir örneğe sahip olmasını sağlamak.</strong></p>
<ul>
<li>Neden birisi bir sınıfın kaç örneğe sahip olduğunu kontrol etmek istesin? En yaygın neden, paylaşılan bir kaynağa <strong>erişimi kontrol etmektir</strong> -- örneğin, bir veritabanı veya bir dosya.</li>
<li>Şöyle çalışır: bir nesne oluşturduğunuzu, ancak bir süre sonra yeni bir tane oluşturmaya karar verdiğinizi düşünün. Taze bir nesne almak yerine, zaten oluşturulmuş olanı alırsınız.</li>
<li>Bu davranışın normal bir yapıcı ile uygulanmasının imkansız olduğunu unutmayın çünkü bir yapıcı çağrısı tasarım gereği her zaman yeni bir nesne döndürmelidir.</li>
</ul>
<p><strong>2. Bu örneğe global bir erişim noktası sağlamak.</strong></p>
<ul>
<li>Global değişkenleri hatırlıyor musunuz? Çok kullanışlı olmalarına rağmen, çok güvensizlerdir çünkü herhangi bir kod potansiyel olarak bu değişkenlerin içeriğini üzerine yazabilir ve uygulamayı çökertebilir.</li>
<li>Tıpkı bir global değişken gibi, Singleton deseni programın herhangi bir yerinden bir nesneye erişmenizi sağlar. Ancak ayrıca <strong>o örneğin başka kod tarafından üzerine yazılmasını da korur</strong>.</li>
</ul>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="singleton-tekil-nesne---%C3%A7%C3%B6z%C3%BCm">Singleton (Tekil Nesne) - Çözüm</h2>
<p>Singleton'un tüm uygulamalarında iki ortak adım vardır:</p>
<ol>
<li>
<p><strong>Varsayılan yapıcıyı özel (private) yapın</strong>, diğer nesnelerin Singleton sınıfıyla <code>new</code> operatörünü kullanmasını önlemek için.</p>
</li>
<li>
<p><strong>Yapıcı görevi gören statik bir oluşturma yöntemi oluşturun.</strong> Bu yöntem, perde arkasında bir nesne oluşturmak için özel yapıcıyı çağırır ve onu statik bir alana kaydeder. Bu yönteme yapılan sonraki tüm çağrılar önbelleğe alınmış nesneyi döndürür.</p>
</li>
</ol>
<p>Kodunuz Singleton sınıfına erişebiliyorsa, Singleton'un statik yöntemini çağırabilir. Böylece bu yöntem her çağrıldığında, her zaman aynı nesne döndürülür.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Singleton
┌──────────────────────────────────┐
│ - instance: Singleton (static)   │
│ - Singleton() (private)          │
│                                  │
│ + getInstance(): Singleton       │
│ + businessLogic()                │
└──────────────────────────────────┘
</code></pre>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="singleton-tekil-nesne---yap%C4%B1">Singleton (Tekil Nesne) - Yapı</h2>
<p><strong>Singleton</strong> sınıfı, kendi sınıfının aynı örneğini döndüren statik <code>getInstance</code> yöntemini bildirir.</p>
<ul>
<li>Singleton'un yapıcısı istemci kodundan gizlenmelidir.</li>
<li><code>getInstance</code> yöntemini çağırmak, Singleton nesnesini almanın tek yolu olmalıdır.</li>
</ul>
<p><strong>Temel yapısal elemanlar:</strong></p>
<table>
<thead>
<tr>
<th>Eleman</th>
<th>Açıklama</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>- instance: Singleton</code></td>
<td>Tekil örneği tutan statik alan</td>
</tr>
<tr>
<td><code>- Singleton()</code></td>
<td>Dışarıdan örneklemeyi engelleyen özel yapıcı</td>
</tr>
<tr>
<td><code>+ getInstance()</code></td>
<td>Tekil örneği döndüren genel statik yöntem</td>
</tr>
<tr>
<td>İş yöntemleri</td>
<td>Singleton sınıfının sağlaması gereken herhangi bir yöntem</td>
</tr>
</tbody>
</table>

<p>Bu örnekte, veritabanı bağlantı sınıfı bir Singleton olarak hareket eder. Bu sınıfın genel bir yapıcısı yoktur, bu nedenle nesnesini almanın tek yolu <code>getInstance</code> yöntemini çağırmaktır. Bu yöntem ilk oluşturulan nesneyi önbelleğe alır ve sonraki tüm çağrılarda onu döndürür.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">class Database is
    // The field for storing the singleton instance
    // should be declared static.
    private static field instance: Database

    // The singleton&#x27;s constructor should always be
    // private to prevent direct construction calls
    // with the `new` operator.
    private constructor Database() is
        // Some initialization code, such as the actual
        // connection to a database server.

    // The static method that controls the access to
    // the singleton instance.
    public static method getInstance() is
        if (Database.instance == null) then
            acquireThreadLock() and then
                // Ensure that the instance has not yet been
                // initialized by another thread.
                if (Database.instance == null) then
                    Database.instance = new Database()
        return Database.instance

    public method query(sql) is
        // All database queries go through this method.
</code></pre>

<p><strong>Basit uygulama iş parçacığı güvenli DEĞİLDİR:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">// BROKEN: Race condition possible
public static Singleton getInstance() {
    if (instance == null) {          // Thread A checks
        // Thread B also checks - both see null!
        instance = new Singleton();  // Both create instances!
    }
    return instance;
}
</code></pre>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="singleton-tekil-nesne---uygulanabilirlik">Singleton (Tekil Nesne) - Uygulanabilirlik</h2>
<p>Singleton desenini şu durumlarda kullanın:</p>
<ol>
<li>
<p><strong>Programınızdaki bir sınıfın tüm istemciler için yalnızca tek bir örneği olması gerektiğinde</strong>; örneğin, programın farklı bölümleri tarafından paylaşılan tek bir veritabanı nesnesi.</p>
<ul>
<li>Singleton deseni, özel oluşturma yöntemi dışında bir sınıfın nesnelerini oluşturmanın diğer tüm yollarını devre dışı bırakır. Bu yöntem ya yeni bir nesne oluşturur ya da zaten oluşturulmuşsa mevcut olanı döndürür.</li>
</ul>
</li>
<li>
<p><strong>Global değişkenler üzerinde daha sıkı kontrol ihtiyacınız olduğunda.</strong></p>
<ul>
<li>Global değişkenlerin aksine, Singleton deseni bir sınıfın yalnızca bir örneği olduğunu garanti eder. Singleton sınıfının kendisi dışında hiçbir şey önbelleğe alınmış örneği değiştiremez.</li>
<li>Bu sınırlamayı her zaman ayarlayabileceğinizi ve herhangi bir sayıda Singleton örneği oluşturmaya izin verebileceğinizi unutmayın. Değiştirilmesi gereken tek kod parçası <code>getInstance</code> yönteminin gövdesidir.</li>
</ul>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-9</footer>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="singleton-tekil-nesne---nas%C4%B1l-uygulan%C4%B1r">Singleton (Tekil Nesne) - Nasıl Uygulanır</h2>
<ol>
<li>
<p><strong>Singleton örneğini depolamak için sınıfa özel bir statik alan ekleyin.</strong></p>
</li>
<li>
<p><strong>Singleton örneğini almak için genel bir statik oluşturma yöntemi bildirin.</strong></p>
</li>
<li>
<p><strong>Statik yöntemin içinde &quot;tembel başlatma&quot; uygulayın.</strong> İlk çağrısında yeni bir nesne oluşturmalı ve onu statik alana koymalıdır. Yöntem, sonraki tüm çağrılarda her zaman bu örneği döndürmelidir.</p>
</li>
<li>
<p><strong>Sınıfın yapıcısını özel yapın.</strong> Sınıfın statik yöntemi hala yapıcıyı çağırabilecek, ancak diğer nesneler çağıramayacaktır.</p>
</li>
<li>
<p><strong>İstemci kodunu gözden geçirin</strong> ve singleton'un yapıcısına yapılan tüm doğrudan çağrıları statik oluşturma yöntemi çağrılarıyla değiştirin.</p>
</li>
</ol>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="singleton-tekil-nesne---art%C4%B1lar-ve-eksiler">Singleton (Tekil Nesne) - Artılar ve Eksiler</h2>
<h3 id="art%C4%B1lar-4">Artılar</h3>
<ul>
<li><strong>Tekil örnek garantisi</strong>: Bir sınıfın yalnızca tek bir örneği olduğundan emin olabilirsiniz.</li>
<li><strong>Global erişim noktası</strong>: Bu örneğe global bir erişim noktası elde edersiniz.</li>
<li><strong>Tembel başlatma (Lazy initialization)</strong>: Singleton nesnesi yalnızca ilk kez talep edildiğinde başlatılır, hiç kullanılmazsa kaynaklar tasarruf edilir.</li>
</ul>
<h3 id="eksiler-4">Eksiler</h3>
<ul>
<li><strong>Tek Sorumluluk İlkesini (SRP) ihlal eder</strong>: Desen aynı anda iki sorunu çözer (tekil örnek + global erişim).</li>
<li><strong>Kötü tasarımı maskeleyebilir</strong>: Örneğin, programın bileşenlerinin birbirleri hakkında çok fazla bilgi sahibi olduğu durumlarda.</li>
<li><strong>Çok iş parçacıklı ortamda özel işlem gerektirir</strong>: böylece birden fazla iş parçacığı singleton nesnesini birkaç kez oluşturmaz.</li>
<li><strong>Birim test etmesi zor</strong>: Singleton'un yapıcısı özeldir ve statik yöntemleri geçersiz kılmak çoğu dilde imkansızdır. Singleton'u taklit etmek için yaratıcı bir yol düşünmeniz gerekir. Ya da testleri yazmayın. Ya da Singleton desenini kullanmayın.</li>
</ul>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="singleton-tekil-nesne---di%C4%9Fer-desenlerle-i%CC%87li%C5%9Fkiler">Singleton (Tekil Nesne) - Diğer Desenlerle İlişkiler</h2>
<ul>
<li>
<p>Bir <strong>Facade</strong> sınıfı genellikle bir <strong>Singleton</strong>'a dönüştürülebilir çünkü çoğu durumda tek bir facade nesnesi yeterlidir.</p>
</li>
<li>
<p>Tüm nesnelerin paylaşılan durumlarını tek bir flyweight nesnesine indirgemeyi başarırsanız, <strong>Flyweight</strong> <strong>Singleton</strong>'a benzeyecektir. Ancak iki temel fark vardır:</p>
<ol>
<li>Yalnızca bir Singleton örneği olmalıdır, oysa bir Flyweight sınıfı farklı iç durumlara sahip birden fazla örneğe sahip olabilir.</li>
<li>Singleton nesnesi değiştirilebilir (mutable). Flyweight nesneleri değiştirilemez (immutable).</li>
</ol>
</li>
<li>
<p><strong>Abstract Factories</strong>, <strong>Builders</strong> ve <strong>Prototypes</strong>'ın tümü <strong>Singletons</strong> olarak uygulanabilir.</p>
</li>
</ul>
