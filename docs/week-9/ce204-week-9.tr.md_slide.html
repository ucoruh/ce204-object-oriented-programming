<h2 id="singleton-tekil-nesne---java-kod-%C3%B6rne%C4%9Fi-basit">Singleton (Tekil Nesne) - Java Kod Örneği (Basit)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Simple but NOT thread-safe Singleton</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">NaiveSingleton</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">static</span> NaiveSingleton instance;

    <span class="hljs-comment">// Private constructor</span>
    <span class="hljs-keyword">private</span> <span class="hljs-title function_">NaiveSingleton</span><span class="hljs-params">()</span> {
        <span class="hljs-comment">// Initialization code</span>
        System.out.println(<span class="hljs-string">&quot;Singleton instance created.&quot;</span>);
    }

    <span class="hljs-comment">// Static accessor method</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> NaiveSingleton <span class="hljs-title function_">getInstance</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">if</span> (instance == <span class="hljs-literal">null</span>) {
            instance = <span class="hljs-keyword">new</span> <span class="hljs-title class_">NaiveSingleton</span>();
        }
        <span class="hljs-keyword">return</span> instance;
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">doSomething</span><span class="hljs-params">()</span> {
        System.out.println(<span class="hljs-string">&quot;Singleton is working.&quot;</span>);
    }
}
</code></pre>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Thread-safe Singleton with double-checked locking</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ThreadSafeSingleton</span> {
    <span class="hljs-comment">// volatile ensures visibility across threads</span>
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">volatile</span> ThreadSafeSingleton instance;

    <span class="hljs-keyword">private</span> String data;

    <span class="hljs-keyword">private</span> <span class="hljs-title function_">ThreadSafeSingleton</span><span class="hljs-params">(String data)</span> {
        <span class="hljs-built_in">this</span>.data = data;
        <span class="hljs-comment">// Simulate slow initialization</span>
        <span class="hljs-keyword">try</span> {
            Thread.sleep(<span class="hljs-number">1000</span>);
        } <span class="hljs-keyword">catch</span> (InterruptedException e) {
            e.printStackTrace();
        }
    }

    <span class="hljs-comment">// Double-checked locking</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> ThreadSafeSingleton <span class="hljs-title function_">getInstance</span><span class="hljs-params">(String data)</span> {
        <span class="hljs-type">ThreadSafeSingleton</span> <span class="hljs-variable">result</span> <span class="hljs-operator">=</span> instance;
        <span class="hljs-keyword">if</span> (result != <span class="hljs-literal">null</span>) {
            <span class="hljs-keyword">return</span> result;  <span class="hljs-comment">// Fast path: no locking needed</span>
        }
        <span class="hljs-keyword">synchronized</span> (ThreadSafeSingleton.class) {
            <span class="hljs-keyword">if</span> (instance == <span class="hljs-literal">null</span>) {
                instance = <span class="hljs-keyword">new</span> <span class="hljs-title class_">ThreadSafeSingleton</span>(data);
            }
            <span class="hljs-keyword">return</span> instance;
        }
    }

    <span class="hljs-keyword">public</span> String <span class="hljs-title function_">getData</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> data; }
}
</code></pre>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="singleton-tekil-nesne---java-kod-%C3%B6rne%C4%9Fi-enum-tabanl%C4%B1">Singleton (Tekil Nesne) - Java Kod Örneği (Enum Tabanlı)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// The simplest and most effective Singleton in Java</span>
<span class="hljs-comment">// Joshua Bloch recommends this approach in Effective Java</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">enum</span> <span class="hljs-title class_">DatabaseConnection</span> {
    INSTANCE;

    <span class="hljs-keyword">private</span> String connectionString;

    DatabaseConnection() {
        <span class="hljs-comment">// Initialization happens once, guaranteed by JVM</span>
        <span class="hljs-built_in">this</span>.connectionString = <span class="hljs-string">&quot;jdbc:mysql://localhost:3306/mydb&quot;</span>;
        System.out.println(<span class="hljs-string">&quot;Database connection initialized.&quot;</span>);
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">query</span><span class="hljs-params">(String sql)</span> {
        System.out.println(<span class="hljs-string">&quot;Executing query: &quot;</span> + sql
            + <span class="hljs-string">&quot; on &quot;</span> + connectionString);
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">setConnectionString</span><span class="hljs-params">(String conn)</span> {
        <span class="hljs-built_in">this</span>.connectionString = conn;
    }
}

<span class="hljs-comment">// Usage</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">EnumSingletonDemo</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
        <span class="hljs-type">DatabaseConnection</span> <span class="hljs-variable">db</span> <span class="hljs-operator">=</span> DatabaseConnection.INSTANCE;
        db.query(<span class="hljs-string">&quot;SELECT * FROM users&quot;</span>);

        <span class="hljs-comment">// Same instance everywhere</span>
        <span class="hljs-type">DatabaseConnection</span> <span class="hljs-variable">db2</span> <span class="hljs-operator">=</span> DatabaseConnection.INSTANCE;
        System.out.println(<span class="hljs-string">&quot;Same? &quot;</span> + (db == db2)); <span class="hljs-comment">// true</span>
    }
}
</code></pre>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Comprehensive Singleton demonstration</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">SingletonDemo</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
        <span class="hljs-comment">// Test thread-safe singleton</span>
        System.out.println(<span class="hljs-string">&quot;--- Thread-Safe Singleton ---&quot;</span>);

        <span class="hljs-type">Thread</span> <span class="hljs-variable">t1</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Thread</span>(() -&gt; {
            <span class="hljs-type">ThreadSafeSingleton</span> <span class="hljs-variable">s</span> <span class="hljs-operator">=</span>
                ThreadSafeSingleton.getInstance(<span class="hljs-string">&quot;Thread-1&quot;</span>);
            System.out.println(<span class="hljs-string">&quot;T1 data: &quot;</span> + s.getData());
        });

        <span class="hljs-type">Thread</span> <span class="hljs-variable">t2</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Thread</span>(() -&gt; {
            <span class="hljs-type">ThreadSafeSingleton</span> <span class="hljs-variable">s</span> <span class="hljs-operator">=</span>
                ThreadSafeSingleton.getInstance(<span class="hljs-string">&quot;Thread-2&quot;</span>);
            System.out.println(<span class="hljs-string">&quot;T2 data: &quot;</span> + s.getData());
        });

        t1.start();
        t2.start();

        <span class="hljs-comment">// Both threads get the SAME instance</span>
        <span class="hljs-comment">// Only one of &quot;Thread-1&quot; or &quot;Thread-2&quot; will be</span>
        <span class="hljs-comment">// the data value, depending on which thread</span>
        <span class="hljs-comment">// created the instance first.</span>

        System.out.println(<span class="hljs-string">&quot;\n--- Enum Singleton ---&quot;</span>);
        DatabaseConnection.INSTANCE.query(<span class="hljs-string">&quot;SELECT 1&quot;</span>);
    }
}
</code></pre>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="mod%C3%BCl-f-%C3%B6zet">Modül F: Özet</h2>
<ul>
<li><strong>Singleton (Tekil Nesne)</strong>, bir sınıfın yalnızca bir örneğe sahip olmasını sağlar ve ona global bir erişim noktası sunar.</li>
<li><strong>İki sorunu</strong> çözer: örnek sayısını kontrol etme ve global erişim sağlama.</li>
<li>Desen bir <strong>özel yapıcı</strong> ve bir <strong>statik getInstance() yöntemi</strong> gerektirir.</li>
<li><strong>İş parçacığı güvenliği</strong> kritik bir endişedir; basit uygulamalar eşzamanlı erişim altında bozulabilir.</li>
<li>Java birden fazla Singleton uygulaması sunar: basit, synchronized, çift kontrollü kilitleme, iç sınıf (Bill Pugh) ve <strong>enum</strong> (önerilen).</li>
<li>Singleton <strong>tartışmalıdır</strong>: SRP'yi ihlal eder, kötü tasarımı maskeleyebilir ve test etmeyi zorlaştırır.</li>
<li>Abstract Factories, Builders ve Prototypes'ın tümü <strong>Singletons</strong> olarak uygulanabilir.</li>
<li><strong>Enum tabanlı Singleton</strong>, Java'daki altın standarttır: iş parçacığı güvenli, serileştirme güvenli ve yansıma güvenli.</li>
</ul>
