<li><strong>Design Patterns:</strong> Know the intent, structure, and when to apply each pattern</li>
<li><strong>UML Diagrams:</strong> Be able to read and draw class diagrams and sequence diagrams</li>
<li><strong>Code Smells:</strong> Identify common code smells and suggest appropriate refactoring</li>
<li><strong>Clean Code:</strong> Naming conventions, function design, comment practices</li>
</ul>
