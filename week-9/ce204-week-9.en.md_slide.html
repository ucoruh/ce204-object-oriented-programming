<header>CEN206 Object-Oriented Programming</header>
<h2 id="what-are-design-patterns">What Are Design Patterns?</h2>
<ul>
<li><strong>Design patterns</strong> are typical solutions to commonly occurring problems in software design.</li>
<li>They are like pre-made blueprints that you can customize to solve a recurring design problem in your code.</li>
<li>A pattern is not a specific piece of code, but a general concept for solving a particular problem.</li>
<li>You can follow the pattern details and implement a solution that suits the realities of your own program.</li>
<li>Patterns are often confused with algorithms. While an algorithm always defines a clear set of actions, a pattern is a more high-level description of a solution.</li>
<li>The code of the same pattern applied to two different programs may be different.</li>
</ul>
<p>Reference: <a href="https://refactoring.guru/design-patterns">RefactoringGuru - Design Patterns</a></p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="patterns-vs-algorithms">Patterns vs. Algorithms</h2>
<table>
<thead>
<tr>
<th>Aspect</th>
<th>Algorithm</th>
<th>Design Pattern</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Level</strong></td>
<td>Low-level, step-by-step</td>
<td>High-level, architectural</td>
</tr>
<tr>
<td><strong>Analogy</strong></td>
<td>A cooking recipe</td>
<td>A blueprint</td>
</tr>
<tr>
<td><strong>Specificity</strong></td>
<td>Clear set of actions to achieve a goal</td>
<td>General concept for solving a problem</td>
</tr>
<tr>
<td><strong>Implementation</strong></td>
<td>Same code can be reused directly</td>
<td>Must be adapted to each program</td>
</tr>
<tr>
<td><strong>Focus</strong></td>
<td>How to process data</td>
<td>How to structure code</td>
</tr>
</tbody>
</table>
<ul>
<li>An algorithm is like a cooking recipe: both have clear steps to achieve a goal.</li>
<li>A pattern is more like a blueprint: you can see what the result and its features are, but the exact order of implementation is up to you.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>
</section>

<h2 id="what-does-a-pattern-consist-of">What Does a Pattern Consist Of?</h2>
<p>Most patterns are described formally so people can reproduce them in many contexts. A pattern description usually includes:</p>
<ul>
<li><strong>Intent</strong>: briefly describes both the problem and the solution.</li>
<li><strong>Motivation</strong>: further explains the problem and the solution the pattern makes possible.</li>
<li><strong>Structure</strong>: shows each part of the pattern and how they are related (class diagrams).</li>
<li><strong>Pseudocode/Code example</strong>: makes it easier to grasp the idea behind the pattern.</li>
<li><strong>Applicability</strong>: when to use the pattern.</li>
<li><strong>Implementation steps</strong>: how to implement the pattern.</li>
<li><strong>Relations with other patterns</strong>: how patterns relate to each other.</li>
</ul>
<p>Some pattern catalogs also list: pros and cons, known uses, and alternative names.</p>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="history-of-design-patterns">History of Design Patterns</h2>
<ul>
<li>The concept of patterns was first described by <strong>Christopher Alexander</strong> in the book <em>A Pattern Language: Towns, Buildings, Construction</em> (1977).
<ul>
<li>The book describes a &quot;language&quot; for designing the urban environment.</li>
</ul>
</li>
<li>The idea was picked up by four authors: <strong>Erich Gamma</strong>, <strong>John Vlissides</strong>, <strong>Ralph Johnson</strong>, and <strong>Richard Helm</strong>.</li>
<li>In 1994, they published <strong>&quot;Design Patterns: Elements of Reusable Object-Oriented Software&quot;</strong>.</li>
<li>The book featured <strong>23 patterns</strong> solving various problems of object-oriented design.</li>
<li>Due to the long name of the book, people started calling it <strong>&quot;the book by the Gang of Four&quot;</strong> (GoF).</li>
<li>Since then, dozens of other object-oriented patterns have been discovered.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="the-gang-of-four-gof">The Gang of Four (GoF)</h2>
<p>The four authors of the seminal book:</p>
<table>
<thead>
<tr>
<th>Author</th>
<th>Contribution</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Erich Gamma</strong></td>
<td>Later led Eclipse platform development at IBM</td>
</tr>
<tr>
<td><strong>Richard Helm</strong></td>
<td>Software architect in Australia</td>
</tr>
<tr>
<td><strong>Ralph Johnson</strong></td>
<td>Professor at University of Illinois</td>
</tr>
<tr>
<td><strong>John Vlissides</strong></td>
<td>Researcher at IBM (1961-2005)</td>
</tr>
</tbody>
</table>
<p>Their book cataloged 23 classic design patterns that remain foundational to OOP today. The patterns are solutions that evolved organically through real-world software development experience.</p>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="classification-of-design-patterns">Classification of Design Patterns</h2>
<p>Design patterns differ by their complexity, level of detail, and scale of applicability. The GoF classified them into <strong>three categories</strong>:</p>
<table>
<thead>
<tr>
<th>Category</th>
<th>Count</th>
<th>Purpose</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Creational</strong></td>
<td>5</td>
<td>Object creation mechanisms</td>
</tr>
<tr>
<td><strong>Structural</strong></td>
<td>7</td>
<td>Assembling objects and classes into larger structures</td>
</tr>
<tr>
<td><strong>Behavioral</strong></td>
<td>10</td>
<td>Communication between objects</td>
</tr>
<tr>
<td><strong>Total</strong></td>
<td><strong>22</strong></td>
<td>(23 in GoF, but we cover 22 core patterns)</td>
</tr>
</tbody>
</table>
<p>Patterns can also be classified by their scope:</p>
<ul>
<li><strong>Class patterns</strong>: deal with relationships between classes and subclasses (compile-time)</li>
<li><strong>Object patterns</strong>: deal with object relationships (runtime)</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="creational-patterns-5">Creational Patterns (5)</h2>
<p>Creational patterns provide object creation mechanisms that increase flexibility and reuse of existing code.</p>
<table>
<thead>
<tr>
<th>Pattern</th>
<th>Purpose</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Factory Method</strong></td>
<td>Creates objects via an interface; subclasses decide the type</td>
</tr>
<tr>
<td><strong>Abstract Factory</strong></td>
<td>Produces families of related objects without specifying concrete classes</td>
</tr>
<tr>
<td><strong>Builder</strong></td>
<td>Constructs complex objects step by step</td>
</tr>
<tr>
<td><strong>Prototype</strong></td>
<td>Copies existing objects without depending on their classes</td>
</tr>
<tr>
<td><strong>Singleton</strong></td>
<td>Ensures a class has only one instance with a global access point</td>
</tr>
</tbody>
</table>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="structural-patterns-7">Structural Patterns (7)</h2>
<p>Structural patterns explain how to assemble objects and classes into larger structures while keeping them flexible and efficient.</p>
<table>
<thead>
<tr>
<th>Pattern</th>
<th>Purpose</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Adapter</strong></td>
<td>Allows objects with incompatible interfaces to collaborate</td>
</tr>
<tr>
<td><strong>Bridge</strong></td>
<td>Splits a large class into two hierarchies (abstraction + implementation)</td>
</tr>
<tr>
<td><strong>Composite</strong></td>
<td>Composes objects into tree structures</td>
</tr>
<tr>
<td><strong>Decorator</strong></td>
<td>Attaches new behaviors to objects by wrapping them</td>
</tr>
<tr>
<td><strong>Facade</strong></td>
<td>Provides a simplified interface to a library or framework</td>
</tr>
<tr>
<td><strong>Flyweight</strong></td>
<td>Fits more objects into RAM by sharing common state</td>
</tr>
<tr>
<td><strong>Proxy</strong></td>
<td>Provides a substitute or placeholder for another object</td>
</tr>
</tbody>
</table>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="behavioral-patterns-10">Behavioral Patterns (10)</h2>
<p>Behavioral patterns take care of effective communication and the assignment of responsibilities between objects.</p>
<table>
<thead>
<tr>
<th>Pattern</th>
<th>Purpose</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Chain of Responsibility</strong></td>
<td>Passes requests along a chain of handlers</td>
</tr>
<tr>
<td><strong>Command</strong></td>
<td>Turns a request into a stand-alone object</td>
</tr>
<tr>
<td><strong>Iterator</strong></td>
<td>Traverses elements of a collection sequentially</td>
</tr>
<tr>
<td><strong>Mediator</strong></td>
<td>Reduces chaotic dependencies between objects</td>
</tr>
<tr>
<td><strong>Memento</strong></td>
<td>Saves and restores the previous state of an object</td>
</tr>
<tr>
<td><strong>Observer</strong></td>
<td>Defines a subscription mechanism for event notification</td>
</tr>
<tr>
<td><strong>State</strong></td>
<td>Alters behavior when internal state changes</td>
</tr>
<tr>
<td><strong>Strategy</strong></td>
<td>Defines a family of interchangeable algorithms</td>
</tr>
<tr>
<td><strong>Template Method</strong></td>
<td>Defines the skeleton of an algorithm; subclasses fill in steps</td>
</tr>
<tr>
<td><strong>Visitor</strong></td>
<td>Separates algorithms from the objects on which they operate</td>
</tr>
</tbody>
</table>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="why-learn-design-patterns">Why Learn Design Patterns?</h2>
<ul>
<li><strong>Proven solutions</strong>: Patterns are tried-and-tested solutions to common problems. Even if you never encounter these problems, knowing patterns teaches you how to solve problems using OOP principles.</li>
<li><strong>Common language</strong>: Patterns define a shared vocabulary. You can say &quot;use a Singleton for that&quot; and everyone immediately understands the suggestion.</li>
<li><strong>Better communication</strong>: When team members know patterns, communication about design is faster and more precise.</li>
<li><strong>Understand frameworks</strong>: Many frameworks and libraries use design patterns. Understanding patterns helps you comprehend how frameworks work.</li>
<li><strong>Write better code</strong>: Patterns help you write code that is more flexible, reusable, and maintainable.</li>
<li><strong>Career growth</strong>: Design pattern knowledge is frequently tested in technical interviews.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="benefits-of-design-patterns">Benefits of Design Patterns</h2>
<ul>
<li><strong>Reusability</strong>: Patterns provide reusable solutions that can be adapted across projects.</li>
<li><strong>Maintainability</strong>: Code structured with patterns is easier to understand and modify.</li>
<li><strong>Scalability</strong>: Patterns help design systems that can grow without becoming unmanageable.</li>
<li><strong>Flexibility</strong>: Patterns often make it easier to swap implementations or add new features.</li>
<li><strong>Documentation</strong>: Patterns serve as a form of documentation for design decisions.</li>
</ul>
<h2 id="criticism-of-design-patterns">Criticism of Design Patterns</h2>
<ul>
<li><strong>Over-engineering</strong>: Using patterns where simple code would suffice adds unnecessary complexity.</li>
<li><strong>Language limitations</strong>: Patterns often compensate for missing language features (e.g., Strategy in languages without first-class functions).</li>
<li><strong>Misuse</strong>: Applying the wrong pattern to a problem can make code worse, not better.</li>
<li><strong>Learning curve</strong>: Understanding when and how to apply patterns requires experience.</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-a-takeaways">Module A: Takeaways</h2>
<ul>
<li>Design patterns are <strong>typical solutions</strong> to commonly occurring problems in software design.</li>
<li>They were popularized by the <strong>Gang of Four (GoF)</strong> book in 1994 with <strong>23 patterns</strong>.</li>
<li>Patterns are classified into three categories: <strong>Creational</strong> (5), <strong>Structural</strong> (7), and <strong>Behavioral</strong> (10).</li>
<li>Each pattern has: <strong>Intent</strong>, <strong>Motivation</strong>, <strong>Structure</strong>, <strong>Pseudocode</strong>, <strong>Applicability</strong>, <strong>Implementation</strong>, and <strong>Relations</strong>.</li>
<li>Learning patterns gives you a <strong>common vocabulary</strong> and helps you write <strong>better, more maintainable code</strong>.</li>
<li>Patterns should be applied thoughtfully; <strong>over-engineering</strong> and <strong>misuse</strong> are real risks.</li>
<li>In this week, we focus on the <strong>5 Creational Patterns</strong>: Factory Method, Abstract Factory, Builder, Prototype, and Singleton.</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="factory-method-pattern---overview">Factory Method Pattern - Overview</h2>
<ul>
<li><strong>Also Known As</strong>: Virtual Constructor</li>
<li><strong>Category</strong>: Creational Pattern</li>
<li><strong>Complexity</strong>: Low</li>
<li><strong>Popularity</strong>: High</li>
</ul>
<p><strong>Intent</strong>: Factory Method is a creational design pattern that provides an interface for creating objects in a superclass, but allows subclasses to alter the type of objects that will be created.</p>
<p>Reference: <a href="https://refactoring.guru/design-patterns/factory-method">RefactoringGuru - Factory Method</a></p>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="factory-method---the-problem">Factory Method - The Problem</h2>
<p>Imagine that you are creating a logistics management application. The first version of your app can only handle transportation by trucks, so the bulk of your code lives inside the <code>Truck</code> class.</p>
<p>After a while, your app becomes pretty popular. Each day you receive dozens of requests from sea transportation companies to incorporate sea logistics into the app.</p>
<p><strong>What happens if you add <code>Ship</code> directly?</strong></p>
<ul>
<li>Adding a new class isn't that simple if the rest of the code is already coupled to existing classes.</li>
<li>Most of your code is coupled to the <code>Truck</code> class.</li>
<li>Adding <code>Ship</code> would require making changes to the entire codebase.</li>
<li>Adding another transportation type later would require all of these changes again.</li>
<li>The result: pretty nasty code, riddled with conditionals that switch behavior depending on the class of transportation objects.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-9" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

" data-lang="en-US" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-9;--theme:default;--style:img[alt~=&quot;center&quot;] {

;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="118">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="factory-method---the-solution">Factory Method - The Solution</h2>
<p>The Factory Method pattern suggests that you replace direct object construction calls (using the <code>new</code> operator) with calls to a special <strong>factory method</strong>.</p>
<ul>
<li>Objects are still created via the <code>new</code> operator, but it is called from within the factory method.</li>
<li>Objects returned by a factory method are often referred to as <strong>products</strong>.</li>
</ul>
<p><strong>Key insight</strong>: Subclasses can override the factory method to change the class of products being created.</p>
<ul>
<li>There is a slight limitation: subclasses may return different types of products only if these products have a <strong>common base class or interface</strong>.</li>
<li>Also, the factory method in the base class should have its return type declared as this interface.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="factory-method---solution-diagram">Factory Method - Solution Diagram</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">                    Creator
              ┌─────────────────┐
              │ someOperation() │
              │ createProduct() │──── Product p = createProduct()
              └────────┬────────┘
                       │
           ┌───────────┴───────────┐
           │                       │
  ConcreteCreatorA          ConcreteCreatorB
  ┌────────────────┐       ┌────────────────┐
  │createProduct() │       │createProduct() │
  │ return new     │       │ return new     │
  │ ConcreteA()    │       │ ConcreteB()    │
  └────────────────┘       └────────────────┘
</code></pre>
<ul>
<li>The <code>Creator</code> class has a factory method <code>createProduct()</code>.</li>
<li>Each <code>ConcreteCreator</code> overrides the factory method to return a different product type.</li>
<li>All products implement the same interface.</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="factory-method---structure">Factory Method - Structure</h2>
<p>The Factory Method pattern has four key participants:</p>
<ol>
<li>
<p><strong>Product</strong> (Interface/Abstract Class)</p>
<ul>
<li>Declares the interface common to all objects that the factory method can produce.</li>
</ul>
</li>
<li>
<p><strong>Concrete Products</strong></p>
<ul>
<li>Different implementations of the product interface.</li>
</ul>
</li>
<li>
<p><strong>Creator</strong> (Abstract Class)</p>
<ul>
<li>Declares the factory method that returns new product objects. Its return type must match the product interface.</li>
<li>May contain some core business logic that relies on product objects.</li>
</ul>
</li>
<li>
<p><strong>Concrete Creators</strong></p>
<ul>
<li>Override the base factory method to return a different type of product.</li>
<li>The factory method does not have to create new instances all the time; it can also return existing objects from a cache, object pool, or other source.</li>
</ul>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="factory-method---pseudocode">Factory Method - Pseudocode</h2>
<p>This example illustrates how the Factory Method can be used for creating cross-platform UI elements without coupling the client code to concrete UI classes.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">// The creator class declares the factory method
// that must return an object of a product class.
class Dialog is
    abstract method createButton(): Button

    method render() is
        Button okButton = createButton()
        okButton.onClick(closeDialog)
        okButton.render()

// Concrete creators override the factory method
class WindowsDialog extends Dialog is
    method createButton(): Button is
        return new WindowsButton()

class WebDialog extends Dialog is
    method createButton(): Button is
        return new HTMLButton()
</code></pre>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="factory-method---applicability">Factory Method - Applicability</h2>
<p>Use the Factory Method pattern when:</p>
<ol>
<li>
<p><strong>You don't know beforehand the exact types and dependencies of the objects</strong> your code should work with.</p>
<ul>
<li>The Factory Method separates product construction code from the code that actually uses the product. Therefore it is easier to extend the product construction code independently from the rest of the code.</li>
</ul>
</li>
<li>
<p><strong>You want to provide users of your library or framework with a way to extend its internal components.</strong></p>
<ul>
<li>Users can subclass your framework classes and override factory methods to extend them with their own types.</li>
</ul>
</li>
<li>
<p><strong>You want to save system resources by reusing existing objects</strong> instead of rebuilding them each time.</p>
<ul>
<li>You need a regular method capable of creating new objects as well as reusing existing ones. That sounds very much like a factory method.</li>
</ul>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="factory-method---how-to-implement">Factory Method - How to Implement</h2>
<ol>
<li>
<p><strong>Make all products follow the same interface.</strong> This interface should declare methods that make sense in every product.</p>
</li>
<li>
<p><strong>Add an empty factory method inside the creator class.</strong> The return type of the method should match the common product interface.</p>
</li>
<li>
<p><strong>In the creator's code, find all references to product constructors.</strong> One by one, replace them with calls to the factory method, while extracting the product creation code into the factory method.</p>
</li>
<li>
<p><strong>Create a set of concrete creator subclasses</strong> for each type of product listed in the factory method. Override the factory method in the subclasses and extract the appropriate bits of construction code from the base method.</p>
</li>
<li>
<p><strong>If there are too many product types</strong> and it does not make sense to create subclasses for all of them, you can reuse the control parameter from the base class in subclasses.</p>
</li>
<li>
<p><strong>If, after all of the extractions, the base factory method has become empty</strong>, you can make it abstract. If there is something left, you can make it a default behavior of the method.</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="factory-method---pros-and-cons">Factory Method - Pros and Cons</h2>
<h3 id="pros">Pros</h3>
<ul>
<li><strong>Avoids tight coupling</strong> between the creator and the concrete products.</li>
<li><strong>Single Responsibility Principle (SRP)</strong>: You can move the product creation code into one place in the program, making the code easier to support.</li>
<li><strong>Open/Closed Principle (OCP)</strong>: You can introduce new types of products into the program without breaking existing client code.</li>
</ul>
<h3 id="cons">Cons</h3>
<ul>
<li><strong>Code complexity increases</strong>: The code may become more complicated since you need to introduce many new subclasses to implement the pattern. The best case scenario is when you are introducing the pattern into an existing hierarchy of creator classes.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="factory-method---relations-with-other-patterns">Factory Method - Relations with Other Patterns</h2>
<ul>
<li>
<p>Many designs start by using <strong>Factory Method</strong> (less complicated, more customizable via subclasses) and evolve toward <strong>Abstract Factory</strong>, <strong>Prototype</strong>, or <strong>Builder</strong> (more flexible, but more complex).</p>
</li>
<li>
<p><strong>Abstract Factory</strong> classes are often based on a set of <strong>Factory Methods</strong>, but you can also use <strong>Prototype</strong> to compose the methods on these classes.</p>
</li>
<li>
<p>You can use <strong>Factory Method</strong> along with <strong>Iterator</strong> to let collection subclasses return different types of iterators that are compatible with the collections.</p>
</li>
<li>
<p><strong>Prototype</strong> is not based on inheritance, so it does not have its drawbacks. On the other hand, Prototype requires a complicated initialization of the cloned object. <strong>Factory Method</strong> is based on inheritance but does not require an initialization step.</p>
</li>
<li>
<p><strong>Factory Method</strong> is a specialization of <strong>Template Method</strong>. At the same time, a Factory Method may serve as a step in a large Template Method.</p>
</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="factory-method---java-code-example-cont-1">Factory Method - Java Code Example (cont.)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Client code</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">FactoryMethodDemo</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
        Logistics logistics;

        <span class="hljs-comment">// Configuration determines which factory to use</span>
        <span class="hljs-type">String</span> <span class="hljs-variable">transportType</span> <span class="hljs-operator">=</span> <span class="hljs-string">&quot;sea&quot;</span>; <span class="hljs-comment">// could come from config</span>

        <span class="hljs-keyword">if</span> (transportType.equals(<span class="hljs-string">&quot;road&quot;</span>)) {
            logistics = <span class="hljs-keyword">new</span> <span class="hljs-title class_">RoadLogistics</span>();
        } <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (transportType.equals(<span class="hljs-string">&quot;sea&quot;</span>)) {

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-b-takeaways">Module B: Takeaways</h2>
<ul>
<li><strong>Factory Method</strong> provides an interface for creating objects in a superclass, but allows subclasses to alter the type of objects created.</li>
<li>It solves the problem of <strong>tight coupling</strong> between creator code and concrete product classes.</li>
<li>The pattern uses <strong>four participants</strong>: Product interface, Concrete Products, Creator class, and Concrete Creators.</li>
<li>Factory Method supports the <strong>Open/Closed Principle</strong> (new products without modifying existing code) and <strong>Single Responsibility Principle</strong> (centralized creation logic).</li>
<li>It is often the <strong>starting point</strong> for more complex patterns like Abstract Factory or Prototype.</li>
<li>The main trade-off is <strong>increased number of subclasses</strong> in the codebase.</li>
<li>Factory Method is a specialization of the <strong>Template Method</strong> pattern.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="abstract-factory-pattern---overview">Abstract Factory Pattern - Overview</h2>
<ul>
<li><strong>Category</strong>: Creational Pattern</li>
<li><strong>Complexity</strong>: Medium</li>
<li><strong>Popularity</strong>: High</li>
</ul>
<p><strong>Intent</strong>: Abstract Factory is a creational design pattern that lets you produce <strong>families of related objects</strong> without specifying their concrete classes.</p>
<p>Reference: <a href="https://refactoring.guru/design-patterns/abstract-factory">RefactoringGuru - Abstract Factory</a></p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-9" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

<header>CEN206 Object-Oriented Programming</header>
<h2 id="abstract-factory---the-problem">Abstract Factory - The Problem</h2>
<p>Imagine that you are creating a furniture shop simulator. Your code consists of classes that represent:</p>
<ul>
<li>A family of related products, say: <code>Chair</code> + <code>Sofa</code> + <code>CoffeeTable</code>.</li>
<li>Several variants of this family. For example, products <code>Chair</code> + <code>Sofa</code> + <code>CoffeeTable</code> are available in these variants: <strong>Modern</strong>, <strong>Victorian</strong>, <strong>ArtDeco</strong>.</li>
</ul>
<p>You need a way to create individual furniture objects so that they match other objects of the same family. Customers get quite mad when they receive non-matching furniture.</p>
<p><strong>Problems with direct construction:</strong></p>
<ul>
<li>You don't want to change existing code when adding new products or families of products.</li>
<li>Furniture vendors update their catalogs very often, and you wouldn't want to change the core code each time it happens.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-9" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

" data-lang="en-US" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-9;--theme:default;--style:img[alt~=&quot;center&quot;] {

;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="118">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="abstract-factory---the-solution">Abstract Factory - The Solution</h2>
<p>The Abstract Factory pattern suggests:</p>
<ol>
<li>
<p><strong>Explicitly declare interfaces</strong> for each distinct product of the product family (e.g., <code>Chair</code>, <code>Sofa</code>, <code>CoffeeTable</code>).</p>
</li>
<li>
<p><strong>Make all variants</strong> of products follow those interfaces. For example, all chair variants implement the <code>Chair</code> interface; all coffee tables implement the <code>CoffeeTable</code> interface, and so on.</p>
</li>
<li>
<p><strong>Declare the Abstract Factory</strong> -- an interface with a list of creation methods for all products that are part of the product family (e.g., <code>createChair</code>, <code>createSofa</code>, <code>createCoffeeTable</code>).</p>
</li>
<li>
<p><strong>Create separate factory classes</strong> for each variant of the product family. A factory is a class that returns products of a particular kind. For example, the <code>ModernFurnitureFactory</code> can only create <code>ModernChair</code>, <code>ModernSofa</code>, and <code>ModernCoffeeTable</code> objects.</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>
</section>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">         AbstractFactory
    ┌──────────────────────┐

<p>The client code works with factories and products only through their abstract interfaces. This lets you change the type of factory (and thus the variant of products) without changing the client code.</p>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="abstract-factory---structure">Abstract Factory - Structure</h2>
<p>The Abstract Factory pattern has five key participants:</p>
<ol>
<li>
<p><strong>Abstract Products</strong> declare interfaces for a set of distinct but related products which make up a product family.</p>
</li>
<li>
<p><strong>Concrete Products</strong> are various implementations of abstract products, grouped by variants. Each abstract product (chair/sofa) must be implemented in all given variants (Victorian/Modern).</p>
</li>
<li>
<p><strong>Abstract Factory</strong> interface declares a set of methods for creating each of the abstract products.</p>
</li>
<li>
<p><strong>Concrete Factories</strong> implement creation methods of the abstract factory. Each concrete factory corresponds to a specific variant of products and creates only those product variants.</p>
</li>
<li>
<p><strong>Client</strong> works with both factories and products through abstract interfaces. This lets the client work with any factory/product variant without coupling to concrete classes.</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="abstract-factory---pseudocode">Abstract Factory - Pseudocode</h2>
<p>This example illustrates how the Abstract Factory pattern can be used for creating cross-platform UI elements without coupling the client code to concrete UI classes.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">// The abstract factory interface declares a set of methods
// that return different abstract products.
interface GUIFactory is
    method createButton(): Button
    method createCheckbox(): Checkbox

// Concrete factories produce a family of products that
// belong to a single variant.
class WinFactory implements GUIFactory is
    method createButton(): Button is
        return new WinButton()
    method createCheckbox(): Checkbox is
        return new WinCheckbox()

class MacFactory implements GUIFactory is
    method createButton(): Button is
        return new MacButton()
    method createCheckbox(): Checkbox is
        return new MacCheckbox()
</code></pre>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>

<h2 id="abstract-factory---pseudocode-cont">Abstract Factory - Pseudocode (cont.)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">// Each distinct product of a product family should
// have a base interface.

    method paint()

// Each concrete product is created in a corresponding
// concrete factory.

    method paint() is
        // Render a button in Windows style.

class MacButton implements Button is
    method paint() is
        // Render a button in macOS style.

interface Checkbox is

class WinCheckbox implements Checkbox is
    method paint() is
        // Render a checkbox in Windows style.

class MacCheckbox implements Checkbox is
    method paint() is
        // Render a checkbox in macOS style.

<header>CEN206 Object-Oriented Programming</header>
<h2 id="abstract-factory---pseudocode-cont-1">Abstract Factory - Pseudocode (cont.)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">// The client code works with factories and products
// only through abstract types: GUIFactory, Button, Checkbox.
class Application is
    private field factory: GUIFactory
    private field button: Button

    constructor Application(factory: GUIFactory) is
        this.factory = factory

    method createUI() is
        this.button = factory.createButton()

    method paint() is
        button.paint()

// The application picks the factory type depending on
// the current configuration or environment settings.
class ApplicationConfigurator is
    method main() is
        config = readApplicationConfigFile()
        if (config.OS == &quot;Windows&quot;) then
            factory = new WinFactory()
        else if (config.OS == &quot;Mac&quot;) then
            factory = new MacFactory()
        else
            throw new Exception(&quot;Error! Unknown OS.&quot;)
        Application app = new Application(factory)
</code></pre>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="abstract-factory---applicability">Abstract Factory - Applicability</h2>
<p>Use the Abstract Factory pattern when:</p>
<ol>
<li>
<p><strong>Your code needs to work with various families of related products</strong>, but you don't want it to depend on the concrete classes of those products -- they might be unknown beforehand or you simply want to allow for future extensibility.</p>
<ul>
<li>The Abstract Factory provides you with an interface for creating objects from each class of the product family. As long as your code creates objects via this interface, you don't have to worry about creating the wrong variant of a product which doesn't match the products already created by your app.</li>
</ul>
</li>
<li>
<p><strong>You have a class with a set of Factory Methods</strong> that blur its primary responsibility.</p>
<ul>
<li>In a well-designed program, each class is responsible only for one thing (SRP). When a class deals with multiple product types, it may be worth extracting its factory methods into a stand-alone factory class or a full-blown Abstract Factory implementation.</li>
</ul>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="abstract-factory---how-to-implement">Abstract Factory - How to Implement</h2>
<ol>
<li>
<p><strong>Map out a matrix</strong> of distinct product types versus variants of these products.</p>
</li>
<li>
<p><strong>Declare abstract product interfaces</strong> for all product types. Then make all concrete product classes implement these interfaces.</p>
</li>
<li>
<p><strong>Declare the abstract factory interface</strong> with a set of creation methods for all abstract products.</p>
</li>
<li>
<p><strong>Implement a set of concrete factory classes</strong>, one for each product variant.</p>
</li>
<li>
<p><strong>Create factory initialization code</strong> somewhere in the app. It should instantiate one of the concrete factory classes, depending on the application configuration or the current environment. Pass this factory object to all classes that construct products.</p>
</li>
<li>
<p><strong>Scan through the code</strong> and find all direct calls to product constructors. Replace them with calls to the appropriate creation method on the factory object.</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="abstract-factory---pros-and-cons">Abstract Factory - Pros and Cons</h2>
<h3 id="pros-1">Pros</h3>
<ul>
<li><strong>Compatibility guarantee</strong>: You can be sure that the products you are getting from a factory are compatible with each other.</li>
<li><strong>Avoids tight coupling</strong> between concrete products and client code.</li>
<li><strong>Single Responsibility Principle (SRP)</strong>: You can extract the product creation code into one place, making the code easier to support.</li>
<li><strong>Open/Closed Principle (OCP)</strong>: You can introduce new variants of products without breaking existing client code.</li>
</ul>
<h3 id="cons-1">Cons</h3>
<ul>
<li><strong>Increased complexity</strong>: The code may become more complicated than it should be, since a lot of new interfaces and classes are introduced along with the pattern.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="abstract-factory---relations-with-other-patterns">Abstract Factory - Relations with Other Patterns</h2>
<ul>
<li>
<p>Many designs start by using <strong>Factory Method</strong> (less complicated, more customizable via subclasses) and evolve toward <strong>Abstract Factory</strong>, <strong>Prototype</strong>, or <strong>Builder</strong> (more flexible, but more complex).</p>
</li>
<li>
<p><strong>Builder</strong> focuses on constructing complex objects step by step. <strong>Abstract Factory</strong> specializes in creating families of related objects. Abstract Factory returns the product immediately, whereas Builder lets you run some additional construction steps before fetching the product.</p>
</li>
<li>
<p><strong>Abstract Factory</strong> classes are often based on a set of <strong>Factory Methods</strong>, but you can also use <strong>Prototype</strong> to compose the methods on these classes.</p>
</li>
<li>
<p><strong>Abstract Factory</strong> can serve as an alternative to <strong>Facade</strong> when you only want to hide the way the subsystem objects are created from the client code.</p>
</li>
<li>
<p>You can use <strong>Abstract Factory</strong> along with <strong>Bridge</strong>. This pairing is useful when some abstractions defined by Bridge can only work with specific implementations.</p>
</li>
<li>
<p><strong>Abstract Factories</strong>, <strong>Builders</strong>, and <strong>Prototypes</strong> can all be implemented as <strong>Singletons</strong>.</p>
</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-c-takeaways">Module C: Takeaways</h2>
<ul>
<li><strong>Abstract Factory</strong> lets you produce families of related objects without specifying their concrete classes.</li>
<li>It solves the problem of ensuring <strong>product compatibility</strong> within a family (e.g., Modern chair + Modern sofa, never mixing styles).</li>
<li>The pattern uses <strong>five participants</strong>: Abstract Products, Concrete Products, Abstract Factory, Concrete Factories, and Client.</li>
<li>It supports <strong>OCP</strong> (add new families without changing existing code) and <strong>SRP</strong> (product creation is centralized).</li>
<li>Abstract Factory is often implemented using <strong>Factory Methods</strong> internally, and can also use <strong>Prototype</strong> for composition.</li>
<li>The main trade-off is <strong>increased number of interfaces and classes</strong>.</li>
<li>Abstract Factories, Builders, and Prototypes can all be implemented as <strong>Singletons</strong>.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="builder-pattern---overview">Builder Pattern - Overview</h2>
<ul>
<li><strong>Category</strong>: Creational Pattern</li>
<li><strong>Complexity</strong>: Medium</li>
<li><strong>Popularity</strong>: High</li>
</ul>
<p><strong>Intent</strong>: Builder is a creational design pattern that lets you construct complex objects step by step. The pattern allows you to produce different types and representations of an object using the same construction code.</p>
<p>Reference: <a href="https://refactoring.guru/design-patterns/builder">RefactoringGuru - Builder</a></p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-9" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="59" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-9;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="118">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="builder---the-problem-subclass-explosion">Builder - The Problem (Subclass Explosion)</h2>
<p>Imagine a complex object that requires laborious, step-by-step initialization of many fields and nested objects. Such initialization code is usually buried inside a monstrous constructor with lots of parameters. Or even worse: scattered all over the client code.</p>
<p><strong>Example</strong>: Building a <code>House</code> object.</p>
<ul>
<li>A simple house needs walls, a floor, a door, windows, and a roof.</li>
<li>But what if you want a bigger, brighter house, with a backyard, a swimming pool, a garage, and other goodies?</li>
</ul>
<p>The simplest solution is to extend the base <code>House</code> class and create subclasses for every combination of parameters. But eventually you will end up with a <strong>considerable number of subclasses</strong>. Any new parameter will require growing this hierarchy even more.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-9" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="60" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-9;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="118">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="builder---the-problem-telescoping-constructor">Builder - The Problem (Telescoping Constructor)</h2>
<p>There is another approach that does not involve breeding subclasses. You can create a giant constructor right in the base <code>House</code> class with all possible parameters that control the house object.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Telescoping constructor anti-pattern</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">House</span> {
    House(<span class="hljs-type">int</span> windows, <span class="hljs-type">int</span> doors, <span class="hljs-type">int</span> rooms,
          <span class="hljs-type">boolean</span> hasGarage, <span class="hljs-type">boolean</span> hasSwimPool,
          <span class="hljs-type">boolean</span> hasStatues, <span class="hljs-type">boolean</span> hasGarden,
          <span class="hljs-type">boolean</span> hasYard, <span class="hljs-type">boolean</span> hasFence) {
        <span class="hljs-comment">// ...</span>
    }
}

<span class="hljs-comment">// Client code - very hard to read</span>
<span class="hljs-keyword">new</span> <span class="hljs-title class_">House</span>(<span class="hljs-number">4</span>, <span class="hljs-number">2</span>, <span class="hljs-number">5</span>, <span class="hljs-literal">true</span>, <span class="hljs-literal">false</span>, <span class="hljs-literal">false</span>, <span class="hljs-literal">true</span>, <span class="hljs-literal">true</span>, <span class="hljs-literal">false</span>);
</code></pre>
<p>In most cases, <strong>most of the parameters will be unused</strong>, making the constructor calls pretty ugly.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-9" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

" data-lang="en-US" lang="en-US" data-marpit-pagination="61" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-9;--theme:default;--style:img[alt~=&quot;center&quot;] {

;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="118">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="builder---the-solution">Builder - The Solution</h2>
<p>The Builder pattern suggests that you extract the object construction code out of its own class and move it to separate objects called <strong>builders</strong>.</p>
<p>The pattern organizes object construction into a set of steps (<code>buildWalls</code>, <code>buildDoor</code>, etc.). To create an object, you execute a series of these steps on a builder object. The important part is that <strong>you don't need to call all of the steps</strong>. You can call only those steps that are necessary for producing a particular configuration of an object.</p>
<p><strong>Director</strong> (optional): You can further extract a series of calls to the builder steps into a separate class called the <strong>director</strong>. The director defines the order in which to execute the building steps, while the builder provides the implementation for those steps.</p>
<ul>
<li>Having a director class is not strictly necessary.</li>
<li>However, the director class might be a good place to put various construction routines so you can reuse them across your program.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-9" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

<header>CEN206 Object-Oriented Programming</header>
<h2 id="builder---structure">Builder - Structure</h2>
<p>The Builder pattern has five key participants:</p>
<ol>
<li>
<p><strong>Builder Interface</strong> declares product construction steps that are common to all types of builders.</p>
</li>
<li>
<p><strong>Concrete Builders</strong> provide different implementations of the construction steps. Concrete builders may produce products that do not follow the common interface.</p>
</li>
<li>
<p><strong>Products</strong> are resulting objects. Products constructed by different builders do not have to belong to the same class hierarchy or interface.</p>
</li>
<li>
<p><strong>Director</strong> (optional) defines the order in which to call construction steps, so you can create and reuse specific configurations of products.</p>
</li>
<li>
<p><strong>Client</strong> must associate one of the builder objects with the director (or use the builder directly). Usually, it is done just once, via parameters of the director's constructor.</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="builder---pseudocode">Builder - Pseudocode</h2>
<p>This example illustrates how the Builder pattern can be used for constructing different types of products (Car and Manual) using the same building steps.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">// The builder interface specifies methods for creating
// the different parts of the product objects.
interface Builder is
    method reset()
    method setSeats(number)
    method setEngine(engine: Engine)
    method setTripComputer()
    method setGPS()

// Concrete builders implement the builder interface
// and provide specific implementations of building steps.
class CarBuilder implements Builder is
    private field car: Car
    method reset() is
        this.car = new Car()
    method setSeats(number) is
        // Set the number of seats in the car.
    method setEngine(engine: Engine) is
        // Install a given engine.
    method setTripComputer() is
        // Install a trip computer.
    method setGPS() is
        // Install a GPS.
    method getProduct(): Car is
        product = this.car
        this.reset()
        return product
</code></pre>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="builder---pseudocode-cont">Builder - Pseudocode (cont.)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">// Unlike other creational patterns, Builder lets you
// construct unrelated products with the same process.
class CarManualBuilder implements Builder is
    private field manual: Manual
    method reset() is
        this.manual = new Manual()
    method setSeats(number) is
        // Document car seat features.
    method setEngine(engine: Engine) is
        // Add engine instructions.
    method setTripComputer() is
        // Add trip computer instructions.
    method setGPS() is
        // Add GPS instructions.
    method getProduct(): Manual is
        // Return the manual and reset the builder.

// The director is only responsible for executing the
// building steps in a particular sequence.
class Director is
    method constructSportsCar(builder: Builder) is
        builder.reset()
        builder.setSeats(2)
        builder.setEngine(new SportEngine())
        builder.setTripComputer()
        builder.setGPS()
    method constructSUV(builder: Builder) is
        builder.reset()
        builder.setSeats(4)
        builder.setEngine(new SUVEngine())
        builder.setGPS()
</code></pre>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="builder---applicability">Builder - Applicability</h2>
<p>Use the Builder pattern when:</p>
<ol>
<li>
<p><strong>You want to get rid of a &quot;telescoping constructor&quot;.</strong></p>
<ul>
<li>The Builder pattern lets you build objects step by step, using only those steps that you really need. After implementing the pattern, you don't have to cram dozens of parameters into your constructors.</li>
</ul>
</li>
<li>
<p><strong>You want your code to be able to create different representations of some product</strong> (e.g., stone and wooden houses).</p>
<ul>
<li>The Builder pattern can be applied when construction of various representations of the product involves similar steps that differ only in the details.</li>
<li>The base builder interface defines all possible construction steps, and concrete builders implement these steps to construct particular representations of the product.</li>
</ul>
</li>
<li>
<p><strong>You want to construct Composite trees or other complex objects.</strong></p>
<ul>
<li>The Builder pattern lets you construct products step-by-step. You could defer execution of some steps without breaking the final product. You can even call steps recursively, which comes in handy when you need to build an object tree.</li>
</ul>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="builder---how-to-implement">Builder - How to Implement</h2>
<ol>
<li>
<p><strong>Make sure</strong> that you can clearly define the common construction steps for building all available product representations. Otherwise, you will not be able to proceed with implementing the pattern.</p>
</li>
<li>
<p><strong>Declare these steps</strong> in the base builder interface.</p>
</li>
<li>
<p><strong>Create a concrete builder class</strong> for each of the product representations and implement their construction steps.</p>
<ul>
<li>Don't forget about implementing a method for fetching the result of the construction. This method cannot be declared inside the builder interface because various builders may construct products that don't have a common interface.</li>
</ul>
</li>
<li>
<p><strong>Think about creating a director class.</strong> It may encapsulate various ways to construct a product using the same builder object.</p>
</li>
<li>
<p><strong>The client code creates both the builder and the director objects.</strong> Before construction starts, the client must pass a builder object to the director. Usually, the client does this only once, via parameters of the director's constructor or via a setter method.</p>
</li>
<li>
<p><strong>The construction result can be obtained directly from the builder</strong> only if all products follow the same interface. Otherwise, the client should fetch the result from the builder.</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="builder---pros-and-cons">Builder - Pros and Cons</h2>
<h3 id="pros-2">Pros</h3>
<ul>
<li><strong>Step-by-step construction</strong>: You can construct objects step-by-step, defer construction steps or run steps recursively.</li>
<li><strong>Reusable construction code</strong>: You can reuse the same construction code when building various representations of products.</li>
<li><strong>Single Responsibility Principle (SRP)</strong>: You can isolate complex construction code from the business logic of the product.</li>
</ul>
<h3 id="cons-2">Cons</h3>
<ul>
<li><strong>Increased complexity</strong>: The overall complexity of the code increases since the pattern requires creating multiple new classes.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="builder---relations-with-other-patterns">Builder - Relations with Other Patterns</h2>
<ul>
<li>
<p>Many designs start by using <strong>Factory Method</strong> (less complicated, more customizable via subclasses) and evolve toward <strong>Abstract Factory</strong>, <strong>Prototype</strong>, or <strong>Builder</strong> (more flexible, but more complex).</p>
</li>
<li>
<p><strong>Builder</strong> focuses on constructing complex objects step by step. <strong>Abstract Factory</strong> specializes in creating families of related objects. Abstract Factory returns the product immediately, whereas Builder lets you run some additional construction steps before fetching the product.</p>
</li>
<li>
<p>You can use <strong>Builder</strong> when creating complex <strong>Composite</strong> trees because you can program its construction steps to work recursively.</p>
</li>
<li>
<p>You can combine <strong>Builder</strong> with <strong>Bridge</strong>: the director class plays the role of the abstraction, while different builders act as implementations.</p>
</li>
<li>
<p><strong>Abstract Factories</strong>, <strong>Builders</strong>, and <strong>Prototypes</strong> can all be implemented as <strong>Singletons</strong>.</p>
</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Builder interface</span>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Director</span>

<span class="hljs-comment">// Client code</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">BuilderDemo</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-d-takeaways">Module D: Takeaways</h2>
<ul>
<li><strong>Builder</strong> lets you construct complex objects step by step, using only the steps you need.</li>
<li>It solves the <strong>telescoping constructor</strong> problem and the <strong>subclass explosion</strong> problem.</li>
<li>The pattern uses <strong>five participants</strong>: Builder Interface, Concrete Builders, Products, Director, and Client.</li>
<li>The <strong>Director</strong> is optional but useful for encapsulating common construction routines.</li>
<li>Builder supports the <strong>Single Responsibility Principle</strong> by isolating construction logic from business logic.</li>
<li>The main trade-off is <strong>increased code complexity</strong> due to multiple new classes.</li>
<li>Builder can be combined with <strong>Composite</strong> (for building tree structures), <strong>Bridge</strong>, and can be implemented as a <strong>Singleton</strong>.</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="prototype-pattern---overview">Prototype Pattern - Overview</h2>
<ul>
<li><strong>Also Known As</strong>: Clone</li>
<li><strong>Category</strong>: Creational Pattern</li>
<li><strong>Complexity</strong>: Low</li>
<li><strong>Popularity</strong>: Medium</li>
</ul>
<p><strong>Intent</strong>: Prototype is a creational design pattern that lets you copy existing objects without making your code dependent on their classes.</p>
<p>Reference: <a href="https://refactoring.guru/design-patterns/prototype">RefactoringGuru - Prototype</a></p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>
</section>

;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="118">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="prototype---the-problem">Prototype - The Problem</h2>
<p>Say you have an object, and you want to create an exact copy of it. How would you do it?</p>
<ol>
<li><strong>First</strong>, you have to create a new object of the same class.</li>
<li><strong>Then</strong>, you have to go through all the fields of the original object and copy their values over to the new object.</li>
</ol>
<p><strong>But there are problems:</strong></p>
<ul>
<li><strong>Not all objects can be copied that way</strong> because some of the object's fields may be private and not visible from outside of the object itself.</li>
<li><strong>Your code becomes dependent on the class</strong> of the object being copied. You have to know the object's class to create a duplicate, making your code dependent on that class.</li>
<li><strong>Sometimes you only know the interface</strong> that the object follows, but not its concrete class. For example, when a method accepts any objects that follow some interface, you don't know the concrete classes of those objects.</li>
<li><strong>Complex configurations</strong>: When an object has complex internal state (connections, references, caches), simply knowing its class isn't enough to duplicate it properly.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-9" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

" data-lang="en-US" lang="en-US" data-marpit-pagination="79" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-9;--theme:default;--style:img[alt~=&quot;center&quot;] {

;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="118">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="prototype---the-solution">Prototype - The Solution</h2>
<p>The Prototype pattern delegates the cloning process to the actual objects that are being cloned. The pattern declares a common interface for all objects that support cloning. This interface lets you clone an object without coupling your code to the class of that object. Usually, such an interface contains just a single <code>clone</code> method.</p>
<p><strong>How it works:</strong></p>
<ul>
<li>An object that supports cloning is called a <strong>prototype</strong>.</li>
<li>When your objects have dozens of fields and hundreds of possible configurations, cloning them might serve as an alternative to subclassing.</li>
<li>You create a set of objects, configured in various ways. When you need an object like the one you have configured, you just clone a prototype instead of constructing a new object from scratch.</li>
</ul>
<p><strong>Pre-built prototypes</strong>: The pattern provides a way to create pre-built prototype objects. You can think of it as an analog of a catalog. These prototypes can have complex state already configured.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="prototype---the-solution-cont">Prototype - The Solution (cont.)</h2>
<p><strong>Prototype Registry (Cache)</strong>:</p>
<p>An optional addition to the pattern is a <strong>Prototype Registry</strong> that provides an easy way to access frequently-used prototypes. It stores a set of pre-built objects that are ready to be copied.</p>
<p>The simplest prototype registry is a <strong>name -&gt; prototype</strong> hash map. However, if you need better search criteria than a simple name, you can build a much more robust version of the registry.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">PrototypeRegistry
┌─────────────────────────────────┐
│  items: Map&lt;String, Prototype&gt;  │
│                                 │
│  addItem(id, prototype)         │
│  getById(id): Prototype         │
│  getByColor(color): Prototype   │
└─────────────────────────────────┘
</code></pre>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="prototype---structure">Prototype - Structure</h2>
<p><strong>Basic Implementation:</strong></p>
<ol>
<li>
<p><strong>Prototype Interface</strong> declares the cloning methods. In most cases, it is a single <code>clone</code> method.</p>
</li>
<li>
<p><strong>Concrete Prototype</strong> class implements the cloning method. In addition to copying the original object's data to the clone, this method may also handle some edge cases of the cloning process related to cloning linked objects, untangling recursive dependencies, etc.</p>
</li>
<li>
<p><strong>Client</strong> can produce a copy of any object that follows the prototype interface.</p>
</li>
</ol>
<p><strong>Registry Implementation (variant):</strong></p>
<ol start="4">
<li><strong>Prototype Registry</strong> provides an easy way to access frequently-used prototypes. It stores a set of pre-built objects that are ready to be copied. The simplest registry is a <code>name -&gt; prototype</code> hash map.</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="prototype---pseudocode">Prototype - Pseudocode</h2>
<p>In this example, the Prototype pattern lets you produce exact copies of geometric objects, without coupling the code to their classes.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">// Base prototype
abstract class Shape is
    field X: int
    field Y: int
    field color: string

    // A regular constructor
    constructor Shape() is
        // ...

    // The prototype constructor. A fresh object is
    // initialized with values from the existing object.
    constructor Shape(source: Shape) is
        this()
        this.X = source.X
        this.Y = source.Y
        this.color = source.color

    // The clone operation returns one of the Shape
    // subclasses.
    abstract method clone(): Shape
</code></pre>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="prototype---pseudocode-cont">Prototype - Pseudocode (cont.)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">class Rectangle extends Shape is
    field width: int
    field height: int

    constructor Rectangle(source: Rectangle) is
        super(source)
        this.width = source.width
        this.height = source.height

    method clone(): Shape is
        return new Rectangle(this)

class Circle extends Shape is
    field radius: int

    constructor Circle(source: Circle) is
        super(source)
        this.radius = source.radius

    method clone(): Shape is
        return new Circle(this)
</code></pre>

<h2 id="prototype---pseudocode-cont-1">Prototype - Pseudocode (cont.)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">// Somewhere in the client code.
class Application is
    field shapes: array of Shape

    constructor Application() is
        Circle circle = new Circle()
        circle.X = 10
        circle.Y = 10
        circle.radius = 20
        shapes.add(circle)

        Circle anotherCircle = circle.clone()
        shapes.add(anotherCircle)
        // anotherCircle is an exact copy of circle

        Rectangle rect = new Rectangle()
        rect.width = 10
        rect.height = 20
        shapes.add(rect)

    method businessLogic() is
        // Prototype rocks because it lets you produce
        // a copy of an object without knowing anything
        // about its type.
        Array shapesCopy = new Array of Shapes

        foreach (s in shapes) do
            shapesCopy.add(s.clone())
        // shapesCopy contains exact copies of shapes
</code></pre>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="prototype---applicability">Prototype - Applicability</h2>
<p>Use the Prototype pattern when:</p>
<ol>
<li>
<p><strong>Your code should not depend on the concrete classes of objects that you need to copy.</strong></p>
<ul>
<li>This happens a lot when your code works with objects passed to you from 3rd-party code via some interface. The concrete classes of these objects are unknown, and you could not depend on them even if you wanted to.</li>
<li>The Prototype pattern provides the client code with a general interface for working with all objects that support cloning. This interface makes the client code independent from the concrete classes of objects that it clones.</li>
</ul>
</li>
<li>
<p><strong>You want to reduce the number of subclasses that only differ in the way they initialize their respective objects.</strong></p>
<ul>
<li>Somebody could have created these subclasses to be able to create objects with a specific configuration.</li>
<li>The Prototype pattern lets you use a set of pre-built objects configured in various ways as prototypes. Instead of instantiating a subclass that matches some configuration, the client can simply look for an appropriate prototype and clone it.</li>
</ul>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="prototype---how-to-implement">Prototype - How to Implement</h2>
<ol>
<li>
<p><strong>Create the prototype interface</strong> and declare the <code>clone</code> method in it. Or just add the method to all classes of an existing class hierarchy, if you have one.</p>
</li>
<li>
<p><strong>A prototype class must define the alternative constructor</strong> that accepts an object of that class as an argument. The constructor must copy the values of all fields defined in the class from the passed object into the newly created instance. If you are changing a subclass, you must call the parent constructor to let the superclass handle the cloning of its private fields.</p>
</li>
<li>
<p><strong>The cloning method usually consists of just one line</strong>: running a <code>new</code> operator with the prototypical version of the constructor. Note, every class must explicitly override the cloning method and use its own class name along with the <code>new</code> operator. Otherwise, the cloning method may produce an object of a parent class.</p>
</li>
<li>
<p><strong>Optionally, create a centralized prototype registry</strong> to store a catalog of frequently used prototypes.</p>
</li>
<li>
<p><strong>You can implement the registry as a new factory class</strong> or put it in the base prototype class with a static method for fetching the prototype. This method should search for a prototype based on search criteria that the client code passes to the method.</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="prototype---pros-and-cons">Prototype - Pros and Cons</h2>
<h3 id="pros-3">Pros</h3>
<ul>
<li><strong>Clone objects without coupling</strong> to their concrete classes.</li>
<li><strong>Get rid of repeated initialization code</strong> in favor of cloning pre-built prototypes.</li>
<li><strong>Produce complex objects more conveniently</strong>: when objects have complex internal state, cloning is faster and easier than building from scratch.</li>
<li><strong>Alternative to inheritance</strong>: You get an alternative for dealing with configuration presets for complex objects. Instead of creating subclasses for each configuration, you can create prototypes with different configurations and clone them.</li>
</ul>
<h3 id="cons-3">Cons</h3>
<ul>
<li><strong>Cloning complex objects with circular references</strong> might be very tricky. Deep cloning objects that contain references to other objects requires careful handling of circular dependencies.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="prototype---relations-with-other-patterns">Prototype - Relations with Other Patterns</h2>
<ul>
<li>
<p>Many designs start by using <strong>Factory Method</strong> (less complicated, more customizable via subclasses) and evolve toward <strong>Abstract Factory</strong>, <strong>Prototype</strong>, or <strong>Builder</strong> (more flexible, but more complex).</p>
</li>
<li>
<p><strong>Abstract Factory</strong> classes are often based on a set of <strong>Factory Methods</strong>, but you can also use <strong>Prototype</strong> to compose the methods on these classes.</p>
</li>
<li>
<p><strong>Prototype</strong> can help when you need to save copies of <strong>Commands</strong> into history (Memento pattern alternative).</p>
</li>
<li>
<p>Designs that make heavy use of <strong>Composite</strong> and <strong>Decorator</strong> can often benefit from using <strong>Prototype</strong>. Applying the pattern lets you clone complex structures instead of re-constructing them from scratch.</p>
</li>
<li>
<p><strong>Prototype</strong> is not based on inheritance, so it does not have its drawbacks. On the other hand, Prototype requires a complicated initialization of the cloned object. <strong>Factory Method</strong> is based on inheritance but does not require an initialization step.</p>
</li>
<li>
<p>Sometimes <strong>Prototype</strong> can be a simpler alternative to <strong>Memento</strong>. This works if the object, the state of which you want to store in the history, is fairly straightforward and does not have links to external resources, or the links are easy to re-establish.</p>
</li>
<li>
<p><strong>Abstract Factories</strong>, <strong>Builders</strong>, and <strong>Prototypes</strong> can all be implemented as <strong>Singletons</strong>.</p>
</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>
</section>
