<header>CEN206 Object-Oriented Programming</header>
<h2 id="prototype---java-code-example-cont-3">Prototype - Java Code Example (cont.)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Client code</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">PrototypeDemo</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
        <span class="hljs-comment">// Create original shapes</span>
        <span class="hljs-type">Circle</span> <span class="hljs-variable">circle</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Circle</span>();
        circle.x = <span class="hljs-number">10</span>;
        circle.y = <span class="hljs-number">20</span>;
        circle.radius = <span class="hljs-number">15</span>;
        circle.color = <span class="hljs-string">&quot;red&quot;</span>;

        <span class="hljs-comment">// Clone the circle</span>
        <span class="hljs-type">Circle</span> <span class="hljs-variable">clonedCircle</span> <span class="hljs-operator">=</span> (Circle) circle.clone();
        System.out.println(<span class="hljs-string">&quot;Original: &quot;</span> + circle);
        System.out.println(<span class="hljs-string">&quot;Clone:    &quot;</span> + clonedCircle);
        System.out.println(<span class="hljs-string">&quot;Same object? &quot;</span> +
            (circle == clonedCircle)); <span class="hljs-comment">// false</span>

        <span class="hljs-comment">// Use prototype registry</span>
        <span class="hljs-type">PrototypeRegistry</span> <span class="hljs-variable">registry</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">PrototypeRegistry</span>();
        registry.addItem(<span class="hljs-string">&quot;big-red-circle&quot;</span>, circle);

        <span class="hljs-type">Rectangle</span> <span class="hljs-variable">rect</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Rectangle</span>();
        rect.x = <span class="hljs-number">0</span>; rect.y = <span class="hljs-number">0</span>;
        rect.width = <span class="hljs-number">100</span>; rect.height = <span class="hljs-number">50</span>;
        rect.color = <span class="hljs-string">&quot;blue&quot;</span>;
        registry.addItem(<span class="hljs-string">&quot;blue-rect&quot;</span>, rect);

        <span class="hljs-comment">// Get clones from registry</span>
        <span class="hljs-type">Shape</span> <span class="hljs-variable">s1</span> <span class="hljs-operator">=</span> registry.getById(<span class="hljs-string">&quot;big-red-circle&quot;</span>);

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-e-takeaways">Module E: Takeaways</h2>
<ul>
<li><strong>Prototype</strong> (also known as <strong>Clone</strong>) lets you copy existing objects without making your code dependent on their classes.</li>
<li>It solves the problem of <strong>class dependency</strong> when copying objects and handles the issue of <strong>private fields</strong> that cannot be accessed from outside.</li>
<li>The pattern uses a <strong>clone interface</strong>, <strong>concrete prototypes</strong> with copy constructors, and an optional <strong>Prototype Registry</strong>.</li>
<li>Prototype is an <strong>alternative to inheritance</strong> for dealing with configuration presets: instead of subclasses, use pre-configured prototypes and clone them.</li>
<li>The main challenge is handling <strong>circular references</strong> during deep cloning.</li>
<li>Prototype can be combined with <strong>Composite</strong> and <strong>Decorator</strong> patterns to clone complex structures.</li>
<li>Unlike <strong>Factory Method</strong>, Prototype is <strong>not based on inheritance</strong> but requires a proper initialization of the cloned object.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="singleton-pattern---overview">Singleton Pattern - Overview</h2>
<ul>
<li><strong>Category</strong>: Creational Pattern</li>
<li><strong>Complexity</strong>: Low</li>
<li><strong>Popularity</strong>: Very High (also controversial)</li>
</ul>
<p><strong>Intent</strong>: Singleton is a creational design pattern that lets you ensure that a class has only one instance, while providing a global access point to this instance.</p>
<p>Reference: <a href="https://refactoring.guru/design-patterns/singleton">RefactoringGuru - Singleton</a></p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="99" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-9" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

" data-lang="en-US" lang="en-US" data-marpit-pagination="99" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-9;--theme:default;--style:img[alt~=&quot;center&quot;] {

;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="118">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="singleton---the-problem">Singleton - The Problem</h2>
<p>The Singleton pattern solves two problems at the same time (violating the Single Responsibility Principle):</p>
<p><strong>1. Ensure that a class has just a single instance.</strong></p>
<ul>
<li>Why would anyone want to control how many instances a class has? The most common reason is to <strong>control access to some shared resource</strong> -- for example, a database or a file.</li>
<li>It works like this: imagine that you created an object, but after a while decided to create a new one. Instead of receiving a fresh object, you get the one that was already created.</li>
<li>Note that this behavior is impossible to implement with a regular constructor since a constructor call must always return a new object by design.</li>
</ul>
<p><strong>2. Provide a global access point to that instance.</strong></p>
<ul>
<li>Remember global variables? While they are very handy, they are also very unsafe because any code can potentially overwrite the contents of those variables and crash the app.</li>
<li>Just like a global variable, the Singleton pattern lets you access some object from anywhere in the program. However, it also <strong>protects that instance from being overwritten</strong> by other code.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="100" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-9" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

" data-lang="en-US" lang="en-US" data-marpit-pagination="100" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-9;--theme:default;--style:img[alt~=&quot;center&quot;] {

<header>CEN206 Object-Oriented Programming</header>
<h2 id="singleton---the-solution">Singleton - The Solution</h2>
<p>All implementations of the Singleton have two common steps:</p>
<ol>
<li>
<p><strong>Make the default constructor private</strong>, to prevent other objects from using the <code>new</code> operator with the Singleton class.</p>
</li>
<li>
<p><strong>Create a static creation method</strong> that acts as a constructor. Under the hood, this method calls the private constructor to create an object and saves it in a static field. All following calls to this method return the cached object.</p>
</li>
</ol>
<p>If your code has access to the Singleton class, then it is able to call the Singleton's static method. So whenever that method is called, the same object is always returned.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Singleton
┌──────────────────────────────────┐
│ - instance: Singleton (static)   │
│ - Singleton() (private)          │
│                                  │
│ + getInstance(): Singleton       │
│ + businessLogic()                │
└──────────────────────────────────┘
</code></pre>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="singleton---structure">Singleton - Structure</h2>
<p>The <strong>Singleton</strong> class declares the static method <code>getInstance</code> that returns the same instance of its own class.</p>
<ul>
<li>The Singleton's constructor should be hidden from the client code.</li>
<li>Calling the <code>getInstance</code> method should be the only way of getting the Singleton object.</li>
</ul>
<p><strong>Key structural elements:</strong></p>
<table>
<thead>
<tr>
<th>Element</th>
<th>Description</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>- instance: Singleton</code></td>
<td>Static field holding the single instance</td>
</tr>
<tr>
<td><code>- Singleton()</code></td>
<td>Private constructor preventing external instantiation</td>
</tr>
<tr>
<td><code>+ getInstance()</code></td>
<td>Public static method returning the single instance</td>
</tr>
<tr>
<td>Business methods</td>
<td>Any methods the Singleton class needs to provide</td>
</tr>
</tbody>
</table>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="singleton---pseudocode">Singleton - Pseudocode</h2>
<p>In this example, the database connection class acts as a Singleton. This class does not have a public constructor, so the only way to get its object is to call the <code>getInstance</code> method. This method caches the first created object and returns it in all subsequent calls.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">class Database is
    // The field for storing the singleton instance
    // should be declared static.
    private static field instance: Database

    // The singleton&#x27;s constructor should always be
    // private to prevent direct construction calls
    // with the `new` operator.
    private constructor Database() is
        // Some initialization code, such as the actual
        // connection to a database server.

    // The static method that controls the access to
    // the singleton instance.
    public static method getInstance() is
        if (Database.instance == null) then
            acquireThreadLock() and then
                // Ensure that the instance has not yet been
                // initialized by another thread.
                if (Database.instance == null) then
                    Database.instance = new Database()
        return Database.instance

    public method query(sql) is
        // All database queries go through this method.
</code></pre>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="singleton---thread-safety-issue">Singleton - Thread Safety Issue</h2>
<p><strong>Naive implementation is NOT thread-safe:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">// BROKEN: Race condition possible
public static Singleton getInstance() {
    if (instance == null) {          // Thread A checks
        // Thread B also checks - both see null!
        instance = new Singleton();  // Both create instances!
    }
    return instance;
}
</code></pre>
<p><strong>Timeline of the race condition:</strong></p>
<table>
<thead>
<tr>
<th>Time</th>
<th>Thread A</th>
<th>Thread B</th>
</tr>
</thead>
<tbody>
<tr>
<td>T1</td>
<td>Checks <code>instance == null</code> (true)</td>
<td>--</td>
</tr>
<tr>
<td>T2</td>
<td>--</td>
<td>Checks <code>instance == null</code> (true)</td>
</tr>
<tr>
<td>T3</td>
<td>Creates new instance</td>
<td>--</td>
</tr>
<tr>
<td>T4</td>
<td>--</td>
<td>Creates ANOTHER new instance</td>
</tr>
<tr>
<td>T5</td>
<td>Two different instances exist!</td>
<td>Singleton violated!</td>
</tr>
</tbody>
</table>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="singleton---applicability">Singleton - Applicability</h2>
<p>Use the Singleton pattern when:</p>
<ol>
<li>
<p><strong>A class in your program should have just a single instance</strong> available to all clients; for example, a single database object shared by different parts of the program.</p>
<ul>
<li>The Singleton pattern disables all other means of creating objects of a class except for the special creation method. This method either creates a new object or returns an existing one if it has already been created.</li>
</ul>
</li>
<li>
<p><strong>You need stricter control over global variables.</strong></p>
<ul>
<li>Unlike global variables, the Singleton pattern guarantees that there is just one instance of a class. Nothing, except for the Singleton class itself, can replace the cached instance.</li>
<li>Note that you can always adjust this limitation and allow creating any number of Singleton instances. The only piece of code that needs changing is the body of the <code>getInstance</code> method.</li>
</ul>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="singleton---how-to-implement">Singleton - How to Implement</h2>
<ol>
<li>
<p><strong>Add a private static field</strong> to the class for storing the singleton instance.</p>
</li>
<li>
<p><strong>Declare a public static creation method</strong> for getting the singleton instance.</p>
</li>
<li>
<p><strong>Implement &quot;lazy initialization&quot;</strong> inside the static method. It should create a new object on its first call and put it into the static field. The method should always return that instance on all subsequent calls.</p>
</li>
<li>
<p><strong>Make the constructor of the class private.</strong> The static method of the class will still be able to call the constructor, but not the other objects.</p>
</li>
<li>
<p><strong>Go over the client code</strong> and replace all direct calls to the singleton's constructor with calls to its static creation method.</p>
</li>
</ol>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="singleton---pros-and-cons">Singleton - Pros and Cons</h2>
<h3 id="pros-4">Pros</h3>
<ul>
<li><strong>Single instance guarantee</strong>: You can be sure that a class has only a single instance.</li>
<li><strong>Global access point</strong>: You gain a global access point to that instance.</li>
<li><strong>Lazy initialization</strong>: The singleton object is initialized only when it is requested for the first time, saving resources if it is never used.</li>
</ul>
<h3 id="cons-4">Cons</h3>
<ul>
<li><strong>Violates the Single Responsibility Principle (SRP)</strong>: The pattern solves two problems at the same time (single instance + global access).</li>
<li><strong>Can mask bad design</strong>: For instance, when the components of the program know too much about each other.</li>
<li><strong>Requires special treatment in a multithreaded environment</strong>: so that multiple threads will not create a singleton object several times.</li>
<li><strong>Difficult to unit test</strong>: The Singleton's constructor is private and overriding static methods is impossible in most languages. You need to think of a creative way to mock the singleton. Or just don't write the tests. Or don't use the Singleton pattern.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-9</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="singleton---relations-with-other-patterns">Singleton - Relations with Other Patterns</h2>
<ul>
<li>
<p>A <strong>Facade</strong> class can often be transformed into a <strong>Singleton</strong> since a single facade object is sufficient in most cases.</p>
</li>
<li>
<p><strong>Flyweight</strong> would resemble <strong>Singleton</strong> if you somehow managed to reduce all shared states of the objects to just one flyweight object. But there are two fundamental differences:</p>
<ol>
<li>There should be only one Singleton instance, whereas a Flyweight class can have multiple instances with different intrinsic states.</li>
<li>The Singleton object can be mutable. Flyweight objects are immutable.</li>
</ol>
</li>
<li>
<p><strong>Abstract Factories</strong>, <strong>Builders</strong>, and <strong>Prototypes</strong> can all be implemented as <strong>Singletons</strong>.</p>
</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="singleton---java-code-example-thread-safe">Singleton - Java Code Example (Thread-Safe)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Thread-safe Singleton with double-checked locking</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ThreadSafeSingleton</span> {
    <span class="hljs-comment">// volatile ensures visibility across threads</span>
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">volatile</span> ThreadSafeSingleton instance;

    <span class="hljs-keyword">private</span> String data;

    <span class="hljs-keyword">private</span> <span class="hljs-title function_">ThreadSafeSingleton</span><span class="hljs-params">(String data)</span> {
        <span class="hljs-built_in">this</span>.data = data;
        <span class="hljs-comment">// Simulate slow initialization</span>
        <span class="hljs-keyword">try</span> {
            Thread.sleep(<span class="hljs-number">1000</span>);
        } <span class="hljs-keyword">catch</span> (InterruptedException e) {
            e.printStackTrace();
        }
    }

    <span class="hljs-comment">// Double-checked locking</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> ThreadSafeSingleton <span class="hljs-title function_">getInstance</span><span class="hljs-params">(String data)</span> {
        <span class="hljs-type">ThreadSafeSingleton</span> <span class="hljs-variable">result</span> <span class="hljs-operator">=</span> instance;
        <span class="hljs-keyword">if</span> (result != <span class="hljs-literal">null</span>) {
            <span class="hljs-keyword">return</span> result;  <span class="hljs-comment">// Fast path: no locking needed</span>
        }
        <span class="hljs-keyword">synchronized</span> (ThreadSafeSingleton.class) {
            <span class="hljs-keyword">if</span> (instance == <span class="hljs-literal">null</span>) {
                instance = <span class="hljs-keyword">new</span> <span class="hljs-title class_">ThreadSafeSingleton</span>(data);
            }
            <span class="hljs-keyword">return</span> instance;
        }
    }

    <span class="hljs-keyword">public</span> String <span class="hljs-title function_">getData</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> data; }
}
</code></pre>

<h2 id="singleton---java-code-example-enum-based">Singleton - Java Code Example (Enum-Based)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// The simplest and most effective Singleton in Java</span>
<span class="hljs-comment">// Joshua Bloch recommends this approach in Effective Java</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">enum</span> <span class="hljs-title class_">DatabaseConnection</span> {
    INSTANCE;

    <span class="hljs-keyword">private</span> String connectionString;

    DatabaseConnection() {
        <span class="hljs-comment">// Initialization happens once, guaranteed by JVM</span>
        <span class="hljs-built_in">this</span>.connectionString = <span class="hljs-string">&quot;jdbc:mysql://localhost:3306/mydb&quot;</span>;
        System.out.println(<span class="hljs-string">&quot;Database connection initialized.&quot;</span>);
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">query</span><span class="hljs-params">(String sql)</span> {
        System.out.println(<span class="hljs-string">&quot;Executing query: &quot;</span> + sql
            + <span class="hljs-string">&quot; on &quot;</span> + connectionString);
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">setConnectionString</span><span class="hljs-params">(String conn)</span> {
        <span class="hljs-built_in">this</span>.connectionString = conn;
    }
}

<span class="hljs-comment">// Usage</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">EnumSingletonDemo</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
        <span class="hljs-type">DatabaseConnection</span> <span class="hljs-variable">db</span> <span class="hljs-operator">=</span> DatabaseConnection.INSTANCE;
        db.query(<span class="hljs-string">&quot;SELECT * FROM users&quot;</span>);

        <span class="hljs-comment">// Same instance everywhere</span>
        <span class="hljs-type">DatabaseConnection</span> <span class="hljs-variable">db2</span> <span class="hljs-operator">=</span> DatabaseConnection.INSTANCE;
        System.out.println(<span class="hljs-string">&quot;Same? &quot;</span> + (db == db2)); <span class="hljs-comment">// true</span>
    }
}
</code></pre>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="singleton---comparison-of-implementations">Singleton - Comparison of Implementations</h2>
<table>
<thead>
<tr>
<th>Approach</th>
<th style="text-align:center">Thread Safe</th>
<th style="text-align:center">Lazy Init</th>
<th style="text-align:center">Serialization Safe</th>
<th style="text-align:center">Reflection Safe</th>
</tr>
</thead>
<tbody>
<tr>
<td>Naive</td>
<td style="text-align:center">No</td>
<td style="text-align:center">Yes</td>
<td style="text-align:center">No</td>
<td style="text-align:center">No</td>
</tr>
<tr>
<td>Synchronized method</td>
<td style="text-align:center">Yes</td>
<td style="text-align:center">Yes</td>
<td style="text-align:center">No</td>
<td style="text-align:center">No</td>
</tr>
<tr>
<td>Double-checked locking</td>
<td style="text-align:center">Yes</td>
<td style="text-align:center">Yes</td>
<td style="text-align:center">No</td>
<td style="text-align:center">No</td>
</tr>
<tr>
<td>Bill Pugh (Inner class)</td>
<td style="text-align:center">Yes</td>
<td style="text-align:center">Yes</td>
<td style="text-align:center">No</td>
<td style="text-align:center">No</td>
</tr>
<tr>
<td><strong>Enum</strong></td>
<td style="text-align:center"><strong>Yes</strong></td>
<td style="text-align:center"><strong>No</strong></td>
<td style="text-align:center"><strong>Yes</strong></td>
<td style="text-align:center"><strong>Yes</strong></td>
</tr>
</tbody>
</table>
<ul>
<li>The <strong>Enum-based</strong> approach is the recommended way in Java (Effective Java by Joshua Bloch).</li>
<li>It provides serialization safety (JVM handles it) and reflection safety (cannot create enum instances via reflection).</li>
<li>The only drawback is that it does not support lazy initialization (enum instances are created when the enum class is loaded).</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-f-takeaways">Module F: Takeaways</h2>
<ul>
<li><strong>Singleton</strong> ensures a class has only one instance and provides a global access point to it.</li>
<li>It solves <strong>two problems</strong>: controlling the number of instances and providing global access.</li>
<li>The pattern requires a <strong>private constructor</strong> and a <strong>static getInstance() method</strong>.</li>
<li><strong>Thread safety</strong> is a critical concern; naive implementations can break under concurrent access.</li>
<li>Java offers multiple Singleton implementations: naive, synchronized, double-checked locking, inner class (Bill Pugh), and <strong>enum</strong> (recommended).</li>
<li>Singleton is <strong>controversial</strong>: it violates SRP, can mask bad design, and makes testing difficult.</li>
<li>Abstract Factories, Builders, and Prototypes can all be implemented as <strong>Singletons</strong>.</li>
<li>The <strong>Enum-based Singleton</strong> is the gold standard in Java: thread-safe, serialization-safe, and reflection-safe.</li>
</ul>
