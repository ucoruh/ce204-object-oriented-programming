<h2 id="e2-anti-pattern-god-object">E2. Anti-Pattern: God Object</h2>
<p><strong>What:</strong> A single class that knows too much and does too much.</p>
<p><strong>Symptoms:</strong> Hundreds or thousands of lines, imports from everywhere, hard to test.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// BAD: God Object</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ApplicationManager</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">handleUserLogin</span><span class="hljs-params">(String u, String p)</span> { <span class="hljs-comment">/* ... */</span> }
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">processOrder</span><span class="hljs-params">(Order o)</span> { <span class="hljs-comment">/* ... */</span> }
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">generateReport</span><span class="hljs-params">(String type)</span> { <span class="hljs-comment">/* ... */</span> }
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">sendEmail</span><span class="hljs-params">(String to, String body)</span> { <span class="hljs-comment">/* ... */</span> }
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">updateInventory</span><span class="hljs-params">(Item item)</span> { <span class="hljs-comment">/* ... */</span> }
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">calculateTaxes</span><span class="hljs-params">(Order o)</span> { <span class="hljs-comment">/* ... */</span> }
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">backupDatabase</span><span class="hljs-params">()</span> { <span class="hljs-comment">/* ... */</span> }
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">processPayroll</span><span class="hljs-params">()</span> { <span class="hljs-comment">/* ... */</span> }
    <span class="hljs-comment">// 50 more methods covering every aspect of the app...</span>
}

<span class="hljs-comment">// GOOD: Separate responsibilities into focused classes</span>

}

}

}

<h2 id="e3-anti-pattern-singleton-abuse">E3. Anti-Pattern: Singleton Abuse</h2>
<p><strong>What:</strong> Using Singleton for everything because &quot;we only need one instance.&quot;</p>
<p><strong>Problems:</strong> Hidden dependencies, hard to test, global mutable state.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// BAD: Singleton used as a global variable</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">DatabaseConnection</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">static</span> DatabaseConnection instance;
    <span class="hljs-keyword">private</span> Connection connection;

    <span class="hljs-keyword">private</span> <span class="hljs-title function_">DatabaseConnection</span><span class="hljs-params">()</span> {
        <span class="hljs-comment">// connect to database</span>
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> DatabaseConnection <span class="hljs-title function_">getInstance</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">if</span> (instance == <span class="hljs-literal">null</span>) {
            instance = <span class="hljs-keyword">new</span> <span class="hljs-title class_">DatabaseConnection</span>();
        }
        <span class="hljs-keyword">return</span> instance;
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">query</span><span class="hljs-params">(String sql)</span> { <span class="hljs-comment">/* ... */</span> }
}

<span class="hljs-comment">// Every class depends on the singleton</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">OrderService</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">createOrder</span><span class="hljs-params">(Order order)</span> {
        <span class="hljs-comment">// Hidden dependency -- hard to test!</span>
        DatabaseConnection.getInstance()
            .query(<span class="hljs-string">&quot;INSERT INTO orders ...&quot;</span>);
    }
}

<span class="hljs-comment">// GOOD: Use dependency injection instead</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">OrderService</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> DatabaseConnection db;

    <span class="hljs-keyword">public</span> <span class="hljs-title function_">OrderService</span><span class="hljs-params">(DatabaseConnection db)</span> {
        <span class="hljs-built_in">this</span>.db = db; <span class="hljs-comment">// Explicit dependency, testable</span>
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">createOrder</span><span class="hljs-params">(Order order)</span> {
        db.query(<span class="hljs-string">&quot;INSERT INTO orders ...&quot;</span>);
    }
}
</code></pre>

<h2 id="e4-anti-pattern-pattern-obsession">E4. Anti-Pattern: Pattern Obsession</h2>
<p><strong>What:</strong> Applying design patterns everywhere, even when simpler solutions exist.</p>
<p><strong>Result:</strong> Code that is hard to follow because every simple operation is wrapped in layers of abstraction.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// OVER-PATTERNED: Simple string formatting</span>
<span class="hljs-comment">// using Strategy + Factory + Builder patterns</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">FormatterStrategy</span> {
    String <span class="hljs-title function_">format</span><span class="hljs-params">(String input)</span>;
}
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">UpperCaseFormatter</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">FormatterStrategy</span> {
    <span class="hljs-keyword">public</span> String <span class="hljs-title function_">format</span><span class="hljs-params">(String input)</span> {
        <span class="hljs-keyword">return</span> input.toUpperCase();
    }
}
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">FormatterFactory</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> FormatterStrategy <span class="hljs-title function_">create</span><span class="hljs-params">(String type)</span> {
        <span class="hljs-keyword">if</span> (<span class="hljs-string">&quot;upper&quot;</span>.equals(type))
            <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">UpperCaseFormatter</span>();
        <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">IllegalArgumentException</span>(type);
    }
}
<span class="hljs-comment">// Usage: 4 classes for something trivial</span>
<span class="hljs-type">String</span> <span class="hljs-variable">result</span> <span class="hljs-operator">=</span> FormatterFactory.create(<span class="hljs-string">&quot;upper&quot;</span>)
    .format(<span class="hljs-string">&quot;hello&quot;</span>);

<span class="hljs-comment">// SIMPLE: Just use the built-in method</span>
<span class="hljs-type">String</span> <span class="hljs-variable">result</span> <span class="hljs-operator">=</span> <span class="hljs-string">&quot;hello&quot;</span>.toUpperCase();
</code></pre>
<p><strong>Rule of thumb:</strong> If you can explain the solution in one sentence, you probably do not need a pattern.</p>

<h2 id="e5-balancing-simplicity-vs-extensibility">E5. Balancing Simplicity vs. Extensibility</h2>
<h3 id="the-complexity-spectrum">The Complexity Spectrum</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Simple Code  &lt;-------|-------&gt;  Extensible Code
(Easy now)          (Sweet Spot)        (Easy later)
</code></pre>
<p><strong>Guidelines for finding the sweet spot:</strong></p>
<table>
<thead>
<tr>
<th>Question</th>
<th>If YES</th>
<th>If NO</th>
</tr>
</thead>
<tbody>
<tr>
<td>Will this code change frequently?</td>
<td>Add abstraction</td>
<td>Keep it simple</td>
</tr>
<tr>
<td>Are there 3+ variations?</td>
<td>Use a pattern</td>
<td>Use if-else</td>
</tr>
<tr>
<td>Is the team familiar with the pattern?</td>
<td>Use it</td>
<td>Document or simplify</td>
</tr>
<tr>
<td>Does the pattern reduce duplication?</td>
<td>Use it</td>
<td>Skip it</td>
</tr>
<tr>
<td>Is this a core business feature?</td>
<td>Invest in design</td>
<td>Keep it pragmatic</td>
</tr>
</tbody>
</table>

<h2 id="e6-solid-principles-revisited">E6. SOLID Principles Revisited</h2>
<h3 id="how-solid-guides-pattern-usage">How SOLID Guides Pattern Usage</h3>
<table>
<thead>
<tr>
<th>Principle</th>
<th>Description</th>
<th>Pattern Connection</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>S</strong> - Single Responsibility</td>
<td>A class should have one reason to change</td>
<td>Prevents God Objects</td>
</tr>
<tr>
<td><strong>O</strong> - Open/Closed</td>
<td>Open for extension, closed for modification</td>
<td>Strategy, Observer, Decorator</td>
</tr>
<tr>
<td><strong>L</strong> - Liskov Substitution</td>
<td>Subtypes must be substitutable for base types</td>
<td>Template Method, State</td>
</tr>
<tr>
<td><strong>I</strong> - Interface Segregation</td>
<td>Prefer small, focused interfaces</td>
<td>Adapter, specific interfaces</td>
</tr>
<tr>
<td><strong>D</strong> - Dependency Inversion</td>
<td>Depend on abstractions, not concretions</td>
<td>Factory, Dependency Injection</td>
</tr>

<h2 id="e7-practical-guidelines">E7. Practical Guidelines</h2>
<h3 id="decision-framework-for-applying-patterns">Decision Framework for Applying Patterns</h3>
<ol>
<li><strong>Start simple</strong> -- Write the simplest code that works.</li>
<li><strong>Wait for the smell</strong> -- Let code smells tell you when to refactor.</li>
<li><strong>Refactor to patterns</strong> -- Apply patterns to solve specific problems, not preemptively.</li>
<li><strong>Measure the improvement</strong> -- Lines of code, testability, coupling.</li>
<li><strong>Document your decisions</strong> -- Future developers need to understand <em>why</em> a pattern was chosen.</li>
</ol>
<h3 id="the-three-strikes-rule">The Three Strikes Rule</h3>
<blockquote>
<p><em>The first time you do something, just do it. The second time you do something similar, wince but do it anyway. The third time, refactor.</em><br />
-- Martin Fowler</p>
</blockquote>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-14</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-e----takeaway">Module E -- Takeaway</h2>
<h3 id="best-practices-summary">Best Practices Summary</h3>
<ol>
<li><strong>Patterns are tools, not goals</strong> -- Use them to solve problems, not to impress.</li>
<li><strong>Avoid anti-patterns</strong> -- God Object, Singleton abuse, and Pattern obsession create more problems than they solve.</li>
<li><strong>Balance is key</strong> -- Too little design leads to spaghetti code; too much leads to lasagna code (too many layers).</li>
<li><strong>SOLID principles guide decisions</strong> -- They help you know when a pattern is appropriate.</li>
<li><strong>Refactor incrementally</strong> -- Small, safe steps are better than big rewrites.</li>
<li><strong>Code is for humans</strong> -- Readability and maintainability trump cleverness every time.</li>
</ol>
