<h2 id="e4-anti-desen-desen-tak%C4%B1nt%C4%B1s%C4%B1-pattern-obsession">E4. Anti-Desen: Desen Takıntısı (Pattern Obsession)</h2>
<p><strong>Nedir:</strong> Daha basit çözümler varken bile her yerde tasarım deseni uygulamak.</p>
<p><strong>Sonuç:</strong> Her basit işlem soyutlama katmanlarına sarıldığı için takip etmesi zor kod.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// AŞIRI DESENLENMİŞ: Basit string biçimlendirme</span>
<span class="hljs-comment">// Strategy + Factory + Builder desenleri kullanarak</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">FormatterStrategy</span> {
    String <span class="hljs-title function_">format</span><span class="hljs-params">(String input)</span>;
}
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">UpperCaseFormatter</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">FormatterStrategy</span> {
    <span class="hljs-keyword">public</span> String <span class="hljs-title function_">format</span><span class="hljs-params">(String input)</span> {
        <span class="hljs-keyword">return</span> input.toUpperCase();
    }
}
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">FormatterFactory</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> FormatterStrategy <span class="hljs-title function_">create</span><span class="hljs-params">(String type)</span> {
        <span class="hljs-keyword">if</span> (<span class="hljs-string">&quot;upper&quot;</span>.equals(type))
            <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">UpperCaseFormatter</span>();
        <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">IllegalArgumentException</span>(type);
    }
}
<span class="hljs-comment">// Kullanım: Önemsiz bir şey için 4 sınıf</span>
<span class="hljs-type">String</span> <span class="hljs-variable">result</span> <span class="hljs-operator">=</span> FormatterFactory.create(<span class="hljs-string">&quot;upper&quot;</span>)
    .format(<span class="hljs-string">&quot;hello&quot;</span>);

<span class="hljs-comment">// BASİT: Yerleşik metodu kullanın</span>
<span class="hljs-type">String</span> <span class="hljs-variable">result</span> <span class="hljs-operator">=</span> <span class="hljs-string">&quot;hello&quot;</span>.toUpperCase();
</code></pre>
<p><strong>Temel kural:</strong> Çözümü tek bir cümleyle açıklayabiliyorsanız, muhtemelen bir desene ihtiyacınız yoktur.</p>

<h2 id="e6-solid-i%CC%87lkeleri-yeniden-i%CC%87nceleme">E6. SOLID İlkeleri Yeniden İnceleme</h2>
<h3 id="solid-desen-kullan%C4%B1m%C4%B1na-nas%C4%B1l-rehberlik-eder">SOLID Desen Kullanımına Nasıl Rehberlik Eder</h3>
<table>
<thead>
<tr>
<th>İlke</th>
<th>Açıklama</th>
<th>Desen Bağlantısı</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>S</strong> - Single Responsibility (Tek Sorumluluk)</td>
<td>Bir sınıfın değişmek için tek bir nedeni olmalı</td>
<td>God Object'i önler</td>
</tr>
<tr>
<td><strong>O</strong> - Open/Closed (Açık/Kapalı)</td>
<td>Genişletmeye açık, değiştirmeye kapalı</td>
<td>Strategy, Observer, Decorator</td>
</tr>
<tr>
<td><strong>L</strong> - Liskov Substitution (Liskov Yerine Geçme)</td>
<td>Alt tipler temel tipler yerine kullanılabilir olmalı</td>
<td>Template Method, State</td>
</tr>
<tr>
<td><strong>I</strong> - Interface Segregation (Arayüz Ayrımı)</td>
<td>Küçük, odaklanmış arayüzleri tercih et</td>
<td>Adapter, spesifik arayüzler</td>
</tr>
<tr>
<td><strong>D</strong> - Dependency Inversion (Bağımlılık Tersine Çevirme)</td>
<td>Soyutlamalara bağımlı ol, somutlamalara değil</td>
<td>Factory, Dependency Injection</td>
</tr>
</tbody>
</table>

<h2 id="e6-vaka-%C3%A7al%C4%B1%C5%9Fmalar%C4%B1m%C4%B1zda-solid">E6. Vaka Çalışmalarımızda SOLID</h2>
<h3 id="tek-sorumluluk-single-responsibility">Tek Sorumluluk (Single Responsibility)</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Vaka Çalışması 1: Her desen bir endişeyi ele alır</span>
PaymentStrategy    -&gt; Yalnızca ödeme işleme
OrderState         -&gt; Yalnızca durum geçişleri
OrderObserver      -&gt; Yalnızca bildirimler
ShippingMethod     -&gt; Yalnızca kargo lojistiği
</code></pre>
<h3 id="a%C3%A7%C4%B1kkapal%C4%B1-i%CC%87lkesi-openclosed-principle">Açık/Kapalı İlkesi (Open/Closed Principle)</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Vaka Çalışması 3: Yeni bildirim kanalı ekleme</span>
<span class="hljs-comment">// mevcut kodu DEĞİŞTİRMEZ</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">TeamsChannel</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">NotificationChannel</span> {
    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">protected</span> String <span class="hljs-title function_">applyUrgencyFormatting</span><span class="hljs-params">(
            NotificationRequest request, String message)</span> {
        <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;!! &quot;</span> + message + <span class="hljs-string">&quot; !!&quot;</span>;
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">protected</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">deliverMessage</span><span class="hljs-params">(
            NotificationRequest request, String message)</span> {
        System.out.println(<span class="hljs-string">&quot;[TEAMS] To: &quot;</span>
            + request.getRecipient());
        System.out.println(<span class="hljs-string">&quot;Message: &quot;</span> + message);
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">protected</span> String <span class="hljs-title function_">getChannelName</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;Teams&quot;</span>; }

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="e7-pratik-y%C3%B6nergeler">E7. Pratik Yönergeler</h2>
<h3 id="desen-uygulama-karar-%C3%A7er%C3%A7evesi">Desen Uygulama Karar Çerçevesi</h3>
<ol>
<li><strong>Basit başla</strong> -- Çalışan en basit kodu yaz.</li>
<li><strong>Kokuyu bekle</strong> -- Kod kokularının ne zaman yeniden yapılandırma yapılacağını söylemesine izin ver.</li>
<li><strong>Desenlere doğru yeniden yapılandır</strong> -- Desenleri önceden değil, belirli sorunları çözmek için uygula.</li>
<li><strong>İyileştirmeyi ölç</strong> -- Kod satır sayısı, test edilebilirlik, bağımlılık.</li>
<li><strong>Kararlarını belgele</strong> -- Gelecekteki geliştiricilerin bir desenin <em>neden</em> seçildiğini anlaması gerekir.</li>
</ol>
<h3 id="%C3%BC%C3%A7-vuru%C5%9F-kural%C4%B1-three-strikes-rule">Üç Vuruş Kuralı (Three Strikes Rule)</h3>
<blockquote>
<p><em>Bir şeyi ilk yaptığında, sadece yap. İkinci kez benzer bir şey yaptığında, yüzünü buruştur ama yine de yap. Üçüncü kez, yeniden yapılandır.</em><br />
-- Martin Fowler</p>
</blockquote>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-14</footer>
</section>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="mod%C3%BCl-e----%C3%B6zet">Modül E -- Özet</h2>
<h3 id="en-i%CC%87yi-uygulamalar-%C3%B6zeti">En İyi Uygulamalar Özeti</h3>
<ol>
<li><strong>Desenler araçtır, amaç değildir</strong> -- Onları sorunları çözmek için kullanın, etkilemek için değil.</li>
<li><strong>Anti-desenlerden kaçının</strong> -- God Object, Singleton kötüye kullanımı ve Desen takıntısı çözdüklerinden daha fazla sorun yaratır.</li>
<li><strong>Denge anahtardır</strong> -- Çok az tasarım spagetti koda yol açar; çok fazlası lazanya koda (çok fazla katman) yol açar.</li>
<li><strong>SOLID ilkeleri kararları yönlendirir</strong> -- Bir desenin ne zaman uygun olduğunu bilmenize yardımcı olur.</li>
<li><strong>Artımlı olarak yeniden yapılandırın</strong> -- Küçük, güvenli adımlar büyük yeniden yazmalardan daha iyidir.</li>
<li><strong>Kod insanlar içindir</strong> -- Okunabilirlik ve bakım kolaylığı her zaman zekilikten üstündür.</li>
</ol>
