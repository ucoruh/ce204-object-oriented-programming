<ul>
<li>Tasarım desenleri ve yeniden yapılandırma (refactoring) teknikleri güçlü araçlardır, ancak gerçek değerleri <strong>gerçek dünya uygulamalarında</strong> görülür.</li>
<li>Vaka çalışmaları bize şunları anlamamıza yardımcı olur:
<ul>
<li>Bir deseni <strong>ne zaman</strong> uygulamalı</li>
<li>Desenlerin bir sistemde <strong>nasıl</strong> birlikte çalıştığı</li>
<li>Kod kalitesine <strong>ne gibi</strong> iyileştirmeler getirdikleri</li>
<li>Yeniden yapılandırmanın (refactoring) en büyük etkiyi <strong>nerede</strong> yarattığı</li>
</ul>
</li>
</ul>

<h2 id="a1-singleton-tekil----runtimegetruntime">A1. Singleton (Tekil) -- <code>Runtime.getRuntime()</code></h2>
<p><strong>Desen:</strong> Singleton, bir sınıfın yalnızca bir örneğe (instance) sahip olmasını ve genel bir erişim noktası sağlamasını garanti eder.</p>
<p><strong>Nerede görülür:</strong> <code>java.lang.Runtime</code> -- her Java uygulamasında tam olarak bir <code>Runtime</code> nesnesi bulunur.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">SingletonExample</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
        <span class="hljs-comment">// Runtime, Singleton desenini kullanır</span>
        <span class="hljs-type">Runtime</span> <span class="hljs-variable">runtime1</span> <span class="hljs-operator">=</span> Runtime.getRuntime();
        <span class="hljs-type">Runtime</span> <span class="hljs-variable">runtime2</span> <span class="hljs-operator">=</span> Runtime.getRuntime();

        <span class="hljs-comment">// Her iki referans aynı nesneyi gösterir</span>
        System.out.println(runtime1 == runtime2); <span class="hljs-comment">// true</span>

        <span class="hljs-comment">// Singleton&#x27;ı kullanarak sistem bilgisi al</span>
        System.out.println(<span class="hljs-string">&quot;Available processors: &quot;</span>
            + runtime1.availableProcessors());
        System.out.println(<span class="hljs-string">&quot;Free memory: &quot;</span>
            + runtime1.freeMemory() + <span class="hljs-string">&quot; bytes&quot;</span>);
    }
}
</code></pre>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-14</footer>
</section>

<h2 id="a1-singleton-tekil----runtime-dahili-olarak-nas%C4%B1l-%C3%A7al%C4%B1%C5%9F%C4%B1r">A1. Singleton (Tekil) -- <code>Runtime</code> Dahili Olarak Nasıl Çalışır</h2>
<p>JDK, <code>Runtime</code> sınıfını klasik bir Singleton olarak uygular:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Runtime</span> {
    <span class="hljs-comment">// İstekli başlatma -- örnek sınıf yüklenirken oluşturulur</span>
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">final</span> <span class="hljs-type">Runtime</span> <span class="hljs-variable">currentRuntime</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Runtime</span>();

    <span class="hljs-comment">// Özel yapıcı dışarıdan örneklemeyi engeller</span>
    <span class="hljs-keyword">private</span> <span class="hljs-title function_">Runtime</span><span class="hljs-params">()</span> {}

    <span class="hljs-comment">// Genel erişim noktası</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> Runtime <span class="hljs-title function_">getRuntime</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> currentRuntime;
    }

    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">availableProcessors</span><span class="hljs-params">()</span> {
        <span class="hljs-comment">// yerel uygulama (native implementation)</span>
    }

    <span class="hljs-keyword">public</span> <span class="hljs-type">long</span> <span class="hljs-title function_">freeMemory</span><span class="hljs-params">()</span> {
        <span class="hljs-comment">// yerel uygulama (native implementation)</span>
    }
}
</code></pre>
<p><strong>Temel çıkarım:</strong> JVM, yalnızca bir <code>Runtime</code> örneğinin var olmasını garanti eder; bu mantıklıdır çünkü uygulama başına yalnızca bir çalışma zamanı ortamı vardır.</p>

<header>CEN206 Nesne Yönelimli Programlama</header>
<h2 id="a2-iterator-yineleyici----javautiliterator">A2. Iterator (Yineleyici) -- <code>java.util.Iterator</code></h2>
<p><strong>Desen:</strong> Iterator, temel gösterimini açığa çıkarmadan bir koleksiyonun öğelerine sırayla erişmenin bir yolunu sağlar.</p>
<p><strong>Nerede görülür:</strong> Her Java Collection <code>Iterable</code> arayüzünü uygular ve bir <code>Iterator</code> döndürür.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.util.*;

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">IteratorExample</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
        List&lt;String&gt; languages = <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;&gt;(
            Arrays.asList(<span class="hljs-string">&quot;Java&quot;</span>, <span class="hljs-string">&quot;Python&quot;</span>, <span class="hljs-string">&quot;C++&quot;</span>, <span class="hljs-string">&quot;Rust&quot;</span>)
        );

        <span class="hljs-comment">// Iterator desenini açıkça kullanma</span>
        Iterator&lt;String&gt; iterator = languages.iterator();
        <span class="hljs-keyword">while</span> (iterator.hasNext()) {
            <span class="hljs-type">String</span> <span class="hljs-variable">lang</span> <span class="hljs-operator">=</span> iterator.next();
            System.out.println(lang);
            <span class="hljs-keyword">if</span> (lang.equals(<span class="hljs-string">&quot;C++&quot;</span>)) {
                iterator.remove(); <span class="hljs-comment">// yineleme sırasında güvenli silme</span>
            }
        }

        <span class="hljs-comment">// Geliştirilmiş for döngüsü arka planda Iterator kullanır</span>
        <span class="hljs-keyword">for</span> (String lang : languages) {
            System.out.println(<span class="hljs-string">&quot;Remaining: &quot;</span> + lang);
        }
    }
}
</code></pre>

<h2 id="a3-observer-g%C3%B6zlemci----eventlistener">A3. Observer (Gözlemci) -- <code>EventListener</code></h2>
<p><strong>Desen:</strong> Observer, bire-çok bağımlılık tanımlar; böylece bir nesne durumunu değiştirdiğinde tüm bağımlıları bildirilir.</p>
<p><strong>Nerede görülür:</strong> Java'nın olay işleme sistemi (AWT/Swing), <code>java.util.EventListener</code>, <code>PropertyChangeListener</code>.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.beans.PropertyChangeListener;
<span class="hljs-keyword">import</span> java.beans.PropertyChangeSupport;

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Stock</span> {
    <span class="hljs-keyword">private</span> String symbol;
    <span class="hljs-keyword">private</span> <span class="hljs-type">double</span> price;
    <span class="hljs-keyword">private</span> PropertyChangeSupport support;

    <span class="hljs-keyword">public</span> <span class="hljs-title function_">Stock</span><span class="hljs-params">(String symbol, <span class="hljs-type">double</span> price)</span> {
        <span class="hljs-built_in">this</span>.symbol = symbol;
        <span class="hljs-built_in">this</span>.price = price;
        <span class="hljs-built_in">this</span>.support = <span class="hljs-keyword">new</span> <span class="hljs-title class_">PropertyChangeSupport</span>(<span class="hljs-built_in">this</span>);
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">addObserver</span><span class="hljs-params">(PropertyChangeListener listener)</span> {
        support.addPropertyChangeListener(listener);
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">setPrice</span><span class="hljs-params">(<span class="hljs-type">double</span> newPrice)</span> {
        <span class="hljs-type">double</span> <span class="hljs-variable">oldPrice</span> <span class="hljs-operator">=</span> <span class="hljs-built_in">this</span>.price;
        <span class="hljs-built_in">this</span>.price = newPrice;
        <span class="hljs-comment">// Tüm gözlemcileri bilgilendir</span>
        support.firePropertyChange(<span class="hljs-string">&quot;price&quot;</span>, oldPrice, newPrice);
    }

    <span class="hljs-keyword">public</span> <span class="hljs-type">double</span> <span class="hljs-title function_">getPrice</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> price; }
    <span class="hljs-keyword">public</span> String <span class="hljs-title function_">getSymbol</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> symbol; }
}
</code></pre>

<h2 id="a3-observer-g%C3%B6zlemci----hisse-senedi-%C3%B6rne%C4%9Fini-kullanma">A3. Observer (Gözlemci) -- Hisse Senedi Örneğini Kullanma</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.beans.PropertyChangeEvent;
<span class="hljs-keyword">import</span> java.beans.PropertyChangeListener;

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">StockTrader</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">PropertyChangeListener</span> {
    <span class="hljs-keyword">private</span> String traderName;

    <span class="hljs-keyword">public</span> <span class="hljs-title function_">StockTrader</span><span class="hljs-params">(String name)</span> {
        <span class="hljs-built_in">this</span>.traderName = name;
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">propertyChange</span><span class="hljs-params">(PropertyChangeEvent evt)</span> {
        System.out.println(traderName + <span class="hljs-string">&quot; notified: &quot;</span>
            + <span class="hljs-string">&quot;Price changed from &quot;</span> + evt.getOldValue()
            + <span class="hljs-string">&quot; to &quot;</span> + evt.getNewValue());
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
        <span class="hljs-type">Stock</span> <span class="hljs-variable">apple</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Stock</span>(<span class="hljs-string">&quot;AAPL&quot;</span>, <span class="hljs-number">150.0</span>);

        <span class="hljs-type">StockTrader</span> <span class="hljs-variable">trader1</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">StockTrader</span>(<span class="hljs-string">&quot;Alice&quot;</span>);

<h2 id="a4-factory-method-fabrika-y%C3%B6ntemi----calendargetinstance">A4. Factory Method (Fabrika Yöntemi) -- <code>Calendar.getInstance()</code></h2>
<p><strong>Desen:</strong> Factory Method, bir nesne oluşturmak için bir arayüz tanımlar ancak hangi sınıfın örnekleneceğine alt sınıfların karar vermesine izin verir.</p>
<p><strong>Nerede görülür:</strong> <code>java.util.Calendar.getInstance()</code> yerel ayara özgü bir takvim uygulaması döndürür.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.util.Calendar;
<span class="hljs-keyword">import</span> java.util.Locale;

        <span class="hljs-comment">// Factory Method -- çoğu yerel ayar için</span>
        <span class="hljs-comment">// GregorianCalendar döndürür</span>
        <span class="hljs-type">Calendar</span> <span class="hljs-variable">cal1</span> <span class="hljs-operator">=</span> Calendar.getInstance();
        System.out.println(<span class="hljs-string">&quot;Default: &quot;</span>
            + cal1.getClass().getName());

        <span class="hljs-comment">// Japonca yerel ayar ile Factory Method</span>
        <span class="hljs-comment">// JapaneseImperialCalendar döndürür</span>
        <span class="hljs-type">Calendar</span> <span class="hljs-variable">cal2</span> <span class="hljs-operator">=</span> Calendar.getInstance(
            <span class="hljs-keyword">new</span> <span class="hljs-title class_">Locale</span>(<span class="hljs-string">&quot;ja&quot;</span>, <span class="hljs-string">&quot;JP&quot;</span>, <span class="hljs-string">&quot;JP&quot;</span>));
        System.out.println(<span class="hljs-string">&quot;Japanese: &quot;</span>
            + cal2.getClass().getName());

        <span class="hljs-comment">// İstemci kodu herhangi bir Calendar ile çalışır</span>
        System.out.println(<span class="hljs-string">&quot;Year: &quot;</span>
            + cal1.get(Calendar.YEAR));

<h2 id="a5-decorator-dekorat%C3%B6r----javaio-ak%C4%B1%C5%9Flar%C4%B1">A5. Decorator (Dekoratör) -- <code>java.io</code> Akışları</h2>
<p><strong>Desen:</strong> Decorator, bir nesneye dinamik olarak ek sorumluluklar ekler ve alt sınıflamaya esnek bir alternatif sağlar.</p>
<p><strong>Nerede görülür:</strong> Tüm <code>java.io</code> akış hiyerarşisi Decorator desenini kullanır.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.io.*;

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">DecoratorExample</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> <span class="hljs-keyword">throws</span> Exception {
        <span class="hljs-comment">// Temel bileşen: FileReader</span>
        <span class="hljs-comment">// Dekoratör 1: BufferedReader tamponlama ekler</span>
        <span class="hljs-comment">// Her dekoratör önceki bileşeni sarar</span>
        <span class="hljs-keyword">try</span> (<span class="hljs-type">BufferedReader</span> <span class="hljs-variable">reader</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">BufferedReader</span>(
                <span class="hljs-keyword">new</span> <span class="hljs-title class_">FileReader</span>(<span class="hljs-string">&quot;example.txt&quot;</span>))) {
            String line;
            <span class="hljs-keyword">while</span> ((line = reader.readLine()) != <span class="hljs-literal">null</span>) {
                System.out.println(line);
            }
        }

        <span class="hljs-comment">// Başka bir örnek: OutputStream dekoratörleri</span>
        <span class="hljs-comment">// FileOutputStream -&gt; BufferedOutputStream -&gt; DataOutputStream</span>
        <span class="hljs-keyword">try</span> (<span class="hljs-type">DataOutputStream</span> <span class="hljs-variable">out</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">DataOutputStream</span>(
                <span class="hljs-keyword">new</span> <span class="hljs-title class_">BufferedOutputStream</span>(
                    <span class="hljs-keyword">new</span> <span class="hljs-title class_">FileOutputStream</span>(<span class="hljs-string">&quot;data.bin&quot;</span>)))) {
            out.writeInt(<span class="hljs-number">42</span>);
            out.writeDouble(<span class="hljs-number">3.14</span>);
            out.writeUTF(<span class="hljs-string">&quot;Hello, Decorator!&quot;</span>);
        }

        <span class="hljs-comment">// Karşılık gelen dekoratörlerle geri okuma</span>
        <span class="hljs-keyword">try</span> (<span class="hljs-type">DataInputStream</span> <span class="hljs-variable">in</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">DataInputStream</span>(
                <span class="hljs-keyword">new</span> <span class="hljs-title class_">BufferedInputStream</span>(
                    <span class="hljs-keyword">new</span> <span class="hljs-title class_">FileInputStream</span>(<span class="hljs-string">&quot;data.bin&quot;</span>)))) {
            System.out.println(<span class="hljs-string">&quot;Int: &quot;</span> + in.readInt());
            System.out.println(<span class="hljs-string">&quot;Double: &quot;</span> + in.readDouble());
            System.out.println(<span class="hljs-string">&quot;String: &quot;</span> + in.readUTF());
        }
    }
}
</code></pre>

<h2 id="a6-strategy-strateji----javautilcomparator">A6. Strategy (Strateji) -- <code>java.util.Comparator</code></h2>
<p><strong>Desen:</strong> Strategy, bir algoritma ailesi tanımlar, her birini kapsüller ve bunları birbirinin yerine kullanılabilir hale getirir.</p>
<p><strong>Nerede görülür:</strong> <code>java.util.Comparator</code> çalışma zamanında sıralama algoritmasını değiştirmeye olanak tanır.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.util.*;

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">StrategyExample</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
        List&lt;String&gt; names = <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;&gt;(
            Arrays.asList(<span class="hljs-string">&quot;Charlie&quot;</span>, <span class="hljs-string">&quot;Alice&quot;</span>, <span class="hljs-string">&quot;Bob&quot;</span>, <span class="hljs-string">&quot;Diana&quot;</span>)
        );

        <span class="hljs-comment">// Strateji 1: Doğal sıralama (alfabetik)</span>
        names.sort(Comparator.naturalOrder());
        System.out.println(<span class="hljs-string">&quot;Alphabetical: &quot;</span> + names);

        <span class="hljs-comment">// Strateji 2: Ters sıralama</span>
        names.sort(Comparator.reverseOrder());
        System.out.println(<span class="hljs-string">&quot;Reversed: &quot;</span> + names);

        <span class="hljs-comment">// Strateji 3: Dize uzunluğuna göre</span>
        names.sort(Comparator.comparingInt(String::length));
        System.out.println(<span class="hljs-string">&quot;By length: &quot;</span> + names);

        <span class="hljs-comment">// Strateji 4: Lambda ile özel karşılaştırıcı</span>
        names.sort((a, b) -&gt; {
            <span class="hljs-type">int</span> <span class="hljs-variable">lastCharA</span> <span class="hljs-operator">=</span> a.charAt(a.length() - <span class="hljs-number">1</span>);
            <span class="hljs-type">int</span> <span class="hljs-variable">lastCharB</span> <span class="hljs-operator">=</span> b.charAt(b.length() - <span class="hljs-number">1</span>);
            <span class="hljs-keyword">return</span> lastCharA - lastCharB;
        });
        System.out.println(<span class="hljs-string">&quot;By last char: &quot;</span> + names);
    }
}
</code></pre>

    <span class="hljs-keyword">private</span> <span class="hljs-type">int</span> remaining;

        <span class="hljs-built_in">this</span>.remaining = size;
    }

    <span class="hljs-comment">// Alt sınıflar bu tek soyut yöntemi UYGULAMALIDIR</span>

<h2 id="a8-adapter-uyarlay%C4%B1c%C4%B1----arraysaslist">A8. Adapter (Uyarlayıcı) -- <code>Arrays.asList()</code></h2>
<p><strong>Desen:</strong> Adapter, bir sınıfın arayüzünü istemcilerin beklediği başka bir arayüze dönüştürür.</p>
<p><strong>Nerede görülür:</strong> <code>Arrays.asList()</code> bir diziyi <code>List</code> arayüzüne uyarlar.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.util.*;

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">AdapterExample</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
        String[] array = {<span class="hljs-string">&quot;Java&quot;</span>, <span class="hljs-string">&quot;Python&quot;</span>, <span class="hljs-string">&quot;C++&quot;</span>};

        <span class="hljs-comment">// Arrays.asList() diziyi List arayüzüne uyarlar</span>
        List&lt;String&gt; list = Arrays.asList(array);

        <span class="hljs-comment">// Artık dizi üzerinde List işlemlerini kullanabiliriz</span>
        System.out.println(<span class="hljs-string">&quot;Element at 1: &quot;</span> + list.get(<span class="hljs-number">1</span>));
        System.out.println(<span class="hljs-string">&quot;Contains Java: &quot;</span>
            + list.contains(<span class="hljs-string">&quot;Java&quot;</span>));
        System.out.println(<span class="hljs-string">&quot;Index of C++: &quot;</span>
            + list.indexOf(<span class="hljs-string">&quot;C++&quot;</span>));

        <span class="hljs-comment">// Listedeki değişiklikler orijinal diziyi etkiler</span>
        list.set(<span class="hljs-number">0</span>, <span class="hljs-string">&quot;Kotlin&quot;</span>);
        System.out.println(<span class="hljs-string">&quot;Array[0]: &quot;</span> + array[<span class="hljs-number">0</span>]); <span class="hljs-comment">// Kotlin</span>

        <span class="hljs-comment">// Not: Yapısal değişiklikler istisna fırlatır</span>

        <span class="hljs-comment">// list.remove(0);   // UnsupportedOperationException</span>
    }

<p>Bir çevrimiçi mağaza için sipariş işleme sistemi oluşturuyorsunuz. Sistem şunları yapmalıdır:</p>
<ul>
<li><strong>Birden fazla ödeme yöntemi kabul etme</strong> -- Kredi Kartı, PayPal, Banka Havalesi, Kripto Para</li>
<li><strong>Sipariş durumunu takip etme</strong> -- Yeni, Ödendi, Kargoya Verildi, Teslim Edildi, İptal Edildi</li>
<li><strong>Bildirim gönderme</strong> -- Sipariş durumu değiştiğinde E-posta, SMS, Anlık bildirim</li>
<li><strong>Farklı kargo yöntemlerini destekleme</strong> -- Standart, Ekspres, Ertesi Gün, Uluslararası</li>
</ul>
<p>Sistem <strong>genişletilebilir</strong> olmalıdır -- yeni ödeme yöntemleri, kargo seçenekleri ve bildirim kanalları eklemek kolay olmalıdır.</p>

<h2 id="b6-factory-method-fabrika-y%C3%B6ntemi----kargo-fabrikas%C4%B1">B6. Factory Method (Fabrika Yöntemi) -- Kargo Fabrikası</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Fabrika</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ShippingFactory</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> ShippingMethod <span class="hljs-title function_">createShipping</span><span class="hljs-params">(String type)</span> {
        <span class="hljs-keyword">switch</span> (type.toLowerCase()) {
            <span class="hljs-keyword">case</span> <span class="hljs-string">&quot;standard&quot;</span>:
                <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">StandardShipping</span>();
            <span class="hljs-keyword">case</span> <span class="hljs-string">&quot;express&quot;</span>:
                <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">ExpressShipping</span>();
            <span class="hljs-keyword">case</span> <span class="hljs-string">&quot;overnight&quot;</span>:
                <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">OvernightShipping</span>();
            <span class="hljs-keyword">default</span>:
                <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">IllegalArgumentException</span>(
                    <span class="hljs-string">&quot;Unknown shipping type: &quot;</span> + type);
        }
    }
}

<span class="hljs-comment">// Kullanım</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ShippingDemo</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
        <span class="hljs-type">ShippingMethod</span> <span class="hljs-variable">shipping</span> <span class="hljs-operator">=</span>
            ShippingFactory.createShipping(<span class="hljs-string">&quot;express&quot;</span>);
        <span class="hljs-type">double</span> <span class="hljs-variable">cost</span> <span class="hljs-operator">=</span> shipping.calculateCost(<span class="hljs-number">2.5</span>); <span class="hljs-comment">// 2.5 kg</span>
        System.out.println(<span class="hljs-string">&quot;Method: &quot;</span>
            + shipping.getMethodName());
        System.out.println(<span class="hljs-string">&quot;Cost: $&quot;</span> + cost);
        System.out.println(<span class="hljs-string">&quot;Delivery: &quot;</span>
            + shipping.getEstimatedDelivery());
    }
}
</code></pre>

<h2 id="b7-entegre-sipari%C5%9F-s%C4%B1n%C4%B1f%C4%B1-integrated-order-class">B7. Entegre Sipariş Sınıfı (Integrated Order Class)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.util.*;

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Order</span> {
    <span class="hljs-keyword">private</span> String orderId;
    <span class="hljs-keyword">private</span> <span class="hljs-type">double</span> totalAmount;
    <span class="hljs-keyword">private</span> <span class="hljs-type">double</span> weight;
    <span class="hljs-keyword">private</span> OrderState state;
    <span class="hljs-keyword">private</span> List&lt;OrderObserver&gt; observers = <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;&gt;();

    <span class="hljs-keyword">public</span> <span class="hljs-title function_">Order</span><span class="hljs-params">(String orderId, <span class="hljs-type">double</span> totalAmount, <span class="hljs-type">double</span> weight)</span> {
        <span class="hljs-built_in">this</span>.orderId = orderId;
        <span class="hljs-built_in">this</span>.totalAmount = totalAmount;
        <span class="hljs-built_in">this</span>.weight = weight;
        <span class="hljs-built_in">this</span>.state = <span class="hljs-keyword">new</span> <span class="hljs-title class_">NewOrderState</span>();
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">addObserver</span><span class="hljs-params">(OrderObserver observer)</span> {
        observers.add(observer);
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">setState</span><span class="hljs-params">(OrderState newState)</span> {
        <span class="hljs-type">String</span> <span class="hljs-variable">oldStatus</span> <span class="hljs-operator">=</span> <span class="hljs-built_in">this</span>.state.getStatus();
        <span class="hljs-built_in">this</span>.state = newState;
        notifyObservers(oldStatus, newState.getStatus());
    }

    <span class="hljs-keyword">private</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">notifyObservers</span><span class="hljs-params">(String oldStatus, String newStatus)</span> {
        <span class="hljs-keyword">for</span> (OrderObserver observer : observers) {
            observer.update(orderId, oldStatus, newStatus);
        }
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">processPayment</span><span class="hljs-params">(PaymentStrategy paymentStrategy)</span> {
        <span class="hljs-keyword">if</span> (paymentStrategy.pay(totalAmount)) {
            state.next(<span class="hljs-built_in">this</span>); <span class="hljs-comment">// NEW&#x27;den PAID&#x27;e geçiş</span>
        }
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">ship</span><span class="hljs-params">(String shippingType)</span> {
        <span class="hljs-type">ShippingMethod</span> <span class="hljs-variable">shipping</span> <span class="hljs-operator">=</span> ShippingFactory.createShipping(shippingType);
        <span class="hljs-type">double</span> <span class="hljs-variable">cost</span> <span class="hljs-operator">=</span> shipping.calculateCost(weight);
        System.out.println(<span class="hljs-string">&quot;Shipping via &quot;</span> + shipping.getMethodName()
            + <span class="hljs-string">&quot; | Cost: $&quot;</span> + cost
            + <span class="hljs-string">&quot; | ETA: &quot;</span> + shipping.getEstimatedDelivery());
        state.next(<span class="hljs-built_in">this</span>); <span class="hljs-comment">// PAID&#x27;den SHIPPED&#x27;e geçiş</span>
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">deliver</span><span class="hljs-params">()</span> { state.next(<span class="hljs-built_in">this</span>); }
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">cancel</span><span class="hljs-params">()</span> { state.cancel(<span class="hljs-built_in">this</span>); }
    <span class="hljs-keyword">public</span> String <span class="hljs-title function_">getStatus</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> state.getStatus(); }
    <span class="hljs-keyword">public</span> String <span class="hljs-title function_">getOrderId</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> orderId; }
}
</code></pre>

<h2 id="b7-entegre-sistemi-%C3%A7al%C4%B1%C5%9Ft%C4%B1rma">B7. Entegre Sistemi Çalıştırma</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ECommerceDemo</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
        <span class="hljs-comment">// Sipariş oluştur</span>
        <span class="hljs-type">Order</span> <span class="hljs-variable">order</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Order</span>(<span class="hljs-string">&quot;ORD-001&quot;</span>, <span class="hljs-number">299.99</span>, <span class="hljs-number">3.5</span>);

        <span class="hljs-comment">// Gözlemcileri kaydet (Observer Deseni)</span>
        order.addObserver(<span class="hljs-keyword">new</span> <span class="hljs-title class_">EmailNotification</span>());
        order.addObserver(<span class="hljs-keyword">new</span> <span class="hljs-title class_">SMSNotification</span>());
        order.addObserver(<span class="hljs-keyword">new</span> <span class="hljs-title class_">PushNotification</span>());

        System.out.println(<span class="hljs-string">&quot;Initial status: &quot;</span> + order.getStatus());
        System.out.println(<span class="hljs-string">&quot;---&quot;</span>);

        <span class="hljs-comment">// Ödemeyi işle (Strategy Deseni)</span>
        <span class="hljs-type">PaymentStrategy</span> <span class="hljs-variable">payment</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">CreditCardPayment</span>(
            <span class="hljs-string">&quot;4111111111111234&quot;</span>, <span class="hljs-string">&quot;John Doe&quot;</span>);
        order.processPayment(payment);
        System.out.println(<span class="hljs-string">&quot;---&quot;</span>);

        <span class="hljs-comment">// Siparişi kargola (Factory Method Deseni)</span>
        order.ship(<span class="hljs-string">&quot;express&quot;</span>);
        System.out.println(<span class="hljs-string">&quot;---&quot;</span>);

        <span class="hljs-comment">// Siparişi teslim et (State Deseni)</span>
        order.deliver();
        System.out.println(<span class="hljs-string">&quot;---&quot;</span>);

        System.out.println(<span class="hljs-string">&quot;Final status: &quot;</span> + order.getStatus());
    }
}
</code></pre>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Initial status: NEW
---

<h2 id="b8-%C3%B6ncesisonras%C4%B1-kar%C5%9F%C4%B1la%C5%9Ft%C4%B1rmas%C4%B1">B8. Öncesi/Sonrası Karşılaştırması</h2>
<h3 id="%C3%B6ncesi-desenler-olmadan">Öncesi (Desenler Olmadan)</h3>
<ul>
<li>Ödeme, durum, kargo, bildirimler için uzun <code>if-else</code> zincirleri</li>
<li>Yeni bir ödeme yöntemi eklemek <code>processPayment()</code> metodunu değiştirmeyi gerektirir</li>
<li>Yeni bir bildirim kanalı eklemek her durum geçişini değiştirmeyi gerektirir</li>
<li>Durum geçişleri hataya açıktır -- doğrulama yoktur</li>
</ul>
<h3 id="sonras%C4%B1-desenlerle">Sonrası (Desenlerle)</h3>
<ul>
<li><strong>Strategy:</strong> Yeni ödeme yöntemleri = <code>PaymentStrategy</code> uygulayan yeni sınıf</li>
<li><strong>State:</strong> Net geçişler, geçersiz durum değişiklikleri imkansız</li>
<li><strong>Observer:</strong> Yeni bildirim kanalı = yeni <code>OrderObserver</code> uygulaması</li>
<li><strong>Factory Method:</strong> Yeni kargo tipi = yeni sınıf + fabrika güncellemesi</li>
</ul>

<h3 id="geri-alyinele-ile-metin-d%C3%BCzenleyici-text-editor-with-undoredo">Geri Al/Yinele ile Metin Düzenleyici (Text Editor with Undo/Redo)</h3>
<p>Bu vaka çalışması, Command (Komut) ve Memento (Hatıra) desenlerinin birlikte çalışmasını gösterir.</p>

<h2 id="c2-command-komut-deseni----d%C3%BCzenleyici-i%CC%87%C5%9Flemleri">C2. Command (Komut) Deseni -- Düzenleyici İşlemleri</h2>
<p><strong>Hedef:</strong> Her işlemi bir nesne olarak kapsülleyerek geri alma desteği sağlamak.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Komut arayüzü</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">EditorCommand</span> {
    <span class="hljs-keyword">void</span> <span class="hljs-title function_">execute</span><span class="hljs-params">()</span>;
    <span class="hljs-keyword">void</span> <span class="hljs-title function_">undo</span><span class="hljs-params">()</span>;
    String <span class="hljs-title function_">getDescription</span><span class="hljs-params">()</span>;
}

<span class="hljs-comment">// Alıcı (Receiver) -- asıl metin tamponu</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">TextBuffer</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-type">StringBuilder</span> <span class="hljs-variable">content</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">StringBuilder</span>();
    <span class="hljs-keyword">private</span> <span class="hljs-type">int</span> <span class="hljs-variable">cursorPosition</span> <span class="hljs-operator">=</span> <span class="hljs-number">0</span>;

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">insert</span><span class="hljs-params">(String text, <span class="hljs-type">int</span> position)</span> {
        content.insert(position, text);
        cursorPosition = position + text.length();
    }

    <span class="hljs-keyword">public</span> String <span class="hljs-title function_">delete</span><span class="hljs-params">(<span class="hljs-type">int</span> position, <span class="hljs-type">int</span> length)</span> {
        <span class="hljs-type">String</span> <span class="hljs-variable">deleted</span> <span class="hljs-operator">=</span> content.substring(position,
            position + length);
        content.delete(position, position + length);
        cursorPosition = position;
        <span class="hljs-keyword">return</span> deleted;
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">setCursorPosition</span><span class="hljs-params">(<span class="hljs-type">int</span> position)</span> {
        <span class="hljs-built_in">this</span>.cursorPosition = Math.min(position,
            content.length());
    }

    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">getCursorPosition</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> cursorPosition; }
    <span class="hljs-keyword">public</span> String <span class="hljs-title function_">getContent</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> content.toString(); }
    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">getLength</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> content.length(); }
}
</code></pre>

<h2 id="c2-command-komut-deseni----somut-komutlar">C2. Command (Komut) Deseni -- Somut Komutlar</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Somut Komut: Metin Ekle</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">InsertCommand</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">EditorCommand</span> {
    <span class="hljs-keyword">private</span> TextBuffer buffer;
    <span class="hljs-keyword">private</span> String text;
    <span class="hljs-keyword">private</span> <span class="hljs-type">int</span> position;

    <span class="hljs-keyword">public</span> <span class="hljs-title function_">InsertCommand</span><span class="hljs-params">(TextBuffer buffer, String text,
                         <span class="hljs-type">int</span> position)</span> {
        <span class="hljs-built_in">this</span>.buffer = buffer;
        <span class="hljs-built_in">this</span>.text = text;
        <span class="hljs-built_in">this</span>.position = position;
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">execute</span><span class="hljs-params">()</span> {
        buffer.insert(text, position);
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">undo</span><span class="hljs-params">()</span> {
        buffer.delete(position, text.length());
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> String <span class="hljs-title function_">getDescription</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;Insert &#x27;&quot;</span> + text + <span class="hljs-string">&quot;&#x27; at position &quot;</span> + position;
    }
}

<span class="hljs-comment">// Somut Komut: Metin Sil</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">DeleteCommand</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">EditorCommand</span> {
    <span class="hljs-keyword">private</span> TextBuffer buffer;
    <span class="hljs-keyword">private</span> <span class="hljs-type">int</span> position;
    <span class="hljs-keyword">private</span> <span class="hljs-type">int</span> length;
    <span class="hljs-keyword">private</span> String deletedText; <span class="hljs-comment">// geri alma için kaydedilir</span>

    <span class="hljs-keyword">public</span> <span class="hljs-title function_">DeleteCommand</span><span class="hljs-params">(TextBuffer buffer, <span class="hljs-type">int</span> position,
                         <span class="hljs-type">int</span> length)</span> {
        <span class="hljs-built_in">this</span>.buffer = buffer;
        <span class="hljs-built_in">this</span>.position = position;
        <span class="hljs-built_in">this</span>.length = length;
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">execute</span><span class="hljs-params">()</span> {
        deletedText = buffer.delete(position, length);
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">undo</span><span class="hljs-params">()</span> {
        buffer.insert(deletedText, position);
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> String <span class="hljs-title function_">getDescription</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;Delete &quot;</span> + length + <span class="hljs-string">&quot; chars at position &quot;</span>
            + position;
    }
}
</code></pre>

<h2 id="c3-memento-hat%C4%B1ra-deseni----d%C3%BCzenleyici-durum-anl%C4%B1k-g%C3%B6r%C3%BCnt%C3%BCleri">C3. Memento (Hatıra) Deseni -- Düzenleyici Durum Anlık Görüntüleri</h2>
<p><strong>Hedef:</strong> Geri al/yinele için düzenleyicinin iç durumunu yakalamak ve geri yüklemek.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Memento -- düzenleyici durumunun değişmez anlık görüntüsü</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">EditorMemento</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> String content;
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> <span class="hljs-type">int</span> cursorPosition;
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> <span class="hljs-type">long</span> timestamp;

    <span class="hljs-keyword">public</span> <span class="hljs-title function_">EditorMemento</span><span class="hljs-params">(String content, <span class="hljs-type">int</span> cursorPosition)</span> {
        <span class="hljs-built_in">this</span>.content = content;
        <span class="hljs-built_in">this</span>.cursorPosition = cursorPosition;
        <span class="hljs-built_in">this</span>.timestamp = System.currentTimeMillis();
    }

    <span class="hljs-keyword">public</span> String <span class="hljs-title function_">getContent</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> content; }
    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">getCursorPosition</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> cursorPosition; }
    <span class="hljs-keyword">public</span> <span class="hljs-type">long</span> <span class="hljs-title function_">getTimestamp</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> timestamp; }
}

<span class="hljs-comment">// Caretaker (Bakıcı) -- memento geçmişini yönetir</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">EditorHistory</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> List&lt;EditorMemento&gt; undoStack = <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;&gt;();
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> List&lt;EditorMemento&gt; redoStack = <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;&gt;();

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">save</span><span class="hljs-params">(EditorMemento memento)</span> {
        undoStack.add(memento);
        redoStack.clear(); <span class="hljs-comment">// yeni eylem yinele geçmişini geçersiz kılar</span>
    }

    <span class="hljs-keyword">public</span> EditorMemento <span class="hljs-title function_">undo</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">if</span> (undoStack.size() &lt;= <span class="hljs-number">1</span>) <span class="hljs-keyword">return</span> <span class="hljs-literal">null</span>; <span class="hljs-comment">// geri alınacak bir şey yok</span>
        <span class="hljs-type">EditorMemento</span> <span class="hljs-variable">current</span> <span class="hljs-operator">=</span> undoStack.remove(
            undoStack.size() - <span class="hljs-number">1</span>);
        redoStack.add(current);
        <span class="hljs-keyword">return</span> undoStack.get(undoStack.size() - <span class="hljs-number">1</span>);
    }

    <span class="hljs-keyword">public</span> EditorMemento <span class="hljs-title function_">redo</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">if</span> (redoStack.isEmpty()) <span class="hljs-keyword">return</span> <span class="hljs-literal">null</span>;
        <span class="hljs-type">EditorMemento</span> <span class="hljs-variable">memento</span> <span class="hljs-operator">=</span> redoStack.remove(
            redoStack.size() - <span class="hljs-number">1</span>);
        undoStack.add(memento);
        <span class="hljs-keyword">return</span> memento;
    }

    <span class="hljs-keyword">public</span> <span class="hljs-type">boolean</span> <span class="hljs-title function_">canUndo</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> undoStack.size() &gt; <span class="hljs-number">1</span>; }
    <span class="hljs-keyword">public</span> <span class="hljs-type">boolean</span> <span class="hljs-title function_">canRedo</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> !redoStack.isEmpty(); }
}
</code></pre>

<h2 id="c4-composite-bile%C5%9Fik-desen----belge-yap%C4%B1s%C4%B1">C4. Composite (Bileşik) Desen -- Belge Yapısı</h2>
<p><strong>Hedef:</strong> Belgeyi bir öğe ağacı olarak temsil etmek (bölümler, paragraflar, metin).</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.util.*;

<span class="hljs-comment">// Bileşen (Component)</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">DocumentElement</span> {
    String <span class="hljs-title function_">render</span><span class="hljs-params">()</span>;
    <span class="hljs-type">int</span> <span class="hljs-title function_">getCharCount</span><span class="hljs-params">()</span>;
}

<span class="hljs-comment">// Yaprak (Leaf): TextSpan</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">TextSpan</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">DocumentElement</span> {
    <span class="hljs-keyword">private</span> String text;
    <span class="hljs-keyword">private</span> <span class="hljs-type">boolean</span> bold;
    <span class="hljs-keyword">private</span> <span class="hljs-type">boolean</span> italic;

    <span class="hljs-keyword">public</span> <span class="hljs-title function_">TextSpan</span><span class="hljs-params">(String text)</span> {
        <span class="hljs-built_in">this</span>.text = text;
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">setBold</span><span class="hljs-params">(<span class="hljs-type">boolean</span> bold)</span> { <span class="hljs-built_in">this</span>.bold = bold; }
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">setItalic</span><span class="hljs-params">(<span class="hljs-type">boolean</span> italic)</span> {
        <span class="hljs-built_in">this</span>.italic = italic;
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> String <span class="hljs-title function_">render</span><span class="hljs-params">()</span> {
        <span class="hljs-type">String</span> <span class="hljs-variable">result</span> <span class="hljs-operator">=</span> text;
        <span class="hljs-keyword">if</span> (bold) result = <span class="hljs-string">&quot;**&quot;</span> + result + <span class="hljs-string">&quot;**&quot;</span>;
        <span class="hljs-keyword">if</span> (italic) result = <span class="hljs-string">&quot;_&quot;</span> + result + <span class="hljs-string">&quot;_&quot;</span>;
        <span class="hljs-keyword">return</span> result;
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">getCharCount</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> text.length(); }
}

<span class="hljs-comment">// Bileşik (Composite): Paragraph</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Paragraph</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">DocumentElement</span> {
    <span class="hljs-keyword">private</span> List&lt;DocumentElement&gt; children = <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;&gt;();

<h2 id="c5-entegre-metin-d%C3%BCzenleyici-integrated-text-editor">C5. Entegre Metin Düzenleyici (Integrated Text Editor)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.util.*;

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">TextEditor</span> {
    <span class="hljs-keyword">private</span> TextBuffer buffer;
    <span class="hljs-keyword">private</span> EditorHistory history;
    <span class="hljs-keyword">private</span> List&lt;EditorCommand&gt; commandLog;

    <span class="hljs-keyword">public</span> <span class="hljs-title function_">TextEditor</span><span class="hljs-params">()</span> {
        <span class="hljs-built_in">this</span>.buffer = <span class="hljs-keyword">new</span> <span class="hljs-title class_">TextBuffer</span>();
        <span class="hljs-built_in">this</span>.history = <span class="hljs-keyword">new</span> <span class="hljs-title class_">EditorHistory</span>();
        <span class="hljs-built_in">this</span>.commandLog = <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;&gt;();
        <span class="hljs-comment">// Başlangıç durumunu kaydet</span>
        history.save(<span class="hljs-keyword">new</span> <span class="hljs-title class_">EditorMemento</span>(
            buffer.getContent(), buffer.getCursorPosition()));
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">type</span><span class="hljs-params">(String text)</span> {
        <span class="hljs-type">EditorCommand</span> <span class="hljs-variable">cmd</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">InsertCommand</span>(
            buffer, text, buffer.getCursorPosition());
        executeCommand(cmd);
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">deleteAt</span><span class="hljs-params">(<span class="hljs-type">int</span> position, <span class="hljs-type">int</span> length)</span> {
        <span class="hljs-type">EditorCommand</span> <span class="hljs-variable">cmd</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">DeleteCommand</span>(
            buffer, position, length);
        executeCommand(cmd);
    }

    <span class="hljs-keyword">private</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">executeCommand</span><span class="hljs-params">(EditorCommand cmd)</span> {
        cmd.execute();
        commandLog.add(cmd);
        history.save(<span class="hljs-keyword">new</span> <span class="hljs-title class_">EditorMemento</span>(
            buffer.getContent(), buffer.getCursorPosition()));
        System.out.println(<span class="hljs-string">&quot;Executed: &quot;</span> + cmd.getDescription());
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">undo</span><span class="hljs-params">()</span> {
        <span class="hljs-type">EditorMemento</span> <span class="hljs-variable">memento</span> <span class="hljs-operator">=</span> history.undo();
        <span class="hljs-keyword">if</span> (memento != <span class="hljs-literal">null</span>) {
            buffer = <span class="hljs-keyword">new</span> <span class="hljs-title class_">TextBuffer</span>();
            buffer.insert(memento.getContent(), <span class="hljs-number">0</span>);
            buffer.setCursorPosition(memento.getCursorPosition());
            System.out.println(<span class="hljs-string">&quot;Undo performed.&quot;</span>);
        } <span class="hljs-keyword">else</span> {
            System.out.println(<span class="hljs-string">&quot;Nothing to undo.&quot;</span>);
        }
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">redo</span><span class="hljs-params">()</span> {
        <span class="hljs-type">EditorMemento</span> <span class="hljs-variable">memento</span> <span class="hljs-operator">=</span> history.redo();
        <span class="hljs-keyword">if</span> (memento != <span class="hljs-literal">null</span>) {
            buffer = <span class="hljs-keyword">new</span> <span class="hljs-title class_">TextBuffer</span>();
            buffer.insert(memento.getContent(), <span class="hljs-number">0</span>);
            buffer.setCursorPosition(memento.getCursorPosition());
            System.out.println(<span class="hljs-string">&quot;Redo performed.&quot;</span>);
        } <span class="hljs-keyword">else</span> {
            System.out.println(<span class="hljs-string">&quot;Nothing to redo.&quot;</span>);
        }
    }

    <span class="hljs-keyword">public</span> String <span class="hljs-title function_">getContent</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> buffer.getContent(); }
    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">getCursorPosition</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> buffer.getCursorPosition(); }
}

}

<h2 id="mod%C3%BCl-c----%C3%B6zet">Modül C -- Özet</h2>
<h3 id="metin-d%C3%BCzenleyici-vaka-%C3%A7al%C4%B1%C5%9Fmas%C4%B1ndan-temel-dersler">Metin Düzenleyici Vaka Çalışmasından Temel Dersler</h3>
<ol>
<li><strong>Command (Komut) Deseni</strong> işlemleri nesnelere dönüştürür -- günlükleme, kuyruklama ve geri almayı mümkün kılar.</li>
<li><strong>Memento (Hatıra) Deseni</strong> kapsüllemeyi (encapsulation) bozmadan durum anlık görüntüleri yakalar.</li>
<li><strong>Composite (Bileşik) Desen</strong> bireysel öğelerin ve bileşimlerin tek tip işlenmesine olanak tanır.</li>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">NotificationService</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">sendNotification</span><span class="hljs-params">(String type, String recipient,

        <span class="hljs-type">String</span> <span class="hljs-variable">finalMessage</span> <span class="hljs-operator">=</span> message;

        <span class="hljs-comment">// Apply template if specified</span>

                finalMessage = <span class="hljs-string">&quot;Hello &quot;</span> + params.get(<span class="hljs-string">&quot;name&quot;</span>)

                    + params.get(<span class="hljs-string">&quot;resetLink&quot;</span>) + <span class="hljs-string">&quot;\n&quot;</span> + message;
            } <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (templateName.equals(<span class="hljs-string">&quot;order_confirmation&quot;</span>)) {
                finalMessage = <span class="hljs-string">&quot;Dear &quot;</span> + params.get(<span class="hljs-string">&quot;name&quot;</span>)
                    + <span class="hljs-string">&quot;,\nYour order #&quot;</span> + params.get(<span class="hljs-string">&quot;orderId&quot;</span>)
                    + <span class="hljs-string">&quot; has been confirmed.\nTotal: $&quot;</span>
                    + params.get(<span class="hljs-string">&quot;total&quot;</span>) + <span class="hljs-string">&quot;\n&quot;</span> + message;
            } <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (templateName.equals(<span class="hljs-string">&quot;shipping_update&quot;</span>)) {
                finalMessage = <span class="hljs-string">&quot;Dear &quot;</span> + params.get(<span class="hljs-string">&quot;name&quot;</span>)
                    + <span class="hljs-string">&quot;,\nYour order #&quot;</span> + params.get(<span class="hljs-string">&quot;orderId&quot;</span>)
                    + <span class="hljs-string">&quot; has been shipped.\nTracking: &quot;</span>
                    + params.get(<span class="hljs-string">&quot;trackingNumber&quot;</span>) + <span class="hljs-string">&quot;\n&quot;</span>
                    + message;
            }
        }

        <span class="hljs-comment">// Send based on type</span>
        <span class="hljs-keyword">if</span> (type.equals(<span class="hljs-string">&quot;email&quot;</span>)) {
            <span class="hljs-keyword">if</span> (urgent) {

                System.out.println(<span class="hljs-string">&quot;Subject: !!! &quot;</span> + subject + <span class="hljs-string">&quot; !!!&quot;</span>);
            } <span class="hljs-keyword">else</span> {
                System.out.println(<span class="hljs-string">&quot;[EMAIL] To: &quot;</span> + recipient);
                System.out.println(<span class="hljs-string">&quot;Subject: &quot;</span> + subject);
            }
            System.out.println(<span class="hljs-string">&quot;Body: &quot;</span> + finalMessage);
            <span class="hljs-comment">// Connect to SMTP server, authenticate, send...</span>
            System.out.println(<span class="hljs-string">&quot;Email sent successfully.&quot;</span>);

        } <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (type.equals(<span class="hljs-string">&quot;sms&quot;</span>)) {
            <span class="hljs-type">String</span> <span class="hljs-variable">smsMessage</span> <span class="hljs-operator">=</span> finalMessage;
            <span class="hljs-keyword">if</span> (smsMessage.length() &gt; <span class="hljs-number">160</span>) {
                smsMessage = smsMessage.substring(<span class="hljs-number">0</span>, <span class="hljs-number">157</span>) + <span class="hljs-string">&quot;...&quot;</span>;
            }
            <span class="hljs-keyword">if</span> (urgent) {
                smsMessage = <span class="hljs-string">&quot;URGENT: &quot;</span> + smsMessage;
            }
            System.out.println(<span class="hljs-string">&quot;[SMS] To: &quot;</span> + recipient);
            System.out.println(<span class="hljs-string">&quot;Message: &quot;</span> + smsMessage);
            <span class="hljs-comment">// Connect to SMS gateway, send...</span>
            System.out.println(<span class="hljs-string">&quot;SMS sent successfully.&quot;</span>);

        } <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (type.equals(<span class="hljs-string">&quot;push&quot;</span>)) {

                : finalMessage;
            System.out.println(<span class="hljs-string">&quot;Body: &quot;</span> + pushBody);
            <span class="hljs-comment">// Connect to push service, send...</span>

        } <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (type.equals(<span class="hljs-string">&quot;slack&quot;</span>)) {

            <span class="hljs-type">String</span> <span class="hljs-variable">slackMsg</span> <span class="hljs-operator">=</span> <span class="hljs-string">&quot;*&quot;</span> + subject + <span class="hljs-string">&quot;*\n&quot;</span> + finalMessage;
            <span class="hljs-keyword">if</span> (urgent) {
                slackMsg = <span class="hljs-string">&quot;:rotating_light: &quot;</span> + slackMsg;
            }
            System.out.println(<span class="hljs-string">&quot;Message: &quot;</span> + slackMsg);
            <span class="hljs-comment">// Connect to Slack API, send...</span>
            System.out.println(<span class="hljs-string">&quot;Slack message sent.&quot;</span>);
        }

        <span class="hljs-comment">// Log the notification</span>
        System.out.println(<span class="hljs-string">&quot;[LOG] &quot;</span> + type + <span class="hljs-string">&quot; notification sent to &quot;</span>
            + recipient + <span class="hljs-string">&quot; at &quot;</span> + <span class="hljs-keyword">new</span> <span class="hljs-title class_">java</span>.util.Date());
    }
}

<h2 id="d3-ad%C4%B1m-1----parametre-nesnesi-tan%C4%B1tma-introduce-parameter-object">D3. Adım 1 -- Parametre Nesnesi Tanıtma (Introduce Parameter Object)</h2>
<p><strong>Öncesi:</strong> Metod imzasında 7 parametre.</p>
<p><strong>Sonrası:</strong> Tek bir <code>NotificationRequest</code> nesnesi.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.util.*;

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">NotificationRequest</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> String type;
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> String recipient;
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> String subject;
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> String message;
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> <span class="hljs-type">boolean</span> urgent;
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> String templateName;
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> Map&lt;String, String&gt; params;

    <span class="hljs-keyword">public</span> <span class="hljs-title function_">NotificationRequest</span><span class="hljs-params">(String type, String recipient,
            String subject, String message, <span class="hljs-type">boolean</span> urgent,
            String templateName, Map&lt;String, String&gt; params)</span> {
        <span class="hljs-built_in">this</span>.type = type;
        <span class="hljs-built_in">this</span>.recipient = recipient;
        <span class="hljs-built_in">this</span>.subject = subject;
        <span class="hljs-built_in">this</span>.message = message;
        <span class="hljs-built_in">this</span>.urgent = urgent;
        <span class="hljs-built_in">this</span>.templateName = templateName;
        <span class="hljs-built_in">this</span>.params = params != <span class="hljs-literal">null</span>
            ? Collections.unmodifiableMap(params)
            : Collections.emptyMap();
    }

    <span class="hljs-comment">// Getter&#x27;lar</span>
    <span class="hljs-keyword">public</span> String <span class="hljs-title function_">getType</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> type; }

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">EmailChannel</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">NotificationChannel</span> {

<h2 id="d4-di%C4%9Fer-bildirim-kanallar%C4%B1">D4. Diğer Bildirim Kanalları</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">PushChannel</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">NotificationChannel</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">final</span> <span class="hljs-type">int</span> <span class="hljs-variable">MAX_BODY_LENGTH</span> <span class="hljs-operator">=</span> <span class="hljs-number">100</span>;

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">protected</span> String <span class="hljs-title function_">applyUrgencyFormatting</span><span class="hljs-params">(
            NotificationRequest request, String message)</span> {
        <span class="hljs-keyword">return</span> message; <span class="hljs-comment">// teslimat sırasında işlenir</span>
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">protected</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">deliverMessage</span><span class="hljs-params">(
            NotificationRequest request, String message)</span> {
        <span class="hljs-keyword">if</span> (request.isUrgent()) {
            System.out.println(<span class="hljs-string">&quot;[PUSH - HIGH PRIORITY] To: &quot;</span>
                + request.getRecipient());
        } <span class="hljs-keyword">else</span> {
            System.out.println(<span class="hljs-string">&quot;[PUSH] To: &quot;</span>
                + request.getRecipient());
        }
        System.out.println(<span class="hljs-string">&quot;Title: &quot;</span> + request.getSubject());
        <span class="hljs-type">String</span> <span class="hljs-variable">pushBody</span> <span class="hljs-operator">=</span> message.length() &gt; MAX_BODY_LENGTH
            ? message.substring(<span class="hljs-number">0</span>, MAX_BODY_LENGTH - <span class="hljs-number">3</span>) + <span class="hljs-string">&quot;...&quot;</span>
            : message;
        System.out.println(<span class="hljs-string">&quot;Body: &quot;</span> + pushBody);
        System.out.println(<span class="hljs-string">&quot;Push notification sent.&quot;</span>);
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">protected</span> String <span class="hljs-title function_">getChannelName</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;Push&quot;</span>; }
}

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">SlackChannel</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">NotificationChannel</span> {
    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">protected</span> String <span class="hljs-title function_">applyUrgencyFormatting</span><span class="hljs-params">(
            NotificationRequest request, String message)</span> {
        <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;:rotating_light: &quot;</span> + message;
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">protected</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">deliverMessage</span><span class="hljs-params">(
            NotificationRequest request, String message)</span> {

            + <span class="hljs-string">&quot;*\n&quot;</span> + message;
        System.out.println(<span class="hljs-string">&quot;Message: &quot;</span> + slackMsg);
        System.out.println(<span class="hljs-string">&quot;Slack message sent.&quot;</span>);
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">protected</span> String <span class="hljs-title function_">getChannelName</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;Slack&quot;</span>; }

<h2 id="d5-yeniden-yap%C4%B1land%C4%B1r%C4%B1lm%C4%B1%C5%9F-bildirim-servisi-refactored-notification-service">D5. Yeniden Yapılandırılmış Bildirim Servisi (Refactored Notification Service)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.util.*;

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">NotificationService</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> Map&lt;String, NotificationChannel&gt; channels;

    <span class="hljs-keyword">public</span> <span class="hljs-title function_">NotificationService</span><span class="hljs-params">()</span> {
        channels = <span class="hljs-keyword">new</span> <span class="hljs-title class_">HashMap</span>&lt;&gt;();
        channels.put(<span class="hljs-string">&quot;email&quot;</span>, <span class="hljs-keyword">new</span> <span class="hljs-title class_">EmailChannel</span>());
        channels.put(<span class="hljs-string">&quot;sms&quot;</span>, <span class="hljs-keyword">new</span> <span class="hljs-title class_">SMSChannel</span>());
        channels.put(<span class="hljs-string">&quot;push&quot;</span>, <span class="hljs-keyword">new</span> <span class="hljs-title class_">PushChannel</span>());
        channels.put(<span class="hljs-string">&quot;slack&quot;</span>, <span class="hljs-keyword">new</span> <span class="hljs-title class_">SlackChannel</span>());
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">send</span><span class="hljs-params">(NotificationRequest request)</span> {
        <span class="hljs-type">NotificationChannel</span> <span class="hljs-variable">channel</span> <span class="hljs-operator">=</span>
            channels.get(request.getType());
        <span class="hljs-keyword">if</span> (channel == <span class="hljs-literal">null</span>) {
            <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">IllegalArgumentException</span>(
                <span class="hljs-string">&quot;Unknown channel: &quot;</span> + request.getType());
        }
        channel.send(request);
    }

    <span class="hljs-comment">// Mevcut kodu değiştirmeden yeni kanallar eklemek kolay</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">registerChannel</span><span class="hljs-params">(String name,
                                NotificationChannel channel)</span> {
        channels.put(name, channel);
    }
}
</code></pre>

<h2 id="e1-tasar%C4%B1m-desenlerini-ne-zaman-kullanmamali">E1. Tasarım Desenlerini Ne Zaman KULLANMAMALI</h2>
<h3 id="a%C5%9F%C4%B1r%C4%B1-m%C3%BChendislik-over-engineering-uyar%C4%B1-i%CC%87%C5%9Faretleri">Aşırı Mühendislik (Over-Engineering) Uyarı İşaretleri</h3>
<p>Tasarım desenleri araçtır, amaç değildir. İhtiyaç olmadığında desen kullanmak gereksiz karmaşıklık yaratır.</p>
<p><strong>Şu durumlarda desen KULLANMAYIN:</strong></p>
<ul>
<li><strong>Problem basitse</strong> -- 2-3 durum için basit bir <code>if-else</code> yeterlidir.</li>
<li><strong>Kodun değişeceğinden emin değilseniz</strong> -- YAGNI (You Aren't Gonna Need It / Buna İhtiyacınız Olmayacak).</li>
<li><strong>Desen tasarruf ettiğinden fazla kod ekliyorsa</strong> -- Soyutlama problemden daha karmaşıksa, atlayın.</li>
<li><strong>Ekibiniz deseni anlamıyorsa</strong> -- Okunabilirlik zekilikten daha önemlidir.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// AŞIRI MÜHENDİSLİK: 2 basit tip için Factory</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">AnimalFactory</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> Animal <span class="hljs-title function_">create</span><span class="hljs-params">(String type)</span> {
        <span class="hljs-keyword">if</span> (type.equals(<span class="hljs-string">&quot;dog&quot;</span>)) <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Dog</span>();
        <span class="hljs-keyword">if</span> (type.equals(<span class="hljs-string">&quot;cat&quot;</span>)) <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Cat</span>();
        <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">IllegalArgumentException</span>(type);
    }
}

<span class="hljs-comment">// DAHA BASİT: Nesneleri doğrudan oluşturun</span>
<span class="hljs-type">Dog</span> <span class="hljs-variable">dog</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Dog</span>();
<span class="hljs-type">Cat</span> <span class="hljs-variable">cat</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Cat</span>();
</code></pre>

<h2 id="e3-anti-desen-singleton-k%C3%B6t%C3%BCye-kullan%C4%B1m%C4%B1-singleton-abuse">E3. Anti-Desen: Singleton Kötüye Kullanımı (Singleton Abuse)</h2>
<p><strong>Nedir:</strong> &quot;Sadece bir örneğe ihtiyacımız var&quot; diye her şey için Singleton kullanmak.</p>
<p><strong>Sorunlar:</strong> Gizli bağımlılıklar, test etmesi zor, global değiştirilebilir durum.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// KÖTÜ: Global değişken olarak kullanılan Singleton</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">DatabaseConnection</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">static</span> DatabaseConnection instance;
    <span class="hljs-keyword">private</span> Connection connection;

    <span class="hljs-keyword">private</span> <span class="hljs-title function_">DatabaseConnection</span><span class="hljs-params">()</span> {
        <span class="hljs-comment">// veritabanına bağlan</span>
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> DatabaseConnection <span class="hljs-title function_">getInstance</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">if</span> (instance == <span class="hljs-literal">null</span>) {
            instance = <span class="hljs-keyword">new</span> <span class="hljs-title class_">DatabaseConnection</span>();
        }
        <span class="hljs-keyword">return</span> instance;
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">query</span><span class="hljs-params">(String sql)</span> { <span class="hljs-comment">/* ... */</span> }
}

<span class="hljs-comment">// Her sınıf singleton&#x27;a bağımlı</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">OrderService</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">createOrder</span><span class="hljs-params">(Order order)</span> {
        <span class="hljs-comment">// Gizli bağımlılık -- test etmesi zor!</span>
        DatabaseConnection.getInstance()
            .query(<span class="hljs-string">&quot;INSERT INTO orders ...&quot;</span>);
    }
}

<span class="hljs-comment">// İYİ: Bunun yerine bağımlılık enjeksiyonu kullan</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">OrderService</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> DatabaseConnection db;

    <span class="hljs-keyword">public</span> <span class="hljs-title function_">OrderService</span><span class="hljs-params">(DatabaseConnection db)</span> {
        <span class="hljs-built_in">this</span>.db = db; <span class="hljs-comment">// Açık bağımlılık, test edilebilir</span>
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">createOrder</span><span class="hljs-params">(Order order)</span> {
        db.query(<span class="hljs-string">&quot;INSERT INTO orders ...&quot;</span>);
    }
}
</code></pre>
