<h2 id="refactoring-yeniden-yap%C4%B1land%C4%B1rma-nedir">Refactoring (Yeniden Yapılandırma) Nedir?</h2>
<ul>
<li><strong>Refactoring</strong> (Yeniden Yapılandırma), mevcut bir kod tabanının iç yapısını, dış davranışını değiştirmeden yeniden düzenlemeye yönelik disiplinli bir tekniktir.</li>
<li>Her dönüşüm (&quot;refactoring&quot; olarak adlandırılır) küçüktür, ancak bir dizi dönüşüm önemli bir yeniden yapılandırma üretebilir.</li>
<li>Amaç, kodu <strong>anlaşılması daha kolay</strong>, <strong>değiştirilmesi daha ucuz</strong> ve <strong>genişletilmesi daha güvenli</strong> hale getirmektir.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-13</footer>

<h2 id="neden-refactoring-yap%C4%B1l%C4%B1r">Neden Refactoring Yapılır?</h2>
<ul>
<li><strong>Yazılım tasarımını iyileştirir</strong> -- Refactoring yapılmadığında, bir programın tasarımı zamanla bozulur.</li>
<li><strong>Yazılımın anlaşılmasını kolaylaştırır</strong> -- Amacını açıkça ileten kod, bakımı daha kolaydır.</li>
<li><strong>Hataları bulmaya yardımcı olur</strong> -- Kod yapısını netleştirmek, hataları daha görünür kılar.</li>
<li><strong>Daha hızlı programlamaya yardımcı olur</strong> -- İyi tasarım, yeni özelliklerin hızla geliştirilmesini sağlar.</li>
</ul>

<h2 id="ne-zaman-refactoring-yap%C4%B1l%C4%B1r">Ne Zaman Refactoring Yapılır?</h2>
<ul>
<li><strong>Üçler Kuralı</strong>: Bir şeyi ilk kez yaparsanız, sadece yaparsınız. İkinci kez, tekrardan rahatsız olursunuz ama yine de yaparsınız. Üçüncü kez, refactoring yaparsınız.</li>
<li><strong>Özellik eklerken</strong>: Yeni özelliğin eklenmesini kolaylaştırmak için refactoring yapın.</li>
<li><strong>Hata düzeltirken</strong>: Hatayı belirgin hale getirmek için refactoring yapın.</li>
<li><strong>Kod inceleme sırasında</strong>: Okunabilirliği ve bakım kolaylığını artırmak için refactoring yapın.</li>

<h2 id="mod%C3%BCl-a-ana-hatlar%C4%B1">Modül A Ana Hatları</h2>
<h3 id="composing-methods-metot-olu%C5%9Fturma">Composing Methods (Metot Oluşturma)</h3>
<p>Bu yeniden yapılandırmalar, metotların nasıl oluşturulduğuyla ilgilenir. Yeniden yapılandırmanın büyük bölümü, kodu düzgün paketlemek için metotları oluşturmakla ilgilidir. Neredeyse her zaman temel sorun <strong>çok uzun metotlardır</strong>.</p>
<ol>
<li>Extract Method (Metot Çıkarma)</li>
<li>Inline Method (Satır İçi Metot)</li>
<li>Extract Variable (Değişken Çıkarma)</li>
<li>Inline Temp (Geçici Değişkeni Satır İçine Alma)</li>
<li>Replace Temp with Query (Geçici Değişkeni Sorgu ile Değiştirme)</li>
<li>Split Temporary Variable (Geçici Değişkeni Bölme)</li>
<li>Remove Assignments to Parameters (Parametrelere Atamayı Kaldırma)</li>
<li>Replace Method with Method Object (Metodu Metot Nesnesi ile Değiştirme)</li>
<li>Substitute Algorithm (Algoritmayı Değiştirme)</li>
</ol>

<p><strong>Ne zaman kullanılır:</strong> Metotlar 10-15 satırı aştığında; kod bölümleri belirgin bir görev gerçekleştirdiğinde; mantık tekrarlandığında.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Çıkarılan kod gerçekten tek seferlik bir işlem olduğunda; yeni metot aşırı parametre gerektireceğinde.</p>

<p><strong>Ne zaman kullanılır:</strong> Bir metodun yaptığı şeyi başarmak için daha basit veya daha verimli bir yol bulduğunuzda; mevcut algoritma aşırı karmaşık olduğunda.</p>

<p>Bu yeniden yapılandırmalar, işlevlerin sınıflar arasında nasıl dağıtılacağını ele alır. Temel kararlar <strong>sorumlulukların nereye konulacağıdır</strong>. Bir sınıfın çok fazla sorumluluğu varsa Extract Class kullanın. Bir sınıf yetersiz kalıyorsa Inline Class kullanın.</p>

<li>Move Method (Metodu Taşıma)</li>
<li>Move Field (Alanı Taşıma)</li>
<li>Extract Class (Sınıf Çıkarma)</li>
<li>Inline Class (Satır İçi Sınıf)</li>
<li>Hide Delegate (Temsilciyi Gizleme)</li>
<li>Remove Middle Man (Aracıyı Kaldırma)</li>
<li>Introduce Foreign Method (Yabancı Metot Ekleme)</li>
<li>Introduce Local Extension (Yerel Uzantı Ekleme)</li>

<p><strong>Nedir:</strong> Metodu en çok kullanan sınıfta oluşturun ve orijinali yönlendirin veya kaldırın.</p>
<p><strong>Problem:</strong> Bir metot, kendi sınıfından çok başka bir sınıfta kullanılıyor.</p>
<p><strong>Çözüm:</strong> Metodu en çok kullanan sınıfta yeni bir metot oluşturun, ardından eski metodun gövdesini oraya taşıyın. Eski metodu basit bir delege haline getirin veya tamamen kaldırın.</p>
<p><strong>Ne zaman kullanılır:</strong> Bir metot, kendi nesnesinin verilerinden çok başka bir nesnenin verilerine eriştiğinde.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Metot, mevcut sınıfının birkaç özelliğini eşit olarak kullandığında.</p>

<p><strong>Ne zaman kullanılır:</strong> Bir sınıfın doğal olarak gruplanan ve kendi başına durabilecek özellikleri olduğunda.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Sınıf hala uyumlu olduğunda ve bölmek gereksiz bağımlılık yaratacağında.</p>

<h2 id="b4-inline-class-sat%C4%B1r-i%CC%87%C3%A7i-s%C4%B1n%C4%B1f">B4. Inline Class (Satır İçi Sınıf)</h2>
<p><strong>Nedir:</strong> Yetersiz bir sınıfın tüm özelliklerini başka bir sınıfa taşıyın ve silin.</p>
<p><strong>Problem:</strong> Bir sınıf neredeyse hiçbir şey yapmıyor, hiçbir şeyden sorumlu değil ve ek sorumluluk planlanmıyor.</p>
<p><strong>Çözüm:</strong> Sınıfın tüm özelliklerini başka birine taşıyın ve boş sınıfı silin.</p>
<p><strong>Ne zaman kullanılır:</strong> Yeniden yapılandırmalar bir sınıfı ince bir sarıcı dışında her şeyden arındırdığında.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Sınıfın hala açık bir sorumluluğu olduğunda veya büyümesi beklendiğinde.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Person</span> {
    <span class="hljs-keyword">private</span> TelephoneNumber officeTelephone;
    String <span class="hljs-title function_">getAreaCode</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> officeTelephone.getAreaCode(); }
}
<span class="hljs-keyword">class</span> <span class="hljs-title class_">TelephoneNumber</span> { <span class="hljs-comment">/* only areaCode and number */</span> }

<span class="hljs-comment">// After -- TelephoneNumber merged back into Person</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Person</span> {
    <span class="hljs-keyword">private</span> String officeAreaCode;
    <span class="hljs-keyword">private</span> String officeNumber;
    String <span class="hljs-title function_">getAreaCode</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> officeAreaCode; }
}
</code></pre>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-13</footer>
</section>

<h2 id="b5-hide-delegate-temsilciyi-gizleme">B5. Hide Delegate (Temsilciyi Gizleme)</h2>
<p><strong>Nedir:</strong> Temsilciyi istemciden gizlemek için sunucu üzerinde bir delege metodu oluşturun.</p>
<p><strong>Problem:</strong> İstemci, A nesnesinden B nesnesini alır, ardından B nesnesinin bir metodunu çağırır (Demeter yasası ihlali: <code>a.getB().doSomething()</code>).</p>
<p><strong>Çözüm:</strong> A sınıfında, çağrıyı B'ye devreden bir metot oluşturun ve istemcinin B hakkında bilgi sahibi olmasını engelleyin.</p>
<p><strong>Ne zaman kullanılır:</strong> İstemciler nesne zincirleri arasında gezindiğinde (mesaj zincirleri).</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Temsilci yaygın olarak bilinen, kararlı bir API olduğunda.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Person</span> {
    Department department;
    Department <span class="hljs-title function_">getDepartment</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> department; }
}
<span class="hljs-comment">// Client code: person.getDepartment().getManager();</span>

<span class="hljs-comment">// After</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Person</span> {
    Department department;
    Person <span class="hljs-title function_">getManager</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> department.getManager(); }
}
<span class="hljs-comment">// Client code: person.getManager();</span>
</code></pre>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-13</footer>
</section>

<h2 id="b6-remove-middle-man-arac%C4%B1y%C4%B1-kald%C4%B1rma">B6. Remove Middle Man (Aracıyı Kaldırma)</h2>
<p><strong>Nedir:</strong> İstemcinin temsilciyi doğrudan çağırmasını sağlayın, yönlendirme metotlarını kaldırın.</p>
<p><strong>Problem:</strong> Bir sınıf, basitçe başka bir nesneye devreden çok fazla metoda sahiptir. Sunucu sınıf bir &quot;aracı&quot; haline gelmiştir.</p>
<p><strong>Çözüm:</strong> Aracı metotları silin ve istemcinin son nesneyi doğrudan çağırmasına izin verin.</p>
<p><strong>Ne zaman kullanılır:</strong> Bir sınıf basit delege metotlarla dolu olduğunda; Hide Delegate aşırıya kaçtığında.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Temsilciyi gizlemek kapsülleme için önemli olduğunda.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Person</span> {
    Department department;
    Person <span class="hljs-title function_">getManager</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> department.getManager(); }
    <span class="hljs-comment">// many more delegations...</span>
}
<span class="hljs-comment">// Client: person.getManager();</span>

<span class="hljs-comment">// After</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Person</span> {
    Department department;
    Department <span class="hljs-title function_">getDepartment</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> department; }
}
<span class="hljs-comment">// Client: person.getDepartment().getManager();</span>
</code></pre>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-13</footer>
</section>

<h2 id="b7-introduce-foreign-method-yabanc%C4%B1-metot-ekleme">B7. Introduce Foreign Method (Yabancı Metot Ekleme)</h2>
<p><strong>Nedir:</strong> Sunucu nesnesini argüman olarak geçirerek istemci sınıfa bir yardımcı metot ekleyin.</p>
<p><strong>Problem:</strong> Kullandığınız bir yardımcı sınıf, ihtiyacınız olan metodu içermiyor ve sınıfa metot ekleyemiyorsunuz.</p>
<p><strong>Çözüm:</strong> Metodu istemci sınıfta oluşturun ve yardımcı sınıfın bir örneğini ilk argüman olarak geçin.</p>
<p><strong>Ne zaman kullanılır:</strong> Değiştiremediğiniz bir sınıfta yalnızca bir veya iki ekstra metoda ihtiyacınız olduğunda.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Birden fazla metoda ihtiyacınız olduğunda -- bunun yerine Introduce Local Extension kullanın.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
<span class="hljs-type">Date</span> <span class="hljs-variable">newStart</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Date</span>(previousEnd.getYear(),
    previousEnd.getMonth(), previousEnd.getDate() + <span class="hljs-number">1</span>);

<span class="hljs-comment">// After</span>
<span class="hljs-type">Date</span> <span class="hljs-variable">newStart</span> <span class="hljs-operator">=</span> nextDay(previousEnd);

<span class="hljs-keyword">private</span> <span class="hljs-keyword">static</span> Date <span class="hljs-title function_">nextDay</span><span class="hljs-params">(Date date)</span> {
    <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Date</span>(date.getYear(), date.getMonth(), date.getDate() + <span class="hljs-number">1</span>);
}
</code></pre>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-13</footer>
</section>

<h2 id="b8-introduce-local-extension-yerel-uzant%C4%B1-ekleme">B8. Introduce Local Extension (Yerel Uzantı Ekleme)</h2>
<p><strong>Nedir:</strong> İhtiyacınız olan ekstra metotları içeren yeni bir sınıf (alt sınıf veya sarıcı) oluşturun.</p>
<p><strong>Problem:</strong> Bir yardımcı sınıf, ihtiyacınız olan birkaç metottan yoksun ve sınıfa metot ekleyemiyorsunuz.</p>
<p><strong>Çözüm:</strong> Ekstra metotları içeren yeni bir sınıf oluşturun. Bu uzantı sınıfını orijinalin bir alt sınıfı veya sarıcısı yapın.</p>
<p><strong>Ne zaman kullanılır:</strong> Değiştiremediğiniz bir sınıfta birden fazla ekstra metoda ihtiyacınız olduğunda.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Yalnızca bir veya iki metot gerektiğinde (bunun yerine Introduce Foreign Method kullanın).</p>

<h2 id="b8-introduce-local-extension-yerel-uzant%C4%B1-ekleme----%C3%B6rnek">B8. Introduce Local Extension (Yerel Uzantı Ekleme) -- Örnek</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Wrapper approach</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">MfDateWrapper</span> {
    <span class="hljs-keyword">private</span> Date original;

    <span class="hljs-keyword">public</span> <span class="hljs-title function_">MfDateWrapper</span><span class="hljs-params">(Date date)</span> {
        <span class="hljs-built_in">this</span>.original = date;
    }

    <span class="hljs-keyword">public</span> <span class="hljs-title function_">MfDateWrapper</span><span class="hljs-params">(String dateString)</span> {
        <span class="hljs-built_in">this</span>.original = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Date</span>(dateString);
    }

    <span class="hljs-keyword">public</span> Date <span class="hljs-title function_">nextDay</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Date</span>(original.getYear(), original.getMonth(), original.getDate() + <span class="hljs-number">1</span>);
    }

    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">dayOfYear</span><span class="hljs-params">()</span> {
        <span class="hljs-comment">// custom implementation</span>
        <span class="hljs-type">Calendar</span> <span class="hljs-variable">cal</span> <span class="hljs-operator">=</span> Calendar.getInstance();
        cal.setTime(original);
        <span class="hljs-keyword">return</span> cal.get(Calendar.DAY_OF_YEAR);
    }

    <span class="hljs-comment">// delegate all original methods...</span>
    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">getYear</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> original.getYear(); }
    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">getMonth</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> original.getMonth(); }
    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">getDate</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> original.getDate(); }
}
</code></pre>

<h3 id="moving-features-between-objects-%C3%B6zellikleri-nesneler-aras%C4%B1nda-ta%C5%9F%C4%B1ma-temel-noktalar">Moving Features Between Objects (Özellikleri Nesneler Arasında Taşıma): Temel Noktalar</h3>

<h2 id="c1-self-encapsulate-field-alan%C4%B1-kendi-i%CC%87%C3%A7inde-kaps%C3%BClleme">C1. Self Encapsulate Field (Alanı Kendi İçinde Kapsülleme)</h2>
<p><strong>Nedir:</strong> Sınıf içinde bile bir alana yalnızca getter ve setter metotları aracılığıyla erişin.</p>
<p><strong>Problem:</strong> Sınıf içinde özel bir alana doğrudan erişiyorsunuz, bu da alanın davranışını daha sonra değiştirmeyi zorlaştırıyor.</p>
<p><strong>Çözüm:</strong> Alan için bir getter ve setter oluşturun ve alana erişmek için yalnızca bunları kullanın.</p>
<p><strong>Ne zaman kullanılır:</strong> Alt sınıflarda alan erişimini geçersiz kılmak istediğinizde; doğrulama veya tembel başlatma eklemek istediğinizde.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Doğrudan erişim daha basit olduğunda ve dolaylı erişim için öngörülebilir bir ihtiyaç olmadığında.</p>

<p><strong>Ne zaman kullanılır:</strong> Birden fazla eşit nesne tutarlılık için aynı fiziksel nesne olması gerektiğinde.</p>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before -- each Order creates its own Customer</span>

<span class="hljs-keyword">class</span> <span class="hljs-title class_">Customer</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">static</span> Map&lt;String, Customer&gt; instances = <span class="hljs-keyword">new</span> <span class="hljs-title class_">HashMap</span>&lt;&gt;();

}

<h2 id="c4-change-reference-to-value-referans%C4%B1-de%C4%9Fere-%C3%A7evirme">C4. Change Reference to Value (Referansı Değere Çevirme)</h2>
<p><strong>Nedir:</strong> Bir referans nesnesini değer nesnesine dönüştürün.</p>
<p><strong>Problem:</strong> Küçük, değişmez ve yönetimi zahmetli bir referans nesneniz var (yaşam döngüsü yönetimi, kayıt defteri vb. gerektirir).</p>
<p><strong>Çözüm:</strong> Onu bir değer nesnesine dönüştürün. Değişmez yapın ve equals/hashCode metodlarını geçersiz kılın.</p>
<p><strong>Ne zaman kullanılır:</strong> Referans yönetimi maliyeti haklı görülmediğinde; nesne küçük ve nadiren değiştiğinde.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Nesnenin sistem genelinde paylaşılması ve değiştirilmesi gerektiğinde.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before -- Currency as reference object with registry</span>
<span class="hljs-type">Currency</span> <span class="hljs-variable">usd</span> <span class="hljs-operator">=</span> Currency.get(<span class="hljs-string">&quot;USD&quot;</span>);

<span class="hljs-comment">// After -- Currency as value object</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Currency</span> {
    <span class="hljs-keyword">private</span> String code;
    Currency(String code) { <span class="hljs-built_in">this</span>.code = code; }
    <span class="hljs-keyword">public</span> <span class="hljs-type">boolean</span> <span class="hljs-title function_">equals</span><span class="hljs-params">(Object o)</span> {
        <span class="hljs-keyword">return</span> o <span class="hljs-keyword">instanceof</span> Currency &amp;&amp; ((Currency)o).code.equals(code);
    }
    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">hashCode</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> code.hashCode(); }
}
</code></pre>

<h2 id="c5-replace-array-with-object-diziyi-nesne-ile-de%C4%9Fi%C5%9Ftirme">C5. Replace Array with Object (Diziyi Nesne ile Değiştirme)</h2>
<p><strong>Nedir:</strong> Farklı veri türleri içeren bir diziyi, isimlendirilmiş alanlara sahip bir nesneyle değiştirin.</p>
<p><strong>Problem:</strong> Elemanları farklı anlamlar taşıyan bir diziniz var (örn. <code>row[0]</code> isim, <code>row[1]</code> yaş).</p>
<p><strong>Çözüm:</strong> Diziyi, her eleman için bir alana sahip bir nesneyle değiştirin.</p>
<p><strong>Ne zaman kullanılır:</strong> Dizi elemanları farklı kavramları temsil ettiğinde.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Dizi gerçekten aynı türdeki elemanların bir listesini temsil ettiğinde.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
String[] row = <span class="hljs-keyword">new</span> <span class="hljs-title class_">String</span>[<span class="hljs-number">2</span>];
row[<span class="hljs-number">0</span>] = <span class="hljs-string">&quot;Liverpool&quot;</span>;
row[<span class="hljs-number">1</span>] = <span class="hljs-string">&quot;15&quot;</span>;

<span class="hljs-comment">// After</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Performance</span> {
    <span class="hljs-keyword">private</span> String name;
    <span class="hljs-keyword">private</span> <span class="hljs-type">int</span> wins;
    String <span class="hljs-title function_">getName</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> name; }
    <span class="hljs-type">int</span> <span class="hljs-title function_">getWins</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> wins; }
}
<span class="hljs-type">Performance</span> <span class="hljs-variable">row</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Performance</span>();
row.setName(<span class="hljs-string">&quot;Liverpool&quot;</span>);
row.setWins(<span class="hljs-number">15</span>);
</code></pre>

<h2 id="c6-duplicate-observed-data----%C3%B6nce--sonra">C6. Duplicate Observed Data -- Önce / Sonra</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before -- domain data trapped in GUI</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">IntervalWindow</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Frame</span> {

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// After -- domain object with observer</span>

    <span class="hljs-type">int</span> <span class="hljs-title function_">getLength</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> end - start; }

    <span class="hljs-keyword">void</span> <span class="hljs-title function_">setStart</span><span class="hljs-params">(<span class="hljs-type">int</span> start)</span> {

    <span class="hljs-keyword">void</span> <span class="hljs-title function_">setEnd</span><span class="hljs-params">(<span class="hljs-type">int</span> end)</span> {
        <span class="hljs-built_in">this</span>.end = end;
        notifyObservers();
    }
}

<span class="hljs-keyword">class</span> <span class="hljs-title class_">IntervalWindow</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Frame</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">Observer</span> {

}

<p><strong>Ne zaman kullanılır:</strong> Her iki nesnenin de birbirine gezinmesi gerektiğinde.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Çift yönlü bağlantı gereksiz karmaşıklık eklediğinde; mümkünse tek yönlü bağlantıları tercih edin.</p>

<h2 id="c7-change-unidirectional-to-bidirectional----%C3%B6rnek">C7. Change Unidirectional to Bidirectional -- Örnek</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before -- Order knows Customer, but Customer doesn&#x27;t know Orders</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Order</span> {
    <span class="hljs-keyword">private</span> Customer customer;
    Customer <span class="hljs-title function_">getCustomer</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> customer; }
    <span class="hljs-keyword">void</span> <span class="hljs-title function_">setCustomer</span><span class="hljs-params">(Customer customer)</span> { <span class="hljs-built_in">this</span>.customer = customer; }
}

<span class="hljs-comment">// After -- bidirectional association</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Order</span> {
    <span class="hljs-keyword">private</span> Customer customer;
    Customer <span class="hljs-title function_">getCustomer</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> customer; }
    <span class="hljs-keyword">void</span> <span class="hljs-title function_">setCustomer</span><span class="hljs-params">(Customer customer)</span> {
        <span class="hljs-keyword">if</span> (<span class="hljs-built_in">this</span>.customer != <span class="hljs-literal">null</span>) <span class="hljs-built_in">this</span>.customer.removeOrder(<span class="hljs-built_in">this</span>);
        <span class="hljs-built_in">this</span>.customer = customer;
        <span class="hljs-keyword">if</span> (customer != <span class="hljs-literal">null</span>) customer.addOrder(<span class="hljs-built_in">this</span>);
    }
}

<span class="hljs-keyword">class</span> <span class="hljs-title class_">Customer</span> {
    <span class="hljs-keyword">private</span> Set&lt;Order&gt; orders = <span class="hljs-keyword">new</span> <span class="hljs-title class_">HashSet</span>&lt;&gt;();
    Set&lt;Order&gt; <span class="hljs-title function_">getOrders</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> Collections.unmodifiableSet(orders); }
    <span class="hljs-keyword">void</span> <span class="hljs-title function_">addOrder</span><span class="hljs-params">(Order order)</span> { orders.add(order); }
    <span class="hljs-keyword">void</span> <span class="hljs-title function_">removeOrder</span><span class="hljs-params">(Order order)</span> { orders.remove(order); }
}
</code></pre>

<p><strong>Nedir:</strong> Çift yönlü ilişkinin gereksiz yönünü kaldırın.</p>
<p><strong>Problem:</strong> Çift yönlü bir ilişkiniz var ama bir sınıf artık diğerinin özelliklerine ihtiyaç duymuyor.</p>
<p><strong>Çözüm:</strong> İhtiyaç duyulmayan ilişki ucunu kaldırın.</p>
<p><strong>Ne zaman kullanılır:</strong> Bir sınıf artık diğerine referansı kullanmadığında; bağımlılık yapısını sadeleştirmek için.</p>

<span class="hljs-keyword">class</span> <span class="hljs-title class_">Order</span> {

}

<h2 id="c9-replace-magic-number-with-symbolic-constant-sihirli-say%C4%B1y%C4%B1-sembolik-sabit-ile-de%C4%9Fi%C5%9Ftirme">C9. Replace Magic Number with Symbolic Constant (Sihirli Sayıyı Sembolik Sabit ile Değiştirme)</h2>
<p><strong>Nedir:</strong> Sabit bir sayıyı isimlendirilmiş bir sabitle değiştirin.</p>
<p><strong>Problem:</strong> Kodunuz belirli bir anlama sahip bir sayı kullanıyor (örn. yerçekimi ivmesi için 9.81).</p>
<p><strong>Çözüm:</strong> Bu sayıyı, anlamını açıklayan okunabilir bir isme sahip bir sabitle değiştirin.</p>
<p><strong>Ne zaman kullanılır:</strong> Bir sayının anlamı bağlamdan anlaşılamıyorsa.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Sayı açıkça anlaşılır olduğunda (örn. basit bağlamlarda 0, 1).</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
<span class="hljs-type">double</span> <span class="hljs-title function_">potentialEnergy</span><span class="hljs-params">(<span class="hljs-type">double</span> mass, <span class="hljs-type">double</span> height)</span> {
    <span class="hljs-keyword">return</span> mass * <span class="hljs-number">9.81</span> * height;
}

<span class="hljs-comment">// After</span>
<span class="hljs-keyword">static</span> <span class="hljs-keyword">final</span> <span class="hljs-type">double</span> <span class="hljs-variable">GRAVITATIONAL_CONSTANT</span> <span class="hljs-operator">=</span> <span class="hljs-number">9.81</span>;

<span class="hljs-type">double</span> <span class="hljs-title function_">potentialEnergy</span><span class="hljs-params">(<span class="hljs-type">double</span> mass, <span class="hljs-type">double</span> height)</span> {
    <span class="hljs-keyword">return</span> mass * GRAVITATIONAL_CONSTANT * height;
}
</code></pre>

<h2 id="c10-encapsulate-field-alan%C4%B1-kaps%C3%BClleme">C10. Encapsulate Field (Alanı Kapsülleme)</h2>
<p><strong>Nedir:</strong> Genel bir alanı özel yapın ve erişim metotları sağlayın.</p>
<p><strong>Problem:</strong> Dış sınıflar tarafından doğrudan erişilen genel bir alanınız var.</p>
<p><strong>Çözüm:</strong> Alanı özel yapın ve getter ile setter metotları sağlayın.</p>
<p><strong>Ne zaman kullanılır:</strong> Her zaman -- genel alanlar kapsüllemeyi ihlal eder.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Kapsüllemenin önemli olmadığı basit veri transfer nesnelerinde (yine de iyi bir uygulamadır).</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Person</span> {
    <span class="hljs-keyword">public</span> String name;
}
<span class="hljs-comment">// Client: person.name = &quot;John&quot;;</span>

<span class="hljs-comment">// After</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Person</span> {
    <span class="hljs-keyword">private</span> String name;
    <span class="hljs-keyword">public</span> String <span class="hljs-title function_">getName</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> name; }
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">setName</span><span class="hljs-params">(String name)</span> { <span class="hljs-built_in">this</span>.name = name; }
}
<span class="hljs-comment">// Client: person.setName(&quot;John&quot;);</span>
</code></pre>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-13</footer>
</section>

<h2 id="c11-encapsulate-collection-koleksiyonu-kaps%C3%BClleme">C11. Encapsulate Collection (Koleksiyonu Kapsülleme)</h2>
<p><strong>Nedir:</strong> Koleksiyon getter metodunun salt okunur bir görünüm döndürmesini sağlayın ve ayrı ekleme/çıkarma metotları sağlayın.</p>
<p><strong>Problem:</strong> Bir metot doğrudan bir koleksiyon döndürüyor, bu da çağıranların sahip sınıf bilmeden değiştirmesine izin veriyor.</p>
<p><strong>Çözüm:</strong> Getter metodunun koleksiyonun salt okunur görünümünü veya kopyasını döndürmesini sağlayın ve ayrı ekleme/çıkarma metotları sağlayın.</p>
<p><strong>Ne zaman kullanılır:</strong> Dış kod, sahip sınıfın bilgisi olmadan bir koleksiyonu değiştirebildiğinde.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Koleksiyonun dış kod tarafından serbestce değiştirilmesi gerektiğinde (nadiren).</p>

<h2 id="c11-encapsulate-collection----%C3%B6nce--sonra">C11. Encapsulate Collection -- Önce / Sonra</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Course</span> {}
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Person</span> {
    <span class="hljs-keyword">private</span> List&lt;Course&gt; courses = <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;&gt;();
    List&lt;Course&gt; <span class="hljs-title function_">getCourses</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> courses; }
    <span class="hljs-keyword">void</span> <span class="hljs-title function_">setCourses</span><span class="hljs-params">(List&lt;Course&gt; courses)</span> { <span class="hljs-built_in">this</span>.courses = courses; }
}
<span class="hljs-comment">// Client: person.getCourses().add(new Course());  // bypasses Person</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// After</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Person</span> {
    <span class="hljs-keyword">private</span> List&lt;Course&gt; courses = <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;&gt;();

    List&lt;Course&gt; <span class="hljs-title function_">getCourses</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> Collections.unmodifiableList(courses);
    }

    <span class="hljs-keyword">void</span> <span class="hljs-title function_">addCourse</span><span class="hljs-params">(Course course)</span> {
        courses.add(course);
    }

    <span class="hljs-keyword">void</span> <span class="hljs-title function_">removeCourse</span><span class="hljs-params">(Course course)</span> {
        courses.remove(course);
    }
}
<span class="hljs-comment">// Client: person.addCourse(new Course());  // Person controls its collection</span>
</code></pre>

<h2 id="c13-replace-type-code-with-subclasses-t%C3%BCr-kodunu-alt-s%C4%B1n%C4%B1flarla-de%C4%9Fi%C5%9Ftirme">C13. Replace Type Code with Subclasses (Tür Kodunu Alt Sınıflarla Değiştirme)</h2>
<p><strong>Nedir:</strong> Tür kodunun her değeri için alt sınıflar oluşturun.</p>
<p><strong>Problem:</strong> Program davranışını doğrudan etkileyen kodlanmış bir türünüz var (örn. tür koduna göre değişen koşullar).</p>
<p><strong>Çözüm:</strong> Kodlanmış türün her değeri için alt sınıflar oluşturun. İlgili davranışları orijinal sınıftan bu alt sınıflara çıkarın. Kontrol akışı kodunu polimorfizm ile değiştirin.</p>
<p><strong>Ne zaman kullanılır:</strong> Tür kodu davranışı etkilediğinde ve tür oluşturulduktan sonra değişmediğinde.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Tür kodu çalışma zamanında değişebildiğinde (bunun yerine State/Strategy kullanın).</p>

<p><strong>Nedir:</strong> Tür kodunu State veya Strategy deseni kullanarak bir durum nesnesiyle değiştirin.</p>

<p><strong>Çözüm:</strong> Tür kodunu bir durum nesnesiyle değiştirin. State veya Strategy desenini kullanın.</p>
<p><strong>Ne zaman kullanılır:</strong> Tür kodu davranışı etkileyen VE tür nesnenin yaşam süresi boyunca değiştiğinde.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Tür oluşturulduktan sonra değişmez olduğunda (bunun yerine Alt Sınıflar kullanın).</p>

<h2 id="d1-decompose-conditional-ko%C5%9Fulu-ayr%C4%B1%C5%9Ft%C4%B1rma">D1. Decompose Conditional (Koşulu Ayrıştırma)</h2>
<p><strong>Nedir:</strong> Karmaşık koşul parçalarını ayrı, iyi isimlendirilmiş metotlara çıkarın.</p>
<p><strong>Problem:</strong> Karmaşık bir koşulunuz (if-then-else veya switch) var ve koşul, then-dalı ve else-dalı anlaşılması zor.</p>
<p><strong>Çözüm:</strong> Koşulun karmaşık parçalarını ayrı metotlara ayırın: koşul, then-dalı ve else-dalı.</p>
<p><strong>Ne zaman kullanılır:</strong> Koşullu mantık bir bakışta anlaşılması güç hale geldiğinde.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Koşul zaten basit ve kendi kendini açıklayan olduğunda.</p>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
<span class="hljs-type">double</span> <span class="hljs-title function_">calculateCharge</span><span class="hljs-params">(Date date, <span class="hljs-type">int</span> quantity)</span> {
    <span class="hljs-type">double</span> charge;
    <span class="hljs-keyword">if</span> (date.before(SUMMER_START) || date.after(SUMMER_END)) {
        charge = quantity * winterRate + winterServiceCharge;
    } <span class="hljs-keyword">else</span> {
        charge = quantity * summerRate;
    }
    <span class="hljs-keyword">return</span> charge;
}
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// After</span>
<span class="hljs-type">double</span> <span class="hljs-title function_">calculateCharge</span><span class="hljs-params">(Date date, <span class="hljs-type">int</span> quantity)</span> {
    <span class="hljs-keyword">if</span> (isNotSummer(date)) {
        <span class="hljs-keyword">return</span> winterCharge(quantity);
    }
    <span class="hljs-keyword">return</span> summerCharge(quantity);
}

<span class="hljs-type">boolean</span> <span class="hljs-title function_">isNotSummer</span><span class="hljs-params">(Date date)</span> {
    <span class="hljs-keyword">return</span> date.before(SUMMER_START) || date.after(SUMMER_END);
}

<span class="hljs-type">double</span> <span class="hljs-title function_">winterCharge</span><span class="hljs-params">(<span class="hljs-type">int</span> quantity)</span> {
    <span class="hljs-keyword">return</span> quantity * winterRate + winterServiceCharge;
}

<span class="hljs-type">double</span> <span class="hljs-title function_">summerCharge</span><span class="hljs-params">(<span class="hljs-type">int</span> quantity)</span> {
    <span class="hljs-keyword">return</span> quantity * summerRate;
}
</code></pre>

<p><strong>Ne zaman kullanılır:</strong> Birden fazla koşul aynı sonuca yol açtığında ve mantıksal olarak birleştirilebildiğinde.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Koşullar gerçekten bağımsız kontroller olup yalnızca tesadüfen aynı sonucu döndürdüğünde.</p>

<p><strong>Nedir:</strong> Tüm dallarda görünen aynı kodu koşulun dışına taşıyın.</p>
<p><strong>Problem:</strong> Bir koşulun tüm dallarında aynı kod bulunuyor.</p>
<p><strong>Çözüm:</strong> Tekrarlanan kodu koşulun dışına taşıyın.</p>
<p><strong>Ne zaman kullanılır:</strong> Aynı ifade her dalın başında veya sonunda göründüğünde.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Kod yalnızca benzer görünüp her dalda anlamsal olarak farklı olduğunda.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>

    total = price * <span class="hljs-number">0.98</span>;
    send();
}

<span class="hljs-comment">// After</span>
<span class="hljs-keyword">if</span> (isSpecialDeal()) {
    total = price * <span class="hljs-number">0.95</span>;
} <span class="hljs-keyword">else</span> {
    total = price * <span class="hljs-number">0.98</span>;
}
send();
</code></pre>

<h2 id="d8-introduce-assertion-onaylama-ekleme">D8. Introduce Assertion (Onaylama Ekleme)</h2>
<p><strong>Nedir:</strong> Program durumu hakkındaki varsayımları açık onaylama kontrolleriyle değiştirin.</p>
<p><strong>Problem:</strong> Bir kod bölümü, nesnenin veya parametre değerlerinin mevcut durumu hakkında varsayım yapıyor ama bunu zorlamamış.</p>
<p><strong>Çözüm:</strong> Bu varsayımları belirli onaylama kontrolleriyle değiştirin.</p>
<p><strong>Ne zaman kullanılır:</strong> Gerekli ön koşulları belgelemek ve zorlamak gerektiğinde; örtük varsayımları açık hale getirmek için.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Genel API'lerde girdi doğrulama için onaylama kullanmayın (bunun yerine istisnalar kullanın). Onaylamalar programcı hataları içindir, kullanıcı hataları için değil.</p>

<h2 id="d8-introduce-assertion----%C3%B6nce--sonra">D8. Introduce Assertion -- Önce / Sonra</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
<span class="hljs-type">double</span> <span class="hljs-title function_">getExpenseLimit</span><span class="hljs-params">()</span> {
    <span class="hljs-comment">// should have either expense limit or a primary project</span>
    <span class="hljs-keyword">return</span> (expenseLimit != NULL_EXPENSE)
        ? expenseLimit
        : primaryProject.getMemberExpenseLimit();
}
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// After</span>
<span class="hljs-type">double</span> <span class="hljs-title function_">getExpenseLimit</span><span class="hljs-params">()</span> {
    <span class="hljs-keyword">assert</span> (expenseLimit != NULL_EXPENSE || primaryProject != <span class="hljs-literal">null</span>)
        : <span class="hljs-string">&quot;Must have either expense limit or primary project&quot;</span>;

    <span class="hljs-keyword">return</span> (expenseLimit != NULL_EXPENSE)
        ? expenseLimit
        : primaryProject.getMemberExpenseLimit();
}
</code></pre>

<p>Bu teknikler metot arayüzlerini daha basit ve anlaşılır hale getirir. Metot adlandırma, parametre listeleri ve dönüş anlam bilgisini ele alırlar.</p>

<li>Remove Setting Method (Setter Metodunu Kaldırma)</li>
<li>Hide Method (Metodu Gizleme)</li>
<li>Replace Constructor with Factory Method (Yapıcıyı Fabrika Metoduyla Değiştirme)</li>
<li>Replace Error Code with Exception (Hata Kodunu İstisna ile Değiştirme)</li>
<li>Replace Exception with Test (İstisna'yı Test ile Değiştirme)</li>

<h2 id="e1-rename-method-metodu-yeniden-adland%C4%B1rma">E1. Rename Method (Metodu Yeniden Adlandırma)</h2>
<p><strong>Nedir:</strong> Bir metoda amacını ortaya koyan bir isim verin.</p>
<p><strong>Problem:</strong> Bir metodun adı, metodun ne yaptığını açıklamıyor.</p>
<p><strong>Çözüm:</strong> Metodu daha açıklayıcı bir isimle yeniden adlandırın.</p>
<p><strong>Ne zaman kullanılır:</strong> Metot adı yanıltıcı, kısaltılmış veya belirsiz olduğunda.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Metot adı zaten açık ve iyi anlaşılır olduğunda.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Customer</span> {
    String <span class="hljs-title function_">getsnm</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> surname; }
}

<span class="hljs-comment">// After</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Customer</span> {
    String <span class="hljs-title function_">getSurname</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> surname; }
}
</code></pre>

<h2 id="e2-add-parameter-parametre-ekleme">E2. Add Parameter (Parametre Ekleme)</h2>
<p><strong>Nedir:</strong> Ek veriye ihtiyacı olan bir metoda yeni bir parametre ekleyin.</p>
<p><strong>Problem:</strong> Bir metot belirli eylemleri gerçekleştirmek için yeterli veriye sahip değil.</p>
<p><strong>Çözüm:</strong> Gerekli veriyi geçirmek için yeni bir parametre oluşturun.</p>
<p><strong>Ne zaman kullanılır:</strong> Bir metot işini tamamlamak için ek bilgiye ihtiyaç duyduğunda.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Veri mevcut bir parametreden veya nesnenin kendisinden elde edilebildiğinde. Çok fazla parametre ekliyorsanız Introduce Parameter Object düşünün.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Customer</span> {

}

<span class="hljs-comment">// After</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Customer</span> {
    Contact <span class="hljs-title function_">getContact</span><span class="hljs-params">(Date date)</span> { ... }
}
</code></pre>

<h2 id="e3-remove-parameter-parametre-kald%C4%B1rma">E3. Remove Parameter (Parametre Kaldırma)</h2>
<p><strong>Nedir:</strong> Kullanılmayan bir parametreyi metottan kaldırın.</p>
<p><strong>Problem:</strong> Bir parametre metodun gövdesinde kullanılmıyor.</p>
<p><strong>Çözüm:</strong> Kullanılmayan parametreyi kaldırın.</p>
<p><strong>Ne zaman kullanılır:</strong> Yeniden yapılandırmadan sonra bir parametre artık gerekli olmadığında.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Parametre alt sınıflardaki geçersiz kılan metotlar tarafından kullanıldığında, temel sınıf kullanmasa bile.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Customer</span> {
    Contact <span class="hljs-title function_">getContact</span><span class="hljs-params">(Date date)</span> {
        <span class="hljs-comment">// date is never used</span>
        <span class="hljs-keyword">return</span> contact;
    }
}

<span class="hljs-comment">// After</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Customer</span> {
    Contact <span class="hljs-title function_">getContact</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> contact;
    }
}
</code></pre>

<p><strong>Nedir:</strong> Değer döndüren ve nesne durumunu değiştiren bir metodu iki metoda bölün.</p>
<p><strong>Problem:</strong> Bir değer döndüren ama aynı zamanda nesne içinde bir şey değiştiren (yan etki) bir metodunuz var. Çağıranlar yan etkiyi beklemeyebilir.</p>
<p><strong>Çözüm:</strong> Metodu iki ayrı metoda bölün. Biri değeri döndürür (sorgu), diğeri değişikliği yapar (komut).</p>
<p><strong>Ne zaman kullanılır:</strong> Sorguları ve komutları karıştırmak beklenmeyen yan etkilere yol açtığında.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Birleşik işlem atomik olduğunda ve bölmek eşzamanlılık sorunlarına neden olacağında.</p>

<p><strong>Ne zaman kullanılır:</strong> Yinelenen metotlar yalnızca sabitler veya benzer değerlerde farklılaştığında.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Metotların farklılaşan değerlerin ötesinde önemli ölçüde farklı mantığı olduğunda.</p>

<h2 id="e6-replace-parameter-with-explicit-methods-parametreyi-a%C3%A7%C4%B1k-metotlarla-de%C4%9Fi%C5%9Ftirme">E6. Replace Parameter with Explicit Methods (Parametreyi Açık Metotlarla Değiştirme)</h2>
<p><strong>Nedir:</strong> Davranışı seçmek için parametre kullanan bir metodu ayrı metotlara bölün.</p>
<p><strong>Problem:</strong> Bir metot parçalara bölünmüştür ve her biri bir parametrenin değerine bağlı olarak çalışır (örn. <code>setValue(&quot;height&quot;, 10)</code>).</p>
<p><strong>Çözüm:</strong> Metodun ayrı parçalarını kendi metotlarına çıkarın.</p>
<p><strong>Ne zaman kullanılır:</strong> Bir parametre yalnızca farklı davranışlar arasında seçim yapmak için kullanıldığında.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Parametre değerleri derleme zamanında bilinmediğinde.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
<span class="hljs-keyword">void</span> <span class="hljs-title function_">setValue</span><span class="hljs-params">(String name, <span class="hljs-type">int</span> value)</span> {
    <span class="hljs-keyword">if</span> (name.equals(<span class="hljs-string">&quot;height&quot;</span>)) { height = value; }
    <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (name.equals(<span class="hljs-string">&quot;width&quot;</span>)) { width = value; }
}

<span class="hljs-comment">// After</span>
<span class="hljs-keyword">void</span> <span class="hljs-title function_">setHeight</span><span class="hljs-params">(<span class="hljs-type">int</span> value)</span> { height = value; }
<span class="hljs-keyword">void</span> <span class="hljs-title function_">setWidth</span><span class="hljs-params">(<span class="hljs-type">int</span> value)</span> { width = value; }
</code></pre>

<h2 id="e7-preserve-whole-object-nesnenin-tamam%C4%B1n%C4%B1-koruma">E7. Preserve Whole Object (Nesnenin Tamamını Koruma)</h2>
<p><strong>Nedir:</strong> Birkaç değeri çıkarıp tek tek geçirmek yerine nesnenin tamamını geçin.</p>

<p><strong>Çözüm:</strong> Bunun yerine nesnenin tamamını geçmeyi deneyin.</p>
<p><strong>Ne zaman kullanılır:</strong> Birkaç parametre aynı nesneden geldiğinde; gelecekteki değişiklikler aynı nesneden daha fazla veri gerektirebileceğinde.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Çağrılan metot nesnenin tamamına bağımlı olmaması gerektiğinde (bağımlılıktan kaçınmak için); yalnızca bir değer gerektiğinde.</p>

<h2 id="e8-replace-parameter-with-method-call-parametreyi-metot-%C3%A7a%C4%9Fr%C4%B1s%C4%B1yla-de%C4%9Fi%C5%9Ftirme">E8. Replace Parameter with Method Call (Parametreyi Metot Çağrısıyla Değiştirme)</h2>

    <span class="hljs-keyword">return</span> basePrice - getDiscount();

<h2 id="e10-remove-setting-method-setter-metodunu-kald%C4%B1rma">E10. Remove Setting Method (Setter Metodunu Kaldırma)</h2>

<p><strong>Çözüm:</strong> Setter metodunu kaldırın. Alanı yalnızca yapıcıda ayarlayın.</p>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>

    String <span class="hljs-title function_">getId</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> id; }
}

<p><strong>Ne zaman kullanılır:</strong> Bir metodun görünürlüğü gerekenden geniş olduğunda.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Metot, dış istemcilerin bağımlı olduğu genel bir API'nin parçası olduğunda.</p>

<h2 id="e13-replace-error-code-with-exception-hata-kodunu-i%CC%87stisna-ile-de%C4%9Fi%C5%9Ftirme">E13. Replace Error Code with Exception (Hata Kodunu İstisna ile Değiştirme)</h2>
<p><strong>Nedir:</strong> Özel bir hata kodu değeri döndürmek yerine istisna fırlatın.</p>
<p><strong>Problem:</strong> Bir metot, bir hatayı belirten özel bir değer döndürüyor (-1 veya null gibi).</p>
<p><strong>Çözüm:</strong> Bunun yerine bir istisna fırlatın.</p>
<p><strong>Ne zaman kullanılır:</strong> Hata koşulları normal akışı kesmeli ve çağıranlar tarafından açıkça işlenmelidir.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> &quot;Hata&quot; aslında normal, beklenen bir sonuç olduğunda (dönüş değeri veya Optional kullanın).</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
<span class="hljs-type">int</span> <span class="hljs-title function_">withdraw</span><span class="hljs-params">(<span class="hljs-type">int</span> amount)</span> {
    <span class="hljs-keyword">if</span> (amount &gt; balance) <span class="hljs-keyword">return</span> -<span class="hljs-number">1</span>;
    balance -= amount;
    <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}

<span class="hljs-comment">// After</span>
<span class="hljs-keyword">void</span> <span class="hljs-title function_">withdraw</span><span class="hljs-params">(<span class="hljs-type">int</span> amount)</span> {
    <span class="hljs-keyword">if</span> (amount &gt; balance) {
        <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">InsufficientFundsException</span>();
    }
    balance -= amount;
}
</code></pre>

<h2 id="e14-replace-exception-with-test-i%CC%87stisnay%C4%B1-test-ile-de%C4%9Fi%C5%9Ftirme">E14. Replace Exception with Test (İstisna'yı Test ile Değiştirme)</h2>
<p><strong>Nedir:</strong> Bir istisnayı koşullu bir testle değiştirin.</p>
<p><strong>Problem:</strong> Basit bir testin işe yaracağı bir yerde istisna fırlatıyorsunuz. İstisnalar beklenen kontrol akışı için kullanılıyor.</p>
<p><strong>Çözüm:</strong> İstisna'yı koşul testiyle değiştirin.</p>
<p><strong>Ne zaman kullanılır:</strong> İstisnalar tahmin edilebilir, istisnai olmayan durumlar için kullanıldığında.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Koşul gerçekten istisnai olup önceden kontrol edilemediğinde.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
<span class="hljs-type">double</span> <span class="hljs-title function_">getValueForPeriod</span><span class="hljs-params">(<span class="hljs-type">int</span> periodNumber)</span> {
    <span class="hljs-keyword">try</span> {
        <span class="hljs-keyword">return</span> values[periodNumber];
    } <span class="hljs-keyword">catch</span> (ArrayIndexOutOfBoundsException e) {
        <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
    }
}

<span class="hljs-comment">// After</span>
<span class="hljs-type">double</span> <span class="hljs-title function_">getValueForPeriod</span><span class="hljs-params">(<span class="hljs-type">int</span> periodNumber)</span> {
    <span class="hljs-keyword">if</span> (periodNumber &gt;= values.length) <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
    <span class="hljs-keyword">return</span> values[periodNumber];
}
</code></pre>

<h2 id="f1-pull-up-field-alan%C4%B1-yukar%C4%B1-%C3%A7ekme">F1. Pull Up Field (Alanı Yukarı Çekme)</h2>
<p><strong>Nedir:</strong> Bir alanı alt sınıflardan üst sınıfa taşıyın.</p>
<p><strong>Problem:</strong> İki veya daha fazla alt sınıf aynı alana sahip.</p>
<p><strong>Çözüm:</strong> Alanı alt sınıflardan kaldırın ve üst sınıfa taşıyın.</p>
<p><strong>Ne zaman kullanılır:</strong> Birden fazla alt sınıf aynı alanı bildirdiğinde.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Alanlar yalnızca benzer görünüp her alt sınıfta farklı kavramları temsil ettiğinde.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Salesman</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Employee</span> {
    <span class="hljs-keyword">private</span> String name;
}
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Engineer</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Employee</span> {

}

<span class="hljs-comment">// After</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Employee</span> {
    <span class="hljs-keyword">protected</span> String name;
}
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Salesman</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Employee</span> { }
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Engineer</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Employee</span> { }
</code></pre>

<h2 id="f2-pull-up-method-metodu-yukar%C4%B1-%C3%A7ekme">F2. Pull Up Method (Metodu Yukarı Çekme)</h2>
<p><strong>Nedir:</strong> Aynı metotları alt sınıflardan üst sınıfa taşıyın.</p>
<p><strong>Problem:</strong> Alt sınıflarınız benzer iş yapan metotlara sahip.</p>
<p><strong>Çözüm:</strong> Metotları aynı hale getirin ve ardından ilgili üst sınıfa taşıyın.</p>
<p><strong>Ne zaman kullanılır:</strong> Alt sınıflar aynı veya neredeyse aynı metotları uyguladığında.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Metotlar benzer adlara rağmen gerçekten farklı olduğunda.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>

}

<span class="hljs-comment">// After</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Employee</span> {

}
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Salesman</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Employee</span> { }

<p><strong>Ne zaman kullanılır:</strong> Yapıcı mantığı hiyerarşi genelinde tekrarlandığında.</p>

<h2 id="f4-push-down-method-metodu-a%C5%9Fa%C4%9F%C4%B1-i%CC%87tme">F4. Push Down Method (Metodu Aşağı İtme)</h2>
<p><strong>Nedir:</strong> Bir metodu üst sınıftan, ona ihtiyacı olan belirli alt sınıflara taşıyın.</p>
<p><strong>Problem:</strong> Üst sınıfta uygulanan davranış yalnızca bir (veya birkaç) alt sınıf tarafından kullanılıyor.</p>
<p><strong>Çözüm:</strong> Metodu bu belirli alt sınıflara taşıyın.</p>
<p><strong>Ne zaman kullanılır:</strong> Bir metot yalnızca alt sınıfların bir alt kümesiyle ilgili olduğunda.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Metot çoğu veya tüm alt sınıflar tarafından kullanıldığında.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Employee</span> {
    <span class="hljs-type">int</span> <span class="hljs-title function_">getQuota</span><span class="hljs-params">()</span> { ... } <span class="hljs-comment">// only relevant for Salesman</span>
}
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Engineer</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Employee</span> { }
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Salesman</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Employee</span> { }

<span class="hljs-comment">// After</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Employee</span> { }
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Engineer</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Employee</span> { }
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Salesman</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Employee</span> {
    <span class="hljs-type">int</span> <span class="hljs-title function_">getQuota</span><span class="hljs-params">()</span> { ... }
}
</code></pre>

<p><strong>Nedir:</strong> Bir alanı üst sınıftan, ona ihtiyacı olan belirli alt sınıflara taşıyın.</p>
<p><strong>Problem:</strong> Bir alan yalnızca birkaç alt sınıfta kullanılıyor, tüm hiyerarşi genelinde değil.</p>
<p><strong>Çözüm:</strong> Alanı bu belirli alt sınıflara taşıyın.</p>
<p><strong>Ne zaman kullanılır:</strong> Tüm alt sınıflar aynı veriye ihtiyaç duymadığında.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Alan çoğu alt sınıf tarafından kullanıldığında.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>

}

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">JobItem</span> {

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// After</span>

<h2 id="f7-extract-superclass-%C3%BCst-s%C4%B1n%C4%B1f-%C3%A7%C4%B1karma">F7. Extract Superclass (Üst Sınıf Çıkarma)</h2>
<p><strong>Nedir:</strong> Ortak alanlar ve metotlara sahip iki sınıf için paylaşılan bir üst sınıf oluşturun.</p>
<p><strong>Problem:</strong> Ortak alanlar ve metotlara sahip iki sınıfınız var.</p>
<p><strong>Çözüm:</strong> Onlar için bir üst sınıf oluşturun ve tüm ortak alanları ve metotları üst sınıfa taşıyın.</p>
<p><strong>Ne zaman kullanılır:</strong> Birden fazla sınıf önemli işlevleri paylaştığında.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Benzerlik tesadüfi olup gerçek bir &quot;şu-dur&quot; ilişkisini temsil etmediğinde.</p>

<p><strong>Ne zaman kullanılır:</strong> Alt sınıflar bir algoritma yapısını paylaşıp ayrıntılarda farklılaştığında.</p>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">TextStatement</span> {
    String <span class="hljs-title function_">value</span><span class="hljs-params">(Customer c)</span> {

            result += r.getMovie().getTitle() + <span class="hljs-string">&quot;: &quot;</span> + r.getCharge() + <span class="hljs-string">&quot;\n&quot;</span>;

}
<span class="hljs-keyword">class</span> <span class="hljs-title class_">HtmlStatement</span> {

        <span class="hljs-type">String</span> <span class="hljs-variable">result</span> <span class="hljs-operator">=</span> <span class="hljs-string">&quot;&lt;h1&gt;Statement for &quot;</span> + c.getName() + <span class="hljs-string">&quot;&lt;/h1&gt;&quot;</span>;
        <span class="hljs-keyword">for</span> (Rental r : c.getRentals()) {
            result += <span class="hljs-string">&quot;&lt;p&gt;&quot;</span> + r.getMovie().getTitle() + <span class="hljs-string">&quot;: &quot;</span> + r.getCharge() + <span class="hljs-string">&quot;&lt;/p&gt;&quot;</span>;

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// After -- Template Method pattern</span>

<h2 id="f11-replace-inheritance-with-delegation-kal%C4%B1t%C4%B1m%C4%B1-delegasyon-ile-de%C4%9Fi%C5%9Ftirme">F11. Replace Inheritance with Delegation (Kalıtımı Delegasyon ile Değiştirme)</h2>
<p><strong>Nedir:</strong> Üst sınıf için bir alan oluşturun, metotları ona devrdin ve kalıtımı kaldırın.</p>
<p><strong>Problem:</strong> Bir alt sınıf, üst sınıfının metotlarının yalnızca bir bölümünü kullanıyor (veya üst sınıfın verisini miras almak mümkün değil). Kalıtım gerçek bir &quot;şu-dur&quot; ilişkisini temsil etmiyor.</p>
<p><strong>Çözüm:</strong> Bir alan oluşturun ve içine bir üst sınıf nesnesi yerleştirin, metotları üst sınıf nesnesine devredin ve kalıtımdan kurtulun.</p>
<p><strong>Ne zaman kullanılır:</strong> Bir alt sınıf Liskov Yerine Geçme Prensibini ihlal ettiğinde; yalnızca bazı miras alınan metotları kullandığında.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Kalıtım gerçekten bir &quot;şu-dur&quot; ilişkisini temsil ettiğinde.</p>

<h2 id="f11-replace-inheritance-with-delegation----%C3%B6nce--sonra">F11. Replace Inheritance with Delegation -- Önce / Sonra</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before -- MyStack inherits from Vector but is not a true Vector</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">MyStack</span>&lt;E&gt; <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Vector</span>&lt;E&gt; {
    <span class="hljs-keyword">public</span> E <span class="hljs-title function_">push</span><span class="hljs-params">(E item)</span> {
        addElement(item);
        <span class="hljs-keyword">return</span> item;
    }
    <span class="hljs-keyword">public</span> E <span class="hljs-title function_">pop</span><span class="hljs-params">()</span> {
        <span class="hljs-type">E</span> <span class="hljs-variable">obj</span> <span class="hljs-operator">=</span> peek();
        removeElementAt(size() - <span class="hljs-number">1</span>);
        <span class="hljs-keyword">return</span> obj;
    }
    <span class="hljs-keyword">public</span> E <span class="hljs-title function_">peek</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> elementAt(size() - <span class="hljs-number">1</span>);
    }
    <span class="hljs-comment">// Problem: clients can call insertElementAt(), removeElementAt() etc.</span>
}
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// After -- delegation instead of inheritance</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">MyStack</span>&lt;E&gt; {
    <span class="hljs-keyword">private</span> Vector&lt;E&gt; vector = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Vector</span>&lt;&gt;();

    <span class="hljs-keyword">public</span> E <span class="hljs-title function_">push</span><span class="hljs-params">(E item)</span> {
        vector.addElement(item);
        <span class="hljs-keyword">return</span> item;
    }
    <span class="hljs-keyword">public</span> E <span class="hljs-title function_">pop</span><span class="hljs-params">()</span> {
        <span class="hljs-type">E</span> <span class="hljs-variable">obj</span> <span class="hljs-operator">=</span> peek();
        vector.removeElementAt(vector.size() - <span class="hljs-number">1</span>);
        <span class="hljs-keyword">return</span> obj;
    }
    <span class="hljs-keyword">public</span> E <span class="hljs-title function_">peek</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> vector.elementAt(vector.size() - <span class="hljs-number">1</span>);
    }
    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">size</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> vector.size(); }
    <span class="hljs-keyword">public</span> <span class="hljs-type">boolean</span> <span class="hljs-title function_">isEmpty</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> vector.isEmpty(); }
}
</code></pre>

<h2 id="f12-replace-delegation-with-inheritance-delegasyonu-kal%C4%B1t%C4%B1m-ile-de%C4%9Fi%C5%9Ftirme">F12. Replace Delegation with Inheritance (Delegasyonu Kalıtım ile Değiştirme)</h2>
<p><strong>Nedir:</strong> Delege eden sınıfı, temsilciden miras almasını sağlayarak kalıp delegasyonu ortadan kaldırın.</p>
<p><strong>Problem:</strong> Bir sınıf, başka bir sınıfın tüm metotlarına delege eden birçok basit metot içeriyor.</p>
<p><strong>Çözüm:</strong> Sınıfı temsilcinin miras alıcısı yapın, bu da delege eden metotları gereksiz kılar.</p>
<p><strong>Ne zaman kullanılır:</strong> Sınıf metotların çoğunu başka bir sınıfa devrettiğinde ve ilişki gerçekten &quot;şu-dur&quot; olduğunda.</p>
<p><strong>Ne zaman KULLANILMAZ:</strong> Temsilci birden fazla sınıf tarafından kullanıldığında (paylaşılan durum); temsilci değişken olup yalnızca kısmi davranış istediğinizde.</p>

<h2 id="f12-replace-delegation-with-inheritance----%C3%B6nce--sonra">F12. Replace Delegation with Inheritance -- Önce / Sonra</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Before -- excessive delegation</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Employee</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-type">Person</span> <span class="hljs-variable">person</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Person</span>();

    String <span class="hljs-title function_">getName</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> person.getName(); }
    <span class="hljs-keyword">void</span> <span class="hljs-title function_">setName</span><span class="hljs-params">(String name)</span> { person.setName(name); }
    String <span class="hljs-title function_">getAddress</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> person.getAddress(); }
    <span class="hljs-keyword">void</span> <span class="hljs-title function_">setAddress</span><span class="hljs-params">(String addr)</span> { person.setAddress(addr); }
    String <span class="hljs-title function_">getPhone</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> person.getPhone(); }
    <span class="hljs-keyword">void</span> <span class="hljs-title function_">setPhone</span><span class="hljs-params">(String phone)</span> { person.setPhone(phone); }
    <span class="hljs-comment">// ... many more delegations</span>
}
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// After -- inheritance eliminates boilerplate</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Employee</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Person</span> {
    <span class="hljs-comment">// getName(), setName(), getAddress(), etc.</span>
    <span class="hljs-comment">// are all inherited automatically</span>
    <span class="hljs-keyword">private</span> String employeeId;
    <span class="hljs-keyword">private</span> <span class="hljs-type">double</span> salary;

    String <span class="hljs-title function_">getEmployeeId</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> employeeId; }
    <span class="hljs-type">double</span> <span class="hljs-title function_">getSalary</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> salary; }
}
</code></pre>

<td>Karmaşık switch operatörleri veya if-else zincirleri</td>
<td>Decompose Conditional, Replace Conditional with Polymorphism, Replace Type Code with Subclasses, Replace Type Code with State/Strategy, Replace Parameter with Explicit Methods, Introduce Null Object</td>
</tr>
<tr>
<td><strong>Temporary Field (Geçici Alan)</strong></td>
<td>Değerlerini yalnızca belirli koşullar altında alan geçici alanlar</td>
<td>Extract Class, Introduce Null Object</td>
</tr>
<tr>
<td><strong>Refused Bequest (Reddedilen Miras)</strong></td>
<td>Bir alt sınıf, ebeveynlerinden miras alınan metot ve özelliklerin yalnızca bir kısmını kullanıyor</td>
<td>Replace Inheritance with Delegation, Extract Subclass</td>
</tr>
<tr>
<td><strong>Alternative Classes with Different Interfaces (Farklı Arayüzlere Sahip Alternatif Sınıflar)</strong></td>
<td>İki sınıf aynı işlevleri gerçekleştiriyor ancak farklı metot adlarına sahip</td>
<td>Rename Method, Extract Superclass, Move Method</td>
</tr>
</tbody>
</table>

</section>

<h2 id="kod-kokusu-ve-yeniden-yap%C4%B1land%C4%B1rma-de%C4%9Fi%C5%9Fiklik-engelleyiciler">Kod Kokusu ve Yeniden Yapılandırma: Değişiklik Engelleyiciler</h2>
<table>
<thead>
<tr>
<th>Kod Kokusu</th>
<th>Açıklama</th>
<th>Önerilen Yeniden Yapılandırmalar</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Divergent Change (İraksak Değişiklik)</strong></td>
<td>Bir sınıfta değişiklik yaptığınızda birbirleriyle ilgisiz birçok metodu değiştirmek zorunda kalıyorsunuz</td>
<td>Extract Class</td>
</tr>
<tr>
<td><strong>Shotgun Surgery (Saçma Ameliyat)</strong></td>
<td>Herhangi bir değişiklik yapmak birçok farklı sınıfta birçok küçük değişiklik gerektiriyor</td>
<td>Move Method, Move Field, Inline Class</td>
</tr>
<tr>
<td><strong>Parallel Inheritance Hierarchies (Paralel Kalıtım Hiyerarşileri)</strong></td>
<td>Bir sınıf için alt sınıf oluşturduğunuzda, başka bir sınıf için de alt sınıf oluşturmanız gerekiyor</td>
<td>Move Method, Move Field</td>
</tr>
</tbody>
</table>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-13</footer>

<h2 id="kod-kokusu-ve-yeniden-yap%C4%B1land%C4%B1rma-vazge%C3%A7ilebilirler">Kod Kokusu ve Yeniden Yapılandırma: Vazgeçilebilirler</h2>
<table>
<thead>
<tr>
<th>Kod Kokusu</th>
<th>Açıklama</th>
<th>Önerilen Yeniden Yapılandırmalar</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Comments (Yorumlar)</strong></td>
<td>Bir metot açıklayıcı yorumlarla dolu</td>
<td>Extract Variable, Extract Method, Rename Method, Introduce Assertion</td>
</tr>
<tr>
<td><strong>Duplicate Code (Tekrarlanan Kod)</strong></td>
<td>İki kod parçası neredeyse aynı görünüyor</td>
<td>Extract Method, Pull Up Method, Form Template Method, Extract Class</td>
</tr>
<tr>
<td><strong>Lazy Class (Tembel Sınıf)</strong></td>
<td>Bir sınıf varlığını haklı çıkarmak için çok az şey yapıyor</td>
<td>Inline Class, Collapse Hierarchy</td>
</tr>
<tr>
<td><strong>Data Class (Veri Sınıfı)</strong></td>
<td>Bir sınıf yalnızca alanlar ve basit erişimçiler içeriyor</td>
<td>Encapsulate Field, Encapsulate Collection, Move Method, Extract Method, Remove Setting Method, Hide Method</td>
</tr>
<tr>
<td><strong>Dead Code (Ölü Kod)</strong></td>
<td>Hiçbir yerde kullanılmayan bir değişken, parametre, alan, metot veya sınıf</td>
<td>Kullanılmayan kodu silin (Inline Class, Collapse Hierarchy, Remove Parameter)</td>
</tr>
<tr>
<td><strong>Speculative Generality (Spekulatif Genelleme)</strong></td>
<td>Gelecekte kullanılmak üzere &quot;her ihtimale karşı&quot; oluşturulmuş kullanılmayan sınıf, metot, alan veya parametre</td>
<td>Collapse Hierarchy, Inline Class, Inline Method, Remove Parameter</td>
</tr>
</tbody>
</table>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-13</footer>
</section>

<h2 id="kod-kokusu-ve-yeniden-yap%C4%B1land%C4%B1rma-ba%C4%9Flay%C4%B1c%C4%B1lar-couplers">Kod Kokusu ve Yeniden Yapılandırma: Bağlayıcılar (Couplers)</h2>
<table>
<thead>
<tr>
<th>Kod Kokusu</th>
<th>Açıklama</th>
<th>Önerilen Yeniden Yapılandırmalar</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Feature Envy (Özellik Kıskançlığı)</strong></td>
<td>Bir metot, kendi verisinden çok başka bir nesnenin verisine erişiyor</td>
<td>Move Method, Extract Method</td>
</tr>
<tr>
<td><strong>Inappropriate Intimacy (Uygunsuz Yakınlık)</strong></td>
<td>Bir sınıf başka bir sınıfın iç alanlarını ve metotlarını kullanıyor</td>
<td>Move Method, Move Field, Extract Class, Hide Delegate, Change Bidirectional Association to Unidirectional, Replace Inheritance with Delegation</td>
</tr>
<tr>
<td><strong>Message Chains (Mesaj Zincirleri)</strong></td>
<td><code>a.getB().getC().getD()</code> gibi bir dizi çağrı görüyorsunuz</td>
<td>Hide Delegate, Extract Method, Move Method</td>
</tr>
<tr>
<td><strong>Middle Man (Aracı)</strong></td>
<td>Bir sınıf başka bir sınıfa devretmekten başka hiçbir şey yapmıyor</td>
<td>Remove Middle Man, Inline Method, Replace Delegation with Inheritance</td>
</tr>
<tr>
<td><strong>Incomplete Library Class (Eksik Kütüphane Sınıfı)</strong></td>
<td>Bir kütüphane sınıfı ihtiyacınız olan bir metoda sahip değil</td>
<td>Introduce Foreign Method, Introduce Local Extension</td>
</tr>
</tbody>
</table>
