<header>CEN206 Object-Oriented Programming</header>
<h2 id="weeks-1-3-core-oop-concepts">Weeks 1-3: Core OOP Concepts</h2>
<h3 id="the-four-pillars-of-object-oriented-programming">The Four Pillars of Object-Oriented Programming</h3>
<table>
<thead>
<tr>
<th>Pillar</th>
<th>Description</th>
<th>Key Mechanism</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Encapsulation</strong></td>
<td>Bundling data and methods together, hiding internal state</td>
<td>Access modifiers (<code>private</code>, <code>protected</code>, <code>public</code>)</td>
</tr>
<tr>
<td><strong>Inheritance</strong></td>
<td>Creating new classes from existing ones, reusing code</td>
<td><code>extends</code> (Java), <code>:</code> (C++)</td>
</tr>
<tr>
<td><strong>Polymorphism</strong></td>
<td>Same interface, different implementations</td>
<td>Method overriding, method overloading</td>
</tr>
<tr>
<td><strong>Abstraction</strong></td>
<td>Exposing only essential features, hiding complexity</td>
<td>Abstract classes, interfaces</td>
</tr>
</tbody>
</table>
<p><img src="assets/oop-pillars-overview.png" alt="center" /></p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-15</footer>

<header>CEN206 Object-Oriented Programming</header>

<h2 id="weeks-1-3-encapsulation-review">Weeks 1-3: Encapsulation Review</h2>
<ul>
<li><strong>What:</strong> Restricting direct access to an object's internal state and requiring interaction through well-defined methods.</li>
<li><strong>Why:</strong> Protects data integrity, reduces coupling, enables implementation changes without affecting clients.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">BankAccount</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-type">double</span> balance; <span class="hljs-comment">// hidden internal state</span>

    <span class="hljs-keyword">public</span> <span class="hljs-type">double</span> <span class="hljs-title function_">getBalance</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> balance;
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">deposit</span><span class="hljs-params">(<span class="hljs-type">double</span> amount)</span> {
        <span class="hljs-keyword">if</span> (amount &gt; <span class="hljs-number">0</span>) {
            balance += amount;
        }
    }

    <span class="hljs-keyword">public</span> <span class="hljs-type">boolean</span> <span class="hljs-title function_">withdraw</span><span class="hljs-params">(<span class="hljs-type">double</span> amount)</span> {
        <span class="hljs-keyword">if</span> (amount &gt; <span class="hljs-number">0</span> &amp;&amp; amount &lt;= balance) {
            balance -= amount;
            <span class="hljs-keyword">return</span> <span class="hljs-literal">true</span>;
        }
        <span class="hljs-keyword">return</span> <span class="hljs-literal">false</span>;
    }
}
</code></pre>

<h2 id="weeks-1-3-polymorphism-review">Weeks 1-3: Polymorphism Review</h2>
<ul>
<li><strong>What:</strong> The ability of objects of different classes to respond to the same method call in different ways.</li>
<li><strong>Why:</strong> Enables flexible, extensible code that works with abstractions rather than concrete types.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">abstract</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Shape</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">abstract</span> <span class="hljs-type">double</span> <span class="hljs-title function_">area</span><span class="hljs-params">()</span>;
}

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Circle</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Shape</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-type">double</span> radius;
    <span class="hljs-keyword">public</span> <span class="hljs-title function_">Circle</span><span class="hljs-params">(<span class="hljs-type">double</span> r)</span> { <span class="hljs-built_in">this</span>.radius = r; }
    <span class="hljs-keyword">public</span> <span class="hljs-type">double</span> <span class="hljs-title function_">area</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> Math.PI * radius * radius; }
}

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Rectangle</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Shape</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-type">double</span> width, height;
    <span class="hljs-keyword">public</span> <span class="hljs-title function_">Rectangle</span><span class="hljs-params">(<span class="hljs-type">double</span> w, <span class="hljs-type">double</span> h)</span> { <span class="hljs-built_in">this</span>.width = w; <span class="hljs-built_in">this</span>.height = h; }
    <span class="hljs-keyword">public</span> <span class="hljs-type">double</span> <span class="hljs-title function_">area</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> width * height; }
}

<span class="hljs-comment">// Polymorphic usage</span>
<span class="hljs-type">Shape</span> <span class="hljs-variable">s</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Circle</span>(<span class="hljs-number">5</span>);

<h2 id="week-9-creational-design-patterns-summary">Week 9: Creational Design Patterns Summary</h2>
<h3 id="5-patterns-for-object-creation">5 Patterns for Object Creation</h3>
<table>
<thead>
<tr>
<th>#</th>
<th>Pattern</th>
<th>Intent</th>
<th>When to Use</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td><strong>Factory Method</strong></td>
<td>Define an interface for creating objects, letting subclasses decide the type</td>
<td>When a class cannot anticipate the type of objects it needs to create</td>
</tr>
<tr>
<td>2</td>
<td><strong>Abstract Factory</strong></td>
<td>Create families of related objects without specifying concrete classes</td>
<td>When the system must be independent of how its products are created</td>
</tr>
<tr>
<td>3</td>
<td><strong>Builder</strong></td>
<td>Separate the construction of a complex object from its representation</td>
<td>When creating objects with many optional parameters</td>
</tr>
<tr>
<td>4</td>
<td><strong>Prototype</strong></td>
<td>Create new objects by copying existing ones</td>
<td>When object creation is expensive and similar objects already exist</td>
</tr>
<tr>
<td>5</td>
<td><strong>Singleton</strong></td>
<td>Ensure a class has only one instance and provide global access</td>
<td>When exactly one instance is needed (e.g., configuration, logging)</td>
</tr>
</tbody>
</table>

<h2 id="week-10-structural-design-patterns-summary">Week 10: Structural Design Patterns Summary</h2>
<h3 id="7-patterns-for-classobject-composition">7 Patterns for Class/Object Composition</h3>
<table>
<thead>
<tr>
<th>#</th>
<th>Pattern</th>
<th>Intent</th>
<th>When to Use</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td><strong>Adapter</strong></td>
<td>Convert one interface to another that clients expect</td>
<td>When you need to use an existing class with an incompatible interface</td>
</tr>
<tr>
<td>2</td>
<td><strong>Bridge</strong></td>
<td>Separate abstraction from implementation</td>
<td>When both abstraction and implementation may vary independently</td>
</tr>
<tr>
<td>3</td>
<td><strong>Composite</strong></td>
<td>Compose objects into tree structures for part-whole hierarchies</td>
<td>When you need to treat individual objects and compositions uniformly</td>
</tr>
<tr>
<td>4</td>
<td><strong>Decorator</strong></td>
<td>Attach additional responsibilities dynamically</td>
<td>When you need to add behavior without subclassing</td>
</tr>
<tr>
<td>5</td>
<td><strong>Facade</strong></td>
<td>Provide a simplified interface to a complex subsystem</td>
<td>When you need a simple interface to a complex system</td>
</tr>
<tr>
<td>6</td>
<td><strong>Flyweight</strong></td>
<td>Share objects to support large numbers efficiently</td>
<td>When many similar objects consume excessive memory</td>
</tr>
<tr>
<td>7</td>
<td><strong>Proxy</strong></td>
<td>Provide a surrogate or placeholder for another object</td>
<td>When you need controlled access, lazy loading, or logging</td>
</tr>
</tbody>
</table>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-15</footer>

<h2 id="week-11-behavioral-design-patterns-summary">Week 11: Behavioral Design Patterns Summary</h2>
<h3 id="10-patterns-for-object-communication">10 Patterns for Object Communication</h3>
<table>
<thead>
<tr>
<th>#</th>
<th>Pattern</th>
<th>Intent</th>
<th>When to Use</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td><strong>Chain of Responsibility</strong></td>
<td>Pass request along a chain of handlers</td>
<td>When multiple objects may handle a request</td>
</tr>
<tr>
<td>2</td>
<td><strong>Command</strong></td>
<td>Encapsulate a request as an object</td>
<td>When you need undo/redo, queuing, or logging of requests</td>
</tr>
<tr>
<td>3</td>
<td><strong>Iterator</strong></td>
<td>Access elements sequentially without exposing internals</td>
<td>When you need uniform traversal of collections</td>
</tr>
<tr>
<td>4</td>
<td><strong>Mediator</strong></td>
<td>Define centralized communication between objects</td>
<td>When many objects communicate in complex ways</td>
</tr>
<tr>
<td>5</td>
<td><strong>Memento</strong></td>
<td>Capture and restore object state</td>
<td>When you need undo/rollback functionality</td>
</tr>
<tr>
<td>6</td>
<td><strong>Observer</strong></td>
<td>Notify dependents automatically when state changes</td>
<td>When one object change should update many others</td>
</tr>
<tr>
<td>7</td>
<td><strong>State</strong></td>
<td>Alter behavior when internal state changes</td>
<td>When behavior depends on state and changes at runtime</td>
</tr>
<tr>
<td>8</td>
<td><strong>Strategy</strong></td>
<td>Define interchangeable algorithms</td>
<td>When you need to select an algorithm at runtime</td>
</tr>
<tr>
<td>9</td>
<td><strong>Template Method</strong></td>
<td>Define algorithm skeleton, letting subclasses fill in steps</td>
<td>When subclasses should customize parts of an algorithm</td>
</tr>
<tr>
<td>10</td>
<td><strong>Visitor</strong></td>
<td>Add operations to objects without modifying them</td>
<td>When you need to perform operations across a class hierarchy</td>
</tr>
</tbody>
</table>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-15</footer>

<h2 id="week-12-code-smells-summary">Week 12: Code Smells Summary</h2>
<h3 id="5-categories-22-smells">5 Categories, 22 Smells</h3>
<table>
<thead>
<tr>
<th>Category</th>
<th>Smells</th>
<th>Key Indicator</th>
</tr>
</thead>
<tbody>
<tr>

</tr>
<tr>
<td><strong>Object-Orientation Abusers</strong></td>
<td>Switch Statements, Temporary Field, Refused Bequest, Alternative Classes with Different Interfaces</td>
<td>Improper use of OOP principles</td>
</tr>
<tr>
<td><strong>Change Preventers</strong></td>
<td>Divergent Change, Shotgun Surgery, Parallel Inheritance Hierarchies</td>
<td>Changes require modifications in many places</td>
</tr>
<tr>
<td><strong>Dispensables</strong></td>
<td>Comments (excessive), Duplicate Code, Lazy Class, Data Class, Dead Code, Speculative Generality</td>
<td>Unnecessary code that adds complexity</td>
</tr>
<tr>
<td><strong>Couplers</strong></td>
<td>Feature Envy, Inappropriate Intimacy, Message Chains, Middle Man, Incomplete Library Class</td>
<td>Excessive coupling between classes</td>
</tr>
</tbody>
</table>

<h2 id="pattern-selection-decision-guide">Pattern Selection Decision Guide</h2>
<h3 id="how-to-choose-the-right-pattern">How to Choose the Right Pattern</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Is your problem about...

CREATING objects?
  |-- Need one instance only?           --&gt; Singleton
  |-- Need families of related objects? --&gt; Abstract Factory
  |-- Need flexible object construction?--&gt; Builder
  |-- Need to copy existing objects?    --&gt; Prototype
  |-- Need subclass to decide type?     --&gt; Factory Method

STRUCTURING classes?
  |-- Need to adapt an interface?       --&gt; Adapter
  |-- Need to add behavior dynamically? --&gt; Decorator
  |-- Need a simplified interface?      --&gt; Facade
  |-- Need tree structures?             --&gt; Composite
  |-- Need controlled access?           --&gt; Proxy

MANAGING behavior?
  |-- Need to notify on state change?   --&gt; Observer
  |-- Need interchangeable algorithms?  --&gt; Strategy
  |-- Need to encapsulate requests?     --&gt; Command
  |-- Need to traverse a collection?    --&gt; Iterator
  |-- Need state-dependent behavior?    --&gt; State
</code></pre>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-15</footer>

<h2 id="code-quality-expectations">Code Quality Expectations</h2>
<h3 id="what-we-look-for">What We Look For</h3>
<ol>
<li>
<p><strong>Clean Code Principles</strong></p>
<ul>
<li>Meaningful variable and method names</li>
<li>Short, focused methods (no Long Methods)</li>
<li>Proper code organization and package structure</li>
</ul>
</li>
<li>
<p><strong>Design Patterns Usage</strong></p>
<ul>
<li>At least 2-3 design patterns applied appropriately</li>
<li>Justification for why each pattern was chosen</li>
<li>Correct implementation following pattern structure</li>
</ul>
</li>
<li>
<p><strong>Proper OOP</strong></p>
<ul>
<li>Encapsulation: private fields with getters/setters where needed</li>
<li>Inheritance: meaningful class hierarchies (not forced)</li>
<li>Polymorphism: interfaces and abstract classes used effectively</li>
<li>Abstraction: clean separation of concerns</li>
</ul>
</li>
<li>
<p><strong>No Code Smells</strong></p>
<ul>
<li>No duplicate code</li>
<li>No long parameter lists</li>
<li>No feature envy or inappropriate intimacy</li>
</ul>
</li>

<h2 id="how-to-present-your-project">How to Present Your Project</h2>
<h3 id="preparation-checklist">Preparation Checklist</h3>
<ul>
<li>[ ] <strong>Test everything</strong> on the presentation machine beforehand</li>
<li>[ ] <strong>Prepare a backup plan</strong> (screenshots, video recording) in case of technical issues</li>
<li>[ ] <strong>Know your code</strong> -- every team member should understand all parts</li>
<li>[ ] <strong>Prepare talking points</strong> -- do not read from slides</li>
<li>[ ] <strong>Practice the demo</strong> at least 2-3 times</li>
<li>[ ] <strong>Time your presentation</strong> to stay within limits</li>
<li>[ ] <strong>Assign roles</strong> -- who presents which section</li>
</ul>
<h3 id="presentation-tips">Presentation Tips</h3>
<ul>
<li>Start with the <strong>big picture</strong> before diving into details</li>
<li>Show the <strong>architecture</strong> before showing code</li>
<li>Use <strong>diagrams</strong> to explain complex interactions</li>
<li>Keep slides <strong>simple</strong> -- use them as visual aids, not scripts</li>
</ul>

<h2 id="demo-flow-recommendations">Demo Flow Recommendations</h2>
<h3 id="recommended-demo-structure">Recommended Demo Structure</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>1. SETUP (1 minute)
   - Show project structure briefly
   - Mention technologies and tools used

2. CORE FEATURES (3-4 minutes)
   - Demonstrate primary functionality
   - Show the most impressive features first
   - Follow a logical user workflow

3. DESIGN HIGHLIGHTS (1-2 minutes)
   - Show a specific design pattern in action
   - Explain WHY you chose that pattern
   - Show the corresponding UML diagram

4. CODE WALKTHROUGH (1-2 minutes)
   - Show one well-written class
   - Highlight clean code practices
   - Show how patterns are implemented

5. EDGE CASES (1 minute)
   - Show error handling
   - Demonstrate input validation
</code></pre>

<h2 id="qa-preparation-tips">Q&amp;A Preparation Tips</h2>
<h3 id="common-questions-to-expect">Common Questions to Expect</h3>
<table>
<thead>
<tr>
<th>Category</th>
<th>Example Questions</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Design Decisions</strong></td>
<td>&quot;Why did you choose the Observer pattern here instead of Mediator?&quot;</td>
</tr>
<tr>
<td><strong>Alternatives</strong></td>
<td>&quot;What other patterns did you consider and why did you reject them?&quot;</td>
</tr>
<tr>
<td><strong>Challenges</strong></td>
<td>&quot;What was the biggest technical challenge and how did you solve it?&quot;</td>
</tr>
<tr>
<td><strong>OOP Principles</strong></td>
<td>&quot;How does your design demonstrate the Open/Closed Principle?&quot;</td>
</tr>
<tr>
<td><strong>Testing</strong></td>
<td>&quot;How did you test this feature? What edge cases did you consider?&quot;</td>
</tr>
<tr>
<td><strong>Scalability</strong></td>
<td>&quot;How would your design handle 10x more users/data?&quot;</td>
</tr>
</tbody>
</table>
<h3 id="tips-for-answering">Tips for Answering</h3>
<ul>
<li><strong>Be honest</strong> -- if you do not know, say so and explain how you would find out</li>
<li><strong>Be specific</strong> -- reference actual classes, methods, and patterns by name</li>
<li><strong>Be concise</strong> -- answer the question directly, then elaborate if asked</li>
</ul>

<h3 id="type-2-code-analysis">Type 2: Code Analysis</h3>
<p><strong>Example:</strong> Identify the design pattern used in the following code:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">Logger</span> {
    <span class="hljs-keyword">void</span> <span class="hljs-title function_">log</span><span class="hljs-params">(String message)</span>;
}

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">FileLogger</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">Logger</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">log</span><span class="hljs-params">(String message)</span> { <span class="hljs-comment">/* write to file */</span> }
}

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ConsoleLogger</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">Logger</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">log</span><span class="hljs-params">(String message)</span> { <span class="hljs-comment">/* print to console */</span> }
}

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">LoggerFactory</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> Logger <span class="hljs-title function_">getLogger</span><span class="hljs-params">(String type)</span> {
        <span class="hljs-keyword">if</span> (type.equals(<span class="hljs-string">&quot;file&quot;</span>)) <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">FileLogger</span>();
        <span class="hljs-keyword">if</span> (type.equals(<span class="hljs-string">&quot;console&quot;</span>)) <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">ConsoleLogger</span>();
        <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">IllegalArgumentException</span>(<span class="hljs-string">&quot;Unknown type: &quot;</span> + type);
    }
}
</code></pre>
<p><strong>Answer:</strong> Factory Method (Simple Factory variant) -- creates objects without exposing creation logic to the client.</p>

<p><strong>Example:</strong> Identify the code smell(s) in the following code and suggest a refactoring:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-type">double</span> <span class="hljs-title function_">calculatePrice</span><span class="hljs-params">(String type, <span class="hljs-type">int</span> quantity, <span class="hljs-type">double</span> unitPrice,

    <span class="hljs-comment">// ... complex calculation</span>
}
</code></pre>
<p><strong>Answer:</strong></p>
<ul>
<li><strong>Code Smell:</strong> Long Parameter List</li>
<li><strong>Refactoring:</strong> Introduce Parameter Object -- create a <code>PriceRequest</code> class to group related parameters.</li>

<h3 id="type-4-design-problem">Type 4: Design Problem</h3>
<p><strong>Example:</strong> You are designing a notification system that needs to:</p>
<ul>
<li>Support multiple notification channels (email, SMS, push notification)</li>
<li>Allow adding new channels without modifying existing code</li>
<li>Let users subscribe/unsubscribe from notifications</li>
</ul>
<p><strong>Question:</strong> Which design pattern(s) would you use? Draw a UML class diagram and explain your choice.</p>
<p><strong>Expected Answer:</strong></p>
<ul>
<li><strong>Observer Pattern</strong> for subscribe/unsubscribe mechanism</li>
<li><strong>Strategy Pattern</strong> for interchangeable notification channels</li>
<li>Should include a class diagram showing <code>NotificationService</code>, <code>Observer</code> interface, <code>NotificationChannel</code> strategy interface, and concrete implementations</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="final-words">Final Words</h2>
<h3 id="key-principles-to-carry-forward">Key Principles to Carry Forward</h3>
<ol>
<li><strong>Think in objects</strong> -- model real-world entities with classes and relationships</li>
<li><strong>Design before coding</strong> -- UML diagrams save debugging time</li>
<li><strong>Use patterns wisely</strong> -- they are solutions to recurring problems, not goals themselves</li>
<li><strong>Keep code clean</strong> -- refactor continuously, eliminate smells early</li>
<li><strong>Follow SOLID</strong> -- these principles guide good OOP design</li>
<li><strong>Test your code</strong> -- untested code is unreliable code</li>
<li><strong>Document your design</strong> -- future you (and your team) will thank you</li>
</ol>
<p><strong>Good luck with your final projects and exams!</strong></p>
