<header>CEN206 Object-Oriented Programming</header>
<h2 id="mediator-how-to-implement">Mediator: How to Implement</h2>
<ol>
<li>Identify a group of <strong>tightly coupled classes</strong> which would benefit from being more independent.</li>
<li>Declare the <strong>mediator interface</strong> and describe the desired communication protocol between mediators and various components.</li>
<li>Implement the <strong>concrete mediator</strong> class. Consider storing references to all components inside the mediator.</li>
<li>You can go even further and make the mediator responsible for the <strong>creation and destruction</strong> of component objects.</li>
<li>Components should store a reference to the mediator object. The connection is usually established in the <strong>component's constructor</strong>.</li>
<li>Change the components' code so that they <strong>call the mediator's notification</strong> method instead of methods on other components.</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="mediator-pros-and-cons">Mediator: Pros and Cons</h2>
<p><strong>Pros:</strong></p>
<ul>
<li><strong>Single Responsibility Principle:</strong> You can extract the communications between various components into a single place, making it easier to comprehend and maintain</li>
<li><strong>Open/Closed Principle:</strong> You can introduce new mediators without having to change the actual components</li>
<li>You can <strong>reduce coupling</strong> between various components of a program</li>
<li>You can <strong>reuse individual components</strong> more easily</li>
</ul>
<p><strong>Cons:</strong></p>
<ul>
<li>Over time a mediator can evolve into a <strong>God Object</strong> -- an object that knows too much or does too much</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="mediator-relations-with-other-patterns">Mediator: Relations with Other Patterns</h2>
<ul>
<li><strong>Chain of Responsibility, Command, Mediator, and Observer</strong> address various ways of connecting senders and receivers. Mediator eliminates direct connections between senders and receivers, forcing them to communicate indirectly.</li>
<li><strong>Facade vs. Mediator:</strong> Facade defines a simplified interface to a subsystem; it does not add new functionality and subsystem objects are not aware of the facade. Mediator centralizes communication between components.</li>
<li><strong>Mediator and Observer:</strong> The distinction is often subtle. Mediator eliminates mutual dependencies via a central object. Observer allows establishing dynamic one-way subscription connections. A Mediator can be implemented using Observer, where the mediator acts as publisher and components are subscribers.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-e-takeaway">Module E: Takeaway</h2>
<p>The <strong>Mediator</strong> pattern defines an object that encapsulates how a set of objects interact. It promotes loose coupling by keeping objects from referring to each other explicitly and lets you vary their interaction independently.</p>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="memento-intent">Memento: Intent</h2>
<p><strong>Memento</strong> is a behavioral design pattern that lets you save and restore the previous state of an object without revealing the details of its implementation.</p>
<p>Also known as: <strong>Snapshot</strong></p>
<p>Source: <a href="https://refactoring.guru/design-patterns/memento">refactoring.guru</a></p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="111" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="111" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="memento-problem">Memento: Problem</h2>
<p>Imagine that you are creating a text editor app. In addition to simple text editing, your editor can format text, insert inline images, etc.</p>
<p>At some point, you decided to let users <strong>undo</strong> any operations carried out on the text. This feature has become so common that people expect to have it in every app.</p>
<p>For the implementation, you chose to take the direct approach: before performing any operation, the app records the <strong>state of all objects</strong> and saves it in some storage. Later, when a user decides to undo an action, the app fetches the most recent snapshot and uses it to restore the state.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="112" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="112" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="memento-problem-cont">Memento: Problem (cont.)</h2>
<p>How exactly would you produce the snapshots of the object's state? You would probably need to go over all the fields in an object and copy their values into storage. However, this would only work if the object had quite <strong>relaxed access restrictions</strong> to its contents. Unfortunately, most real objects will not let others peek inside them that easily, hiding all significant data in <strong>private fields</strong>.</p>
<p>Attempting to directly copy private fields either breaks encapsulation or couples snapshot logic to the object's internal structure, making the code fragile.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="113" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="113" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="memento-solution">Memento: Solution</h2>
<p>The Memento pattern delegates creating the state snapshots to the actual owner of that state, the <strong>originator</strong> object. Hence, instead of other objects trying to copy the editor's state from the &quot;outside,&quot; the editor class itself can make the snapshot since it has full access to its own state.</p>
<p>The pattern suggests storing the copy of the object's state in a special object called <strong>memento</strong>. The contents of the memento are not accessible to any other object except the one that produced it.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="114" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="114" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="memento-solution-cont">Memento: Solution (cont.)</h2>
<p>Other objects must communicate with mementos using a <strong>limited interface</strong> which may allow fetching the snapshot's metadata (creation time, name of operation, etc.), but not the original object's state contained in the snapshot.</p>
<p>A <strong>caretaker</strong> object (e.g., the command history) knows &quot;when&quot; and &quot;why&quot; to capture the originator's state, as well as when the state should be restored. The caretaker can store a stack of mementos, and when it is time to travel back in time, it fetches the topmost memento and passes it to the originator's restore method.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="115" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="115" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="memento-real-world-analogy">Memento: Real-World Analogy</h2>
<p>Think of <strong>saving a game</strong>. The game (originator) has a complex internal state: current level, character positions, inventory, health points, etc.</p>
<p>Before a dangerous boss fight, you <strong>save the game</strong> (create a memento). The save file stores all the relevant game state. If you fail, you can <strong>load the save</strong> (restore from memento) and try again.</p>
<p>The save file is the memento. The player (or the game menu) acts as the caretaker.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="116" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="116" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="memento-structure">Memento: Structure</h2>
<p>The classic implementation uses nested classes:</p>
<ol>
<li>
<p><strong>Originator</strong>: Can produce snapshots of its own state, as well as restore its state from snapshots when needed.</p>
</li>
<li>
<p><strong>Memento</strong>: A value object that acts as a snapshot of the originator's state. It is a common practice to make the memento immutable and pass the data to it only once, via the constructor.</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="117" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="117" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="memento-structure-cont">Memento: Structure (cont.)</h2>
<ol start="3">
<li>
<p><strong>Caretaker</strong>: Knows not only &quot;when&quot; and &quot;why&quot; to capture the originator's state, but also when the state should be restored. A caretaker can keep track of the originator's history by storing a stack of mementos. When the originator has to travel back in time, the caretaker fetches the topmost memento from the stack and passes it to the originator's restoration method.</p>
</li>
<li>
<p>In the nested class implementation, the <strong>Memento class is nested inside the Originator</strong>. This lets the originator access the fields and methods of the memento, even though they are declared private.</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="118" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

<header>CEN206 Object-Oriented Programming</header>
<h2 id="memento-java-pseudocode">Memento: Java Pseudocode</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Memento: stores editor state</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">EditorMemento</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> String text;
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> <span class="hljs-type">int</span> cursorPosition;
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> <span class="hljs-type">int</span> scrollPosition;
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> Date timestamp;

    <span class="hljs-keyword">public</span> <span class="hljs-title function_">EditorMemento</span><span class="hljs-params">(String text,
            <span class="hljs-type">int</span> cursorPosition,
            <span class="hljs-type">int</span> scrollPosition)</span> {
        <span class="hljs-built_in">this</span>.text = text;
        <span class="hljs-built_in">this</span>.cursorPosition = cursorPosition;
        <span class="hljs-built_in">this</span>.scrollPosition = scrollPosition;
        <span class="hljs-built_in">this</span>.timestamp = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Date</span>();
    }

    <span class="hljs-comment">// Only originator can access these</span>
    String <span class="hljs-title function_">getText</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> text; }
    <span class="hljs-type">int</span> <span class="hljs-title function_">getCursorPosition</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> cursorPosition;
    }
    <span class="hljs-type">int</span> <span class="hljs-title function_">getScrollPosition</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> scrollPosition;
    }

<span class="hljs-comment">// Caretaker: manages history</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">EditorHistory</span> {
    <span class="hljs-keyword">private</span> Stack&lt;EditorMemento&gt; history
        = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Stack</span>&lt;&gt;();

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">save</span><span class="hljs-params">(TextEditor editor)</span> {
        history.push(editor.save());
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">undo</span><span class="hljs-params">(TextEditor editor)</span> {
        <span class="hljs-keyword">if</span> (!history.isEmpty()) {
            <span class="hljs-type">EditorMemento</span> <span class="hljs-variable">memento</span> <span class="hljs-operator">=</span> history.pop();
            editor.restore(memento);
            System.out.println(<span class="hljs-string">&quot;Restored to: &quot;</span>
                + memento.getName());
        }
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">showHistory</span><span class="hljs-params">()</span> {
        System.out.println(<span class="hljs-string">&quot;History (&quot;</span>
            + history.size() + <span class="hljs-string">&quot; states):&quot;</span>);
        <span class="hljs-keyword">for</span> (EditorMemento m : history) {
            System.out.println(
                <span class="hljs-string">&quot;  - &quot;</span> + m.getName());
        }
    }
}

<header>CEN206 Object-Oriented Programming</header>
<h2 id="memento-applicability">Memento: Applicability</h2>
<p>Use the Memento pattern when:</p>
<ul>
<li>You want to produce <strong>snapshots of the object's state</strong> to be able to restore a previous state.</li>
<li>Direct access to the object's fields/getters/setters <strong>violates its encapsulation</strong>. The Memento makes the object itself responsible for creating a snapshot of its state.</li>
<li>You need to implement <strong>undo/redo</strong>, <strong>transaction rollbacks</strong>, or <strong>checkpointing</strong> functionality.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="memento-how-to-implement">Memento: How to Implement</h2>
<ol>
<li>Determine what class will play the role of the <strong>originator</strong>.</li>
<li>Create the <strong>memento class</strong>. One by one, declare a set of fields that mirror the fields declared inside the originator class.</li>
<li>Make the memento class <strong>immutable</strong>. A memento should accept the data just once, via the constructor. The class should have no setters.</li>
<li>If your language supports <strong>nested classes</strong>, nest the memento inside the originator. If not, extract a blank interface from the memento class and make everyone else use it.</li>
<li>Add a method for producing mementos to the <strong>originator</strong> class.</li>
<li>Add a method for restoring the originator's state to the <strong>originator</strong> class.</li>
<li>The <strong>caretaker</strong> should know when to request new mementos from the originator, how to store them, and when to restore the originator with a particular memento.</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="memento-pros-and-cons">Memento: Pros and Cons</h2>
<p><strong>Pros:</strong></p>
<ul>
<li>You can produce snapshots of the object's state <strong>without violating its encapsulation</strong></li>
<li>You can simplify the originator's code by letting the caretaker maintain the <strong>history of the originator's state</strong></li>
</ul>
<p><strong>Cons:</strong></p>
<ul>
<li>The app might consume <strong>lots of RAM</strong> if clients create mementos too often</li>
<li><strong>Caretakers</strong> should track the originator's lifecycle to be able to destroy obsolete mementos</li>
<li>Most dynamic programming languages (PHP, Python, JavaScript) cannot guarantee that the state within the memento <strong>stays untouched</strong></li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="memento-relations-with-other-patterns">Memento: Relations with Other Patterns</h2>
<ul>
<li>You can use <strong>Command and Memento</strong> together for implementing undo. Commands are responsible for performing various operations over a target object, while mementos save the state of that object just before a command gets executed.</li>
<li>You can use <strong>Memento along with Iterator</strong> to capture the current iteration state and roll it back if necessary.</li>
<li>Sometimes <strong>Prototype</strong> can be a simpler alternative to Memento. This works if the object whose state you want to store in the history is fairly straightforward and does not have links to external resources.</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-f-takeaway">Module F: Takeaway</h2>
<p>The <strong>Memento</strong> pattern captures and externalizes an object's internal state so that the object can be restored to that state later, all without violating encapsulation.</p>

<h1 id="module-g-observer-pattern">Module G: Observer Pattern</h1>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="observer-intent">Observer: Intent</h2>
<p><strong>Observer</strong> is a behavioral design pattern that lets you define a subscription mechanism to notify multiple objects about any events that happen to the object they are observing.</p>
<p>Also known as: <strong>Event-Subscriber</strong>, <strong>Listener</strong></p>
<p>Source: <a href="https://refactoring.guru/design-patterns/observer">refactoring.guru</a></p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="132" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="132" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="observer-problem">Observer: Problem</h2>
<p>Imagine that you have two types of objects: a <code>Customer</code> and a <code>Store</code>. The customer is very interested in a particular brand of product which should become available in the store very soon.</p>
<p>The customer could visit the store every day and check product availability. But while the product is still en route, most of these trips would be <strong>pointless</strong>.</p>
<p>On the other hand, the store could send tons of emails to all customers each time a new product becomes available. This would <strong>save some customers</strong> from endless trips but would <strong>upset other customers</strong> who are not interested in new products.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="133" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="133" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="observer-solution">Observer: Solution</h2>
<p>The object that has some interesting state is often called <strong>subject</strong> (publisher). All other objects that want to track changes to the publisher's state are called <strong>subscribers</strong>.</p>
<p>The Observer pattern suggests that you add a <strong>subscription mechanism</strong> to the publisher class so individual objects can subscribe to or unsubscribe from a stream of events.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="134" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="134" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="observer-solution-cont">Observer: Solution (cont.)</h2>
<p>In reality, this mechanism consists of:</p>
<ol>
<li>An <strong>array field</strong> for storing a list of references to subscriber objects</li>
<li>Several <strong>public methods</strong> which allow adding subscribers to and removing them from that list</li>
<li>A <strong>notification method</strong> that goes over the list of subscribers and calls their specific notification method</li>
</ol>
<p>Now whenever an important event happens to the publisher, it goes over its subscribers and calls the specific notification method on their objects.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="135" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

}
" data-lang="en-US" lang="en-US" data-marpit-pagination="135" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="observer-solution-cont-1">Observer: Solution (cont.)</h2>
<p>It is crucial that all subscribers implement the <strong>same interface</strong> and that the publisher communicates with them only via that interface. This interface should declare the notification method along with a set of parameters that the publisher can use to pass some contextual data along with the notification.</p>
<p>If your app has several different types of publishers, you can make all of them follow the same interface, allowing subscribers to observe all of them with a single subscription.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="136" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

<header>CEN206 Object-Oriented Programming</header>
<h2 id="observer-real-world-analogy">Observer: Real-World Analogy</h2>
<p>If you subscribe to a newspaper or magazine, you no longer need to go to the store to check if the next issue is available. Instead, the <strong>publisher</strong> sends new issues directly to your mailbox right after publication.</p>
<p>The publisher maintains a list of subscribers and knows which magazines they are interested in. Subscribers can leave the list at any time when they wish to stop the publisher from sending new magazine issues to them.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="137" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

<header>CEN206 Object-Oriented Programming</header>
<h2 id="observer-structure">Observer: Structure</h2>
<p>The structure consists of the following participants:</p>
<ol>
<li>
<p><strong>Publisher (Subject)</strong>: Issues events of interest to other objects. These events occur when the publisher changes its state or executes some behaviors. Publishers contain a subscription infrastructure that lets new subscribers join and current subscribers leave the list.</p>
</li>
<li>
<p><strong>Subscriber Interface</strong>: Declares the notification interface. In most cases, it consists of a single <code>update</code> method. The method may have several parameters that let the publisher pass some event details along with the update.</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="138" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="138" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="observer-structure-cont">Observer: Structure (cont.)</h2>
<ol start="3">
<li>
<p><strong>Concrete Subscribers</strong>: Perform some actions in response to notifications issued by the publisher. All of these classes must implement the same interface so the publisher is not coupled to concrete classes.</p>
</li>
<li>
<p><strong>Client</strong>: Creates publisher and subscriber objects separately and then registers subscribers for publisher updates.</p>
</li>
</ol>
<p>Usually, subscribers need some contextual information to handle the update correctly. For this reason, publishers often pass some context data as arguments of the notification method.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>

" data-lang="en-US" lang="en-US" data-marpit-pagination="141" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {

<header>CEN206 Object-Oriented Programming</header>
<h2 id="observer-java-pseudocode-cont">Observer: Java Pseudocode (cont.)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.util.*;

<span class="hljs-comment">// Event manager (subscription infrastructure)</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">EventManager</span> {
    <span class="hljs-keyword">private</span> Map&lt;String, List&lt;EventListener&gt;&gt; listeners
        = <span class="hljs-keyword">new</span> <span class="hljs-title class_">HashMap</span>&lt;&gt;();

    <span class="hljs-keyword">public</span> <span class="hljs-title function_">EventManager</span><span class="hljs-params">(String... operations)</span> {
        <span class="hljs-keyword">for</span> (String op : operations) {
            listeners.put(op, <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;&gt;());
        }
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">subscribe</span><span class="hljs-params">(String eventType,
                           EventListener listener)</span> {
        listeners.get(eventType).add(listener);
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">unsubscribe</span><span class="hljs-params">(String eventType,
                             EventListener listener)</span> {
        listeners.get(eventType).remove(listener);
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">notify</span><span class="hljs-params">(String eventType,
                       String data)</span> {
        <span class="hljs-keyword">for</span> (EventListener listener :
                listeners.get(eventType)) {
            listener.update(eventType, data);
        }
    }
}
</code></pre>

<h2 id="observer-java-pseudocode-cont-1">Observer: Java Pseudocode (cont.)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Publisher: Editor</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">EditorPublisher</span> {
    <span class="hljs-keyword">public</span> EventManager events;
    <span class="hljs-keyword">private</span> String filePath;

<header>CEN206 Object-Oriented Programming</header>
<h2 id="observer-applicability">Observer: Applicability</h2>
<p>Use the Observer pattern when:</p>
<ul>
<li>Changes to the state of one object may require changing <strong>other objects</strong>, and the actual set of objects is <strong>unknown beforehand</strong> or changes dynamically.</li>
<li>Some objects in your app must observe others, but only for a <strong>limited time</strong> or in <strong>specific cases</strong>.</li>
<li>You need to <strong>decouple</strong> the publisher from its subscribers so they can be developed, tested, and maintained independently.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="observer-how-to-implement">Observer: How to Implement</h2>
<ol>
<li>Look through your business logic and try to break it down into two parts: the <strong>core functionality</strong> (publisher) independent from other code, and the <strong>rest</strong> that will act as subscriber classes.</li>
<li>Declare the <strong>subscriber interface</strong>. At the bare minimum, it should declare a single <code>update</code> method.</li>
<li>Declare the <strong>publisher interface</strong> and describe a pair of methods for adding and removing a subscriber object from the list.</li>
<li>Decide where to put the actual subscription list and the implementation of subscription methods. Usually this code looks the same for all publishers, so create an <strong>abstract class or use composition</strong>.</li>
<li>Create <strong>concrete publisher</strong> classes. Each time something important happens inside a publisher, it must notify all its subscribers.</li>
<li>Implement the <strong>update notification methods</strong> in concrete subscriber classes.</li>
<li>The <strong>client</strong> must create all necessary subscribers and register them with proper publishers.</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="observer-pros-and-cons">Observer: Pros and Cons</h2>
<p><strong>Pros:</strong></p>
<ul>
<li><strong>Open/Closed Principle:</strong> You can introduce new subscriber classes without having to change the publisher's code (and vice versa if there is a publisher interface)</li>
<li>You can establish <strong>relations between objects at runtime</strong></li>
<li>Publishers are <strong>decoupled</strong> from concrete subscriber implementations</li>
</ul>
<p><strong>Cons:</strong></p>
<ul>
<li>Subscribers are notified in <strong>random order</strong> (no guaranteed ordering)</li>
<li>If not properly managed, can lead to <strong>memory leaks</strong> (subscribers that forget to unsubscribe)</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="observer-relations-with-other-patterns">Observer: Relations with Other Patterns</h2>
<ul>
<li><strong>Chain of Responsibility, Command, Mediator, and Observer</strong> are various ways of connecting senders and receivers:
<ul>
<li><strong>CoR</strong> passes sequentially along a chain</li>
<li><strong>Command</strong> establishes unidirectional connections</li>
<li><strong>Mediator</strong> eliminates direct connections via a central object</li>
<li><strong>Observer</strong> lets receivers dynamically subscribe/unsubscribe</li>
</ul>
</li>
<li><strong>Observer vs. Mediator:</strong> Mediator eliminates mutual dependencies; Observer creates one-way dynamic connections. You can implement Mediator using Observer, where the mediator acts as publisher and components as subscribers.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-g-takeaway">Module G: Takeaway</h2>
<p>The <strong>Observer</strong> pattern defines a one-to-many dependency between objects so that when one object changes state, all its dependents are notified and updated automatically. It is the foundation of event-driven programming.</p>

<h1 id="module-h-state-pattern">Module H: State Pattern</h1>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="state-intent">State: Intent</h2>
<p><strong>State</strong> is a behavioral design pattern that lets an object alter its behavior when its internal state changes. It appears as if the object changed its class.</p>
<p>Source: <a href="https://refactoring.guru/design-patterns/state">refactoring.guru</a></p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="156" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="156" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="state-problem">State: Problem</h2>
<p>The State pattern is closely related to the concept of a <strong>Finite-State Machine</strong>.</p>
<p>The main idea is that, at any given moment, there is a <strong>finite number of states</strong> which a program can be in. Within any unique state, the program behaves differently, and the program can be <strong>switched from one state to another</strong> instantaneously.</p>
<p>However, depending on a current state, the program may or may not switch to certain other states. These switching rules, called <strong>transitions</strong>, are also finite and predetermined.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="157" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="157" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="state-problem-cont">State: Problem (cont.)</h2>
<p>Imagine a <code>Document</code> class. A document can be in one of three states: <code>Draft</code>, <code>Moderation</code>, and <code>Published</code>. The <code>publish</code> method of the document works a little bit differently in each state:</p>
<ul>
<li>In <strong>Draft</strong>, it moves the document to <strong>Moderation</strong></li>
<li>In <strong>Moderation</strong>, it makes the document <strong>Published</strong>, but only if the current user is an administrator</li>
<li>In <strong>Published</strong>, it does <strong>nothing</strong></li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="158" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="158" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="state-problem-cont-1">State: Problem (cont.)</h2>
<p>The biggest weakness of a state machine based on conditionals reveals itself once we start adding more and more states and state-dependent behaviors. Most methods will contain <strong>monstrous conditionals</strong> that pick the proper behavior according to the current state.</p>
<p>Code like this is very <strong>difficult to maintain</strong> because any change to the transition logic may require changing state conditionals in every method. The problem tends to get bigger as the project evolves.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="159" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="159" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="state-solution">State: Solution</h2>
<p>The State pattern suggests that you create <strong>new classes for all possible states</strong> of an object and extract all state-specific behaviors into these classes.</p>
<p>Instead of implementing all behaviors on its own, the original object, called <strong>context</strong>, stores a reference to one of the state objects that represents its current state and <strong>delegates all the state-related work</strong> to that object.</p>
<p>To transition the context into another state, replace the active state object with another object that represents that new state. This is possible only if all state classes follow the <strong>same interface</strong> and the context itself works with these objects through that interface.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="160" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="160" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {

}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="state-solution-cont">State: Solution (cont.)</h2>
<p>This structure may look similar to the <strong>Strategy</strong> pattern, but there is one key difference:</p>
<p>In the State pattern, the particular states may be <strong>aware of each other</strong> and initiate transitions from one state to another, whereas strategies almost <strong>never know</strong> about each other.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="161" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="state-real-world-analogy">State: Real-World Analogy</h2>
<p>The buttons and switches in your smartphone behave differently depending on the current state of the device:</p>
<ul>
<li>When the phone is <strong>unlocked</strong>, pressing buttons leads to executing various functions</li>
<li>When the phone is <strong>locked</strong>, pressing any button leads to the unlock screen</li>
<li>When the phone's <strong>charge is low</strong>, pressing any button shows the charging screen</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="162" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

<header>CEN206 Object-Oriented Programming</header>
<h2 id="state-structure">State: Structure</h2>
<p>The structure consists of the following participants:</p>
<ol>
<li>
<p><strong>Context</strong>: Stores a reference to one of the concrete state objects and delegates to it all state-specific work. The context communicates with the state object via the state interface. The context exposes a setter for passing it a new state object.</p>
</li>
<li>
<p><strong>State Interface</strong>: Declares the state-specific methods. These methods should make sense for all concrete states because you do not want some of your states to have useless methods that will never be called.</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="163" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

}
" data-lang="en-US" lang="en-US" data-marpit-pagination="163" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {

;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="state-structure-cont">State: Structure (cont.)</h2>
<ol start="3">
<li>
<p><strong>Concrete States</strong>: Provide their own implementations for the state-specific methods. To avoid duplication of similar code across multiple states, you may provide intermediate abstract classes.</p>
</li>
<li>
<p><strong>State Transitions</strong>: Both context and concrete state classes can set the next state of the context and perform the actual state transition by replacing the state object linked to the context.</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="state-java-pseudocode-cont">State: Java Pseudocode (cont.)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.util.List;

<span class="hljs-comment">// Context: Audio Player</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">AudioPlayer</span> {
    <span class="hljs-keyword">private</span> PlayerState state;
    <span class="hljs-keyword">private</span> List&lt;String&gt; playlist;
    <span class="hljs-keyword">private</span> <span class="hljs-type">int</span> <span class="hljs-variable">currentTrack</span> <span class="hljs-operator">=</span> <span class="hljs-number">0</span>;
    <span class="hljs-keyword">private</span> <span class="hljs-type">boolean</span> <span class="hljs-variable">playing</span> <span class="hljs-operator">=</span> <span class="hljs-literal">false</span>;

    <span class="hljs-keyword">public</span> <span class="hljs-title function_">AudioPlayer</span><span class="hljs-params">(List&lt;String&gt; playlist)</span> {
        <span class="hljs-built_in">this</span>.playlist = playlist;
        <span class="hljs-built_in">this</span>.state = <span class="hljs-keyword">new</span> <span class="hljs-title class_">ReadyState</span>(<span class="hljs-built_in">this</span>);
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">changeState</span><span class="hljs-params">(PlayerState state)</span> {
        <span class="hljs-built_in">this</span>.state = state;

<header>CEN206 Object-Oriented Programming</header>
<h2 id="state-applicability">State: Applicability</h2>
<p>Use the State pattern when:</p>
<ul>
<li>
<p>You have an object that behaves differently depending on its current state, the <strong>number of states is enormous</strong>, and the state-specific code changes frequently.</p>
</li>
<li>
<p>You have a class polluted with massive conditionals that alter how the class behaves according to <strong>current values of the class's fields</strong>.</p>
</li>
<li>
<p>You have a lot of <strong>duplicate code</strong> across similar states and transitions of a condition-based state machine.</p>
</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="state-how-to-implement">State: How to Implement</h2>
<ol>
<li>Decide what class will act as the <strong>context</strong>. It could be an existing class with state-dependent code, or a new class.</li>
<li>Declare the <strong>state interface</strong>. Although it may mirror all the methods declared in the context, aim only for those that may contain state-specific behavior.</li>
<li>For every actual state, create a class that derives from the state interface. Go through the context's methods and <strong>extract all code related to that state</strong> into the newly created class.</li>
<li>In the context class, add a reference field of the <strong>state interface</strong> type and a public setter that allows overriding the value of that field.</li>
<li>Go over the method of the context again and <strong>replace empty state conditionals</strong> with calls to corresponding methods of the state object.</li>
<li>To switch the state of the context, create an instance of one of the state classes and <strong>pass it to the context</strong>.</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="state-pros-and-cons">State: Pros and Cons</h2>
<p><strong>Pros:</strong></p>
<ul>
<li><strong>Single Responsibility Principle:</strong> Organize the code related to particular states into separate classes</li>
<li><strong>Open/Closed Principle:</strong> Introduce new states without changing existing state classes or the context</li>
<li>Simplify the code of the context by <strong>eliminating bulky state machine conditionals</strong></li>
</ul>
<p><strong>Cons:</strong></p>
<ul>
<li>Applying the pattern can be <strong>overkill</strong> if a state machine has only a few states or rarely changes</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="state-relations-with-other-patterns">State: Relations with Other Patterns</h2>
<ul>
<li><strong>Bridge, State, Strategy (and to some degree Adapter)</strong> have very similar structures. All are based on composition. However, they all solve different problems.</li>
<li><strong>State vs. Strategy:</strong> State can be considered an extension of Strategy. Both patterns are based on composition. However, in State, the concrete states may be <strong>aware of each other</strong> and initiate transitions, whereas strategies are <strong>completely independent</strong>.</li>
<li><strong>State vs. Finite-State Machine:</strong> State is an alternative to large switch/case statements or if/else chains that implement finite-state machines within a class.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>

<h2 id="module-h-takeaway">Module H: Takeaway</h2>
<p>The <strong>State</strong> pattern allows an object to change its behavior when its internal state changes, as if the object changed its class. It replaces complex conditional logic with polymorphic state objects.</p>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="strategy-intent">Strategy: Intent</h2>
<p><strong>Strategy</strong> is a behavioral design pattern that lets you define a family of algorithms, put each of them into a separate class, and make their objects interchangeable.</p>
<p>Source: <a href="https://refactoring.guru/design-patterns/strategy">refactoring.guru</a></p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="strategy-problem">Strategy: Problem</h2>
<p>One day you decided to create a navigation app for casual travelers. The app was centered around a beautiful map which helped users quickly orient themselves in any city.</p>
<p>One of the most requested features for the app was automatic <strong>route planning</strong>. A user should be able to enter an address and see the fastest route to that destination displayed on the map.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="181" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="181" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="strategy-problem-cont">Strategy: Problem (cont.)</h2>
<p>The first version of the app could only build routes over <strong>roads</strong> for car travel. Then you added <strong>walking</strong> routes. Then <strong>public transport</strong> routing. And it did not stop there -- later you planned to add routes for <strong>cyclists</strong>.</p>
<p>From a business perspective, the app was a success. But the technical part caused many headaches. Each time you added a new routing algorithm, the main class of the navigator <strong>doubled in size</strong>. Any change to one algorithm affected the whole class, increasing the chance of creating a bug in already-working code.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="182" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="182" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="strategy-solution">Strategy: Solution</h2>
<p>The Strategy pattern suggests that you take a class that does something specific in a lot of different ways and <strong>extract all of these algorithms into separate classes</strong> called strategies.</p>
<p>The original class, called <strong>context</strong>, must have a field for storing a reference to one of the strategies. The context delegates the work to a linked strategy object instead of executing it on its own.</p>
<p>The context is not responsible for selecting an appropriate algorithm. Instead, the <strong>client</strong> passes the desired strategy to the context.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="183" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="183" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="strategy-solution-cont">Strategy: Solution (cont.)</h2>
<p>In fact, the context does not know much about strategies. It works with all strategies through the same generic <strong>interface</strong>, which only exposes a single method for triggering the algorithm encapsulated within the selected strategy.</p>
<p>This way the context becomes independent of concrete strategies, so you can add new algorithms or modify existing ones <strong>without changing</strong> the code of the context or other strategies.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="184" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

<header>CEN206 Object-Oriented Programming</header>
<h2 id="strategy-real-world-analogy">Strategy: Real-World Analogy</h2>
<p>Imagine that you have to get to the airport. You can catch a <strong>bus</strong>, order a <strong>cab</strong>, or get on your <strong>bicycle</strong>. These are your transportation strategies.</p>
<p>You can pick one of the strategies depending on factors such as budget, time constraints, or personal preference. Each strategy gets you to the same destination but in a different way.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="strategy-structure">Strategy: Structure</h2>
<p>The structure consists of the following participants:</p>
<ol>
<li>
<p><strong>Context</strong>: Maintains a reference to one of the concrete strategies and communicates with this object only via the strategy interface.</p>
</li>
<li>
<p><strong>Strategy Interface</strong>: Common to all concrete strategies. It declares a method the context uses to execute a strategy.</p>
</li>
<li>
<p><strong>Concrete Strategies</strong>: Implement different variations of an algorithm the context uses.</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>

}
" data-lang="en-US" lang="en-US" data-marpit-pagination="186" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {

;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="strategy-structure-cont">Strategy: Structure (cont.)</h2>
<ol start="4">
<li>
<p><strong>Execution Flow</strong>: The context calls the execution method on the linked strategy object each time it needs to run the algorithm. The context does not know what type of strategy it works with or how the algorithm is executed.</p>
</li>
<li>
<p><strong>Client</strong>: Creates a specific strategy object and passes it to the context. The context exposes a setter which lets clients replace the strategy associated with the context at runtime.</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="strategy-applicability">Strategy: Applicability</h2>
<p>Use the Strategy pattern when:</p>
<ul>
<li>You want to use <strong>different variants of an algorithm</strong> within an object and be able to switch from one algorithm to another during runtime.</li>
<li>You have a lot of similar classes that only differ in the way they <strong>execute some behavior</strong>.</li>
<li>You want to isolate the <strong>business logic</strong> of a class from the implementation details of algorithms that may not be as important in the context of that logic.</li>
<li>Your class has a massive <strong>conditional operator</strong> that switches between different variants of the same algorithm.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="strategy-how-to-implement">Strategy: How to Implement</h2>
<ol>
<li>In the context class, identify an <strong>algorithm</strong> that is prone to frequent changes. It may also be a massive conditional that selects and executes a variant of the same algorithm at runtime.</li>
<li>Declare the <strong>strategy interface</strong> common to all variants of the algorithm.</li>
<li>One by one, extract all algorithms into their own classes. They should all <strong>implement the strategy interface</strong>.</li>
<li>In the context class, add a <strong>field for storing a reference</strong> to a strategy object. Provide a setter for replacing values of that field. The context should work with the strategy object only through the strategy interface.</li>
<li><strong>Clients</strong> of the context must associate it with a suitable strategy that matches the way they expect the context to perform its primary job.</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="strategy-pros-and-cons">Strategy: Pros and Cons</h2>
<p><strong>Pros:</strong></p>
<ul>
<li>You can <strong>swap algorithms</strong> used inside an object at runtime</li>
<li>You can <strong>isolate the implementation details</strong> of an algorithm from the code that uses it</li>
<li>You can <strong>replace inheritance with composition</strong></li>
<li><strong>Open/Closed Principle:</strong> You can introduce new strategies without having to change the context</li>
</ul>
<p><strong>Cons:</strong></p>
<ul>
<li>If you only have a <strong>couple of algorithms</strong> and they rarely change, there is no real reason to overcomplicate the program</li>
<li><strong>Clients must be aware</strong> of the differences between strategies to be able to select a proper one</li>
<li>A lot of modern programming languages have functional type support that lets you implement different versions of an algorithm inside a set of <strong>anonymous functions</strong>, making the pattern somewhat redundant</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="strategy-relations-with-other-patterns">Strategy: Relations with Other Patterns</h2>
<ul>
<li><strong>Bridge, State, Strategy (and to some degree Adapter)</strong> have very similar structures based on composition, but they solve different problems.</li>
<li><strong>Command vs. Strategy:</strong> Both parameterize objects. Command converts any operation into an object (for deferred execution, queueing, history of operations). Strategy describes different ways of doing the same thing, letting you swap algorithms within a single context class.</li>
<li><strong>Decorator vs. Strategy:</strong> Decorator lets you change the skin of an object (external appearance). Strategy lets you change the guts (internal behavior).</li>
<li><strong>Template Method vs. Strategy:</strong> Template Method is based on inheritance at the class level (static). Strategy is based on composition at the object level (dynamic, runtime switching).</li>
<li><strong>State vs. Strategy:</strong> State can be considered an extension of Strategy. In State, concrete states may be aware of each other. In Strategy, implementations are completely independent.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-i-takeaway">Module I: Takeaway</h2>
<p>The <strong>Strategy</strong> pattern defines a family of algorithms, encapsulates each one, and makes them interchangeable. It lets the algorithm vary independently from clients that use it, promoting composition over inheritance.</p>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="template-method-intent">Template Method: Intent</h2>
<p><strong>Template Method</strong> is a behavioral design pattern that defines the skeleton of an algorithm in the superclass but lets subclasses override specific steps of the algorithm without changing its structure.</p>
<p>Source: <a href="https://refactoring.guru/design-patterns/template-method">refactoring.guru</a></p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="202" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
