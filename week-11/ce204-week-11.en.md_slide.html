  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="202" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {

}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="template-method-problem">Template Method: Problem</h2>
<p>Imagine you are creating a data mining application that analyzes corporate documents. Users feed the app documents in various formats (PDF, DOC, CSV), and the app tries to extract meaningful data from these documents in a uniform format.</p>
<p>The first version of the app could only work with DOC files. In the following version, it was able to support CSV files. A month later, you &quot;taught&quot; it to extract data from PDF files.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="203" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="203" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="template-method-problem-cont">Template Method: Problem (cont.)</h2>
<p>At some point, you noticed that all three classes have <strong>a lot of similar code</strong>. While the code for dealing with various data formats was entirely different in all classes, the code for data processing and analysis was almost identical.</p>
<p>It would be nice to get rid of the code duplication, leaving the algorithm structure intact. There was another problem related to <strong>client code</strong> that used these classes. It had lots of conditionals that picked a proper course of action depending on the class of the processing object.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="204" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="204" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {

}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="template-method-solution">Template Method: Solution</h2>
<p>The Template Method pattern suggests that you break down an algorithm into a series of steps, turn these steps into methods, and put a series of calls to these methods inside a single <strong>template method</strong>.</p>
<p>The steps may either be <code>abstract</code> (every subclass must provide its own implementation), or have some <strong>default implementation</strong>.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="205" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="205" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="template-method-solution-cont">Template Method: Solution (cont.)</h2>
<p>To use the algorithm, the client is supposed to provide its own subclass, implement all abstract steps, and override some of the optional ones if needed (but not the template method itself).</p>
<p>There is another type of step called <strong>hooks</strong>. A hook is an optional step with an empty body. A template method would work even if a hook is not overridden. Usually, hooks are placed before and after crucial steps of algorithms, providing subclasses with additional extension points.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="206" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

" data-lang="en-US" lang="en-US" data-marpit-pagination="206" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {

;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="template-method-real-world-analogy">Template Method: Real-World Analogy</h2>
<p>The template method approach can be used in <strong>mass housing construction</strong>. The architectural plan for building a standard house may contain several extension points that would let a potential owner adjust some details of the resulting house.</p>
<p>Each building step, such as laying the foundation, framing, building walls, installing plumbing and wiring, etc., can be slightly altered to make the resulting house a little bit different from others. But the overall structure and order of construction remain the same.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="207" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="template-method-structure">Template Method: Structure</h2>
<p>The structure consists of the following participants:</p>
<ol>
<li>
<p><strong>Abstract Class</strong>: Declares methods that act as steps of an algorithm, as well as the actual template method which calls these methods in a specific order. The steps may either be declared <code>abstract</code> or have some default implementation.</p>
</li>
<li>
<p><strong>Concrete Classes</strong>: Can override all of the steps, but <strong>not the template method itself</strong>. Concrete classes provide implementations for the abstract steps and may optionally override some steps that have default implementations.</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="208" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

}
" data-lang="en-US" lang="en-US" data-marpit-pagination="208" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {

;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="template-method-structure-cont">Template Method: Structure (cont.)</h2>
<p>Types of steps:</p>
<ul>
<li><strong>Abstract steps</strong> (must be implemented by every subclass)</li>
<li><strong>Optional steps</strong> (have default implementation but can be overridden)</li>
<li><strong>Hooks</strong> (optional steps with empty body, placed before/after crucial algorithm steps)</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="template-method-java-pseudocode">Template Method: Java Pseudocode</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Abstract class with template method</span>
<span class="hljs-keyword">abstract</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">DataMiner</span> {

    <span class="hljs-comment">// Template method - defines algorithm skeleton</span>
    <span class="hljs-comment">// This method should NOT be overridden!</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">final</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">mine</span><span class="hljs-params">(String path)</span> {
        openFile(path);
        extractData();
        parseData();
        analyzeData();
        sendReport();
        closeFile();
    }

    <span class="hljs-comment">// Abstract steps - must be implemented</span>
    <span class="hljs-keyword">abstract</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">openFile</span><span class="hljs-params">(String path)</span>;
    <span class="hljs-keyword">abstract</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">extractData</span><span class="hljs-params">()</span>;
    <span class="hljs-keyword">abstract</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">closeFile</span><span class="hljs-params">()</span>;

    <span class="hljs-comment">// Default implementation steps</span>
    <span class="hljs-keyword">void</span> <span class="hljs-title function_">parseData</span><span class="hljs-params">()</span> {
        System.out.println(<span class="hljs-string">&quot;Parsing raw data&quot;</span>
            + <span class="hljs-string">&quot; into structured format...&quot;</span>);
    }

    <span class="hljs-keyword">void</span> <span class="hljs-title function_">analyzeData</span><span class="hljs-params">()</span> {
        System.out.println(<span class="hljs-string">&quot;Analyzing data&quot;</span>
            + <span class="hljs-string">&quot; for patterns...&quot;</span>);
    }

    <span class="hljs-comment">// Hook - optional step with</span>
    <span class="hljs-comment">// default (empty) body</span>
    <span class="hljs-keyword">void</span> <span class="hljs-title function_">sendReport</span><span class="hljs-params">()</span> {
        <span class="hljs-comment">// Subclasses may override this</span>
    }
}
</code></pre>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="template-method-applicability">Template Method: Applicability</h2>
<p>Use the Template Method pattern when:</p>
<ul>
<li>You want to let clients extend only <strong>particular steps</strong> of an algorithm, but not the whole algorithm or its structure.</li>
<li>You have several classes that contain <strong>nearly identical algorithms</strong> with some minor differences. When the algorithm changes, you might need to modify all of the classes.</li>
<li>You want to <strong>eliminate code duplication</strong> by pulling up the common behavior into a superclass.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>

;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="template-method-how-to-implement">Template Method: How to Implement</h2>
<ol>
<li><strong>Analyze</strong> the target algorithm to see whether you can break it into steps. Consider which steps are common to all subclasses and which ones will always be unique.</li>
<li>Create the <strong>abstract base class</strong> and declare the template method and a set of abstract methods representing the algorithm's steps. Outline the algorithm's structure in the template method by executing corresponding steps. Consider making the template method <code>final</code> to prevent subclasses from overriding it.</li>
<li>It is fine if all the steps end up being abstract. However, some steps might benefit from having a <strong>default implementation</strong>. Subclasses do not have to implement those methods.</li>
<li>Think of adding <strong>hooks</strong> between the crucial steps of the algorithm.</li>
<li>For each variation of the algorithm, create a new <strong>concrete subclass</strong>. It must implement all of the abstract steps, but may also override some of the optional ones.</li>
</ol>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="template-method-pros-and-cons">Template Method: Pros and Cons</h2>
<p><strong>Pros:</strong></p>
<ul>
<li>You can let clients <strong>override only certain parts</strong> of a large algorithm, making them less affected by changes that happen to other parts</li>
<li>You can pull the <strong>duplicate code</strong> into a superclass</li>
</ul>
<p><strong>Cons:</strong></p>
<ul>
<li>Some clients may be <strong>limited by the provided skeleton</strong> of an algorithm</li>
<li>You might violate the <strong>Liskov Substitution Principle</strong> by suppressing a default step implementation via a subclass</li>
<li>Template methods tend to be <strong>harder to maintain</strong> the more steps they have</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="template-method-relations-with-other-patterns">Template Method: Relations with Other Patterns</h2>
<ul>
<li><strong>Factory Method</strong> is a specialization of Template Method. At the same time, a Factory Method may serve as a step in a large Template Method.</li>
<li><strong>Template Method vs. Strategy:</strong> Template Method is based on <strong>inheritance</strong>: it lets you alter parts of an algorithm by extending those parts in subclasses. Strategy is based on <strong>composition</strong>: you can alter parts of the object's behavior by supplying it with different strategies. Template Method works at the class level, so it is static. Strategy works on the object level, letting you switch behaviors at runtime.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="222" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-j-takeaway">Module J: Takeaway</h2>
<p>The <strong>Template Method</strong> pattern defines the skeleton of an algorithm in an operation, deferring some steps to subclasses. It lets subclasses redefine certain steps of an algorithm without changing its structure, promoting code reuse through inheritance.</p>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="visitor-intent">Visitor: Intent</h2>
<p><strong>Visitor</strong> is a behavioral design pattern that lets you separate algorithms from the objects on which they operate.</p>
<p>Source: <a href="https://refactoring.guru/design-patterns/visitor">refactoring.guru</a></p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="226" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="226" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="visitor-problem">Visitor: Problem</h2>
<p>Imagine that your team develops an app which works with geographic information structured as one colossal graph. Each node of the graph may represent a complex entity such as a city, an industry area, a sightseeing location, etc.</p>
<p>At some point, you got a task to implement <strong>exporting the graph into XML format</strong>. The job seemed pretty straightforward. You planned to add an export method to each node class.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="227" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="227" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="visitor-problem-cont">Visitor: Problem (cont.)</h2>
<p>But the system architect refused to let you alter existing node classes. He said that the code was already in production and he did not want to risk breaking it because of a potential bug in your changes.</p>
<p>Besides, he questioned whether it makes sense to have the <strong>XML export code inside the node classes</strong>. The primary job of these classes was to work with geodata. The XML export behavior would look alien there.</p>
<p>There was another reason for the refusal. It was highly likely that after this feature was implemented, someone from marketing would ask you to provide the ability to export into a <strong>different format</strong>, or request some other weird thing, leading to constant changes in these precious node classes.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="228" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="228" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="visitor-solution">Visitor: Solution</h2>
<p>The Visitor pattern suggests that you place the new behavior into a separate class called <strong>visitor</strong>, instead of trying to integrate it into existing classes. The original object that had to perform the behavior is now passed to one of the visitor's methods as an argument, providing the method access to all necessary data contained within the object.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="229" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="229" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="visitor-solution-cont">Visitor: Solution (cont.)</h2>
<p>Now, the behavior can be executed over objects of different classes. The visitor class may define a set of methods, each taking arguments of different types:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>visitor.visit(city)
visitor.visit(industry)
visitor.visit(sightseeing)
</code></pre>
<p>But how exactly would we call these methods, especially when dealing with the whole graph? These methods have <strong>different signatures</strong>, so we cannot use polymorphism directly.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="230" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="230" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="visitor-solution----double-dispatch">Visitor: Solution -- Double Dispatch</h2>
<p>The Visitor pattern uses a technique called <strong>Double Dispatch</strong>. Instead of letting the client select a proper version of the method to call, we delegate this choice to objects we are passing to the visitor as an argument:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Each element &quot;accepts&quot; the visitor</span>
<span class="hljs-comment">// and calls the appropriate visitor method</span>
foreach (Node node : graph)
    node.accept(exportVisitor)

<span class="hljs-comment">// Inside each concrete element:</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">City</span> {
    <span class="hljs-keyword">void</span> <span class="hljs-title function_">accept</span><span class="hljs-params">(Visitor v)</span> {
        v.visitCity(<span class="hljs-built_in">this</span>);
    }
}
</code></pre>
<p>Since the object knows its own class, it can pick the proper method on the visitor itself.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="231" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

}
" data-lang="en-US" lang="en-US" data-marpit-pagination="231" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {

  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="visitor-real-world-analogy">Visitor: Real-World Analogy</h2>
<p>Imagine a seasoned <strong>insurance agent</strong> who is eager to get new customers. He can visit every building in a neighborhood, trying to sell insurance to everyone he meets:</p>
<ul>
<li>To a <strong>residential building</strong>, he sells medical insurance</li>
<li>To a <strong>bank</strong>, he sells theft insurance</li>
<li>To a <strong>coffee shop</strong>, he sells fire and flood insurance</li>
</ul>
<p>The agent represents the visitor, and the buildings represent the elements. The agent tailors his pitch (algorithm) based on the type of building (element) he visits.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="232" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="232" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="visitor-structure">Visitor: Structure</h2>
<p>The structure consists of the following participants:</p>
<ol>
<li>
<p><strong>Visitor Interface</strong>: Declares a set of visiting methods that can take concrete elements of an object structure as arguments. These methods may have the same names if the language supports overloading, but the type of their parameters must be different.</p>
</li>
<li>
<p><strong>Concrete Visitors</strong>: Implement several versions of the same behaviors, tailored for different concrete element classes.</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="233" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="233" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="visitor-structure-cont">Visitor: Structure (cont.)</h2>
<ol start="3">
<li>
<p><strong>Element Interface</strong>: Declares a method for &quot;accepting&quot; visitors. This method should have one parameter declared with the type of the visitor interface.</p>
</li>
<li>
<p><strong>Concrete Elements</strong>: Must implement the acceptance method. The purpose of this method is to redirect the call to the proper visitor's method corresponding to the current element class.</p>
</li>
<li>
<p><strong>Client</strong>: Usually represents a collection or some other complex object. The client creates visitor objects and passes them to elements via the <code>accept</code> method.</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="234" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;

<header>CEN206 Object-Oriented Programming</header>
<h2 id="visitor-applicability">Visitor: Applicability</h2>
<p>Use the Visitor pattern when:</p>
<ul>
<li>You need to perform an operation on all elements of a <strong>complex object structure</strong> (for example, an object tree) that have <strong>different classes</strong>.</li>
<li>You want to <strong>clean up the business logic</strong> of auxiliary behaviors. The pattern lets you make the primary classes of your app more focused on their main jobs by extracting all other behaviors into a set of visitor classes.</li>
<li>A behavior makes sense only in some classes of a class hierarchy, <strong>but not in others</strong>. You can extract this behavior into a separate visitor class and implement only those visiting methods that accept objects of relevant classes, leaving the rest empty.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="visitor-how-to-implement">Visitor: How to Implement</h2>
<ol>
<li>Declare the <strong>visitor interface</strong> with a set of &quot;visiting&quot; methods, one per each concrete element class that exists in the program.</li>
<li>Declare the <strong>element interface</strong>. If you are working with an existing element class hierarchy, add the abstract &quot;acceptance&quot; method to the base class of the hierarchy.</li>
<li>Implement the <strong>acceptance methods</strong> in all concrete element classes. These methods must simply redirect the call to a visiting method on the incoming visitor object which matches the class of the current element.</li>
<li>The element classes should only work with visitors via the visitor interface. Visitors, however, must be <strong>aware of all concrete element classes</strong>, referenced as parameter types of the visiting methods.</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="visitor-how-to-implement-cont">Visitor: How to Implement (cont.)</h2>
<ol start="5">
<li>For each behavior that cannot be put inside the element hierarchy, create a <strong>new concrete visitor class</strong> and implement all of the visiting methods.</li>
<li>You might encounter a situation where the visitor needs <strong>access to some private</strong> members of the element class. In this case, you can either make these fields or methods public, violating the element's encapsulation, or nest the visitor class in the element class (if your language supports nested classes).</li>
<li>The <strong>client</strong> must create visitor objects and pass them into elements via &quot;acceptance&quot; methods.</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="visitor-pros-and-cons">Visitor: Pros and Cons</h2>
<p><strong>Pros:</strong></p>
<ul>
<li><strong>Open/Closed Principle:</strong> You can introduce a new behavior that can work with objects of different classes without changing these classes</li>
<li><strong>Single Responsibility Principle:</strong> You can move multiple versions of the same behavior into the same class</li>
<li>A visitor object can <strong>accumulate</strong> some useful information while working with various objects, which is handy when traversing complex structures like object trees</li>
</ul>
<p><strong>Cons:</strong></p>
<ul>
<li>You need to <strong>update all visitors</strong> each time a class gets added to or removed from the element hierarchy</li>
<li>Visitors might lack the necessary <strong>access to the private fields</strong> and methods of the elements that they are supposed to work with</li>
<li>The pattern <strong>increases complexity</strong> of the codebase</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="visitor-relations-with-other-patterns">Visitor: Relations with Other Patterns</h2>
<ul>
<li>You can treat <strong>Visitor</strong> as a powerful version of the <strong>Command</strong> pattern. Its objects can execute operations over various objects of different classes.</li>
<li>You can use <strong>Visitor</strong> to execute an operation over an entire <strong>Composite</strong> tree.</li>
<li>You can use <strong>Visitor</strong> along with <strong>Iterator</strong> to traverse a complex data structure and execute some operation over its elements even if they all have different classes.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="visitor-double-dispatch-explained">Visitor: Double Dispatch Explained</h2>
<p>The Visitor pattern solves the <strong>double dispatch</strong> problem:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Without Visitor - type checking needed:</span>
<span class="hljs-keyword">for</span> (Shape s : shapes) {
    <span class="hljs-keyword">if</span> (s <span class="hljs-keyword">instanceof</span> Dot)
        exportDot((Dot) s);
    <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (s <span class="hljs-keyword">instanceof</span> Circle)
        exportCircle((Circle) s);
    <span class="hljs-comment">// ... fragile, violates OCP</span>
}

<span class="hljs-comment">// With Visitor - double dispatch:</span>
<span class="hljs-keyword">for</span> (Shape s : shapes) {
    s.accept(visitor);
    <span class="hljs-comment">// 1st dispatch: s.accept() resolves</span>
    <span class="hljs-comment">//   to the correct accept() based on s type</span>
    <span class="hljs-comment">// 2nd dispatch: accept() calls correct</span>
    <span class="hljs-comment">//   visit*() based on visitor type</span>
}
</code></pre>
<p>The element knows its own class, so it picks the proper method on the visitor. No type checking needed.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>

<h2 id="module-k-takeaway">Module K: Takeaway</h2>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="sender-receiver-connection-patterns">Sender-Receiver Connection Patterns</h2>
<p>Four behavioral patterns address connecting senders of requests with their receivers:</p>
<table>
<thead>
<tr>
<th>Pattern</th>
<th>Connection Style</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Chain of Responsibility</strong></td>
<td>Sequential along dynamic chain</td>
</tr>
<tr>
<td><strong>Command</strong></td>
<td>Unidirectional sender-to-receiver</td>
</tr>
<tr>
<td><strong>Mediator</strong></td>
<td>Indirect via central object</td>
</tr>
<tr>
<td><strong>Observer</strong></td>
<td>Dynamic subscription-based</td>
</tr>
</tbody>
</table>
<p>Each gives senders and receivers different trade-offs in terms of coupling and flexibility.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>

<td></td>

<h2 id="pattern-combinations">Pattern Combinations</h2>
<p>Common pattern combinations in practice:</p>
<ul>
<li><strong>Command + Memento</strong> = Undo/redo support</li>
<li><strong>Iterator + Visitor</strong> = Traverse and process complex structures</li>
<li><strong>Iterator + Memento</strong> = Checkpointed iteration</li>
<li><strong>Observer + Mediator</strong> = Central event coordination</li>
<li><strong>Composite + Iterator + Visitor</strong> = Tree traversal with operations</li>
<li><strong>Strategy + Factory Method</strong> = Runtime algorithm selection</li>
</ul>
