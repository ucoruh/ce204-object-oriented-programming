<header>CEN206 Object-Oriented Programming</header>
<h2 id="what-are-behavioral-design-patterns">What Are Behavioral Design Patterns?</h2>
<p>Behavioral design patterns are concerned with <strong>algorithms</strong> and the <strong>assignment of responsibilities</strong> between objects.</p>
<p>They describe not just patterns of objects or classes but also the <strong>patterns of communication</strong> between them. These patterns characterize complex control flow that is difficult to follow at run-time.</p>
<p>They shift your focus away from flow of control to let you concentrate on the way objects are interconnected.</p>
<p>Source: <a href="https://refactoring.guru/design-patterns/behavioral-patterns">refactoring.guru</a></p>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="why-are-behavioral-patterns-important">Why Are Behavioral Patterns Important?</h2>
<ul>
<li>They help manage <strong>complex control flows</strong> in object-oriented systems</li>
<li>They define clear <strong>communication protocols</strong> between objects</li>
<li>They promote <strong>loose coupling</strong> between collaborating objects</li>
<li>They make it easier to <strong>add new behaviors</strong> without modifying existing code</li>
<li>They encapsulate <strong>varying behavior</strong> behind stable interfaces</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="the-10-behavioral-design-patterns">The 10 Behavioral Design Patterns</h2>
<table>
<thead>
<tr>
<th>Pattern</th>
<th>Purpose</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Chain of Responsibility</strong></td>
<td>Pass requests along a chain of handlers</td>
</tr>
<tr>
<td><strong>Command</strong></td>
<td>Turn requests into stand-alone objects</td>
</tr>
<tr>
<td><strong>Iterator</strong></td>
<td>Traverse collections without exposing internals</td>
</tr>
<tr>
<td><strong>Mediator</strong></td>
<td>Reduce chaotic dependencies between objects</td>
</tr>
<tr>
<td><strong>Memento</strong></td>
<td>Save and restore previous states</td>
</tr>
</tbody>
</table>

<h2 id="the-10-behavioral-design-patterns-cont">The 10 Behavioral Design Patterns (cont.)</h2>

<tr>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="classification-of-behavioral-patterns">Classification of Behavioral Patterns</h2>
<p><strong>Class-based patterns</strong> use inheritance to distribute behavior:</p>
<ul>
<li>Template Method</li>
</ul>
<p><strong>Object-based patterns</strong> use object composition:</p>
<ul>
<li>Chain of Responsibility, Command, Iterator, Mediator, Memento, Observer, State, Strategy, Visitor</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="relationships-between-behavioral-patterns">Relationships Between Behavioral Patterns</h2>
<ul>
<li><strong>Chain of Responsibility, Command, Mediator, Observer</strong> all address different ways of connecting senders and receivers of requests</li>
<li><strong>Command and Memento</strong> often work together for undo functionality</li>
<li><strong>Iterator and Visitor</strong> combine for traversing complex structures</li>
<li><strong>State and Strategy</strong> share similar structure but differ in intent</li>
<li><strong>Template Method and Strategy</strong> represent class vs. object alternatives</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="chain-of-responsibility-intent">Chain of Responsibility: Intent</h2>
<p><strong>Chain of Responsibility</strong> is a behavioral design pattern that lets you pass requests along a chain of handlers. Upon receiving a request, each handler decides either to process the request or to pass it to the next handler in the chain.</p>
<p>Also known as: <strong>CoR</strong>, <strong>Chain of Command</strong></p>
<p>Source: <a href="https://refactoring.guru/design-patterns/chain-of-responsibility">refactoring.guru</a></p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="chain-of-responsibility-problem">Chain of Responsibility: Problem</h2>
<p>Imagine you are working on an online ordering system. You want to restrict access so only authenticated users can create orders. Also, users with admin permissions should have full access to all orders.</p>
<p>After some planning, you realize these checks must be performed sequentially:</p>
<ol>
<li><strong>Authentication</strong> -- Is the user logged in?</li>
<li><strong>Authorization</strong> -- Does the user have permissions?</li>
<li><strong>Validation</strong> -- Is the data valid?</li>
<li><strong>Caching</strong> -- Is the result already cached?</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="chain-of-responsibility-problem-cont">Chain of Responsibility: Problem (cont.)</h2>
<p>Over time, you add more sequential checks:</p>
<ul>
<li><strong>Rate limiting</strong> to prevent brute-force password attacks</li>
<li><strong>Sanitization</strong> to filter raw data in requests</li>
<li><strong>Cross-site scripting</strong> protection</li>
</ul>
<p>The code of the checks, which had been already looking like a mess, became more and more bloated as you added each new feature. Changing one check sometimes affected the others. Reusing checks in other components required code duplication.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

" data-lang="en-US" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {

;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="chain-of-responsibility-solution">Chain of Responsibility: Solution</h2>
<p>The Chain of Responsibility pattern suggests that you link handlers into a chain. Each handler has a field for storing a reference to the next handler. In addition to processing a request, handlers pass the request further along the chain.</p>
<p>The request travels along the chain until all handlers have had a chance to process it. A handler can decide <strong>not to pass</strong> the request further down the chain, effectively stopping any further processing.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

<header>CEN206 Object-Oriented Programming</header>
<h2 id="chain-of-responsibility-solution-cont">Chain of Responsibility: Solution (cont.)</h2>
<p>There is a slightly different approach where, upon receiving a request, a handler decides whether it <strong>can</strong> process it. If it can, it does not pass the request any further. So it is either only one handler that processes the request or none at all.</p>
<p>This approach is very common when dealing with events in stacks of elements within a graphical user interface. For example, when a user clicks a button, the event propagates through the chain of GUI elements, starting from the button, going along its containers, and ending with the application window.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

<header>CEN206 Object-Oriented Programming</header>
<h2 id="chain-of-responsibility-real-world-analogy">Chain of Responsibility: Real-World Analogy</h2>
<p>You have just bought and installed a new piece of hardware on your computer. You call tech support:</p>
<ol>
<li>The <strong>automated system</strong> suggests several standard solutions -- none work for you.</li>
<li>A <strong>human operator</strong> tries scripted troubleshooting steps -- still not resolved.</li>
<li>The operator <strong>escalates</strong> your call to an <strong>engineer</strong> who finally fixes the problem.</li>
</ol>
<p>Each tier either resolves the issue or escalates it to the next, more capable, tier.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="chain-of-responsibility-structure">Chain of Responsibility: Structure</h2>
<p>The structure consists of the following participants:</p>
<ol>
<li>
<p><strong>Handler</strong> (interface): Declares the interface for handling requests. It usually contains a single method for handling requests, and sometimes another for setting the next handler.</p>
</li>
<li>
<p><strong>Base Handler</strong> (abstract class): Optional class where you can put boilerplate code common to all handlers. Usually stores a reference to the next handler and implements default chaining behavior.</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>

}
" data-lang="en-US" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {

;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="chain-of-responsibility-structure-cont">Chain of Responsibility: Structure (cont.)</h2>
<ol start="3">
<li>
<p><strong>Concrete Handlers</strong>: Contain the actual code for processing requests. Upon receiving a request, each handler must decide whether to process it and whether to pass it along the chain. Handlers are usually self-contained and immutable, accepting all necessary data via the constructor.</p>
</li>
<li>
<p><strong>Client</strong>: May compose chains just once or compose them dynamically. A request can be sent to any handler in the chain -- it does not have to be the first one.</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>

<h2 id="chain-of-responsibility-java-pseudocode-cont">Chain of Responsibility: Java Pseudocode (cont.)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Base handler with default chaining behavior</span>
<span class="hljs-keyword">abstract</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">BaseHandler</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">Handler</span> {
    <span class="hljs-keyword">private</span> Handler nextHandler;

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> Handler <span class="hljs-title function_">setNext</span><span class="hljs-params">(Handler handler)</span> {
        <span class="hljs-built_in">this</span>.nextHandler = handler;
        <span class="hljs-comment">// Returning handler allows chaining:</span>
        <span class="hljs-comment">// monkey.setNext(squirrel).setNext(dog);</span>
        <span class="hljs-keyword">return</span> handler;
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> String <span class="hljs-title function_">handle</span><span class="hljs-params">(String request)</span> {
        <span class="hljs-keyword">if</span> (<span class="hljs-built_in">this</span>.nextHandler != <span class="hljs-literal">null</span>) {
            <span class="hljs-keyword">return</span> <span class="hljs-built_in">this</span>.nextHandler.handle(request);
        }
        <span class="hljs-keyword">return</span> <span class="hljs-literal">null</span>;
    }
}
</code></pre>

<h2 id="chain-of-responsibility-java-pseudocode-cont-1">Chain of Responsibility: Java Pseudocode (cont.)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.util.List;

<span class="hljs-comment">// Concrete handler: Authentication</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">AuthenticationHandler</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">BaseHandler</span> {
    <span class="hljs-keyword">private</span> List&lt;String&gt; authenticatedUsers;

    <span class="hljs-keyword">public</span> <span class="hljs-title function_">AuthenticationHandler</span><span class="hljs-params">(List&lt;String&gt; users)</span> {
        <span class="hljs-built_in">this</span>.authenticatedUsers = users;
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> String <span class="hljs-title function_">handle</span><span class="hljs-params">(String request)</span> {
        <span class="hljs-keyword">if</span> (!authenticatedUsers.contains(request)) {
            <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;AuthenticationHandler: &quot;</span>
                + request + <span class="hljs-string">&quot; is NOT authenticated.&quot;</span>;
        }
        System.out.println(<span class="hljs-string">&quot;AuthenticationHandler: &quot;</span>
            + request + <span class="hljs-string">&quot; is authenticated.&quot;</span>);
        <span class="hljs-keyword">return</span> <span class="hljs-built_in">super</span>.handle(request);
    }
}
</code></pre>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="chain-of-responsibility-java-pseudocode-cont-4">Chain of Responsibility: Java Pseudocode (cont.)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.util.Arrays;
<span class="hljs-keyword">import</span> java.util.List;

<span class="hljs-comment">// Client code</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ChainOfResponsibilityDemo</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
        <span class="hljs-comment">// Build the chain</span>
        <span class="hljs-type">Handler</span> <span class="hljs-variable">auth</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">AuthenticationHandler</span>(
            Arrays.asList(<span class="hljs-string">&quot;alice&quot;</span>, <span class="hljs-string">&quot;bob&quot;</span>, <span class="hljs-string">&quot;charlie&quot;</span>));
        <span class="hljs-type">Handler</span> <span class="hljs-variable">authz</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">AuthorizationHandler</span>(
            Arrays.asList(<span class="hljs-string">&quot;alice&quot;</span>, <span class="hljs-string">&quot;charlie&quot;</span>));
        <span class="hljs-type">Handler</span> <span class="hljs-variable">validation</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">ValidationHandler</span>();

        auth.setNext(authz).setNext(validation);

        <span class="hljs-comment">// Send requests through the chain</span>
        <span class="hljs-keyword">for</span> (String user : Arrays.asList(
                <span class="hljs-string">&quot;alice&quot;</span>, <span class="hljs-string">&quot;bob&quot;</span>, <span class="hljs-string">&quot;dave&quot;</span>)) {
            <span class="hljs-type">String</span> <span class="hljs-variable">result</span> <span class="hljs-operator">=</span> auth.handle(user);
            <span class="hljs-keyword">if</span> (result != <span class="hljs-literal">null</span>) {
                System.out.println(result);
            } <span class="hljs-keyword">else</span> {
                System.out.println(user
                    + <span class="hljs-string">&quot;: Request passed all checks.&quot;</span>);
            }
        }

        <span class="hljs-comment">// Expected Output:</span>
        <span class="hljs-comment">// AuthenticationHandler: alice is authenticated.</span>
        <span class="hljs-comment">// AuthorizationHandler: alice is authorized.</span>
        <span class="hljs-comment">// ValidationHandler: alice is valid.</span>
        <span class="hljs-comment">// alice: Request passed all checks.</span>
        <span class="hljs-comment">// AuthenticationHandler: bob is authenticated.</span>
        <span class="hljs-comment">// AuthorizationHandler: bob is NOT authorized.</span>
        <span class="hljs-comment">// AuthenticationHandler: dave is NOT authenticated.</span>
    }
}
</code></pre>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="chain-of-responsibility-applicability">Chain of Responsibility: Applicability</h2>
<p>Use the Chain of Responsibility pattern when:</p>
<ul>
<li>
<p>Your program is expected to process different kinds of requests in various ways, but the <strong>exact types of requests</strong> and their sequences are <strong>unknown beforehand</strong>.</p>
</li>
<li>
<p>It is essential to <strong>execute several handlers</strong> in a particular order.</p>
</li>
<li>
<p>The set of handlers and their order are supposed to <strong>change at runtime</strong>. If you provide setters for a reference field inside handler classes, you will be able to insert, remove, or reorder handlers dynamically.</p>
</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="chain-of-responsibility-how-to-implement">Chain of Responsibility: How to Implement</h2>
<ol>
<li>Declare the handler interface and describe the signature of a method for handling requests.</li>
<li>To eliminate duplicate boilerplate code in concrete handlers, create an <strong>abstract base handler</strong> class derived from the handler interface. Add a field for storing a reference to the next handler and implement default forwarding behavior.</li>
<li>Create <strong>concrete handler</strong> subclasses and implement their handling methods. Each handler must make two decisions:
<ul>
<li>Whether it will process the request</li>
<li>Whether it will pass the request along the chain</li>
</ul>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="chain-of-responsibility-how-to-implement-cont">Chain of Responsibility: How to Implement (cont.)</h2>
<ol start="4">
<li>The <strong>client</strong> may either assemble chains on its own or receive pre-built chains from other objects. In the latter case, you must implement some factory classes to build chains according to configuration or environment settings.</li>
<li>The client may trigger any handler in the chain, not just the first one. The request will be passed along the chain until some handler refuses to pass it further or until it reaches the end.</li>
<li>Due to the dynamic nature of the chain, the client should be ready to handle these scenarios:
<ul>
<li>The chain may consist of a <strong>single link</strong></li>
<li>Some requests may <strong>not reach the end</strong> of the chain</li>
<li>Others may reach the end of the chain <strong>unhandled</strong></li>
</ul>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="chain-of-responsibility-pros-and-cons">Chain of Responsibility: Pros and Cons</h2>
<p><strong>Pros:</strong></p>
<ul>
<li>You can <strong>control the order</strong> of request handling</li>
<li><strong>Single Responsibility Principle:</strong> You can decouple classes that invoke operations from classes that perform operations</li>
<li><strong>Open/Closed Principle:</strong> You can introduce new handlers into the app without breaking the existing client code</li>
</ul>
<p><strong>Cons:</strong></p>
<ul>
<li>Some requests may end up <strong>unhandled</strong> if no handler processes them</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="chain-of-responsibility-relations-with-other-patterns">Chain of Responsibility: Relations with Other Patterns</h2>
<ul>
<li><strong>Chain of Responsibility, Command, Mediator, and Observer</strong> are alternative ways to connect senders and receivers. CoR passes a request sequentially along a dynamic chain.</li>
<li><strong>CoR and Composite:</strong> Leaf components can pass requests through the chain of all parent components down to the root of the object tree.</li>
<li><strong>CoR and Decorator:</strong> They are very similar in structure. Both rely on recursive composition to pass execution through a series of objects. However, CoR handlers can execute arbitrary operations independently of each other and can stop passing the request at any point. Decorators extend behavior while keeping the base interface consistent.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="module-b-takeaway">Module B: Takeaway</h2>
<p>The <strong>Chain of Responsibility</strong> pattern decouples senders from receivers by giving multiple objects a chance to handle a request. The request is passed along a chain until an object handles it or the chain ends.</p>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="command-intent">Command: Intent</h2>
<p><strong>Command</strong> is a behavioral design pattern that turns a request into a stand-alone object that contains all information about the request. This transformation lets you pass requests as method arguments, delay or queue a request's execution, and support undoable operations.</p>
<p>Also known as: <strong>Action</strong>, <strong>Transaction</strong></p>
<p>Source: <a href="https://refactoring.guru/design-patterns/command">refactoring.guru</a></p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="command-problem">Command: Problem</h2>
<p>Imagine you are working on a new text editor app. Your current task is to create a toolbar with a bunch of buttons for various operations. You created a <code>Button</code> class that can be used for buttons on the toolbar, as well as for generic buttons in dialogs.</p>
<p>While all of these buttons look similar, they are supposed to do different things. Where would you put the code for the various click handlers of these buttons?</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="command-problem-cont">Command: Problem (cont.)</h2>
<p>The simplest solution is to create tons of subclasses for each place where the button is used. These subclasses would contain the code to execute on a button click.</p>
<p>Problems with this approach:</p>
<ul>
<li>You have an <strong>enormous number of subclasses</strong> that break any time you modify the base <code>Button</code> class</li>
<li>GUI code becomes <strong>dependent</strong> on volatile business logic code</li>
<li>Some operations (e.g., Copy/Paste) need to be invoked from <strong>multiple places</strong> (buttons, menus, keyboard shortcuts), leading to <strong>code duplication</strong></li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="command-solution">Command: Solution</h2>
<p>Good software design is often based on the <strong>principle of separation of concerns</strong>. The Command pattern suggests that GUI objects should not send requests directly. Instead, you extract all of the request details into a separate <strong>command</strong> class with a single method that triggers this request.</p>
<p>Command objects serve as links between various GUI and business logic objects. The GUI object does not need to know what business logic object will receive the request and how it will be processed.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="command-solution-cont">Command: Solution (cont.)</h2>
<p>The next step is to make your commands implement the <strong>same interface</strong>. Usually it has just a single execution method that takes no parameters. This interface lets you use various commands with the same request sender, without coupling it to concrete classes.</p>
<p>As a bonus, you can now switch command objects linked to the sender, effectively changing the sender's behavior at runtime.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="command-real-world-analogy">Command: Real-World Analogy</h2>
<p>After a long walk through the city, you get to a nice restaurant and sit at the table by the window. A friendly waiter approaches you and quickly takes your <strong>order</strong>, writing it down on a piece of paper.</p>
<p>The waiter goes to the kitchen and sticks the order on the wall. After a while, the order gets to the <strong>chef</strong>, who reads it and cooks the meal accordingly.</p>
<p>The cook places the meal on a tray along with the order. The waiter discovers the tray, checks the order to make sure everything is as you wanted it, and brings everything to your table.</p>
<p>The paper order serves as a <strong>command</strong> -- it remains in a queue until the chef is ready.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

" data-lang="en-US" lang="en-US" data-marpit-pagination="45" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {

;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="command-structure">Command: Structure</h2>
<p>The Command pattern has five key participants:</p>
<ol>
<li>
<p><strong>Sender (Invoker)</strong>: Responsible for initiating requests. Has a field for storing a reference to a command object. Triggers that command instead of sending the request directly to the receiver.</p>
</li>
<li>
<p><strong>Command Interface</strong>: Usually declares just a single method for executing the command.</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="command-structure-cont">Command: Structure (cont.)</h2>
<ol start="3">
<li>
<p><strong>Concrete Commands</strong>: Implement various kinds of requests. A concrete command is not supposed to perform the work on its own, but rather to pass the call to one of the business logic objects (receiver). Parameters needed to execute a method on a receiver object can be declared as fields in the concrete command.</p>
</li>
<li>
<p><strong>Receiver</strong>: Contains some business logic. Almost any object may act as a receiver. Most commands only handle the details of how a request is passed to the receiver.</p>
</li>
<li>
<p><strong>Client</strong>: Creates and configures concrete command objects. The client must pass all request parameters, including a receiver instance, into the command constructor.</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Receiver: the actual text editor</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Editor</span> {

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.util.Stack;

        <span class="hljs-keyword">return</span> history.pop();

    <span class="hljs-keyword">public</span> <span class="hljs-type">boolean</span> <span class="hljs-title function_">isEmpty</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> history.isEmpty();

}

<h2 id="command-java-pseudocode-cont-6">Command: Java Pseudocode (cont.)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Invoker: Application</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Application</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-type">Editor</span> <span class="hljs-variable">editor</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Editor</span>();
    <span class="hljs-keyword">private</span> <span class="hljs-type">CommandHistory</span> <span class="hljs-variable">history</span>
        <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">CommandHistory</span>();

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">executeCommand</span><span class="hljs-params">(
            AbstractCommand cmd)</span> {
        <span class="hljs-keyword">if</span> (cmd.execute()) {
            <span class="hljs-comment">// Only save commands that modify state</span>
            history.push(cmd);
        }
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">undo</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">if</span> (!history.isEmpty()) {
            <span class="hljs-type">AbstractCommand</span> <span class="hljs-variable">cmd</span> <span class="hljs-operator">=</span> history.pop();
            cmd.undo();
        }
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
        <span class="hljs-type">Application</span> <span class="hljs-variable">app</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Application</span>();
        app.editor.setText(<span class="hljs-string">&quot;Hello, World!&quot;</span>);
        app.editor.setCursorPosition(<span class="hljs-number">5</span>);

        <span class="hljs-comment">// Execute cut (modifies state -&gt; saved)</span>
        app.executeCommand(
            <span class="hljs-keyword">new</span> <span class="hljs-title class_">CutCommand</span>(app.editor));
        System.out.println(<span class="hljs-string">&quot;After cut: &quot;</span>
            + app.editor.getText());

        <span class="hljs-comment">// Undo</span>
        app.undo();
        System.out.println(<span class="hljs-string">&quot;After undo: &quot;</span>
            + app.editor.getText());

        <span class="hljs-comment">// Expected Output:</span>
        <span class="hljs-comment">// After cut: Hello</span>
        <span class="hljs-comment">// After undo: Hello, World!</span>
    }
}
</code></pre>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="command-applicability">Command: Applicability</h2>
<p>Use the Command pattern when you want to:</p>
<ul>
<li>
<p><strong>Parameterize objects with operations.</strong> The Command pattern can turn a specific method call into a stand-alone object. You can pass commands as method arguments, store them inside other objects, switch linked commands at runtime, etc.</p>
</li>
<li>
<p><strong>Queue operations, schedule their execution, or execute them remotely.</strong> You can serialize commands, send them over the network, and execute them on a different machine.</p>
</li>
<li>
<p><strong>Implement reversible operations.</strong> The most common use. To implement undo, you need to maintain a history of commands with the ability to restore the previous state.</p>
</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="command-how-to-implement">Command: How to Implement</h2>
<ol>
<li>Declare the <strong>command interface</strong> with a single execution method.</li>
<li>Start extracting requests into <strong>concrete command classes</strong> that implement the command interface. Each class must have fields for storing the request arguments and a reference to the receiver object.</li>
<li>Identify classes that will act as <strong>senders</strong> (invokers). Add fields for storing commands. Senders should communicate with commands only via the command interface.</li>
<li>Change the senders so they <strong>execute the command</strong> instead of sending a request directly to the receiver.</li>
<li>The <strong>client</strong> should initialize objects in the following order: receivers, commands (with receiver references), senders (with command references).</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="command-pros-and-cons">Command: Pros and Cons</h2>
<p><strong>Pros:</strong></p>
<ul>
<li><strong>Single Responsibility Principle:</strong> Decouples classes that invoke operations from classes that perform them</li>
<li><strong>Open/Closed Principle:</strong> New commands can be introduced without modifying existing client code</li>
<li>Implement <strong>undo/redo</strong> functionality</li>
<li>Implement <strong>deferred execution</strong> of operations</li>
<li>Assemble a set of simple commands into a <strong>complex</strong> one (macro commands)</li>
</ul>
<p><strong>Cons:</strong></p>
<ul>
<li>The code may become <strong>more complicated</strong> since you are introducing a whole new layer between senders and receivers</li>
</ul>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="command-relations-with-other-patterns">Command: Relations with Other Patterns</h2>
<ul>
<li><strong>Chain of Responsibility, Command, Mediator, Observer</strong> handle sender-receiver connections differently. Command establishes unidirectional connections.</li>
<li><strong>Command + Memento:</strong> Use Memento to save command state before execution for undo support.</li>
<li><strong>Command vs. Strategy:</strong> Both parameterize objects, but Command converts operations to objects (for deferred execution, queueing, history), while Strategy describes different ways of doing the same thing.</li>
<li><strong>Prototype</strong> helps when you need to save copies of commands into history.</li>
<li><strong>Visitor</strong> can be treated as a powerful version of Command, capable of executing operations on objects of different classes.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>

<h2 id="module-c-takeaway">Module C: Takeaway</h2>
<p>The <strong>Command</strong> pattern encapsulates a request as an object, allowing you to parameterize clients, queue requests, log them, and support undoable operations. It decouples the object that invokes the operation from the one that performs it.</p>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="iterator-intent">Iterator: Intent</h2>
<p><strong>Iterator</strong> is a behavioral design pattern that lets you traverse elements of a collection without exposing its underlying representation (list, stack, tree, etc.).</p>
<p>Source: <a href="https://refactoring.guru/design-patterns/iterator">refactoring.guru</a></p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="65" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {

;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="iterator-problem">Iterator: Problem</h2>
<p>Collections are one of the most used data types in programming. A collection is just a container for a group of objects.</p>
<p>Most collections store their elements in simple lists. However, some of them are based on stacks, trees, graphs, and other complex data structures.</p>
<p>No matter how a collection is structured, it must provide some way of <strong>accessing its elements</strong> so that other code can use these elements. There should be a way to go through each element without accessing the same elements over and over.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="66" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {

  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="iterator-problem-cont">Iterator: Problem (cont.)</h2>
<p>This may sound like an easy job if your collection is based on a list. You just loop over all of the elements. But how do you <strong>sequentially traverse</strong> elements of a complex data structure, such as a tree?</p>
<p>For example, one day you might need <strong>depth-first</strong> traversal of a tree. The next day you might need <strong>breadth-first</strong>. And the following week, you might need <strong>random access</strong>.</p>
<p>Adding more and more traversal algorithms to the collection gradually <strong>blurs its primary responsibility</strong>: efficient data storage.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

" data-lang="en-US" lang="en-US" data-marpit-pagination="67" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {

<header>CEN206 Object-Oriented Programming</header>
<h2 id="iterator-solution">Iterator: Solution</h2>
<p>The main idea of the Iterator pattern is to extract the traversal behavior of a collection into a separate object called an <strong>iterator</strong>.</p>
<p>In addition to implementing the algorithm itself, an iterator object encapsulates all of the traversal details, such as the current position and how many elements are left till the end.</p>
<p>Several iterators can go through the <strong>same collection</strong> at the same time, independently of each other.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="68" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="iterator-solution-cont">Iterator: Solution (cont.)</h2>
<p>Usually, iterators provide one primary method for fetching elements of the collection. The client can keep running this method until it returns nothing, which means the iterator has traversed all of the elements.</p>
<p>All iterators must implement the <strong>same interface</strong>. This makes the client code compatible with any collection type or any traversal algorithm as long as there is a proper iterator.</p>
<p>If you need a special way to traverse a collection, you just create a <strong>new iterator class</strong>, without having to change the collection or the client.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

<header>CEN206 Object-Oriented Programming</header>
<h2 id="iterator-real-world-analogy">Iterator: Real-World Analogy</h2>
<p>You plan to visit Rome for a few days and visit all of its sights and attractions. But once there, you could waste a lot of time walking in circles, unable to find even the Colosseum.</p>
<p>On the other hand, you could buy a <strong>virtual guide app</strong> for your smartphone and use it for navigation. Or you could hire a <strong>local guide</strong> who knows the city.</p>
<p>All three options -- random walk, smartphone navigator, and human guide -- act as <strong>iterators</strong> over the vast collection of sights and attractions in Rome.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="iterator-structure">Iterator: Structure</h2>
<p>The structure consists of the following participants:</p>
<ol>
<li>
<p><strong>Iterator Interface</strong>: Declares the operations required for traversing a collection: fetching the next element, retrieving the current position, restarting iteration, etc.</p>
</li>
<li>
<p><strong>Concrete Iterators</strong>: Implement specific algorithms for traversing a collection. The iterator object should track the traversal progress on its own. This allows several iterators to traverse the same collection independently.</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>

;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="iterator-structure-cont">Iterator: Structure (cont.)</h2>
<ol start="3">
<li>
<p><strong>Collection Interface (Iterable)</strong>: Declares one or more methods for getting iterators compatible with the collection. The return type should be declared as the iterator interface.</p>
</li>
<li>
<p><strong>Concrete Collections</strong>: Return new instances of a particular concrete iterator class each time the client requests one. The rest of the collection's code should be in the same class.</p>
</li>
<li>
<p><strong>Client</strong>: Works with both collections and iterators via their interfaces, so it is not coupled to concrete classes, allowing the use of various collections and iterators with the same client code.</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="iterator-java-pseudocode-cont-2">Iterator: Java Pseudocode (cont.)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.util.List;

<span class="hljs-comment">// Concrete iterator for Facebook friends</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">FacebookIterator</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">ProfileIterator</span> {
    <span class="hljs-keyword">private</span> Facebook facebook;
    <span class="hljs-keyword">private</span> String profileId;
    <span class="hljs-keyword">private</span> String type;
    <span class="hljs-keyword">private</span> <span class="hljs-type">int</span> <span class="hljs-variable">currentPosition</span> <span class="hljs-operator">=</span> <span class="hljs-number">0</span>;
    <span class="hljs-keyword">private</span> List&lt;Profile&gt; cache;

    <span class="hljs-keyword">public</span> <span class="hljs-title function_">FacebookIterator</span><span class="hljs-params">(Facebook fb,
            String profileId, String type)</span> {
        <span class="hljs-built_in">this</span>.facebook = fb;
        <span class="hljs-built_in">this</span>.profileId = profileId;
        <span class="hljs-built_in">this</span>.type = type;
    }

    <span class="hljs-keyword">private</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">lazyInit</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">if</span> (cache == <span class="hljs-literal">null</span>) {
            cache = facebook.socialGraphRequest(
                profileId, type);
        }
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> <span class="hljs-type">boolean</span> <span class="hljs-title function_">hasNext</span><span class="hljs-params">()</span> {
        lazyInit();
        <span class="hljs-keyword">return</span> currentPosition &lt; cache.size();
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> Profile <span class="hljs-title function_">getNext</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">if</span> (hasNext()) {
            <span class="hljs-keyword">return</span> cache.get(currentPosition++);
        }
        <span class="hljs-keyword">return</span> <span class="hljs-literal">null</span>;
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">reset</span><span class="hljs-params">()</span> { currentPosition = <span class="hljs-number">0</span>; }
}
</code></pre>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.util.*;

<span class="hljs-comment">// Concrete collection</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Facebook</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">SocialNetwork</span> {
    <span class="hljs-keyword">private</span> Map&lt;String, List&lt;Profile&gt;&gt; friendsData
        = <span class="hljs-keyword">new</span> <span class="hljs-title class_">HashMap</span>&lt;&gt;();
    <span class="hljs-keyword">private</span> Map&lt;String, List&lt;Profile&gt;&gt; coworkersData
        = <span class="hljs-keyword">new</span> <span class="hljs-title class_">HashMap</span>&lt;&gt;();

    <span class="hljs-comment">// Simulated social graph request</span>
    <span class="hljs-keyword">public</span> List&lt;Profile&gt; <span class="hljs-title function_">socialGraphRequest</span><span class="hljs-params">(
            String profileId, String type)</span> {
        <span class="hljs-keyword">if</span> (<span class="hljs-string">&quot;friends&quot;</span>.equals(type)) {
            <span class="hljs-keyword">return</span> friendsData.getOrDefault(
                profileId, <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;&gt;());
        }
        <span class="hljs-keyword">return</span> coworkersData.getOrDefault(
            profileId, <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;&gt;());
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">addFriend</span><span class="hljs-params">(String id, Profile p)</span> {
        friendsData.computeIfAbsent(
            id, k -&gt; <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;&gt;()).add(p);
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> ProfileIterator <span class="hljs-title function_">createFriendsIterator</span><span class="hljs-params">(
            String profileId)</span> {
        <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">FacebookIterator</span>(
            <span class="hljs-built_in">this</span>, profileId, <span class="hljs-string">&quot;friends&quot;</span>);
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> ProfileIterator <span class="hljs-title function_">createCoworkersIterator</span><span class="hljs-params">(
            String profileId)</span> {
        <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">FacebookIterator</span>(
            <span class="hljs-built_in">this</span>, profileId, <span class="hljs-string">&quot;coworkers&quot;</span>);
    }
}

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Client code: SocialSpammer</span>

                + profile.toString());

        <span class="hljs-type">SocialSpammer</span> <span class="hljs-variable">spammer</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">SocialSpammer</span>();

<header>CEN206 Object-Oriented Programming</header>
<h2 id="iterator-applicability">Iterator: Applicability</h2>
<p>Use the Iterator pattern when:</p>
<ul>
<li>Your collection has a complex data structure under the hood, but you want to <strong>hide its complexity</strong> from clients (for convenience or security reasons).</li>
<li>You want to <strong>reduce duplication</strong> of traversal code across your app.</li>
<li>You want your code to be able to <strong>traverse different data structures</strong> or when types of these structures are unknown beforehand.</li>
<li>You need to support <strong>multiple simultaneous traversals</strong> over the same collection.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="iterator-how-to-implement">Iterator: How to Implement</h2>
<ol>
<li>Declare the <strong>iterator interface</strong>. At the very least, it must have a method for fetching the next element. But for the sake of convenience, you can add a couple of other methods.</li>
<li>Declare the <strong>collection interface</strong> and describe a method for fetching iterators. The return type should be equal to that of the iterator interface.</li>
<li>Implement <strong>concrete iterator</strong> classes for the collections that you want to be traversable with iterators.</li>
<li>Implement the <strong>collection interface</strong> in your collection classes. The main idea is to provide the client with a shortcut for creating iterators, tailored for a particular collection class.</li>
<li>Go over the <strong>client code</strong> to replace all of the collection traversal code with the use of iterators.</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="iterator-pros-and-cons">Iterator: Pros and Cons</h2>
<p><strong>Pros:</strong></p>
<ul>
<li><strong>Single Responsibility Principle:</strong> You can clean up the client code and the collections by extracting bulky traversal algorithms into separate classes</li>
<li><strong>Open/Closed Principle:</strong> You can implement new types of collections and iterators and pass them to existing code without breaking anything</li>
<li>You can iterate over the <strong>same collection in parallel</strong> because each iterator object contains its own iteration state</li>
<li>For the same reason, you can <strong>delay an iteration</strong> and continue it when needed</li>
</ul>
<p><strong>Cons:</strong></p>
<ul>
<li>Applying the pattern can be <strong>overkill</strong> if your app only works with simple collections</li>
<li>Using an iterator may be <strong>less efficient</strong> than going through elements of some specialized collections directly</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="iterator-relations-with-other-patterns">Iterator: Relations with Other Patterns</h2>
<ul>
<li>You can use <strong>Iterators</strong> to traverse <strong>Composite</strong> trees.</li>
<li>You can use <strong>Factory Method</strong> along with Iterator to let collection subclasses return different types of iterators that are compatible with the collections.</li>
<li>You can use <strong>Memento</strong> along with Iterator to capture the current iteration state and roll it back if necessary.</li>
<li>You can use <strong>Visitor</strong> along with Iterator to traverse a complex data structure and execute some operation over its elements even if they all have different classes.</li>
</ul>

<h2 id="module-d-takeaway">Module D: Takeaway</h2>

<header>CEN206 Object-Oriented Programming</header>
<h2 id="mediator-intent">Mediator: Intent</h2>
<p><strong>Mediator</strong> is a behavioral design pattern that lets you reduce chaotic dependencies between objects. The pattern restricts direct communications between the objects and forces them to collaborate only via a mediator object.</p>
<p>Also known as: <strong>Intermediary</strong>, <strong>Controller</strong></p>
<p>Source: <a href="https://refactoring.guru/design-patterns/mediator">refactoring.guru</a></p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="88" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="88" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {

<header>CEN206 Object-Oriented Programming</header>
<h2 id="mediator-problem">Mediator: Problem</h2>
<p>Say you have a dialog for creating and editing customer profiles. It consists of various form controls such as text fields, checkboxes, buttons, etc.</p>
<p>Some of the form elements may interact with others. For instance, selecting the &quot;I have a dog&quot; checkbox may reveal a hidden text field for entering the dog's name. Another example is the submit button that has to validate values of all fields before saving the data.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="89" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="89" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="mediator-problem-cont">Mediator: Problem (cont.)</h2>
<p>By having this logic implemented directly inside the code of the form elements, you make these elements' classes <strong>much harder to reuse</strong> in other forms of the app. For example, you would not be able to use that checkbox class inside another form because it is coupled to the dog's text field.</p>
<p>The more elements you add to the form, the more <strong>tangled</strong> the dependencies become. Changing one element may affect many others.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="90" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="90" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="mediator-solution">Mediator: Solution</h2>
<p>The Mediator pattern suggests that you should cease all direct communication between the components which you want to make independent of each other. Instead, these components must collaborate indirectly by calling a special <strong>mediator object</strong> that redirects the calls to appropriate components.</p>
<p>As a result, the components depend only on a single mediator class instead of being coupled to dozens of their colleagues.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="91" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
" data-lang="en-US" lang="en-US" data-marpit-pagination="91" style="--paginate:true;--background-color:#fff;--background-image:url('assets/hero-background.svg');--header:CEN206 Object-Oriented Programming;--footer:![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11;--theme:default;--style:img[alt~=&quot;center&quot;] {
  display: block;
  margin: 0 auto;
}
;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="mediator-solution-cont">Mediator: Solution (cont.)</h2>
<p>The most significant change happens to the actual form elements. In our dialog example, the <strong>dialog class itself</strong> may act as the mediator. Most likely, the dialog class is already aware of all of its sub-elements, so you would not even need to introduce new dependencies.</p>
<p>Each component must store a reference to the mediator and notify it about events instead of directly calling other components. The mediator then determines which component should handle the event and redirects the call accordingly.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="92" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="mediator-real-world-analogy">Mediator: Real-World Analogy</h2>
<p>Pilots of aircraft that approach or depart the airport control area do not communicate directly with each other. Instead, they speak to an <strong>air traffic controller</strong>, who sits in a tall tower somewhere near the airstrip.</p>
<p>Without the air traffic controller, every pilot would need to be aware of every other plane in the vicinity of the airport, discussing landing priorities with a committee of dozens of other pilots. That would probably skyrocket the airplane crash statistics.</p>
<p>The tower does not need to control the whole flight. It exists only to enforce constraints in the terminal area because the number of involved actors there is too large.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="93" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Object-Oriented Programming" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Week-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

<header>CEN206 Object-Oriented Programming</header>
<h2 id="mediator-structure">Mediator: Structure</h2>
<p>The structure consists of the following participants:</p>
<ol>
<li>
<p><strong>Components</strong>: Various classes that contain some business logic. Each component has a reference to a mediator, declared with the type of the mediator interface. The component is not aware of the actual class of the mediator.</p>
</li>
<li>
<p><strong>Mediator Interface</strong>: Declares methods of communication with components, which usually include just a single notification method.</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
</section>

;--lang:en-US;background-color:#fff;background-image:url('assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="260">
<header>CEN206 Object-Oriented Programming</header>
<h2 id="mediator-structure-cont">Mediator: Structure (cont.)</h2>
<ol start="3">
<li>
<p><strong>Concrete Mediators</strong>: Encapsulate the relations between various components. Concrete mediators often keep references to all components they manage and sometimes even manage their lifecycle.</p>
</li>
<li>
<p><strong>Communication Rule</strong>: Components must not be aware of other components. If something important happens within or to a component, it must only notify the mediator. When the mediator receives the notification, it can easily identify the sender, which might be just enough to decide what component should be triggered in return.</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>

        usernameField = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Textbox</span>(<span class="hljs-built_in">this</span>);

<header>CEN206 Object-Oriented Programming</header>
<h2 id="mediator-applicability">Mediator: Applicability</h2>
<p>Use the Mediator pattern when:</p>
<ul>
<li>It is hard to change some of the classes because they are <strong>tightly coupled</strong> to a bunch of other classes.</li>
<li>You cannot <strong>reuse a component</strong> in a different program because it is too dependent on other components.</li>
<li>You find yourself creating tons of <strong>component subclasses</strong> just to reuse some basic behavior in various contexts.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Week-11</footer>
