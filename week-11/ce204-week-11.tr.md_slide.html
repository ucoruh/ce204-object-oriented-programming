<h2 id="davranissal-tasarim-desenleri-nedir">Davranissal Tasarim Desenleri Nedir?</h2>
<p>Davranissal tasarim desenleri, <strong>algoritmalar</strong> ve nesneler arasindaki <strong>sorumluluk dagitimi</strong> ile ilgilenir.</p>
<p>Yalnizca nesne veya sinif desenlerini degil, ayni zamanda aralarindaki <strong>iletisim desenlerini</strong> de tanimlarlar. Bu desenler, calisma zamaninda takip edilmesi zor olan karmasik kontrol akisini karakterize eder.</p>
<p>Odak noktanizi kontrol akisindan uzaklastirarak nesnelerin birbirine nasil baglandigina konsantre olmanizi saglarlar.</p>
<p>Kaynak: <a href="https://refactoring.guru/design-patterns/behavioral-patterns">refactoring.guru</a></p>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="sorumluluk-zinciri-problem">Sorumluluk Zinciri: Problem</h2>
<p>Bir cevrimici siparis sistemi uzerinde calistiginizi hayal edin. Erisimi kisitlamak istiyorsunuz, boylece yalnizca kimlik dogrulanmis kullanicilar siparis olusturabilir. Ayrica yonetici izinlerine sahip kullanicilar tum siparislere tam erisime sahip olmalidir.</p>
<p>Biraz planlama yapildiktan sonra, bu kontrollerin sirayla yapilmasi gerektigini fark edersiniz:</p>
<ol>
<li><strong>Kimlik Dogrulama</strong> -- Kullanici oturum acmis mi?</li>
<li><strong>Yetkilendirme</strong> -- Kullanicinin izinleri var mi?</li>
<li><strong>Dogrulama</strong> -- Veri gecerli mi?</li>
<li><strong>Onbellekleme</strong> -- Sonuc zaten onbellekte mi?</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-11</footer>

<h2 id="sorumluluk-zinciri-problem-devam">Sorumluluk Zinciri: Problem (devam)</h2>
<p>Zamanla daha fazla sirali kontrol eklersiniz:</p>
<ul>
<li>Kaba kuvvet sifre saldirilarini onlemek icin <strong>hiz sinirlandirma</strong></li>
<li>Isteklerdeki ham verileri filtrelemek icin <strong>temizleme</strong></li>
<li><strong>Siteler arasi betik calistirma</strong> korumasi</li>
</ul>
<p>Zaten karmasik gorunen kontrol kodlari, her yeni ozellik eklediginizde daha da sisti. Bir kontrolu degistirmek bazen digerlerini etkiliyordu. Kontrolleri diger bilesenlerde yeniden kullanmak kod tekrarina yol aciyordu.</p>

<h2 id="sorumluluk-zinciri-cozum">Sorumluluk Zinciri: Cozum</h2>
<p>Sorumluluk Zinciri deseni, isleyicileri bir zincire baglamanizi onerir. Her isleyicinin bir sonraki isleyiciye referans depolayan bir alani vardir. Bir istegi islemenin yani sira, isleyiciler istegi zincir boyunca daha ileriye iletir.</p>
<p>Istek, tum isleyiciler onu isleme firsati bulana kadar zincir boyunca ilerler. Bir isleyici, istegi zincirde daha ileri <strong>iletmemeye</strong> karar verebilir ve boylece daha fazla islemi etkin bir sekilde durdurabilir.</p>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="sorumluluk-zinciri-cozum-devam">Sorumluluk Zinciri: Cozum (devam)</h2>
<p>Biraz farkli bir yaklasim daha vardir; bir istek aldiginda, isleyici onu <strong>isleyip isleyemeyecegine</strong> karar verir. Isleyebilirse, istegi daha ileri iletmez. Dolayisiyla istegi ya yalnizca bir isleyici isler ya da hicbiri islemez.</p>
<p>Bu yaklasim, grafik kullanici arayuzundeki ogeler yiginindaki olaylarla ugrasilirken cok yaygindir. Ornegin, bir kullanici bir dugmeye tikladiginda, olay dugmeden baslayarak, kapsayicilari boyunca ilerleyerek ve uygulama penceresiyle biten GUI ogeleri zinciri boyunca yayilir.</p>

<p>Bilgisayariniza yeni bir donanim parcasi satin alip kurdunuz. Teknik destegi ariyorsunuz:</p>

<li><strong>Otomatik sistem</strong> birkac standart cozum onerir -- hicbiri ise yaramaz.</li>
<li>Bir <strong>insan operatoru</strong> betiklestirilmis sorun giderme adimlarini dener -- hala cozulmez.</li>
<li>Operator cagrinizi sorunu nihayetinde cozen bir <strong>muhendise</strong> <strong>yonlendirir</strong>.</li>
</ol>
<p>Her kademe ya sorunu cozer ya da bir sonraki, daha yetenekli kademeye yonlendirir.</p>

<h2 id="sorumluluk-zinciri-yapi">Sorumluluk Zinciri: Yapi</h2>
<p>Yapi asagidaki katilimcilardan olusur:</p>
<ol>
<li>
<p><strong>Isleyici (Handler)</strong> (arayuz): Istekleri isleme arayuzunu bildirir. Genellikle istekleri islemek icin tek bir yontem ve bazen bir sonraki isleyiciyi ayarlamak icin baska bir yontem icerir.</p>
</li>
<li>
<p><strong>Temel Isleyici (Base Handler)</strong> (soyut sinif): Tum isleyicilere ortak olan kalip kodu koyabileceginiz istege bagli sinif. Genellikle bir sonraki isleyiciye referans depolar ve varsayilan zincirleme davranisini uygular.</p>
</li>
</ol>

<p><strong>Somut Isleyiciler (Concrete Handlers)</strong>: Istekleri islemek icin gercek kodu icerir. Bir istek aldiginda, her isleyici onu islemeye ve zincir boyunca iletmeye karar vermelidir. Isleyiciler genellikle bagimsizdir ve degismezdir, tum gerekli verileri yapilandirici araciligiyla alir.</p>
</li>
<li>
<p><strong>Istemci (Client)</strong>: Zincirleri yalnizca bir kez olusturabilir veya dinamik olarak olusturabilir. Bir istek zincirdeki herhangi bir isleyiciye gonderilebilir -- ilki olmak zorunda degildir.</p>
</li>
</ol>

        <span class="hljs-type">Handler</span> <span class="hljs-variable">validation</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">ValidationHandler</span>();

        auth.setNext(authz).setNext(validation);

        <span class="hljs-comment">// Send requests through the chain</span>
        <span class="hljs-keyword">for</span> (String user : Arrays.asList(
                <span class="hljs-string">&quot;alice&quot;</span>, <span class="hljs-string">&quot;bob&quot;</span>, <span class="hljs-string">&quot;dave&quot;</span>)) {
            <span class="hljs-type">String</span> <span class="hljs-variable">result</span> <span class="hljs-operator">=</span> auth.handle(user);
            <span class="hljs-keyword">if</span> (result != <span class="hljs-literal">null</span>) {
                System.out.println(result);
            } <span class="hljs-keyword">else</span> {
                System.out.println(user
                    + <span class="hljs-string">&quot;: Request passed all checks.&quot;</span>);
            }
        }
    }
}

<h2 id="sorumluluk-zinciri-uygulanabilirlik">Sorumluluk Zinciri: Uygulanabilirlik</h2>
<p>Sorumluluk Zinciri desenini su durumlarda kullanin:</p>
<ul>
<li>
<p>Programinizin farkli turde istekleri cesitli sekillerde islemesi bekleniyor, ancak <strong>isteklerin tam turleri</strong> ve siralari <strong>onceden bilinmiyor</strong>.</p>
</li>
<li>
<p>Belirli bir sirada <strong>birden fazla isleyiciyi calistirmak</strong> gereklidir.</p>
</li>
<li>
<p>Isleyici kumesi ve siralarinin <strong>calisma zamaninda degismesi</strong> gerekmektedir. Isleyici siniflari icindeki referans alani icin setter saglarsaniz, isleyicileri dinamik olarak ekleyebilir, kaldirabilir veya yeniden siralayabilirsiniz.</p>
</li>
</ul>

<h2 id="sorumluluk-zinciri-nasil-uygulanir">Sorumluluk Zinciri: Nasil Uygulanir</h2>
<ol>
<li>Isleyici arayuzunu bildirin ve istekleri islemek icin bir yontemin imzasini tanimlayin.</li>
<li>Somut isleyicilerdeki yinelenen kalip kodu ortadan kaldirmak icin, isleyici arayuzunden turetilmis bir <strong>soyut temel isleyici</strong> sinifi olusturun. Bir sonraki isleyiciye referans depolamak icin bir alan ekleyin ve varsayilan iletme davranisini uygulayin.</li>
<li><strong>Somut isleyici</strong> alt siniflari olusturun ve isleme yontemlerini uygulayin. Her isleyici iki karar vermelidir:
<ul>
<li>Istegi isleyip islemeyecegi</li>
<li>Istegi zincir boyunca iletip iletmeyecegi</li>
</ul>
</li>
</ol>

<h2 id="sorumluluk-zinciri-nasil-uygulanir-devam">Sorumluluk Zinciri: Nasil Uygulanir (devam)</h2>
<ol start="4">
<li><strong>Istemci</strong> zincirleri kendi basina olusturabilir veya diger nesnelerden onceden olusturulmus zincirleri alabilir. Ikinci durumda, yapilandirma veya ortam ayarlarina gore zincirler olusturmak icin bazi fabrika siniflari uygulamalisiniz.</li>
<li>Istemci zincirdeki herhangi bir isleyiciyi tetikleyebilir, yalnizca ilkini degil. Istek, bir isleyici onu daha ileri iletmeyi reddedene veya zincirin sonuna ulasana kadar zincir boyunca iletilecektir.</li>
<li>Zincirin dinamik dogasi nedeniyle, istemci su senaryolari ele almaya hazir olmalidir:
<ul>
<li>Zincir <strong>tek bir halkadan</strong> olusabilir</li>
<li>Bazi istekler zincirin <strong>sonuna ulasamayabilir</strong></li>
<li>Digerleri zincirin sonuna <strong>islenmeden</strong> ulasabilir</li>
</ul>
</li>
</ol>

<p><strong>Avantajlar:</strong></p>
<ul>
<li>Istek isleme <strong>sirasini kontrol</strong> edebilirsiniz</li>
<li><strong>Tek Sorumluluk Ilkesi:</strong> Islemleri cagiran siniflari, islemleri gerceklestiren siniflardan ayirabilirsiniz</li>
<li><strong>Acik/Kapali Ilkesi:</strong> Mevcut istemci kodunu bozmadan uygulamaya yeni isleyiciler ekleyebilirsiniz</li>
</ul>
<p><strong>Dezavantajlar:</strong></p>
<ul>
<li>Hicbir isleyici islemezse bazi istekler <strong>islenmeden</strong> kalabilir</li>
</ul>

<ul>
<li><strong>Sorumluluk Zinciri, Komut, Arabulucu ve Gozlemci</strong> desenleri, gonderici ve alicilari baglamanin alternatif yollaridir. SZ, bir istegi dinamik bir zincir boyunca sirali olarak iletir.</li>
<li><strong>SZ ve Bilesik (Composite):</strong> Yaprak bilesenler, istekleri tum ust bilesenler zinciri boyunca nesne agacinin kokune kadar iletebilir.</li>
<li><strong>SZ ve Dekorator (Decorator):</strong> Yapida cok benzerler. Her ikisi de bir dizi nesne uzerinden yurutmeyi iletmek icin ozyinelemeli bilesime dayanir. Ancak SZ isleyicileri birbirinden bagimsiz olarak keyfi islemler yurutebilir ve istegi herhangi bir noktada iletmeyi durdurabilir. Dekoratorler ise temel arayuzu tutarli tutarak davranisi genisletir.</li>
</ul>

<h2 id="komut-amac">Komut: Amac</h2>
<p><strong>Komut (Command)</strong>, bir istegi, istek hakkindaki tum bilgileri iceren bagimsiz bir nesneye donusturen davranissal bir tasarim desenidir. Bu donusum, istekleri yontem argumanlari olarak iletmenize, bir istegin yurutulmesini geciktirmenize veya siraya koymaniza ve geri alinabilir islemleri desteklemenize olanak tanir.</p>
<p>Diger adlari: <strong>Eylem (Action)</strong>, <strong>Islem (Transaction)</strong></p>
<p>Kaynak: <a href="https://refactoring.guru/design-patterns/command">refactoring.guru</a></p>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="komut-problem">Komut: Problem</h2>
<p>Yeni bir metin duzenleyici uygulamasi uzerinde calistiginizi hayal edin. Mevcut goreviniz, cesitli islemler icin bir grup dugme iceren bir arac cubugu olusturmaktir. Arac cubugundan dugmeler ve iletisim kutularindaki genel dugmeler icin kullanilabilecek bir <code>Button</code> sinifi olusturdunuz.</p>
<p>Bu dugmelerin hepsi benzer gorunse de, farkli seyler yapmalari gerekiyor. Bu dugmelerin cesitli tiklama isleyicileri icin kodu nereye koyarsiniz?</p>

<h2 id="komut-problem-devam">Komut: Problem (devam)</h2>
<p>En basit cozum, dugmenin kullanildigi her yer icin tonlarca alt sinif olusturmaktir. Bu alt siniflar, bir dugmeye tiklandiginda calistirilacak kodu icerir.</p>
<p>Bu yaklasimdaki sorunlar:</p>
<ul>
<li>Temel <code>Button</code> sinifini her degistirdiginizde bozulan <strong>cok sayida alt sinif</strong> olur</li>
<li>GUI kodu, degisken is mantigi koduna <strong>bagimli</strong> hale gelir</li>
<li>Bazi islemler (ornegin Kopyala/Yapistir) <strong>birden fazla yerden</strong> (dugmeler, menuler, klavye kisayollari) cagrilmalidir, bu da <strong>kod tekrarina</strong> yol acar</li>
</ul>

<h2 id="komut-cozum">Komut: Cozum</h2>
<p>Iyi yazilim tasarimi genellikle <strong>kaygilarin ayrilmasi ilkesine</strong> dayanir. Komut deseni, GUI nesnelerinin istekleri dogrudan gondermemesi gerektigini onerir. Bunun yerine, tum istek ayrintilarini, bu istegi tetikleyen tek bir yonteme sahip ayri bir <strong>komut</strong> sinifina cikarirsiniz.</p>
<p>Komut nesneleri, cesitli GUI ve is mantigi nesneleri arasinda baglanti gorevi gorur. GUI nesnesinin, hangi is mantigi nesnesinin istegi alacagini ve nasil isleyecegini bilmesine gerek yoktur.</p>

<h2 id="komut-cozum-devam">Komut: Cozum (devam)</h2>
<p>Sonraki adim, komutlarinizi <strong>ayni arayuzu</strong> uygulatmaktir. Genellikle parametre almayan tek bir yurutme yontemine sahiptir. Bu arayuz, cesitli komutlari somut siniflara baglantili olmadan ayni istek gonderen ile kullanmaniza olanak tanir.</p>
<p>Bir bonus olarak, artik gondericiye baglanan komut nesnelerini degistirebilir, boylece gondericinin davranisini calisma zamaninda etkili bir sekilde degistirebilirsiniz.</p>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="komut-gercek-dunya-analojisi">Komut: Gercek Dunya Analojisi</h2>
<p>Sehirde uzun bir yuruyusten sonra guzel bir restorana gelip pencere kenarindaki masaya oturursunuz. Dost canli bir garson yaklasir ve <strong>siparisninizi</strong> hizla alir, bir kagida yazar.</p>
<p>Garson mutfaga gider ve siparisi duvara yapistirir. Bir sure sonra siparis, onu okuyup yemegi buna gore pisiren <strong>sefin</strong> eline gecer.</p>
<p>Sef yemegi siparisble birlikte bir tepsiye koyar. Garson tepsiyi bulur, her seyin istediginiz gibi oldugundan emin olmak icin siparisi kontrol eder ve her seyi masaniza getirir.</p>
<p>Kagit siparis bir <strong>komut</strong> gorevi gorur -- sef hazir olana kadar bir kuyrukta kalir.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-11</footer>

<h2 id="komut-yapi">Komut: Yapi</h2>
<p>Komut deseninin bes temel katilimcisi vardir:</p>
<ol>
<li>
<p><strong>Gonderici (Invoker)</strong>: Istekleri baslatmaktan sorumludur. Bir komut nesnesine referans depolamak icin bir alana sahiptir. Istegi dogrudan aliciya gondermek yerine bu komutu tetikler.</p>
</li>
<li>
<p><strong>Komut Arayuzu (Command Interface)</strong>: Genellikle komutu yurutmek icin yalnizca tek bir yontem bildirir.</p>
</li>
</ol>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="komut-yapi-devam">Komut: Yapi (devam)</h2>
<ol start="3">
<li>
<p><strong>Somut Komutlar (Concrete Commands)</strong>: Cesitli istek turlerini uygular. Somut bir komutun isi kendi basina yapmasi beklenmez, bunun yerine cagiyi is mantigi nesnelerinden birine (alici) iletmelidir. Alici nesnesi uzerinde bir yontem calistirmak icin gereken parametreler, somut komutta alan olarak bildirilebilir.</p>
</li>
<li>
<p><strong>Alici (Receiver)</strong>: Bazi is mantigi icerir. Neredeyse herhangi bir nesne alici olarak gorev yapabilir. Cogu komut yalnizca bir istegin aliciya nasil iletildiginin ayrintilarini ele alir.</p>
</li>
<li>
<p><strong>Istemci (Client)</strong>: Somut komut nesnelerini olusturur ve yapilandirir. Istemci, bir alici ornegi de dahil olmak uzere tum istek parametrelerini komut yapilandiricisindan gecirmelidir.</p>
</li>
</ol>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Command History for undo support</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">CommandHistory</span> {
    <span class="hljs-keyword">private</span> Stack&lt;AbstractCommand&gt; history
        = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Stack</span>&lt;&gt;();

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">push</span><span class="hljs-params">(AbstractCommand command)</span> {
        history.push(command);
    }

    <span class="hljs-keyword">public</span> AbstractCommand <span class="hljs-title function_">pop</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> history.pop();
    }

    <span class="hljs-keyword">public</span> <span class="hljs-type">boolean</span> <span class="hljs-title function_">isEmpty</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> history.isEmpty();
    }
}
</code></pre>

<h2 id="komut-java-sozde-kod-devam-6">Komut: Java Sozde Kod (devam)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Invoker: Application</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Application</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-type">Editor</span> <span class="hljs-variable">editor</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Editor</span>();
    <span class="hljs-keyword">private</span> <span class="hljs-type">CommandHistory</span> <span class="hljs-variable">history</span>
        <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">CommandHistory</span>();

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">executeCommand</span><span class="hljs-params">(
            AbstractCommand cmd)</span> {
        <span class="hljs-keyword">if</span> (cmd.execute()) {
            <span class="hljs-comment">// Only save commands that modify state</span>
            history.push(cmd);
        }
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">undo</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">if</span> (!history.isEmpty()) {
            <span class="hljs-type">AbstractCommand</span> <span class="hljs-variable">cmd</span> <span class="hljs-operator">=</span> history.pop();
            cmd.undo();
        }
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
        <span class="hljs-type">Application</span> <span class="hljs-variable">app</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Application</span>();
        app.editor.setText(<span class="hljs-string">&quot;Hello, World!&quot;</span>);
        app.editor.setCursorPosition(<span class="hljs-number">5</span>);

        <span class="hljs-comment">// Execute cut (modifies state -&gt; saved)</span>
        app.executeCommand(
            <span class="hljs-keyword">new</span> <span class="hljs-title class_">CutCommand</span>(app.editor));
        System.out.println(<span class="hljs-string">&quot;After cut: &quot;</span>
            + app.editor.getText());

        <span class="hljs-comment">// Undo</span>
        app.undo();
        System.out.println(<span class="hljs-string">&quot;After undo: &quot;</span>
            + app.editor.getText());
    }
}
</code></pre>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="komut-uygulanabilirlik">Komut: Uygulanabilirlik</h2>
<p>Komut desenini su durumlarda kullanin:</p>
<ul>
<li>
<p><strong>Nesneleri islemlerle parametrelendirmek.</strong> Komut deseni, belirli bir yontem cagrisini bagimsiz bir nesneye donusturebilir. Komutlari yontem argumanlari olarak iletebilir, diger nesnelerin icinde depolayabilir, calisma zamaninda baglantili komutlari degistirebilirsiniz, vb.</p>
</li>
<li>
<p><strong>Islemleri siraya koymak, yurutmelerini zamanlamak veya uzaktan yurutmek.</strong> Komutlari seriletirebilir, ag uzerinden gonderebilir ve farkli bir makinede yurutebilirsiniz.</p>
</li>
<li>
<p><strong>Geri alinabilir islemler uygulamak.</strong> En yaygin kullanim. Geri almayi uygulamak icin, onceki durumu geri yukleme olanagi ile bir komut gecmisi tutmaniz gerekir.</p>
</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-11</footer>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="komut-nasil-uygulanir">Komut: Nasil Uygulanir</h2>
<ol>
<li>Tek bir yurutme yontemi ile <strong>komut arayuzunu</strong> bildirin.</li>
<li>Istekleri, komut arayuzunu uygulayan <strong>somut komut sinifarina</strong> cikarmayi baslayin. Her sinif, istek argumanlari ve alici nesneye referans depolamak icin alanlara sahip olmalidir.</li>
<li><strong>Gonderici</strong> (invoker) olarak gorev yapacak siniflari belirleyin. Komutlari depolamak icin alanlar ekleyin. Gondericiler komutlarla yalnizca komut arayuzu araciligiyla iletisim kurmalidir.</li>
<li>Gondericileri, istegi dogrudan aliciya gondermek yerine <strong>komutu yuruterek</strong> degistirin.</li>
<li><strong>Istemci</strong> nesneleri su sirada baslatmalidir: alicilar, komutlar (alici referanslariyla), gondericiler (komut referanslariyla).</li>
</ol>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="komut-avantajlar-ve-dezavantajlar">Komut: Avantajlar ve Dezavantajlar</h2>
<p><strong>Avantajlar:</strong></p>
<ul>
<li><strong>Tek Sorumluluk Ilkesi:</strong> Islemleri cagiran siniflari, islemleri gerceklestiren siniflardan ayirir</li>
<li><strong>Acik/Kapali Ilkesi:</strong> Mevcut istemci kodunu degistirmeden yeni komutlar eklenebilir</li>
<li><strong>Geri al/yinele</strong> islevselligini uygulama</li>
<li>Islemlerin <strong>ertelenmis yurutulmesini</strong> uygulama</li>
<li>Basit komutlar kumesini <strong>karmasik</strong> bir komutta (makro komutlar) birlestirme</li>
</ul>
<p><strong>Dezavantajlar:</strong></p>
<ul>
<li>Gondericiler ve alicilar arasina tamamen yeni bir katman eklediginiz icin kod <strong>daha karmasik</strong> hale gelebilir</li>
</ul>

<h2 id="komut-diger-desenlerle-iliskileri">Komut: Diger Desenlerle Iliskileri</h2>
<ul>
<li><strong>Sorumluluk Zinciri, Komut, Arabulucu, Gozlemci</strong> desenleri gonderici-alici baglantilarini farkli sekilde ele alir. Komut, tek yonlu baglantilar kurar.</li>
<li><strong>Komut + Hatira:</strong> Geri alma destegi icin yurutmeden once komut durumunu kaydetmek icin Hatira kullanin.</li>
<li><strong>Komut ve Strateji:</strong> Her ikisi de nesneleri parametrelendrir, ancak Komut islemleri nesnelere donusturur (ertelenmis yurutme, kuyruga alma, gecmis icin), Strateji ise ayni seyi yapmanin farkli yollarini tanimlar.</li>
<li><strong>Prototip (Prototype)</strong> komutlarin kopyalarini gecmise kaydetmeniz gerektiginde yardimci olur.</li>
<li><strong>Ziyaretci (Visitor)</strong> farkli siniflardaki nesneler uzerinde islem yurutebilen, Komutun guclu bir surumu olarak dusunulebilir.</li>
</ul>

<h2 id="yineleyici-amac">Yineleyici: Amac</h2>
<p><strong>Yineleyici (Iterator)</strong>, bir koleksiyonun elemanlarini, altindaki temsili (liste, yigin, agac, vb.) aciga cikarmadan gezmenizi saglayan davranissal bir tasarim desenidir.</p>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="yineleyici-problem">Yineleyici: Problem</h2>
<p>Koleksiyonlar, programlamada en cok kullanilan veri turlerinden biridir. Bir koleksiyon, bir grup nesne icin yalnizca bir kapsayicidir.</p>
<p>Cogu koleksiyon elemanlarini basit listelerde depolar. Ancak bazilari yiginlara, agaclara, grafiklere ve diger karmasik veri yapilarini temel alir.</p>
<p>Bir koleksiyon nasil yapilandirilmis olursa olsun, diger kodlarin bu elemanlari kullanabilmesi icin <strong>elemanlarini erislirmeyi</strong> saglayan bir yol sunmalidir. Ayni elemanlara tekrar tekrar erismeden her bir eleman uzerinden gecmenin bir yolu olmalidir.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-11</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-background-color="#fff" data-background-image="url('assets/hero-background.svg')" data-header="CEN206 Nesne Yonelimli Programlama" data-footer="![height:50px](assets/2021-10-19-15-01-36-image.png) RTEU CEN206 Hafta-11" data-theme="default" data-style="img[alt~=&quot;center&quot;] {

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="yineleyici-problem-devam">Yineleyici: Problem (devam)</h2>
<p>Koleksiyonunuz bir listeye dayaliysa bu kolay bir is gibi gorunebilir. Tum elemanlar uzerinde dongu yapmaniz yeterlidir. Ancak bir agac gibi karmasik bir veri yapisinin elemanlarini nasil <strong>sirali olarak gezersiniz</strong>?</p>
<p>Ornegin, bir gun agacin <strong>oncelik derinlik</strong> gezintisine ihtiyaciniz olabilir. Ertesi gun <strong>genislik oncelikli</strong> gezintiye ihtiyaciniz olabilir. Ve sonraki hafta <strong>rastgele erisim</strong> ihtiyaciniz olabilir.</p>
<p>Koleksiyona daha fazla gezinti algoritmasi eklemek, onun <strong>birincil sorumlulusunu</strong> giderek <strong>bulaniklastirir</strong>: verimli veri depolama.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-11</footer>
</section>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="yineleyici-cozum">Yineleyici: Cozum</h2>
<p>Yineleyici deseninin ana fikri, bir koleksiyonun gezinti davranisini <strong>yineleyici</strong> adli ayri bir nesneye cikarmaktir.</p>
<p>Algoritmanin kendisini uygulamanin yani sira, bir yineleyici nesnesi mevcut konum ve sonuna kadar kac eleman kaldigini gibi tum gezinti ayrintilarini kapsullar.</p>
<p>Birden fazla yineleyici, birbirinden bagimsiz olarak <strong>ayni koleksiyon</strong> uzerinde ayni anda gezinebilir.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-11</footer>
</section>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="yineleyici-cozum-devam">Yineleyici: Cozum (devam)</h2>
<p>Genellikle yineleyiciler, koleksiyonun elemanlarini getirmek icin tek bir birincil yontem saglar. Istemci, yineleyici hicbir sey dondurmeyene kadar bu yontemi calistirmaya devam edebilir, bu da yineleyicinin tum elemanlari gezdigi anlamina gelir.</p>
<p>Tum yineleyiciler <strong>ayni arayuzu</strong> uygulamalidir. Bu, istemci kodunu, uygun bir yineleyici oldugu surece herhangi bir koleksiyon turu veya herhangi bir gezinti algoritmasiyla uyumlu hale getirir.</p>
<p>Bir koleksiyonu gezmek icin ozel bir yola ihtiyaciniz varsa, koleksiyonu veya istemciyi degistirmek zorunda kalmadan yalnizca <strong>yeni bir yineleyici sinifi</strong> olusturursunuz.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-11</footer>
</section>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="yineleyici-gercek-dunya-analojisi">Yineleyici: Gercek Dunya Analojisi</h2>
<p>Birkac gunlugune Roma'yi ziyaret etmeyi ve tum turistik yerlerini ve cazibe merkezlerini gormeyi planliyorsunuz. Ancak oraya vardiginizda, Kolezyum'u bile bulamadan daireler cizerek cok zaman harcayabilirsiniz.</p>
<p>Ote yandan, akilli telefonunuz icin bir <strong>sanal rehber uygulamasi</strong> satin alip navigasyon icin kullanabilirsiniz. Ya da sehri taniyan bir <strong>yerel rehber</strong> tutabilirsiniz.</p>
<p>Her uc secenek de -- rastgele yuruyus, akilli telefon navigatoru ve insan rehber -- Roma'daki genis turistik yerler ve cazibe merkezleri koleksiyonu uzerinde <strong>yineleyici</strong> gorevi gorur.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-11</footer>
</section>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="yineleyici-yapi">Yineleyici: Yapi</h2>
<p>Yapi asagidaki katilimcilardan olusur:</p>
<ol>
<li>
<p><strong>Yineleyici Arayuzu (Iterator Interface)</strong>: Bir koleksiyonu gezmek icin gereken islemleri bildirir: sonraki elemani getirme, mevcut konumu alma, yinelemeyi yeniden baslattma, vb.</p>
</li>
<li>
<p><strong>Somut Yineleyiciler (Concrete Iterators)</strong>: Bir koleksiyonu gezmek icin belirli algoritmalar uygular. Yineleyici nesnesi, gezinti ilerlemesini kendi basina takip etmelidir. Bu, birden fazla yineleyicinin ayni koleksiyonu bagimsiz olarak gezmesine olanak tanir.</p>
</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-11</footer>
</section>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="yineleyici-yapi-devam">Yineleyici: Yapi (devam)</h2>
<ol start="3">
<li>
<p><strong>Koleksiyon Arayuzu (Iterable)</strong>: Koleksiyonla uyumlu yineleyiciler almak icin bir veya daha fazla yontem bildirir. Donus turu, yineleyici arayuzu olarak bildirilmelidir.</p>
</li>
<li>
<p><strong>Somut Koleksiyonlar (Concrete Collections)</strong>: Istemci her istediginde belirli bir somut yineleyici sinifinin yeni orneklerini dondurur. Koleksiyonun geri kalan kodu ayni sinifta olmalidir.</p>
</li>
<li>
<p><strong>Istemci (Client)</strong>: Hem koleksiyonlarla hem de yineleyicilerle arayuzleri araciligiyla calisir, bu nedenle somut siniflara baglanmaz ve ayni istemci koduyla cesitli koleksiyonlari ve yineleyicileri kullanmaya olanak tanir.</p>
</li>
</ol>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Concrete iterator for Facebook friends</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">FacebookIterator</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">ProfileIterator</span> {
    <span class="hljs-keyword">private</span> Facebook facebook;
    <span class="hljs-keyword">private</span> String profileId;
    <span class="hljs-keyword">private</span> String type;
    <span class="hljs-keyword">private</span> <span class="hljs-type">int</span> <span class="hljs-variable">currentPosition</span> <span class="hljs-operator">=</span> <span class="hljs-number">0</span>;
    <span class="hljs-keyword">private</span> List&lt;Profile&gt; cache;

    <span class="hljs-keyword">public</span> <span class="hljs-title function_">FacebookIterator</span><span class="hljs-params">(Facebook fb,
            String profileId, String type)</span> {
        <span class="hljs-built_in">this</span>.facebook = fb;
        <span class="hljs-built_in">this</span>.profileId = profileId;
        <span class="hljs-built_in">this</span>.type = type;
    }

    <span class="hljs-keyword">private</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">lazyInit</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">if</span> (cache == <span class="hljs-literal">null</span>) {
            cache = facebook.socialGraphRequest(
                profileId, type);
        }
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> <span class="hljs-type">boolean</span> <span class="hljs-title function_">hasNext</span><span class="hljs-params">()</span> {
        lazyInit();
        <span class="hljs-keyword">return</span> currentPosition &lt; cache.size();
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> Profile <span class="hljs-title function_">getNext</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">if</span> (hasNext()) {
            <span class="hljs-keyword">return</span> cache.get(currentPosition++);
        }
        <span class="hljs-keyword">return</span> <span class="hljs-literal">null</span>;
    }

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">reset</span><span class="hljs-params">()</span> { currentPosition = <span class="hljs-number">0</span>; }
}
</code></pre>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="yineleyici-nasil-uygulanir">Yineleyici: Nasil Uygulanir</h2>
<ol>
<li><strong>Yineleyici arayuzunu</strong> bildirin. En azindan, sonraki elemani getirmek icin bir yonteme sahip olmalidir. Ancak kolaylik icin birkac baska yontem de ekleyebilirsiniz.</li>
<li><strong>Koleksiyon arayuzunu</strong> bildirin ve yineleyici getirmek icin bir yontem tanimlayin. Donus turu, yineleyici arayuzunkiyle esit olmalidir.</li>
<li>Yineleyicilerle gezilebilir olmasini istediginiz koleksiyonlar icin <strong>somut yineleyici</strong> siniflari uygulayin.</li>
<li>Koleksiyon siniflarinizda <strong>koleksiyon arayuzunu</strong> uygulayin. Ana fikir, istemciye belirli bir koleksiyon sinifi icin ozellestirilmis yineleyiciler olusturmak icin bir kisayol saglamaktir.</li>
<li>Tum koleksiyon gezinti kodunu yineleyicilerin kullanimiyla degistirmek icin <strong>istemci kodunu</strong> gozden gecirin.</li>
</ol>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-11</footer>
</section>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="yineleyici-avantajlar-ve-dezavantajlar">Yineleyici: Avantajlar ve Dezavantajlar</h2>
<p><strong>Avantajlar:</strong></p>
<ul>
<li><strong>Tek Sorumluluk Ilkesi:</strong> Hacimli gezinti algoritmalarini ayri siniflara cikararak istemci kodunu ve koleksiyonlari temizleyebilirsiniz</li>
<li><strong>Acik/Kapali Ilkesi:</strong> Yeni koleksiyon ve yineleyici turleri uygulayabilir ve hicbir seyi bozmadan mevcut koda iletebilirsiniz</li>
<li>Her yineleyici nesnesi kendi yineleme durumunu icerdiginden, <strong>ayni koleksiyon uzerinde paralel</strong> yineleme yapabilirsiniz</li>
<li>Ayni nedenle, bir yinelemeyi <strong>erteleyebilir</strong> ve gerektiginde devam edebilirsiniz</li>
</ul>
<p><strong>Dezavantajlar:</strong></p>
<ul>
<li>Uygulamaniz yalnizca basit koleksiyonlarla calisiyorsa deseni uygulamak <strong>asiri</strong> olabilir</li>
<li>Bir yineleyici kullanmak, bazi ozellestirilmis koleksiyonlarin elemanlarina dogrudan erismekten <strong>daha az verimli</strong> olabilir</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-11</footer>
</section>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="yineleyici-diger-desenlerle-iliskileri">Yineleyici: Diger Desenlerle Iliskileri</h2>
<ul>
<li><strong>Bilesik (Composite)</strong> agaclarini gezmek icin <strong>Yineleyiciler</strong> kullanabilirsiniz.</li>
<li>Koleksiyon alt siniflarinin koleksiyonlarla uyumlu farkli turde yineleyiciler dondurmesini saglamak icin <strong>Yineleyici</strong> ile birlikte <strong>Fabrika Yontemi (Factory Method)</strong> kullanabilirsiniz.</li>
<li>Mevcut yineleme durumunu yakalamak ve gerekirse geri almak icin <strong>Yineleyici</strong> ile birlikte <strong>Hatira (Memento)</strong> kullanabilirsiniz.</li>
<li>Karmasik bir veri yapisini gezmek ve tumunun farkli siniflari olsa bile elemanlari uzerinde bazi islemler yurutmek icin <strong>Yineleyici</strong> ile birlikte <strong>Ziyaretci (Visitor)</strong> kullanabilirsiniz.</li>
</ul>

<h2 id="arabulucu-amac">Arabulucu: Amac</h2>
<p><strong>Arabulucu (Mediator)</strong>, nesneler arasindaki kaotik bagimliliklari azaltmanizi saglayan davranissal bir tasarim desenidir. Desen, nesneler arasindaki dogrudan iletisimi kisitlar ve onlari yalnizca bir arabulucu nesnesi araciligiyla isbirligi yapmaya zorlar.</p>
<p>Diger adlari: <strong>Araci (Intermediary)</strong>, <strong>Denetleyici (Controller)</strong></p>
<p>Kaynak: <a href="https://refactoring.guru/design-patterns/mediator">refactoring.guru</a></p>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="arabulucu-problem">Arabulucu: Problem</h2>
<p>Musteri profilleri olusturmak ve duzenlemek icin bir iletisim kutusu olusturdunuzu varsayin. Metin alanlari, onay kutulari, dugmeler vb. gibi cesitli form kontrollerinden olusur.</p>
<p>Form elemanlarindan bazilari digerleryle etkilesime girebilir. Ornegin, &quot;Bir kopegim var&quot; onay kutusunu secmek, kopegin adini girmek icin gizli bir metin alanini ortaya cikarabilir. Baska bir ornek, verileri kaydetmeden once tum alanlarin degerlerini dogrulamasi gereken gonder dugmesidir.</p>

<h2 id="arabulucu-problem-devam">Arabulucu: Problem (devam)</h2>
<p>Bu mantigi dogrudan form elemanlarinin koduna uygulayarak, bu elemanlarin siniflarini uygulamanin diger formlarinda <strong>yeniden kullanmayi cok zorlastirirsiniz</strong>. Ornegin, kopegin metin alanina baglandigi icin o onay kutusu sinifini baska bir formda kullanamazsiniz.</p>
<p>Forma ne kadar cok eleman eklerseniz, bagimliliklar o kadar <strong>karmasik</strong> hale gelir. Bir elemani degistirmek diger bircogunu etkileyebilir.</p>

<h2 id="arabulucu-cozum">Arabulucu: Cozum</h2>
<p>Arabulucu deseni, birbirinden bagimsiz hale getirmek istediginiz bilesenler arasindaki tum dogrudan iletisimi durdurmanizi onerir. Bunun yerine, bu bilesenler cagrilari uygun bilesenlere yonlendiren ozel bir <strong>arabulucu nesnesi</strong> cagirarak dolayli yoldan isbirligi yapmalidir.</p>
<p>Sonuc olarak, bilesenler duzinelerce meslektaslarina baglanmak yerine yalnizca tek bir arabulucu sinifina bagimli olur.</p>

<h2 id="arabulucu-cozum-devam">Arabulucu: Cozum (devam)</h2>
<p>En onemli degisiklik, gercek form elemanlarinda olur. Iletisim kutusu ornegimizde, <strong>iletisim kutusu sinifinin kendisi</strong> arabulucu olarak gorev yapabilir. Buyuk olasilikla, iletisim kutusu sinifi tum alt elemanlarinin zaten farkindadir, bu nedenle yeni bagimliliklar bile eklemeniz gerekmeyebilir.</p>
<p>Her bilesen, arabulucuya bir referans depolamali ve diger bilesenleri dogrudan cagirmak yerine olaylar hakkinda arabulucuyu bilgilendirmelidir. Arabulucu daha sonra hangi bilesenin olayi islemesi gerektigini belirler ve cagiyi buna gore yonlendirir.</p>

<p>Hava trafik kontroloru olmasaydi, her pilotun havalimani yakinindaki diger tum ucaklardan haberdar olmasi ve duzinelerce baska pilottan olusan bir komiteyle inis onceliklerini tartismasi gerekirdi. Bu muhtemelen ucak kaza istatistiklerini buyuk olcude artirirdi.</p>
<p>Kulenin tum ucusu kontrol etmesi gerekmez. Yalnizca terminal bolgesindeki kisitlamalari uygulamak icin vardir, cunku oradaki ilgili aktor sayisi cok fazladir.</p>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="arabulucu-nasil-uygulanir">Arabulucu: Nasil Uygulanir</h2>
<ol>
<li>Daha bagimsiz olmasindan fayda gorecek bir <strong>sikica bagli siniflar</strong> grubu belirleyin.</li>
<li><strong>Arabulucu arayuzunu</strong> bildirin ve arabulucular ile cesitli bilesenler arasindaki istenen iletisim protokolunu tanimlayim.</li>
<li><strong>Somut arabulucu</strong> sinifini uygulayin. Tum bilesenlere referanslari arabulucu icinde depolamayi dusunun.</li>
<li>Daha da ileri gidebilir ve arabulucuyu bilesen nesnelerinin <strong>olusturulmasindan ve yok edilmesinden</strong> sorumlu hale getirebilirsiniz.</li>
<li>Bilesenler arabulucu nesnesine bir referans depolamalidir. Baglanti genellikle <strong>bilesenin yapilandiricisinda</strong> kurulur.</li>
<li>Bilesenlerin kodunu, diger bilesenlerdeki yontemler yerine <strong>arabulucunun bildirim yontemini</strong> cagirdiklari sekilde degistirin.</li>
</ol>

<h2 id="arabulucu-avantajlar-ve-dezavantajlar">Arabulucu: Avantajlar ve Dezavantajlar</h2>
<p><strong>Avantajlar:</strong></p>
<ul>
<li><strong>Tek Sorumluluk Ilkesi:</strong> Cesitli bilesenler arasindaki iletisimi tek bir yere cikararak anlamayi ve bakimi kolaylastirabilirsiniz</li>
<li><strong>Acik/Kapali Ilkesi:</strong> Gercek bilesenleri degistirmek zorunda kalmadan yeni arabulucular ekleyebilirsiniz</li>
<li>Bir programin cesitli bilesenleri arasindaki <strong>baglantiyi azaltabilirsiniz</strong></li>
<li><strong>Bilesenleri tek tek</strong> daha kolay yeniden kullanabilirsiniz</li>
</ul>
<p><strong>Dezavantajlar:</strong></p>
<ul>
<li>Zamanla bir arabulucu, bir <strong>Tanri Nesnesine (God Object)</strong> donusebilir -- cok fazla bilen veya cok fazla is yapan bir nesne</li>
</ul>

<h2 id="arabulucu-diger-desenlerle-iliskileri">Arabulucu: Diger Desenlerle Iliskileri</h2>
<ul>
<li><strong>Sorumluluk Zinciri, Komut, Arabulucu ve Gozlemci</strong> desenleri, gonderici ve alicilari baglamanin cesitli yollarini ele alir. Arabulucu, gonderici ve alicilar arasindaki dogrudan baglantilar ortadan kaldirir ve onlari dolayli yoldan iletisim kurmaya zorlar.</li>
<li><strong>Cephe (Facade) ve Arabulucu:</strong> Cephe bir alt sisteme basitlestirilmis bir arayuz tanimlar; yeni islevsellik eklemez ve alt sistem nesneleri cepheden haberdar degildir. Arabulucu, bilesenler arasindaki iletisimi merkezllestirir.</li>
<li><strong>Arabulucu ve Gozlemci:</strong> Ayrimi genellikle incedir. Arabulucu, merkezi bir nesne araciligiyla karsilikli bagimliliklari ortadan kaldirir. Gozlemci, dinamik tek yonlu abonelik baglantilari kurmaya olanak tanir. Arabulucu, arabulucunun yayinci ve bilesenlerin abone olarak gorev yaptigi Gozlemci kullanilarak uygulanabilir.</li>
</ul>

<p><strong>Hatira (Memento)</strong>, bir nesnenin onceki durumunu, uygulamasinin ayrintilarini aciga cikarmadan kaydetmenize ve geri yuklemenize olanak taniyan davranissal bir tasarim desenidir.</p>
<p>Diger adi: <strong>Anlik Goruntu (Snapshot)</strong></p>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="hatira-problem">Hatira: Problem</h2>
<p>Bir metin duzenleyici uygulamasi olusturdugununuzu hayal edin. Basit metin duzenlemeye ek olarak, duzenleyiciniz metni bicimlendirebilir, satir ici resimler ekleyebilir, vb.</p>
<p>Bir noktada, kullanicilarin metin uzerinde gerceklestirilen herhangi bir islemi <strong>geri almasina</strong> izin vermeye karar verdiniz. Bu ozellik o kadar yaygin hale geldi ki insanlar her uygulamada bunu bekliyorlar.</p>
<p>Uygulama icin dogrudan yaklasimi sectiniz: herhangi bir islem gerceklestirmeden once, uygulama <strong>tum nesnelerin durumunu</strong> kaydeder ve bir depolama alanina kaydeder. Daha sonra, bir kullanici bir islemi geri almaya karar verdiginde, uygulama en son anlik goruntuyu getirir ve durumu geri yuklemek icin kullanir.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-11</footer>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="hatira-problem-devam">Hatira: Problem (devam)</h2>
<p>Nesnenin durumunun anlik goruntusunu tam olarak nasil uretirsiniz? Muhtemelen bir nesnedeki tum alanlari gozden gecirmeniz ve degerlerini depolama alanina kopyalamaniz gerekir. Ancak bu, yalnizca nesnenin icerigine oldukca <strong>gevsetilmis erisim kisitlamalari</strong> varsa ise yarar. Ne yazik ki, cogu gercek nesne digerlerinin iclerine bu kadar kolayca bakmasina izin vermez ve tum onemli verileri <strong>ozel alanlarda</strong> gizler.</p>
<p>Ozel alanlari dogrudan kopyalamaya calismak ya kapsullemeyi bozar ya da anlik goruntu mantisini nesnenin ic yapisina baglar, bu da kodu kirilgan hale getirir.</p>

<h2 id="hatira-cozum">Hatira: Cozum</h2>
<p>Hatira deseni, durum anlik goruntuleri olusturmayi, durumun gercek sahibi olan <strong>kaynak (originator)</strong> nesnesine devreder. Dolayisiyla, diger nesnelerin duzenleyicinin durumunu &quot;disaridan&quot; kopyalamaya calismasinin yerine, duzenleyici sinifi kendi durumuna tam erisime sahip oldugundan anlik goruntuyu kendisi yapabilir.</p>
<p>Desen, nesnenin durumunun kopyasini <strong>hatira (memento)</strong> adli ozel bir nesnede depolamayi onerir. Hatiranin icerigi, onu ureten nesne disinda baska hicbir nesneye erisilebilir degildir.</p>

<h2 id="hatira-cozum-devam">Hatira: Cozum (devam)</h2>
<p>Diger nesneler hatiralarla, anlik gorunturun meta verilerini (olusturma zamani, islem adi, vb.) getirmeye olanak taniyan ancak anlik goruntunun icindeki orijinal nesnenin durumunu getirmeyen <strong>sinirli bir arayuz</strong> kullanarak iletisim kurmalidir.</p>
<p>Bir <strong>bakim gorevlisi (caretaker)</strong> nesnesi (ornegin komut gecmisi) kaynagin durumunun &quot;ne zaman&quot; ve &quot;neden&quot; yakalanacagini ve durumun ne zaman geri yuklenmesi gerektigini bilir. Bakim gorevlisi bir hatira yigini depolayabilir ve zamanda geriye yolculuk etme zamani geldiginde, en ustteki hatirayi getirir ve kaynagin geri yukleme yontemine iletir.</p>

<h2 id="hatira-gercek-dunya-analojisi">Hatira: Gercek Dunya Analojisi</h2>
<p><strong>Bir oyunu kaydetmeyi</strong> dusunun. Oyun (kaynak), karmasik bir ic duruma sahiptir: mevcut seviye, karakter konumlari, envanter, saglik puanlari, vb.</p>
<p>Tehlikeli bir patron dovusunden once <strong>oyunu kaydedersiniz</strong> (bir hatira olusturursunuz). Kayit dosyasi tum ilgili oyun durumunu depolar. Basarisiz olursaniz, <strong>kaydi yukleyebilir</strong> (hatiradan geri yukleyebilir) ve tekrar deneyebilirsiniz.</p>
<p>Kayit dosyasi hatiradir. Oyuncu (veya oyun menusu) bakim gorevlisi olarak gorev yapar.</p>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Memento: stores editor state</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">EditorMemento</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> String text;
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> <span class="hljs-type">int</span> cursorPosition;

    <span class="hljs-keyword">public</span> <span class="hljs-title function_">EditorMemento</span><span class="hljs-params">(String text,
            <span class="hljs-type">int</span> cursorPosition,
            <span class="hljs-type">int</span> scrollPosition)</span> {
        <span class="hljs-built_in">this</span>.text = text;
        <span class="hljs-built_in">this</span>.cursorPosition = cursorPosition;
        <span class="hljs-built_in">this</span>.scrollPosition = scrollPosition;
        <span class="hljs-built_in">this</span>.timestamp = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Date</span>();
    }

    <span class="hljs-comment">// Only originator can access these</span>
    String <span class="hljs-title function_">getText</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> text; }
    <span class="hljs-type">int</span> <span class="hljs-title function_">getCursorPosition</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> cursorPosition;
    }
    <span class="hljs-type">int</span> <span class="hljs-title function_">getScrollPosition</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> scrollPosition;
    }

    <span class="hljs-comment">// Public metadata</span>
    <span class="hljs-keyword">public</span> Date <span class="hljs-title function_">getTimestamp</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> timestamp; }
    <span class="hljs-keyword">public</span> String <span class="hljs-title function_">getName</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> timestamp + <span class="hljs-string">&quot; / &quot;</span>
            + text.substring(<span class="hljs-number">0</span>,
                Math.min(<span class="hljs-number">10</span>, text.length()))
            + <span class="hljs-string">&quot;...&quot;</span>;
    }
}

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Originator: the text editor</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">TextEditor</span> {

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">setCursor</span><span class="hljs-params">(<span class="hljs-type">int</span> pos)</span> {

    <span class="hljs-comment">// Create snapshot</span>

    <span class="hljs-comment">// Restore from snapshot</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">restore</span><span class="hljs-params">(EditorMemento memento)</span> {

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Caretaker: manages history</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">EditorHistory</span> {
    <span class="hljs-keyword">private</span> Stack&lt;EditorMemento&gt; history
        = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Stack</span>&lt;&gt;();

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">save</span><span class="hljs-params">(TextEditor editor)</span> {
        history.push(editor.save());
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">undo</span><span class="hljs-params">(TextEditor editor)</span> {
        <span class="hljs-keyword">if</span> (!history.isEmpty()) {
            <span class="hljs-type">EditorMemento</span> <span class="hljs-variable">memento</span> <span class="hljs-operator">=</span> history.pop();
            editor.restore(memento);
            System.out.println(<span class="hljs-string">&quot;Restored to: &quot;</span>
                + memento.getName());
        }
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">showHistory</span><span class="hljs-params">()</span> {
        System.out.println(<span class="hljs-string">&quot;History (&quot;</span>
            + history.size() + <span class="hljs-string">&quot; states):&quot;</span>);
        <span class="hljs-keyword">for</span> (EditorMemento m : history) {
            System.out.println(
                <span class="hljs-string">&quot;  - &quot;</span> + m.getName());
        }
    }
}
</code></pre>

<h2 id="hatira-uygulanabilirlik">Hatira: Uygulanabilirlik</h2>
<p>Hatira desenini su durumlarda kullanin:</p>
<ul>
<li>Onceki bir duruma geri yukleyebilmek icin <strong>nesnenin durumunun anlik goruntusunu</strong> uretmek istiyorsunuz.</li>
<li>Nesnenin alanlarina/getter/setter'larina dogrudan erisim <strong>kapsullemeyi ihlal ediyorsa</strong>. Hatira, nesnenin kendisini durumunun bir anlik goruntusunu olusturmaktan sorumlu kilar.</li>
<li><strong>Geri al/yinele</strong>, <strong>islem geri alma</strong> veya <strong>kontrol noktasi</strong> islevselligini uygulamaniz gerekiyor.</li>
</ul>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="hatira-nasil-uygulanir">Hatira: Nasil Uygulanir</h2>
<ol>
<li>Hangi sinifin <strong>kaynak</strong> rolunu oynayacagini belirleyin.</li>
<li><strong>Hatira sinifini</strong> olusturun. Kaynak sinifinin icinde bildirilen alanlari yansitan bir alan kumesini tek tek bildirin.</li>
<li>Hatira sinifini <strong>degismez</strong> yapin. Bir hatira verileri yalnizca bir kez, yapilandirici araciligiyla kabul etmelidir. Sinifin setter'i olmamalidir.</li>
<li>Diliniz <strong>ic ice siniflari</strong> destekliyorsa, hatirayi kaynagin icine yerlestirin. Desteklemiyorsa, hatira sinifindan bos bir arayuz cikartin ve baskalarinin onu kullanmasini saglayin.</li>
<li>Kaynak sinifina hatira uretmek icin bir yontem ekleyin.</li>
<li>Kaynak sinifina kaynagin durumunu geri yuklemek icin bir yontem ekleyin.</li>
<li><strong>Bakim gorevlisi</strong> kaynaktan yeni hatiralar ne zaman isteyecegini, onlari nasil depolayacagini ve kaynagin belirli bir hatira ile ne zaman geri yuklenecegini bilmelidir.</li>
</ol>

<h2 id="hatira-avantajlar-ve-dezavantajlar">Hatira: Avantajlar ve Dezavantajlar</h2>
<p><strong>Avantajlar:</strong></p>
<ul>
<li>Nesnenin durumunun anlik goruntusunu <strong>kapsullemeyi ihlal etmeden</strong> uretebilirsiniz</li>
<li>Bakim gorevlisinin kaynagin durumunun <strong>gecmisini tutmasina</strong> izin vererek kaynagin kodunu basitlestirebilirsiniz</li>
</ul>
<p><strong>Dezavantajlar:</strong></p>
<ul>
<li>Istemciler cok sik hatira olusturursa uygulama <strong>cok fazla RAM</strong> tuketebilir</li>
<li><strong>Bakim gorevlileri</strong> eskimis hatiralari yok edebilmek icin kaynagin yasam dongusunu takip etmelidir</li>
<li>Cogu dinamik programlama dili (PHP, Python, JavaScript) hatiranin icindeki durumun <strong>dokunulmadan kalacagini</strong> garanti edemez</li>
</ul>

<li>Bazen <strong>Prototip (Prototype)</strong>, Hatira icin daha basit bir alternatif olabilir. Bu, gecmiste durumunu depolamak istediginiz nesne oldukca basitse ve dis kaynaklara baglantilari yoksa ise yarar.</li>

<h2 id="gozlemci-problem">Gozlemci: Problem</h2>
<p>Iki tur nesneniz oldugunu hayal edin: bir <code>Musteri</code> ve bir <code>Magaza</code>. Musteri, yakinda magazada satisa sunulmasi gereken belirli bir urun markasityla cok ilgileniyor.</p>
<p>Musteri her gun magazayi ziyaret edip urun mevcudiyetini kontrol edebilir. Ancak urun hala yoldayken, bu gezilerin cogu <strong>anlamsiz</strong> olacaktir.</p>
<p>Ote yandan, magaza her yeni urun mevcut oldugunda tum musterilere tonlarca e-posta gonderebilir. Bu, bazi musterileri sonsuz gezilerden <strong>kurtarir</strong> ancak yeni urunlerle ilgilenmeyen <strong>diger musterileri rahatsiz eder</strong>.</p>

<p>Gozlemci deseni, yayinci sinifina bir <strong>abonelik mekanizmasi</strong> eklemenizi onerir, boylece bireysel nesneler bir olay akisina abone olabilir veya abonelikten cikabilir.</p>

<li>Aboneleri bu listeye eklemeye ve listeden cikarmaya olanak taniyan birkac <strong>genel yontem</strong></li>
<li>Aboneler listesini gezen ve onlarin belirli bildirim yontemini cagiran bir <strong>bildirim yontemi</strong></li>
</ol>
<p>Artik yayinciya onemli bir olay oldugunda, abonelerini gezer ve nesneleri uzerindeki belirli bildirim yontemini cagirir.</p>

<p>Tum abonelerin <strong>ayni arayuzu</strong> uygulamasi ve yayincinin onlarla yalnizca bu arayuz araciligiyla iletisim kurmasi cok onemlidir. Bu arayuz, yayincinin bildirimle birlikte bazi baglamsal verileri iletmek icin kullanabilecegi bir parametre kumesiyle birlikte bildirim yontemini bildirmelidir.</p>
<p>Uygulamanizda birden fazla farkli yayinci turu varsa, hepsinin ayni arayuzu izlemesini saglayabilir ve abonelerin tek bir abonelikle tumunu gozlemlemesine olanak taniyabilirsiniz.</p>

<p>Bir gazeteye veya dergiye abone olursaniz, artik bir sonraki sayinin mevcut olup olmadigini kontrol etmek icin magazaya gitmeniz gerekmez. Bunun yerine, <strong>yayinci</strong> yayinlandiktan hemen sonra yeni sayilari dogrudan posta kutunuza gonderir.</p>
<p>Yayinci bir aboneler listesi tutar ve hangi dergilere ilgi duydularini bilir. Aboneler, yayincinin kendilerine yeni dergi sayilari gondermesini durdurmak istediklerinde istedikleri zaman listeden ayrilabilirler.</p>

<h2 id="gozlemci-yapi">Gozlemci: Yapi</h2>
<p>Yapi asagidaki katilimcilardan olusur:</p>
<ol>
<li>
<p><strong>Yayinci (Publisher/Subject)</strong>: Diger nesneleri ilgilendiren olaylar yayinlar. Bu olaylar yayinci durumunu degistirdiginde veya bazi davranislari yuruttugundu meydana gelir. Yayincilar, yeni abonelerin katilmasina ve mevcut abonelerin ayrilmasina olanak taniyan bir abonelik altyapisi icerir.</p>
</li>
<li>
<p><strong>Abone Arayuzu (Subscriber Interface)</strong>: Bildirim arayuzunu bildirir. Cogu durumda, tek bir <code>update</code> yonteminden olusur. Yontem, yayincinin guncellamayle birlikte bazi olay ayrintilarini iletmesine olanak taniyan birkac parametreye sahip olabilir.</p>
</li>
</ol>

<ol start="3">

<p><strong>Somut Aboneler (Concrete Subscribers)</strong>: Yayinci tarafindan verilen bildirimlere yanit olarak bazi eylemler gerceklestirirler. Bu siniflarin tumunun ayni arayuzu uygulamasi gerekir, boylece yayinci somut siniflara baglanmaz.</p>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Event manager (subscription infrastructure)</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">EventManager</span> {
    <span class="hljs-keyword">private</span> Map&lt;String, List&lt;EventListener&gt;&gt; listeners
        = <span class="hljs-keyword">new</span> <span class="hljs-title class_">HashMap</span>&lt;&gt;();

    <span class="hljs-keyword">public</span> <span class="hljs-title function_">EventManager</span><span class="hljs-params">(String... operations)</span> {
        <span class="hljs-keyword">for</span> (String op : operations) {
            listeners.put(op, <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;&gt;());
        }
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">subscribe</span><span class="hljs-params">(String eventType,
                           EventListener listener)</span> {
        listeners.get(eventType).add(listener);
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">unsubscribe</span><span class="hljs-params">(String eventType,
                             EventListener listener)</span> {
        listeners.get(eventType).remove(listener);
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">notify</span><span class="hljs-params">(String eventType,
                       String data)</span> {
        <span class="hljs-keyword">for</span> (EventListener listener :
                listeners.get(eventType)) {
            listener.update(eventType, data);
        }
    }
}
</code></pre>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="gozlemci-uygulanabilirlik">Gozlemci: Uygulanabilirlik</h2>
<p>Gozlemci desenini su durumlarda kullanin:</p>
<ul>
<li>Bir nesnenin durumundaki degisiklikler <strong>diger nesnelerin</strong> degistirilmesini gerektirebilir ve gercek nesne kumesi <strong>onceden bilinmiyor</strong> veya dinamik olarak degisiyor.</li>
<li>Uygulamanzdaki bazi nesnelerin digerlerini gozlemlemesi gerekiyor, ancak yalnizca <strong>sinirli bir sure icin</strong> veya <strong>belirli durumlarda</strong>.</li>
<li>Yayinciyi abonelerinden <strong>ayirmaniz</strong> gerekiyor, boylece bagimsiz olarak gelistirilebilir, test edilebilir ve bakimi yapilabilir.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-11</footer>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="gozlemci-nasil-uygulanir">Gozlemci: Nasil Uygulanir</h2>
<ol>
<li>Is mantiginizi gozden gecirin ve iki parcaya ayirmayi deneyin: diger koddan bagimsiz <strong>cekirdek islevsellik</strong> (yayinci) ve geri kalan abone siniflari olarak gorev yapacak <strong>kalan kisim</strong>.</li>
<li><strong>Abone arayuzunu</strong> bildirin. En azindan, tek bir <code>update</code> yontemini bildirmelidir.</li>
<li><strong>Yayinci arayuzunu</strong> bildirin ve listeden bir abone nesnesi ekleme ve cikrma icin bir cift yontem tanimlayin.</li>
<li>Gercek abonelik listesini ve abonelik yontemlerinin uygulanmasini nereye koyacaginiza karar verin. Genellikle bu kod tum yayincilar icin ayni gorunur, bu nedenle bir <strong>soyut sinif olusturun veya bilesim kullanin</strong>.</li>
<li><strong>Somut yayinci</strong> siniflari olusturun. Yayincinin icinde onemli bir sey her oldugunda, tum abonelerini bilgilendirmelidir.</li>
<li>Somut abone siniflarinda <strong>guncelleme bildirim yontemlerini</strong> uygulayin.</li>
<li><strong>Istemci</strong> tum gerekli aboneleri olusturmali ve uygun yayincilara kaydetmelidir.</li>
</ol>

<h2 id="gozlemci-avantajlar-ve-dezavantajlar">Gozlemci: Avantajlar ve Dezavantajlar</h2>
<p><strong>Avantajlar:</strong></p>
<ul>
<li><strong>Acik/Kapali Ilkesi:</strong> Yayincinin kodunu degistirmek zorunda kalmadan yeni abone siniflari ekleyebilirsiniz (ve bir yayinci arayuzu varsa tam tersi de)</li>
<li><strong>Calisma zamaninda</strong> nesneler arasinda iliskiler kurabilirsiniz</li>
<li>Yayincilar somut abone uygulamlarindan <strong>ayrilmistir</strong></li>
</ul>
<p><strong>Dezavantajlar:</strong></p>
<ul>
<li>Aboneler <strong>rastgele sirada</strong> bilgilendirilir (garantili siralama yoktur)</li>
<li>Duzgun yonetilmezse <strong>bellek sizintilarina</strong> yol acabilir (abonelikten cikmayi unutan aboneler)</li>
</ul>

<ul>
<li><strong>Sorumluluk Zinciri, Komut, Arabulucu ve Gozlemci</strong> desenleri, gonderici ve alicilari baglamanin cesitli yollaridir:
<ul>

<li><strong>Gozlemci ve Arabulucu:</strong> Arabulucu karsilikli bagimliliklari ortadan kaldirir; Gozlemci dinamik tek yonlu baglantilar olusturur. Arabulucunun yayinci ve bilesenlerin abone olarak gorev yaptigi Gozlemci kullanilarak Arabulucu uygulanabilir.</li>
</ul>

<h2 id="durum-problem">Durum: Problem</h2>
<p>Durum deseni, <strong>Sonlu Durum Makinesi</strong> kavramiyla yakindan iliskilidir.</p>
<p>Ana fikir, herhangi bir anda, bir programin icinde bulunabilecegi <strong>sinirli sayida durum</strong> olduudur. Her benzersiz durumda, program farkli davranir ve program bir durumdan digerine <strong>aninda gecirilebilir</strong>.</p>
<p>Ancak mevcut duruma bagli olarak, program belirli diger durumlara gecebilir veya gecemeyebilir. <strong>Gecisler</strong> olarak adlandirilan bu gecis kurallari da sonlu ve onceden belirlenmistir.</p>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="durum-problem-devam">Durum: Problem (devam)</h2>
<p>Bir <code>Belge</code> sinifini hayal edin. Bir belge uc durumdan birinde olabilir: <code>Taslak</code>, <code>Denetleme</code> ve <code>Yayinlanmis</code>. Belgenin <code>yayinla</code> yontemi her durumda biraz farkli calisir:</p>
<ul>
<li><strong>Taslak</strong> durumunda, belgeyi <strong>Denetleme</strong> durumuna tasir</li>
<li><strong>Denetleme</strong> durumunda, belgeyi <strong>Yayinlanmis</strong> yapar, ancak yalnizca mevcut kullanici bir yoneticiyse</li>
<li><strong>Yayinlanmis</strong> durumunda, <strong>hicbir sey</strong> yapmaz</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-11</footer>

<h2 id="durum-problem-devam-1">Durum: Problem (devam)</h2>
<p>Kosullara dayali bir durum makinesinin en buyuk zayifligi, daha fazla durum ve duruma bagli davranislar eklemeye basladigimizda kendini gosterir. Cogu yontem, mevcut duruma gore uygun davranisi secen <strong>devasa kosullar</strong> icerecektir.</p>
<p>Boyle bir kod <strong>bakimi cok zordur</strong> cunku gecis mantisindaki herhangi bir degisiklik, her yontemdeki durum kosullarini degistirmeyi gerektirebilir. Proje gelistikce sorun buyume egilimindedir.</p>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="durum-cozum">Durum: Cozum</h2>
<p>Durum deseni, bir nesnenin tum olasi durumlari icin <strong>yeni siniflar olusturmanizi</strong> ve duruma ozgu tum davranislari bu siniflara cikarmanizi onerir.</p>
<p>Tum davranislari kendi basina uygulamak yerine, <strong>baglam (context)</strong> olarak adlandirilan orijinal nesne, mevcut durumunu temsil eden durum nesnelerinden birine bir referans depolar ve <strong>durumla ilgili tum isi</strong> o nesneye devreder.</p>
<p>Baglami baska bir duruma gecirmek icin, aktif durum nesnesini yeni durumu temsil eden baska bir nesneyle degistirin. Bu, yalnizca tum durum siniflari <strong>ayni arayuzu</strong> izlediginde ve baglaim kendisi bu nesnelerle o arayuz araciligiyla calistiginda mumkundur.</p>

<p>Durum deseninde, belirli durumlar birbirlerinin <strong>farkinda olabilir</strong> ve bir durumdan digerine gecisleri baslattabilir, oysa stratejiler neredeyse <strong>hicbir zaman</strong> birbirlerini bilmezler.</p>

<p>Akilli telefonunuzdaki dugmeler ve anahtarlar, cihazin mevcut durumuna bagli olarak farkli davranir:</p>

<li>Telefon <strong>kilit acikken</strong>, dugmelere basmak cesitli islevlerin yurutulmesine yol acar</li>

<h2 id="durum-yapi">Durum: Yapi</h2>
<p>Yapi asagidaki katilimcilardan olusur:</p>
<ol>
<li>
<p><strong>Baglam (Context)</strong>: Somut durum nesnelerinden birine referans depolar ve duruma ozgu tum isi ona devreder. Baglam, durum nesnesiyle durum arayuzu araciligiyla iletisim kurar. Baglam, yeni bir durum nesnesi iletmek icin bir setter sunar.</p>
</li>
<li>
<p><strong>Durum Arayuzu (State Interface)</strong>: Duruma ozgu yontemleri bildirir. Bu yontemler tum somut durumlar icin anlamli olmalidir cunku bazi durumlarinizin hicbir zaman cagrilmayacak gereksiz yontemere sahip olmasini istemezsiniz.</p>
</li>
</ol>

<h2 id="durum-yapi-devam">Durum: Yapi (devam)</h2>

<p><strong>Somut Durumlar (Concrete States)</strong>: Duruma ozgu yontemler icin kendi uygulamalarini saglar. Birden fazla durum arasinda benzer kodun tekrarlanmasini onlemek icin ara soyut siniflar saglayabilirsiniz.</p>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="durum-nasil-uygulanir">Durum: Nasil Uygulanir</h2>
<ol>
<li>Hangi sinifin <strong>baglam</strong> olarak gorev yapacagina karar verin. Duruma bagli koda sahip mevcut bir sinif veya yeni bir sinif olabilir.</li>
<li><strong>Durum arayuzunu</strong> bildirin. Baglamda bildirilen tum yontemleri yansitsa da, yalnizca duruma ozgu davranis icerebilecek olanlari hedefleyin.</li>
<li>Her gercek durum icin durum arayuzunden turetilen bir sinif olusturun. Baglamdaki yontemleri gozden gecirin ve <strong>o durumla ilgili tum kodu</strong> yeni olusturulan sinifa cikartin.</li>
<li>Baglam sinifinda, <strong>durum arayuzu</strong> turunde bir referans alani ve o alanin degerini gecersiz kilmaniza olanak taniyan bir genel setter ekleyin.</li>
<li>Baglamdaki yontemi tekrar gozden gecirin ve <strong>bos durum kosullarini</strong> durum nesnesinin karsilik gelen yontemlerine yapilan cagrilarla degistirin.</li>
<li>Baglamin durumunu degistirmek icin durum siniflarindan birinin bir orengini olusturun ve <strong>baglama iletin</strong>.</li>
</ol>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="durum-avantajlar-ve-dezavantajlar">Durum: Avantajlar ve Dezavantajlar</h2>
<p><strong>Avantajlar:</strong></p>
<ul>
<li><strong>Tek Sorumluluk Ilkesi:</strong> Belirli durumlarla ilgili kodu ayri siniflarda duzenleyin</li>
<li><strong>Acik/Kapali Ilkesi:</strong> Mevcut durum siniflarini veya baglami degistirmeden yeni durumlar ekleyin</li>
<li><strong>Hacimli durum makinesi kosullarini ortadan kaldirarak</strong> baglamin kodunu basitlestirin</li>
</ul>
<p><strong>Dezavantajlar:</strong></p>
<ul>
<li>Bir durum makinesinin yalnizca birkac durumu varsa veya nadiren degisiyorsa deseni uygulamak <strong>asiri</strong> olabilir</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-11</footer>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="durum-diger-desenlerle-iliskileri">Durum: Diger Desenlerle Iliskileri</h2>
<ul>
<li><strong>Kopru (Bridge), Durum, Strateji (ve bir olcude Adaptator)</strong> desenleri cok benzer yapilara sahiptir. Tumuu bilesime dayanir. Ancak hepsi farkli sorunlari cozer.</li>
<li><strong>Durum ve Strateji:</strong> Durum, Stratejinin bir uzantisi olarak dusunulebilir. Her iki desen de bilesime dayanir. Ancak Durumda, somut durumlar birbirlerinin <strong>farkinda olabilir</strong> ve gecisleri baslatabilir, oysa stratejiler <strong>tamamen bagimsizdir</strong>.</li>
<li><strong>Durum ve Sonlu Durum Makinesi:</strong> Durum, bir sinif icinde sonlu durum makineleri uygulayan buyuk switch/case ifadelerinin veya if/else zincirlerinin bir alternatifidir.</li>
</ul>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="strateji-problem">Strateji: Problem</h2>
<p>Bir gun sıradan gezginler icin bir navigasyon uygulamasi olusturmaya karar verdiniz. Uygulama, kullanicilarin herhangi bir sehirde hizla yonlerini bulmalirina yardimci olan guzel bir harita etrafinda merkezlenmisti.</p>
<p>Uygulama icin en cok talep edilen ozelliklerden biri otomatik <strong>rota planlama</strong> idi. Bir kullanici bir adres girebilmeli ve haritada o hedefe giden en hizli rotayi gorebilmelidir.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-11</footer>
</section>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="strateji-problem-devam">Strateji: Problem (devam)</h2>
<p>Uygulamanin ilk surumu yalnizca <strong>karayollari</strong> uzerinden arac yolculugu icin rotalar olusturabiliyordu. Sonra <strong>yuruyus</strong> rotalari eklediniz. Ardindan <strong>toplu tasima</strong> rotasi. Ve burada durmadi -- daha sonra <strong>bisikletciler</strong> icin rotalar eklemeyi planladiniz.</p>
<p>Is perspektifinden uygulama bir basariydi. Ancak teknik kisim cok fazla bas agrisi yaratti. Her yeni rota algoritmasi eklediginizde, navigatorun ana sinifi <strong>iki katina cikti</strong>. Bir algoritmadaki herhangi bir degisiklik tum sinifi etkileyerek, zaten calisan kodda bir hata olusturma sansini artirdi.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-11</footer>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="strateji-cozum">Strateji: Cozum</h2>
<p>Strateji deseni, belirli bir seyi bircok farkli sekilde yapan bir sinifi alip <strong>tum bu algoritmalari strateji adli ayri siniflara cikarmanizi</strong> onerir.</p>
<p><strong>Baglam (context)</strong> olarak adlandirilan orijinal sinif, stratejilerden birine referans depolamak icin bir alana sahip olmalidir. Baglam, isi kendi basina yurutmek yerine bagli strateji nesnesine devreder.</p>
<p>Baglam uygun bir algoritma secmekten sorumlu degildir. Bunun yerine <strong>istemci</strong> istenen stratejiyi baglama iletir.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-11</footer>
</section>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="strateji-cozum-devam">Strateji: Cozum (devam)</h2>
<p>Aslinda, baglam stratejiler hakkinda fazla bir sey bilmez. Tum stratejilerle ayni genel <strong>arayuz</strong> araciligiyla calisir ve yalnizca secilen stratejinin icinde kapsullenen algoritmayi tetiklemek icin tek bir yontem sunar.</p>
<p>Bu sekilde baglam somut stratejilerden bagimsiz hale gelir, boylece baglaamin veya diger stratejilerin kodunu <strong>degistirmeden</strong> yeni algoritmalar ekleyebilir veya mevcut olanlari degistirebilirsiniz.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-11</footer>
</section>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="strateji-gercek-dunya-analojisi">Strateji: Gercek Dunya Analojisi</h2>
<p>Havalimalina gitmeniz gerektigini hayal edin. Bir <strong>otobus</strong> yakalayabilir, bir <strong>taksi</strong> cagirabailir veya <strong>bisikletinize</strong> binebilirsiniz. Bunlar ulasim stratejilerinizdir.</p>
<p>Butce, zaman kisitlamalari veya kisisel tercih gibi faktorlere bagli olarak stratejilerden birini secebilirsiniz. Her strateji sizi ayni hedefe ancak farkli bir sekilde ulastirir.</p>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-11</footer>
</section>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="strateji-yapi">Strateji: Yapi</h2>
<p>Yapi asagidaki katilimcilardan olusur:</p>
<ol>
<li>
<p><strong>Baglam (Context)</strong>: Somut stratejilerden birine referans tutar ve bu nesneyle yalnizca strateji arayuzu araciligiyla iletisim kurar.</p>
</li>
<li>
<p><strong>Strateji Arayuzu (Strategy Interface)</strong>: Tum somut stratejilere ortaktir. Baglaamin bir strateji yurutmek icin kullandigi bir yontem bildirir.</p>
</li>
<li>
<p><strong>Somut Stratejiler (Concrete Strategies)</strong>: Baglaamin kullandigi bir algoritmanin farkli varyasyonlarini uygular.</p>
</li>
</ol>

<h2 id="strateji-uygulanabilirlik">Strateji: Uygulanabilirlik</h2>
<p>Strateji desenini su durumlarda kullanin:</p>
<ul>
<li>Bir nesne icinde <strong>bir algoritmanin farkli varyantlarini</strong> kullanmak ve calisma zamaninda bir algoritmadan digerine gecis yapmak istiyorsunuz.</li>
<li>Yalnizca bazi <strong>davranislari yurutme sekilleri</strong> bakimindan farklilik gosteren cok sayida benzer siniffiniz var.</li>
<li>Bir sinifin <strong>is mantisini</strong>, o mantigin baglaminda o kadar onemli olmayan algoritmalarin uygulama ayrintilarindan <strong>ayirmak</strong> istiyorsunuz.</li>
<li>Siniffinizin ayni algoritmanin farkli varyantlari arasinda gecis yapan devasa bir <strong>kosul operatoru</strong> var.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-11</footer>
</section>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="strateji-nasil-uygulanir">Strateji: Nasil Uygulanir</h2>
<ol>
<li>Baglam sinifinda, sik degisikliklere yatkin bir <strong>algoritmayi</strong> belirleyin. Ayni zamanda calisma zamaninda ayni algoritmanin bir varyantini secip yurutuken devasa bir kosul da olabilir.</li>
<li>Algoritmanin tum varyantlarina ortak <strong>strateji arayuzunu</strong> bildirin.</li>
<li>Tum algoritmalari tek tek kendi siniflatina cikarin. Hepsi <strong>strateji arayuzunu</strong> uygulamalidir.</li>
<li>Baglam sinifinda, bir strateji nesnesine referans depolamak icin bir <strong>alan</strong> ekleyin. O alanin degerlerini degistirmek icin bir setter saglayin. Baglam, strateji nesnesiyle yalnizca strateji arayuzu araciligiyla calismaalidir.</li>
<li>Baglaamin <strong>istemcileri</strong>, baglaamin birincil isini gerceklestirmesini bekledikleri sekilde eslesenn uygun bir stratejiyle iliskilendirmelidir.</li>
</ol>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="strateji-avantajlar-ve-dezavantajlar">Strateji: Avantajlar ve Dezavantajlar</h2>
<p><strong>Avantajlar:</strong></p>
<ul>
<li>Bir nesne icinde kullanilan <strong>algoritmalari</strong> calisma zamaninda degistirebilirsiniz</li>
<li>Bir algoritmanin <strong>uygulama ayrintilarini</strong> onu kullanan koddan ayirabilirsiniz</li>
<li><strong>Kalitimi bilesimle degistirebilirsiniz</strong></li>
<li><strong>Acik/Kapali Ilkesi:</strong> Baglami degistirmek zorunda kalmadan yeni stratejiler ekleyebilirsiniz</li>
</ul>
<p><strong>Dezavantajlar:</strong></p>
<ul>
<li>Yalnizca <strong>bir cift algorittmaniz</strong> varsa ve nadiren degisiyorsa, programi fazla karmasiklastirmanin gercek bir nedeni yoktur</li>
<li><strong>Istemciler</strong> uygun olanini secebilmek icin stratejiler arasindaki farklarin farkinda olmalidir</li>
<li>Bircok modern programlama dili, bir algoritmanin farkli versiyonlarini bir dizi <strong>anonim fonksiyon</strong> icinde uygulamaniza olanak taniyan fonksiyonel tur destegine sahiptir, bu da deseni bir olcude gereksiz kilar</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-11</footer>
</section>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="strateji-diger-desenlerle-iliskileri">Strateji: Diger Desenlerle Iliskileri</h2>
<ul>
<li><strong>Kopru (Bridge), Durum, Strateji (ve bir olcude Adaptator)</strong> desenleri bilesime dayali cok benzer yapilara sahiptir, ancak farkli sorunlari cozerler.</li>
<li><strong>Komut ve Strateji:</strong> Her ikisi de nesneleri parametrelendrir. Komut herhangi bir islemi bir nesneye donusturur (ertelenmmis yurutme, kuyruga alma, islem gecmisi icin). Strateji ayni seyi yapmanin farkli yollarini tanimlar ve tek bir baglam sinifi icinde algoritmalari degistirmenize olanak tanir.</li>
<li><strong>Dekorator ve Strateji:</strong> Dekorator bir nesnenin disini degistirmenize olanak tanir (dis gorunus). Strateji icini degistirmenize olanak tanir (ic davranis).</li>
<li><strong>Sablon Yontem ve Strateji:</strong> Sablon Yontem sinif duzeyinde kalitima dayanir (statik). Strateji nesne duzeyinde bilesime dayanir (dinamik, calisma zamani gecisi).</li>
<li><strong>Durum ve Strateji:</strong> Durum, Stratejinin bir uzantisi olarak dusunulebilir. Durumda, somut durumlar birbirlerinin farkinda olabilir. Stratejide, uygulamalar tamamen bagimsizdir.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-11</footer>

<h2 id="sablon-yontem-problem">Sablon Yontem: Problem</h2>
<p>Kurumsal belgeleri analiz eden bir veri madenciligi uygulamasi olusturdugununuzu hayal edin. Kullanicilar uygulamaya cesitli formatlarda (PDF, DOC, CSV) belgeler besler ve uygulama bu belgelerden tek tip bir formatta anlamli veriler cikarmaya calisir.</p>
<p>Uygulamanin ilk surumu yalnizca DOC dosyalariyla calisabiliyordu. Sonraki surumde CSV dosyalarini destekleyebildi. Bir ay sonra PDF dosyalarindan veri cikarmayi &quot;ogrettiniz&quot;.</p>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="sablon-yontem-problem-devam">Sablon Yontem: Problem (devam)</h2>
<p>Bir noktada, her uc sinifin da <strong>cok sayida benzer koda</strong> sahip oldugunu fark ettiniz. Cesitli veri formatlariyla ilgilenme kodu tum siniflarda tamamen farkliyken, veri isleme ve analiz kodu neredeyse ayniydi.</p>
<p>Algoritma yapisini bozmadan kod tekrarindan kurtulmak guzel olurdu. Ayrica bu siniflari kullanan <strong>istemci koduyla</strong> ilgili baska bir sorun daha vardi. Isleme nesnesinin sinifina bagli olarak uygun bir eylem plani secen cok sayida kosul iceriyordu.</p>

<h2 id="sablon-yontem-cozum">Sablon Yontem: Cozum</h2>
<p>Sablon Yontem deseni, bir algoritmayi bir dizi adima ayirmanizi, bu adimlari yontemlere donusturmenizi ve bu yontemlere yapilan bir dizi cagiyi tek bir <strong>sablon yontemi</strong> icine koymanizi onerir.</p>
<p>Adimlar ya <code>abstract</code> olabilir (her alt sinif kendi uygulamasini saglamalidir) ya da bir <strong>varsayilan uygulamaya</strong> sahip olabilir.</p>

<h2 id="sablon-yontem-cozum-devam">Sablon Yontem: Cozum (devam)</h2>
<p>Algoritmayil kullanmak icin istemcinin kendi alt sinifini saglamasi, tum soyut adimlari uygulamasi ve gerekirse istege bagli olanlarin bazilarin gecersiz kilmasi (ancak sablon yonteminin kendisini degil) beklenir.</p>
<p><strong>Kancalar (hooks)</strong> adinda baska bir adim turu daha vardir. Bir kanca, bos bir govdeye sahip istege bagli bir adimdir. Bir sablon yontemi, bir kanca gecersiz kilinmasa bile calisir. Genellikle kancalar, algoritmalarin kritik adimlarindan once ve sonra yerlestirilir ve alt siniflara ek genisletme noktalari saglar.</p>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="sablon-yontem-gercek-dunya-analojisi">Sablon Yontem: Gercek Dunya Analojisi</h2>
<p>Sablon yontemi yaklasimi <strong>toplu konut insaatinda</strong> kullanilabilir. Standart bir ev insa etmek icin mimari plan, potansiyel ev sahibinin ortaya cikan evin bazi ayrintilarin ayarlamasina olanak taniyan birkac genisletme noktasi icerebilir.</p>
<p>Temel atma, iskelet olusturma, duvar insa etme, sihhi tesisat ve elektrik tesisati kurma gibi her insaat adimi, ortaya cikan evi digerlerinden biraz farkli kilmak icin hafifce degistirilebilir. Ancak genel yapi ve insaat sirasi ayni kalir.</p>

<h2 id="sablon-yontem-yapi">Sablon Yontem: Yapi</h2>
<p>Yapi asagidaki katilimcilardan olusur:</p>
<ol>
<li>
<p><strong>Soyut Sinif (Abstract Class)</strong>: Bir algoritmanin adimlari olarak gorev yapan yontemleri ve bu yontemleri belirli bir sirada cagiran gercek sablon yontemini bildirir. Adimlar ya <code>abstract</code> olarak bildirilebilir ya da bir varsayilan uygulamaya sahip olabilir.</p>
</li>
<li>
<p><strong>Somut Siniflar (Concrete Classes)</strong>: Tum adimlari gecersiz kilabilir, ancak <strong>sablon yonteminin kendisini degil</strong>. Somut siniflar soyut adimlar icin uygulamalar saglar ve istege bagli olarak varsayilan uygulamalari olan bazi adimlari gecersiz kilabilir.</p>
</li>
</ol>

    <span class="hljs-comment">// Default implementation steps</span>
    <span class="hljs-keyword">void</span> <span class="hljs-title function_">parseData</span><span class="hljs-params">()</span> {
