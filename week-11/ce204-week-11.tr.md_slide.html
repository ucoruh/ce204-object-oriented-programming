    }

    <span class="hljs-keyword">void</span> <span class="hljs-title function_">analyzeData</span><span class="hljs-params">()</span> {
        System.out.println(<span class="hljs-string">&quot;Analyzing data&quot;</span>
            + <span class="hljs-string">&quot; for patterns...&quot;</span>);
    }

    <span class="hljs-comment">// Hook - optional step with</span>
    <span class="hljs-comment">// default (empty) body</span>
    <span class="hljs-keyword">void</span> <span class="hljs-title function_">sendReport</span><span class="hljs-params">()</span> {
        <span class="hljs-comment">// Subclasses may override this</span>
    }
}

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="sablon-yontem-uygulanabilirlik">Sablon Yontem: Uygulanabilirlik</h2>
<p>Sablon Yontem desenini su durumlarda kullanin:</p>
<ul>
<li>Istemcilerin yalnizca bir algoritmanin <strong>belirli adimlarini</strong> genisletmesine izin vermek istiyorsunuz, tum algoritmayi veya yapisini degil.</li>
<li><strong>Neredeyse ayni algoritmalara</strong> sahip birkac sinififiniz var ve yalnizca kucuk farkliliklar gosteriyor. Algoritma degistiginde tum siniflari degistirmeniz gerekebilir.</li>
<li>Ortak davranisi bir ust sinifa cekerek <strong>kod tekrarini ortadan kaldirmak</strong> istiyorsunuz.</li>
</ul>
<footer><img src="assets/2021-10-19-15-01-36-image.png" alt="" style="height:50px;" /> RTEU CEN206 Hafta-11</footer>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="sablon-yontem-nasil-uygulanir">Sablon Yontem: Nasil Uygulanir</h2>
<ol>
<li>Hedef algoritmayi adimlara ayirip ayiramayacaginizi gormek icin <strong>analiz edin</strong>. Hangi adimlarin tum alt siniflar icin ortak oldugunu ve hangilerinin her zaman benzersiz olacagini dusunun.</li>
<li><strong>Soyut temel sinif</strong> olusturun ve sablon yontemini ve algoritmanin adimlarini temsil eden bir dizi soyut yontem bildirin. Karsilik gelen adimlari yuruterek sablon yonteminde algoritmanin yapisini ana hatlariyla belirtin. Alt siniflarin onu gecersiz kilmasini onlemek icin sablon yontemini <code>final</code> yapmay dusunun.</li>
<li>Tum adimlarin soyut olmasi sorun degildir. Ancak bazi adimlar bir <strong>varsayilan uygulamaya</strong> sahip olmaktan fayda gorebilir. Alt siniflar bu yontemleri uygulamak zorunda degildir.</li>
<li>Algoritmanin kritik adimlari arasina <strong>kancalar</strong> eklemeyi dusunun.</li>
<li>Algoritmanin her varyasyonu icin yeni bir <strong>somut alt sinif</strong> olusturun. Tum soyut adimlari uygulamalidir, ancak istege bagli olanlarin bazilarin da gecersiz kilabilir.</li>
</ol>

<header>CEN206 Nesne Yonelimli Programlama</header>
<h2 id="sablon-yontem-avantajlar-ve-dezavantajlar">Sablon Yontem: Avantajlar ve Dezavantajlar</h2>
<p><strong>Avantajlar:</strong></p>
<ul>
<li>Istemcilerin buyuk bir algoritmanin yalnizca <strong>belirli kisimlarini gecersiz kilmasina</strong> izin vererek, diger kisimlarda meydana gelen degisikliklerden daha az etkilenmelerini saglayabilirsiniz</li>
<li><strong>Tekrar eden kodu</strong> bir ust sinifa cekebilirsiniz</li>
</ul>
<p><strong>Dezavantajlar:</strong></p>
<ul>
<li>Bazi istemciler bir algoritmanin <strong>saglanan iskeleti</strong> tarafindan sinirlanabilir</li>
<li>Bir alt sinif araciligiyla varsayilan adim uygulamasini bastirar <strong>Liskov Ikame Ilkesini</strong> ihlal edebilirsiniz</li>
<li>Sablon yontemleri ne kadar fazla adima sahip olursa <strong>bakimi o kadar zorlasma</strong> egilimindedir</li>
</ul>

<h2 id="sablon-yontem-diger-desenlerle-iliskileri">Sablon Yontem: Diger Desenlerle Iliskileri</h2>
<ul>
<li><strong>Fabrika Yontemi (Factory Method)</strong> Sablon Yontemin bir uzmanlasmasidir. Ayni zamanda, bir Fabrika Yontemi buyuk bir Sablon Yontem icinde bir adim olarak gorev yapabilir.</li>
<li><strong>Sablon Yontem ve Strateji:</strong> Sablon Yontem <strong>kalitima</strong> dayanir: alt siniflarda bu parcalari genisleterek bir algoritmanin parcalarini degistirmenize olanak tanir. Strateji <strong>bilesime</strong> dayanir: nesneye farkli stratejiler saglayarak nesnenin davranisinin parcalarini degistirebilirsiniz. Sablon Yontem sinif duzeyinde calisir, bu nedenle statiktir. Strateji nesne duzeyinde calisir ve calisma zamaninda davranislari degistirmenize olanak tanir.</li>
</ul>

<h2 id="ziyaretci-problem">Ziyaretci: Problem</h2>
<p>Ekibinizin devasa bir grafik olarak yapilahdirilmis cografi bilgilerle calisan bir uygulama gelistirdigini hayal edin. Grafigin her dugumu bir sehir, bir sanayi bolgesi, bir turistik mekan vb. gibi karmasik bir varlik temsil edebilir.</p>
<p>Bir noktada, <strong>grafigi XML formatina disari aktarmayi</strong> uygulama gorevi aldiniz. Is oldukca basit gorunuyordu. Her dugum sinifina bir disari aktarma yontemi eklemeyi planladiniz.</p>

<h2 id="ziyaretci-problem-devam">Ziyaretci: Problem (devam)</h2>
<p>Ancak sistem mimari, mevcut dugum siniflarini degistirmenize izin vermeyi reddetti. Kodun zaten uretimde oldugunu ve degisikliklerinizdeki potansiyel bir hata nedeniyle onu bozma riskini almak isteedigini soyledi.</p>
<p>Ayrica, <strong>XML disari aktarma kodunun dugum siniflarinin icinde</strong> olmasinin mantikli olup olmadigini sorguladi. Bu siniflarin birincil isi cografi verilerle calismakti. XML disari aktarma davranisi orada yabanci gorunurdu.</p>
<p>Reddin bir baska nedeni daha vardi. Bu ozellik uygulandiktan sonra pazarlamadan birinin sizden farkli bir formata disari aktarma veya baska garip seyler saglamamanizi isteyecegi cok olasiydi ve bu degerli dugum siniflarinda surekli degisikliklere yol acacakti.</p>

<h2 id="ziyaretci-cozum-devam">Ziyaretci: Cozum (devam)</h2>
<p>Simdi davranis farkli siniflarin nesneleri uzerinde yurutulebilir. Ziyaretci sinifi, her biri farkli turlerde arguman alan bir dizi yontem tanimlayabilir:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>visitor.visit(city)
visitor.visit(industry)
visitor.visit(sightseeing)
</code></pre>
<p>Ancak ozellikle tum grafikle ugrasirken bu yontemleri tam olarak nasil cagiririz? Bu yontemler <strong>farkli imzalara</strong> sahiptir, bu nedenle polimorfizmi dogrudan kullanamaziz.</p>

<h2 id="ziyaretci-cozum----cift-dagitim">Ziyaretci: Cozum -- Cift Dagitim</h2>
<p>Ziyaretci deseni, <strong>Cift Dagitim (Double Dispatch)</strong> adli bir teknik kullanir. Istemcinin cagrilacak yontemin uygun surumunu secmesine izin vermek yerine, bu secimi ziyaretciye arguman olarak ilettigimiz nesnelere devrediyoruz:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Each element &quot;accepts&quot; the visitor</span>
<span class="hljs-comment">// and calls the appropriate visitor method</span>
foreach (Node node : graph)
    node.accept(exportVisitor)

<span class="hljs-comment">// Inside each concrete element:</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">City</span> {
    <span class="hljs-keyword">void</span> <span class="hljs-title function_">accept</span><span class="hljs-params">(Visitor v)</span> {
        v.visitCity(<span class="hljs-built_in">this</span>);
    }
}
</code></pre>
<p>Nesne kendi sinifini bildigi icin, ziyaretci uzerinde uygun yontemi kendisi secebilir.</p>

<h2 id="ziyaretci-gercek-dunya-analojisi">Ziyaretci: Gercek Dunya Analojisi</h2>
<p>Yeni musteriler edinmeye hevesli deneyimli bir <strong>sigorta acentsini</strong> hayal edin. Bir mahalledeki her binayi ziyaret edebilir ve karsilastigi herkese sigorta satmaya calisabilir:</p>
<ul>
<li>Bir <strong>konut binasina</strong>, saglik sigortasi satar</li>
<li>Bir <strong>bankaya</strong>, hirsizlik sigortasi satar</li>
<li>Bir <strong>kahve dukkani</strong>, yangin ve sel sigortasi satar</li>
</ul>
<p>Acente ziyaretciyi, binalar ise elemanlari temsil eder. Acente satis konusmasini (algoritma) ziyaret ettigi bina turune (eleman) gore uyarlar.</p>

<h2 id="ziyaretci-yapi">Ziyaretci: Yapi</h2>
<p>Yapi asagidaki katilimcilardan olusur:</p>
<ol>
<li>
<p><strong>Ziyaretci Arayuzu (Visitor Interface)</strong>: Bir nesne yapisinin somut elemanlarini arguman olarak alabilen bir dizi ziyaret yontemi bildirir. Bu yontemler, dil asiri yuklemeyi destekliyorsa ayni adlara sahip olabilir, ancak parametre turleri farkli olmalidir.</p>
</li>
<li>
<p><strong>Somut Ziyaretciler (Concrete Visitors)</strong>: Farkli somut eleman siniflari icin uyarlanmis ayni davranislarin birkac versiyonunu uygular.</p>
</li>
</ol>

<h2 id="ziyaretci-yapi-devam">Ziyaretci: Yapi (devam)</h2>
<ol start="3">
<li>
<p><strong>Eleman Arayuzu (Element Interface)</strong>: Ziyaretcileri &quot;kabul etmek&quot; icin bir yontem bildirir. Bu yontem, ziyaretci arayuzu turuyle bildirilen bir parametreye sahip olmalidir.</p>
</li>
<li>
<p><strong>Somut Elemanlar (Concrete Elements)</strong>: Kabul yontemini uygulamalidir. Bu yontemin amaci, cagiyi mevcut eleman sinifina karsilik gelen uygun ziyaretcinin yontemine yonlendirmektir.</p>
</li>
<li>
<p><strong>Istemci (Client)</strong>: Genellikle bir koleksiyonu veya baska bir karmasik nesneyi temsil eder. Istemci, ziyaretci nesneleri olusturur ve bunlari <code>accept</code> yontemi araciligiyla elemanlara iletir.</p>
</li>
</ol>

<h2 id="ziyaretci-uygulanabilirlik">Ziyaretci: Uygulanabilirlik</h2>
<p>Ziyaretci desenini su durumlarda kullanin:</p>
<ul>
<li><strong>Farkli siniflara</strong> sahip bir <strong>karmasik nesne yapisinin</strong> (ornegin bir nesne agaci) tum elemanlari uzerinde bir islem gerceklestirmeniz gerekiyor.</li>
<li>Yardimci davranislarin <strong>is mantisini temizlemek</strong> istiyorsunuz. Desen, uygulamanizin birincil siniflarini tum diger davranislari bir dizi ziyaretci sinifina cikararak ana islerine daha fazla odaklanmalarini saglar.</li>
<li>Bir davranis yalnizca bir sinif hiyerarsisinin bazi siniflarinda mantikli, <strong>digelerinde degil</strong>. Bu davranisi ayri bir ziyaretci sinifina cikarabilir ve yalnizca ilgili siniflarin nesnelerini kabul eden ziyaret yontemlerini uygulayabilir, geri kalanlari bos birakabilirsiniz.</li>
</ul>

<ol>
<li>Programda var olan her somut eleman sinifi icin bir dizi &quot;ziyaret&quot; yontemiyle <strong>ziyaretci arayuzunu</strong> bildirin.</li>
<li><strong>Eleman arayuzunu</strong> bildirin. Mevcut bir eleman sinif hiyerarsiniz varsa, hiyerarsinin temel sinifina soyut &quot;kabul&quot; yontemini ekleyin.</li>
<li>Tum somut eleman siniflarinda <strong>kabul yontemlerini</strong> uygulayin. Bu yontemler, mevcut eleman sinifiyla eslesen gelen ziyaretci nesnesindeki bir ziyaret yontemine cagiyi yalnizca yonlendirmelidir.</li>
<li>Eleman siniflari ziyaretcilerle yalnizca ziyaretci arayuzu araciligiyla calismalindir. Ancak ziyaretciler, ziyaret yontemlerinin parametre turleri olarak referans alinan <strong>tum somut eleman siniflarinin farkinda</strong> olmalidir.</li>
</ol>

<h2 id="ziyaretci-cift-dagitim-aciklamasi">Ziyaretci: Cift Dagitim Aciklamasi</h2>
<p>Ziyaretci deseni <strong>cift dagitim</strong> sorununu cozer:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Without Visitor - type checking needed:</span>
<span class="hljs-keyword">for</span> (Shape s : shapes) {
    <span class="hljs-keyword">if</span> (s <span class="hljs-keyword">instanceof</span> Dot)
        exportDot((Dot) s);
    <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (s <span class="hljs-keyword">instanceof</span> Circle)
        exportCircle((Circle) s);
    <span class="hljs-comment">// ... fragile, violates OCP</span>
}

<span class="hljs-comment">// With Visitor - double dispatch:</span>
<span class="hljs-keyword">for</span> (Shape s : shapes) {
    s.accept(visitor);
    <span class="hljs-comment">// 1st dispatch: s.accept() resolves</span>
    <span class="hljs-comment">//   to the correct accept() based on s type</span>
    <span class="hljs-comment">// 2nd dispatch: accept() calls correct</span>
    <span class="hljs-comment">//   visit*() based on visitor type</span>
}
</code></pre>
<p>Eleman kendi sinifini bilir, bu nedenle ziyaretci uzerinde uygun yontemi secer. Tur kontrolune gerek yoktur.</p>
